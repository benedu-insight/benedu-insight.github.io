<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" preserveAspectRatio="xMidYMid meet">
    <!-- Background -->
    <rect width="1200" height="630" fill="#FFFFFF"/>

    <!-- Subtle background ornaments (brand glow) -->
    <circle cx="1120" cy="80" r="420" fill="#7030A0" opacity="0.06"/>
    <circle cx="80" cy="600" r="420" fill="#0F8C50" opacity="0.06"/>

    <!-- Right: brand mark · large green ring -->
    <g transform="translate(960, 315)">
        <circle cx="0" cy="0" r="158" fill="none" stroke="#0F8C50" stroke-width="22" stroke-linecap="round"/>
        <!-- Subtle inner soft fill -->
        <circle cx="0" cy="0" r="146" fill="#E5F4EC" opacity="0.55"/>
    </g>

    <!-- Left content block -->
    <g transform="translate(80, 178)">
        <!-- Eyebrow chip -->
        <g>
            <rect x="0" y="0" width="430" height="38" rx="19" fill="#F0E6F6"/>
            <circle cx="20" cy="19" r="4" fill="#7030A0"/>
            <text x="34" y="25" font-family="'Pretendard Variable', 'Pretendard', '-apple-system', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#7030A0" letter-spacing="2.2">PLASMA SCHOOL · SEMICONDUCTOR &amp; RF</text>
        </g>

        <!-- Main heading (Korean) -->
        <text x="0" y="120" font-family="'Pretendard Variable', 'Pretendard', '-apple-system', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="72" font-weight="800" fill="#2D2D2D" letter-spacing="-2.5">베네듀 인사이트</text>

        <!-- English wordmark -->
        <text x="0" y="178" font-family="'Pretendard Variable', 'Pretendard', '-apple-system', sans-serif" font-size="40" font-weight="600" fill="#7030A0" letter-spacing="-1">Benedu Insight</text>

        <!-- Korean tagline -->
        <text x="0" y="252" font-family="'Pretendard Variable', 'Pretendard', '-apple-system', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="30" font-weight="600" fill="#2D2D2D" letter-spacing="-0.5">비어 있는 자리에 통찰을 남긴다.</text>

        <!-- Sub-tagline -->
        <text x="0" y="298" font-family="'Pretendard Variable', 'Pretendard', '-apple-system', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="400" fill="#6B7280">20년 이상의 현장 데이터로 전달하는 플라즈마 · RF 전문 교육</text>

        <!-- Stats line -->
        <g transform="translate(0, 360)">
            <text x="0" y="0" font-family="'Pretendard Variable', 'Pretendard', sans-serif" font-size="40" font-weight="800" fill="#2D2D2D">20<tspan fill="#7030A0">+</tspan></text>
            <text x="0" y="22" font-family="'Pretendard Variable', 'Pretendard', sans-serif" font-size="13" font-weight="500" fill="#9CA3AF" letter-spacing="0.5">YEARS</text>

            <text x="120" y="0" font-family="'Pretendard Variable', 'Pretendard', sans-serif" font-size="40" font-weight="800" fill="#2D2D2D">120<tspan fill="#0F8C50">+</tspan></text>
            <text x="120" y="22" font-family="'Pretendard Variable', 'Pretendard', sans-serif" font-size="13" font-weight="500" fill="#9CA3AF" letter-spacing="0.5">LECTURES</text>

            <text x="270" y="0" font-family="'Pretendard Variable', 'Pretendard', sans-serif" font-size="40" font-weight="800" fill="#2D2D2D">2<tspan fill="#7030A0">×</tspan></text>
            <text x="270" y="22" font-family="'Pretendard Variable', 'Pretendard', sans-serif" font-size="13" font-weight="500" fill="#9CA3AF" letter-spacing="0.5">CLASSES</text>
        </g>
    </g>

    <!-- Brand stripe at bottom -->
    <rect x="0" y="624" width="600" height="6" fill="#0F8C50"/>
    <rect x="600" y="624" width="600" height="6" fill="#7030A0"/>
</svg>
