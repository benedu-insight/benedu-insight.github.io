    <style>
        :root {
            --bg: #F7F8FA;
            --card: #FFFFFF;
            --text: #2D2D2D;
            --text-muted: #6B7280;
            --text-subtle: #9CA3AF;
            --border: #E5E7EB;
            --border-subtle: #F3F4F6;
            --brand-purple: #7030A0;
            --brand-purple-deep: #5C2685;
            --brand-purple-soft: #F0E6F6;
            --brand-green: #0F8C50;
            --brand-green-soft: #E5F4EC;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        body {
            font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui,
                         'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
            background: linear-gradient(180deg, #F7F8FA 0%, #FFFFFF 60%, #F7F8FA 100%);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* ── Card ── */
        .card {
            width: 100%;
            max-width: 440px;
            background: var(--card);
            box-shadow:
                0 30px 60px -25px rgba(112, 48, 160, 0.18),
                0 12px 24px -12px rgba(0, 0, 0, 0.08);
            border-radius: 0;
            margin: 20px 14px;
            overflow: hidden;
            position: relative;
        }

        .brand-stripe-top {
            height: 5px;
            background: linear-gradient(90deg, var(--brand-green) 0%, var(--brand-green) 50%, var(--brand-purple) 50%, var(--brand-purple) 100%);
        }

        /* ── Hero ── */
        .hero {
            padding: 38px 28px 22px;
            text-align: center;
            position: relative;
            background:
                radial-gradient(120% 80% at 100% 0%, rgba(112, 48, 160, 0.07), transparent 60%),
                radial-gradient(120% 80% at 0% 100%, rgba(15, 140, 80, 0.07), transparent 60%);
        }
        .brand-stage {
            width: 124px;
            height: 124px;
            margin: 0 auto 18px;
            position: relative;
        }
        .brand-stage svg { width: 100%; height: 100%; overflow: visible; }

        @keyframes drawCircle { from { stroke-dashoffset: 1005; } to { stroke-dashoffset: 0; } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .brand-circle {
            fill: none; stroke: var(--brand-green); stroke-width: 22; stroke-linecap: round;
            stroke-dasharray: 1005; stroke-dashoffset: 1005;
            transform: rotate(-90deg); transform-origin: center;
            animation: drawCircle 1.8s cubic-bezier(0.65, 0, 0.35, 1) 0.3s forwards;
        }

        .wordmark {
            font-size: 19px; font-weight: 700; letter-spacing: -0.025em;
            color: var(--brand-purple);
            opacity: 0;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.7s forwards;
        }
        .eyebrow {
            display: inline-flex; align-items: center; gap: 7px;
            margin-top: 12px;
            background: var(--brand-purple-soft);
            color: var(--brand-purple);
            font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
            padding: 7px 14px; border-radius: 999px;
            opacity: 0;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.85s forwards;
        }
        .eyebrow::before {
            content: ""; width: 6px; height: 6px; border-radius: 50%;
            background: var(--brand-purple);
        }

        /* ── Identity ── */
        .identity {
            padding: 4px 28px 24px;
            text-align: center;
        }
        .name-kr {
            font-size: 34px; font-weight: 800; letter-spacing: -0.035em;
            color: var(--text);
            margin-top: 16px;
            opacity: 0;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 2.0s forwards;
        }
        .name-en {
            font-size: 14px; color: var(--text-muted); letter-spacing: -0.005em;
            margin-top: 4px;
            opacity: 0;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 2.1s forwards;
        }
        .title {
            font-size: 14px; font-weight: 600; color: var(--brand-purple);
            margin-top: 14px; letter-spacing: -0.005em;
            opacity: 0;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 2.2s forwards;
        }
        .tagline {
            margin-top: 18px; padding: 14px 18px;
            background: var(--brand-green-soft);
            border: 1px solid #CBEADD;
            border-radius: 16px;
            font-size: 14px; line-height: 1.55; color: var(--text);
            opacity: 0;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 2.3s forwards;
        }
        .tagline strong { color: var(--brand-green); font-weight: 700; }

        /* ── Quick action grid ── */
        .actions {
            padding: 0 18px 18px;
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
        }
        .action {
            display: flex; flex-direction: column; align-items: center; gap: 7px;
            padding: 16px 4px;
            border-radius: 18px;
            background: var(--bg);
            color: var(--text);
            text-decoration: none;
            border: none; cursor: pointer; font-family: inherit;
            font-size: 11.5px; font-weight: 600; letter-spacing: -0.005em;
            transition: transform 0.15s ease, background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .action:active { transform: scale(0.96); background: var(--brand-purple-soft); color: var(--brand-purple); }
        .action:hover { background: var(--brand-purple-soft); color: var(--brand-purple); box-shadow: 0 4px 12px -4px rgba(112, 48, 160, 0.18); }
        .action svg { width: 22px; height: 22px; color: var(--brand-purple); transition: color 0.2s; }
        .action:hover svg, .action:active svg { color: var(--brand-purple-deep); }

        /* ── Detail rows ── */
        .details {
            padding: 4px 28px;
            margin-bottom: 8px;
        }
        .detail {
            display: flex; align-items: flex-start; gap: 14px;
            padding: 14px 0;
            border-bottom: 1px solid var(--border-subtle);
            color: var(--text);
            text-decoration: none;
            transition: color 0.2s;
        }
        .detail:last-child { border-bottom: none; }
        .detail:hover .detail-value { color: var(--brand-purple); }
        .detail-icon {
            width: 18px; height: 18px;
            color: var(--brand-green);
            flex-shrink: 0;
            margin-top: 3px;
        }
        .detail-body { flex: 1; min-width: 0; }
        .detail-label {
            font-size: 10.5px; color: var(--text-subtle);
            font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
            margin-bottom: 2px;
        }
        .detail-value {
            font-size: 14.5px; line-height: 1.45;
            color: var(--text);
            word-break: break-all;
            transition: color 0.2s;
        }

        /* ── Save / Share ── */
        .footer-actions {
            padding: 14px 20px 22px;
            display: flex; gap: 8px;
        }
        .btn {
            flex: 1;
            padding: 14px 12px;
            border-radius: 999px;
            font-size: 14px; font-weight: 600; font-family: inherit;
            border: none;
            cursor: pointer;
            text-align: center;
            display: inline-flex; align-items: center; justify-content: center; gap: 7px;
            transition: transform 0.1s ease, background 0.2s ease, box-shadow 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .btn svg { width: 16px; height: 16px; }
        .btn-primary {
            background: var(--brand-purple); color: white;
            box-shadow: 0 6px 16px -6px rgba(112, 48, 160, 0.45);
        }
        .btn-primary:hover { background: var(--brand-purple-deep); }
        .btn-primary:active { transform: scale(0.98); background: #4A1F6B; }
        .btn-secondary {
            background: var(--card); color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover { border-color: var(--brand-purple); color: var(--brand-purple); }
        .btn-secondary:active { transform: scale(0.98); }

        .brand-stripe-bottom {
            height: 4px;
            background: linear-gradient(90deg, var(--brand-purple) 0%, var(--brand-purple) 50%, var(--brand-green) 50%, var(--brand-green) 100%);
        }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: max(28px, calc(env(safe-area-inset-bottom) + 16px));
            left: 50%;
            transform: translate(-50%, 120px);
            background: rgba(45, 45, 45, 0.96);
            color: white;
            padding: 12px 22px;
            border-radius: 999px;
            font-size: 13.5px; font-weight: 500;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.20);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s;
            opacity: 0;
            white-space: nowrap;
        }
        .toast.show { transform: translate(-50%, 0); opacity: 1; }

        /* ── Responsive tweaks ── */
        @media (max-width: 360px) {
            .actions { grid-template-columns: repeat(2, 1fr); }
            .name-kr { font-size: 30px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            .brand-circle { stroke-dashoffset: 0; }
        }

        ::selection { background: var(--brand-purple-soft); color: var(--brand-purple); }
    </style>
</head>

    <script>
        // ── vCard 3.0 (Korean + English combined, UTF-8) ──
        const vcard = [
            'BEGIN:VCARD',
            'VERSION:3.0',
            'N:변;태준;;;',
            'FN:변태준 (Ben)',
            'ORG:베네듀 인사이트 (Benedu Insight)',
            'TITLE:대표강사 / Principal Consultant',
            'TEL;TYPE=CELL,VOICE:+82-10-2376-3891',
            'EMAIL;TYPE=INTERNET:benedu.insight@gmail.com',
            'URL:https://benedu-insight.github.io/',
            'ADR;TYPE=WORK:;;경기도 오산시 오산로 132번길 10\\, 207-1104;오산시;경기도;18143;대한민국',
            'NOTE:반도체 플라즈마 공정 및 RF 전력전송 전문 교육·컨설팅. 20년 이상의 현장 경험.',
            'END:VCARD'
        ].join('\r\n');

        // ── Toast ──
        const toast = document.getElementById('toast');
        let toastTimer;
        function showToast(msg) {
            clearTimeout(toastTimer);
            toast.textContent = msg;
            toast.classList.add('show');
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
        }

        // ── Save (vCard download) ──
        document.getElementById('saveBtn').addEventListener('click', () => {
            try {
                // BOM prefix for better Korean encoding compatibility on some platforms
                const blob = new Blob(['﻿' + vcard], { type: 'text/vcard;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'benedu-insight-ben.vcf';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 1500);
                showToast('연락처 카드를 다운로드했습니다 ✓');
            } catch (e) {
                showToast('다운로드 실패. 다시 시도해 주세요.');
            }
        });

        // ── Share (Web Share API + clipboard fallback) ──
        document.getElementById('shareBtn').addEventListener('click', async () => {
            const data = {
                title: '변태준 · 베네듀 인사이트 대표강사',
                text: '반도체 플라즈마 공정 및 RF 전력전송 전문 교육·컨설팅',
                url: window.location.href
            };
            try {
                if (navigator.share) {
                    await navigator.share(data);
                } else if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(data.url);
                    showToast('링크를 복사했습니다 ✓');
                } else {
                    // Last resort
                    prompt('아래 링크를 복사하여 공유하세요:', data.url);
                }
            } catch (err) {
                if (err && err.name !== 'AbortError') {
                    showToast('공유에 실패했습니다.');
                }
            }
        });

    </script>

</body>
