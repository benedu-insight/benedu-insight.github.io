<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#7030A0">
    <meta name="color-scheme" content="light">
    <title>변태준 · 베네듀 인사이트 대표강사</title>

    <!-- Open Graph -->
    <meta property="og:type" content="profile">
    <meta property="og:title" content="변태준 · 베네듀 인사이트 대표강사">
    <meta property="og:description" content="반도체 플라즈마 공정 및 RF 전력전송 전문 교육·컨설팅. 20년 이상의 현장 경험.">
    <meta property="og:image" content="https://benedu-insight.github.io/img/og_image_namecard.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:url" content="https://benedu-insight.github.io/card.html">
    <meta property="og:locale" content="ko_KR">
    <meta property="og:site_name" content="베네듀 인사이트">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://benedu-insight.github.io/logo_png/benedu_insight_Symbol.png">

    <!-- ① 폰트: Gowun Batang (한글) + Varela Round (영문) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Varela+Round&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #F7F8FA;
            --card: #FFFFFF;
            --text: #2D2D2D;
            --text-muted: #6B7280;
            --text-subtle: #9CA3AF;
            --border: #E5E7EB;
            --border-subtle: #F3F4F6;
            --brand-purple: #7030A0;
            --brand-purple-deep: #5C2685;
            --brand-purple-soft: #F0E6F6;
            --brand-green: #0F8C50;
            --brand-green-soft: #E5F4EC;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

        /* ② 폰트 적용: 한글 Gowun Batang, 영문 Varela Round */
        body {
            font-family: 'Gowun Batang', serif;
            background: linear-gradient(180deg, #F7F8FA 0%, #FFFFFF 60%, #F7F8FA 100%);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* 영문 전용 클래스 */
        .en {
            font-family: 'Varela Round', sans-serif;
        }

        /* ── Card ── */
        .card {
            width: 100%;
            max-width: 440px;
            background: var(--card);
            box-shadow:
                0 30px 60px -25px rgba(112, 48, 160, 0.18),
                0 12px 24px -12px rgba(0, 0, 0, 0.08);
            border-radius: 0;
            margin: 20px 14px;
            overflow: hidden;
            position: relative;
        }

        .brand-stripe-top {
            height: 5px;
            background: linear-gradient(90deg, var(--brand-green) 50%, var(--brand-purple) 50%);
        }

        /* ── Hero ── */
        .hero {
            padding: 38px 28px 22px;
            text-align: center;
            position: relative;
            background:
                radial-gradient(120% 80% at 100% 0%, rgba(112, 48, 160, 0.07), transparent 60%),
                radial-gradient(120% 80% at 0% 100%, rgba(15, 140, 80, 0.07), transparent 60%);
        }

        /* ① 로고 이미지 */
        .logo-img {
            width: 110px;
            height: auto;
            margin: 0 auto 18px;
            display: block;
            opacity: 0;
            animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
        }

        .eyebrow {
            display: inline-flex; align-items: center; gap: 7px;
            margin-top: 4px;
            background: var(--brand-purple-soft);
            color: var(--brand-purple);
            font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
            padding: 7px 14px; border-radius: 999px;
            font-family: 'Varela Round', sans-serif;
            opacity: 0;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.0s forwards;
        }
        .eyebrow::before {
            content: ""; width: 6px; height: 6px; border-radius: 50%;
            background: var(--brand-purple);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        /* ── Identity ── */
        .identity {
            padding: 4px 28px 24px;
            text-align: center;
        }
        .name-kr {
            font-family: 'Gowun Batang', serif;
            font-size: 34px; font-weight: 700; letter-spacing: 0.08em;
            color: var(--text);
            margin-top: 16px;
            opacity: 0;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.15s forwards;
        }
        .name-en {
            font-family: 'Varela Round', sans-serif;
            font-size: 14px; color: var(--text-muted); letter-spacing: 0.01em;
            margin-top: 5px;
            opacity: 0;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.25s forwards;
        }
        .title {
            font-family: 'Gowun Batang', serif;
            font-size: 14px; font-weight: 700; color: var(--brand-purple);
            margin-top: 14px; letter-spacing: 0.04em;
            opacity: 0;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.35s forwards;
        }
        .tagline {
            margin-top: 18px; padding: 14px 18px;
            background: var(--brand-green-soft);
            border: 1px solid #CBEADD;
            border-radius: 16px;
            font-family: 'Gowun Batang', serif;
            font-size: 14px; line-height: 1.6; color: var(--text);
            opacity: 0;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.45s forwards;
        }
        .tagline strong { color: var(--brand-green); font-weight: 700; }

        /* ── Quick action grid ── */
        .actions {
            padding: 0 18px 18px;
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
        }
        .action {
            display: flex; flex-direction: column; align-items: center; gap: 7px;
            padding: 16px 4px;
            border-radius: 18px;
            background: var(--bg);
            color: var(--text);
            text-decoration: none;
            border: none; cursor: pointer;
            font-family: 'Gowun Batang', serif;
            font-size: 11.5px; font-weight: 700; letter-spacing: 0.02em;
            transition: transform 0.15s ease, background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .action:active { transform: scale(0.96); background: var(--brand-purple-soft); color: var(--brand-purple); }
        .action:hover  { background: var(--brand-purple-soft); color: var(--brand-purple); box-shadow: 0 4px 12px -4px rgba(112, 48, 160, 0.18); }
        .action svg { width: 22px; height: 22px; color: var(--brand-purple); transition: color 0.2s; }
        .action:hover svg, .action:active svg { color: var(--brand-purple-deep); }

        /* ── Detail rows ── */
        .details {
            padding: 4px 28px;
            margin-bottom: 8px;
        }
        .detail {
            display: flex; align-items: flex-start; gap: 14px;
            padding: 14px 0;
            border-bottom: 1px solid var(--border-subtle);
            color: var(--text);
            text-decoration: none;
            transition: color 0.2s;
        }
        .detail:last-child { border-bottom: none; }
        .detail:hover .detail-value { color: var(--brand-purple); }
        .detail-icon {
            width: 18px; height: 18px;
            color: var(--brand-green);
            flex-shrink: 0;
            margin-top: 3px;
        }
        .detail-body { flex: 1; min-width: 0; }
        .detail-label {
            font-family: 'Varela Round', sans-serif;
            font-size: 10.5px; color: var(--text-subtle);
            font-weight: 400; letter-spacing: 0.14em; text-transform: uppercase;
            margin-bottom: 2px;
        }
        .detail-value {
            font-family: 'Varela Round', sans-serif;
            font-size: 14.5px; line-height: 1.45;
            color: var(--text);
            word-break: break-all;
            transition: color 0.2s;
        }

        /* ④ 저장·공유: 아이콘만 (텍스트 없음) */
        .footer-actions {
            padding: 14px 20px 22px;
            display: flex; gap: 10px; justify-content: center;
        }
        .btn-icon {
            width: 52px; height: 52px;
            border-radius: 50%;
            border: none; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center;
            transition: transform 0.1s ease, background 0.2s ease, box-shadow 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-icon svg { width: 22px; height: 22px; }
        .btn-icon:active { transform: scale(0.94); }

        .btn-save {
            background: var(--brand-purple); color: white;
            box-shadow: 0 6px 16px -6px rgba(112, 48, 160, 0.45);
        }
        .btn-save:hover { background: var(--brand-purple-deep); box-shadow: 0 8px 20px -6px rgba(112, 48, 160, 0.55); }

        .btn-share {
            background: var(--card); color: var(--text);
            border: 1.5px solid var(--border);
        }
        .btn-share:hover { border-color: var(--brand-purple); color: var(--brand-purple); }

        /* 아이콘 툴팁 (접근성) */
        .btn-icon-wrap {
            display: flex; flex-direction: column; align-items: center; gap: 6px;
        }
        .btn-label {
            font-family: 'Gowun Batang', serif;
            font-size: 10.5px; color: var(--text-muted); letter-spacing: 0.03em;
        }

        .brand-stripe-bottom {
            height: 4px;
            background: linear-gradient(90deg, var(--brand-purple) 50%, var(--brand-green) 50%);
        }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: max(28px, calc(env(safe-area-inset-bottom) + 16px));
            left: 50%;
            transform: translate(-50%, 120px);
            background: rgba(45, 45, 45, 0.96);
            color: white;
            padding: 12px 22px;
            border-radius: 999px;
            font-family: 'Gowun Batang', serif;
            font-size: 13.5px; font-weight: 400;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.20);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s;
            opacity: 0;
            white-space: nowrap;
        }
        .toast.show { transform: translate(-50%, 0); opacity: 1; }

        @media (max-width: 360px) {
            .actions { grid-template-columns: repeat(2, 1fr); }
            .name-kr { font-size: 30px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            .logo-img { opacity: 1; }
        }

        ::selection { background: var(--brand-purple-soft); color: var(--brand-purple); }
    </style>
</head>
<body>

    <main class="card" role="main" aria-label="베네듀 인사이트 디지털 명함">

        <div class="brand-stripe-top" aria-hidden="true"></div>

        <!-- ── Quick action grid ── -->
        <nav class="actions" aria-label="빠른 연락">
            <a class="action" href="tel:01023763891" aria-label="전화 걸기">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>

                문자
            </a>
            <a class="action" href="mailto:benedu.insight@gmail.com" aria-label="이메일 보내기">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                메일
            </a>
            <a class="action" href="https://benedu-insight.github.io/" target="_blank" rel="noopener" aria-label="웹사이트 방문">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                웹사이트
            </a>
        </nav>

        <!-- ── Detail rows (③ Address 삭제) ── -->
        <section class="details" aria-label="연락처">
            <a class="detail" href="tel:01023763891">
                <svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                <div class="detail-body">
                    <div class="detail-label">Mobile</div>

            </a>
            <a class="detail" href="mailto:benedu.insight@gmail.com">
                <svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>

        <!-- ④ 저장·공유: 아이콘만 -->

                <button class="btn-icon btn-save" id="saveBtn" type="button" aria-label="연락처에 저장">

        <div class="brand-stripe-bottom" aria-hidden="true"></div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
        // vCard 3.0 (③ 주소 제거)
        const vcard = [
            'BEGIN:VCARD',
            'VERSION:3.0',
            'N:변;태준;;;',
            'FN:변태준 (Ben)',
            'ORG:베네듀 인사이트 (Benedu Insight)',
            'TITLE:대표강사 / Principal Consultant',
            'TEL;TYPE=CELL,VOICE:+82-10-2376-3891',
            'EMAIL;TYPE=INTERNET:benedu.insight@gmail.com',
            'URL:https://benedu-insight.github.io/',
            'NOTE:반도체 플라즈마 공정 및 RF 전력전송 전문 교육·컨설팅. 20년 이상의 현장 경험.',
            'END:VCARD'
        ].join('\r\n');

        // Toast
        const toast = document.getElementById('toast');
        let toastTimer;
        function showToast(msg) {
            clearTimeout(toastTimer);
            toast.textContent = msg;
            toast.classList.add('show');
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
        }

        // 저장
        document.getElementById('saveBtn').addEventListener('click', () => {
            try {
                const blob = new Blob(['\uFEFF' + vcard], { type: 'text/vcard;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = 'benedu-insight-ben.vcf';
                document.body.appendChild(a); a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 1500);
                showToast('연락처 카드를 다운로드했습니다 ✓');
            } catch (e) { showToast('다운로드 실패. 다시 시도해 주세요.'); }
        });

        // 공유
        document.getElementById('shareBtn').addEventListener('click', async () => {
            const data = {
                title: '변태준 · 베네듀 인사이트 대표강사',
                text: '반도체 플라즈마 공정 및 RF 전력전송 전문 교육·컨설팅',
                url: window.location.href
            };
            try {
                if (navigator.share) {
                    await navigator.share(data);
                } else if (navigator.clipboard?.writeText) {
                    await navigator.clipboard.writeText(data.url);
                    showToast('링크를 복사했습니다 ✓');
                } else {
                    prompt('아래 링크를 복사하여 공유하세요:', data.url);
                }
            } catch (err) {
                if (err?.name !== 'AbortError') showToast('공유에 실패했습니다.');
            }
        });
    </script>
