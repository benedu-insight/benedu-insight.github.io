<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Benedu Insight — 오답노트</title>
  <link rel="icon" type="image/png"
    href="https://raw.githubusercontent.com/benedu-insight/benedu-insight.github.io/refs/heads/main/logo_png/benedu_insight_Symbol.png">
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --green:      #0F8C50;
      --green-lt:   #E6F4ED;
      --green-dk:   #0A6B3C;
      --purple:     #7030A0;
      --purple-lt:  #F0E8F8;
      --purple-mid: #9B59D0;
      --bg:         #F7F9FC;
      --card:       #FFFFFF;
      --text:       #1A1A2E;
      --text-sub:   #5A6070;
      --border:     #E2E8F0;
      --danger:     #D94412;
      --danger-lt:  #FEF0EC;
      --radius:     16px;
      --radius-sm:  10px;
      --shadow:     0 2px 16px rgba(15,140,80,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Google Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; }

    /* ── HEADER ── */
    .header {
      width: 100%; background: var(--card);
      border-bottom: 1.5px solid var(--border);
      padding: 14px 20px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      position: sticky; top: 0; z-index: 100;
    }
    .logo-wrap { display: flex; align-items: center; gap: 10px; }
    .logo-img { height: 26px; }
    .logo-fallback { display: none; align-items: center; gap: 8px; }
    .lang-toggle { display: flex; background: var(--bg); border-radius: 20px; padding: 3px; gap: 2px; }
    .lang-btn { border: none; cursor: pointer; border-radius: 16px; padding: 4px 12px;
      font-family: 'Google Sans', sans-serif; font-size: 12px; font-weight: 500;
      background: transparent; color: var(--text-sub); transition: all 0.2s; }
    .lang-btn.active { background: var(--green); color: #fff; }

    /* ── SCREENS ── */
    .screen { display: none; width: 100%; max-width: 520px; padding: 24px 16px 60px; flex-direction: column; gap: 16px; }
    .screen.active { display: flex; }

    /* ── CARD ── */
    .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px 20px; }
    .card-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .card-sub   { font-size: 13px; color: var(--text-sub); margin-bottom: 18px; line-height: 1.5; }

    /* ── FORM ── */
    .form-label { font-size: 11px; font-weight: 600; color: var(--green-dk); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; display: block; }
    .form-input { width: 100%; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      padding: 13px 14px; font-family: 'Google Sans', sans-serif; font-size: 15px;
      color: var(--text); background: var(--bg); outline: none; margin-bottom: 14px; transition: border-color 0.2s; }
    .form-input:focus { border-color: var(--green); background: #fff; }
    .form-input.pin { font-family: 'JetBrains Mono', monospace; letter-spacing: 4px; font-size: 20px; text-align: center; }
    .err-box { background: var(--danger-lt); border: 1px solid var(--danger); border-radius: var(--radius-sm);
      padding: 10px 14px; font-size: 13px; color: var(--danger); display: none; margin-bottom: 12px; }
    .err-box.show { display: block; }

    /* ── BUTTONS ── */
    .btn { width: 100%; border: none; cursor: pointer; border-radius: var(--radius-sm);
      padding: 14px 20px; font-family: 'Google Sans', sans-serif; font-size: 15px; font-weight: 600;
      transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-primary { background: var(--green); color: #fff; }
    .btn-primary:hover { background: var(--green-dk); }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { background: #CBD5E0; cursor: not-allowed; }
    .btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text-sub); margin-top: 8px; }

    /* ── SCORE SUMMARY ── */
    .score-circle {
      width: 110px; height: 110px; border-radius: 50%;
      background: conic-gradient(var(--green) 0deg, var(--green) var(--pct), var(--border) var(--pct));
      display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;
    }
    .score-inner { width: 84px; height: 84px; border-radius: 50%; background: var(--card);
      display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .score-num { font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 600; color: var(--green); line-height: 1; }
    .score-lbl { font-size: 11px; color: var(--text-sub); }

    .summary-chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 4px; }
    .chip { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 6px 12px; font-size: 12px; color: var(--text-sub); }
    .chip strong { color: var(--text); font-family: 'JetBrains Mono', monospace; }

    /* ── FILTER TABS ── */
    .filter-tabs { display: flex; gap: 6px; margin-bottom: 4px; }
    .ftab { flex: 1; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      padding: 8px 10px; font-size: 13px; font-weight: 600; cursor: pointer;
      background: var(--bg); color: var(--text-sub); transition: all 0.2s; text-align: center; }
    .ftab.active { background: var(--purple); color: #fff; border-color: var(--purple); }

    /* ── QUESTION REVIEW CARD ── */
    .q-review {
      border-radius: var(--radius-sm); padding: 14px 16px; margin-bottom: 10px;
      border: 1.5px solid var(--border);
    }
    .q-review.correct { border-color: var(--green); background: var(--green-lt); }
    .q-review.wrong   { border-color: var(--danger); background: var(--danger-lt); }
    .q-review.short-q { border-color: var(--purple); background: var(--purple-lt); }

    .q-review-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .q-num { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; flex-shrink: 0; }
    .correct .q-num { background: var(--green); color: #fff; }
    .wrong   .q-num { background: var(--danger); color: #fff; }
    .short-q .q-num { background: var(--purple); color: #fff; }
    .q-icon { margin-left: auto; font-size: 15px; }

    .q-body { font-size: 14px; font-weight: 500; color: var(--text); line-height: 1.55; margin-bottom: 10px; }

    .ans-row { display: flex; gap: 7px; align-items: flex-start; margin-bottom: 5px; font-size: 13px; }
    .ans-badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 8px; flex-shrink: 0; margin-top: 2px; }
    .ans-badge.my      { background: var(--danger-lt); color: var(--danger); border: 1px solid var(--danger); }
    .ans-badge.correct-b { background: var(--green-lt); color: var(--green-dk); border: 1px solid var(--green); }
    .ans-badge.short-b { background: var(--purple-lt); color: var(--purple); border: 1px solid var(--purple); }
    .ans-text { color: var(--text); line-height: 1.45; }

    /* explanation box */
    .explanation {
      margin-top: 10px; padding: 10px 12px;
      background: rgba(255,255,255,0.6);
      border-radius: var(--radius-sm);
      font-size: 12px; color: var(--text-sub); line-height: 1.55;
      border-left: 3px solid var(--green);
    }
    .explanation-label { font-size: 10px; font-weight: 700; color: var(--green-dk); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 3px; }

    /* ── LOADING ── */
    .loading-overlay { position: fixed; inset: 0; background: rgba(247,249,252,0.92);
      display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; z-index: 999; }
    .loading-overlay.show { display: flex; }
    .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--green);
      border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 14px; color: var(--text-sub); }

    /* ── EMPTY ── */
    .empty-state { text-align: center; padding: 32px 16px; color: var(--text-sub); font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>

  <!-- LOADING -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">조회 중...</div>
  </div>

  <!-- HEADER -->
  <header class="header">
    <div></div>
    <div class="logo-wrap" style="justify-content:center;">
      <img class="logo-img"
        src="https://github.com/benedu-insight/benedu-insight.github.io/blob/main/logo_png/benedu_insight_logo_EN_horizontal.png?raw=true"
        alt="Benedu Insight"
        onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='flex';">
      <div class="logo-fallback" id="logoFallback">
        <svg width="26" height="26" viewBox="0 0 34 34" fill="none">
          <circle cx="17" cy="17" r="15" stroke="#0F8C50" stroke-width="3.5" fill="none"/>
        </svg>
        <div>
          <span style="color:#7030A0;font-size:14px;font-weight:700;">bene</span>
          <span style="color:#7030A0;font-size:14px;font-weight:400;">du</span>
          <div style="color:#7030A0;font-size:10px;line-height:1;">insight</div>
        </div>
      </div>
    </div>
    <div style="display:flex;justify-content:flex-end;">
      <div class="lang-toggle">
        <button class="lang-btn active" id="btnEN" onclick="setLang('en')">EN</button>
        <button class="lang-btn" id="btnKO" onclick="setLang('ko')">한국어</button>
      </div>
    </div>
  </header>

  <!-- ══ SCREEN 1: LOGIN ══ -->
  <div class="screen active" id="screenLogin">
    <div class="card" style="text-align:center; padding-top:28px;">
      <div style="font-size:32px; margin-bottom:8px;">📋</div>
      <div class="card-title" id="loginTitle">My Exam Results</div>
      <div class="card-sub" id="loginSub">Enter your name and PIN to view your results and review wrong answers.</div>
    </div>
    <div class="card">
      <label class="form-label" id="labelName">Full Name</label>
      <input type="text" class="form-input" id="inputName" autocomplete="off" placeholder="홍길동">

      <label class="form-label" id="labelPin">4-digit PIN</label>
      <input type="password" class="form-input pin" id="inputPin" maxlength="4" inputmode="numeric" placeholder="••••">

      <div class="err-box" id="loginErr"></div>
      <button class="btn btn-primary" id="btnLogin" onclick="doLogin()">
        <span id="loginBtnText">View My Results</span>
      </button>
    </div>
  </div>

  <!-- ══ SCREEN 2: REVIEW ══ -->
  <div class="screen" id="screenReview">

    <!-- Score summary -->
    <div class="card" style="text-align:center; padding: 24px 20px 20px;">
      <div style="font-size:13px; color:var(--text-sub); margin-bottom:12px;" id="reviewExamTitle"></div>
      <div class="score-circle" id="scoreCircle" style="--pct:0deg;">
        <div class="score-inner">
          <div class="score-num" id="scoreNum">0</div>
          <div class="score-lbl" id="scoreLbl">score</div>
        </div>
      </div>
      <div style="font-size:16px; font-weight:700; margin-bottom:12px;" id="reviewName"></div>
      <div class="summary-chips">
        <div class="chip" id="chipCorrect"></div>
        <div class="chip" id="chipWrong"></div>
        <div class="chip" id="chipTime"></div>
      </div>
    </div>

    <!-- Filter tabs -->
    <div class="filter-tabs">
      <div class="ftab active" id="tabAll" onclick="setFilter('all')" id="tabAll">
        <span id="tabAllText">All</span>
      </div>
      <div class="ftab" id="tabWrong" onclick="setFilter('wrong')">
        <span id="tabWrongText">Wrong Only</span>
      </div>
    </div>

    <!-- Questions -->
    <div id="qReviewList"></div>

    <!-- Back button -->
    <button class="btn btn-outline" onclick="goBack()">
      ← <span id="backText">Back to Login</span>
    </button>

  </div>

  <!-- ══ FIREBASE SDK ══ -->
  <script type="module">
    import { initializeApp }   from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, getDoc, collection, query, where, getDocs }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getAuth, signInAnonymously }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey:            "AIzaSyBdY3O5gi124THZSd1VC24oiz18OWdHjSQ",
      authDomain:        "benedu-exam.firebaseapp.com",
      projectId:         "benedu-exam",
      storageBucket:     "benedu-exam.firebasestorage.app",
      messagingSenderId: "825024127174",
      appId:             "1:825024127174:web:fc6e6cef1e70f47376f7c7"
    };
    const app  = initializeApp(firebaseConfig);
    const db   = getFirestore(app);
    const auth = getAuth(app);

    /* ── i18n ── */
    const T = {
      en: {
        loginTitle:   "My Exam Results",
        loginSub:     "Enter your name and PIN to view your results and review wrong answers.",
        labelName:    "Full Name",
        labelPin:     "4-digit PIN",
        loginBtnText: "View My Results",
        errName:      "Please enter your name.",
        errPin:       "PIN must be 4 digits.",
        errPinWrong:  "Incorrect PIN. Please try again.",
        errNoResult:  "No results found. Please complete the exam first.",
        errNotFound:  "Name not found. Please check your name.",
        loading:      "Loading results...",
        scoreLbl:     "score",
        chipCorrect:  "Correct",
        chipWrong:    "Wrong",
        chipTime:     "Time",
        tabAll:       "All Questions",
        tabWrong:     "Wrong Only",
        correctIcon:  "✅ Correct",
        wrongIcon:    "❌ Wrong",
        shortLabel:   "Short Answer",
        myAns:        "My Answer",
        correctAns:   "Correct Answer",
        myResponse:   "My Response",
        noAnswer:     "No answer",
        explanationLabel: "EXPLANATION",
        backText:     "Back to Login",
        noWrong:      "🎉 All correct! Great job!",
      },
      ko: {
        loginTitle:   "내 시험 결과",
        loginSub:     "이름과 PIN을 입력하여 결과 및 오답노트를 확인하세요.",
        labelName:    "이름",
        labelPin:     "4자리 PIN",
        loginBtnText: "결과 확인하기",
        errName:      "이름을 입력해 주세요.",
        errPin:       "4자리 PIN을 입력해 주세요.",
        errPinWrong:  "PIN이 올바르지 않습니다. 다시 확인해 주세요.",
        errNoResult:  "시험 결과가 없습니다. 시험을 먼저 완료해 주세요.",
        errNotFound:  "이름을 찾을 수 없습니다. 다시 확인해 주세요.",
        loading:      "결과 조회 중...",
        scoreLbl:     "점수",
        chipCorrect:  "정답",
        chipWrong:    "오답",
        chipTime:     "소요시간",
        tabAll:       "전체 문제",
        tabWrong:     "오답만 보기",
        correctIcon:  "✅ 정답",
        wrongIcon:    "❌ 오답",
        shortLabel:   "주관식",
        myAns:        "내 답",
        correctAns:   "정답",
        myResponse:   "내 답변",
        noAnswer:     "미입력",
        explanationLabel: "해설",
        backText:     "로그인으로 돌아가기",
        noWrong:      "🎉 모두 정답! 훌륭합니다!",
      }
    };

    /* ── State ── */
    let lang       = 'en';
    let resultData = null;
    let questions  = [];
    let filterMode = 'all';

    /* ── Expose globals ── */
    window.setLang   = setLang;
    window.doLogin   = doLogin;
    window.setFilter = setFilter;
    window.goBack    = goBack;

    /* ── i18n ── */
    function setLang(l) {
      lang = l;
      document.getElementById('btnEN').classList.toggle('active', l === 'en');
      document.getElementById('btnKO').classList.toggle('active', l === 'ko');
      document.documentElement.lang = l;
      const s = (id, v) => { const el = document.getElementById(id); if (el) el.innerHTML = v; };
      const tx = T[l];
      s('loginTitle',   tx.loginTitle);
      s('loginSub',     tx.loginSub);
      s('labelName',    tx.labelName);
      s('labelPin',     tx.labelPin);
      s('loginBtnText', tx.loginBtnText);
      s('scoreLbl',     tx.scoreLbl);
      s('tabAllText',   tx.tabAll);
      s('tabWrongText', tx.tabWrong);
      s('backText',     tx.backText);
      if (resultData) renderReview();
    }

    /* ── Helpers ── */
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }
    function showLoading(msg) {
      document.getElementById('loadingText').textContent = msg;
      document.getElementById('loadingOverlay').classList.add('show');
    }
    function hideLoading() { document.getElementById('loadingOverlay').classList.remove('show'); }
    function showErr(id, msg) { const el = document.getElementById(id); el.textContent = msg; el.classList.add('show'); }
    function hideErr(id)      { document.getElementById(id).classList.remove('show'); }
    function fmt2(n) { return String(n).padStart(2,'0'); }
    function fmtTime(sec) { return `${fmt2(Math.floor(sec/60))}:${fmt2(sec%60)}`; }

    async function hashPin(pin) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pin));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    }

    /* ── LOGIN ── */
    async function doLogin() {
      hideErr('loginErr');
      const name = document.getElementById('inputName').value.trim();
      const pin  = document.getElementById('inputPin').value.trim();
      const tx   = T[lang];

      if (!name)                          { showErr('loginErr', tx.errName); return; }
      if (pin.length !== 4 || isNaN(pin)) { showErr('loginErr', tx.errPin);  return; }

      showLoading(tx.loading);
      document.getElementById('btnLogin').disabled = true;

      try {
        await signInAnonymously(auth);
        const pinHash = await hashPin(pin);

        /* 1. users 컬렉션에서 이름으로 사용자 찾기 */
        const usersSnap = await getDocs(collection(db, 'users'));
        const userDoc = usersSnap.docs.find(d => d.data().name === name);

        if (!userDoc) { throw new Error('NOT_FOUND'); }
        if (userDoc.data().pinHash !== pinHash) { throw new Error('PIN_WRONG'); }

        const uid = userDoc.id;

        /* 2. results 에서 해당 uid의 최신 결과 찾기 (examId 동적 조회) */
        // activeSession에서 현재 examId 가져오기
        const sessionSnap = await getDoc(doc(db, 'activeSession', 'current'));
        const examId = sessionSnap.exists() ? (sessionSnap.data().examId || 'exam_001') : 'exam_001';

        const resultSnap = await getDoc(doc(db, 'results', `${examId}_${uid}`));
        if (!resultSnap.exists()) { throw new Error('NO_RESULT'); }
        resultData = resultSnap.data();

        /* 3. questions 로드 */
        const examSnap = await getDoc(doc(db, 'exams', examId));
        const qIds = examSnap.data().questionIds || [];
        const qSnaps = await Promise.all(qIds.map(qid => getDoc(doc(db, 'questions', qid))));
        questions = qSnaps.filter(s => s.exists()).map(s => ({ id: s.id, ...s.data() }));

        hideLoading();
        renderSummary();
        renderReview();
        showScreen('screenReview');

      } catch(e) {
        hideLoading();
        document.getElementById('btnLogin').disabled = false;
        const tx = T[lang];
        if      (e.message === 'NOT_FOUND')  showErr('loginErr', tx.errNotFound);
        else if (e.message === 'PIN_WRONG')  showErr('loginErr', tx.errPinWrong);
        else if (e.message === 'NO_RESULT')  showErr('loginErr', tx.errNoResult);
        else showErr('loginErr', e.message);
      }
    }

    /* ── SUMMARY ── */
    function renderSummary() {
      const tx  = T[lang];
      const r   = resultData;
      const pct = r.score !== null ? r.score : 0;
      const deg = Math.round(pct * 3.6);

      document.getElementById('scoreCircle').style.setProperty('--pct', `${deg}deg`);
      document.getElementById('scoreNum').textContent = r.score !== null ? r.score : '—';
      document.getElementById('scoreLbl').textContent = tx.scoreLbl;
      document.getElementById('reviewName').textContent = r.name || '';
      document.getElementById('reviewExamTitle').textContent = r.examTitle || r.examId || '';

      const wrongCount   = r.totalMcq - r.correctMcq;
      document.getElementById('chipCorrect').innerHTML = `${tx.chipCorrect}: <strong>${r.correctMcq}</strong>`;
      document.getElementById('chipWrong').innerHTML   = `${tx.chipWrong}: <strong>${wrongCount}</strong>`;
      document.getElementById('chipTime').innerHTML    = `${tx.chipTime}: <strong>${r.duration ? fmtTime(r.duration) : '—'}</strong>`;
    }

    /* ── FILTER ── */
    function setFilter(mode) {
      filterMode = mode;
      document.getElementById('tabAll').classList.toggle('active',   mode === 'all');
      document.getElementById('tabWrong').classList.toggle('active', mode === 'wrong');
      renderReview();
    }

    /* ── RENDER REVIEW ── */
    function renderReview() {
      const tx      = T[lang];
      const letters = ['①','②','③','④','⑤'];
      const r       = resultData;
      const list    = document.getElementById('qReviewList');

      let filtered = questions;
      if (filterMode === 'wrong') {
        filtered = questions.filter(q => {
          if (q.type === 'short') return false;
          return r.answers[q.id] !== String(q.answerIdx ?? q.aswerIdx);
        });
      }

      if (filtered.length === 0) {
        list.innerHTML = `<div class="empty-state">${tx.noWrong}</div>`;
        return;
      }

      list.innerHTML = filtered.map(q => {
        const qNum    = questions.indexOf(q) + 1;
        const userAns = r.answers ? r.answers[q.id] : undefined;
        const corrIdx = q.answerIdx !== undefined ? q.answerIdx : q.aswerIdx;

        /* 주관식 */
        if (q.type === 'short') {
          return `<div class="q-review short-q">
            <div class="q-review-head">
              <span class="q-num">Q${qNum}</span>
              <span style="font-size:11px;font-weight:600;color:var(--purple);">${tx.shortLabel}</span>
            </div>
            <div class="q-body">${q.body}</div>
            <div class="ans-row">
              <span class="ans-badge short-b">${tx.myResponse}</span>
              <span class="ans-text">${userAns || tx.noAnswer}</span>
            </div>
            ${q.explanation ? `<div class="explanation"><div class="explanation-label">${tx.explanationLabel}</div>${q.explanation}</div>` : ''}
          </div>`;
        }

        /* 객관식 */
        const isCorrect = userAns === String(corrIdx);
        const rowClass  = isCorrect ? 'correct' : 'wrong';
        const icon      = isCorrect ? tx.correctIcon : tx.wrongIcon;
        const userIdx   = userAns !== undefined ? parseInt(userAns) : -1;
        const userText  = userIdx >= 0 && q.choices ? `${letters[userIdx]} ${q.choices[userIdx]}` : tx.noAnswer;
        const corrText  = corrIdx !== undefined && q.choices ? `${letters[corrIdx]} ${q.choices[corrIdx]}` : '—';

        return `<div class="q-review ${rowClass}">
          <div class="q-review-head">
            <span class="q-num">Q${qNum}</span>
            <span class="q-icon">${icon}</span>
          </div>
          <div class="q-body">${q.body}</div>
          ${!isCorrect ? `
          <div class="ans-row" style="margin-bottom:4px;">
            <span class="ans-badge my">${tx.myAns}</span>
            <span class="ans-text">${userText}</span>
          </div>
          <div class="ans-row">
            <span class="ans-badge correct-b">${tx.correctAns}</span>
            <span class="ans-text">${corrText}</span>
          </div>` : `
          <div class="ans-row">
            <span class="ans-badge correct-b">${tx.correctAns}</span>
            <span class="ans-text">${corrText}</span>
          </div>`}
          ${q.explanation ? `<div class="explanation"><div class="explanation-label">${tx.explanationLabel}</div>${q.explanation}</div>` : ''}
        </div>`;
      }).join('');
    }

    /* ── BACK ── */
    function goBack() {
      resultData = null; questions = []; filterMode = 'all';
      document.getElementById('inputPin').value = '';
      document.getElementById('btnLogin').disabled = false;
      showScreen('screenLogin');
    }

    /* ── INIT ── */
    setLang('en');

    document.getElementById('inputPin').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });
  </script>
</body>
</html>
