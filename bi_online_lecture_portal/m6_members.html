<head>

<style>
  :root{
    --font-en:'Google Sans','Segoe UI',system-ui,sans-serif;
    --font-ko:'Google Sans', 'Gowun Batang','Georgia',serif;
    --font-mono:'JetBrains Mono',monospace;
    --font-body: var(--font-en);
    --cream:#FAF9F5; --surface:#EFE9DE; --card:#FFFFFF;
    --ink:#252320; --steel:#6C6A64; --steel-soft:#A09D96; --hairline:#E6DFD8;
    --ink-black:#181715; --coral:#CC785C; --coral-tint:#F5E4DD;
    --purple:#7030A0; --lavender:#F0E6F6; --green:#0F8C50; --green-tint:#E5F4EC;
    --radius-card:14px; --radius-pill:9999px; --ease:cubic-bezier(0.4,0,0.2,1);
    --topbar:60px;
  }
  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{ font-family:var(--font-body); background:var(--cream); color:var(--ink); -webkit-font-smoothing:antialiased; }
  body.lang-ko{ --font-body: var(--font-ko); word-break:keep-all; }
  /* English words / numbers inside Korean text stay in Google Sans */
  body.lang-ko .en, body.lang-ko code, body.lang-ko .mono{ font-family:var(--font-en); }
  ::selection{ background:var(--coral-tint); }
  button{ font-family:inherit; cursor:pointer; }
  :focus-visible{ outline:2.5px solid var(--coral); outline-offset:2px; }

  /* ── Top bar ── */
  .topbar{ position:sticky; top:0; z-index:50; height:var(--topbar); display:flex; align-items:center; gap:14px;
    padding:0 22px; background:rgba(250,249,245,.94); backdrop-filter:blur(8px); border-bottom:1px solid var(--hairline); }
  .topbar img{ height:28px; width:auto; display:block; }
  .topbar .div{ width:1px; height:22px; background:var(--hairline); }
  .tb-title{ font-family:var(--font-en); font-size:.86rem; font-weight:700; color:var(--ink); }
  .tb-sub{ font-family:var(--font-mono); font-size:.58rem; color:var(--steel-soft); letter-spacing:.1em; text-transform:uppercase; }
  .tb-right{ margin-left:auto; display:flex; align-items:center; gap:10px; }
  .member-pill{ font-family:var(--font-mono); font-size:.6rem; font-weight:600; letter-spacing:.08em;
    background:var(--ink-black); color:#fff; padding:4px 10px; border-radius:var(--radius-pill); }
  .user-box{ display:none; align-items:center; gap:8px; font-family:var(--font-en); font-size:.74rem; color:var(--steel); }
  .user-box.show{ display:flex; }
  .btn-ghost{ border:1px solid var(--hairline); background:var(--card); color:var(--ink); border-radius:var(--radius-pill);
    padding:6px 13px; font-family:var(--font-en); font-size:.74rem; font-weight:600; transition:all .15s var(--ease); white-space:nowrap; }
  .btn-ghost:hover{ border-color:var(--coral); color:var(--coral); }
  .lang-toggle{ display:flex; border:1px solid var(--hairline); border-radius:var(--radius-pill); overflow:hidden; background:var(--card); }
  .lang-toggle button{ border:none; background:transparent; padding:5px 12px; font-family:var(--font-mono); font-size:.66rem; color:var(--steel); }
  .lang-toggle button.active{ background:var(--ink-black); color:#fff; }

  .wrap{ max-width:1180px; margin:0 auto; padding:38px 26px 60px; }
  .eyebrow{ font-family:var(--font-mono); font-size:.66rem; letter-spacing:.14em; color:var(--coral); text-transform:uppercase; font-weight:600; }
  h1{ font-size:2rem; line-height:1.25; margin:10px 0 12px; font-weight:800; letter-spacing:-.01em; }
  body.lang-ko h1{ font-weight:700; }
  .lead{ font-size:1rem; line-height:1.8; color:var(--steel); max-width:760px; }

  /* ── Gate (not signed in) ── */
  #gate{ display:none; }
  #gate.show{ display:block; }
  .gate-grid{ display:grid; grid-template-columns:1.15fr .85fr; gap:24px; margin-top:28px; align-items:start; }
  .notice{ background:var(--card); border:1px solid var(--hairline); border-radius:var(--radius-card); padding:28px; }
  .notice .lock{ width:44px; height:44px; border-radius:12px; background:var(--coral-tint); display:flex; align-items:center; justify-content:center; margin-bottom:16px; }
  .notice .lock svg{ width:22px; height:22px; fill:var(--coral); }
  .notice h2{ font-size:1.15rem; margin-bottom:10px; }
  .notice p{ font-size:.93rem; line-height:1.85; color:var(--steel); }
  .notice .mail{ display:inline-flex; align-items:center; gap:8px; margin-top:18px; text-decoration:none;
    background:var(--ink-black); color:#fff; padding:10px 18px; border-radius:var(--radius-pill); font-family:var(--font-en); font-size:.84rem; font-weight:600; }
  .notice .mail:hover{ background:var(--coral); }
  .notice ul{ margin:16px 0 0 18px; color:var(--steel); font-size:.88rem; line-height:1.9; }
  .login{ background:var(--card); border:1px solid var(--hairline); border-radius:var(--radius-card); padding:26px; }
  .login h2{ font-size:1.05rem; margin-bottom:4px; }
  .login .sub{ font-size:.82rem; color:var(--steel); margin-bottom:18px; line-height:1.6; }
  .field{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .field label{ font-family:var(--font-mono); font-size:.62rem; letter-spacing:.1em; text-transform:uppercase; color:var(--steel); }
  .field input{ border:1px solid var(--hairline); border-radius:10px; padding:11px 13px; font-family:var(--font-en); font-size:.92rem; background:var(--cream); color:var(--ink); }
  .field input:focus{ outline:none; border-color:var(--coral); background:#fff; }
  .id-wrap{ display:flex; align-items:stretch; }
  .id-wrap input{ flex:1; min-width:0; border-radius:10px 0 0 10px; }
  .id-suffix{ display:flex; align-items:center; padding:0 12px; border:1px solid var(--hairline); border-left:none;
    border-radius:0 10px 10px 0; background:var(--surface); color:var(--steel); font-family:var(--font-en); font-size:.86rem; white-space:nowrap; }
  .id-suffix{ display:none !important; }
  .id-wrap input{ border-radius:10px !important; }
  .id-wrap.full input{ border-radius:10px; }
  .btn-primary{ width:100%; border:none; border-radius:10px; padding:12px; background:var(--coral); color:#fff; font-family:var(--font-en); font-size:.9rem; font-weight:700; transition:background .15s; }
  .btn-primary:hover{ background:#b8664c; }
  .btn-primary:disabled{ background:var(--steel-soft); cursor:wait; }
  .link-btn{ border:none; background:none; color:var(--steel); font-size:.78rem; text-decoration:underline; margin-top:12px; }
  .msg{ font-size:.82rem; line-height:1.55; margin-top:12px; padding:9px 12px; border-radius:9px; display:none; }
  .msg.err{ display:block; background:#FCECE8; color:#A33A22; }
  .msg.ok{ display:block; background:var(--green-tint); color:#0A6B3C; }

  /* ── Course list (signed in) ── */
  #hub{ display:none; }
  #hub.show{ display:block; }
  .topics{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:20px; margin-top:30px; }
  .topic{ background:var(--card); border:1px solid var(--hairline); border-radius:var(--radius-card); padding:24px 24px 20px;
    display:flex; flex-direction:column; transition:box-shadow .2s var(--ease), transform .2s var(--ease); }
  .topic:hover{ box-shadow:0 10px 30px rgba(37,35,32,.08); transform:translateY(-2px); }
  .topic-head{ display:flex; align-items:baseline; gap:12px; margin-bottom:6px; }
  .topic-num{ font-family:var(--font-en); font-size:2rem; font-weight:800; color:var(--coral); line-height:1; letter-spacing:-.02em; }
  .topic-tag{ font-family:var(--font-mono); font-size:.6rem; letter-spacing:.1em; text-transform:uppercase; color:var(--steel-soft); }
  .topic h3{ font-size:1.12rem; line-height:1.4; margin:4px 0 10px; }
  .topic p{ font-size:.88rem; line-height:1.8; color:var(--steel); flex:1; }
  .decks{ display:flex; flex-direction:column; gap:8px; margin-top:18px; }
  .deck-btn{ display:flex; align-items:center; gap:12px; text-align:left; width:100%; border:1px solid var(--hairline);
    background:var(--cream); border-radius:11px; padding:11px 14px; transition:all .15s var(--ease); color:var(--ink); }
  .deck-btn:hover{ border-color:var(--coral); background:#fff; }
  .deck-kind{ flex-shrink:0; font-family:var(--font-mono); font-size:.58rem; font-weight:600; letter-spacing:.08em; padding:3px 8px; border-radius:6px; }
  .k-key{ background:var(--ink-black); color:#fff; }
  .k-adv{ background:var(--lavender); color:var(--purple); }
  .deck-name{ font-size:.86rem; font-weight:600; flex:1; line-height:1.4; }
  .deck-arrow{ color:var(--steel-soft); font-size:1rem; }

  /* ── Viewer ── */
  #viewer{ display:none; position:fixed; inset:var(--topbar) 0 0 0; background:var(--cream); z-index:40; flex-direction:column; }
  #viewer.show{ display:flex; }
  .v-bar{ display:flex; align-items:center; gap:10px; padding:9px 16px; border-bottom:1px solid var(--hairline); background:var(--card); flex-wrap:wrap; }
  .v-title{ font-weight:700; font-size:.9rem; margin-right:6px; }
  .v-tabs{ display:flex; gap:6px; }
  .v-tab{ border:1px solid var(--hairline); background:var(--cream); border-radius:var(--radius-pill); padding:5px 12px; font-family:var(--font-en); font-size:.72rem; font-weight:600; color:var(--steel); }
  .v-tab.active{ background:var(--ink-black); color:#fff; border-color:var(--ink-black); }
  .v-right{ margin-left:auto; display:flex; gap:8px; }
  .v-frame-wrap{ flex:1; padding:12px; min-height:0; }
  #deckFrame{ width:100%; height:100%; border:1px solid var(--hairline); border-radius:12px; background:#fff; display:block; }

  .loading{ text-align:center; padding:120px 20px; font-family:var(--font-mono); font-size:.72rem; color:var(--steel-soft); letter-spacing:.12em; }
  footer{ text-align:center; padding:26px 20px 40px; font-family:var(--font-en); font-size:.76rem; color:var(--steel-soft); }
  footer a{ color:var(--steel); }

  @media (max-width:860px){
    .gate-grid, .topics{ grid-template-columns:1fr; }
    h1{ font-size:1.6rem; }
    .tb-sub{ display:none; }
  }
</style>
</head>

<header class="topbar">
  <a href="https://benedu-insight.github.io/" target="_blank" rel="noopener noreferrer" aria-label="Benedu Insight">

<!-- ── Hub: shown when signed in ── -->
<section id="hub" class="wrap">

let hubLang = new URLSearchParams(location.search).get('lang') === 'ko' ? 'ko' : 'en';
let currentTopic = null, currentDeck = 0, isAuthed = false;
const t = k => I18N[hubLang][k];

function applyI18n(){
  document.documentElement.lang = hubLang;
  document.body.classList.toggle('lang-ko', hubLang === 'ko');
  document.getElementById('btnEn').classList.toggle('active', hubLang === 'en');
  document.getElementById('btnKo').classList.toggle('active', hubLang === 'ko');
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-html]').forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
  document.getElementById('btnSignOut').textContent = t('signOut');
  document.getElementById('btnNewWin').textContent = t('newWin');
  if (isAuthed) renderTopics();
  if (currentTopic !== null) renderViewerBar();
}
function setHubLang(l){
  hubLang = l; applyI18n();
  // keep the open deck in the same language (decks expose setLang)
  try { const w = document.getElementById('deckFrame').contentWindow; if (w && typeof w.__beneduSetLang === 'function') w.__beneduSetLang(l); } catch(e){}
}

/* Topics are rendered only after sign-in */
function renderTopics(){
  const box = document.getElementById('topics');
  box.innerHTML = TOPICS.map((tp, i) => `
    <article class="topic">
      <div class="topic-head"><span class="topic-num">${tp.num}</span><span class="topic-tag">${tp.tag}</span></div>
      <h3>${tp.title[hubLang]}</h3>
      <p>${tp.desc[hubLang]}</p>
      <div class="decks">
        ${tp.decks.map((d, j) => `
          <button class="deck-btn" onclick="openDeck(${i},${j})">
            <span class="deck-kind ${d.kind === 'key' ? 'k-key' : 'k-adv'}">${d.kind === 'key' ? t('kindKey') : t('kindAdv')}</span>
            <span class="deck-name">${d.name[hubLang]}</span>
            <span class="deck-arrow">→</span>
          </button>`).join('')}
      </div>
    </article>`).join('');
}

function renderViewerBar(){
  const tp = TOPICS[currentTopic];
  document.getElementById('vTitle').textContent = tp.title[hubLang];
  document.getElementById('vTabs').innerHTML = tp.decks.map((d, j) =>
    `<button class="v-tab ${j === currentDeck ? 'active' : ''}" onclick="openDeck(${currentTopic},${j})">${d.kind === 'key' ? t('kindKey') : t('kindAdv')}</button>`).join('');
}
function openDeck(i, j){
  if (!isAuthed) return;
  currentTopic = i; currentDeck = j;
  renderViewerBar();
  document.getElementById('deckFrame').src = `members/${TOPICS[i].decks[j].file}?lang=${hubLang}`;
  document.getElementById('viewer').classList.add('show');
}
function closeViewer(){
  document.getElementById('viewer').classList.remove('show');
  document.getElementById('deckFrame').src = 'about:blank';
  currentTopic = null;
}
function fullscreenDeck(){
  const f = document.getElementById('deckFrame');
  (f.requestFullscreen ? f.requestFullscreen() : Promise.reject()).catch(() => {});
}
function openNewWindow(){ window.open(`m6_members.html?lang=${hubLang}`, '_blank', 'noopener'); }

// Embedded inside the portal (index.html)? → offer a larger standalone window
if (window.self !== window.top) document.getElementById('btnNewWin').style.display = '';

applyI18n();
document.getElementById('idSuffix').textContent = '@' + MEMBER_DOMAIN;
document.getElementById('email').addEventListener('input', e => {
  e.target.parentElement.classList.toggle('full', e.target.value.includes('@'));
});
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAJy0GsDI8KYU_0QbdhZ4Z78tTTCeGhAFk",
  authDomain: "arclabtool.firebaseapp.com",
  projectId: "arclabtool",
  storageBucket: "arclabtool.firebasestorage.app",
  messagingSenderId: "116212119538",
  appId: "1:116212119538:web:ca4387e00e4f26feb81d6b"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const $ = id => document.getElementById(id);
const msg = (text, kind) => { const m = $('loginMsg'); m.className = 'msg ' + kind; m.textContent = text; };

onAuthStateChanged(auth, user => {
  $('boot').style.display = 'none';
  isAuthed = !!user;
  $('gate').classList.toggle('show', !user);
  $('hub').classList.toggle('show', !!user);
  $('userBox').classList.toggle('show', !!user);
  $('userEmail').textContent = user ? user.email : '';
  if (user) renderTopics(); else closeViewer();
});

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const email = toLoginEmail($('email').value), pw = $('password').value;
  if (!email || !pw) { msg(t('errEmpty'), 'err'); return; }
  const btn = $('btnLogin'); btn.disabled = true; btn.textContent = t('signingIn');
  try {
    await signInWithEmailAndPassword(auth, email, pw);
    $('loginMsg').className = 'msg'; $('password').value = '';
  } catch (err) {
    const c = err.code || '';
    msg(
      /invalid-credential|wrong-password|user-not-found|invalid-email/.test(c) ? t('errCred') :
      /user-disabled/.test(c) ? t('errDisabled') :
      /too-many-requests/.test(c) ? t('errMany') :
      /network-request-failed/.test(c) ? t('errNet') :
      /unauthorized-domain|operation-not-allowed/.test(c) ? t('errDomain') : t('errOther'), 'err');
  } finally { btn.disabled = false; btn.textContent = t('loginBtn'); }
});

$('btnReset').addEventListener('click', () => {
  // Member accounts use an internal domain that cannot receive mail → reset is handled by the administrator
  const m = $('loginMsg'); m.className = 'msg ok'; m.innerHTML = t('resetAdmin');
});

$('btnSignOut').addEventListener('click', () => signOut(auth));
</script>
