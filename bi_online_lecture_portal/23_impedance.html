<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Module 03 — Impedance | Benedu Insight RF Lecture Series</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/benedu-insight/benedu-insight.github.io/refs/heads/main/logo_png/benedu_insight_Symbol.png"/>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet"/>

<style>
/* ═══════════════════════════════════════════════
   BENEDU INSIGHT — MODULE 03 BASE STYLES
   Module 02 구조 계승, Module 03 아이덴티티 추가
═══════════════════════════════════════════════ */
:root {
  --bg: #F7F8FA;
  --card: #F1EFEA;
  --card-hd: #E7E4DD;
  --purple: #7030A0;
  --green: #0F8C50;
  --plasma: #E87B1E;
  --blue: #1A6FB5;
  --red: #C0392B;
  --teal: #0891B2;
  --text: #1A1A2E;
  --text-sub: #5A5A7A;
  --border: #D8D5CE;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --radius: 12px;
  --font: 'Google Sans', 'Noto Sans KR', sans-serif;
  --mono: 'JetBrains Mono', monospace;
  --batang: 'Gowun Batang', serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; scroll-behavior: smooth; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  display: flex;
  min-height: 100vh;
}

/* ── SIDEBAR ── */
#sidebar {
  width: 260px;
  min-height: 100vh;
  background: #FFFFFF;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0;
  overflow-y: auto;
  z-index: 100;
}
.sb-brand {
  padding: 20px 18px 16px;
  border-bottom: 1px solid var(--border);
}
.sb-brand .module-tag {
  margin-top: 4px;
  font-size: 0.72rem;
  color: var(--text-sub);
}
.sb-era {
  padding: 10px 14px 6px;
  font-size: 0.65rem;
  font-weight: 700;
  color: var(--text-sub);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.sb-era-bar {
  height: 3px;
  border-radius: 2px;
  margin: 4px 14px 8px;
  background: var(--teal);
  opacity: 0.4;
}
.sb-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 9px 14px;
  cursor: pointer;
  border-radius: 8px;
  margin: 1px 8px;
  transition: background 0.15s;
  text-decoration: none;
}
.sb-item:hover { background: #E8F7F2; }
.sb-item.active { background: #D1F0E6; }
.sb-dot {
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.65rem;
  font-family: var(--mono);
  font-weight: 600;
  flex-shrink: 0;
  margin-top: 1px;
}
.sb-label { font-size: 0.78rem; line-height: 1.35; color: var(--text); }
.sb-sub { font-size: 0.68rem; color: var(--text-sub); margin-top: 2px; }
.sb-lang {
  margin-top: auto;
  padding: 14px 16px;
  border-top: 1px solid var(--border);
  display: flex; gap: 8px;
}
.lang-btn {
  flex: 1; padding: 7px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  background: transparent;
  font-family: var(--font);
  font-size: 0.78rem;
  cursor: pointer;
  transition: all 0.15s;
  color: var(--text-sub);
}
.lang-btn.active {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
  font-weight: 600;
}

/* ── TOP LOGO BAR ── */
#top-logo-bar {
  position: fixed;
  top: 0; left: 260px; right: 0;
  height: 44px;
  background: #fff;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: 0 28px;
  z-index: 150;
}
#top-logo-bar img {
  height: 22px;
  width: auto;
  object-fit: contain;
  opacity: 0.88;
}

/* ── MAIN CONTENT ── */
#main {
  margin-left: 260px;
  flex: 1;
  padding: 64px 36px 32px;
  max-width: calc(100vw - 260px);
}

/* ── SLIDE HEADER ── */
.slide-header { margin-bottom: 28px; }
.slide-eyebrow {
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--teal);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.slide-title {
  font-size: 1.9rem;
  font-weight: 700;
  color: var(--text);
  line-height: 1.2;
}
.slide-title span { color: var(--teal); }
.slide-subtitle {
  margin-top: 8px;
  font-size: 0.92rem;
  color: var(--text-sub);
  line-height: 1.5;
}

/* ── TAB SYSTEM ── */
.tab-row {
  display: flex;
  gap: 4px;
  margin-bottom: 24px;
  border-bottom: 2px solid var(--border);
  padding-bottom: 0;
}
.tab-btn {
  padding: 8px 18px 10px;
  font-family: var(--font);
  font-size: 0.82rem;
  font-weight: 500;
  border: none;
  background: transparent;
  color: var(--text-sub);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  transition: all 0.15s;
}
.tab-btn.active {
  color: var(--teal);
  border-bottom-color: var(--teal);
  font-weight: 700;
}
.tab-btn:hover:not(.active) { color: var(--text); }
.tab-pane { display: none; }
.tab-pane.active { display: block; }

/* ── DIAGRAM CARD ── */
.d-wrap {
  background: var(--card);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}
.d-header {
  background: var(--card-hd);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-radius: var(--radius) var(--radius) 0 0;
}
.d-badge {
  background: var(--teal);
  color: #fff;
  font-size: 0.65rem;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 20px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  font-family: var(--mono);
}
.d-badge.purple { background: var(--purple); }
.d-badge.green  { background: var(--green); }
.d-badge.plasma { background: var(--plasma); }
.d-badge.red    { background: var(--red); }
.d-title { font-size: 0.9rem; font-weight: 700; color: var(--text); }
.d-body { padding: 1.2rem; }

/* ── THEORY CARDS ── */
.theory-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
  margin-bottom: 20px;
}
.theory-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.05);
}
.theory-card h4 {
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--teal);
  margin-bottom: 7px;
  display: flex; align-items: center; gap: 6px;
}
.theory-card p { font-size: 0.82rem; color: var(--text-sub); line-height: 1.55; }

/* ── EQUATION BLOCK ── */
.eq-block {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 18px;
  margin: 10px 0;
  font-family: var(--mono);
  font-size: 0.9rem;
  text-align: center;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}
.eq-label {
  font-size: 0.7rem;
  color: var(--text-sub);
  text-align: right;
  margin-top: 4px;
  font-family: var(--font);
}

/* ── CALLOUT ── */
.callout {
  background: #F0FAFF;
  border: 1px solid #A8D8E8;
  border-radius: 10px;
  padding: 14px 16px;
  margin: 14px 0;
  font-size: 0.84rem;
  line-height: 1.6;
  color: var(--text);
}
.callout.green  { background: #F0FAF4; border-color: #A8D5B8; }
.callout.plasma { background: #FFF8F0; border-color: #F5C89A; }
.callout.purple { background: #F8F6FF; border-color: #C9B8E8; }
.callout.red    { background: #FDF0EE; border-color: #EAB0A8; }
.callout-title {
  font-weight: 700;
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 6px;
  color: var(--teal);
}
.callout.green  .callout-title { color: var(--green); }
.callout.plasma .callout-title { color: var(--plasma); }
.callout.purple .callout-title { color: var(--purple); }
.callout.red    .callout-title { color: var(--red); }

/* ── QUIZ ── */
.quiz-card {
  background: #fff;
  border: 1.5px solid #A8D8E8;
  border-radius: 10px;
  padding: 18px;
  margin-top: 10px;
}
.quiz-q {
  font-size: 0.88rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 14px;
  line-height: 1.5;
}
.quiz-opts { display: flex; flex-direction: column; gap: 8px; }
.quiz-opt {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 14px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.82rem;
  line-height: 1.4;
  transition: all 0.15s;
  background: var(--bg);
}
.quiz-opt:hover { border-color: var(--teal); background: #F0FAFF; }
.quiz-opt.correct { border-color: var(--green); background: #F0FAF4; color: var(--green); }
.quiz-opt.wrong   { border-color: var(--red); background: #FDF0EE; color: var(--red); }
.quiz-opt span.opt-key {
  font-family: var(--mono);
  font-weight: 700;
  font-size: 0.75rem;
  width: 20px; flex-shrink: 0;
}
.quiz-feedback {
  margin-top: 12px;
  font-size: 0.8rem;
  padding: 10px 12px;
  border-radius: 8px;
  display: none;
  line-height: 1.5;
}
.quiz-feedback.show { display: block; }
.quiz-feedback.ok { background: #F0FAF4; color: var(--green); }
.quiz-feedback.ng { background: #FDF0EE; color: var(--red); }

/* ── CONNECTIONS ── */
.connections { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.conn-chip {
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 0.75rem;
  font-family: var(--mono);
  font-weight: 600;
  border: 1.5px solid var(--border);
  cursor: pointer;
  transition: all 0.15s;
  background: #fff;
  color: var(--text-sub);
}
.conn-chip:hover { border-color: var(--teal); color: var(--teal); background: #F0FAFF; }

/* ── DEEP STUDY ── */
.deep-section h3 {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--teal);
  margin: 20px 0 10px;
  padding-bottom: 6px;
  border-bottom: 1.5px solid #A8D8E8;
}
.deep-section p  { font-size: 0.84rem; line-height: 1.7; color: var(--text); margin-bottom: 10px; }
.deep-section ul { padding-left: 18px; margin-bottom: 10px; }
.deep-section ul li { font-size: 0.83rem; line-height: 1.65; color: var(--text); margin-bottom: 4px; }

/* ── TABLE ── */
.data-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin: 10px 0; }
.data-table th {
  background: var(--card-hd);
  padding: 9px 12px;
  text-align: left;
  font-weight: 700;
  font-size: 0.75rem;
  color: var(--text-sub);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.data-table td { padding: 9px 12px; border-bottom: 1px solid var(--border); color: var(--text); line-height: 1.4; }
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { background: #F0FAFF; }

/* ── CANVAS SIMULATOR ── */
.sim-wrap { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin: 10px 0; }
.sim-canvas {
  width: 100%;
  max-width: 100%;
  height: auto;
  border-radius: 8px;
  background: #0D1117;
  display: block;
  image-rendering: -webkit-optimize-contrast;
  image-rendering: crisp-edges;
  box-sizing: border-box;
}
.sim-controls { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 14px; align-items: center; }
.sim-ctrl-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 140px; }
.sim-ctrl-label { font-size: 0.72rem; font-weight: 700; color: var(--text-sub); display: flex; justify-content: space-between; }
.sim-ctrl-val { font-family: var(--mono); font-size: 0.72rem; color: var(--teal); font-weight: 600; }
.sim-slider {
  -webkit-appearance: none; width: 100%; height: 4px; border-radius: 2px;
  background: var(--border); outline: none;
}
.sim-slider::-webkit-slider-thumb {
  -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
  background: var(--teal); cursor: pointer;
}
.sim-btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.sim-btn {
  padding: 7px 16px; border-radius: 8px;
  border: 1.5px solid var(--teal);
  background: transparent; color: var(--teal);
  font-family: var(--font); font-size: 0.78rem; font-weight: 600;
  cursor: pointer; transition: all 0.15s;
}
.sim-btn:hover, .sim-btn.active { background: var(--teal); color: #fff; }
.sim-btn.purple-btn { border-color: var(--purple); color: var(--purple); }
.sim-btn.purple-btn:hover, .sim-btn.purple-btn.active { background: var(--purple); color: #fff; }
.sim-info {
  margin-top: 10px; padding: 10px 14px;
  background: var(--bg); border-radius: 8px;
  font-size: 0.78rem; color: var(--text-sub); line-height: 1.5; min-height: 36px;
}

/* ── REVEAL BLOCK (함께 생각해 보기) ── */
.reveal-wrap {
  background: #fff;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 16px;
  box-shadow: 0 1px 6px rgba(0,0,0,0.06);
}
.reveal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  cursor: pointer;
  user-select: none;
  transition: background 0.15s;
}
.reveal-header:hover { background: #F4F6FB; }
.reveal-q {
  font-size: 0.92rem;
  font-weight: 700;
  color: var(--text);
  line-height: 1.4;
  flex: 1;
}
.reveal-badge {
  flex-shrink: 0;
  background: var(--teal);
  color: #fff;
  font-size: 0.68rem;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 10px;
  font-family: var(--mono);
  letter-spacing: 0.04em;
  margin-right: 12px;
}
.reveal-chevron { flex-shrink: 0; font-size: 0.8rem; color: var(--text-sub); transition: transform 0.22s; }
.reveal-header.open .reveal-chevron { transform: rotate(180deg); }
.reveal-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.35s ease, opacity 0.25s ease;
  opacity: 0;
  border-top: 1px solid transparent;
}
.reveal-body.open {
  max-height: 2000px;
  opacity: 1;
  border-top-color: var(--border);
}
.reveal-inner { padding: 18px; }

/* ── Journey Key Block styles (Step 2) ── */
.jkey-block {
  display: block;
  margin-bottom: 0;
}
.jkey-spacer {
  display: block;
  height: 14px;
}
.jkey-h {
  display: block;
  font-size: 0.92rem;
  font-weight: 700;
  color: #E8EEF8;
  font-family: 'Google Sans', sans-serif;
  line-height: 1.7;
}
.jkey-tag {
  font-size: 0.78rem;
  font-weight: 600;
  color: #A0BBCC;
  font-family: 'Google Sans', sans-serif;
}
.jkey-f {
  display: block;
  font-size: 1.15rem;
  font-weight: 700;
  color: #E8EEF8;
  font-family: 'Google Sans', sans-serif;
  line-height: 1.8;
  padding-left: 18px;
}
.jkey-f sup {
  font-size: 0.72em;
  vertical-align: super;
}

#img-popup {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.75); z-index: 9999;
  align-items: center; justify-content: center;
}
#img-popup.open { display: flex; }
#img-popup img { max-width: 90vw; max-height: 85vh; border-radius: 10px; box-shadow: 0 8px 40px rgba(0,0,0,0.4); }
#img-popup-cap {
  position: fixed; bottom: 30px; left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.7); color: #fff;
  padding: 8px 18px; border-radius: 20px; font-size: 0.8rem;
}

/* ── PROGRESS BAR ── */
.progress-bar { position: fixed; top: 44px; left: 260px; right: 0; height: 3px; background: var(--border); z-index: 200; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--teal), var(--green)); transition: width 0.3s ease; }

/* ── RESPONSIVE ── */
@media (max-width: 768px) {
  #sidebar { display: none; }
  #main { margin-left: 0; padding: 64px 16px 20px; max-width: 100vw; }
  .progress-bar { left: 0; }
  #top-logo-bar { left: 0; }
}

/* ── 임피던스 페이저 다이어그램 ── */
.phasor-legend {
  display: flex; flex-wrap: wrap; gap: 10px;
  margin-top: 10px; align-items: center;
}
.phasor-dot {
  display: inline-block; width: 12px; height: 12px;
  border-radius: 50%; margin-right: 5px; vertical-align: middle;
}

/* ── Z 표기 큰 수식 ── */
.z-formula-block {
  display: flex; align-items: center; gap: 0;
  background: #fff; border: 2px solid #C9B8E8;
  border-radius: 14px; padding: 20px 28px;
  margin: 16px 0; flex-wrap: wrap; justify-content: center;
}
.z-formula-block .z-sym {
  font-size: 3rem; font-weight: 900;
  color: var(--purple); font-family: var(--mono);
  margin-right: 12px;
}
.z-formula-block .z-eq { font-size: 2.2rem; color: var(--text-sub); margin: 0 10px; }
.z-formula-block .z-r  { font-size: 2.2rem; font-weight: 700; color: var(--blue); }
.z-formula-block .z-pm { font-size: 2rem; color: var(--text-sub); margin: 0 8px; }
.z-formula-block .z-x  { font-size: 2.2rem; font-weight: 700; color: var(--purple); }
.z-formula-block .z-j  { font-size: 2.2rem; font-weight: 700; color: var(--purple); }
.z-sub-label {
  font-size: 0.72rem; color: var(--text-sub); text-align: center;
  margin-top: 4px; font-family: var(--mono);
}
</style>
</head>

  <div id="slide-area"></div>

<script>
/* ═══════════════════════════════════════════
   HiDPI Canvas Utility
═══════════════════════════════════════════ */
function setupHiDPI(canvas) {
  const dpr  = window.devicePixelRatio || 1;
  // Use offsetWidth so we always get the current rendered CSS width
  const cssW = canvas.offsetWidth  || canvas.parentElement && canvas.parentElement.offsetWidth || 680;
  // Preserve aspect ratio based on original height/width ratio from the data-h attribute,
  // or fall back to the canvas.height attribute value (which we keep as the logical height)
  const attrH = parseInt(canvas.getAttribute('data-h') || canvas.height || 260);
  const attrW = parseInt(canvas.getAttribute('data-w') || canvas.width  || 680);
  const cssH  = Math.round(attrH * (cssW / attrW));
  canvas.width  = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  canvas.style.width  = '100%';
  canvas.style.height = cssH + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  return { ctx, W: cssW, H: cssH, dpr };
}

function renderSidebar() {
  const sl = slides();
  const nl = document.getElementById('nav-list');
  nl.innerHTML = '';
  sl.forEach(s => {
    const div = document.createElement('div');
    div.className = 'sb-item' + (s.id === currentId ? ' active' : '');
    div.onclick = () => navigateTo(s.id);
    const color = ERA_COLORS[s.era] || '#0891B2';
    const alpha = s.placeholder ? '0.45' : '1';
    const sub = currentLang === 'ko' ? SB_SUBS_KO[s.id] : SB_SUBS_EN[s.id];
    div.style.opacity = alpha;
    div.innerHTML = `
      <div class="sb-dot" style="background:${color}20;color:${color}">${SB_ICONS[s.id]||'●'}</div>
      <div>
        <div class="sb-label">${s.title}</div>
        <div class="sb-sub">${sub||''}</div>
      </div>`;
    nl.appendChild(div);
  });
  updateProgress();
}

function updateProgress() {
  const sl = slides();
  const idx = sl.findIndex(s => s.id === currentId);
  const pct = sl.length > 1 ? (idx / (sl.length - 1)) * 100 : 0;
  document.getElementById('progressFill').style.width = pct + '%';
}

function journeyStages() {
  return getJourneyStages(currentLang === 'en');
}

function initJourneySlide() {
  journeyStage = 0;
  journeyLoad  = 'R';
  window._ch3WallType = 'resistive';
  renderJourneyStage();
}

window.gotoJourney = function(n) {
  journeyStage = n;
  if (journeyAnim) { cancelAnimationFrame(journeyAnim); journeyAnim = null; }
  if (n === 1) { window._ch3WallType = window._ch3WallType || 'resistive'; }
  renderJourneyStage();
};

window.journeyNext = function() {
  if (journeyAnim) { cancelAnimationFrame(journeyAnim); journeyAnim = null; }
  if (journeyStage < 3) { journeyStage++; renderJourneyStage(); }
  else { navigateTo('c31'); }
};

window.journeyPrev = function() {
  if (journeyAnim) { cancelAnimationFrame(journeyAnim); journeyAnim = null; }
  if (journeyStage > 0) { journeyStage--; renderJourneyStage(); }
  else { navigateTo('c30'); }
};

window.setJourneyLoad = function(type) {
  journeyLoad = type;
  var loads = [{id:'R',col:'#0891B2'},{id:'L',col:'#E87B1E'},{id:'C',col:'#7030A0'},{id:'OC',col:'#C0392B'},{id:'SC',col:'#27AE60'},{id:'M',col:'#F7C948'}];
  loads.forEach(function(l) {
    var btn = document.getElementById('jload-' + l.id);
    if (!btn) return;
    btn.style.background = l.id === type ? l.col : 'transparent';
    btn.style.color      = l.id === type ? '#fff'  : l.col;
  });
};

/* ── imgThumb: safe image thumbnail with popup ── */
function imgThumb(src, label, borderCol, bgCol, w, h) {
  // Use data-popup-src/cap attributes + CSS class for event delegation
  // (DOM .onclick handlers are lost when serialized via innerHTML)
  return '<div class="img-thumb-popup"'
    + ' data-popup-src="' + src + '"'
    + ' data-popup-cap="' + label + '"'
    + ' style="cursor:pointer;background:#fff;border:1.5px solid ' + borderCol + '40;'
    + 'border-radius:10px;overflow:hidden;box-shadow:0 1px 5px rgba(0,0,0,.08);'
    + 'display:inline-block;transition:box-shadow 0.15s;vertical-align:top"'
    + ' onmouseover="this.style.boxShadow=\'0 4px 16px rgba(0,0,0,.18)\'"'
    + ' onmouseout="this.style.boxShadow=\'0 1px 5px rgba(0,0,0,.08)\'"'
    + ' onclick="openImgPopup(this.dataset.popupSrc, this.dataset.popupCap)">'
    + '<img src="' + src + '" alt="' + label + '"'
    + ' style="width:' + w + 'px;height:' + h + 'px;object-fit:cover;object-position:top;display:block">'
    + '<div style="padding:4px 8px;font-size:0.62rem;font-weight:700;color:' + borderCol + ';'
    + 'text-align:center;background:' + bgCol + ';font-family:Google Sans,sans-serif">'
    + label + '</div>'
    + '</div>';
}

function startJourneyCanvas() {
  var canvas = document.getElementById('journeyCanvas');
  if (!canvas) return;
  canvas.style.width  = '100%';
  canvas.style.height = '';
  var hdpi = setupHiDPI(canvas);
  window._jCtx = hdpi.ctx; window._jW = hdpi.W; window._jH = hdpi.H;
  if (journeyStage === 1) {
    /* Step 2: static — draw once, no animation loop */
    drawJourneyCanvas(window._jCtx, window._jW, window._jH, 0);
    return;
  }
  function loop() {
    if (journeyStage === 1) {
      // Step 2: static graph, draw once and stop
      drawJourneyCanvas(window._jCtx, window._jW, window._jH, 0);
      return;
    }
    if (!journeyPaused) {
      drawJourneyCanvas(window._jCtx, window._jW, window._jH, journeyT);
      journeyT += 0.016 * journeySpeed;
    }
    journeyAnim = requestAnimationFrame(loop);
  }
  loop();
}

function drawJourneyCanvas(ctx, W, H, t) {
  if (!ctx) return;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0D1117'; ctx.fillRect(0, 0, W, H);
  if      (journeyStage === 0) drawJourneyCh2(ctx, W, H, t);
  else if (journeyStage === 1) drawJourneyCh3(ctx, W, H, t);
  else if (journeyStage === 2) drawJourneyCh4(ctx, W, H, t);
  else                          drawJourneyCh5(ctx, W, H, t);
}

function drawJourneyCh2(ctx, W, H, t) {
  var GS  = 'Google Sans,sans-serif';
  var MONO = 'JetBrains Mono,monospace';
  var isEn = currentLang === 'en';

  /* ── Load table ──
     gamma : |Γ|
     ph    : ∠Γ (radians)  — the PHASE of the reflection coefficient
     Open  : Γ = +1  (ph=0,  voltage doubles at load)
     Short : Γ = −1  (ph=π,  voltage = 0 at load)
  */
  var LP = {
    /* Resistor 25Ω → Γ=(25-50)/(25+50) = -1/3, |Γ|=0.33, ∠Γ=π (부분 반사) */
    R : { gamma:0.33, ph:Math.PI,    col:'#0891B2', label:'Resistor (25Ω)' },
    /* Pure Inductor: Z=jX, |Γ|=1, ∠Γ = π-2·arctan(X/50). X=50 → ∠Γ=π/2 */
    L : { gamma:1.0,  ph:Math.PI*.5, col:'#E87B1E', label:'Inductor (pure L)' },
    /* Pure Capacitor: Z=-jX, |Γ|=1, ∠Γ = -(π-2·arctan(X/50)). X=50 → ∠Γ=-π/2 */
    C : { gamma:1.0,  ph:-Math.PI*.5,col:'#7030A0', label:'Capacitor (pure C)' },
    OC: { gamma:1.0,  ph:0,          col:'#C0392B', label:'Open Circuit'  },
    SC: { gamma:1.0,  ph:Math.PI,    col:'#27AE60', label:'Short Circuit' },
    /* 50Ω Perfect Match: Γ=0 — 반사 없음! */
    M : { gamma:0.0,  ph:0,          col:'#F7C948', label:'50Ω Match ★' }
  };
  var lp = LP[journeyLoad] || LP.R;

  /* ── Layout ── */
  var wallX = W - 38;
  var incW  = wallX - 36;
  var midY  = H * 0.34;
  var amp   = H * 0.11;
  var K     = Math.PI * 2 * 3.0;   // spatial freq (3 full cycles across cable)
  var speed = 0.14;                  // animation speed
  var ph    = lp.ph;
  var G     = lp.gamma;

  /* ── Correct travelling-wave formulas ──
     Convention: x=0 at Generator, x=1 at Load.
     V⁺(x,t) = A · cos(ωt − Kx)          (travels +x, left→right)
     V⁻(x,t) = A·G · cos(ωt + Kx + ph)   (reflects at x=1, travels −x)
     |V(x)|_envelope = A · √(1 + G² + 2G·cos(2K(1−x) + ph))
       — peaks/nulls measured from the LOAD end (x=1)
  */
  function Vinc(xn, tm) { return amp * Math.cos(K * xn - tm * speed * K * 2); }
  function Vref(xn, tm) { return amp * G * Math.cos(K * xn + tm * speed * K * 2 + Math.PI + ph); }
  // envelope at position xn (distance 1−xn from load)
  function Venv(xn)  {
    var d = 1 - xn;   // electrical distance from load
    return amp * Math.sqrt(1 + G*G + 2*G*Math.cos(2*K*d + ph));
  }

  /* ── UPPER PANEL: Incident & Reflected ── */
  // Generator
  ctx.strokeStyle = '#5BE0C0'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(22, midY, 13, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = '#5BE0C0'; ctx.font = 'bold 13px ' + GS;
  ctx.textAlign = 'center'; ctx.fillText('~', 22, midY + 5);

  // Cable
  ctx.strokeStyle = '#2A3550'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(35, midY); ctx.lineTo(wallX, midY); ctx.stroke();

  // Wall / Load
  if (journeyLoad === 'M') {
    // 50Ω Match — golden glow wall
    ctx.shadowColor = '#F7C948'; ctx.shadowBlur = 14;
    ctx.fillStyle = '#F7C94830'; ctx.fillRect(wallX, midY - H*.20, 22, H*.40);
    ctx.strokeStyle = '#F7C948'; ctx.lineWidth = 2.5;
    ctx.strokeRect(wallX, midY - H*.20, 22, H*.40);
    ctx.shadowBlur = 0;
    // Star pattern inside
    ctx.fillStyle = '#F7C948'; ctx.font = '11px serif'; ctx.textAlign = 'center';
    for (var sy2 = midY - H*.15; sy2 < midY + H*.18; sy2 += 14) {
      ctx.fillText('★', wallX + 11, sy2);
    }
  } else {
    ctx.fillStyle = lp.col + '28'; ctx.fillRect(wallX, midY - H*.20, 22, H*.40);
    ctx.strokeStyle = lp.col; ctx.lineWidth = 2;
    ctx.strokeRect(wallX, midY - H*.20, 22, H*.40);
    for (var wy = midY - H*.18; wy < midY + H*.18; wy += 10) {
      ctx.fillStyle = lp.col + '44'; ctx.fillRect(wallX+2, wy, 18, 6);
    }
  }
  ctx.fillStyle = lp.col; ctx.font = 'bold 8px ' + GS; ctx.textAlign = 'center';
  ctx.fillText(lp.label, wallX + 11, midY + H*.25);

  // Incident wave (blue, solid)
  ctx.strokeStyle = '#5B9BD5'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (var px = 35; px < wallX; px++) {
    var xn = (px - 35) / incW;
    var vy = midY - Vinc(xn, t);
    if (px === 35) ctx.moveTo(px, vy); else ctx.lineTo(px, vy);
  }
  ctx.stroke();

  // Reflected wave (red, dashed) — offset downward so both visible
  if (G > 0.01) {
    var refOffset = amp * 2.0;   // visual separation
    ctx.strokeStyle = '#FF6B6B'; ctx.lineWidth = 2; ctx.setLineDash([5, 3]);
    ctx.beginPath();
    for (var px2 = 35; px2 < wallX; px2++) {
      var xn2 = (px2 - 35) / incW;
      var ry  = midY + refOffset - Vref(xn2, t);
      if (px2 === 35) ctx.moveTo(px2, ry); else ctx.lineTo(px2, ry);
    }
    ctx.stroke(); ctx.setLineDash([]);
  }

  // Labels
  ctx.fillStyle = '#5B9BD5'; ctx.font = 'bold 9px ' + GS;
  ctx.textAlign = 'left'; ctx.fillText(isEn ? '→ Incident' : '→ 입사파', 38, midY - amp - 8);
  if (G > 0.01) {
    ctx.fillStyle = '#FF6B6B';
    ctx.fillText(isEn ? '← Reflected  (|Γ|=' + G.toFixed(2) + ')' : '← 반사파  (|Γ|=' + G.toFixed(2) + ')', 38, midY + amp * 2.8);
  }

  /* ── LOWER PANEL: Standing Wave + SWR Envelope ── */
  var swTop = H * 0.62;
  var swH   = H * 0.34;
  var swMid = swTop + swH * 0.5;
  var swAmp = swH  * 0.38;
  var envSc = swAmp / amp;   // scale: amp canvas units → swAmp screen units

  // Background
  ctx.fillStyle = '#0D1520'; ctx.fillRect(0, swTop - 2, W, swH + 4);
  ctx.strokeStyle = '#1A2535'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, swTop - 2); ctx.lineTo(W, swTop - 2); ctx.stroke();

  // Centre axis
  ctx.strokeStyle = '#1E3050'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(35, swMid); ctx.lineTo(wallX, swMid); ctx.stroke();

  // Panel label
  if (journeyLoad === 'M') {
    ctx.fillStyle = '#F7C948'; ctx.font = 'bold 8px ' + GS; ctx.textAlign = 'left';
    ctx.fillText(isEn ? '★ Perfect Match: Traveling wave only (no standing wave!)' : '★ 완전 매칭: 진행파만 존재 (정재파 없음!)', 6, swTop + 11);
  } else {
    ctx.fillStyle = '#3A5070'; ctx.font = '8px ' + GS; ctx.textAlign = 'left';
    ctx.fillText(isEn ? 'Standing Wave + SWR Envelope:' : '정재파 + SWR Envelope:', 6, swTop + 11);
  }

  // Standing wave V(x,t) = V⁺ + V⁻
  ctx.strokeStyle = '#5BE0C0'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (var px3 = 35; px3 < wallX; px3++) {
    var xn3 = (px3 - 35) / incW;
    var sv   = (Vinc(xn3, t) + Vref(xn3, t)) * envSc;
    var sy   = swMid - sv;
    if (px3 === 35) ctx.moveTo(px3, sy); else ctx.lineTo(px3, sy);
  }
  ctx.stroke();

  // SWR Envelope — |V(x)| upper
  ctx.strokeStyle = '#FFE066'; ctx.lineWidth = 1.8; ctx.setLineDash([3, 3]);
  ctx.beginPath();
  for (var px4 = 35; px4 < wallX; px4++) {
    var xn4 = (px4 - 35) / incW;
    var ev4  = Venv(xn4) * envSc;
    if (px4 === 35) ctx.moveTo(px4, swMid - ev4); else ctx.lineTo(px4, swMid - ev4);
  }
  ctx.stroke();

  // SWR Envelope — |V(x)| lower (mirror)
  ctx.beginPath();
  for (var px5 = 35; px5 < wallX; px5++) {
    var xn5 = (px5 - 35) / incW;
    var ev5  = Venv(xn5) * envSc;
    if (px5 === 35) ctx.moveTo(px5, swMid + ev5); else ctx.lineTo(px5, swMid + ev5);
  }
  ctx.stroke();
  ctx.setLineDash([]);

  // Envelope label
  ctx.fillStyle = '#FFE066'; ctx.font = '8px ' + MONO; ctx.textAlign = 'right';
  ctx.fillText('SWR envelope', wallX - 4, swTop + 11);

  // Load-end annotation: show V at wall
  var VatLoad = Venv(1.0);   // should be ~0 for SC, ~2A for OC
  ctx.fillStyle = lp.col; ctx.font = 'bold 8px ' + MONO; ctx.textAlign = 'right';
  ctx.fillText('V\u2097\u2092\u2090\u2099=' + (VatLoad / amp * 100).toFixed(0) + '%', wallX - 4, swMid - 4);

  // Info: Γ and VSWR
  var vswr = G < 0.999 ? ((1 + G) / (1 - G)).toFixed(1) : '\u221e';
  ctx.fillStyle = '#FFE066'; ctx.font = 'bold 10px ' + MONO; ctx.textAlign = 'right';
  ctx.fillText('|\u0393|=' + G.toFixed(2) + '  VSWR=' + vswr, W - 6, 18);

  // Physics note per load type
  var note = '';
  var noteCol = lp.col;
  if (journeyLoad === 'M') {
    note = isEn
      ? '★ 50Ω Match: |Γ|=0 — NO reflection. ALL power delivered to load!'
      : '★ 50Ω Match: |Γ|=0 — 반사 없음. 전력이 100% 부하에 전달!';
    noteCol = '#F7C948';
  } else if (journeyLoad === 'SC') {
    note = isEn ? 'Short: V=0 at load, Vmax at λ/4 from load' : 'Short: 부하에서 V=0, 부하에서 λ/4 지점에서 최대';
  } else if (journeyLoad === 'OC') {
    note = isEn ? 'Open: V=2A at load (voltage doubling), V=0 at λ/4' : 'Open: 부하에서 V=2A (전압 2배), λ/4 지점에서 V=0';
  } else if (journeyLoad === 'L') {
    note = isEn ? 'Pure L: |Γ|=1 (full reflection), ∠Γ=+90° — energy stored, not absorbed' : '순수 L: |Γ|=1 (완전 반사), ∠Γ=+90° — 에너지 저장, 흡수 안 됨';
  } else if (journeyLoad === 'C') {
    note = isEn ? 'Pure C: |Γ|=1 (full reflection), ∠Γ=−90° — energy stored, not absorbed' : '순수 C: |Γ|=1 (완전 반사), ∠Γ=−90° — 에너지 저장, 흡수 안 됨';
  } else if (journeyLoad === 'R') {
    note = isEn ? 'R=25Ω: partial reflection |Γ|=0.33 — some power absorbed, some reflected' : 'R=25Ω: 부분 반사 |Γ|=0.33 — 일부 흡수, 일부 반사';
  }
  if (note) {
    // Background pill for Match to make it stand out
    if (journeyLoad === 'M') {
      ctx.fillStyle = '#F7C94818';
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(4, H-20, W-8, 16, 4);
      else ctx.rect(4, H-20, W-8, 16);
      ctx.fill();
    }
    ctx.fillStyle = noteCol;
    ctx.font = journeyLoad === 'M' ? 'bold 9px ' + GS : '8px ' + GS;
    ctx.textAlign = 'left';
    ctx.fillText(note, 8, H - 8);
  }
  ctx.textAlign = 'left';
}

function drawJourneyCh3(ctx, W, H, t) {
  /* ── Static V/I phase comparison — no animation needed ── */
  var GS   = "'Google Sans', sans-serif";
  var MONO = "'JetBrains Mono', monospace";
  var isEn = currentLang === 'en';

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0D1117'; ctx.fillRect(0, 0, W, H);

  /* Wall type definitions */
  var TYPES = {
    'resistive': { label:'Resistive',        zmag:50,   phase:0,   colV:'#5B9BD5', colI:'#FF6B6B',
                   desc: isEn?'|Z|=50Ω  θ=0°  Pure resistance — V and i in phase':'|Z|=50Ω  θ=0°  순수 저항 — V와 i 동위상' },
    'inductive': { label:'Pure Inductive',   zmag:50,   phase:90,  colV:'#5B9BD5', colI:'#FF6B6B',
                   desc: isEn?'|Z|=XL Ω  θ=+90°  Pure inductor — i lags V by 90°':'|Z|=XL Ω  θ=+90°  순수 인덕터 — i가 V보다 90° 뒤짐' },
    'capacitive':{ label:'Pure Capacitive',  zmag:50,   phase:-90, colV:'#5B9BD5', colI:'#FF6B6B',
                   desc: isEn?'|Z|=XC Ω  θ=−90°  Pure capacitor — i leads V by 90°':'|Z|=XC Ω  θ=−90°  순수 커패시터 — i가 V보다 90° 앞섬' },
    'rlc-cap':   { label:'RLC (Capacitive)', zmag:58.3, phase:-31, colV:'#5B9BD5', colI:'#FF6B6B',
                   desc: isEn?'|Z|=58.3Ω  θ=−31°  RLC — capacitive dominant':'|Z|=58.3Ω  θ=−31°  RLC — 용량성 우세' },
    'rlc-ind':   { label:'RLC (Inductive)',  zmag:58.3, phase:31,  colV:'#5B9BD5', colI:'#FF6B6B',
                   desc: isEn?'|Z|=58.3Ω  θ=+31°  RLC — inductive dominant':'|Z|=58.3Ω  θ=+31°  RLC — 유도성 우세' },
  };

  var wt  = window._ch3WallType || 'resistive';
  var lp  = TYPES[wt] || TYPES['resistive'];
  var phR = lp.phase * Math.PI / 180;

  var cycles = 2.0;
  var omega  = Math.PI * 2 * cycles;

  /* ── Layout: leave top margin for labels ── */
  var topMargin = 48;           // space for V(t) + Voltage labels
  var botMargin = 50;           // space for info box
  var midMargin = 28;           // gap between two panels
  var availH    = H - topMargin - botMargin - midMargin;
  var panH      = availH / 2;
  var Vamp      = panH * 0.36;
  var Iamp      = panH * 0.30;

  var p1Y = topMargin + panH * 0.5;    // V(t) zero axis
  var p2Y = topMargin + panH + midMargin + panH * 0.5;  // i(t) zero axis

  /* Panel backgrounds */
  ctx.fillStyle = '#0D1520'; ctx.fillRect(0, 0, W, topMargin + panH + midMargin * 0.5);
  ctx.fillStyle = '#131B28'; ctx.fillRect(0, topMargin + panH + midMargin * 0.5, W, H - topMargin - panH - midMargin * 0.5);

  /* Zero axes */
  ctx.strokeStyle = '#2A3A5080'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(20, p1Y); ctx.lineTo(W-10, p1Y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(20, p2Y); ctx.lineTo(W-10, p2Y); ctx.stroke();

  /* V(t) wave */
  ctx.strokeStyle = lp.colV; ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (var px = 20; px < W-10; px++) {
    var xn = (px - 20) / (W - 30);
    var vy = p1Y - Vamp * Math.sin(omega * xn);
    if (px === 20) ctx.moveTo(px, vy); else ctx.lineTo(px, vy);
  }
  ctx.stroke();

  /* i(t) wave */
  ctx.strokeStyle = lp.colI; ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (var px2 = 20; px2 < W-10; px2++) {
    var xn2 = (px2 - 20) / (W - 30);
    var iy  = p2Y - Iamp * Math.sin(omega * xn2 - phR);
    if (px2 === 20) ctx.moveTo(px2, iy); else ctx.lineTo(px2, iy);
  }
  ctx.stroke();

  /* V(t) label — safely in top margin */
  ctx.fillStyle = '#AABBCC'; ctx.font = '9px ' + MONO; ctx.textAlign = 'left';
  ctx.fillText('Voltage', 24, topMargin - 18);
  ctx.fillStyle = lp.colV; ctx.font = 'bold 11px ' + GS;
  ctx.fillText('V(t)', 24, topMargin - 5);

  /* i(t) label */
  var i_label_y = topMargin + panH + midMargin * 0.5 + 2;
  ctx.fillStyle = '#AABBCC'; ctx.font = '9px ' + MONO;
  ctx.fillText('Current', 24, i_label_y + 10);
  ctx.fillStyle = lp.colI; ctx.font = 'bold 11px ' + GS;
  ctx.fillText('i(t)', 24, i_label_y + 22);

  /* ── Phase annotation ── */
  if (Math.abs(lp.phase) > 1) {
    var vPkX = 20 + (W-30) * (0.25 / cycles);
    var iPkX = vPkX + (phR / omega) * (W - 30);

    /* Clamping: if 90° pushes iPkX out of visible range, show in visible area */
    var drawArrow = (iPkX > 25 && iPkX < W - 15);

    /* Vertical dashed lines */
    ctx.strokeStyle = '#FFE066'; ctx.lineWidth = 1.2; ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.moveTo(vPkX, p1Y - Vamp - 2); ctx.lineTo(vPkX, p2Y + Iamp + 2); ctx.stroke();
    if (drawArrow) {
      ctx.beginPath(); ctx.moveTo(iPkX, p1Y - Vamp - 2); ctx.lineTo(iPkX, p2Y + Iamp + 2); ctx.stroke();
    }
    ctx.setLineDash([]);

    /* Horizontal phase arrow */
    if (drawArrow) {
      var arrY = (p1Y + p2Y) / 2;
      ctx.strokeStyle = '#FFE066'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(vPkX, arrY); ctx.lineTo(iPkX, arrY); ctx.stroke();
      var dir = iPkX > vPkX ? 1 : -1;
      ctx.fillStyle = '#FFE066';
      ctx.beginPath(); ctx.moveTo(iPkX, arrY); ctx.lineTo(iPkX-dir*9, arrY-5); ctx.lineTo(iPkX-dir*9, arrY+5); ctx.fill();
      ctx.fillStyle = '#FFE066'; ctx.font = 'bold 11px ' + MONO; ctx.textAlign = 'center';
      ctx.fillText('\u0394\u03c6 = ' + lp.phase + '\u00b0', (vPkX+iPkX)/2, arrY - 10);
      ctx.font = '9px ' + GS;
      var dirLbl = lp.phase > 0 ? (isEn ? 'i lags V' : 'i가 V보다 뒤짐') : (isEn ? 'i leads V' : 'i가 V보다 앞섬');
      ctx.fillText(dirLbl, (vPkX+iPkX)/2, arrY + 20);
    } else {
      /* For ±90°: show text annotation instead */
      var annX = W * 0.65;
      var annY = (p1Y + p2Y) / 2;
      ctx.fillStyle = '#FFE066'; ctx.font = 'bold 12px ' + MONO; ctx.textAlign = 'center';
      ctx.fillText('\u0394\u03c6 = ' + lp.phase + '\u00b0', annX, annY - 8);
      ctx.font = '9px ' + GS;
      var dl2 = lp.phase > 0 ? (isEn ? 'i lags V by 90°' : 'i가 V보다 90° 뒤짐') : (isEn ? 'i leads V by 90°' : 'i가 V보다 90° 앞섬');
      ctx.fillText(dl2, annX, annY + 10);
    }

    /* Peak dots */
    ctx.fillStyle = lp.colV; ctx.beginPath(); ctx.arc(vPkX, p1Y - Vamp, 5, 0, Math.PI*2); ctx.fill();
    if (drawArrow && iPkX > 20 && iPkX < W-10) {
      ctx.fillStyle = lp.colI; ctx.beginPath(); ctx.arc(iPkX, p2Y - Iamp, 5, 0, Math.PI*2); ctx.fill();
    }
  } else {
    var midX = 20 + (W-30)*0.5;
    ctx.fillStyle = '#5BE0C0'; ctx.font = 'bold 11px ' + GS; ctx.textAlign = 'center';
    ctx.fillText('\u2714 V and i are IN PHASE  (\u03b8 = 0\u00b0)', midX, (p1Y + p2Y)/2);
  }

  /* Info box */
  var infoY = H - botMargin + 4;
  ctx.fillStyle = '#1A2535';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(10, infoY, W-20, botMargin-8, 8);
  else ctx.rect(10, infoY, W-20, botMargin-8);
  ctx.fill();
  ctx.strokeStyle = '#2A3A5A'; ctx.lineWidth = 1; ctx.stroke();

  ctx.fillStyle = '#E8EEF8'; ctx.font = 'bold 10px ' + GS; ctx.textAlign = 'left';
  ctx.fillText(lp.label + ' wall', 18, infoY + 14);
  ctx.fillStyle = '#AABBCC'; ctx.font = '9px ' + MONO;
  ctx.fillText(lp.desc, 18, infoY + 28);
  ctx.fillStyle = '#A78BFA'; ctx.font = 'bold 10px ' + MONO; ctx.textAlign = 'right';
  ctx.fillText('|Z| = ' + lp.zmag + ' \u03a9', W-14, infoY + 14);
  ctx.fillStyle = '#FFE066';
  ctx.fillText('\u03b8 = ' + lp.phase + '\u00b0', W-14, infoY + 28);
  ctx.textAlign = 'left';
}

/* ── Canvas subscript helper: draws "Z" + subscript letter ── */
/* ── Canvas ZL helper: draws Z with subscript capital L ── */
function fillTextZL(ctx, prefix, suffix, x, y, mainFont, col) {
  // Draws: [prefix] Z [subscript capital L] [suffix]
  // mainFont examples: "8px 'Google Sans',sans-serif"  or  "bold 8px 'JetBrains Mono',monospace"
  ctx.fillStyle   = col;
  ctx.font        = mainFont;
  ctx.textAlign   = 'left';
  var px = x;

  // prefix
  if (prefix) {
    ctx.fillText(prefix, px, y);
    px += ctx.measureText(prefix).width;
  }

  // Z (main size)
  ctx.fillText('Z', px, y);
  px += ctx.measureText('Z').width;

  // subscript L: extract numeric size from font string
  var sizeMatch = mainFont.match(/(\d+(?:\.\d+)?)px/);
  var mainSize  = sizeMatch ? parseFloat(sizeMatch[1]) : 9;
  var subSize   = Math.max(6, Math.round(mainSize * 0.72));
  var subDrop   = Math.round(mainSize * 0.30);
  // Build sub font — replace size in original font string
  var subFont   = mainFont.replace(/(\d+(?:\.\d+)?)px/, subSize + 'px');
  ctx.font = subFont;
  ctx.fillText('L', px, y + subDrop);
  px += ctx.measureText('L').width + 1;

  // suffix (restore main font)
  ctx.font = mainFont;
  if (suffix) {
    ctx.fillText(suffix, px, y);
  }
}



function drawJourneyCh5(ctx, W, H, t) {
  var GS   = "'Google Sans', sans-serif";
  var MONO = "'JetBrains Mono', monospace";

  ctx.fillStyle = '#152030'; ctx.fillRect(0, 0, W, H);

  // ── Proportional layout ──
  var blockH  = Math.max(44, H * 0.155);
  var blockY  = H * 0.12;
  var lineY   = blockY + blockH * 0.5;
  var fL      = Math.max(9,  W * 0.024);   // large label
  var fS      = Math.max(8,  W * 0.020);   // normal
  var fXS     = Math.max(7,  W * 0.017);   // small sub

  // Safe roundRect fill+stroke helper
  function rrect(x, y, w, h, r, fillCol, strokeCol, lw) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
    ctx.fillStyle   = fillCol;   ctx.fill();
    ctx.strokeStyle = strokeCol; ctx.lineWidth = lw || 1.5;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
    ctx.stroke();
  }

  // ── Block definitions ──
  var BLK = [
    { label:'RF\nGenerator',  sub:'Z\u209b = 50\u03a9',      col:'#0F8C50', x:W*0.02, w:W*0.17, coax:false },
    { label:'Coaxial\nCable', sub:'Z\u2080 = 50\u03a9',      col:'#0891B2', x:W*0.24, w:W*0.22, coax:true  },
    { label:'RF\nMatcher',    sub:'50\u03a9 \u2192 Z_L', col:'#7030A0', x:W*0.51, w:W*0.17, coax:false },
    { label:'Plasma\nChamber',sub:'Z_L = complex',       col:'#E87B1E', x:W*0.73, w:W*0.25, coax:false },
  ];

  // ── Connections ──
  var conns = [
    {a:BLK[0], b:BLK[1], col:'#0891B2', lbl:'50\u03a9', dash:false},
    {a:BLK[1], b:BLK[2], col:'#7030A0', lbl:'50\u03a9', dash:false},
    {a:BLK[2], b:BLK[3], col:'#E87B1E', lbl:'Z_L\u226050\u03a9', dash:true},
  ];
  conns.forEach(function(c, ci) {
    var x1 = c.a.x + c.a.w, x2 = c.b.x;
    ctx.strokeStyle = c.col; ctx.lineWidth = Math.max(2, W*0.005);
    ctx.setLineDash(c.dash ? [5,4] : []);
    ctx.beginPath(); ctx.moveTo(x1, lineY); ctx.lineTo(x2, lineY); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = c.dash ? '#E87B1E' : '#5BE0C0';
    ctx.font = 'bold ' + fXS + 'px ' + MONO; ctx.textAlign = 'center';
    ctx.fillText(c.lbl, (x1+x2)*0.5, lineY - blockH*0.18);
    if (!c.dash) {
      // flowing dot
      var dx = x1 + (x2-x1) * ((t*0.28) % 1);
      ctx.fillStyle = '#5BE0C0';
      ctx.beginPath(); ctx.arc(dx, lineY, Math.max(3, W*0.007), 0, Math.PI*2); ctx.fill();
    }
  });

  // ── Draw regular block ──
  function drawBlock(b) {
    rrect(b.x, blockY, b.w, blockH, 6, b.col+'22', b.col, Math.max(1.5, W*0.004));
    var lines = b.label.split('\n');
    var yStep = blockH * (lines.length > 1 ? 0.27 : 0);
    lines.forEach(function(l, li) {
      ctx.fillStyle = b.col; ctx.font = 'bold ' + fS + 'px ' + GS; ctx.textAlign = 'center';
      ctx.fillText(l, b.x + b.w*0.5, blockY + blockH*(lines.length>1 ? 0.29 : 0.44) + li*yStep);
    });
    ctx.fillStyle = '#CCDDEE'; ctx.font = fXS + 'px ' + MONO;
    ctx.fillText(b.sub, b.x + b.w*0.5, blockY + blockH*0.88);
  }

  // ── Draw coaxial cable ──
  function drawCoax(b) {
    var x1 = b.x, x2 = b.x + b.w, cy = lineY;
    var r = blockH * 0.40;
    // Body fill
    ctx.fillStyle = b.col + '14';
    ctx.fillRect(x1, cy-r, x2-x1, r*2);
    // Dielectric ticks
    ctx.strokeStyle = b.col + '35'; ctx.lineWidth = 0.8;
    for (var sx = x1+8; sx < x2-4; sx += 10) {
      ctx.beginPath(); ctx.moveTo(sx, cy-r+3); ctx.lineTo(sx, cy-r*0.38); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(sx, cy+r*0.38); ctx.lineTo(sx, cy+r-3); ctx.stroke();
    }
    // Outer sheath lines
    ctx.strokeStyle = b.col; ctx.lineWidth = Math.max(2, W*0.004);
    ctx.beginPath(); ctx.moveTo(x1, cy-r); ctx.lineTo(x2, cy-r); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x1, cy+r); ctx.lineTo(x2, cy+r); ctx.stroke();
    // Inner conductor
    ctx.strokeStyle = b.col; ctx.lineWidth = Math.max(2.5, W*0.005);
    ctx.beginPath(); ctx.moveTo(x1, cy); ctx.lineTo(x2, cy); ctx.stroke();
    // End-cap circles
    [x1 + r*0.95, x2 - r*0.95].forEach(function(ecx) {
      ctx.beginPath(); ctx.arc(ecx, cy, r*0.85, 0, Math.PI*2);
      ctx.fillStyle = b.col+'18'; ctx.fill();
      ctx.strokeStyle = b.col; ctx.lineWidth = Math.max(1.5, W*0.003); ctx.stroke();
      ctx.fillStyle = b.col;
      ctx.beginPath(); ctx.arc(ecx, cy, r*0.27, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = b.col+'55'; ctx.lineWidth = 0.7;
      [-0.45, 0, 0.45].forEach(function(dx) {
        var hx = ecx + dx*r*0.85;
        var hw = Math.sqrt(Math.max(0,(r*0.85)*(r*0.85)-(dx*r*0.85)*(dx*r*0.85)));
        ctx.beginPath(); ctx.moveTo(hx, cy-hw); ctx.lineTo(hx, cy-r*0.30); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(hx, cy+r*0.30); ctx.lineTo(hx, cy+hw); ctx.stroke();
      });
    });
    // Labels above
    var lblY = blockY - 4;
    ctx.fillStyle = '#CCDDEE'; ctx.font = fXS + 'px ' + MONO; ctx.textAlign = 'center';
    ctx.fillText('Z\u2080 = 50\u03a9', (x1+x2)*0.5, Math.max(fXS+1, lblY - fS - 2));
    ctx.fillStyle = b.col; ctx.font = 'bold ' + fS + 'px ' + GS;
    ctx.fillText('Coaxial Cable', (x1+x2)*0.5, Math.max(fS+1, lblY));
  }

  // Draw all
  drawBlock(BLK[0]);
  drawCoax(BLK[1]);
  drawBlock(BLK[2]);
  drawBlock(BLK[3]);

  // ── Condition box ──
  var condY = blockY + blockH + H*0.07;
  var condH = H * 0.12;
  rrect(W*0.05, condY, W*0.90, condH, 8, '#1E3040', '#5BE0C0', 1);
  ctx.fillStyle = '#E8EEF8'; ctx.font = 'bold ' + fS + 'px ' + GS; ctx.textAlign = 'center';
  ctx.fillText('Perfect Matching Condition:', W*0.5, condY + condH*0.32);
  // Draw: Zs = Z0 = ZL = 50Ω  centered, with subscript capital L
  var condFontSize = Math.round(fL * 1.1);
  var condFont     = 'bold ' + condFontSize + 'px ' + MONO;
  ctx.font = condFont; ctx.fillStyle = '#FFE066';
  var part1 = 'Z\u209b = Z\u2080 = Z';
  var part2 = ' = 50 \u03a9';
  var subSz = Math.max(7, Math.round(condFontSize * 0.72));
  var subFont = 'bold ' + subSz + 'px ' + MONO;
  ctx.font = subFont;
  var Lw = ctx.measureText('L').width;
  ctx.font = condFont;
  var p1w = ctx.measureText(part1).width;
  var p2w = ctx.measureText(part2).width;
  var totW = p1w + Lw + 1 + p2w;
  var cX = W*0.5 - totW*0.5;
  ctx.textAlign = 'left';
  ctx.fillText(part1, cX, condY + condH*0.75); cX += p1w;
  ctx.font = subFont;
  ctx.fillText('L', cX, condY + condH*0.75 + Math.round(condFontSize*0.30)); cX += Lw + 1;
  ctx.font = condFont;
  ctx.fillText(part2, cX, condY + condH*0.75);
  ctx.textAlign = 'center';

  // ── Two side-by-side note boxes ──
  var noteY = condY + condH + H*0.04;
  var noteH = H * 0.145;
  var nW    = W * 0.46;

  // Left box
  rrect(W*0.02, noteY, nW, noteH, 7, '#0A1E14', '#0F8C5066', 1);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#5BE0C0'; ctx.font = 'bold ' + fS + 'px ' + GS;
  ctx.fillText('Generator \u2192 Matcher Input', W*0.04, noteY + noteH*0.28);
  ctx.fillStyle = '#CCDDEE'; ctx.font = fXS + 'px ' + GS;
  ctx.fillText('Z\u209b = Z\u2080 = 50\u03a9  No reflection', W*0.04, noteY + noteH*0.55);
  ctx.fillStyle = '#5BE0C0'; ctx.font = 'bold ' + fXS + 'px ' + MONO;
  ctx.fillText('\u2714 100% delivered to Matcher input', W*0.04, noteY + noteH*0.82);

  // Right box
  var rx2 = W*0.52;
  rrect(rx2, noteY, nW, noteH, 7, '#1E0F00', '#E87B1E55', 1);
  ctx.fillStyle = '#E87B1E'; ctx.font = 'bold ' + fS + 'px ' + GS;
  ctx.fillText('Matcher \u2192 Plasma', rx2 + W*0.02, noteY + noteH*0.28);
  ctx.fillStyle = '#CCDDEE'; ctx.font = fXS + 'px ' + GS;
  ctx.fillStyle = '#CCDDEE'; ctx.font = fXS + 'px ' + GS;
  fillTextZL(ctx, '', ' (plasma)  ≠  50Ω  generally',
    rx2 + W*0.02, noteY + noteH*0.55,
    fXS + 'px ' + GS, '#CCDDEE');
  ctx.fillStyle = '#E87B1E'; ctx.font = 'bold ' + fXS + 'px ' + MONO;
  ctx.fillStyle = '#E87B1E'; ctx.font = 'bold ' + fXS + 'px ' + MONO;
  fillTextZL(ctx, '⚠ Matcher makes ', ' appear 50Ω to Generator',
    rx2 + W*0.02, noteY + noteH*0.82,
    'bold ' + fXS + 'px ' + MONO, '#E87B1E');

  // ── Why 50Ω ──
  var infoY = noteY + noteH + H*0.03;
  var infoH = H * 0.10;
  rrect(W*0.02, infoY, W*0.96, infoH, 7, '#111E2A', '#2A3A4A', 1);
  ctx.fillStyle = '#FFD066'; ctx.font = 'bold ' + fS + 'px ' + GS; ctx.textAlign = 'left';
  ctx.fillText('Why 50\u03a9?', W*0.04, infoY + infoH*0.40);
  ctx.fillStyle = '#CCDDEE'; ctx.font = fXS + 'px ' + GS;
  ctx.fillText('Max power (coaxial) \u224877\u03a9  |  Max voltage \u224830\u03a9', W*0.04, infoY + infoH*0.75);
  ctx.fillStyle = '#5BE0C0'; ctx.font = 'bold ' + fXS + 'px ' + MONO; ctx.textAlign = 'right';
  ctx.fillText('50\u03a9 = compromise \u2192 universal RF standard', W*0.97, infoY + infoH*0.75);
  ctx.textAlign = 'left';
}

      '<div onclick="gotoJourney(' + i + ')"'
      + ' style="flex:1;padding:10px 6px;text-align:center;cursor:pointer;'

      + '<div style="font-size:0.72rem;'

  return '<div class="d-wrap">'

    + '<span class="d-badge" style="background:linear-gradient(90deg,var(--teal),var(--purple))">'
    + '&#x1F5FA;&#xFE0F; Journey</span>'

    + (isEn

    + '</span></div>'
    + '<div class="d-body" style="padding:0">'
    + '<div style="display:flex;border-bottom:2px solid var(--border)">' + tabHtml + '</div>'
    + '<div id="journey-main" style="padding:22px 24px 16px;min-height:340px"></div>'
    + '<div style="display:flex;justify-content:space-between;align-items:center;'

    + '</div>'
    + '</div></div>';
}

    + buildZPEx('1 \u2212 j20', isEn ? 'Capacitive'           : '용량성 부하',           1,   -20)

window.switchZCalcTab = function(n) {
  var p1 = document.getElementById('zcPane1');
  var p2 = document.getElementById('zcPane2');
  var t1 = document.getElementById('zcTab1');
  var t2 = document.getElementById('zcTab2');
  if (!p1) return;
  if (n === 1) {
    p1.style.display = 'block'; p2.style.display = 'none';
    t1.style.borderBottom = '3px solid #7030A0'; t1.style.color = '#7030A0'; t1.style.fontWeight = '700';
    t2.style.borderBottom = '3px solid transparent'; t2.style.color = 'var(--text-sub)'; t2.style.fontWeight = '600';
    setTimeout(function() { if (window.runZCalc) runZCalc(); }, 30);
  } else {
    p1.style.display = 'none'; p2.style.display = 'block';
    t2.style.borderBottom = '3px solid #0F8C50'; t2.style.color = '#0F8C50'; t2.style.fontWeight = '700';
    t1.style.borderBottom = '3px solid transparent'; t1.style.color = 'var(--text-sub)'; t1.style.fontWeight = '600';
    setTimeout(function() { if (window.runZPolar) runZPolar(); }, 30);
  }
};

window.loadZEx = function(V, i, theta) {
  var eV = document.getElementById('zc-V');
  var ei = document.getElementById('zc-i');
  var et = document.getElementById('zc-theta');
  if (eV) eV.value = V;
  if (ei) ei.value = i;
  if (et) et.value = theta;
  runZCalc();
};

/* Keep backward compat */
window.loadZProblem = window.loadZEx;

window.loadZPEx = function(R, X) {
  var eR = document.getElementById('zp-R');
  var eX = document.getElementById('zp-X');
  if (eR) eR.value = R;
  if (eX) eX.value = X;
  runZPolar();
};

window.runZCalc = function() {
  var V     = parseFloat(document.getElementById('zc-V') && document.getElementById('zc-V').value) || 0;
  var i     = parseFloat(document.getElementById('zc-i') && document.getElementById('zc-i').value) || 1;
  var theta = parseFloat(document.getElementById('zc-theta') && document.getElementById('zc-theta').value) || 0;
  var res   = document.getElementById('zc-result');
  if (!res) return;
  if (i === 0) {
    res.innerHTML = '<span style="color:#FF6B6B">Error: i cannot be zero</span>';
    return;
  }
  var isEn  = currentLang === 'en';
  var Zmag  = V / i;
  var thRad = theta * Math.PI / 180;
  var R     = Zmag * Math.cos(thRad);
  var X     = Zmag * Math.sin(thRad);
  var Xabs  = Math.abs(X);
  var Xsign = X >= 0 ? '+' : '\u2212';
  var Xcol  = Xabs < 0.01 ? '#5BE0C0' : X > 0 ? '#E87B1E' : '#7030A0';
  var Xchr  = Xabs < 0.01
    ? (isEn ? 'Purely Resistive' : '순수 저항성')
    : X > 0 ? (isEn ? 'Inductive  [+jX]' : '유도성  Inductive [+jX]')
    :          (isEn ? 'Capacitive [\u2212jX]' : '용량성  Capacitive [\u2212jX]');

  res.innerHTML =
    '<span style="color:#AABBCC;font-size:0.75rem">'
    + (isEn ? '① Polar form' : '① 극형식') + '</span><br>'
    + '<span style="color:#A78BFA;font-weight:700">|Z|</span>'
    + '<span style="color:#E8EEF8"> = |V| / i = ' + V.toFixed(2) + ' / ' + i.toFixed(3) + ' = </span>'
    + '<span style="color:#FFE066;font-weight:700">' + Zmag.toFixed(3) + ' \u03a9</span>'
    + '<br>'
    + '<span style="color:#A78BFA;font-weight:700">\u03b8</span>'
    + '<span style="color:#E8EEF8"> = \u2220V \u2212 \u2220i = </span>'
    + '<span style="color:#FFE066;font-weight:700">' + theta.toFixed(2) + '\u00b0</span>'
    + '<br>'
    + '<span style="color:#FFE066;font-weight:700">Z = ' + Zmag.toFixed(3) + ' \u2220 ' + theta.toFixed(2) + '\u00b0 \u03a9</span>'
    + '<br>'
    + '<span style="color:#AABBCC;font-size:0.75rem">'
    + (isEn ? '② Exponential form' : '② 지수형식 (Exponential form)') + '</span><br>'
    + '<span style="color:#FFE066;font-weight:700">Z = ' + Zmag.toFixed(3) + ' \u00b7 e'
    + '<sup style="font-size:0.7em">j' + theta.toFixed(1) + '\u00b0</sup> \u03a9</span>'
    + '<br>'
    + '<span style="color:#AABBCC;font-size:0.75rem">'
    + (isEn ? '③ Rectangular form  Z = R + jX' : '③ 직교형식  Z = R + jX') + '</span><br>'
    + '<span style="color:#5B9BD5;font-weight:700">R = ' + R.toFixed(3) + ' \u03a9</span>'
    + ' <span style="color:' + Xcol + ';font-weight:700">' + Xsign + ' j' + Xabs.toFixed(3) + ' \u03a9</span>'
    + '<br>'
    + '<span style="color:' + Xcol + ';font-weight:700">\u25b6 ' + Xchr + '</span>';
};

window.runZPolar = function() {
  var R   = parseFloat(document.getElementById('zp-R') && document.getElementById('zp-R').value) || 0;
  var X   = parseFloat(document.getElementById('zp-X') && document.getElementById('zp-X').value) || 0;
  var res = document.getElementById('zp-result');
  if (!res) return;
  var isEn   = currentLang === 'en';
  var Zmag   = Math.sqrt(R*R + X*X);
  var thRad  = Math.atan2(X, R);
  var thDeg  = thRad * 180 / Math.PI;
  var Xabs   = Math.abs(X);
  var Xcol   = Xabs < 0.001 ? '#5BE0C0' : X > 0 ? '#E87B1E' : '#7030A0';
  var Xchr   = Xabs < 0.001
    ? (isEn ? 'Purely Resistive' : '순수 저항성')
    : X > 0 ? (isEn ? 'Inductive  [+jX]' : '유도성  Inductive [+jX]')
    :          (isEn ? 'Capacitive [\u2212jX]' : '용량성  Capacitive [\u2212jX]');
  var vswr   = Zmag > 0.01 && Math.abs(Zmag - 50) > 0.01
    ? ((Zmag + 50) / Math.abs(Zmag - 50)).toFixed(2) : '1.00';

  res.innerHTML =
    '<span style="color:#AABBCC;font-size:0.75rem">'
    + (isEn ? '① Rectangular form (input)' : '① 직교형식 (입력)') + '</span><br>'
    + '<span style="color:#5B9BD5;font-weight:700">Z = ' + R.toFixed(3) + '</span>'
    + ' <span style="color:' + Xcol + ';font-weight:700">' + (X >= 0 ? '+' : '\u2212') + ' j' + Xabs.toFixed(3) + '</span>'
    + '<span style="color:#E8EEF8"> \u03a9</span>'
    + '<br>'
    + '<span style="color:#AABBCC;font-size:0.75rem">'
    + (isEn ? '② Polar form' : '② 극형식') + '</span><br>'
    + '<span style="color:#E8EEF8">|Z| = \u221a(' + R.toFixed(2) + '\u00b2 + ' + (X>=0?'':'\u2212') + Xabs.toFixed(2) + '\u00b2) = </span>'
    + '<span style="color:#FFE066;font-weight:700">' + Zmag.toFixed(3) + ' \u03a9</span><br>'
    + '<span style="color:#E8EEF8">\u03b8 = arctan(' + (X >= 0 ? '' : '\u2212') + Xabs.toFixed(3) + ' / ' + R.toFixed(3) + ') = </span>'
    + '<span style="color:#FFE066;font-weight:700">' + thDeg.toFixed(2) + '\u00b0</span><br>'
    + '<span style="color:#FFE066;font-weight:700">Z = ' + Zmag.toFixed(3) + ' \u2220 ' + thDeg.toFixed(2) + '\u00b0 \u03a9</span>'
    + '<br>'
    + '<span style="color:#AABBCC;font-size:0.75rem">'
    + (isEn ? '③ Exponential form' : '③ 지수형식') + '</span><br>'
    + '<span style="color:#FFE066;font-weight:700">Z = ' + Zmag.toFixed(3) + ' \u00b7 e'
    + '<sup style="font-size:0.7em">j' + thDeg.toFixed(1) + '\u00b0</sup> \u03a9</span>'
    + '<br>'
    + '<span style="color:' + Xcol + ';font-weight:700">\u25b6 ' + Xchr + '</span>'
    + ' <span style="color:#5BE0C0;font-size:0.78rem">&nbsp; VSWR\u2248' + vswr + '</span>';
};

window.calcC32 = function() {
  var fVal   = parseFloat(document.getElementById('c32-f')?.value) || 0;
  var fMult  = parseFloat(document.getElementById('c32-funit')?.value) || 1e6;
  var Lval   = parseFloat(document.getElementById('c32-L')?.value) || 0;
  var Lmult  = parseFloat(document.getElementById('c32-Lunit')?.value) || 1e-6;
  var Cval   = parseFloat(document.getElementById('c32-C')?.value) || 0;
  var Cmult  = parseFloat(document.getElementById('c32-Cunit')?.value) || 1e-12;

  var f  = fVal  * fMult;
  var L  = Lval  * Lmult;
  var C  = Cval  * Cmult;
  var w  = 2 * Math.PI * f;

  var XL = w * L;
  var XC = C > 0 ? 1 / (w * C) : Infinity;
  var Xnet = XL - (isFinite(XC) ? XC : 0);
  var Xsign = Xnet >= 0 ? '+' : '−';
  var char  = Math.abs(Xnet) < 0.01 ? 'Resistive (Resonance!)' : Xnet > 0 ? 'Inductive (+jX)' : 'Capacitive (−jX)';
  var charCol = Math.abs(Xnet) < 0.01 ? '#5BE0C0' : Xnet > 0 ? '#E87B1E' : '#7030A0';

  var fDisp = f >= 1e6 ? (f/1e6).toFixed(4)+' MHz' : f >= 1e3 ? (f/1e3).toFixed(2)+' kHz' : f.toFixed(1)+' Hz';
  var LDisp = L >= 1e-3 ? (L*1e3).toFixed(4)+' mH' : L >= 1e-6 ? (L*1e6).toFixed(4)+' μH' : (L*1e9).toFixed(2)+' nH';
  var CDisp = C >= 1e-6 ? (C*1e6).toFixed(4)+' μF' : C >= 1e-9 ? (C*1e9).toFixed(4)+' nF' : (C*1e12).toFixed(2)+' pF';

  var xLEl = document.getElementById('c32-xL-result');
  var xCEl = document.getElementById('c32-xC-result');
  var zEl  = document.getElementById('c32-z-result');
  if (xLEl) xLEl.innerHTML =
    '<span style="color:#0A6E3A;font-weight:700">X_L</span> = 2π × '+fDisp+' × '+LDisp+
    ' = <span style="color:#0A4A7A;font-weight:700">'+XL.toFixed(3)+' Ω</span>';
  if (xCEl) xCEl.innerHTML =
    '<span style="color:#9B1C1C;font-weight:700">X_C</span> = 1/(2π × '+fDisp+' × '+CDisp+
    ') = <span style="color:#0A4A7A;font-weight:700">'+(isFinite(XC)?XC.toFixed(3):'∞')+' Ω</span>';
  if (zEl) zEl.innerHTML =
    '<span style="color:#5A22A0;font-weight:700">X_net</span> = X_L − X_C = '+(XL.toFixed(2))+' − '+(isFinite(XC)?XC.toFixed(2):'∞')+
    ' = <span style="color:'+charCol+';font-weight:700">'+Xsign+Math.abs(Xnet).toFixed(2)+' Ω</span><br>'+
    '<span style="color:#5A22A0;font-weight:700">Z</span> = R + j<span style="color:'+charCol+'">('+Xsign+Math.abs(Xnet).toFixed(2)+')</span> Ω'+
    ' &nbsp;<span style="color:'+charCol+';font-size:0.78rem;font-weight:700">▶ '+char+'</span>';

  drawC32Chart(f, L, C);
};

function drawC32Chart(fNow, L, C) {
  var canvas = document.getElementById('c32-chart');
  if (!canvas) return;
  var dpr = window.devicePixelRatio || 1;
  var W = canvas.offsetWidth, H = canvas.offsetHeight;
  if (!W || !H) return;
  canvas.width  = Math.round(W*dpr); canvas.height = Math.round(H*dpr);
  var ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr);

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#FAFBFF'; ctx.fillRect(0,0,W,H);

  var GS   = "'Google Sans',sans-serif";
  var MONO = "'JetBrains Mono',monospace";
  var pad  = { l:54, r:16, t:28, b:72 };   // taller bottom: room for x-labels + legend
  var cW   = W - pad.l - pad.r;
  var cH   = H - pad.t - pad.b;

  // Frequency range: 1 kHz to 3 GHz (log scale)
  var fMin = 1e3, fMax = 3e9;
  var nPts = 200;

  // Generate data
  var XLpts=[], XCpts=[], freqs=[];
  for (var i=0;i<=nPts;i++) {
    var lf = Math.log10(fMin) + (Math.log10(fMax)-Math.log10(fMin))*i/nPts;
    var fi = Math.pow(10,lf);
    var wi = 2*Math.PI*fi;
    freqs.push(fi);
    XLpts.push(wi*L);
    XCpts.push(C>0?1/(wi*C):Infinity);
  }

  // Y range: 0.1 Ω to 100 kΩ (log)
  var yMin=0.1, yMax=1e5;
  function xPos(f)  { return pad.l + cW*(Math.log10(f)-Math.log10(fMin))/(Math.log10(fMax)-Math.log10(fMin)); }
  function yPos(v)  { if(v<=0||!isFinite(v)) return pad.t; var ly=Math.log10(Math.max(yMin,Math.min(yMax,v))); return pad.t+cH*(1-(ly-Math.log10(yMin))/(Math.log10(yMax)-Math.log10(yMin))); }

  // Grid
  ctx.strokeStyle='#E8ECF4'; ctx.lineWidth=0.7;
  [1e3,1e4,1e5,1e6,1e7,1e8,1e9,3e9].forEach(f=>{
    var x=xPos(f); ctx.beginPath(); ctx.moveTo(x,pad.t); ctx.lineTo(x,pad.t+cH); ctx.stroke();
    ctx.fillStyle='#6B7A90'; ctx.font=`bold 11px ${GS}`; ctx.textAlign='center';
    var lbl=f>=1e9?(f/1e9).toFixed(f===3e9?1:0)+'G':f>=1e6?(f/1e6)+'M':f>=1e3?(f/1e3)+'k':f;
    ctx.fillText(lbl, x, pad.t+cH+16);
  });
  [0.1,1,10,100,1e3,1e4,1e5].forEach(v=>{
    var y=yPos(v); ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(pad.l+cW,y); ctx.stroke();
    ctx.fillStyle='#6B7A90'; ctx.font=`11px ${MONO}`; ctx.textAlign='right';
    ctx.fillText(v>=1e3?(v/1e3)+'k':v, pad.l-5, y+4);
  });

  // X_L line (green)
  ctx.strokeStyle='#0F8C50'; ctx.lineWidth=2.5; ctx.beginPath();
  XLpts.forEach((v,i)=>{ var x=xPos(freqs[i]),y=yPos(v); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
  ctx.stroke();

  // X_C line (red)
  ctx.strokeStyle='#C0392B'; ctx.lineWidth=2.5; ctx.beginPath();
  var started=false;
  XCpts.forEach((v,i)=>{ if(!isFinite(v)) return; var x=xPos(freqs[i]),y=yPos(v); started?(ctx.lineTo(x,y)):(ctx.moveTo(x,y),started=true); });
  ctx.stroke();

  // Intersection (resonance)
  for(var i=0;i<XLpts.length-1;i++){
    if(XLpts[i]<=XCpts[i]&&XLpts[i+1]>=XCpts[i+1]){
      var fr=(freqs[i]+freqs[i+1])/2;
      var xr=xPos(fr), yr=yPos(XLpts[i]);
      ctx.fillStyle='#FFE066'; ctx.beginPath(); ctx.arc(xr,yr,6,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#C8A000'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(xr,yr,6,0,Math.PI*2); ctx.stroke();
      // dark gray dashed vertical line
      ctx.strokeStyle='#555566'; ctx.lineWidth=1.2; ctx.setLineDash([4,3]);
      ctx.beginPath(); ctx.moveTo(xr,pad.t); ctx.lineTo(xr,pad.t+cH); ctx.stroke();
      ctx.setLineDash([]);
      // f_res label pill — raised well above x-axis tick row
      var frDisp=fr>=1e9?(fr/1e9).toFixed(2)+'G':fr>=1e6?(fr/1e6).toFixed(2)+'M':fr>=1e3?(fr/1e3).toFixed(1)+'k':fr.toFixed(0);
      var frLabel = 'f_res = '+frDisp;
      ctx.font=`bold 11px ${GS}`;
      var frLW = ctx.measureText(frLabel).width + 12;
      var frLH = 15;
      var frLX = Math.min(Math.max(xr - frLW/2, pad.l), pad.l+cW-frLW);
      var frLY = pad.t+cH - frLH - 6;   // inside chart, just above bottom edge
      ctx.fillStyle='#1A2035';
      if(ctx.roundRect) ctx.roundRect(frLX,frLY,frLW,frLH,3); else ctx.rect(frLX,frLY,frLW,frLH);
      ctx.fill();
      ctx.fillStyle='#FFE066'; ctx.textAlign='center';
      ctx.fillText(frLabel, frLX+frLW/2, frLY+11);
      break;
    }
  }

  // NOW marker (current f)
  var xNow=xPos(fNow);
  ctx.strokeStyle='#7030A0'; ctx.lineWidth=2; ctx.setLineDash([5,4]);
  ctx.beginPath(); ctx.moveTo(xNow,pad.t); ctx.lineTo(xNow,pad.t+cH); ctx.stroke();
  ctx.setLineDash([]);
  // NOW label above chart
  ctx.fillStyle='#fff'; ctx.strokeStyle='#7030A0'; ctx.lineWidth=1;
  var nowLblW=36, nowLblH=16, nowLblX=xNow-nowLblW/2, nowLblY=pad.t-nowLblH-3;
  if(nowLblX<pad.l) nowLblX=pad.l;
  if(nowLblX+nowLblW>pad.l+cW) nowLblX=pad.l+cW-nowLblW;
  ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(nowLblX,nowLblY,nowLblW,nowLblH,3); else ctx.rect(nowLblX,nowLblY,nowLblW,nowLblH);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle='#7030A0'; ctx.font=`bold 10px ${GS}`; ctx.textAlign='center';
  ctx.fillText('NOW', xNow, nowLblY+11);
  // Dots at current f
  var xLnow=2*Math.PI*fNow*L, xCnow=C>0?1/(2*Math.PI*fNow*C):0;
  [[xLnow,'#0F8C50'],[xCnow,'#C0392B']].forEach(([v,c])=>{
    if(v<=0||!isFinite(v)) return;
    ctx.fillStyle=c; ctx.beginPath(); ctx.arc(xNow,yPos(v),6,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(xNow,yPos(v),6,0,Math.PI*2); ctx.stroke();
  });

  // Axis label: frequency — row 1 below chart, ticks at +20, label at +56
  ctx.fillStyle='#4A5A6A'; ctx.font=`bold 12px ${GS}`; ctx.textAlign='center';
  ctx.fillText('Frequency', pad.l+cW/2, pad.t+cH+56);
  ctx.save(); ctx.translate(14, pad.t+cH/2); ctx.rotate(-Math.PI/2);
  ctx.fillText('Reactance (Ω)', 0, 0); ctx.restore();

  // Legend — row 2 (below axis label), left-aligned
  var legY1 = pad.t+cH+38;   // X_C row
  var legY2 = pad.t+cH+54;   // X_L row
  var legX  = pad.l;
  ctx.fillStyle='#C0392B'; ctx.fillRect(legX, legY1-5, 22, 4);
  ctx.fillStyle='#C0392B'; ctx.font=`bold 12px ${GS}`; ctx.textAlign='left';
  ctx.fillText('X_C  (↓ with f)', legX+26, legY1);
  ctx.fillStyle='#0F8C50'; ctx.fillRect(legX, legY2-5, 22, 4);
  ctx.fillStyle='#0F8C50';
  ctx.fillText('X_L  (↑ with f)', legX+26, legY2);
}

/* ── Init c32 after render ── */
window._initC32 = function() {
  calcC32();
};

        🔍 ${isEn ? 'View Full Infographic' : '전체 인포그래픽 보기'}
      </div>
    </div>

  </div>
</div>`;
}

/* ── c35 Calculator logic: bidirectional Z ↔ Γ ↔ VSWR ── */
window.calcC35 = function(source) {
  var Z0 = parseFloat(document.getElementById('c35-Z0')?.value) || 50;
  var isEn = currentLang === 'en';

  var R, X, Gmag, Gang, vswr;

  if (source === 'Z' || source === 'Z0') {
    R = parseFloat(document.getElementById('c35-R')?.value) || 0;
    X = parseFloat(document.getElementById('c35-X')?.value) || 0;
    // Γ = (Z - Z0) / (Z + Z0)
    var numRe = R - Z0, numIm = X;
    var denRe = R + Z0, denIm = X;
    var denMag2 = denRe*denRe + denIm*denIm;
    var GRe = (numRe*denRe + numIm*denIm) / denMag2;
    var GIm = (numIm*denRe - numRe*denIm) / denMag2;
    Gmag = Math.sqrt(GRe*GRe + GIm*GIm);
    Gang = Math.atan2(GIm, GRe) * 180/Math.PI;
    vswr = Gmag < 0.9999 ? (1+Gmag)/(1-Gmag) : 999;
    document.getElementById('c35-Gmag').value = Gmag.toFixed(4);
    document.getElementById('c35-Gang').value = Gang.toFixed(2);
    document.getElementById('c35-VSWR').value = vswr > 100 ? '999' : vswr.toFixed(3);

  } else if (source === 'Gamma') {
    Gmag = Math.min(0.9999, Math.max(0, parseFloat(document.getElementById('c35-Gmag')?.value) || 0));
    Gang = parseFloat(document.getElementById('c35-Gang')?.value) || 0;
    var GangR = Gang * Math.PI/180;
    var GRe2 = Gmag*Math.cos(GangR), GIm2 = Gmag*Math.sin(GangR);
    // Z = Z0 (1+Γ)/(1-Γ)
    var oneMinusRe = 1-GRe2, oneMinusIm = -GIm2;
    var onePlusRe = 1+GRe2, onePlusIm = GIm2;
    var dm2 = oneMinusRe*oneMinusRe + oneMinusIm*oneMinusIm;
    var ZRe = Z0*(onePlusRe*oneMinusRe + onePlusIm*oneMinusIm)/dm2;
    var ZIm = Z0*(onePlusIm*oneMinusRe - onePlusRe*oneMinusIm)/dm2;
    R = ZRe; X = ZIm;
    vswr = Gmag < 0.9999 ? (1+Gmag)/(1-Gmag) : 999;
    document.getElementById('c35-R').value = R.toFixed(3);
    document.getElementById('c35-X').value = X.toFixed(3);
    document.getElementById('c35-VSWR').value = vswr > 100 ? '999' : vswr.toFixed(3);

  } else if (source === 'VSWR') {
    vswr = Math.max(1, parseFloat(document.getElementById('c35-VSWR')?.value) || 1);
    Gmag = (vswr-1)/(vswr+1);
    Gang = parseFloat(document.getElementById('c35-Gang')?.value) || 0;  // keep existing phase
    var GangR2 = Gang*Math.PI/180;
    var GRe3 = Gmag*Math.cos(GangR2), GIm3 = Gmag*Math.sin(GangR2);
    var oneMinusRe2 = 1-GRe3, oneMinusIm2 = -GIm3;
    var onePlusRe2 = 1+GRe3, onePlusIm2 = GIm3;
    var dm3 = oneMinusRe2*oneMinusRe2 + oneMinusIm2*oneMinusIm2;
    R = Z0*(onePlusRe2*oneMinusRe2 + onePlusIm2*oneMinusIm2)/dm3;
    X = Z0*(onePlusIm2*oneMinusRe2 - onePlusRe2*oneMinusIm2)/dm3;
    document.getElementById('c35-Gmag').value = Gmag.toFixed(4);
    document.getElementById('c35-R').value = R.toFixed(3);
    document.getElementById('c35-X').value = X.toFixed(3);
  }

  // Re-read final consistent state
  R    = parseFloat(document.getElementById('c35-R')?.value) || 0;
  X    = parseFloat(document.getElementById('c35-X')?.value) || 0;
  Gmag = parseFloat(document.getElementById('c35-Gmag')?.value) || 0;
  Gang = parseFloat(document.getElementById('c35-Gang')?.value) || 0;
  vswr = parseFloat(document.getElementById('c35-VSWR')?.value) || 1;

  var Zmag = Math.sqrt(R*R+X*X);
  var Zang = Math.atan2(X,R)*180/Math.PI;
  var charStr = Math.abs(X) < 0.01 ? (isEn?'Resistive':'저항성') : X>0 ? (isEn?'Inductive':'유도성') : (isEn?'Capacitive':'용량성');

  document.getElementById('c35-Z-out').innerHTML =
    '<span style="color:#5A22A0;font-weight:700">Z</span> = '+R.toFixed(2)+(X>=0?' + j':' \u2212 j')+Math.abs(X).toFixed(2)+' \u03a9<br>'+
    '|Z| = '+Zmag.toFixed(2)+' \u03a9, \u2220Z = '+Zang.toFixed(1)+'\u00b0<br>'+
    '<span style="color:#7030A0">\u25b6 '+charStr+'</span>';

  document.getElementById('c35-Gamma-out').innerHTML =
    '<span style="color:#0A4A7A;font-weight:700">\u0393</span> = '+Gmag.toFixed(3)+' \u2220 '+Gang.toFixed(1)+'\u00b0<br>'+
    '= '+(Gmag*Math.cos(Gang*Math.PI/180)).toFixed(3)+(Gmag*Math.sin(Gang*Math.PI/180)>=0?' + j':' \u2212 j')+Math.abs(Gmag*Math.sin(Gang*Math.PI/180)).toFixed(3)+'<br>'+
    '<span style="color:#5B9BD5">'+(isEn?'Return Loss':'리턴로스')+' = '+(Gmag>0.0001?(-20*Math.log10(Gmag)).toFixed(1):'\u221e')+' dB</span>';

  var pctReflected = (Gmag*Gmag*100).toFixed(1);
  document.getElementById('c35-VSWR-out').innerHTML =
    '<span style="color:#8B6C00;font-weight:700">VSWR</span> = '+vswr.toFixed(2)+' : 1<br>'+
    (isEn?'Power reflected':'반사 전력') + ' = '+pctReflected+'%<br>'+
    '<span style="color:'+(vswr<1.5?'#0F8C50':vswr<2?'#E87B1E':'#C0392B')+'">'+
    (vswr<1.2?(isEn?'\u2714 Excellent match':'\u2714 매우 우수'):vswr<2?(isEn?'\u25b6 Acceptable':'\u25b6 양호'):(isEn?'\u26a0 Poor match':'\u26a0 매칭 불량'))+
    '</span>';

  drawC35Chart(Gmag, Gang, vswr);
  drawC35Smith(R, X, Z0, Gmag, Gang);
};

function drawC35Chart(Gmag, Gang, vswr) {
  var canvas = document.getElementById('c35-chart');
  if (!canvas) return;
  var dpr = window.devicePixelRatio||1;
  var W = canvas.offsetWidth, H = canvas.offsetHeight;
  if (!W||!H) return;
  canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
  var ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr);
  var GS="'Google Sans',sans-serif", MONO="'JetBrains Mono',monospace";
  var isEn = currentLang === 'en';

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#FAFBFF'; ctx.fillRect(0,0,W,H);

  var padL=44, padR=14, padT=14, padB=22;
  var cW=W-padL-padR, cH=H-padT-padB;
  var midY = padT+cH*0.5;
  var amp = cH*0.42;

  // Background
  ctx.fillStyle='#F0F5FF'; ctx.fillRect(padL,padT,cW,cH);

  // Zero line
  ctx.strokeStyle='#9AA5B8'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(padL,midY); ctx.lineTo(padL+cW,midY); ctx.stroke();

  // |Γ| envelope (constant magnitude, position-independent) — flat line at top showing VSWR bound
  var maxAmp = amp;  // represents Vmax
  var minAmp = amp * (vswr>0 ? (1/vswr) : 1);  // Vmin/Vmax ratio... actually represent as envelope

  // Standing wave pattern: |V(z)| = V0*sqrt(1+|Γ|²+2|Γ|cos(2βz+φ))
  var beta = 2*Math.PI*2.2;  // arbitrary spatial frequency for visualization
  var phR = Gang*Math.PI/180;
  ctx.strokeStyle='#5BE0C0'; ctx.lineWidth=2; ctx.beginPath();
  for(var px=padL; px<=padL+cW; px++){
    var zn=(px-padL)/cW;
    var d=1-zn; // distance from load (right side = load)
    var env = Math.sqrt(1+Gmag*Gmag+2*Gmag*Math.cos(2*beta*d+phR));
    var y = midY - amp*0.85*(env/(1+Gmag));
    px===padL?ctx.moveTo(px,y):ctx.lineTo(px,y);
  }
  ctx.stroke();
  // Mirror (lower envelope)
  ctx.beginPath();
  for(var px2=padL; px2<=padL+cW; px2++){
    var zn2=(px2-padL)/cW;
    var d2=1-zn2;
    var env2 = Math.sqrt(1+Gmag*Gmag+2*Gmag*Math.cos(2*beta*d2+phR));
    var y2 = midY + amp*0.85*(env2/(1+Gmag));
    px2===padL?ctx.moveTo(px2,y2):ctx.lineTo(px2,y2);
  }
  ctx.stroke();

  // Constant VSWR reference lines (dashed) — Vmax and Vmin bounds
  var vmaxY = midY - amp*0.85;
  var vminY = midY - amp*0.85*((1-Gmag)/(1+Gmag));
  ctx.strokeStyle='#C8A00088'; ctx.lineWidth=1; ctx.setLineDash([4,3]);
  ctx.beginPath(); ctx.moveTo(padL,vmaxY); ctx.lineTo(padL+cW,vmaxY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(padL,vminY); ctx.lineTo(padL+cW,vminY); ctx.stroke();
  ctx.setLineDash([]);

  // Labels
  ctx.fillStyle='#0F8C50'; ctx.font=`bold 10px ${GS}`; ctx.textAlign='left';
  ctx.fillText('|V(z)|', padL+4, padT+12);
  ctx.fillStyle='#8B6C00'; ctx.font=`9px ${MONO}`; ctx.textAlign='right';
  ctx.fillText('Vmax', padL+cW-4, vmaxY-3);
  ctx.fillText('Vmin', padL+cW-4, vminY+11);

  ctx.fillStyle='#6B7A90'; ctx.font=`9px ${GS}`; ctx.textAlign='center';
  ctx.fillText((isEn?'Position along line (load at right)':'선로상 위치 (오른쪽이 부하)'), padL+cW/2, H-6);
  ctx.save(); ctx.translate(12,midY); ctx.rotate(-Math.PI/2);
  ctx.fillText('|V|',0,0); ctx.restore();

  // VSWR value annotation
  ctx.fillStyle='#1A2035'; ctx.font=`bold 10px ${MONO}`; ctx.textAlign='left';
  ctx.fillText('VSWR = Vmax/Vmin = '+vswr.toFixed(2), padL+4, H-8);
}

/* ═══════════════════════════════════════════
   Smith Chart — plots normalized Z and Γ
   as the SAME point on the unit circle
═══════════════════════════════════════════ */
function drawC35Smith(R, X, Z0, Gmag, Gang) {
  var canvas = document.getElementById('c35-smith');
  if (!canvas) return;
  var dpr = window.devicePixelRatio||1;
  var W = canvas.offsetWidth, H = canvas.offsetHeight;
  if (!W||!H) return;
  canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
  var ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr);
  var GS="'Google Sans',sans-serif", MONO="'JetBrains Mono',monospace";
  var isEn = currentLang === 'en';

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#FAFBFF'; ctx.fillRect(0,0,W,H);

  var cx = W*0.42, cy = H*0.52;
  var rad = Math.min(W*0.40, H*0.42);

  // Normalized impedance
  var r = R / Z0, x = X / Z0;

  /* Helper: normalized-Z (r,x) → Smith chart (u,v) coordinates
     u = (r²+x²-1) / ((r+1)²+x²)
     v = 2x / ((r+1)²+x²)                      */
  function zToUV(rN, xN) {
    var den = (rN+1)*(rN+1) + xN*xN;
    return { u: (rN*rN + xN*xN - 1)/den, v: (2*xN)/den };
  }
  function uvToPx(u, v) { return { x: cx + u*rad, y: cy - v*rad }; }

  // ── Outer unit circle (|Γ|=1 boundary) ──
  ctx.strokeStyle='#444455'; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.arc(cx,cy,rad,0,Math.PI*2); ctx.stroke();

  // ── Constant-resistance circles (r = 0, 0.5, 1, 2, 5) ──
  ctx.strokeStyle='#B8C4D8'; ctx.lineWidth=0.8;
  [0, 0.2, 0.5, 1, 2, 5].forEach(function(rc) {
    // circle center (rc/(rc+1), 0), radius 1/(rc+1) in u-v space
    var ccx = rc/(rc+1), ccr = 1/(rc+1);
    var p = uvToPx(ccx, 0);
    ctx.beginPath(); ctx.arc(p.x, p.y, ccr*rad, 0, Math.PI*2); ctx.stroke();
  });

  // ── Constant-reactance arcs (x = ±0.2, ±0.5, ±1, ±2, ±5) ──
  ctx.strokeStyle='#C8D4E8'; ctx.lineWidth=0.8;
  [0.2, 0.5, 1, 2, 5].forEach(function(xc) {
    [1,-1].forEach(function(sign) {
      var xcv = sign*xc;
      // circle center (1, 1/xc), radius 1/xc — clip to unit circle
      var ccy = 1/xcv, ccr = Math.abs(1/xcv);
      var p = uvToPx(1, ccy);
      // draw arc segment that's inside the unit circle (approx via angle range)
      ctx.beginPath();
      var found = false;
      for (var deg=0; deg<=360; deg+=4) {
        var rad2 = deg*Math.PI/180;
        var ax = 1 + ccr*Math.cos(rad2);
        var ay = ccy + ccr*Math.sin(rad2);
        if (ax*ax+ay*ay <= 1.0001) {
          var pp = uvToPx(ax, ay);
          found ? ctx.lineTo(pp.x,pp.y) : (ctx.moveTo(pp.x,pp.y), found=true);
        } else { found=false; }
      }
      ctx.stroke();
    });
  });

  // ── Real axis (r-axis, x=0 line) ──
  ctx.strokeStyle='#8898B0'; ctx.lineWidth=1;
  var pL = uvToPx(-1,0), pR = uvToPx(1,0);
  ctx.beginPath(); ctx.moveTo(pL.x,pL.y); ctx.lineTo(pR.x,pR.y); ctx.stroke();

  // ── Key reference points ──
  // Center (r=1,x=0 → matched, Γ=0)
  var pCenter = uvToPx(0,0);
  ctx.fillStyle='#5BE0C0'; ctx.beginPath(); ctx.arc(pCenter.x,pCenter.y,3,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#0A6E3A'; ctx.font=`8px ${GS}`; ctx.textAlign='center';
  ctx.fillText(isEn?'Match':'매칭', pCenter.x, pCenter.y-7);

  // Open (r=∞ → right edge, Γ=1∠0°)
  var pOpen = uvToPx(1,0);
  ctx.fillStyle='#C0392B'; ctx.beginPath(); ctx.arc(pOpen.x,pOpen.y,2.5,0,Math.PI*2); ctx.fill();
  // Short (r=0 → left edge, Γ=1∠180°)
  var pShort = uvToPx(-1,0);
  ctx.fillStyle='#0F8C50'; ctx.beginPath(); ctx.arc(pShort.x,pShort.y,2.5,0,Math.PI*2); ctx.fill();

  // ── Plot current Z point (clamped to chart if outside) ──
  var uv = zToUV(Math.max(0,r), x);
  var mag = Math.sqrt(uv.u*uv.u + uv.v*uv.v);
  if (mag > 1) { uv.u /= mag; uv.v /= mag; }  // clamp visually
  var pZ = uvToPx(uv.u, uv.v);

  // Vector from center to point (Γ vector)
  ctx.strokeStyle='#7030A0'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(pZ.x,pZ.y); ctx.stroke();

  // Point marker — glow + dot
  var glow = ctx.createRadialGradient(pZ.x,pZ.y,0,pZ.x,pZ.y,14);
  glow.addColorStop(0,'#7030A055'); glow.addColorStop(1,'transparent');
  ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(pZ.x,pZ.y,14,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#7030A0'; ctx.beginPath(); ctx.arc(pZ.x,pZ.y,6,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(pZ.x,pZ.y,6,0,Math.PI*2); ctx.stroke();

  // Label: this single point IS both Z and Γ
  ctx.fillStyle='#5A22A0'; ctx.font=`bold 9px ${MONO}`; ctx.textAlign='left';
  ctx.fillText('Z = '+R.toFixed(1)+(X>=0?'+j':'\u2212j')+Math.abs(X).toFixed(1), pZ.x+10, pZ.y-4);
  ctx.fillStyle='#0A4A7A';
  ctx.fillText('\u0393 = '+Gmag.toFixed(2)+'\u2220'+Gang.toFixed(0)+'\u00b0', pZ.x+10, pZ.y+9);

  // ── Right side: small legend / key message ──
  ctx.fillStyle='#444455'; ctx.font=`bold 9px ${GS}`; ctx.textAlign='left';
  var legX = cx + rad + 14;
  if (legX + 60 < W) {
    ctx.fillText(isEn?'r = const':'r = 일정', legX, cy-rad*0.5);
    ctx.strokeStyle='#B8C4D8'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(legX,cy-rad*0.5+4); ctx.lineTo(legX+20,cy-rad*0.5+4); ctx.stroke();
    ctx.fillStyle='#444455';
    ctx.fillText(isEn?'x = const':'x = 일정', legX, cy-rad*0.5+18);
    ctx.strokeStyle='#C8D4E8';
    ctx.beginPath(); ctx.moveTo(legX,cy-rad*0.5+22); ctx.lineTo(legX+20,cy-rad*0.5+22); ctx.stroke();
  }

  // Bottom caption
  ctx.fillStyle='#6B7A90'; ctx.font=`8px ${GS}`; ctx.textAlign='center';
  ctx.fillText(isEn ? 'One point = both Z and Γ (normalized to Z\u2080)' : '한 점이 곧 Z이자 Γ (Z\u2080 기준 정규화)', cx, H-6);
}

function buildC31DeepLearn(isEn) {
  return isEn ? `
<div class="deep-section">
  <h3>Phasor Representation — The Mathematics Behind Z</h3>
  <p>For sinusoidal steady-state analysis, every voltage and current can be written as: v(t) = V_m cos(ωt + φ_V), i(t) = I_m cos(ωt + φ_I).</p>
  <p>Phasor form: Ṽ = V_m e^(jφ_V), Ĩ = I_m e^(jφ_I). Then Z = Ṽ/Ĩ = (V_m/I_m) e^(j(φ_V − φ_I)) = |Z|∠θ_z.</p>
  <p>The beauty: convolution in the time domain becomes simple complex division in the phasor domain. The entire AC circuit collapses to Ohm's law: Ṽ = ZĨ.</p>
  <h3>Impedance in the Complex Plane</h3>
  <p>Plotting Z = R + jX in the complex plane: the horizontal axis is R (energy dissipation), the vertical axis is X (energy storage). The first quadrant (X > 0) is inductive; the fourth quadrant (X < 0) is capacitive. The real axis (X = 0) is purely resistive. The impedance of a plasma — which varies with pressure, gas, and power — traces a path through this plane as process conditions change. The Smith Chart is a conformal mapping of this plane onto a circle.</p>
  <h3>Frequency Dependence</h3>
  <p>X_C = 1/(ωC) decreases with frequency — capacitors become "transparent" at high f. X_L = ωL increases with frequency — inductors become "walls" at high f. This is why RF matchers can transform impedances by selecting appropriate L and C values at the operating frequency (13.56 MHz).</p>
</div>` : `
<div class="deep-section">
  <h3>페이저 표현 — Z 이면의 수학</h3>
  <p>정현파 정상 상태 해석에서 모든 전압과 전류를 v(t) = V_m cos(ωt + φ_V), i(t) = I_m cos(ωt + φ_I)로 쓸 수 있습니다.</p>
  <p>페이저 형태: Ṽ = V_m e^(jφ_V), Ĩ = I_m e^(jφ_I). 그러면 Z = Ṽ/Ĩ = (V_m/I_m) e^(j(φ_V − φ_I)) = |Z|∠θ_z.</p>
  <p>아름다움: 시간 영역의 합성곱이 페이저 영역에서 단순한 복소수 나눗셈이 됩니다. 전체 AC 회로가 옴의 법칙으로 축약됩니다: Ṽ = ZĨ.</p>
  <h3>복소 평면에서의 임피던스</h3>
  <p>복소 평면에 Z = R + jX를 그리면: 수평축은 R(에너지 소비), 수직축은 X(에너지 저장)입니다. 1사분면(X > 0)은 유도성, 4사분면(X < 0)은 용량성. 실수축(X = 0)은 순저항입니다. 압력·가스·전력에 따라 변하는 플라즈마 임피던스는 이 평면 위의 경로를 그립니다. Smith Chart는 이 평면을 원 안으로 등각 변환한 것입니다.</p>
  <h3>주파수 의존성</h3>
  <p>X_C = 1/(ωC)는 주파수 증가에 따라 감소 — 커패시터는 고주파에서 "투명"해집니다. X_L = ωL은 주파수 증가에 따라 증가 — 인덕터는 고주파에서 "벽"이 됩니다. 이것이 RF Matcher가 동작 주파수(13.56 MHz)에서 적절한 L, C 값을 선택함으로써 임피던스를 변환할 수 있는 이유입니다.</p>
</div>`;
}
