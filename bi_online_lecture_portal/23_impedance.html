window.switchSimTab = function(n) {
  const p1 = document.getElementById('simPane1');
  const p2 = document.getElementById('simPane2');
  const t1 = document.getElementById('simTab1');
  const t2 = document.getElementById('simTab2');
  if (!p1 || !p2) return;
  const activeStyle  = 'background:var(--purple);color:#fff;font-weight:700';
  const inactiveStyle = 'background:transparent;color:var(--text-sub);font-weight:600';
  if (n === 1) {
    p1.style.display = 'block'; p2.style.display = 'none';
    t1.style.cssText = t1.style.cssText.replace(/background:[^;]+;color:[^;]+;font-weight:[^;]+/,'') + activeStyle;
    t2.style.cssText = t2.style.cssText.replace(/background:[^;]+;color:[^;]+;font-weight:[^;]+/,'') + inactiveStyle;
    setTimeout(initGravSim, 60);
  } else {
    p1.style.display = 'none'; p2.style.display = 'block';
    t1.style.cssText = t1.style.cssText.replace(/background:[^;]+;color:[^;]+;font-weight:[^;]+/,'') + inactiveStyle;
    t2.style.cssText = t2.style.cssText.replace(/background:[^;]+;color:[^;]+;font-weight:[^;]+/,'') + activeStyle;
    setTimeout(initEpotSim, 60);
  }
};

/* ═══════════════════════════════════════════
   SIMULATOR 1 — Gravitational Potential
═══════════════════════════════════════════ */
function initGravSim() {
  const canvas = document.getElementById('gravCanvas');
  if (!canvas) return;
  canvas.style.width  = '100%';  // allow CSS to dictate width before measurement
  canvas.style.height = '';
  const { ctx, W, H } = setupHiDPI(canvas);
  window._gravCtx = ctx; window._gravW = W; window._gravH = H;
  const h = parseFloat(document.getElementById('gravH')?.value || 5);
  const m = parseFloat(document.getElementById('gravM')?.value || 2);
  drawGravSim(ctx, W, H, h, m);
}

function updateGravSim() {
  const h = parseFloat(document.getElementById('gravH').value);
  const m = parseFloat(document.getElementById('gravM').value);
  document.getElementById('gravHVal').textContent = h.toFixed(1) + ' m';
  document.getElementById('gravMVal').textContent = m.toFixed(1) + ' kg';
  const PE = m * 9.8 * h;
  document.getElementById('gravInfo').textContent =
    `PE = mgh = ${m.toFixed(1)} × 9.8 × ${h.toFixed(1)} = ${PE.toFixed(1)} J`;
  if (window._gravCtx) drawGravSim(window._gravCtx, window._gravW, window._gravH, h, m);
}

function drawGravSim(ctx, W, H, h, m) {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0D1117'; ctx.fillRect(0, 0, W, H);

  const g    = 9.8;
  const PE   = m * g * h;
  const GS   = "'Google Sans', sans-serif";
  const MONO = "'JetBrains Mono', monospace";

  // ── 레이아웃 ──
  // 두 개의 패널: 왼쪽(Low PE) + 오른쪽(High PE)
  // 각 패널 = 담벼락 + 돌(위) + 사람(담벼락 옆 지면)
  const groundY = H - 22;
  const panelW  = W * 0.44;

  // Rock radius: mass 비례
  const rockR   = 9 + (m / 10) * 20;
  // Low PE 패널 고정 돌 크기 r=11
  const rockR1  = 11;

  // ──────────────────────────────────────────
  //  PANEL DRAW HELPER
  //  px: 패널 좌측 x
  //  wallX: 담벼락 x (패널 내 우측)
  //  rockDropH: 돌이 담벼락 위에서 얼마나 위에 있는지 (px)
  //  rR: 돌 반지름
  //  wallH: 담벼락 높이 (지면 기준)
  //  gold: 돌 색상
  //  scared: 사람 팔 올림 여부
  //  personCol: 사람 색
  //  wallCol: 담벼락 상단 테두리 색
  // ──────────────────────────────────────────
  function drawPanel(px, wallX, wallTotalH, rR, gold, scared, personCol, wallCol) {
    const wallTop = groundY - wallTotalH;

    // 담벼락 (세로 막대 — 오른쪽)
    const ww = 14;   // 담벼락 두께
    ctx.fillStyle = '#2A3550';
    ctx.fillRect(wallX, wallTop, ww, wallTotalH);
    ctx.strokeStyle = wallCol; ctx.lineWidth = 1.5;
    ctx.strokeRect(wallX, wallTop, ww, wallTotalH);

    // 높이 점선 (담벼락 오른쪽 내부)
    const arX = wallX + ww + 10;
    ctx.strokeStyle = '#556'; ctx.lineWidth = 1; ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(arX, wallTop); ctx.lineTo(arX, groundY); ctx.stroke();
    ctx.setLineDash([]);
    // 화살촉 위
    ctx.fillStyle = wallCol;
    ctx.beginPath(); ctx.moveTo(arX, wallTop); ctx.lineTo(arX-4,wallTop+8); ctx.lineTo(arX+4,wallTop+8); ctx.fill();
    // 화살촉 아래
    ctx.beginPath(); ctx.moveTo(arX, groundY); ctx.lineTo(arX-4,groundY-8); ctx.lineTo(arX+4,groundY-8); ctx.fill();
    // h 레이블
    ctx.fillStyle = wallCol; ctx.font = `11px ${GS}`;
    ctx.textAlign = 'left';
    ctx.fillText('h (m)', arX + 7, (wallTop + groundY)/2 + 4);

    // 돌 (담벼락 위에 띄워서 — 담벼락보다 rR*0.6 위)
    const rockCX = wallX + ww/2;
    const rockCY = wallTop - rR * 0.9;
    drawRock(rockCX, rockCY, rR, gold);

    // 사람 (담벼락 왼쪽, 지면에 서 있음)
    const personX = wallX - 28;
    drawPerson(personX, scared, personCol);
  }

  // ── 돌 그리기 ──
  function drawRock(cx, cy, r, gold) {
    // 불규칙한 돌 모양: 베지어 곡선으로
    ctx.save();
    ctx.translate(cx, cy);
    const pts = gold
      ? [[0,-r*0.95],[r*0.7,-r*0.5],[r*0.9,r*0.15],[r*0.4,r*0.75],[-r*0.3,r*0.85],[-r*0.85,r*0.3],[-r*0.75,-r*0.45]]
      : [[0,-r*0.9],[r*0.65,-r*0.55],[r*0.85,r*0.1],[r*0.35,r*0.7],[-r*0.25,r*0.8],[-r*0.8,r*0.25],[-r*0.7,-r*0.4]];
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i=0;i<pts.length;i++) {
      const n = pts[(i+1)%pts.length];
      const cx2 = (pts[i][0]+n[0])/2, cy2 = (pts[i][1]+n[1])/2;
      ctx.quadraticCurveTo(pts[i][0], pts[i][1], cx2, cy2);
    }
    ctx.closePath();
    ctx.fillStyle = gold ? '#C0A040' : '#8A9AAA';
    ctx.fill();
    // 하이라이트
    ctx.beginPath();
    ctx.ellipse(-r*0.2, -r*0.3, r*0.35, r*0.22, -0.5, 0, Math.PI*2);
    ctx.fillStyle = gold ? '#D8BC60' : '#AABBC8'; ctx.fill();
    ctx.strokeStyle = gold ? '#806010' : '#4A5A6A'; ctx.lineWidth = 1.5;
    // 외곽 다시
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i=0;i<pts.length;i++) {
      const n = pts[(i+1)%pts.length];
      const cx2 = (pts[i][0]+n[0])/2, cy2 = (pts[i][1]+n[1])/2;
      ctx.quadraticCurveTo(pts[i][0], pts[i][1], cx2, cy2);
    }
    ctx.closePath(); ctx.stroke();
    ctx.restore();
  }

  // ── 사람 그리기 (아이콘 스타일, 지면에 서 있음) ──
  function drawPerson(px, scared, col) {
    const footY  = groundY;
    const headR  = 7;
    const bodyH  = 24;
    const headY  = footY - bodyH - headR * 2 - 2;
    ctx.strokeStyle = col; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    // 머리 (원)
    ctx.beginPath(); ctx.arc(px, headY, headR, 0, Math.PI*2); ctx.stroke();
    // 몸
    ctx.beginPath(); ctx.moveTo(px, headY+headR); ctx.lineTo(px, headY+headR+bodyH); ctx.stroke();
    // 팔
    if (scared) {
      // 위로 치켜든 팔 (V자)
      ctx.beginPath();
      ctx.moveTo(px, headY+headR+7); ctx.lineTo(px-13, headY+headR-5);
      ctx.moveTo(px, headY+headR+7); ctx.lineTo(px+13, headY+headR-5);
      ctx.stroke();
    } else {
      // 자연스럽게 내린 팔
      ctx.beginPath();
      ctx.moveTo(px, headY+headR+9); ctx.lineTo(px-10, headY+headR+20);
      ctx.moveTo(px, headY+headR+9); ctx.lineTo(px+10, headY+headR+20);
      ctx.stroke();
    }
    // 다리
    ctx.beginPath();
    ctx.moveTo(px, headY+headR+bodyH); ctx.lineTo(px-7, footY);
    ctx.moveTo(px, headY+headR+bodyH); ctx.lineTo(px+7, footY);
    ctx.stroke();
    ctx.lineCap = 'butt';
  }

  // ── 지면 ──
  ctx.strokeStyle = '#3A4A5A'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(10, groundY); ctx.lineTo(W-10, groundY); ctx.stroke();

  // ── 왼쪽 패널: Low PE — 낮은 담벼락 고정 (h=3m) ──
  const leftPanelX = W * 0.04;
  const wallX1     = leftPanelX + panelW * 0.6;
  const fixedH     = 60;                // 낮은 담벼락 px 높이
  drawPanel(leftPanelX, wallX1, fixedH, rockR1, false, false, '#5BE0C0', '#5BE0C0');

  // ── 오른쪽 패널: High PE — 슬라이더 연동 ──
  const rightPanelX = W * 0.52;
  const wallX2      = rightPanelX + panelW * 0.55;
  const hNorm       = Math.min(h / 20, 1);
  const dynH        = 50 + hNorm * (H - 100);  // 최소 50px, 최대 H-100px
  const dynHCl      = Math.min(dynH, groundY - 16);
  drawPanel(rightPanelX, wallX2, dynHCl, rockR, true, true, '#FF6B6B', '#FFD066');

  // ⚠ 아이콘 (오른쪽 패널 사람 머리 위)
  const p2x = wallX2 - 28;
  const warnY = groundY - 24 - 7*2 - 24 - 14 - 12;
  ctx.fillStyle = '#FF4444'; ctx.font = `bold 13px ${GS}`;
  ctx.textAlign = 'center'; ctx.fillText('⚠', p2x, Math.max(warnY, 16));

  // ── PE 레이블 (각 패널 돌 위에 여백 확보) ──
  // 왼쪽: "Low PE"
  const r1top = (groundY - fixedH) - rockR1 * 0.9 - rockR1;
  ctx.fillStyle = '#5BE0C0'; ctx.font = `bold 12px ${GS}`;
  ctx.textAlign = 'center';
  ctx.fillText('Low PE', wallX1 + 7, Math.max(14, r1top - 10));

  // 오른쪽: 3줄 — High PE / PE=xJ / m=xkg
  const r2top = (groundY - dynHCl) - rockR * 0.9 - rockR;
  const l1y   = Math.max(14,  r2top - 34);
  const l2y   = Math.max(28,  r2top - 18);
  const l3y   = Math.max(42,  r2top -  4);
  ctx.fillStyle = '#FFD066'; ctx.font = `bold 12px ${GS}`;
  ctx.textAlign = 'center';
  ctx.fillText('High PE', wallX2 + 7, l1y);
  ctx.fillStyle = '#FFE066'; ctx.font = `bold 12px ${MONO}`;
  ctx.fillText(`PE = ${PE.toFixed(0)} J`, wallX2 + 7, l2y);
  ctx.fillStyle = '#AABBCC'; ctx.font = `10px ${MONO}`;
  ctx.fillText(`m=${m.toFixed(1)} kg`, wallX2 + 7, l3y);

  // ── 화살표: High → Low PE ──
  const arrY  = groundY - 10;
  const arrX1 = rightPanelX - 12;
  const arrX2 = leftPanelX + panelW + 6;
  if (arrX1 > arrX2 + 20) {
    ctx.strokeStyle = '#FF6B6B'; ctx.lineWidth = 2.5; ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(arrX1, arrY); ctx.lineTo(arrX2, arrY); ctx.stroke();
    ctx.fillStyle = '#FF6B6B';
    ctx.beginPath(); ctx.moveTo(arrX2, arrY); ctx.lineTo(arrX2+12, arrY-5); ctx.lineTo(arrX2+12, arrY+5); ctx.fill();
    ctx.fillStyle = '#FF6B6B'; ctx.font = `bold 10px ${GS}`;
    ctx.textAlign = 'center';
    ctx.fillText('Falls  (High → Low PE)', (arrX1+arrX2)/2, arrY-7);
  }

  // ── 수식 상단 좌측 ──
  ctx.fillStyle = '#A78BFA'; ctx.font = `bold 14px ${MONO}`;
  ctx.textAlign = 'left';
  ctx.fillText('PE = mgh  [J]', 12, 22);
  ctx.fillStyle = '#AABBCC'; ctx.font = `10px ${GS}`;
  ctx.fillText('g = 9.8 m/s²', 12, 38);
  ctx.textAlign = 'left';
}


/* ═══════════════════════════════════════════
   SIMULATOR 2 — Electric Potential (첨부6 스타일)
═══════════════════════════════════════════ */
let epotTestCharge = null;  // {x, y, r, V}

function initEpotSim() {
  const canvas = document.getElementById('epotCanvas');
  if (!canvas) return;
  canvas.style.width  = '100%';
  canvas.style.height = '';
  const { ctx, W, H } = setupHiDPI(canvas);
  window._epotCtx = ctx; window._epotW = W; window._epotH = H;
  epotTestCharge = null;
  const Q = parseFloat(document.getElementById('epotQ')?.value || 5);
  drawEpotSim(ctx, W, H, Q, null);
}

function updateEpotSim() {
  const Q = parseFloat(document.getElementById('epotQ').value);
  document.getElementById('epotQVal').textContent = (Q >= 0 ? '+' : '') + Q.toFixed(1) + ' nC';
  epotTestCharge = null;
  if (window._epotCtx) drawEpotSim(window._epotCtx, window._epotW, window._epotH, Q, null);
  document.getElementById('epotInfo').textContent =
    currentLang === 'en'
      ? 'Click on canvas to place a test charge and see V = kQ/r'
      : '캔버스를 클릭하여 테스트 전하를 놓고 V = kQ/r을 확인하세요';
}

function epotClick(evt) {
  const canvas = document.getElementById('epotCanvas');
  if (!canvas) return;
  const rect = canvas.getBoundingClientRect();
  const dpr  = window.devicePixelRatio || 1;
  const cx   = (evt.clientX - rect.left);
  const cy   = (evt.clientY - rect.top);
  const W    = window._epotW || rect.width;
  const H    = window._epotH || rect.height;
  const srcX = W * 0.38, srcY = H * 0.52;  // 소스 전하 위치
  const dx   = cx - srcX, dy = cy - srcY;
  const r_px = Math.sqrt(dx*dx + dy*dy);
  if (r_px < 16) return;   // 소스 전하 위 클릭 무시

  const Q = parseFloat(document.getElementById('epotQ').value);
  const k = 8.988e9;
  // 1px = 0.02m 스케일 가정
  const r_m = r_px * 0.02;
  const V   = k * (Q * 1e-9) / r_m;

  epotTestCharge = { x: cx, y: cy, r_m, V };
  if (window._epotCtx) drawEpotSim(window._epotCtx, W, H, Q, epotTestCharge);

  const isEn = currentLang === 'en';
  document.getElementById('epotInfo').innerHTML =
    `V = kQ/r = 8.988×10⁹ × ${Q.toFixed(1)}×10⁻⁹ / ${r_m.toFixed(2)} = <strong style="color:${V>=0?'#FF6B6B':'#5B9BD5'}">${V.toFixed(1)} V</strong>
     &nbsp;|&nbsp; r = ${r_m.toFixed(2)} m &nbsp;|&nbsp; PE (for 1C test) = ${V.toFixed(1)} J`;
}

function drawEpotSim(ctx, W, H, Q, testCharge) {
  const isEn = currentLang === 'en';
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0D1117'; ctx.fillRect(0, 0, W, H);

  const FONT  = '10px "JetBrains Mono",monospace';
  const BFONT = 'bold 11px "JetBrains Mono",monospace';
  const srcX  = W * 0.38, srcY = H * 0.52;

  // ── 등전위선 (동심원) ──
  const radii = [40, 70, 100, 135, 175];
  const posColor = ['#FF6B6B','#FF8888','#FFB0A0','#FFD0C8','#FFE8E0'];
  const negColor = ['#5B9BD5','#7AADDD','#99C0E5','#B8D3EE','#D4E7F7'];
  radii.forEach((r, i) => {
    const V_val = 8.988e9 * (Q*1e-9) / (r * 0.02);
    ctx.strokeStyle = Q >= 0 ? posColor[i] : negColor[radii.length-1-i];
    ctx.lineWidth = 1.2;
    ctx.setLineDash([3,4]);
    ctx.beginPath(); ctx.arc(srcX, srcY, r, 0, Math.PI*2); ctx.stroke();
    // V 레이블 (오른쪽)
    ctx.fillStyle = '#AABBCC'; ctx.font = FONT; ctx.textAlign = 'left';
    ctx.fillText(`${V_val.toFixed(0)} V`, srcX + r + 4, srcY + 4);
  });
  ctx.setLineDash([]);

  // ── 무한대(∞) → 소스 경로선 ──
  const infX = W - 20, infY = 18;
  ctx.strokeStyle = '#666'; ctx.lineWidth = 1;
  // 여러 경로 방향
  [[-0.7,-0.7],[-0.2,-0.9],[0.2,-0.9],[0.6,-0.8]].forEach(([dx,dy]) => {
    const endX = srcX + dx * 200, endY = srcY + dy * 200;
    if (endX > 0 && endX < W && endY > 0) {
      ctx.beginPath(); ctx.moveTo(srcX + dx*28, srcY + dy*28);
      ctx.lineTo(endX, endY); ctx.stroke();
    }
  });
  ctx.fillStyle = '#888'; ctx.font = 'bold 16px serif'; ctx.textAlign = 'right';
  ctx.fillText('∞', W - 10, 22);
  ctx.font = FONT; ctx.fillStyle = '#666'; ctx.textAlign = 'right';
  ctx.fillText(isEn ? 'S [m]' : 'S [m]', W - 30, 38);

  // ── 소스 전하 Q ──
  const qColor = Q >= 0 ? '#FF4444' : '#4488FF';
  ctx.fillStyle = qColor;
  ctx.beginPath(); ctx.arc(srcX, srcY, 20, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(Q >= 0 ? '+' : '−', srcX, srcY + 5);
  ctx.fillStyle = qColor; ctx.font = BFONT; ctx.textAlign = 'left';
  ctx.fillText(`Q = ${Q >= 0 ? '+' : ''}${Q.toFixed(1)} nC`, srcX + 26, srcY + 5);

  // ── 테스트 전하 ──
  if (testCharge) {
    const { x, y, r_m, V } = testCharge;
    // 테스트 전하 원
    ctx.fillStyle = '#FF6B6B';
    ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#FFE066'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('+', x, y + 4);

    // q=1C 레이블
    ctx.fillStyle = '#FFE066'; ctx.font = BFONT; ctx.textAlign = 'left';
    ctx.fillText('charge a = 1 [C]', x + 16, y - 4);

    // r 점선
    ctx.strokeStyle = '#888'; ctx.lineWidth = 1; ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(srcX, srcY); ctx.lineTo(x, y); ctx.stroke();
    ctx.setLineDash([]);

    // r 레이블
    const mx = (srcX + x)/2, my = (srcY + y)/2;
    ctx.fillStyle = '#AABBCC'; ctx.font = FONT; ctx.textAlign = 'center';
    ctx.fillText(`r = ${r_m.toFixed(2)} m`, mx, my - 8);

    // PE 공식 박스
    const boxX = Math.min(x + 20, W - 260), boxY = Math.max(y + 16, 10);
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.strokeStyle = '#FFE066'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(boxX, boxY, 245, 56, 6) : ctx.rect(boxX, boxY, 245, 56);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#FFE066'; ctx.font = 'bold 11px "JetBrains Mono",monospace';
    ctx.textAlign = 'left';
    ctx.fillText('P.E = E·S [Nm/C] = [J/C] = [Volts]', boxX + 8, boxY + 18);
    ctx.fillStyle = '#A78BFA'; ctx.font = 'bold 12px "JetBrains Mono",monospace';
    ctx.fillText(`= Voltage = ${V.toFixed(1)} V`, boxX + 8, boxY + 38);
  } else {
    // 안내 텍스트
    ctx.fillStyle = '#556'; ctx.font = BFONT; ctx.textAlign = 'center';
    ctx.fillText(isEn ? '← Click to place test charge (1C)' : '← 클릭하여 테스트 전하(1C) 배치', srcX + 110, srcY - 50);
  }

  // 수식 (좌상단)
  ctx.fillStyle = '#A78BFA'; ctx.font = 'bold 13px "JetBrains Mono",monospace';
  ctx.textAlign = 'left';
  ctx.fillText('V = kQ / r  [Volts]', 14, 22);
  ctx.fillStyle = '#AABBCC'; ctx.font = FONT;
  ctx.fillText('Electric Potential = Voltage', 14, 38);
  ctx.textAlign = 'left';
}

/* ═══════════════════════════════════════════
   SIMULATOR — Impedance V/I Phase (Topic 2)
═══════════════════════════════════════════ */
let impedAnim2 = null;

function initImpedSim() {
  const canvas = document.getElementById('impedCanvas');
  if (!canvas) return;
  if (impedAnim2) { cancelAnimationFrame(impedAnim2); impedAnim2 = null; }
  canvas.style.width  = '100%';
  canvas.style.height = '';
  const { ctx, W, H } = setupHiDPI(canvas);
  window._impedCtx = ctx; window._impedW = W; window._impedH = H;
  window._impedT = 0;
  window._impedR = 1; window._impedXc = 20; window._impedXl = 0;
  drawImpedLoop();
}

function drawImpedLoop() {
  drawImpedSim(window._impedCtx, window._impedW, window._impedH,
    window._impedR, window._impedXc, window._impedXl, window._impedT);
  window._impedT += 0.016;
  impedAnim2 = requestAnimationFrame(drawImpedLoop);
}

function updateImpedSim() {
  const R  = parseFloat(document.getElementById('rSlider').value);
  const Xc = parseFloat(document.getElementById('cSlider').value);
  const Xl = parseFloat(document.getElementById('lSlider').value);
  document.getElementById('rVal').textContent = R.toFixed(0) + ' Ω';
  document.getElementById('cVal').textContent = Xc.toFixed(0) + ' Ω';
  document.getElementById('lVal').textContent = Xl.toFixed(0) + ' Ω';
  window._impedR = R; window._impedXc = Xc; window._impedXl = Xl;
  const X = Xl - Xc;
  const Zmag = Math.sqrt(R*R + X*X);
  const phase = Math.atan2(X, R) * 180 / Math.PI;
  const isEn = currentLang === 'en';
  const type = X < -1 ? (isEn?'Capacitive (I leads V)':'용량성 (I가 V보다 앞섬)')
              : X >  1 ? (isEn?'Inductive (I lags V)' :'유도성 (I가 V보다 뒤짐)')
              : (isEn?'Resistive (in phase)':'저항성 (동위상)');
  document.getElementById('impedInfo').innerHTML =
    `Z = ${R}${X>=0?'+':'-'}${Math.abs(X).toFixed(0)}j Ω &nbsp;|&nbsp; |Z| = ${Zmag.toFixed(1)} Ω &nbsp;|&nbsp; Phase = ${phase.toFixed(1)}° &nbsp;|&nbsp; ${type}`;
}

function presetImpedSim(mode) {
  const presets = {
    'R' : [50, 0, 0],
    'C' : [1, 20, 0],
    'L' : [1, 0, 20],
    'RC': [1, 20, 0],
    '50': [50, 0, 0],
  };
  const [r,c,l] = presets[mode] || [1,20,0];
  document.getElementById('rSlider').value = r;
  document.getElementById('cSlider').value = c;
  document.getElementById('lSlider').value = l;
  updateImpedSim();
}

function drawImpedSim(ctx, W, H, R, Xc, Xl, t) {
  if (!ctx) return;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0D1117'; ctx.fillRect(0, 0, W, H);

  const X     = Xl - Xc;
  const Zmag  = Math.sqrt(R*R + X*X);
  const phase = Math.atan2(X, R);   // V leads I when phase > 0 (inductive)
  const GS    = "'Google Sans', sans-serif";
  const MONO  = "'JetBrains Mono', monospace";
  const BFONT = `bold 11px ${MONO}`;
  const SFONT = `10px ${MONO}`;
  const GSFONT = `10px ${GS}`;

  // ── Panel split: top 55% waveform, bottom 45% phasor ──
  const splitY = Math.round(H * 0.55);
  const vAmp   = splitY * 0.36;
  const omega  = Math.PI * 2;

  // I amplitude: normalised so pure R=50 → same visual size as V
  const normZ   = Math.max(Zmag, 0.5);
  const iAmpRaw = vAmp * (50 / normZ);
  const iAmp    = Math.min(iAmpRaw, vAmp * 1.55);

  // Wave travels LEFT → RIGHT: Generator (left) → Load/Plasma (right)
  // phase sign: positive phase means V peaks before I (inductive: I lags)
  const speed = 0.18;  // pixels per frame normalised

  // ── TOP PANEL: V(t) and I(t) waveforms ──
  // Grid lines
  ctx.strokeStyle = '#1A2535'; ctx.lineWidth = 1;
  for (let g = 1; g < 4; g++) {
    const gy = splitY * g / 4;
    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
  }
  // Zero-axis
  ctx.strokeStyle = '#2A3A50'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, splitY/2); ctx.lineTo(W, splitY/2); ctx.stroke();

  // Load wall (right side)
  ctx.fillStyle = '#374860';
  ctx.fillRect(W - 14, 0, 14, splitY);
  ctx.fillStyle = '#4A5E78';
  for (let wy = 6; wy < splitY - 6; wy += 10) {
    ctx.fillRect(W - 12, wy, 10, 6);
  }
  ctx.fillStyle = '#A78BFA'; ctx.font = `bold 9px ${GS}`;
  ctx.textAlign = 'center'; ctx.fillText('LOAD', W - 7, splitY - 4);

  // Generator symbol (left)
  ctx.strokeStyle = '#5BE0C0'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(18, splitY/2, 12, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = '#5BE0C0'; ctx.font = `bold 11px ${GS}`;
  ctx.textAlign = 'center'; ctx.fillText('~', 18, splitY/2 + 4);

  // V(t) wave — travels left→right (positive t direction)
  ctx.strokeStyle = '#5B9BD5'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let px = 34; px < W - 14; px++) {
    const xn  = (px - 34) / (W - 48);
    const val = vAmp * Math.sin(omega * (xn - t * speed));
    const y   = splitY * 0.5 - val;
    px === 34 ? ctx.moveTo(px, y) : ctx.lineTo(px, y);
  }
  ctx.stroke();

  // I(t) wave — phase shifted: positive phase = I lags V (inductive)
  ctx.strokeStyle = '#FF6B6B'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let px = 34; px < W - 14; px++) {
    const xn  = (px - 34) / (W - 48);
    const val = iAmp * Math.sin(omega * (xn - t * speed) - phase);
    const y   = splitY * 0.5 - val;
    px === 34 ? ctx.moveTo(px, y) : ctx.lineTo(px, y);
  }
  ctx.stroke();

  // V peak marker + I peak marker for phase arrow
  const cycleW    = W - 48;
  const tPhase    = (t * speed) % 1;
  const vPeakXn   = 0.25 + (1 - tPhase % 1);        // V peak normalised x
  const vPeakPx   = 34 + (vPeakXn % 1) * cycleW;
  const iPeakXn   = vPeakXn + phase / omega;
  const iPeakPx   = 34 + (iPeakXn % 1) * cycleW;

  // Phase difference annotation on waveform
  if (Math.abs(phase) > 0.05) {
    // Find actual current V peak position on screen
    const vPx = 34 + ((0.75 - tPhase + 1) % 1) * cycleW;
    const iPx = vPx + (phase / omega) * cycleW;
    if (iPx > 34 && iPx < W - 14 && vPx > 34 && vPx < W - 14) {
      const annotY = splitY * 0.12;
      ctx.strokeStyle = '#FFE066'; ctx.lineWidth = 1.2; ctx.setLineDash([3,3]);
      ctx.beginPath(); ctx.moveTo(vPx, annotY - 8); ctx.lineTo(vPx, splitY * 0.5 + vAmp * 0.3); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(iPx, annotY - 8); ctx.lineTo(iPx, splitY * 0.5 + vAmp * 0.3); ctx.stroke();
      ctx.setLineDash([]);
      // horizontal arrow
      ctx.strokeStyle = '#FFE066'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(vPx, annotY); ctx.lineTo(iPx, annotY); ctx.stroke();
      // arrowheads
      const dir = iPx > vPx ? 1 : -1;
      ctx.fillStyle = '#FFE066';
      ctx.beginPath(); ctx.moveTo(iPx, annotY); ctx.lineTo(iPx - dir*7, annotY-4); ctx.lineTo(iPx - dir*7, annotY+4); ctx.fill();
      ctx.font = `bold 10px ${MONO}`; ctx.textAlign = 'center';
      ctx.fillText(`Δφ = ${(phase * 180 / Math.PI).toFixed(1)}°`, (vPx + iPx)/2, annotY - 11);
    }
  }

  // V, I labels
  ctx.font = BFONT; ctx.textAlign = 'left';
  ctx.fillStyle = '#5B9BD5'; ctx.fillText('V(t)', 36, 14);
  ctx.fillStyle = '#FF6B6B'; ctx.fillText('I(t)', 36, 28);

  // Direction label
  ctx.fillStyle = '#3A6A4A'; ctx.font = `9px ${GS}`; ctx.textAlign = 'left';
  ctx.fillText('Generator →', 36, splitY - 6);
  ctx.fillStyle = '#A78BFA'; ctx.textAlign = 'right';
  ctx.fillText('→ Load (Plasma)', W - 18, splitY - 6);

  // Z display top-right
  ctx.fillStyle = '#A78BFA'; ctx.font = BFONT; ctx.textAlign = 'right';
  const zLabel = `Z = ${R}${X>=0?'+':'-'}${Math.abs(X).toFixed(0)}j Ω`;
  ctx.fillText(zLabel, W - 18, 14);
  ctx.fillText(`|Z| = ${Zmag.toFixed(1)} Ω`, W - 18, 28);
  ctx.textAlign = 'left';

  // ── DIVIDER ──
  ctx.strokeStyle = '#2A3550'; ctx.lineWidth = 1.5; ctx.setLineDash([5,4]);
  ctx.beginPath(); ctx.moveTo(0, splitY); ctx.lineTo(W, splitY); ctx.stroke();
  ctx.setLineDash([]);

  // ── BOTTOM PANEL: Phasor Diagram ──
  const pH   = H - splitY;
  const pCY  = splitY + pH * 0.5;
  const pCX  = W * 0.28;
  const pR   = Math.min(pH * 0.36, 65);   // phasor circle radius

  // Background label
  ctx.fillStyle = '#1E2D40';
  ctx.fillRect(0, splitY, W, pH);
  ctx.fillStyle = '#A78BFA'; ctx.font = `bold 10px ${GS}`;
  ctx.textAlign = 'left';
  ctx.fillText('Phasor Diagram  (V/I Phase Relationship)', 8, splitY + 14);

  // Phasor circle guide
  ctx.strokeStyle = '#2A3550'; ctx.lineWidth = 1; ctx.setLineDash([2,3]);
  ctx.beginPath(); ctx.arc(pCX, pCY, pR, 0, Math.PI*2); ctx.stroke();
  ctx.setLineDash([]);

  // Axes
  ctx.strokeStyle = '#3A4A5A'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pCX - pR*1.15, pCY); ctx.lineTo(pCX + pR*1.15, pCY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(pCX, pCY - pR*1.15); ctx.lineTo(pCX, pCY + pR*1.15); ctx.stroke();
  ctx.fillStyle = '#3A4A5A'; ctx.font = `9px ${MONO}`; ctx.textAlign = 'left';
  ctx.fillText('+R', pCX + pR + 4, pCY + 4);
  ctx.fillText('+jX', pCX + 3, pCY - pR - 4);

  // Rotating angle
  const rotT = t * speed * omega;

  // V phasor (reference, 0°) — blue
  const vPhaX = pCX + pR * Math.cos(-rotT);
  const vPhaY = pCY + pR * Math.sin(-rotT);
  ctx.strokeStyle = '#5B9BD5'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(pCX, pCY); ctx.lineTo(vPhaX, vPhaY); ctx.stroke();
  ctx.fillStyle = '#5B9BD5';
  ctx.beginPath(); ctx.arc(vPhaX, vPhaY, 5, 0, Math.PI*2); ctx.fill();
  ctx.font = `bold 10px ${GS}`; ctx.textAlign = 'left';
  ctx.fillText('V', vPhaX + 7, vPhaY + 4);

  // I phasor (lags V by phase if inductive, leads if capacitive) — red
  const iPhaX = pCX + pR * 0.8 * Math.cos(-rotT - phase);
  const iPhaY = pCY + pR * 0.8 * Math.sin(-rotT - phase);
  ctx.strokeStyle = '#FF6B6B'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(pCX, pCY); ctx.lineTo(iPhaX, iPhaY); ctx.stroke();
  ctx.fillStyle = '#FF6B6B';
  ctx.beginPath(); ctx.arc(iPhaX, iPhaY, 5, 0, Math.PI*2); ctx.fill();
  ctx.font = `bold 10px ${GS}`; ctx.textAlign = 'left';
  ctx.fillText('I', iPhaX + 7, iPhaY + 4);

  // Phase arc between V and I phasors
  if (Math.abs(phase) > 0.04) {
    const arcR  = pR * 0.35;
    const aStart = -rotT - phase;
    const aEnd   = -rotT;
    ctx.strokeStyle = '#FFE066'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(pCX, pCY, arcR,
            Math.min(aStart, aEnd), Math.max(aStart, aEnd));
    ctx.stroke();
    const arcMid = (aStart + aEnd) / 2;
    ctx.fillStyle = '#FFE066'; ctx.font = `bold 9px ${MONO}`;
    ctx.textAlign = 'center';
    ctx.fillText(`${(phase*180/Math.PI).toFixed(0)}°`,
      pCX + (arcR + 12) * Math.cos(arcMid),
      pCY + (arcR + 12) * Math.sin(arcMid));
  }

  // ── Right side: interpretation text ──
  const txtX  = pCX + pR + 30;
  const txtW  = W - txtX - 12;
  const txtY0 = splitY + 28;

  // Determine load character
  let charLine, charCol;
  if (Math.abs(X) < 1) {
    charLine = 'Purely Resistive';
    charCol  = '#5BE0C0';
  } else if (X > 0) {
    charLine = 'Inductive  (I lags V)';
    charCol  = '#FF9944';
  } else {
    charLine = 'Capacitive  (I leads V)';
    charCol  = '#A78BFA';
  }

  ctx.fillStyle = charCol; ctx.font = `bold 11px ${GS}`;
  ctx.textAlign = 'left';
  ctx.fillText(charLine, txtX, txtY0);

  const rows = [
    [`Z = ${R} ${X>=0?'+':'-'} ${Math.abs(X).toFixed(0)}j  Ω`, '#A78BFA'],
    [`|Z| = ${Zmag.toFixed(2)} Ω`, '#CCDDEE'],
    [`Phase (V→I) = ${(phase*180/Math.PI).toFixed(1)}°`, '#FFE066'],
    [`VSWR ≈ ${Zmag > 0.1 ? ((Zmag+50)/Math.abs(Zmag-50+0.001)).toFixed(2) : '1.00'}`, '#5BE0C0'],
  ];
  rows.forEach(([txt, col], i) => {
    ctx.fillStyle = col; ctx.font = `11px ${MONO}`;
    ctx.fillText(txt, txtX, txtY0 + 20 + i * 18);
  });

  // V/I label reminder
  const legY = H - 10;
  ctx.fillStyle = '#5B9BD5'; ctx.font = `bold 9px ${GS}`; ctx.textAlign = 'left';
  ctx.fillStyle = '#5B9BD5'; ctx.fillRect(txtX, legY - 8, 10, 8);
  ctx.fillStyle = '#EEE'; ctx.fillText(' V(t)', txtX + 12, legY);
  ctx.fillStyle = '#FF6B6B'; ctx.fillRect(txtX + 56, legY - 8, 10, 8);
  ctx.fillStyle = '#EEE'; ctx.fillText(' I(t)', txtX + 68, legY);
}

window._c31Load    = 'resistive';
var _c31AnimId     = null;
var _c31T          = 0;

var C31_LOADS = {
  'resistive':  { R:50,   X:0,     phase:0,   label:'Resistive',       col:'#0891B2', Rhl:true,  Xhl:false, Xsign:0  },
  'inductive':  { R:0,    X:70.7,  phase:90,  label:'Pure Inductive',  col:'#E87B1E', Rhl:false, Xhl:true,  Xsign:1  },
  'capacitive': { R:0,    X:-70.7, phase:-90, label:'Pure Capacitive', col:'#7030A0', Rhl:false, Xhl:true,  Xsign:-1 },
  'rlc-ind':    { R:30,   X:40,    phase:53,  label:'RLC (Inductive)', col:'#0F8C50', Rhl:true,  Xhl:true,  Xsign:1  },
  'rlc-cap':    { R:30,   X:-40,   phase:-53, label:'RLC (Capacitive)',col:'#C0392B', Rhl:true,  Xhl:true,  Xsign:-1 },
  'matched':    { R:50,   X:0,     phase:0,   label:'★ 50Ω Match',    col:'#F7C948', Rhl:true,  Xhl:false, Xsign:0  },
};

window.setC31Load = function(type) {
  window._c31Load = type;
  /* Update button styles */
  document.querySelectorAll('.c31-load-btn').forEach(function(btn) {
    var id  = btn.dataset.load;
    var lp  = C31_LOADS[id];
    if (!lp) return;
    var act = id === type;
    btn.style.background = act ? lp.col : 'transparent';
    btn.style.color      = act ? '#fff' : lp.col;
  });
  updateC31Formula(type);
  /* Redraw waveform (static) */
  drawC31Wave();
  drawC31LoadSymbol();
};

function updateC31Formula(type) {
  var lp = C31_LOADS[type];
  if (!lp) return;
  var isEn = currentLang === 'en';

  /* Formula highlight */
  var elR  = document.getElementById('c31-r');
  var elX  = document.getElementById('c31-x');
  var elPm = document.getElementById('c31-pm');
  var elRS = document.getElementById('c31-r-sym');
  var elXS = document.getElementById('c31-x-sym');
  var valEl = document.getElementById('c31-values');

  var DIM    = '#3A4050';
  var BRIGHT = '#E8EEF8';
  var Rcol   = '#5B9BD5', Xcol = lp.Xsign >= 0 ? '#E87B1E' : '#7030A0';

  if (elR)  { elR.style.color  = lp.Rhl ? Rcol : DIM; elR.style.textShadow  = lp.Rhl ? '0 0 18px '+Rcol+'88' : 'none'; }
  if (elRS) { elRS.style.color = lp.Rhl ? Rcol : DIM; }
  if (elX)  { elX.style.color  = lp.Xhl ? Xcol : DIM; elX.style.textShadow  = lp.Xhl ? '0 0 18px '+Xcol+'88' : 'none'; }
  if (elXS) { elXS.style.color = lp.Xhl ? Xcol : DIM; }
  if (elPm) { elPm.style.color = lp.Xsign < 0 ? '#7030A0' : lp.Xsign > 0 ? '#E87B1E' : '#555'; elPm.textContent = lp.Xsign < 0 ? '−' : '±'; }

  /* Value display */
  var Xabs = Math.abs(lp.X);
  var Zmag = Math.sqrt(lp.R*lp.R + lp.X*lp.X).toFixed(1);
  var Xstr = lp.X === 0 ? 'X = 0 (no reactance)' : (lp.X > 0 ? '+' : '−') + Xabs.toFixed(1) + ' Ω';
  var charStr = lp.Xsign === 0 ? (isEn ? 'Purely Resistive' : '순수 저항성')
              : lp.Xsign > 0  ? (isEn ? 'Inductive (+jX)' : '유도성 (+jX)')
              :                  (isEn ? 'Capacitive (−jX)' : '용량성 (−jX)');
  if (valEl) {
    valEl.innerHTML =
      '<span style="color:#5B9BD5">R = ' + lp.R + ' Ω</span>'
      + '  &nbsp;  '
      + '<span style="color:' + (lp.X===0?'#555':Xcol) + '">X = ' + (lp.X > 0 ? '+' : '') + lp.X + ' Ω</span>'
      + '  &nbsp;  '
      + '<span style="color:#FFE066">|Z| = ' + Zmag + ' Ω</span>'
      + '  &nbsp;  '
      + '<span style="color:#A78BFA">&theta; = ' + lp.phase + '°</span>'
      + '  &nbsp;  '
      + '<span style="color:' + lp.col + '">' + charStr + '</span>';
  }
}

function initC31Sim() {
  window._c31Load = window._c31Load || 'resistive';
  _c31T = 0;
  /* Setup wave canvas */
  var wc = document.getElementById('c31Canvas');
  if (wc) {
    wc.style.width  = '100%';
    wc.style.height = '';
    var hw = setupHiDPI(wc);
    window._c31Ctx = hw.ctx; window._c31W = hw.W; window._c31H = hw.H;
  }
  /* Setup load canvas */
  var lc = document.getElementById('c31LoadCanvas');
  if (lc) {
    var dpr = window.devicePixelRatio || 1;
    lc.width  = 160 * dpr; lc.height = 260 * dpr;
    lc.style.width = '160px'; lc.style.height = '260px';
    window._c31LCtx = lc.getContext('2d');
    window._c31LCtx.scale(dpr, dpr);
  }
  updateC31Formula(window._c31Load);
  drawC31Wave();
  drawC31LoadSymbol();
}

function drawC31Wave() {
  var ctx = window._c31Ctx, W = window._c31W, H = window._c31H;
  if (!ctx) return;
  var lp = C31_LOADS[window._c31Load] || C31_LOADS['resistive'];
  var isEn = currentLang === 'en';
  var GS = "'Google Sans',sans-serif", MONO = "'JetBrains Mono',monospace";

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#0D1117'; ctx.fillRect(0,0,W,H);

  var topM = 38, botM = 44, midM = 22;
  var panH = (H - topM - botM - midM) / 2;
  var p1Y  = topM + panH * 0.5;   // V axis
  var p2Y  = topM + panH + midM + panH * 0.5;   // i axis
  var ampV = panH * 0.40, ampI = panH * 0.38;
  var freq = 2.0, omega = Math.PI * 2 * freq;
  var phR  = lp.phase * Math.PI / 180;

  /* Panel BGs */
  ctx.fillStyle = '#0D1520'; ctx.fillRect(0, 0, W, topM + panH + midM*0.5);
  ctx.fillStyle = '#131B28'; ctx.fillRect(0, topM + panH + midM*0.5, W, H);

  /* Zero axes */
  ctx.strokeStyle = '#1E2D4088'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(20, p1Y); ctx.lineTo(W-10, p1Y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(20, p2Y); ctx.lineTo(W-10, p2Y); ctx.stroke();

  /* V(t) */
  ctx.strokeStyle = '#5B9BD5'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (var px = 20; px < W-10; px++) {
    var xn = (px-20)/(W-30);
    var vy = p1Y - ampV * Math.sin(omega * xn);
    px===20 ? ctx.moveTo(px,vy) : ctx.lineTo(px,vy);
  }
  ctx.stroke();

  /* i(t) */
  ctx.strokeStyle = '#FF6B6B'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (var px2 = 20; px2 < W-10; px2++) {
    var xn2 = (px2-20)/(W-30);
    var iy  = p2Y - ampI * Math.sin(omega*xn2 - phR);
    px2===20 ? ctx.moveTo(px2,iy) : ctx.lineTo(px2,iy);
  }
  ctx.stroke();

  /* Phase annotation */
  if (Math.abs(lp.phase) > 1) {
    var vPkX = 20 + (W-30)*(0.25/freq);
    var iPkX = vPkX + (phR/omega)*(W-30);
    if (vPkX>20 && vPkX<W-10 && iPkX>20 && iPkX<W-10) {
      ctx.strokeStyle='#FFE066'; ctx.lineWidth=1.2; ctx.setLineDash([4,3]);
      ctx.beginPath(); ctx.moveTo(vPkX,p1Y-ampV-2); ctx.lineTo(vPkX,p2Y+ampI+2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(iPkX,p1Y-ampV-2); ctx.lineTo(iPkX,p2Y+ampI+2); ctx.stroke();
      ctx.setLineDash([]);
      var arrY = (p1Y+p2Y)/2;
      ctx.strokeStyle='#FFE066'; ctx.lineWidth=1.8;
      ctx.beginPath(); ctx.moveTo(vPkX,arrY); ctx.lineTo(iPkX,arrY); ctx.stroke();
      var dir = iPkX>vPkX?1:-1;
      ctx.fillStyle='#FFE066';
      ctx.beginPath(); ctx.moveTo(iPkX,arrY); ctx.lineTo(iPkX-dir*9,arrY-5); ctx.lineTo(iPkX-dir*9,arrY+5); ctx.fill();
      ctx.fillStyle='#FFE066'; ctx.font='bold 11px '+MONO; ctx.textAlign='center';
      ctx.fillText('\u0394\u03c6 = '+lp.phase+'\u00b0', (vPkX+iPkX)/2, arrY-10);
      var dirLbl = lp.phase>0 ? (isEn?'i lags V':'i가 V보다 뒤짐') : (isEn?'i leads V':'i가 V보다 앞섬');
      ctx.font='9px '+GS; ctx.fillText(dirLbl, (vPkX+iPkX)/2, arrY+20);
      ctx.fillStyle='#5B9BD5'; ctx.beginPath(); ctx.arc(vPkX,p1Y-ampV,5,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#FF6B6B'; ctx.beginPath(); ctx.arc(iPkX,p2Y-ampI,5,0,Math.PI*2); ctx.fill();
    }
  } else {
    ctx.fillStyle='#5BE0C0'; ctx.font='bold 11px '+GS; ctx.textAlign='center';
    ctx.fillText(isEn?'\u2714 V and i in phase (\u03b8=0\u00b0)':'\u2714 V\uc640 i \ub3d9\uc704\uc0c1 (\u03b8=0\u00b0)', W/2, (p1Y+p2Y)/2);
  }

  /* Labels */
  ctx.fillStyle='#5B9BD5'; ctx.font='bold 11px '+GS; ctx.textAlign='left';
  ctx.fillText('V(t)', 24, topM-8);
  ctx.fillStyle='#AABBCC'; ctx.font='9px '+GS; ctx.fillText(isEn?'Voltage':'전압', 24, topM-20);
  ctx.fillStyle='#FF6B6B'; ctx.font='bold 11px '+GS;
  ctx.fillText('i(t)', 24, topM+panH+midM-8);
  ctx.fillStyle='#AABBCC'; ctx.font='9px '+GS; ctx.fillText(isEn?'Current':'전류', 24, topM+panH+midM-20);

  /* Info box */
  var iY = H-botM+4;
  ctx.fillStyle='#1A2535';
  ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(8,iY,W-16,botM-6,6); else ctx.rect(8,iY,W-16,botM-6); ctx.fill();
  ctx.fillStyle=lp.col; ctx.font='bold 10px '+GS; ctx.textAlign='left';
  ctx.fillText(lp.label+' wall', 16, iY+14);
  ctx.fillStyle='#5B9BD5'; ctx.font='bold 10px '+MONO; ctx.textAlign='right';
  ctx.fillText('|Z|='+Math.sqrt(lp.R*lp.R+lp.X*lp.X).toFixed(1)+'\u03a9', W-16, iY+14);
  ctx.fillStyle='#FFE066';
  ctx.fillText('\u03b8='+lp.phase+'\u00b0', W-16, iY+28);
  ctx.textAlign='left';
}

function drawC31LoadSymbol() {
  var ctx = window._c31LCtx;
  if (!ctx) return;
  var W=160, H=260;
  var lp = C31_LOADS[window._c31Load] || C31_LOADS['resistive'];
  var type = window._c31Load;
  var isEn = currentLang === 'en';
  var GS = "'Google Sans',sans-serif", MONO = "'JetBrains Mono',monospace";

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0D1117'; ctx.fillRect(0,0,W,H);

  var cx=W/2, cy=H/2, col=lp.col;

  /* Title */
  ctx.fillStyle=col; ctx.font='bold 10px '+GS; ctx.textAlign='center';
  ctx.fillText(isEn?'Load Symbol':'부하 기호', cx, 18);

  /* Connecting wire top */
  ctx.strokeStyle='#5BE0C0'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(cx,24); ctx.lineTo(cx,cy-44); ctx.stroke();

  /* Component symbol */
  if (type==='resistive' || type==='matched') {
    /* Resistor: zigzag */
    var rx=cx-22, ry=cy-36, rw=44, rh=72;
    ctx.strokeStyle=col; ctx.lineWidth=2;
    ctx.strokeRect(rx,ry,rw,rh);
    ctx.fillStyle=col+'22'; ctx.fillRect(rx,ry,rw,rh);
    /* Zigzag inside */
    ctx.strokeStyle=col; ctx.lineWidth=1.5;
    ctx.beginPath();
    var zx=rx+4, step=rh/6;
    ctx.moveTo(zx,ry+4);
    for(var zi=0;zi<6;zi++){
      ctx.lineTo(zx+(zi%2===0?rw-8:0),ry+4+step*(zi+0.5));
    }
    ctx.lineTo(zx,ry+rh-4);
    ctx.stroke();
    /* Label */
    ctx.fillStyle=col; ctx.font='bold 10px '+MONO; ctx.textAlign='center';
    ctx.fillText(type==='matched'?'50\u03a9':'R', cx, cy+56);
    ctx.fillStyle='#CCDDEE'; ctx.font='8px '+GS;
    ctx.fillText(type==='matched'?(isEn?'Perfect match':'\uc644\uc804 \ub9e4\uce6d'):(isEn?'Resistance':'\uc800\ud56d'), cx, cy+68);

  } else if (type==='inductive') {
    /* Inductor: coil arcs */
    ctx.strokeStyle=col; ctx.lineWidth=2;
    var coilY=cy-30, coilR=14, coilN=4;
    ctx.beginPath();
    for(var ci=0;ci<coilN;ci++){
      ctx.arc(cx, coilY+ci*coilR*1.8, coilR*0.9, Math.PI, 0, false);
    }
    ctx.stroke();
    /* Straight lines above/below */
    ctx.beginPath(); ctx.moveTo(cx,coilY-coilR*0.9); ctx.lineTo(cx,coilY-coilR*0.9-10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx,coilY+(coilN-1)*coilR*1.8+coilR*0.9); ctx.lineTo(cx,coilY+(coilN-1)*coilR*1.8+coilR*0.9+10); ctx.stroke();
    ctx.fillStyle=col; ctx.font='bold 10px '+MONO; ctx.textAlign='center';
    ctx.fillText('L', cx, cy+56);
    ctx.fillStyle='#CCDDEE'; ctx.font='8px '+GS;
    ctx.fillText(isEn?'Inductor':'\uc778\ub355\ud130', cx, cy+68);

  } else if (type==='capacitive') {
    /* Capacitor: two plates */
    var capW=40, plateSep=10;
    ctx.strokeStyle=col; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(cx-capW/2,cy-plateSep/2); ctx.lineTo(cx+capW/2,cy-plateSep/2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx-capW/2,cy+plateSep/2); ctx.lineTo(cx+capW/2,cy+plateSep/2); ctx.stroke();
    /* Wires */
    ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(cx,cy-plateSep/2); ctx.lineTo(cx,cy-plateSep/2-34); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx,cy+plateSep/2); ctx.lineTo(cx,cy+plateSep/2+34); ctx.stroke();
    ctx.fillStyle=col; ctx.font='bold 10px '+MONO; ctx.textAlign='center';
    ctx.fillText('C', cx, cy+56);
    ctx.fillStyle='#CCDDEE'; ctx.font='8px '+GS;
    ctx.fillText(isEn?'Capacitor':'\ucee4\ud328\uc2dc\ud130', cx, cy+68);

  } else {
    /* RLC: stack all three */
    var boxH=18, gap=6, startY=cy-42;
    ['R','L','C'].forEach(function(sym,si) {
      var by=startY+si*(boxH+gap);
      ctx.fillStyle=col+'22'; ctx.strokeStyle=col; ctx.lineWidth=1.5;
      ctx.beginPath(); if(ctx.roundRect)ctx.roundRect(cx-22,by,44,boxH,4); else ctx.rect(cx-22,by,44,boxH); ctx.fill(); ctx.stroke();
      ctx.fillStyle=col; ctx.font='bold 9px '+MONO; ctx.textAlign='center';
      ctx.fillText(sym, cx, by+boxH*0.68);
    });
    /* wires */
    ctx.strokeStyle=col; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(cx,startY); ctx.lineTo(cx,startY-10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx,startY+3*(boxH+gap)-gap); ctx.lineTo(cx,startY+3*(boxH+gap)-gap+10); ctx.stroke();
    ctx.fillStyle=col; ctx.font='bold 10px '+MONO; ctx.textAlign='center';
    ctx.fillText('RLC', cx, cy+56);
    ctx.fillStyle='#CCDDEE'; ctx.font='8px '+GS;
    var capLbl = type==='rlc-cap'?(isEn?'Capacitive dom.':'\uc6a9\ub7c9\uc131 \uc6b0\uc138'):(isEn?'Inductive dom.':'\uc720\ub3c4\uc131 \uc6b0\uc138');
    ctx.fillText(capLbl, cx, cy+68);
  }

  /* Connecting wire bottom */
  ctx.strokeStyle='#5BE0C0'; ctx.lineWidth=2;
  var wireStartY=type==='resistive'||type==='matched' ? cy+36 :
                 type==='inductive' ? cy-30+(4-1)*14*1.8+14*0.9+10 :
                 type==='capacitive' ? cy+5+34 :
                 cy-42+3*(18+6)-6+10;
  ctx.beginPath(); ctx.moveTo(cx, Math.min(wireStartY,cy+44)); ctx.lineTo(cx, H-24); ctx.stroke();

  /* Ground symbol */
  ctx.strokeStyle='#5BE0C0'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(cx-16,H-24); ctx.lineTo(cx+16,H-24); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx-10,H-18); ctx.lineTo(cx+10,H-18); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx-5,H-12);  ctx.lineTo(cx+5,H-12);  ctx.stroke();
}


/* ═══════════════════════════════════════════
   REVEAL TOGGLE
═══════════════════════════════════════════ */
window.toggleReveal = function(id) {
  const body = document.getElementById(id);
  const hdr  = body?.previousElementSibling;
  if (!body) return;
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  hdr?.classList.toggle('open', !isOpen);
};

/* ═══════════════════════════════════════════
   NAVIGATION & EVENTS
═══════════════════════════════════════════ */
function navigateTo(id) {
  if (impedAnim2) { cancelAnimationFrame(impedAnim2); impedAnim2 = null; }
  if (journeyAnim) { cancelAnimationFrame(journeyAnim); journeyAnim = null; }
  currentId = id;
  currentTab = 'diagram';
  renderDetail(id);
  renderSidebar();
  window.scrollTo(0, 0);
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  const pane = document.getElementById('tab-' + tab);
  if (pane) pane.classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b => {
    if (b.getAttribute('onclick') === `switchTab('${tab}')`) b.classList.add('active');
  });
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise();
  // 탭 전환 후 시뮬 재초기화
  if (tab === 'diagram') {
    if (currentId === 'c30') setTimeout(() => initGravSim(), 80);
    if (currentId === 'c30b') setTimeout(() => initJourneySlide(), 80);
    if (currentId === 'c31') setTimeout(() => initImpedSim(), 80);
  }
}

function setLang(lang) {
  if (impedAnim2) { cancelAnimationFrame(impedAnim2); impedAnim2 = null; }
  currentLang = lang;
  document.getElementById('btn-ko').classList.toggle('active', lang === 'ko');
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  renderDetail(currentId);
  renderSidebar();
}

function checkQuiz(el, correct, id) {
  const opts = el.parentElement.querySelectorAll('.quiz-opt');
  opts.forEach(o => o.style.pointerEvents = 'none');
  el.classList.add(correct ? 'correct' : 'wrong');
  const fb = document.getElementById('qfb-' + id);
  const s  = getSlide(id);
  if (fb && s) {
    fb.textContent = correct ? s.classroom.feedback_ok : s.classroom.feedback_ng;
    fb.className   = 'quiz-feedback show ' + (correct ? 'ok' : 'ng');
  }
}

function openImgPopup(src, cap) {
  document.getElementById('img-popup-img').src = src;
  document.getElementById('img-popup-cap').textContent = cap;
  document.getElementById('img-popup').classList.add('open');
}
function closeImgPopup() { document.getElementById('img-popup').classList.remove('open'); }

/* ── Responsive Canvas: resize handler ── */
function reinitCurrentSimulator() {
  if (currentId === 'c30')  { initGravSim();  if (document.getElementById('simPane2') && document.getElementById('simPane2').style.display !== 'none') initEpotSim(); }
  if (currentId === 'c31')  { if (impedAnim2) { cancelAnimationFrame(impedAnim2); impedAnim2 = null; } initC31Sim(); }
  if (currentId === 'c30b') { if (journeyAnim) { cancelAnimationFrame(journeyAnim); journeyAnim = null; } startJourneyCanvas(); }
}

var _resizeTimer = null;
window.addEventListener('resize', function() {
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(function() {
    reinitCurrentSimulator();
  }, 120);
});

window.addEventListener('DOMContentLoaded', () => {
  renderSidebar();
  renderDetail(currentId);
});
</script>
