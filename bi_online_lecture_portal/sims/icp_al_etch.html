<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICP Aluminum Etch — Interactive Lesson · Benedu Insight</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/benedu-insight/benedu-insight.github.io/refs/heads/main/logo_png/benedu_insight_Symbol.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:          #F7F8FA;
    --panel:       #FFFFFF;
    --ink:         #2D2D2D;
    --muted:       #6B7280;
    --muted2:      #9CA3AF;
    --purple:      #7030A0;
    --purple-soft: #F0E6F6;
    --purple-mid:  #d9b8ed;
    --purple-dark: #521a78;
    --green:       #0F8C50;
    --border:      #E5E7EB;
    --shadow:      0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.06);
    --hdr:         52px;
    --side:        450px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; overflow: hidden; }
  body {
    height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: 'Google Sans','Noto Sans KR','Segoe UI',system-ui,sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header ── */
  .hdr {
    position: fixed; top: 0; left: 0; right: 0; z-index: 200;
    height: var(--hdr); background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 1rem; padding: 0 1.25rem;
    box-shadow: 0 1px 6px rgba(0,0,0,0.07);
  }
  .hdr-logo   { height: 32px; width: auto; flex-shrink: 0; }
  .hdr-div    { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; }
  .hdr-title  { font-size: 0.95rem; font-weight: 700; color: var(--purple); line-height: 1.2; }
  .hdr-sub    {
    font-family: 'JetBrains Mono', monospace; font-size: 0.50rem;
    color: var(--muted2); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 2px;
  }
  .hdr-right  { margin-left: auto; display: flex; align-items: center; gap: 0.5rem; }

  .lang-toggle { display: flex; border: 1px solid var(--border); border-radius: 20px; overflow: hidden; }
  .lang-btn {
    padding: 3px 13px; border: none; background: transparent; cursor: pointer;
    font-family: 'JetBrains Mono', monospace; font-size: 0.60rem; font-weight: 500;
    color: var(--muted2); transition: all 0.16s;
  }
  .lang-btn.active { background: var(--purple); color: #fff; }

  /* ── Main area (below fixed header) ── */
  .main {
    position: fixed;
    top: var(--hdr); left: 0; right: 0; bottom: 0;
    display: grid;
    grid-template-columns: 1fr var(--side);
    gap: 0;
    overflow: hidden;
  }

  /* ── Canvas area ── */
  .canvas-wrap {
    position: relative;
    background: var(--bg);
    display: flex; flex-direction: column;
    padding: 10px 8px 6px 10px;
    overflow: hidden;
  }
  .canvas-card {
    flex: 1;
    background: var(--panel);
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  #cv {
    display: block;
    width: 100%;
    height: 100%;
    flex: 1;
    object-fit: contain;
  }
  /* Step controls below canvas card */
  .step-controls {
    flex-shrink: 0;
    min-height: 28px; height: 28px;
    display: flex; gap: 8px; align-items: center;
    margin-top: 6px; flex-wrap: nowrap; overflow: hidden;
  }
  .mode-toggle {
    display: inline-flex; background: var(--bg);
    border: 1px solid var(--border); border-radius: 20px; padding: 2px; gap: 2px;
  }
  .mode-toggle button {
    border: none; background: transparent; padding: 3px 12px;
    font-family: 'Google Sans', sans-serif; font-size: 0.70rem; font-weight: 600;
    cursor: pointer; color: var(--muted); border-radius: 14px; transition: all 0.14s;
  }
  .mode-toggle button.active { background: var(--purple); color: #fff; }
  .mode-info {
    font-family: 'JetBrains Mono', monospace; font-size: 0.60rem;
    background: var(--purple-soft); color: var(--purple-dark);
    padding: 3px 10px; border-radius: 20px; white-space: nowrap;
  }
  .reset-btn {
    font-family: 'Google Sans', sans-serif; font-size: 0.70rem; font-weight: 600;
    background: var(--panel); border: 1px solid var(--border); border-radius: 7px;
    padding: 4px 12px; cursor: pointer; color: var(--ink); transition: all 0.14s;
    white-space: nowrap;
  }
  .reset-btn:hover { border-color: var(--purple-mid); color: var(--purple); background: var(--purple-soft); }

  /* Tooltip */
  #tooltip {
    position: absolute; pointer-events: none;
    background: rgba(18,22,38,0.97); color: #fff;
    padding: 9px 13px; border-radius: 9px; font-size: 12.5px;
    line-height: 1.6; max-width: 270px;
    transform: translate(-50%,-100%); margin-top: -12px;
    opacity: 0; transition: opacity 0.11s; z-index: 50;
    box-shadow: 0 8px 24px rgba(0,0,0,0.32); border: 1px solid rgba(255,255,255,0.09);
  }
  #tooltip.show { opacity: 1; }
  #tooltip b { color: #c4a0f0; }

  /* ── Side Panel ── */
  .side {
    background: var(--panel);
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .side-inner {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 1rem 1.1rem 0.5rem;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }
  .side-inner::-webkit-scrollbar { width: 4px; }
  .side-inner::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .step-eyebrow {
    font-family: 'JetBrains Mono', monospace; font-size: 0.54rem;
    color: var(--muted2); text-transform: uppercase; letter-spacing: 0.14em; margin-bottom: 0.3rem;
  }
  .step-title { font-size: 1.08rem; font-weight: 700; color: var(--ink); margin-bottom: 0.6rem; line-height: 1.3; }
  .step-body  { font-size: 0.82rem; line-height: 1.76; color: #3a4055; }
  .step-body ul { padding-left: 1.1rem; margin: 0.35rem 0; }
  .step-body li { margin-bottom: 0.28rem; }
  .step-body b  { font-weight: 700; color: var(--ink); }
  .step-body code {
    background: var(--purple-soft); padding: 1px 6px; border-radius: 4px;
    font-family: 'JetBrains Mono', monospace; font-size: 0.70rem; color: var(--purple-dark);
  }
  .hint-box {
    margin-top: 0.7rem; display: flex; gap: 9px; align-items: flex-start;
    background: var(--bg); border: 1px solid var(--border); border-radius: 9px; padding: 9px 11px;
  }
  .hint-icon {
    flex: none; width: 28px; height: 28px; border-radius: 50%;
    background: var(--purple-soft); display: flex; align-items: center;
    justify-content: center; font-size: 13px;
  }
  .hint-text { font-size: 0.71rem; line-height: 1.58; color: #4a5070; flex: 1; align-self: center; }

  /* Deep Dive accordion */
  .deep-wrap {
    margin-top: 0.85rem; border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden; background: var(--panel);
  }
  .deep-hdr {
    display: flex; align-items: center; gap: 0.55rem; padding: 0.65rem 0.85rem;
    cursor: pointer; user-select: none; background: var(--panel); transition: background 0.15s;
  }
  .deep-hdr:hover { background: var(--bg); }
  .deep-hdr.open { background: var(--purple-soft); border-bottom: 1px solid var(--border); }
  .deep-icon  { font-size: 1rem; flex-shrink: 0; }
  .deep-title { font-size: 0.80rem; font-weight: 700; color: var(--ink); flex: 1; line-height: 1.3; }
  .deep-badge {
    background: var(--purple); color: #fff; font-family: 'JetBrains Mono', monospace;
    font-size: 0.50rem; font-weight: 700; padding: 2px 7px; border-radius: 4px; flex-shrink: 0;
    letter-spacing: 0.04em;
  }
  .deep-chevron { font-size: 0.62rem; color: var(--muted2); transition: transform 0.2s; flex-shrink: 0; }
  .deep-hdr.open .deep-chevron { transform: rotate(180deg); }
  .deep-body { max-height: 0; overflow: hidden; transition: max-height 0.35s ease; background: var(--bg); }
  .deep-body.open { max-height: 2000px; }
  .deep-inner { padding: 0.85rem 0.9rem; font-size: 0.76rem; line-height: 1.78; color: #4a5070; }
  .deep-inner p + p { margin-top: 0.6em; }
  .deep-inner b { color: var(--ink); }
  .deep-inner .deep-eq {
    background: var(--charcoal,#2D2D2D); border-radius: 6px; padding: 0.55rem 0.8rem;
    font-family: 'JetBrains Mono', monospace; font-size: 0.74rem; color: #FFD580;
    margin: 0.5rem 0; overflow-x: auto; letter-spacing: 0.03em; line-height: 1.6;
  }
  .deep-inner .deep-hl {
    background: var(--purple-soft); border-left: 3px solid var(--purple);
    border-radius: 0 7px 7px 0; padding: 0.5rem 0.8rem; margin: 0.5rem 0;
    font-size: 0.74rem; line-height: 1.7; color: var(--purple-dark);
  }
  .deep-inner ul { padding-left: 1.1rem; margin: 0.35rem 0; }
  .deep-inner li { margin-bottom: 0.3rem; }
  .deep-inner .deep-img-wrap { margin: 0.6rem 0; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); cursor: zoom-in; }
  .deep-inner .deep-img-wrap img { display: block; width: 100%; height: auto; transition: opacity 0.15s; }
  .deep-inner .deep-img-wrap:hover img { opacity: 0.88; }
  .deep-inner .deep-cap { font-size: 0.70rem; color: #8a93ad; text-align: center; margin-top: 0.35rem; line-height: 1.5; }
  .img-lightbox {
    position: fixed; inset: 0; background: rgba(20,22,34,0.82);
    display: none; align-items: center; justify-content: center;
    z-index: 1000; cursor: zoom-out; padding: 2.5rem;
  }
  .img-lightbox.open { display: flex; }
  .img-lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; box-shadow: 0 12px 48px rgba(0,0,0,0.45); }
  .img-lightbox .lightbox-close {
    position: absolute; top: 1.1rem; right: 1.4rem; width: 38px; height: 38px;
    border-radius: 50%; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25);
    color: #fff; font-size: 1.1rem; line-height: 1; display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .img-lightbox .lightbox-close:hover { background: rgba(255,255,255,0.22); }

  /* Side footer: step buttons + nav */
  .side-footer {
    flex-shrink: 0;
    padding: 0.65rem 1.1rem 0.8rem;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  .step-btns { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 0.6rem; }
  .step-btn {
    padding: 5px 10px; font-size: 0.70rem; font-weight: 600;
    border: 1px solid var(--border); background: var(--panel); border-radius: 6px;
    cursor: pointer; color: var(--muted); transition: all 0.13s;
    font-family: 'Google Sans', sans-serif; min-width: 30px; text-align: center;
  }
  .step-btn:hover { border-color: var(--purple-mid); color: var(--purple); background: var(--purple-soft); }
  .step-btn.active { background: var(--purple); color: #fff; border-color: var(--purple); }

  .nav-row { display: flex; gap: 7px; }
  .nav-btn {
    flex: 1; padding: 9px; font-size: 0.78rem; font-weight: 700;
    border: none; background: var(--ink); color: #fff; border-radius: 8px;
    cursor: pointer; font-family: 'Google Sans', sans-serif; transition: background 0.14s;
  }
  .nav-btn:hover:not(:disabled) { background: var(--purple); }
  .nav-btn:disabled { background: var(--border); color: var(--muted2); cursor: not-allowed; }

  /* Footer bar */
  .foot {
    display: none; /* hidden — space too tight in full-screen mode */
  }
</style>
</head>
<body>

<!-- Fixed Header -->
<header class="hdr">
  <a href="https://benedu-insight.github.io/" target="_blank" rel="noopener noreferrer"
     style="display:inline-flex;align-items:center;text-decoration:none;">
    <img class="hdr-logo"
      src="https://benedu-insight.github.io/logo_png/benedu_insight_logo_EN_horizontal.png"
      alt="Benedu Insight">
  </a>
  <div class="hdr-div"></div>
  <div>
    <div class="hdr-title" id="hTitle">ICP Aluminum Etch — Interactive Lesson</div>
    <div class="hdr-sub"   id="hSub">Class 3 · BCl₃ + Cl₂ + Ar → Al RIE (ICP) · Benedu Insight</div>
  </div>
  <div class="hdr-right">
    <div class="lang-toggle">
      <button class="lang-btn active" id="btnEN" onclick="setLang('en')">EN</button>
      <button class="lang-btn"        id="btnKO" onclick="setLang('ko')">KO</button>
    </div>
  </div>
</header>

<!-- Main 2-column layout -->
<div class="main">

  <!-- Left: Canvas + controls -->
  <div class="canvas-wrap" id="canvasWrap">
    <div class="canvas-card" id="canvasCard">
      <canvas id="cv"></canvas>
      <div id="tooltip"></div>
    </div>
    <div class="step-controls" id="stepControls"></div>
  </div>

  <!-- Right: Side panel -->
  <div class="side">
    <div class="side-inner" id="sideInner">
      <div class="step-eyebrow">Step <span id="stepNum">S</span> / 9</div>
      <div class="step-title" id="stepTitle"></div>
      <div class="step-body"  id="stepBody"></div>
      <div class="hint-box"   id="stepHint" style="display:none;"></div>
      <div id="deepDiveContainer"></div>
    </div>
    <div class="side-footer">
      <div class="step-btns" id="stepButtons"></div>
      <div class="nav-row">
        <button class="nav-btn" id="prevBtn">◀ Prev</button>
        <button class="nav-btn" id="nextBtn">Next ▶</button>
      </div>
    </div>
  </div>

</div>

<div class="img-lightbox" id="imgLightbox" onclick="closeLightbox()">
  <div class="lightbox-close" onclick="closeLightbox()">✕</div>
  <img id="imgLightboxSrc" src="" alt="">
</div>

<script>
/* ============================================================
   ICP Aluminum Etch Interactive Lesson v1
   Benedu Insight · Google Sans · Full-viewport layout
   Responsive Canvas — geometry scales with window size
   BCl3 + Cl2 + Ar -> Al RIE (Inductively Coupled Plasma)
   TOP: Coil (Antenna) -> Faraday Shield -> Dielectric Window
        (Y2O3-coated Al2O3 ceramic Lid) -- Source RF 13.56 MHz
   BOTTOM: Wafer Chuck -- RF-POWERED via Blocking Capacitor
        (Bias RF 13.56 MHz, independent of Source RF)
   KO / EN bilingual
   ============================================================ */

// ── Canvas & ctx ──────────────────────────────────────────────
const canvas = document.getElementById('cv');
const ctx    = canvas.getContext('2d');
const tooltip     = document.getElementById('tooltip');
const stepCtrlEl  = document.getElementById('stepControls');

// ── Logical canvas dimensions (constant ratio 900:640) ────────
const LW = 900, LH = 640;
let DPR = window.devicePixelRatio || 1;

let renderScale = 1, renderOffX = 0, renderOffY = 0;
function resizeCanvas() {
  const card = document.getElementById('canvasCard');
  const cw = card.clientWidth;
  const ch = card.clientHeight;
  DPR = window.devicePixelRatio || 1;
  canvas.width  = Math.round(cw * DPR);
  canvas.height = Math.round(ch * DPR);
  canvas.style.width  = cw + 'px';
  canvas.style.height = ch + 'px';
  const aspect = LW / LH;
  let drawW, drawH;
  if (cw / ch > aspect) { drawH = ch; drawW = ch * aspect; }
  else                   { drawW = cw; drawH = cw / aspect; }
  renderScale = drawW / LW;
  renderOffX = (cw - drawW) / 2;
  renderOffY = (ch - drawH) / 2;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(renderScale * DPR, renderScale * DPR);
  ctx.translate(renderOffX / renderScale, renderOffY / renderScale);
}

const ro = new ResizeObserver(() => resizeCanvas());
ro.observe(document.getElementById('canvasCard'));
resizeCanvas();

// ── Brand ─────────────────────────────────────────────────────
const FONT = '"Google Sans","Noto Sans KR",system-ui,sans-serif';
const MONO = '"JetBrains Mono",monospace';
const B = {
  purple:'#7030A0', purpleSoft:'#F0E6F6', purpleDark:'#521a78',
  green:'#0F8C50',  greenSoft:'#E5F4EC',
  charcoal:'#2D2D2D', muted:'#6B7280', muted2:'#9CA3AF',
  bg:'#F7F8FA', panel:'#FFFFFF', border:'#E5E7EB',
  red:'#E8553B', blue:'#3A7AD6', teal:'#1f9e8e', amber:'#caa23a',
};

// ── Logo ──────────────────────────────────────────────────────
const LOGO = new Image();
LOGO.crossOrigin = 'anonymous';
LOGO.src = 'https://benedu-insight.github.io/logo_png/benedu_insight_logo_EN_horizontal.png';
function drawLogo(a=0.45) {
  if (!LOGO.complete || !LOGO.naturalWidth) return;
  const lh=26, lw=Math.round(lh*LOGO.naturalWidth/LOGO.naturalHeight);
  ctx.save(); ctx.globalAlpha=a;
  ctx.drawImage(LOGO, LW-lw-12, LH-lh-10, lw, lh);
  ctx.restore();
}

// ── Geometry — all in LW×LH (900×640) logical space ──────────
// ICP CHAMBER for Aluminum Etch:
//   - Coil (Antenna)  : ABOVE the chamber shell, planar/spiral, Source RF 13.56 MHz
//   - Faraday Shield  : thin slotted plate between Coil and Dielectric Window
//   - Dielectric Window (Lid) : Y2O3-coated Al2O3 ceramic, full inner width (top of chamber interior)
//   - Wafer Chuck (bottom) : RF-POWERED via Blocking Capacitor, Bias RF 13.56 MHz
//        (electrically INDEPENDENT of the Source RF circuit)
//   - Gas (BCl3 + Cl2 + Ar) injected through SIDE nozzles (top is occupied by window/coil)
const W=LW, H=LH;
const CH={x:215,y:175,w:470,h:380,r:18};
const IP=18, inX=CH.x+IP, inY=CH.y+IP, inW=CH.w-IP*2, inH=CH.h-IP*2;

// Dielectric Window (Lid) — Y2O3-coated Al2O3 ceramic, full inner width (top)
const DW={x:inX, y:inY, w:inW, h:20};

// Coil (Antenna) — drawn ABOVE the chamber shell, planar/spiral, full width
const COIL={x:inX, y:CH.y-58, w:inW, h:34};
// Faraday Shield — thin slotted plate between coil and chamber top / window
const FS={x:inX, y:CH.y-16, w:inW, h:9};

// Wafer Chuck — Bias RF-POWERED via Blocking Capacitor, ~70% of inner width
const PEW=Math.round(inW*0.70);
const SC={x:inX+Math.round((inW-PEW)/2), y:inY+inH-30, w:PEW, h:30};
const wW=Math.round(PEW*0.88);
const WF={x:SC.x+Math.round((PEW-wW)/2), y:SC.y-5, w:wW, h:5};

// Top sheath — thin, near the dielectric window (very low voltage; no
// area-asymmetry mechanism in ICP — this is just the natural wall sheath)
const ST={x:inX+6, y:DW.y+DW.h, w:inW-12, h:14};
// Bottom sheath — Bias-RF-controlled, thickness/intensity reflects V_DC
// from the BIAS supply (independent of Source RF / plasma density)
const SB_H_BASE=20;
const AL_MAX=26, PR_H=13;
const SB={x:SC.x-4, y:0, w:SC.w+8, h:SB_H_BASE};
SB.y = WF.y - AL_MAX - PR_H - SB_H_BASE;
const PL={x:ST.x,y:ST.y+ST.h,w:ST.w,h:SB.y-(ST.y+ST.h)};
const GND_X = CH.x+55;

// Gas system — SIDE injection (right wall), per ICP layout: Box -> Valve (⋈)
// -> Bus -> nozzle into the chamber side wall. Order top-to-bottom: BCl3, Cl2, Ar.
const GAS_BUS_X = 730;
const M1={cx:780, cy:300};
const M2={cx:780, cy:350};
const M3={cx:780, cy:400};
const G1S={x:820, y:M1.cy-12, w:70, h:24};
const G2S={x:820, y:M2.cy-12, w:70, h:24};
const G3S={x:820, y:M3.cy-12, w:70, h:24};
// Nozzle entry points on the chamber's right inner wall —
// all three gas lines MERGE into a single common header pipe and enter
// the chamber through ONE nozzle (single injection point), not three.
const MERGE_X = GAS_BUS_X - 26;          // x-position of the common vertical merge pipe
const NZ_MAIN = {x:inX+inW, y:M2.cy};    // single nozzle (mid-height of the gas manifold)
const NZ1=NZ_MAIN, NZ2=NZ_MAIN, NZ3=NZ_MAIN; // species spawn alias — same physical inlet

// Bias RF Matcher (LEFT) + Bias RF Generator (RIGHT) — bottom of chamber,
// horizontal. DC Blocking Capacitor sits above the Matcher and routes right
// to the chuck's RF feed point at the chamber's bottom-right corner.
// (Same physical pattern as the CCP chuck circuit — but here it is the
//  INDEPENDENT Bias RF supply, not the only RF supply.)
const MAT={x:500,y:580,w:110,h:44,r:10};
const RFG={x:MAT.x+MAT.w+14,y:580,w:110,h:44,r:10};
const BCAP={cx:MAT.x+55,cy:560};

// Source RF Matcher (LEFT) + Source RF Generator (RIGHT) — above the
// chamber, feeding the Coil. Independent circuit from the Bias RF below.
const SMAT={x:500,y:18,w:110,h:40,r:10};
const SRFG={x:SMAT.x+SMAT.w+14,y:18,w:110,h:40,r:10};
const SFEED_X = SMAT.x+SMAT.w/2;

// Backside He Cooling — directly below the powered chuck's center.
const HEC={x:425,y:592,w:50,h:30,r:8};
const HEC_GLASS_CY=560;

// Turbo Pump + Dry Vacuum Pump — bottom of chamber, left of the He cooling
// box, near the chamber's bottom-left corner.
const TP={x:222,y:588,w:84,h:40,r:20};
const DVP={x:TP.x+TP.w+12,y:582,w:92,h:52,r:8};

// ── Species — BCl3 + Cl2 + Ar -> Al RIE ───────────────────────
const SP={

function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
function pipe(pts,col='#b3bac8',w=2.2){
  ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.stroke();
}
function arw(x0,y0,x1,y1,col='#1d2436',w=1.2){
  ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=w;
  ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.stroke();
  const a=Math.atan2(y1-y0,x1-x0),h=5.5;
  ctx.beginPath();ctx.moveTo(x1,y1);
  ctx.lineTo(x1-h*Math.cos(a-0.4),y1-h*Math.sin(a-0.4));
  ctx.lineTo(x1-h*Math.cos(a+0.4),y1-h*Math.sin(a+0.4));
  ctx.closePath();ctx.fill();
}
function gnd(cx,cy){
  ctx.strokeStyle='#1d2436';ctx.lineWidth=1.5;ctx.beginPath();
  ctx.moveTo(cx,cy);ctx.lineTo(cx,cy+6);
  ctx.moveTo(cx-10,cy+6);ctx.lineTo(cx+10,cy+6);
  ctx.moveTo(cx-7,cy+10);ctx.lineTo(cx+7,cy+10);
  ctx.moveTo(cx-4,cy+14);ctx.lineTo(cx+4,cy+14);
  ctx.stroke();
}
function chem(formula,x,y,sz=11,col='#1d2436'){  ctx.fillStyle=col;
  const bF=`bold ${sz}px ${FONT}`,sF=`bold ${Math.round(sz*.7)}px ${FONT}`,pF=`bold ${Math.round(sz*.75)}px ${FONT}`;
  ctx.textAlign='left';ctx.textBaseline='middle';
  const segs=[];let i=0;
  while(i<formula.length){
    const ch=formula[i];
    if(/[A-Za-z]/.test(ch)){let s=ch;while(i+1<formula.length&&/[a-z]/.test(formula[i+1])){s+=formula[++i];}segs.push({t:'b',s});}
    else if(/[0-9]/.test(ch))segs.push({t:'sub',s:ch});
    else if(ch==='+'||ch==='-')segs.push({t:'sup',s:ch});
    i++;
  }
  let tot=0;for(const s of segs){ctx.font=s.t==='b'?bF:s.t==='sub'?sF:pF;tot+=ctx.measureText(s.s).width;}
  let cx=x-tot/2;
  for(const s of segs){
    ctx.font=s.t==='b'?bF:s.t==='sub'?sF:pF;
    const oy=s.t==='sub'?sz*.30:s.t==='sup'?-sz*.32:0;
    ctx.fillText(s.s,cx,y+oy);cx+=ctx.measureText(s.s).width;
  }
}

function drawCoil(active,t){

  pipe([[SFEED_X,SMAT.y+SMAT.h],[SFEED_X,COIL.y+COIL.h/2-2],[COIL.x+COIL.w*0.78,COIL.y+COIL.h/2-2]],'#5a6479',1.5);

// Vertical B-field flux lines — Coil current -> oscillating B-field -> threads
// straight down through the Faraday Shield's slots and the Dielectric Window
// into the chamber. Direction/intensity follow the Coil's AC phase (sin(t)).
// This is the field whose TIME-VARIATION induces the rotating E-field shown
// by drawRotatingEField (Faraday's Law: induced E ⟂ to changing B).
function drawBFieldFluxLines(t,al=0.85){
  const phase=Math.sin(t*2*Math.PI*0.9);   // same AC phase used by drawCoil's glow
  const dirUp=phase>=0;                     // B-field reverses every half-cycle
  const mag=Math.abs(phase);                // 0..1, pulses through zero at field reversal
  const col=dirUp?B.teal:B.amber;
  const N=8;                                // fewer, evenly spaced lines (subset of FS slots)
  const yTop=COIL.y-2;
  const yBot=PL.y+PL.h*0.30;                // lines fade out shortly into the plasma
  for(let i=0;i<N;i++){
    const x=FS.x+10+(i+0.5)*(FS.w-20)/N;
    const a=al*(0.30+0.70*mag);
    ctx.save();
    ctx.globalAlpha=a;
    ctx.strokeStyle=col;ctx.lineWidth=1.3;ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.moveTo(x,yTop);ctx.lineTo(x,yBot);ctx.stroke();
    ctx.setLineDash([]);
    // arrowhead showing instantaneous B-field direction at this point in the AC cycle
    const ay=dirUp?(yBot-6):(yTop+6);
    const ah=7;
    ctx.fillStyle=col;
    ctx.beginPath();
    if(dirUp){ctx.moveTo(x,ay+ah);ctx.lineTo(x-4,ay);ctx.lineTo(x+4,ay);}
    else{ctx.moveTo(x,ay-ah);ctx.lineTo(x-4,ay);ctx.lineTo(x+4,ay);}
    ctx.closePath();ctx.fill();
    ctx.restore();
  }
  ctx.save();ctx.globalAlpha=Math.min(1,al+0.15);
  ctx.fillStyle=col;ctx.font=`bold 9px ${FONT}`;ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText(lang==='ko'?'B-field (수직, 진동)':'B-field (vertical, oscillating)',FS.x+6,COIL.y-12);
  ctx.restore();
}

// ── Particle system ───────────────────────────────────────────
function spawn(type,x,y,vx=null,vy=null){
  particles.push({type,x,y,vx:vx!==null?vx:(Math.random()-.5)*.4,vy:vy!==null?vy:(Math.random()-.5)*.4,age:0});

function updP(p,dt,o){
  const d=SP[p.type];p.age+=dt;
  if(d.cat==='byproduct'){
    p.vy-=0.55;p.vx+=(Math.random()-.5)*.08;p.vx*=.97;p.vy*=.97;
    return p.age<1.8;
  }
  if(d.q!==0&&o.fieldActive){
    // Bottom sheath (Bias-RF chuck) is much stronger than the top sheath
    // (thin, natural wall sheath near the window). Boost is modest at the
    // top because there is no large electrode-area asymmetry in ICP.
    let boost=1;
    if(p.y<ST.y+ST.h) boost=1.3;
    else if(p.y>SB.y) boost=o.botBoost!==undefined?o.botBoost:1.0;
    const f=d.q*o.fieldDir*o.fieldStrength*boost;
    p.vy+=f/Math.max(d.m,5e-4)*dt*.5;
  }
  // Mass-independent downward drift toward the chuck (bottom) — represents
  // directional acceleration across the bottom sheath for ions when Bias RF
  // is active, and general transport toward the etch front for radicals.
  if(o.driftBot&&(d.cat==='ion'||d.cat==='radical')){
    const target=d.cat==='ion'?(o.ionDriftTarget!==undefined?o.ionDriftTarget:2.0):1.2;
    if(p.vy<target)p.vy+=(target-p.vy)*Math.min(1,dt*1.2);
  }
  const br=o.brownian??0.08,dr=o.drag??0.96;
  if(d.cat==='neutral'||d.cat==='radical'){p.vx+=(Math.random()-.5)*br;p.vy+=(Math.random()-.5)*br;}
  else p.vx+=(Math.random()-.5)*(br*.5);
  p.vx*=dr;p.vy*=dr;
  const mx=d.cat==='electron'?4.5:d.cat==='ion'?2.4:1.0,sp=Math.hypot(p.vx,p.vy);
  if(sp>mx){p.vx*=mx/sp;p.vy*=mx/sp;}
  p.x+=p.vx;p.y+=p.vy;
  if(p.x<PL.x+4){p.x=PL.x+4;p.vx=Math.abs(p.vx)*.4;}
  if(p.x>PL.x+PL.w-4){p.x=PL.x+PL.w-4;p.vx=-Math.abs(p.vx)*.4;}
  // Top boundary (dielectric-window side, natural wall sheath)
  if(p.y<ST.y+2){
    if(d.cat==='electron'&&o.absorbElectronTop)return false;
    if(d.cat==='ion'&&o.absorbIonTop){o.onImpact&&o.onImpact(p,'top');return false;}
    p.y=ST.y+2;p.vy=Math.abs(p.vy)*.4;
  }
  // Bottom boundary (Bias-RF chuck / Al surface)
  if(p.y>SB.y+SB.h-2){
    if(d.cat==='ion'&&o.absorbIonBot){o.onImpact&&o.onImpact(p,'bot');return false;}
    if(d.cat==='electron'&&o.absorbElectronBot)return false;

function emitL(x,y,col='rgba(255,220,200,1)',life=.6){lights.push({x,y,col,life,maxLife:life,r:0});}
function updL(dt){for(let i=lights.length-1;i>=0;i--){const Lp=lights[i];Lp.life-=dt;Lp.r+=30*dt;if(Lp.life<=0)lights.splice(i,1);}}

    g.addColorStop(0,Lp.col.replace('1)',`${a})`));g.addColorStop(1,Lp.col.replace('1)','0)'));
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(Lp.x,Lp.y,Lp.r,0,Math.PI*2);ctx.fill();}
}
function addImp(x,y){impacts.push({x,y,life:.4,maxLife:.4});}

}
// V_DC model:
//  Step 2 (Source ignition): 0
//  Step 3 (Source-only):     ~ -8V floating potential (small, constant)
//  Step 4 (Bias activation): ramps 0 -> -50V via step4DCProgress
//  Step 5 (ion accel/etch):  -50V (full)
//  Step 6 (toggle):          mode==='SRC' -> floating (~-8V); mode==='BIAS' -> -50V
//  Step 7 (trench):          -50V (full)
function getVdc(){
  if(currentStep===2) return 0;
  if(currentStep===3) return -8;
  if(currentStep===4) return -50*step4DCProgress;
  if(currentStep===5) return -50;
  if(currentStep===6) return mode==='BIAS'?-50:-8;
  if(currentStep===7) return -50;
  return 0;
}
function setupStep(i){
  clr();etchDepths={};step4DCProgress=0;
  if(i===1){
    // Step 1 (gas fill): starts empty, fills via side-nozzle spawn
  }else if(i>=2){
    for(let k=0;k<20;k++){const p=rndPt(),r=Math.random();spawn(r<.40?'BCl3':r<.75?'Cl2':'Ar',p.x,p.y);}
    for(let k=0;k<5;k++){const p=rndPt(),r=Math.random();spawn(r<.5?'BCl2':'Cl',p.x,p.y);}
    for(let k=0;k<5;k++){const p=rndPt();spawn('e-',p.x,p.y);}
    const ions=['Cl+','Ar+','BCl2+'];
    for(let k=0;k<3;k++){const p=rndPt();spawn(ions[k%3],p.x,p.y);}
  }
  renderStepCtrl(i);
}

  const TY=98,RH=30,cols=[0,192,314,436],totH=RH*(L().tRows.length+1);
  ctx.save();rr(RX,TY,RW,totH,8);ctx.clip();
  ctx.fillStyle=B.purple;ctx.fillRect(RX,TY,RW,RH);
  L().tHeaders.forEach((h,ci)=>{const mx=RX+(cols[ci]+cols[ci+1])/2;ctx.fillStyle='#fff';ctx.font=`bold 11.5px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(h,mx,TY+RH/2);});
  L().tRows.forEach((row,ri)=>{
    const ry=TY+RH+ri*RH;ctx.fillStyle=ri%2===0?B.purpleSoft:'#fff';ctx.fillRect(RX,ry,RW,RH);
    ctx.strokeStyle='#ddd0ee';ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(RX,ry+RH);ctx.lineTo(RX+RW,ry+RH);ctx.stroke();
    [1,2].forEach(ci=>{ctx.beginPath();ctx.moveTo(RX+cols[ci],ry);ctx.lineTo(RX+cols[ci],ry+RH);ctx.stroke();});
    row.forEach((cell,ci)=>{
      ctx.fillStyle=ci===0?B.charcoal:ci===1?B.purple:'#6b7388';ctx.font=ci===0?`11px ${FONT}`:`bold 11px ${FONT}`;
      ctx.textAlign=ci===0?'left':'center';ctx.textBaseline='middle';
      ctx.fillText(cell,ci===0?RX+8:RX+(cols[ci]+cols[ci+1])/2,ry+RH/2);
    });
  });
  ctx.restore();rr(RX,TY,RW,totH,8);ctx.strokeStyle='#d0c0e8';ctx.lineWidth=1;ctx.stroke();
  const PWY=TY+totH+18;
  ctx.fillStyle=B.green;ctx.fillRect(RX,PWY,3,14);ctx.fillStyle=B.charcoal;ctx.font=`bold 12px ${FONT}`;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(L().takeawayWindow,RX+10,PWY+7);
  L().pwItems.forEach(([k,v],i)=>{
    const py=PWY+26+i*22;ctx.fillStyle='#7a7a8a';ctx.font=`11px ${FONT}`;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(k,RX+10,py);
    ctx.fillStyle=B.charcoal;ctx.font=`bold 11px ${FONT}`;ctx.textAlign='right';ctx.fillText(v,RX+RW-6,py);
  });
  const BX=20,BY=514,BW=W-40,BH=74,HDH=30;
  ctx.save();rr(BX,BY,BW,BH,8);ctx.clip();ctx.fillStyle='rgba(242,201,76,.13)';ctx.fillRect(BX,BY,BW,HDH);ctx.fillStyle='#fff';ctx.fillRect(BX,BY+HDH,BW,BH-HDH);ctx.restore();
  rr(BX,BY,BW,BH,8);ctx.strokeStyle='rgba(190,155,40,.32)';ctx.lineWidth=.8;ctx.stroke();
  ctx.strokeStyle='rgba(190,155,40,.32)';ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(BX+1,BY+HDH);ctx.lineTo(BX+BW-1,BY+HDH);ctx.stroke();
  ctx.fillStyle='rgba(242,201,76,.50)';ctx.beginPath();ctx.arc(BX+20,BY+HDH/2,9,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#7a5800';ctx.font=`bold 12px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('!',BX+20,BY+HDH/2);
  ctx.fillStyle=B.charcoal;ctx.font=`bold 12.5px ${FONT}`;ctx.textAlign='left';ctx.fillText(L().takeawayLimits,BX+36,BY+HDH/2);
  ctx.fillStyle='#5a6070';ctx.font=`10.5px ${FONT}`;
  L().limitLines.forEach((ln,i)=>ctx.fillText(ln,BX+14,BY+HDH+16+i*18));
  drawLogo(.55);
}

const RENDERS=[s1,s2,s3,s4,s5,s6,s7,s8,s9];

// ── Step controls ─────────────────────────────────────────────
function renderStepCtrl(i){
  stepCtrlEl.innerHTML='';
  if(i===6){
    const wrap=document.createElement('div');wrap.className='mode-toggle';
    const srcB=document.createElement('button');srcB.textContent=lang==='ko'?'Source Only':'Source Only';
    const biasB=document.createElement('button');biasB.textContent=lang==='ko'?'Source + Bias':'Source + Bias';
    if(mode==='SRC')srcB.classList.add('active');else biasB.classList.add('active');
    srcB.addEventListener('click',()=>{mode='SRC';setupStep(6);});
    biasB.addEventListener('click',()=>{mode='BIAS';setupStep(6);});
    wrap.appendChild(srcB);wrap.appendChild(biasB);stepCtrlEl.appendChild(wrap);
    const note=document.createElement('span');note.className='mode-info';
    note.textContent=mode==='SRC'?L().modeInfoSrcOnly:L().modeInfoSrcBias;
    stepCtrlEl.appendChild(note);
  }else if(i===7){
    const btn=document.createElement('button');btn.className='reset-btn';btn.textContent=L().resetEtch;
    btn.addEventListener('click',()=>{etchDepths={};});stepCtrlEl.appendChild(btn);
  }
}

// ── Main loop ─────────────────────────────────────────────────
function render(){
  const now=performance.now(),dt=Math.min((now-lastT)/1000,.05);lastT=now;
  ctx.save();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle=B.bg;
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.restore();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(renderScale * DPR, renderScale * DPR);
  ctx.translate(renderOffX / renderScale, renderOffY / renderScale);
  RENDERS[currentStep](dt,(now-t0)/1000);
  requestAnimationFrame(render);
}
document.fonts.ready.then(()=>render()).catch(()=>render());

// ── Step buttons ──────────────────────────────────────────────
const sBEl=document.getElementById('stepButtons');
function buildBtns(){
  sBEl.innerHTML='';
  L().steps.forEach((s,i)=>{
    const b=document.createElement('button');b.className='step-btn'+(i===currentStep?' active':'');
    b.textContent=i===0?'S':i===L().steps.length-1?'K':i;b.title=s.title;
    b.addEventListener('click',()=>setStep(i));sBEl.appendChild(b);
  });
}
const prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn');
prevBtn.addEventListener('click',()=>setStep(currentStep-1));
nextBtn.addEventListener('click',()=>setStep(currentStep+1));

function fmtHint(raw){
  if(!raw)return'';const sp=raw.indexOf(' ');
  if(sp>0){const icon=raw.slice(0,sp),body=raw.slice(sp+1);if(/\p{Emoji}/u.test(icon))return`<div class="hint-icon">${icon}</div><div class="hint-text">${body}</div>`;}
  return`<div class="hint-text">${raw}</div>`;
}
const DEEP_DIVE_LABEL = { en:'Deep Dive', ko:'심화학습' };
function toggleDeepDive(idx){
  const hdr=document.getElementById('ddHdr'+idx), body=document.getElementById('ddBody'+idx);
  if(!hdr||!body)return;
  const open=body.classList.toggle('open');
  hdr.classList.toggle('open',open);
}
function setStep(i){
  if(i<0||i>=L().steps.length)return;currentStep=i;
  document.querySelectorAll('.step-btn.active').forEach(b=>b.classList.remove('active'));
  if(sBEl.children[i])sBEl.children[i].classList.add('active');
  document.getElementById('stepNum').textContent=i===0?'S':i===L().steps.length-1?'K':i;
  document.getElementById('stepTitle').textContent=L().steps[i].title;
  document.getElementById('stepBody').innerHTML=L().steps[i].body;
  const hEl=document.getElementById('stepHint');
  if(L().steps[i].hint){hEl.innerHTML=fmtHint(L().steps[i].hint);hEl.style.display='';}
  else hEl.style.display='none';
  const ddEl=document.getElementById('deepDiveContainer');
  let dds=L().steps[i].deepDive;
  if(dds && !Array.isArray(dds)) dds=[dds];
  if(dds && dds.length){
    ddEl.innerHTML=dds.map((dd,idx)=>`
      <div class="deep-wrap">
        <div class="deep-hdr" id="ddHdr${idx}" onclick="toggleDeepDive(${idx})">
          <span class="deep-icon">📚</span>
          <span class="deep-title">${dd.title}</span>
          <span class="deep-badge">${DEEP_DIVE_LABEL[lang]}</span>
          <span class="deep-chevron">▼</span>
        </div>
        <div class="deep-body" id="ddBody${idx}">
          <div class="deep-inner">${dd.body}</div>
        </div>
      </div>`).join('');
  } else {
    ddEl.innerHTML='';
  }
  prevBtn.disabled=(i===0);nextBtn.disabled=(i===L().steps.length-1);
  prevBtn.textContent=L().prevBtn;nextBtn.textContent=L().nextBtn;
  document.getElementById('sideInner').scrollTop=0;
  renderStepCtrl(i);
  setupStep(i);
}

// ── Language ──────────────────────────────────────────────────
function setLang(l){
  lang=l;
  document.getElementById('btnEN').classList.toggle('active',l==='en');
  document.getElementById('btnKO').classList.toggle('active',l==='ko');
  document.getElementById('hTitle').textContent=L().hTitle;
  document.getElementById('hSub').textContent=L().hSub;
  buildBtns();setStep(currentStep);
}

// ── Tooltip ───────────────────────────────────────────────────
function ptIn(x,y,r){return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;}
canvas.addEventListener('mousemove',e=>{
  const cr=canvas.getBoundingClientRect();
  const mx=(e.clientX-cr.left), my=(e.clientY-cr.top);
  const cx=(mx-renderOffX)/renderScale, cy=(my-renderOffY)/renderScale;
  if(currentStep!==0){hoveredHotspot=null;tooltip.classList.remove('show');canvas.style.cursor='default';return;}
  let foundR=null;for(const h of HR){if(ptIn(cx,cy,h.rect)){foundR=h;break;}}
  hoveredHotspot=foundR;
  if(foundR){
    const hs=L().hotspots.find(h=>h.n===foundR.n);
    tooltip.classList.add('show');
    tooltip.innerHTML=`<b>${hs.title}</b><br>${hs.text.replace(/\n/g,'<br>')}`;
    const cardRect=canvas.parentElement.getBoundingClientRect();
    tooltip.style.left=(e.clientX-cardRect.left)+'px';
    tooltip.style.top=(e.clientY-cardRect.top-10)+'px';
    canvas.style.cursor='pointer';
  }else{tooltip.classList.remove('show');canvas.style.cursor='default';}
});
canvas.addEventListener('mouseleave',()=>{hoveredHotspot=null;tooltip.classList.remove('show');});

// ── Image Lightbox ────────────────────────────────────────────
function openLightbox(src){
  const lb=document.getElementById('imgLightbox'), img=document.getElementById('imgLightboxSrc');
  img.src=src;lb.classList.add('open');
}
function closeLightbox(){
  document.getElementById('imgLightbox').classList.remove('open');
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox();});

// ── Init ──────────────────────────────────────────────────────
buildBtns();
setStep(0);
</script>
