<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remote Plasma Source v5 — Interactive Lesson · Benedu Insight</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/benedu-insight/benedu-insight.github.io/refs/heads/main/logo_png/benedu_insight_Symbol.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8FAFB; --card:#FFFFFF; --border:#E2E8F0; --line:#EEF2F6;
  --text:#1A202C; --ink2:#334155; --muted:#64748B; --label:#94A3B8;
  --green:#0F8C50; --green-lt:#E6F4ED; --green-dk:#0A6B3C;
  --purple:#7030A0; --purple-lt:#F0E8F8; --purple-mid:#9B59D0; --purple-dk:#521A78;
  --coral:#E8553B; --coral-lt:#FDEEEA; --coral-dk:#8A2E1C;
  --amber:#B7791F; --amber-lt:#FEF6E4; --amber-dk:#7A4E0B;
  --shadow:0 2px 12px rgba(15,23,42,.06);
  --hdr:56px; --side:440px;
  --sans:'Google Sans',system-ui,sans-serif;
  --mono:var(--sans);
  --serif:var(--sans);
  --code:'JetBrains Mono','Noto Sans KR',ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html[lang=ko]{--sans:'Google Sans','Noto Sans KR',system-ui,sans-serif}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit}

/* ── Header ── */
.hdr{position:fixed;top:0;left:0;right:0;height:var(--hdr);z-index:50;display:flex;align-items:center;gap:14px;
  padding:0 20px;background:var(--card);border-bottom:1px solid var(--border)}
.hdr-logo{height:32px;display:block}
.hdr-div{width:1px;height:26px;background:var(--border)}
.hdr-title{font-size:15px;font-weight:700;color:var(--purple);line-height:1.2;white-space:nowrap}
.hdr-sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--label);margin-top:2px;white-space:nowrap}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.lang-toggle{display:flex;background:var(--bg);border:1.5px solid var(--border);border-radius:20px;padding:3px;gap:2px}
.lang-btn{font-family:'Google Sans','Noto Sans KR',sans-serif;white-space:nowrap;font-size:12px;font-weight:600;padding:3px 12px;border-radius:16px;border:none;background:transparent;color:var(--muted);cursor:pointer;transition:all .18s}
.lang-btn.active{background:var(--purple);color:#fff}

/* ── App grid ── */
.app{position:fixed;top:var(--hdr);left:0;right:0;bottom:0;display:grid;grid-template-columns:minmax(0,1fr) var(--side)}
.stage{display:flex;flex-direction:column;gap:8px;padding:10px 10px 10px 12px;min-width:0;min-height:0}

/* recipe bar */
.recipe{display:flex;align-items:center;gap:4px;flex-wrap:nowrap;overflow:hidden;flex-shrink:0;padding:0 2px}
.recipe-k{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--label);margin-right:6px;white-space:nowrap}
.rp{font-size:11px;font-weight:600;color:var(--label);padding:4px 9px;border-radius:999px;border:1px solid var(--border);background:var(--card);white-space:nowrap;transition:all .2s}
.rp.on{background:var(--purple);border-color:var(--purple);color:#fff;box-shadow:0 2px 8px rgba(112,48,160,.25)}
.rp.done{color:var(--muted)}
.rp-sep{color:var(--border);font-size:10px}

/* canvas card */
.canvas-card{flex:1;min-height:0;position:relative;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.cv-wrap{flex:1;min-height:0;position:relative}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.sbar{display:flex;align-items:center;gap:6px;padding:6px 10px;border-top:1px solid var(--line);min-height:36px;flex-wrap:wrap;flex-shrink:0}
.rd{font-family:var(--sans);font-variant-numeric:tabular-nums;font-size:11px;color:var(--ink2);background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:2px 7px;white-space:nowrap}
.rd b{font-weight:500;color:var(--label);margin-right:4px}
.rd.on{border-color:#d9c6ec;background:var(--purple-lt);color:var(--purple-dk)}
.rd.slow{color:var(--muted);background:transparent;border-style:dashed}
.sbar-sp{flex:1}
.legend{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lg{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--ink2);white-space:nowrap}
.lg i{width:8px;height:8px;border-radius:50%;display:inline-block}
.lg i.ion{box-shadow:0 0 0 2px rgba(232,85,59,.25)}
.lg i.pw{border-radius:2px;background:#CBD5E1;border:1px solid #94A3B8}
.lbl-btn{font-size:11px;font-weight:600;border:1px solid var(--border);background:var(--card);color:var(--muted);border-radius:6px;padding:2px 8px;cursor:pointer}
.lbl-btn.on{background:var(--purple-lt);color:var(--purple);border-color:#d9c6ec}
.msg{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--green-lt);color:var(--green-dk);white-space:nowrap}
.msg.warn{background:var(--coral-lt);color:var(--coral-dk)}
.msg.info{background:var(--purple-lt);color:var(--purple-dk)}
.msg:empty{display:none}
sub,sup{font-size:.72em;line-height:0}

#tooltip{position:absolute;pointer-events:none;z-index:20;max-width:300px;background:rgba(17,24,39,.96);color:#fff;
  padding:10px 13px;border-radius:10px;font-size:12.5px;line-height:1.55;opacity:0;transition:opacity .12s;
  box-shadow:0 10px 30px rgba(0,0,0,.28);transform:translate(-50%,calc(-100% - 14px))}
#tooltip.show{opacity:1}
#tooltip b{display:block;color:#d8b9f3;margin-bottom:2px;font-size:12.5px}

/* takeaway overlay */
.stage-html{position:absolute;inset:0;overflow:auto;background:var(--card);display:none;padding:22px 24px 28px}
.stage-html.show{display:block}

/* instrument panel */
.inst{flex-shrink:0;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(250px,1fr);gap:8px;height:216px}
.inst.tall{height:286px}
.inst.one{grid-template-columns:1fr;height:auto}
.icard{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:9px 12px;min-width:0;min-height:0;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.ihead{display:flex;align-items:center;gap:8px;flex-shrink:0}
.ihead h3{font-size:12px;font-weight:600;color:var(--ink2)}
.badge{display:inline-flex;align-items:center;gap:5px;background:var(--green-lt);color:var(--green);font-size:9.5px;font-weight:600;letter-spacing:.08em;padding:2px 8px;border-radius:4px;flex-shrink:0}
.badge-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.chart{flex:1;min-height:0;width:100%;display:block}
.crow{flex:1;min-height:0;display:flex;gap:8px}
.crow .chart{flex:1;min-width:0;height:100%}
.ctls{display:flex;flex-direction:column;gap:6px;overflow:auto;min-height:0;padding-right:2px}
.ctls.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:14px;row-gap:8px;align-content:start}
.ctls.g2 .seg-row{grid-column:1/-1}
.ctl-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:2px;line-height:1.25}
.ctl-h label{font-size:11.5px;color:var(--muted);font-weight:500}
.ctl-h output{font-family:var(--mono);font-size:11.5px;color:var(--purple);font-weight:600;white-space:nowrap}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--green),var(--purple-mid));outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;border:2.5px solid var(--purple);box-shadow:0 1px 4px rgba(0,0,0,.18)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:2.5px solid var(--purple)}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:none;background:transparent;padding:4px 10px;font-size:11.5px;font-weight:600;color:var(--muted);border-radius:6px;cursor:pointer}
.seg button.on{background:var(--purple);color:#fff}
.seg-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg-row .k{font-size:11.5px;color:var(--muted);min-width:64px}
.btn{font-size:11.5px;font-weight:600;border:1px solid var(--border);background:var(--card);color:var(--ink2);border-radius:8px;padding:5px 12px;cursor:pointer;transition:all .15s}
.btn:hover{border-color:#d9c6ec;color:var(--purple);background:var(--purple-lt)}
.btn.pri{background:var(--purple);border-color:var(--purple);color:#fff}
.btn.pri:hover{background:var(--purple-dk)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.stats.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.stats.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 8px;min-width:0}
.stat-k{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-v{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--purple);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-v small{font-size:10px;color:var(--muted);font-weight:500}
.stat.pass{background:var(--green-lt);border-color:#cde9da}.stat.pass .stat-v{color:var(--green-dk)}
.stat.fail{background:var(--coral-lt);border-color:#f6d3ca}.stat.fail .stat-v{color:var(--coral-dk)}
.ticker{font-family:var(--sans);font-size:11.5px;line-height:1.7;color:var(--ink2);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 9px;min-height:68px}
.ticker div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticker div em{font-style:normal;color:var(--label)}
.phase-chips{display:flex;flex-wrap:wrap;gap:4px}
.pc{font-size:11px;font-weight:600;border:1px solid var(--border);background:var(--card);color:var(--muted);border-radius:999px;padding:3px 9px;cursor:pointer}
.pc.on{background:var(--purple);color:#fff;border-color:var(--purple)}
.pc.done{color:var(--green-dk);border-color:#cde9da;background:var(--green-lt)}
.note{font-size:10.5px;color:var(--label);line-height:1.45}

/* ── Side panel ── */
.side{background:var(--card);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.side-scroll{flex:1;overflow-y:auto;padding:18px 22px 16px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.chap{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--green);background:var(--green-lt);padding:2px 8px;border-radius:4px}
.scount{font-family:var(--mono);font-size:10px;color:var(--label);letter-spacing:.08em}
.s-title{font-size:20px;font-weight:700;line-height:1.28;color:var(--text);margin-bottom:8px;letter-spacing:-.005em}
.s-lead{font-family:var(--sans);font-size:14px;line-height:1.7;color:var(--muted);margin-bottom:10px}
.s-body{font-size:13px;line-height:1.72;color:#3b4456}
.s-body ul{padding-left:1.05rem;margin:4px 0}
.s-body li{margin-bottom:4px}
.s-body li::marker{color:var(--purple-mid)}
.s-body b{color:var(--text);font-weight:600}
code,.s-body code{font-family:var(--mono);font-size:11.5px;background:var(--purple-lt);color:var(--purple-dk);padding:1px 5px;border-radius:4px;white-space:nowrap}
.parts{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.part{font-size:11.5px;border:1px solid var(--border);background:var(--card);color:var(--ink2);border-radius:999px;padding:3px 10px;cursor:pointer;transition:all .14s}
.part:hover,.part.on{border-color:#d9c6ec;background:var(--purple-lt);color:var(--purple-dk)}
.co{display:flex;gap:10px;padding:10px 12px;border-radius:10px;margin-top:10px;font-size:12.5px;line-height:1.62}
.co svg{flex:none;width:18px;height:18px;margin-top:2px}
.co .tag{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;margin-bottom:2px;opacity:.85}
.co.try{background:var(--purple-lt);color:var(--purple-dk)}
.co.myth{background:var(--coral-lt);color:var(--coral-dk)}
.co.key{background:var(--green-lt);color:var(--green-dk)}
.co.warn{background:var(--amber-lt);color:var(--amber-dk)}
.dd{margin-top:10px;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--card)}
.dd summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:12.5px;font-weight:600;color:var(--text);user-select:none}
.dd summary::-webkit-details-marker{display:none}
.dd summary .db{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;background:var(--purple);color:#fff;padding:2px 6px;border-radius:4px;flex-shrink:0}
.dd summary .dt{flex:1}
.dd summary .chev{color:var(--label);font-size:10px;transition:transform .2s}
.dd[open] summary{background:var(--purple-lt);border-bottom:1px solid var(--border)}
.dd[open] summary .chev{transform:rotate(180deg)}
.dd-in{padding:12px 14px;font-size:12.5px;line-height:1.75;color:#3b4456;background:var(--bg)}
.dd-in p+p,.dd-in p+ul,.dd-in ul+p{margin-top:8px}
.dd-in ul{padding-left:1.05rem}
.dd-in b{color:var(--text)}
.eq{font-family:var(--code);font-size:11.5px;line-height:1.7;background:#1F2433;color:#FFD580;border-radius:8px;padding:9px 12px;margin:8px 0;white-space:pre;overflow-x:auto}
.dd-hl{border-left:3px solid var(--purple);background:var(--purple-lt);color:var(--purple-dk);border-radius:0 8px 8px 0;padding:8px 11px;margin-top:8px;font-size:12px;line-height:1.65}
.side-foot{flex-shrink:0;border-top:1px solid var(--border);padding:10px 18px 12px;background:var(--card)}
.prog{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:9px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--purple));transition:width .3s}
.pills{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:9px}
.pill{width:28px;height:26px;border-radius:7px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-family:var(--mono);font-size:11px;font-weight:600;cursor:pointer;transition:all .13s}
.pill:hover{border-color:#d9c6ec;color:var(--purple);background:var(--purple-lt)}
.pill.on{background:var(--purple);border-color:var(--purple);color:#fff}
.pill-gap{width:6px}
.nav{display:flex;gap:8px}
.nav button{flex:1;padding:9px;font-size:13px;font-weight:700;border:none;border-radius:9px;background:var(--text);color:#fff;cursor:pointer;transition:background .15s}
.nav button:hover:not(:disabled){background:var(--purple)}
.nav button:disabled{background:var(--line);color:var(--label);cursor:not-allowed}
.kbd{font-family:var(--mono);font-size:9.5px;color:var(--label);text-align:center;margin-top:6px;letter-spacing:.06em}

/* takeaway */
.tk-hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:16px}
.tk-hero h2{font-size:24px;font-weight:700;letter-spacing:-.01em}
.tk-hero p{font-family:var(--serif);font-size:14px;color:var(--muted);margin-top:4px}
.tk-btns{display:flex;gap:8px;flex-wrap:wrap}
.tk-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.tk-sec{border:1px solid var(--border);border-radius:12px;padding:14px 16px;background:var(--card)}
.tk-sec h4{font-size:11px;font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--green);margin-bottom:10px}
.pr-list{display:grid;gap:8px}
.pr{display:flex;gap:10px;align-items:flex-start}
.pr .n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--purple);color:#fff;font-family:var(--mono);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
.pr b{display:block;font-size:13px}
.pr span{font-size:12px;color:var(--muted);line-height:1.5}
.tk-table{width:100%;border-collapse:collapse;font-size:12px}
.tk-table th{background:var(--purple);color:#fff;font-weight:600;padding:6px 8px;text-align:left}
.tk-table th:first-child{border-radius:6px 0 0 0}.tk-table th:last-child{border-radius:0 6px 0 0}
.tk-table td{padding:6px 8px;border-bottom:1px solid var(--line)}
.tk-table td:nth-child(2){color:var(--purple-dk);font-family:var(--mono);font-size:11.5px}
.tk-table td:nth-child(3){color:var(--muted);font-family:var(--mono);font-size:11.5px}
.tk-table tr:nth-child(even) td{background:#FBF8FD}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.kv span:last-child{font-family:var(--mono);color:var(--text);font-weight:600;font-size:12px;text-align:right}
.myths{display:grid;gap:7px}
.myth-row{display:grid;grid-template-columns:1fr 18px 1.3fr;gap:6px;align-items:start;font-size:12px;line-height:1.5}
.myth-row .x{color:var(--coral-dk);text-decoration:line-through;text-decoration-color:rgba(232,85,59,.5)}
.myth-row .a{color:var(--label);text-align:center}
.myth-row .o{color:var(--green-dk)}
.lim-row{display:grid;grid-template-columns:1fr 18px 1fr;gap:6px;font-size:12px;padding:5px 0;border-bottom:1px dashed var(--line)}
.lim-row .a{color:var(--label);text-align:center}
.lim-row span:last-child{color:var(--purple-dk);font-weight:600}
.tk-note{font-size:11px;color:var(--label);margin-top:8px}

/* popup */
.pop{display:none;position:fixed;inset:0;z-index:300;background:rgba(15,18,30,.78);align-items:center;justify-content:center;padding:28px}
.pop.show{display:flex}
.pop-box{position:relative;background:#fff;border-radius:14px;padding:14px;max-width:min(94vw,1100px);max-height:92vh;display:flex;flex-direction:column;gap:8px;box-shadow:0 24px 70px rgba(0,0,0,.45)}
.pop-box img{max-width:100%;max-height:calc(92vh - 80px);object-fit:contain;border-radius:8px;display:block}
.pop-cap{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.5}
.pop-x{position:absolute;top:-13px;right:-13px;width:32px;height:32px;border-radius:50%;border:none;background:var(--text);color:#fff;font-size:15px;cursor:pointer}
.pop-x:hover{background:var(--purple)}

/* responsive */
@media (max-width:1200px){:root{--side:380px}.inst{grid-template-columns:minmax(0,1.2fr) minmax(230px,1fr)}}
@media (max-width:940px){
  html,body{overflow:auto;height:auto}
  .hdr{position:sticky}
  .hdr-sub{display:none}
  .hdr{padding:0 12px;gap:10px}
  .hdr-div{display:none}
  .hdr-logo{height:26px}
  .hdr-title{white-space:normal;font-size:12.5px}
  .lang-btn{padding:3px 9px}
  .app{position:static;display:block}
  .stage{padding:10px 16px}
  .canvas-card{flex:none;height:min(78vw,560px);min-height:300px}
  .inst,.inst.tall{grid-template-columns:1fr;height:auto}
  .inst .icard{min-height:200px}
  .inst .chart{flex:none;height:190px}
  .inst .crow{flex:none;height:190px}
  .inst .crow .chart{height:100%;flex:1 1 0;width:auto;min-width:0}
  .side{border-left:none;border-top:1px solid var(--border)}
  .side-scroll{overflow:visible;padding:16px}
  .side-foot{position:sticky;bottom:0}
  .tk-grid{grid-template-columns:1fr}
  .recipe{overflow-x:auto}
}

    fg:['N₂/H₂ (forming gas)','Additive (≈ 4 % H₂ in N₂). Raises the O-atom yield and helps remove residues; pure N₂/H₂ chemistry strips without oxidizing low-k or metals.'],
    nf3:['NF₃','Chamber-clean gas: NF₃ → N₂ + 3 F with > 95 % dissociation. Not used during a wafer strip.'],
    mfc:['Mass flow controllers','Set each gas flow (sccm–slm). Together with the throttle valve they set the pressure.'],

    s9:{knobs:'Strip recipe',reset:'Baseline',P:'RPS power',p:'Pressure',T:'Wafer temp.',Q:'O₂ flow',fg:'N₂/H₂ add',out:'Results (teaching model)',rate:'Ash rate',u:'Non-uniformity',ox:'Si oxidation',wph:'Throughput',spec:'Spec',pass:'PASS',fail:'FAIL'},
  },
  steps:[
  { ch:0, title:'Inside a Remote Plasma Strip Tool',
    lead:'A remote plasma source (RPS) <b>makes the plasma somewhere else</b>. A closed-loop toroidal discharge produces O atoms; a short duct delivers them to a grounded, plasma-free chamber where they burn off the photoresist.',
    body:`<ul>
<li><b>Toroidal source</b>: ferrite cores + primary windings at ≈ 400 kHz; the plasma ring is the transformer’s secondary</li>
<li><b>Gases</b>: Ar (ignition), O₂ (strip), N₂/H₂ (additive), NF₃ (chamber clean)</li>
<li><b>Duct + baffle</b>: charged particles are lost on the way, atoms are delivered and spread</li>
<li><b>Heated, grounded chuck</b> at 200–300 °C and 0.5–3 Torr — no RF anywhere near the wafer</li></ul>`,
    co:[['try','Hover over the drawing — or tap a part below — to see what it does.'],
        ['key','Two separate jobs: the source turns electrical power into O atoms; the chamber turns O atoms + heat into CO₂ and H₂O. Every knob in this lesson acts on one of the two.']],
    dd:[{t:'Toroidal, microwave or ICP — three ways to build a remote source', b:`<p>All three deliver the same thing — neutral atoms in a flowing afterglow — but couple power differently.</p>
<div class="dd-hl"><b>Toroidal (transformer-coupled)</b>: ferrite cores, ≈ 400 kHz, very high power (up to ~15 kW). The standard for NF₃ chamber cleaning; also used for strip.</div>
<div class="dd-hl"><b>Microwave (2.45 GHz)</b>: a quartz or sapphire tube in a waveguide cavity. The classic downstream asher.</div>
<div class="dd-hl"><b>ICP downstream</b>: a 13.56 MHz coil around a dielectric tube, with a grounded grid between source and wafer to stop ions.</div>
<p>The physics of what happens after the source — recombination, wall loss, Arrhenius chemistry — is the same for all three.</p>`}] },

  { ch:1, title:'Ignition & Transformer Coupling',
    lead:'The ferrite core and primary winding form a transformer whose <b>secondary is the plasma itself</b> — a single conducting ring. The induced loop voltage must be high enough to keep that ring alive.',
    body:`<ul>
<li>Faraday: V<sub>loop</sub> = −dΦ/dt; with N primary turns, V<sub>loop</sub> = V₁ / N and I<sub>loop</sub> ≈ N · I₁</li>
<li>Sustaining needs a field E ≈ (E/p)<sub>gas</sub> · p around the loop — electronegative O₂ and NF₃ need far more than Ar</li>
<li>The loop field cannot <b>break down</b> gas at Torr pressure: a high-voltage starter ignites Ar, then the process gas is bled in</li>
<li>Power P = V<sub>loop</sub> · I<sub>loop</sub> → a very dense ring (10¹²–10¹³ cm⁻³)</li></ul>`,
    co:[['try','Switch to NF₃ and raise the pressure: the loop voltage needed climbs past the supply limit. Then try NF₃/Ar.'],
        ['myth','“A transformer source is just an ICP.” Same Faraday physics — but the closed ferrite core guides almost all of the flux through the plasma loop, so it couples efficiently at 400 kHz and handles very high power.']],
    dd:[{t:'Why ignite in Ar, and why dilute NF₃?', b:`<p>In electronegative gases electrons are lost by <b>attachment</b> (e⁻ + O₂ → O⁻ + O, e⁻ + NF₃ → NF₂ + F⁻). To keep the ring alive, each remaining electron must ionize faster, which needs a higher field per pressure. Ar has no attachment, so it breaks down and sustains most easily.</p>
<div class="eq">Sustaining E/p (illustrative, V cm⁻¹ Torr⁻¹)
Ar ≈ 1     O₂ ≈ 5     NF₃ ≈ 12     NF₃/Ar 1:1 ≈ 6.6</div>
<div class="dd-hl">Typical sequence: Ar strike at ~1 Torr → ramp power → bleed in O₂ (or NF₃) while reducing Ar → raise pressure to the process value.</div>`},
        {t:'Quartz or metal? — why the tube must not form a closed conducting loop', b:`<p>Anything that encircles the ferrite core is a secondary winding. A seamless <b>metal tube</b> would be a one-turn, short-circuited secondary: the loop voltage (hundreds of V) drives a huge eddy current through near-zero resistance, the power heats the metal, and the plasma never lights — exactly like shorting a transformer’s output.</p>
<div class="eq">Seamless metal → shorted secondary, wall heats
Quartz tube    → no current path, plasma heats
Metal + break  → electric loop open, gas loop closed</div>
<p>So there are two ways to build the loop. An <b>insulating tube</b> (quartz, sapphire, ceramic) cannot carry current at all. A <b>metal body with one or two dielectric breaks</b> (ceramic rings inserted in the loop) keeps the gas channel continuous but cuts the electrical one; the loop voltage then appears across the breaks, so they must be designed against arcing.</p>
<div class="dd-hl"><b>Quartz</b> suits O₂ strip sources: very low O recombination (γ ≈ 2×10⁻⁴), no metal contamination, already an oxide, and transparent for OES. But F etches it (SiO₂ + 4 F → SiF₄), it conducts heat poorly and cracks under thermal shock.</div>
<div class="dd-hl"><b>Anodized Al + dielectric breaks</b> is the standard for high-power NF₃ cleaning: AlF₃ / Al₂O₃ resist F, water cooling can be machined into the block for many kW, and it does not break. The anodized layer is the consumable.</div>`}] },

  { ch:1, title:'Dissociation — Turning Power into Atoms',
    lead:'Inside the ring, electrons break molecules apart. How many atoms come out is an <b>energy budget</b>: power divided by the energy spent per atom, compared with how many molecules flow through.',
    body:`<ul>
<li>e⁻ + O₂ → O + O (bond 5.1 eV, threshold ≈ 6 eV) — but most electron energy goes into excitation, ionization and gas heating</li>
<li>O₂ therefore costs tens of eV per atom → typically <b>10–30 %</b> dissociated</li>
<li>NF₃ dissociates by near-zero-energy electron attachment → <b>> 95 %</b> dissociated</li>
<li>More flow → more atoms but a lower fraction; more power → higher fraction, saturating</li></ul>`,
    co:[['try','Compare O₂ and NF₃ at 5 kW and 5 slm: the fractions differ far more than the bond energies would suggest.'],
        ['key','The strip rate follows the <b>atom flow</b> (atoms per second), not the dissociation fraction. Raising the O₂ flow lowers the fraction but can still raise the atom flow.']],
    dd:[{t:'Why not simply add more power?', b:`<p>The ring runs at thousands of kelvin gas temperature. More power heats the gas further, raises recombination inside the source and erodes the tube coating (anodized layer or quartz). Beyond a point, extra kW mostly becomes heat in the cooling water.</p>
<div class="dd-hl">A useful figure of merit is <b>atoms delivered per kWh</b> at the wafer — which also depends on the duct (next step).</div>`}] },

  { ch:2, title:'Downstream Duct — Ions Die, Atoms Survive',
    lead:'Leave the coupling region and the electrons cool within microseconds. Without heating, the charged population collapses by <b>recombination and diffusion to the walls</b> — while neutral atoms keep going as long as the walls do not catalyse O + O → O₂.',
    body:`<ul>
<li>Charges: dn/dt = −k<sub>a</sub>n − αn² (ambipolar diffusion + electron–ion recombination, α ≈ 2×10⁻⁷ cm³/s) → 10¹² falls to ~10⁸ cm⁻³ in a few ms</li>
<li>Atoms: lost at the wall with probability γ per hit, k = γ v̄ / 2r (diffusion-limited when γ is large)</li>
<li>γ<sub>O</sub>: PTFE ~10⁻⁴, quartz ~2×10⁻⁴, anodized Al ~3×10⁻³, stainless ~0.1</li>
<li>Transit time t = L / u; a grounded baffle or grid then removes the last ions and blocks VUV</li></ul>`,
    co:[['try','Switch the wall to stainless and lengthen the duct: the O atoms die — the ions were already gone.'],
        ['myth','“Ions are filtered by hitting the duct walls.” At Torr pressure most of the loss is recombination in the gas, and the density never reaches exactly zero — it becomes ~10⁻⁸ of the atom density, with only thermal energy.']],
    dd:[{t:'How are O atoms measured?', b:`<p><b>Actinometry</b>: add a trace of Ar and compare the O 844 nm line with Ar 750 nm; with similar excitation, the ratio tracks [O].</p>
<p><b>NO titration</b>: NO + O → NO₂* glows yellow-green; adding NO until the glow vanishes counts the O atoms.</p>
<div class="dd-hl">Catalytic probes (a hot wire heated by O + O recombination on its surface) give a simple online signal.</div>`}] },

  { ch:2, title:'In the Chamber — Distribution & Loading',
    lead:'The atoms arrive at one point and are <b>consumed by the resist itself</b>. A baffle spreads them out; how much resist is exposed sets how fast they are used up.',
    body:`<ul>
<li>Center jet → center-fast strip; baffle / showerhead → near-uniform</li>
<li><b>Loading</b>: every O atom that burns resist is gone — more exposed resist → lower O density → slower strip</li>
<li>Higher pressure → slower diffusion → stronger center-to-edge drop</li>
<li>No sheath, no field: transport is only gas flow and diffusion</li></ul>`,
    co:[['try','Switch to the center jet and raise the resist coverage: the center strips faster and the average falls.'],
        ['key','Loading is why a blanket-resist wafer and a lightly patterned product wafer strip at different rates — recipes are qualified on real product.']],
    dd:[{t:'Supply versus consumption', b:`<p>The O density above the wafer is set by a balance: <b>supply</b> from the duct against loss to the walls, to the gas (O + O + M) and to the resist. The resist term is a reaction probability (~10⁻⁴–10⁻³ per collision at 250 °C) times the exposed area.</p>
<div class="dd-hl">When the resist term dominates, the strip is <b>supply-limited</b> and strongly loaded; when walls dominate, it is <b>reaction-limited</b> and nearly independent of pattern.</div>`}] },

  { ch:2, title:'Direct vs. Remote — What Hits the Wafer',
    lead:'Same O₂, same atoms — but a wafer inside the plasma also receives <b>ions, electrons and VUV photons</b>. Remote operation keeps the chemistry and removes the rest.',
    body:`<ul>
<li>Direct (CCP / ICP asher): ion flux 10¹⁵–10¹⁶ cm⁻²s⁻¹ at 10–300 eV plus 130 nm O VUV — fast, even at low temperature</li>
<li>…but it charges gate oxides and breaks Si–CH₃ bonds in porous low-k</li>
<li>Remote: ions < 10⁹ cm⁻²s⁻¹ at thermal energy; the baffle blocks VUV</li>
<li>The price: remote needs heat (≈ 250 °C) to reach the same rate</li></ul>`,
    co:[['try','Toggle the mode and compare the bars: O-atom flux is similar, ions and VUV are not.'],
        ['myth','“Remote plasma is damage-free.” It is ion- and VUV-free. O atoms still oxidize exposed silicon and strip carbon from porous low-k — chemical damage needs a chemical fix (N₂/H₂).']],
    dd:[{t:'Why VUV matters for low-k', b:`<p>The O resonance lines at 130 nm (9.5 eV) are absorbed in the top tens of nm of porous SiCOH and break Si–CH₃ bonds. O atoms then diffuse into the pores and replace methyl groups with Si–OH, raising k.</p>
<div class="dd-hl">Photons travel in straight lines — an opaque baffle between source and wafer removes them completely. Atoms flow around it.</div>`}] },

  { ch:3, title:'Ashing Kinetics — Heat & Additives',
    lead:'Remote stripping is thermally activated chemistry: rate ∝ (O flux)<sup>0.8</sup> × exp(−Eₐ/kT). Temperature is the strongest knob; small additives change the chemistry itself.',
    body:`<ul>
<li>Eₐ ≈ 0.5 eV for O + resist → the rate doubles about every 25 °C near 250 °C</li>
<li>N₂/H₂: more O atoms and H abstraction → faster, fewer residues</li>
<li>CF₄ (≈ 1 %): F abstracts H, lowers Eₐ and raises the rate strongly — but it etches oxide, so it is used sparingly</li>
<li>More power helps less than more temperature (flux exponent < 1)</li></ul>`,
    co:[['try','Lower the temperature to 150 °C and see how far the rate falls; then add CF₄ and compare the oxide loss.'],
        ['key','On an Arrhenius plot each chemistry is a straight line with slope −Eₐ/k. CF₄ makes the line flatter (lower Eₐ) and higher.']],
    dd:[{t:'Why flux^0.8 and not linear?', b:`<p>O atoms adsorb on the resist surface before reacting. At low flux the surface is mostly empty and the rate follows the flux; at high flux adsorption sites fill up and O + O recombination on the surface competes — the response flattens (Langmuir–Hinshelwood behaviour).</p>`}] },

  { ch:3, title:'Full Strip — Endpoint & Implanted Resist',
    lead:'A strip is timed by its <b>endpoint</b>: the by-product signal stays flat while resist burns, then falls when it clears. Ion-implanted resist adds a trap — a hard carbonized crust.',
    body:`<ul>
<li>CO / CO₂ / H₂O signal ∝ removal rate → it drops at clear; then 20–50 % <b>over-ash</b> cleans residues in topography</li>
<li>High-dose implant (> 10¹⁵ cm⁻²): the top 20–50 nm becomes a cross-linked crust that strips ~10× slower</li>
<li>Heating fast under the crust → trapped solvent boils → the crust bursts (<b>popping</b>) → particles</li>
<li>Fix: stepped heating — remove the crust at low temperature first, then go hot</li></ul>`,
    co:[['try','Choose high-dose implant + direct 250 °C and run: watch for popping. Then switch to stepped heating.'],
        ['key','Endpoint is taken where the signal falls most steeply; over-ash is a percentage of the time to endpoint.']],
    dd:[{t:'What is left after the ash?', b:`<p>Ash removes the carbon-hydrogen polymer only. Implanted dopants (as oxides of As, P, B), metal contamination and sidewall polymers from etch are not volatile in O atoms.</p>
<div class="dd-hl">That is why every strip is followed by a wet clean (SPM, dilute HF or a solvent) — “ash + clean” is one module.</div>`}] },

  { ch:3, title:'Cleaning Mode — NF₃ Chamber Clean',
    lead:'The same source running NF₃ cleans CVD chambers: F atoms turn the SiO₂ / SiN built up on walls into <b>volatile SiF₄</b> — no wafer, no in-situ plasma, no ion wear on chamber parts.',
    body:`<ul>
<li>NF₃ (+ Ar) → N₂ + 3 F at > 95 % dissociation</li>
<li>SiO₂ + 4 F → SiF₄ + O₂; endpoint when the SiF₄ signal (FTIR / OES) returns to baseline</li>
<li>Source and duct walls: anodized Al / Al₂O₃ resist F; quartz would be etched</li>
<li>NF₃ is a strong greenhouse gas (GWP ≈ 17 000) → high destruction in the source + abatement</li></ul>`,
    co:[['try','Double the deposit thickness and halve the NF₃ flow: compare clean time and F utilization.'],
        ['key','Remote clean replaced in-situ RF cleaning with C₂F₆: faster, no ion erosion of showerhead and heater, and far lower PFC emissions.']],
    dd:[{t:'Why remote clean replaced in-situ clean', b:`<p>In-situ cleaning ran a C₂F₆/O₂ plasma inside the CVD chamber. Much of the C₂F₆ passed through undissociated (a potent PFC), and ion bombardment slowly eroded the showerhead and heater.</p>
<div class="dd-hl">A remote NF₃ source dissociates almost all of the feed, delivers only F atoms, and the chamber parts see chemistry without sputtering.</div>`}] },

  { ch:3, title:'Process Window — Build a Strip Recipe',
    lead:'Speed, uniformity and substrate safety pull in different directions. Find a recipe that meets every spec at once.',
    body:`<ul>
<li>Power + O₂ flow → O-atom flow (Step 3)</li>
<li>Temperature → rate (Arrhenius), but also oxidation of exposed silicon</li>
<li>Pressure → uniformity (diffusion) and gas-phase recombination</li>
<li>N₂/H₂ → rate boost up to ~10 %, then mere dilution</li>
<li>Specs: rate ≥ 3 µm/min, non-uniformity ≤ 5 %, Si oxidation ≤ 15 Å</li></ul>`,
    co:[['try','The baseline fails on rate. Raise the temperature first, then the power — and keep an eye on Si oxidation.'],
        ['warn','Teaching model: trends are physical, numbers are illustrative.']],
    dd:[{t:'Throughput arithmetic', b:`<p>Strip time = thickness / rate × (1 + over-ash) + overhead (pump, heat, transfer). With 1.5 µm of resist, going from 3 to 6 µm/min saves only ~20 s per wafer — overhead soon dominates, which is why strip tools use several stations in parallel.</p>`}] },

  { ch:4, title:'Key Takeaways', lead:'', body:'', co:[], dd:[] },
  ],
  tk:{

    duct:['Downstream Duct','Source의 Afterglow를 챔버로 운반합니다. 하전 입자는 수 ms 안에 사라지고, 벽 재결합 확률 γ가 낮으면 원자는 살아남습니다.'],

  steps:[
  { ch:0, title:'Remote Plasma Strip 장비의 내부',
    lead:'Remote Plasma Source(RPS)는 <b>플라즈마를 다른 곳에서 만듭니다</b>. 닫힌 루프의 Toroidal 방전이 O 원자를 만들고, 짧은 Duct가 이를 접지된 무(無)플라즈마 챔버로 보내 포토레지스트를 태워 없앱니다.',
    body:`<ul>
<li><b>Toroidal Source</b>: ≈ 400 kHz의 Ferrite Core + 1차 권선; 플라즈마 링이 변압기의 2차측</li>
<li><b>가스</b>: Ar(점화), O₂(Strip), N₂/H₂(첨가), NF₃(Chamber Clean)</li>
<li><b>Duct + Baffle</b>: 하전 입자는 도중에 사라지고, 원자는 전달되어 퍼짐</li>
<li><b>가열·접지 Chuck</b> 200–300 °C, 0.5–3 Torr — 웨이퍼 근처 어디에도 RF 없음</li></ul>`,
    co:[['try','그림 위에 마우스를 올리거나 아래 부품을 눌러 역할을 확인해 보세요.'],
        ['key','두 가지 일이 분리되어 있습니다: Source는 전력을 O 원자로, 챔버는 O 원자 + 열을 CO₂와 H₂O로 바꿉니다. 이 강의의 모든 조절값은 둘 중 하나에 작용합니다.']],
    dd:[{t:'Toroidal, Microwave, ICP — Remote Source를 만드는 세 가지 방법', b:`<p>세 방식 모두 같은 것 — 흐르는 Afterglow 속의 중성 원자 — 을 전달하지만, 전력 결합 방식이 다릅니다.</p>
<div class="dd-hl"><b>Toroidal (변압기 결합)</b>: Ferrite Core, ≈ 400 kHz, 매우 높은 파워(~15 kW). NF₃ Chamber Cleaning의 표준이며 Strip에도 쓰입니다.</div>
<div class="dd-hl"><b>Microwave (2.45 GHz)</b>: 도파관 Cavity 안의 석영/사파이어 튜브. 전통적인 Downstream Asher.</div>
<div class="dd-hl"><b>ICP Downstream</b>: 유전체 튜브를 감은 13.56 MHz 코일, Source와 웨이퍼 사이 접지 Grid로 이온 차단.</div>
<p>Source 이후의 물리 — 재결합, 벽 손실, Arrhenius 화학 — 는 세 방식 모두 같습니다.</p>`}] },

  { ch:1, title:'점화와 변압기 결합',
    lead:'Ferrite Core와 1차 권선은 <b>2차측이 플라즈마 자체인</b> 변압기를 이룹니다 — 하나의 도전성 링입니다. 유도 루프 전압이 그 링을 유지할 만큼 높아야 합니다.',
    body:`<ul>
<li>Faraday: V<sub>loop</sub> = −dΦ/dt; 1차 권선 N회이면 V<sub>loop</sub> = V₁ / N, I<sub>loop</sub> ≈ N · I₁</li>
<li>유지에는 루프를 따라 E ≈ (E/p)<sub>gas</sub> · p 의 전계가 필요 — 전기음성 기체 O₂, NF₃는 Ar보다 훨씬 큼</li>
<li>Torr 압력에서는 루프 전계로 <b>절연 파괴</b>가 불가능: 고전압 Starter로 Ar을 점화한 뒤 공정 가스를 흘려 넣음</li>
<li>파워 P = V<sub>loop</sub> · I<sub>loop</sub> → 매우 높은 밀도의 링 (10¹²–10¹³ cm⁻³)</li></ul>`,
    co:[['try','NF₃로 바꾸고 압력을 올려 보세요: 필요한 루프 전압이 전원 한계를 넘습니다. 그다음 NF₃/Ar을 시도해 보세요.'],
        ['myth','“변압기 결합 Source는 그냥 ICP다.” 같은 Faraday 물리지만, 닫힌 Ferrite Core가 거의 모든 Flux를 플라즈마 루프로 보내므로 400 kHz에서도 효율적으로 결합하고 매우 높은 파워를 견딥니다.']],
    dd:[{t:'왜 Ar로 점화하고, 왜 NF₃를 희석하나?', b:`<p>전기음성 기체에서는 전자가 <b>부착</b>(e⁻ + O₂ → O⁻ + O, e⁻ + NF₃ → NF₂ + F⁻)으로 사라집니다. 링을 유지하려면 남은 전자가 더 빨리 이온화해야 하므로, 압력당 더 큰 전계가 필요합니다. Ar은 부착이 없어 절연 파괴와 유지가 가장 쉽습니다.</p>
<div class="eq">유지 E/p (예시값, V cm⁻¹ Torr⁻¹)
Ar ≈ 1     O₂ ≈ 5     NF₃ ≈ 12     NF₃/Ar 1:1 ≈ 6.6</div>
<div class="dd-hl">일반적인 순서: ~1 Torr에서 Ar 점화 → 파워 상승 → Ar을 줄이며 O₂(또는 NF₃) 주입 → 공정 압력으로 상승.</div>`},
        {t:'석영인가 금속인가? — 튜브가 닫힌 전도 루프가 되면 안 되는 이유', b:`<p>Ferrite Core를 감싸고 한 바퀴 도는 것은 무엇이든 2차 권선이 됩니다. 이음매 없는 <b>금속 튜브</b>라면 1회 감긴 단락 2차 권선이 됩니다: 루프 전압(수백 V)이 저항이 거의 0인 금속에 거대한 와전류를 흘리고, 전력은 벽을 가열하는 데 쓰이며, 플라즈마는 켜지지 않습니다 — 변압기 출력을 쇼트시킨 것과 같습니다.</p>
<div class="eq">이음매 없는 금속 → 단락 2차측, 벽 가열
석영 튜브 → 전류 경로 없음, 플라즈마 가열
금속 + Break → 전기 루프 끊김, 가스 통로 유지</div>
<p>그래서 루프를 만드는 방법은 두 가지입니다. <b>절연 튜브</b>(석영, 사파이어, 세라믹)는 애초에 전류가 흐를 수 없습니다. <b>금속 몸체 + Dielectric Break</b>는 루프 중간에 세라믹 절연 링을 한두 개 끼워 가스 통로는 이어 두고 전기 경로만 끊습니다. 이때 루프 전압이 절연 틈에 걸리므로 아킹을 막는 설계가 필요합니다.</p>
<div class="dd-hl"><b>석영</b>은 O₂ Strip용 Source에 적합합니다: O 재결합이 매우 낮고(γ ≈ 2×10⁻⁴), 금속 오염이 없으며, 이미 산화물이고, OES 관찰을 위해 투명합니다. 그러나 F에 식각되고(SiO₂ + 4 F → SiF₄), 열전도가 나빠 열충격에 깨지기 쉽습니다.</div>
<div class="dd-hl"><b>Anodized Al + Dielectric Break</b>는 고출력 NF₃ Cleaning의 표준입니다: AlF₃ / Al₂O₃가 F에 강하고, 블록에 수냉 채널을 가공해 수 kW 이상을 감당하며, 깨지지 않습니다. Anodizing 층이 소모품입니다.</div>`}] },

  { ch:1, title:'해리 — 전력을 원자로 바꾸기',
    lead:'링 안에서 전자가 분자를 쪼갭니다. 얼마나 많은 원자가 나오는지는 <b>에너지 수지</b>로 정해집니다: 파워 ÷ 원자당 소비 에너지를, 흘러 지나가는 분자 수와 비교합니다.',
    body:`<ul>
<li>e⁻ + O₂ → O + O (결합 5.1 eV, 문턱 ≈ 6 eV) — 그러나 전자 에너지 대부분은 여기, 이온화, 가스 가열로 쓰임</li>
<li>그래서 O₂는 원자당 수십 eV가 들어 → 보통 <b>10–30 %</b> 해리</li>
<li>NF₃는 거의 0 eV의 전자 부착으로 해리 → <b>> 95 %</b> 해리</li>
<li>유량↑ → 원자 수는 늘지만 해리율↓; 파워↑ → 해리율↑, 점차 포화</li></ul>`,
    co:[['try','5 kW, 5 slm에서 O₂와 NF₃를 비교해 보세요: 해리율 차이가 결합 에너지 차이보다 훨씬 큽니다.'],
        ['key','Strip 속도는 해리율이 아니라 <b>원자 유량</b>(초당 원자 수)을 따릅니다. O₂ 유량을 올리면 해리율은 떨어져도 원자 유량은 오를 수 있습니다.']],
    dd:[{t:'왜 그냥 파워를 더 넣지 않나?', b:`<p>링의 가스 온도는 수천 K입니다. 파워를 더 넣으면 가스가 더 뜨거워지고, Source 내부 재결합이 늘며, 튜브 코팅(Anodized 층이나 석영)이 침식됩니다. 어느 지점을 넘으면 추가 kW는 대부분 냉각수의 열이 됩니다.</p>
<div class="dd-hl">유용한 성능 지표는 웨이퍼에 <b>kWh당 전달된 원자 수</b>이며, 이는 Duct(다음 단계)에도 좌우됩니다.</div>`}] },

  { ch:2, title:'Downstream Duct — 이온은 사라지고 원자는 살아남는다',
    lead:'결합 영역을 벗어나면 전자는 수 µs 안에 식습니다. 가열이 없으니 하전 입자는 <b>재결합과 벽으로의 확산</b>으로 급감하고 — 중성 원자는 벽이 O + O → O₂를 촉매하지 않는 한 계속 나아갑니다.',
    body:`<ul>
<li>하전 입자: dn/dt = −k<sub>a</sub>n − αn² (양극성 확산 + 전자–이온 재결합, α ≈ 2×10⁻⁷ cm³/s) → 수 ms 동안 10¹²에서 ~10⁸ cm⁻³로</li>
<li>원자: 벽 충돌마다 확률 γ로 손실, k = γ v̄ / 2r (γ가 크면 확산이 율속)</li>
<li>γ<sub>O</sub>: PTFE ~10⁻⁴, 석영 ~2×10⁻⁴, Anodized Al ~3×10⁻³, Stainless ~0.1</li>
<li>통과 시간 t = L / u; 접지 Baffle이나 Grid가 마지막 이온을 제거하고 VUV를 차단</li></ul>`,
    co:[['try','벽을 Stainless로 바꾸고 Duct를 늘려 보세요: O 원자가 사라집니다 — 이온은 이미 없어졌습니다.'],
        ['myth','“이온은 Duct 벽에 부딪혀 걸러진다.” Torr 압력에서는 손실 대부분이 기체 중 재결합이며, 밀도가 정확히 0이 되지도 않습니다 — 원자 밀도의 ~10⁻⁸ 수준이 되고, 에너지는 열에너지뿐입니다.']],
    dd:[{t:'O 원자는 어떻게 측정하나?', b:`<p><b>Actinometry</b>: 소량의 Ar을 넣고 O 844 nm 선과 Ar 750 nm 선을 비교합니다. 여기 조건이 비슷하므로 비율이 [O]를 따라갑니다.</p>
<p><b>NO Titration</b>: NO + O → NO₂*가 황록색으로 빛납니다. 빛이 사라질 때까지 넣은 NO 양으로 O 원자를 셉니다.</p>
<div class="dd-hl">촉매 Probe(표면의 O + O 재결합 열로 데워지는 열선)는 간단한 실시간 신호를 줍니다.</div>`}] },

  { ch:2, title:'챔버 안 — 분포와 Loading',
    lead:'원자는 한 지점으로 들어와 <b>레지스트 자체에 소비됩니다</b>. Baffle이 이를 퍼뜨리고, 노출된 레지스트 면적이 소비 속도를 정합니다.',
    body:`<ul>
<li>중앙 분사 → 중심이 빨리 Strip; Baffle / Showerhead → 거의 균일</li>
<li><b>Loading</b>: 레지스트를 태운 O 원자는 사라짐 — 노출 레지스트↑ → O 밀도↓ → Strip↓</li>
<li>압력↑ → 확산↓ → 중심–가장자리 차이↑</li>
<li>Sheath도 전계도 없음: 수송은 가스 흐름과 확산뿐</li></ul>`,
    co:[['try','중앙 분사로 바꾸고 레지스트 면적을 올려 보세요: 중심이 더 빨리 Strip되고 평균은 떨어집니다.'],
        ['key','Loading 때문에 전면 레지스트 웨이퍼와 패턴이 적은 제품 웨이퍼의 Strip 속도가 다릅니다 — Recipe는 실제 제품으로 검증합니다.']],
    dd:[{t:'공급 대 소비', b:`<p>웨이퍼 위 O 밀도는 Duct로부터의 <b>공급</b>과 벽, 기체(O + O + M), 레지스트로의 손실 사이 균형으로 정해집니다. 레지스트 항은 반응 확률(250 °C에서 충돌당 ~10⁻⁴–10⁻³) × 노출 면적입니다.</p>
<div class="dd-hl">레지스트 항이 지배하면 <b>공급 율속</b>이라 Loading이 크고, 벽 손실이 지배하면 <b>반응 율속</b>이라 패턴과 거의 무관합니다.</div>`}] },

  { ch:2, title:'Direct vs. Remote — 웨이퍼에 무엇이 닿나',
    lead:'같은 O₂, 같은 원자 — 그러나 플라즈마 속 웨이퍼는 <b>이온, 전자, VUV 광자</b>도 받습니다. Remote 방식은 화학은 남기고 나머지를 없앱니다.',
    body:`<ul>
<li>Direct (CCP / ICP Asher): 10–300 eV의 이온 Flux 10¹⁵–10¹⁶ cm⁻²s⁻¹ + 130 nm O VUV — 저온에서도 빠름</li>
<li>…그러나 Gate 산화막을 Charging시키고 다공성 Low-k의 Si–CH₃ 결합을 끊음</li>
<li>Remote: 이온 < 10⁹ cm⁻²s⁻¹, 열에너지 수준; Baffle이 VUV 차단</li>
<li>대가: Remote는 같은 속도를 얻으려면 열(≈ 250 °C)이 필요</li></ul>`,
    co:[['try','모드를 바꿔 막대를 비교해 보세요: O 원자 Flux는 비슷하지만 이온과 VUV는 다릅니다.'],
        ['myth','“Remote 플라즈마는 손상이 없다.” 이온과 VUV가 없을 뿐입니다. O 원자는 여전히 노출된 실리콘을 산화시키고 다공성 Low-k의 탄소를 빼냅니다 — 화학적 손상에는 화학적 해법(N₂/H₂)이 필요합니다.']],
    dd:[{t:'Low-k에 VUV가 중요한 이유', b:`<p>130 nm(9.5 eV)의 O 공명선은 다공성 SiCOH의 상부 수십 nm에서 흡수되어 Si–CH₃ 결합을 끊습니다. 이어서 O 원자가 기공 속으로 확산해 메틸기를 Si–OH로 바꾸고 k가 올라갑니다.</p>
<div class="dd-hl">광자는 직진합니다 — Source와 웨이퍼 사이 불투명한 Baffle이 이를 완전히 제거합니다. 원자는 Baffle을 돌아 흐릅니다.</div>`}] },

  { ch:3, title:'Ashing 반응 속도 — 열과 첨가 가스',
    lead:'Remote Strip은 열 활성화 화학입니다: Rate ∝ (O Flux)<sup>0.8</sup> × exp(−Eₐ/kT). 온도가 가장 강한 조절값이고, 소량의 첨가 가스는 화학 자체를 바꿉니다.',
    body:`<ul>
<li>O + 레지스트의 Eₐ ≈ 0.5 eV → 250 °C 근처에서 약 25 °C마다 속도 2배</li>
<li>N₂/H₂: O 원자 증가 + H 추출 → 더 빠르고 잔류물 감소</li>
<li>CF₄ (≈ 1 %): F가 H를 추출, Eₐ를 낮추고 속도를 크게 올림 — 그러나 산화막을 식각하므로 조금만 사용</li>
<li>파워는 온도만큼 효과가 크지 않음 (Flux 지수 < 1)</li></ul>`,
    co:[['try','온도를 150 °C로 내려 속도가 얼마나 떨어지는지 보고, CF₄를 넣어 산화막 손실을 비교해 보세요.'],
        ['key','Arrhenius Plot에서 각 화학은 기울기 −Eₐ/k의 직선입니다. CF₄는 직선을 더 완만하게(Eₐ↓) 그리고 더 높게 만듭니다.']],
    dd:[{t:'왜 Flux^0.8이고 선형이 아닌가?', b:`<p>O 원자는 반응 전에 레지스트 표면에 흡착합니다. Flux가 낮으면 표면이 대부분 비어 있어 속도가 Flux를 따르지만, Flux가 높으면 흡착 자리가 차고 표면의 O + O 재결합이 경쟁해 응답이 완만해집니다 (Langmuir–Hinshelwood 거동).</p>`}] },

  { ch:3, title:'전체 Strip — Endpoint와 Implant 레지스트',
    lead:'Strip 시간은 <b>Endpoint</b>로 정합니다: 레지스트가 타는 동안 부산물 신호는 평탄하다가, 다 제거되면 떨어집니다. 이온 주입된 레지스트에는 함정이 있습니다 — 단단한 탄화 Crust.',
    body:`<ul>
<li>CO / CO₂ / H₂O 신호 ∝ 제거 속도 → Clear 시점에 하락; 이후 20–50 % <b>Over-ash</b>로 단차 속 잔류물 제거</li>
<li>고농도 Implant(> 10¹⁵ cm⁻²): 상부 20–50 nm가 가교된 Crust가 되어 ~10배 느리게 Strip</li>
<li>Crust 아래를 빨리 가열 → 갇힌 용매가 끓음 → Crust 파열(<b>Popping</b>) → 파티클</li>
<li>해법: 단계 가열 — 저온에서 Crust를 먼저 제거한 뒤 고온으로</li></ul>`,
    co:[['try','고농도 Implant + 바로 250 °C로 실행해 Popping을 보고, 단계 가열로 바꿔 보세요.'],
        ['key','Endpoint는 신호가 가장 가파르게 떨어지는 곳에서 잡고, Over-ash는 Endpoint까지 시간의 백분율로 정합니다.']],
    dd:[{t:'Ash 후에는 무엇이 남나?', b:`<p>Ash는 탄소–수소 고분자만 제거합니다. 주입된 도펀트(As, P, B의 산화물), 금속 오염, Etch 측벽 Polymer는 O 원자로 휘발되지 않습니다.</p>
<div class="dd-hl">그래서 모든 Strip 뒤에는 습식 세정(SPM, 묽은 HF, 또는 Solvent)이 따릅니다 — “Ash + Clean”이 하나의 모듈입니다.</div>`}] },

  { ch:3, title:'Cleaning 모드 — NF₃ Chamber Clean',
    lead:'같은 Source에 NF₃를 흘리면 CVD 챔버를 세정합니다: F 원자가 벽에 쌓인 SiO₂ / SiN을 <b>휘발성 SiF₄</b>로 바꿉니다 — 웨이퍼도, 챔버 내 플라즈마도, 부품의 이온 마모도 없습니다.',
    body:`<ul>
<li>NF₃ (+ Ar) → N₂ + 3 F, 해리율 > 95 %</li>
<li>SiO₂ + 4 F → SiF₄ + O₂; SiF₄ 신호(FTIR / OES)가 기준선으로 돌아오면 Endpoint</li>
<li>Source와 Duct 벽: Anodized Al / Al₂O₃는 F에 강함; 석영은 식각됨</li>
<li>NF₃는 강력한 온실가스(GWP ≈ 17 000) → Source에서 높은 분해율 + Abatement</li></ul>`,
    co:[['try','퇴적 두께를 두 배로, NF₃ 유량을 절반으로 바꿔 Clean 시간과 F 이용률을 비교해 보세요.'],
        ['key','Remote Clean은 C₂F₆를 쓰던 In-situ RF Clean을 대체했습니다: 더 빠르고, Showerhead와 Heater의 이온 침식이 없으며, PFC 배출이 훨씬 적습니다.']],
    dd:[{t:'Remote Clean이 In-situ Clean을 대체한 이유', b:`<p>In-situ Cleaning은 CVD 챔버 안에서 C₂F₆/O₂ 플라즈마를 켰습니다. C₂F₆의 상당 부분이 해리되지 않고 배출되었고(강력한 PFC), 이온 충격이 Showerhead와 Heater를 서서히 침식했습니다.</p>
<div class="dd-hl">Remote NF₃ Source는 공급 가스를 거의 모두 해리하고 F 원자만 전달하므로, 챔버 부품은 Sputtering 없이 화학 반응만 겪습니다.</div>`}] },

  { ch:3, title:'Process Window — Strip Recipe 만들기',
    lead:'속도, 균일도, 기판 안전성은 서로 다른 방향을 당깁니다. 모든 Spec을 동시에 만족하는 Recipe를 찾아 보세요.',
    body:`<ul>
<li>파워 + O₂ 유량 → O 원자 유량 (Step 3)</li>
<li>온도 → 속도(Arrhenius), 그러나 노출된 실리콘의 산화도 증가</li>
<li>압력 → 균일도(확산)와 기체 중 재결합</li>
<li>N₂/H₂ → ~10 %까지 속도 증가, 그 이상은 희석일 뿐</li>
<li>Spec: Rate ≥ 3 µm/min, 불균일도 ≤ 5 %, Si 산화 ≤ 15 Å</li></ul>`,
    co:[['try','Baseline은 속도에서 FAIL입니다. 먼저 온도를, 그다음 파워를 올리되 Si 산화를 지켜보세요.'],
        ['warn','교육용 모델: 경향은 물리적이며 수치는 예시입니다.']],
    dd:[{t:'처리량 계산', b:`<p>Strip 시간 = 두께 / 속도 × (1 + Over-ash) + Overhead(배기, 가열, 이송). 레지스트 1.5 µm에서 3 → 6 µm/min으로 올려도 웨이퍼당 ~20 s만 줄어듭니다 — 곧 Overhead가 지배하므로 Strip 장비는 여러 Station을 병렬로 씁니다.</p>`}] },

          ['Profile','등방성','등방성 (Bias 시 이방성)'],
          ['손상 위험','화학적 손상뿐 (산화, Low-k 탄소 손실)','Charging, VUV, 이온 손상']],
    win:[['RPS 파워','2 – 10 kW'],['주파수','≈ 400 kHz'],['압력','0.5 – 3 Torr'],['O₂ 유량','2 – 10 slm'],['N₂/H₂ 첨가','0 – 10 %'],['웨이퍼 온도','200 – 300 °C'],['Ash Rate','2 – 8 µm/min'],['산화막 대비 선택비','> 1000 : 1 (CF₄ 없음)']],
    winNote:'대표값 / 예시 범위 — 실제 장비와 Recipe로 반드시 확인하세요.',
    myths:[['Remote 플라즈마는 손상이 없다','이온·VUV가 없을 뿐; O 원자는 산화와 Low-k 손상을 일으킴'],
           ['이온은 벽 충돌로 걸러진다','주로 기체 중 재결합; ~10⁴배 감소, 0은 아님'],
           ['O₂는 대부분 해리된다','보통 10–30 %; NF₃는 > 95 %'],
           ['Toroid는 항상 석영이다','NF₃ Source는 Anodized Al — F가 석영을 식각'],
           ['파워에 비례해 빨라진다','Rate ∝ Γ^0.8; 온도가 더 강한 조절값'],
           ['Ash가 모든 것을 제거한다','도펀트와 금속은 남음 → 습식 세정 필요']],
    lim:[['저온에서 느림','~250 °C 가열, N₂/H₂, 소량 CF₄'],
         ['Implant Crust Popping','단계 가열, 저온 Crust Strip'],
         ['Low-k 탄소 손실','N₂/H₂ (환원) 화학'],
         ['불균일한 전달','Baffle / Showerhead 설계'],
         ['Duct 내 원자 손실','짧은 Duct, 낮은 γ 코팅'],
         ['NF₃ 온실 효과','> 99 % 분해 + Abatement']],
  },
},

<script>
'use strict';
/* ============================== ENGINE ============================== */
const $=id=>document.getElementById(id);
const TAU=Math.PI*2, rnd=Math.random;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
let lang='en';
const L=()=>T[lang];
const IL=k=>T[lang].I[k];

/* ---------- canvas & logical frame (960×600, letterboxed) ---------- */
const cv=$('cv'), ctx=cv.getContext('2d'), wrap=$('cvWrap');
const LW=960, LH=600;
let DPR=1, RS=1, OX=0, OY=0;
function resize(){
  const w=wrap.clientWidth, h=wrap.clientHeight; if(!w||!h) return;
  DPR=window.devicePixelRatio||1;
  cv.width=Math.round(w*DPR); cv.height=Math.round(h*DPR);
  RS=Math.min(w/LW,h/LH); OX=(w-LW*RS)/2; OY=(h-LH*RS)/2;
}
new ResizeObserver(resize).observe(wrap); resize();
function beginFrame(){
  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(RS*DPR,0,0,RS*DPR,OX*DPR,OY*DPR);
}

const FONT='"Google Sans","Noto Sans KR",system-ui,sans-serif', MONO=FONT;   // Latin & digits: Google Sans; Hangul falls back to Noto Sans KR
const C={purple:'#7030A0',purpleLt:'#F0E8F8',purpleMid:'#9B59D0',green:'#0F8C50',greenLt:'#E6F4ED',coral:'#E8553B',amber:'#D99A00',
  ink:'#1A202C',ink2:'#334155',muted:'#64748B',label:'#94A3B8',border:'#E2E8F0',line:'#EEF2F6',blue:'#3A7AD6'};

/* ---------- drawing helpers (shared with the PE-CVD lesson) ---------- */
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function pl(pts,col,w,dash,off){ctx.save();ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';if(dash){ctx.setLineDash(dash);ctx.lineDashOffset=off||0;}ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.stroke();ctx.restore();}
function pipe(pts,flow,col){pl(pts,'#C7CED9',3.4);pl(pts,'#FFFFFF',1.4);if(flow)pl(pts,col||'rgba(112,48,160,.7)',1.7,[4,8],-time*30);}
function txt(s,x,y,o={}){ctx.save();ctx.font=`${o.w||400} ${o.sz||11}px ${o.mono?MONO:FONT}`;ctx.fillStyle=o.c||C.muted;ctx.textAlign=o.a||'left';ctx.textBaseline=o.b||'middle';ctx.fillText(s,x,y);ctx.restore();}
function arrow(x0,y0,x1,y1,col,w=1.2){ctx.save();ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.stroke();const a=Math.atan2(y1-y0,x1-x0),h=6;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x1-h*Math.cos(a-.42),y1-h*Math.sin(a-.42));ctx.lineTo(x1-h*Math.cos(a+.42),y1-h*Math.sin(a+.42));ctx.closePath();ctx.fill();ctx.restore();}
function gnd(x,y){ctx.save();ctx.strokeStyle='#475569';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+6);ctx.moveTo(x-9,y+6);ctx.lineTo(x+9,y+6);ctx.moveTo(x-6,y+10);ctx.lineTo(x+6,y+10);ctx.moveTo(x-3,y+14);ctx.lineTo(x+3,y+14);ctx.stroke();ctx.restore();}
function chemText(f,x,y,sz,col,align){
  ctx.save();ctx.fillStyle=col;ctx.textBaseline='middle';ctx.textAlign='left';
  const segs=[];
  for(let i=0;i<f.length;i++){const ch=f[i];
    if(/[0-9]/.test(ch)) segs.push(['s',ch]);
    else if((ch==='+'||ch==='-')&&i===f.length-1) segs.push(['u',ch==='-'?'−':'+']);
    else if(segs.length&&segs[segs.length-1][0]==='b') segs[segs.length-1][1]+=ch; else segs.push(['b',ch]);}
  const fb=`600 ${sz}px ${FONT}`, fs=`600 ${Math.round(sz*.72)}px ${FONT}`;
  let w=0; for(const s of segs){ctx.font=s[0]==='b'?fb:fs;w+=ctx.measureText(s[1]).width;}
  let cx=align==='left'?x:align==='right'?x-w:x-w/2;
  for(const s of segs){ctx.font=s[0]==='b'?fb:fs;const oy=s[0]==='s'?sz*.28:s[0]==='u'?-sz*.32:0;ctx.fillText(s[1],cx,y+oy);cx+=ctx.measureText(s[1]).width;}
  ctx.restore(); return w;
}
const fmtP=p=>p<0.1?`${(p*1000).toFixed(0)} mTorr`:`${p.toFixed(2)} Torr`;

function genBox(x,y,w,h,title,sub,on,freq,col){
  ctx.fillStyle='#fff';ctx.strokeStyle=on?col:'#C5CDD8';ctx.lineWidth=1.3;rr(x,y,w,h,8);ctx.fill();ctx.stroke();
  ctx.save();rr(x,y,w,h,8);ctx.clip();ctx.fillStyle=on?col:'#CBD2DC';ctx.fillRect(x,y,w,4);ctx.restore();
  txt(title,x+w/2,y+15,{sz:11,w:700,a:'center',c:C.ink2});txt(sub,x+w/2,y+28,{sz:8.5,mono:true,a:'center',c:on?col:C.label});
  if(freq!=null){ctx.save();ctx.strokeStyle=on?col:'#D5DAE2';ctx.lineWidth=1.4;ctx.beginPath();const sx=x+10,sw=w-20,sy=y+44;
    for(let i=0;i<=sw;i++){const yy=sy+5*(on?Math.sin(i/sw*TAU*freq-time*6):0);i?ctx.lineTo(sx+i,yy):ctx.moveTo(sx+i,yy);}ctx.stroke();ctx.restore();}
}

function drawPlasma(st,I){
  if(I<=.01) return;
  const yT=YT+st.sT, yB=YB-st.sB;
  ctx.save();ctx.beginPath();ctx.rect(X0,YT,X1-X0,YB-YT);ctx.clip();
  const hg=ctx.createLinearGradient(X0,0,X1,0);
  hg.addColorStop(0,'rgba(186,160,240,0)');hg.addColorStop(.07,`rgba(190,166,242,${.55*I})`);hg.addColorStop(.93,`rgba(190,166,242,${.55*I})`);hg.addColorStop(1,'rgba(186,160,240,0)');
  ctx.fillStyle=hg;ctx.fillRect(X0,yT,X1-X0,yB-yT);
  const cy=(yT+yB)/2, rg=ctx.createRadialGradient(XC,cy,4,XC,cy,(X1-X0)*.5);
  rg.addColorStop(0,`rgba(255,255,255,${.7*I})`);rg.addColorStop(.6,`rgba(240,234,255,${.32*I})`);rg.addColorStop(1,'rgba(240,234,255,0)');
  ctx.fillStyle=rg;ctx.fillRect(X0,yT,X1-X0,yB-yT);
  const band=(y,dir,a)=>{if(a<.03)return;const h=10,g=ctx.createLinearGradient(0,y,0,y+dir*h);g.addColorStop(0,`rgba(160,110,250,${.45*a})`);g.addColorStop(1,'rgba(160,110,250,0)');ctx.fillStyle=g;ctx.fillRect(X0,dir>0?y:y-h,X1-X0,h);};
  band(yT,1,st.expT*I); band(yB,-1,st.expB*I);
  const sheath=(y,s,dir)=>{const g=ctx.createLinearGradient(0,y,0,y+dir*s);g.addColorStop(0,`rgba(30,27,75,${.15*I})`);g.addColorStop(1,`rgba(30,27,75,${.03*I})`);ctx.fillStyle=g;ctx.fillRect(X0,dir>0?y:y-s,X1-X0,s);
    pl([[X0,y+dir*s],[X1,y+dir*s]],`rgba(112,48,160,${.3*I})`,1,[3,4]);};
  sheath(YT,st.sT,1); sheath(YB,st.sB,-1);
  ctx.restore();
}

/* ---------- particles & effects ---------- */
function spawn(s,x,y,vx=0,vy=0){const p={s,x,y,vx,vy,age:0};parts.push(p);return p;}
function bulkPt(m=10){return{x:X0+m+rnd()*(X1-X0-2*m),y:YT+45+rnd()*(YB-YT-90)};}
function placeBulk(p){const q=bulkPt();p.x=q.x;p.y=q.y;p.vx=0;p.vy=0;p.age=0;}
function lang_(p,f,kick,drag){p.vx+=(rnd()-.5)*kick*f;p.vy+=(rnd()-.5)*kick*f;const d=Math.pow(drag,f);p.vx*=d;p.vy*=d;}
function boxR(p,x0,x1,y0,y1){if(p.x<x0){p.x=x0;p.vx=Math.abs(p.vx);}if(p.x>x1){p.x=x1;p.vx=-Math.abs(p.vx);}if(p.y<y0){p.y=y0;p.vy=Math.abs(p.vy);}if(p.y>y1){p.y=y1;p.vy=-Math.abs(p.vy);}}
function cap(p,m){const s=Math.hypot(p.vx,p.vy);if(s>m){p.vx*=m/s;p.vy*=m/s;}}
function moveE(p,st,f){
  lang_(p,f,2.4,.9);cap(p,5);p.x+=p.vx*f;p.y+=p.vy*f;
  if(p.x<X0+3){p.x=X0+3;p.vx=Math.abs(p.vx);}if(p.x>X1-3){p.x=X1-3;p.vx=-Math.abs(p.vx);}
  const yT=YT+st.sT, yB=YB-st.sB;
  if(p.y<yT){if(st.sT<7&&rnd()<.3)return'T';p.y=yT+1+rnd()*3;p.vy=Math.abs(p.vy);}
  if(p.y>yB){if(st.sB<7&&rnd()<.3)return'B';p.y=yB-1-rnd()*3;p.vy=-Math.abs(p.vy);}
  return null;
}
function moveIon(p,st,f){
  const yTm=YT+st.sTm, yBm=YB-st.sBm;
  if(p.y>yTm&&p.y<yBm){lang_(p,f,.12,.96);p.vy+=(p.y<(yTm+yBm)/2?-1:1)*.004*f;}
  else{const top=p.y<=yTm,V=top?st.Vt:st.Vb,s=Math.max(top?st.sTm:st.sBm,5);p.vy+=(top?-1:1)*.22*V/s*f;p.vx*=.98;}
  cap(p,10);p.x+=p.vx*f;p.y+=p.vy*f;
  if(p.x<X0+3){p.x=X0+3;p.vx=Math.abs(p.vx);}if(p.x>X1-3){p.x=X1-3;p.vx=-Math.abs(p.vx);}
  if(p.y<=YT+1)return'T'; if(p.y>=YB-1)return'B'; return null;
}
function moveRF(f,st,onE,onI){
  for(const p of parts){const c=SP[p.s].cat;
    if(c==='e'){const r=moveE(p,st,f);if(r){onE&&onE(p,r);placeBulk(p);}}
    else if(c==='i'){const r=moveIon(p,st,f);if(r){onI&&onI(p,r);placeBulk(p);}}}
}
function count(s){let n=0;for(const p of parts)if(p.s===s)n++;return n;}
function trim(s,n){const c=count(s);if(c>n){const i=parts.findIndex(p=>p.s===s);if(i>=0)parts.splice(i,1);}}
function drawPowder(p){ctx.save();ctx.fillStyle='#E2E8F0';ctx.strokeStyle='#94A3B8';ctx.lineWidth=.8;const r=p.r||2.5;
  [[0,0],[r*.7,-r*.4],[-r*.6,r*.3],[r*.2,r*.7]].forEach(([dx,dy],i)=>{if(i>Math.min(3,Math.floor(r/1.5)))return;ctx.beginPath();ctx.arc(p.x+dx,p.y+dy,r*.75,0,TAU);ctx.fill();ctx.stroke();});ctx.restore();}
function drawParts(list){
  list=list||parts;
  for(const p of list){const s=SP[p.s];
    if(s.cat==='p'){drawPowder(p);continue;}
    if(p.a!=null)ctx.globalAlpha=clamp(p.a,0,1);
    if(s.cat==='e'){ctx.fillStyle='rgba(224,161,0,.22)';ctx.beginPath();ctx.arc(p.x,p.y,3.8,0,TAU);ctx.fill();}
    ctx.fillStyle=s.c;ctx.beginPath();ctx.arc(p.x,p.y,s.r,0,TAU);ctx.fill();
    if(s.cat==='i'){ctx.strokeStyle='rgba(232,85,59,.35)';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(p.x,p.y,s.r+2.3,0,TAU);ctx.stroke();}
    else if(s.cat==='ni'){ctx.strokeStyle='rgba(15,118,110,.4)';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(p.x,p.y,s.r+2.3,0,TAU);ctx.stroke();}
    else if(s.cat==='r'){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x,p.y,Math.max(.7,s.r*.36),0,TAU);ctx.fill();}
    ctx.globalAlpha=1;
    if(S.labels&&s.f&&s.cat!=='e')chemText(s.f,p.x,p.y-8.5,8.5,s.c,'center');
  }
}
function addFlash(x,y,rgb,life=.4,r=12,label){fx.push({t:'f',x,y,rgb,life,max:life,r,label});}
function addRing(x,y,rgb,life=.45,r=10,label){fx.push({t:'r',x,y,rgb,life,max:life,r,label});}
function stepFx(dt){for(const f of fx)f.life-=dt;fx=fx.filter(f=>f.life>0);}
function drawFx(){
  for(const f of fx){const a=f.life/f.max;
    if(f.t==='f'){const r=f.r*(1.25-a*.45),g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,r);g.addColorStop(0,`rgba(${f.rgb},${.85*a})`);g.addColorStop(1,`rgba(${f.rgb},0)`);ctx.fillStyle=g;ctx.beginPath();ctx.arc(f.x,f.y,r,0,TAU);ctx.fill();}
    else{ctx.strokeStyle=`rgba(${f.rgb},${a})`;ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(f.x,f.y,f.r*(1.3-a),0,TAU);ctx.stroke();}
    if(f.label)txt(f.label,f.x,f.y-13-(1-a)*10,{sz:9.5,mono:true,w:600,c:`rgba(${f.rgb},${Math.min(1,a*1.7)})`,a:'center'});
  }
}

/* ---------- hotspot helpers ---------- */
const partById=id=>PARTS.find(p=>p.id===id);
function highlightPart(id){const p=partById(id);if(!p)return;ctx.save();ctx.strokeStyle=C.purple;ctx.lineWidth=2;ctx.setLineDash([5,4]);
  for(const [x,y,w,h] of p.r){rr(x-3,y-3,w+6,h+6,6);ctx.stroke();}ctx.restore();}
function showTip(id,sx,sy){const t=$('tooltip');if(!id){t.classList.remove('show');return;}const [n,d]=L().parts[id];t.innerHTML=`<b>${n}</b>${d}`;t.style.left=sx+'px';t.style.top=sy+'px';t.classList.add('show');}
function partAt(x,y){for(const p of PARTS)for(const [rx,ry,rw,rh] of p.r)if(x>=rx&&x<=rx+rw&&y>=ry&&y<=ry+rh)return p.id;return null;}

/* ---------- chart helpers ---------- */
function chartCtx(id){const c=$(id);if(!c)return null;const r=c.getBoundingClientRect();if(r.width<8||r.height<8)return null;
  const d=window.devicePixelRatio||1,w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h;}
  const g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,r.width,r.height);return{g,W:r.width,H:r.height};}
function gt(g,s,x,y,o={}){g.font=`${o.w||400} ${o.sz||10}px ${o.mono?MONO:FONT}`;g.fillStyle=o.c||C.muted;g.textAlign=o.a||'left';g.textBaseline=o.b||'middle';g.fillText(s,x,y);}
function gl(g,pts,col,w,dash){g.save();g.strokeStyle=col;g.lineWidth=w||1;if(dash)g.setLineDash(dash);g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke();g.restore();}
function hex2rgb(h){const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}
function wl2rgb(w){let r=0,g=0,b=0;
  if(w<380)return[123,92,214];
  if(w<440){r=-(w-440)/60;b=1;}else if(w<490){g=(w-440)/50;b=1;}else if(w<510){g=1;b=-(w-510)/20;}else if(w<580){r=(w-510)/70;g=1;}else if(w<645){r=1;g=-(w-645)/65;}else{r=1;}
  let f=1;if(w>700)f=Math.max(.35,.3+.7*(780-w)/80);else if(w<420)f=.3+.7*(w-380)/40;
  return[Math.round(255*Math.pow(r*f,.8)),Math.round(255*Math.pow(g*f,.8)),Math.round(255*Math.pow(b*f,.8))];}

/* ---------- control widgets ---------- */
const rng=(id,label,min,max,step,val)=>`<div class="ctl"><div class="ctl-h"><label for="${id}">${label}</label><output id="${id}_o"></output></div><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"></div>`;
const seg=(id,opts,val)=>`<div class="seg" id="${id}">${opts.map(([v,l])=>`<button data-v="${v}" class="${v===val?'on':''}">${l}</button>`).join('')}</div>`;
const statH=(id,k,cls='')=>`<div class="stat ${cls}" id="${id}_w"><div class="stat-k">${k}</div><div class="stat-v" id="${id}">—</div></div>`;
function bindRange(id,get,set,fmt,on){const r=$(id);if(!r)return;const o=$(id+'_o');const upd=()=>{set(+r.value);if(o)o.innerHTML=fmt();on&&on();};r.addEventListener('input',upd);r.value=get();if(o)o.innerHTML=fmt();}
function bindSeg(id,cb){const el=$(id);if(!el)return;el.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{el.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));cb(b.dataset.v);}));}
function setStat(id,html,cls){const e=$(id);if(e&&e.innerHTML!==html)e.innerHTML=html;if(cls!==undefined){const w=$(id+'_w');if(w)w.className='stat '+cls;}}
const card=(badge,title,inner,extra='')=>`<div class="icard" ${extra}><div class="ihead"><span class="badge"><span class="badge-dot"></span>${badge}</span><h3>${title}</h3></div>${inner}</div>`;

/* ---------- geometry (logical px) — toroidal RPS above a downstream strip chamber ---------- */
const XC=480, X0=268, X1=692, YT=338, YB=446, YF=504;      // chamber interior below the baffle, wafer top, floor
const WAF={x:330,w:300};
const LP={x0:410,x1:550,y0:46,y1:186,r:69,w:12};             // toroid centre line (near-circular, R ≈ 70) + tube half-width
const PRH=10, NB=60;                                        // drawn resist thickness (px), resist bins across the wafer

/* ---------- species ---------- */
const SP={

      <div class="stats four">${statH('s8t',I.t)}${statH('s8u',I.util)}${statH('s8g',I.use)}${statH('s8c',I.co2)}</div></div>`);},

  chart(){const I=IL('s8'),m=cl8();

    bindRange('k_Q',()=>S.Q9,v=>S.Q9=v,()=>`${S.Q9} slm`);bindRange('k_f',()=>S.fg9,v=>S.fg9=v,()=>`${S.fg9} %`);$('b9r').onclick=()=>{Object.assign(S,BASE9);renderInst();};},
  chart(){const I=IL('s9'),m=pw9(),ok={r:m.rate>=3,u:m.nu<=5,o:m.ox<=15},all=ok.r&&ok.u&&ok.o;
    setStat('o_r',`${m.rate.toFixed(2)}<small> µm/min</small>`,ok.r?'pass':'fail');setStat('o_u',`± ${m.nu.toFixed(1)}<small> %</small>`,ok.u?'pass':'fail');setStat('o_o',`${m.ox.toFixed(1)}<small> Å</small>`,ok.o?'pass':'fail');

    if(frameN%6)return;const k=chartCtx('chA');if(!k)return;const{g,W,H}=k,b={l:30,r:W-30,t:10,b:H-16},X=T=>b.l+(T-150)/150*(b.r-b.l),Yr=v=>b.b-v/8*(b.b-b.t),Yo=v=>b.b-v/30*(b.b-b.t);
    [150,200,250,300].forEach(T=>{gl(g,[[X(T),b.t],[X(T),b.b]],C.line,1);gt(g,T+'°',X(T),b.b+9,{a:'center',sz:9,mono:true,c:C.label});});

    gl(g,[[b.l,Yr(3)],[b.r,Yr(3)]],C.purple,1,[3,3]);gl(g,[[b.l,Yo(15)],[b.r,Yo(15)]],C.coral,1,[3,3]);
    const T0=S.T9,pr=[],po=[];for(let T=150;T<=300;T+=3){S.T9=T;const q=pw9();pr.push([X(T),Yr(q.rate)]);po.push([X(T),Yo(q.ox)]);}S.T9=T0;
    gl(g,pr,C.purple,2.2);gl(g,po,C.coral,1.8);gt(g,I.rate,b.l+4,b.t+6,{sz:9,w:600,c:C.purple});gt(g,I.ox,b.l+4,b.t+18,{sz:9,w:600,c:C.coral});gl(g,[[X(T0),b.t],[X(T0),b.b]],C.green,1.3,[2,3]);},

/* ---- 11 · Takeaways ---- */
SC[10]={legend:[],cls:'none',init(){parts=[];fx=[];},draw(){},inst(){return'';},rd(){return{p:'—',T:'—'};}};
function renderTK(){const k=L().tk;
  $('stageHtml').innerHTML=`<div class="tk-hero"><div><h2>${k.h}</h2><p>${k.p}</p></div><div class="tk-btns"><button class="btn pri" id="tkb1">${k.btn1}</button><button class="btn" id="tkb2">${k.btn2}</button></div></div>

  </div>`;
  $('tkb1').onclick=()=>window.open('./icp_al_etch_v5.html','_blank','noopener');$('tkb2').onclick=()=>window.open('./ccp_oxide_cvd_v5.html','_blank','noopener');}
function openPop(src,cap){$('popImg').src=src;$('popCap').textContent=cap;$('pop').classList.add('show');}

/* ============================== UI SHELL ============================== */

  try:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 9l5 12 1.8-5.2L21 14z"/><path d="M7.2 2.2L8 5.1"/><path d="M5.1 8L2.2 7.2"/><path d="M14 4.1L12 6"/><path d="M6 12l-1.9 2"/></svg>',
  myth:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>',
  key:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>',
  warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
};
const RMAP=[null,2,3,4,4,4,4,'d',null,4,'all'];
let lastRec='',lastRd='',lastMsg='';
function renderRecipe(){const R=L().recipe;let on=RMAP[cur];
  if(on==='d')on=[1,4,6,7][st7.ph];
  const key=lang+'|'+on;if(key===lastRec)return;lastRec=key;
  $('recipe').innerHTML=`<span class="recipe-k">${L().recipeK}</span>`+R.map((r,i)=>`${i?'<span class="rp-sep">›</span>':''}<span class="rp ${on==='all'?'done':i===on?'on':(on!=null&&i<on?'done':'')}">${r}</span>`).join('');}
function setMsg(s,cls){const k=s+'|'+cls;if(k===lastMsg)return;lastMsg=k;const m=$('msg');m.textContent=s||'';m.className='msg '+(cls||'');}
function setReadouts(){const r=SC[cur].rd?SC[cur].rd():null,R=L().rd;if(!r)return;
  let h=`<span class="rd"><b>${R.p}</b>${r.p}</span><span class="rd"><b>${R.T}</b>${r.T}</span>`;
  if(cur!==10)h+=`<span class="rd ${r.hf?'on':''}"><b>${R.hf}</b>${r.hf||R.off}</span>`;
  if(r.lf)h+=`<span class="rd on"><b>${R.lf}</b>${r.lf}</span>`;if(r.gas)h+=`<span class="rd"><b>${R.gas}</b>${r.gas}</span>`;if(r.slow)h+=`<span class="rd slow">${R.slow}</span>`;
  if(h!==lastRd){$('readouts').innerHTML=h;lastRd=h;}}
let lastLeg='';
function renderLegend(){const keys=SC[cur].legend||[],sp=L().sp;const k=lang+keys.join();if(k===lastLeg)return;lastLeg=k;
  $('legend').innerHTML=keys.map(s=>{const d=SP[s];const cls=d.cat==='i'?'ion':d.cat==='p'?'pw':'';return`<span class="lg"><i class="${cls}" style="${d.cat==='p'?'':'background:'+d.c}"></i>${sp[s]}</span>`;}).join('');
  $('lblBtn').style.display=keys.length&&!SC[cur].noLabels?'':'none';}
function renderInst(){const sc=SC[cur],el=$('inst'),h=sc.inst?sc.inst():'';el.innerHTML=h;el.className='inst'+(sc.cls&&sc.cls!=='none'?' '+sc.cls:'');el.style.display=h?'':'none';sc.bind&&sc.bind();}
function renderSide(){const s=L().steps[cur],n=L().steps.length;
  $('chap').textContent=L().chapters[s.ch];$('scount').textContent=`${String(cur+1).padStart(2,'0')} ${L().of} ${n}`;
  $('sTitle').innerHTML=s.title;const lead=cur===10?L().tk.p:s.lead;$('sLead').innerHTML=lead;
  let body=s.body;
  if(cur===0)body+=`<div class="parts">${Object.keys(L().parts).map(id=>`<button class="part ${pinPart===id?'on':''}" data-p="${id}">${L().parts[id][0]}</button>`).join('')}</div>`;
  if(cur===10)body=`<div class="parts">${L().steps.slice(0,10).map((t,i)=>`<button class="part" data-go="${i}">${String(i+1).padStart(2,'0')} · ${t.title}</button>`).join('')}</div>`;
  $('sBody').innerHTML=body;
  $('sCo').innerHTML=s.co.map(([k,t])=>`<div class="co ${k}">${ICON[k]}<div><span class="tag">${L().tags[k]}</span>${t}</div></div>`).join('');
  $('sDd').innerHTML=s.dd.map(d=>`<details class="dd"><summary><span class="db">${L().dd}</span><span class="dt">${d.t}</span><span class="chev">▼</span></summary><div class="dd-in">${d.b}</div></details>`).join('');
  $('sBody').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{pinPart=pinPart===b.dataset.p?null:b.dataset.p;$('sBody').querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('on',x.dataset.p===pinPart));tipPinned();});
  $('sBody').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));
  $('prog').style.width=((cur+1)/n*100)+'%';
  $('prevBtn').disabled=cur===0;$('nextBtn').disabled=cur===n-1;$('prevBtn').textContent=L().prev;$('nextBtn').textContent=L().next;$('kbd').textContent=L().kbd;
  $('pills').querySelectorAll('.pill').forEach(p=>p.classList.toggle('on',+p.dataset.i===cur));}
function renderPills(){let h='',prev=-1;L().steps.forEach((s,i)=>{if(prev!==-1&&s.ch!==prev)h+='<span class="pill-gap"></span>';prev=s.ch;h+=`<button class="pill" data-i="${i}" title="${s.title.replace(/"/g,'&quot;')}">${i+1}</button>`;});
  $('pills').innerHTML=h;$('pills').querySelectorAll('.pill').forEach(b=>b.onclick=()=>go(+b.dataset.i));}
function tipPinned(){if(cur!==0||!pinPart){showTip(null);return;}const p=partById(pinPart),[x,y,w]=p.r[0];showTip(pinPart,OX+(x+w/2)*RS,OY+y*RS);}

function go(i){const n=L().steps.length;if(i<0||i>=n)return;cur=i;hoverPart=null;if(i!==0)pinPart=null;showTip(null);setMsg('','');
  $('stageHtml').classList.toggle('show',i===10);if(i===10)renderTK();
  enterScene();renderSide();renderRecipe();setReadouts();$('sideScroll').scrollTop=0;}
function setLang(l){lang=l;document.documentElement.lang=l;$('btnEN').classList.toggle('active',l==='en');$('btnKO').classList.toggle('active',l==='ko');
  $('hTitle').textContent=L().title;$('hSub').textContent=L().sub;$('lblBtn').textContent=L().labels;lastRec=lastRd=lastLeg=lastMsg='';
  renderPills();renderSide();renderInst();renderRecipe();renderLegend();setReadouts();if(cur===10)renderTK();if(cur===0)tipPinned();}

$('btnEN').onclick=()=>setLang('en');$('btnKO').onclick=()=>setLang('ko');
$('prevBtn').onclick=()=>go(cur-1);$('nextBtn').onclick=()=>go(cur+1);
$('lblBtn').onclick=()=>{S.labels=!S.labels;$('lblBtn').classList.toggle('on',S.labels);};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePop();return;}const t=e.target.tagName;if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT')return;
  if(e.key==='ArrowRight'){go(cur+1);e.preventDefault();}if(e.key==='ArrowLeft'){go(cur-1);e.preventDefault();}});
cv.addEventListener('mousemove',e=>{if(cur!==0){cv.style.cursor='default';return;}const r=cv.getBoundingClientRect(),sx=e.clientX-r.left,sy=e.clientY-r.top,x=(sx-OX)/RS,y=(sy-OY)/RS;
  hoverPart=partAt(x,y);cv.style.cursor=hoverPart?'pointer':'default';if(hoverPart)showTip(hoverPart,sx,sy);else tipPinned();});
cv.addEventListener('mouseleave',()=>{hoverPart=null;tipPinned();});
cv.addEventListener('click',e=>{if(cur!==0)return;const r=cv.getBoundingClientRect(),x=(e.clientX-r.left-OX)/RS,y=(e.clientY-r.top-OY)/RS,id=partAt(x,y);
  pinPart=id&&id!==pinPart?id:null;$('sBody').querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('on',b.dataset.p===pinPart));});

/* ---------- main loop ---------- */
let last=performance.now(),rdT=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;frameN++;
  if(!(SC[cur].pausable&&S.paused))phase+=dt*TAU*FA;
  const sc=SC[cur];
  if(cur!==10){beginFrame();if(sc.update&&!(SC[cur].pausable&&S.paused))sc.update(dt);if(!(SC[cur].pausable&&S.paused))stepFx(dt);sc.draw();}
  if(sc.chart)sc.chart(dt);
  rdT+=dt;if(rdT>.15){rdT=0;setReadouts();if(cur===7){renderRecipe();renderLegend();}if(cur===1)renderLegend();}
  requestAnimationFrame(loop);}
setLang('en');go(0);
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>requestAnimationFrame(loop));
</script>
