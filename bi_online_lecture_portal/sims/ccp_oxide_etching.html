<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCP Oxide Etching — Interactive Lesson · Benedu Insight</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/benedu-insight/benedu-insight.github.io/refs/heads/main/logo_png/benedu_insight_Symbol.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:          #F7F8FA;
    --panel:       #FFFFFF;
    --ink:         #2D2D2D;
    --muted:       #6B7280;
    --muted2:      #9CA3AF;
    --purple:      #7030A0;
    --purple-soft: #F0E6F6;
    --purple-mid:  #d9b8ed;
    --purple-dark: #521a78;
    --green:       #0F8C50;
    --border:      #E5E7EB;
    --shadow:      0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.06);
    --hdr:         52px;
    --side:        450px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; overflow: hidden; }
  body {
    height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: 'Google Sans','Noto Sans KR','Segoe UI',system-ui,sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header ── */
  .hdr {
    position: fixed; top: 0; left: 0; right: 0; z-index: 200;
    height: var(--hdr); background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 1rem; padding: 0 1.25rem;
    box-shadow: 0 1px 6px rgba(0,0,0,0.07);
  }
  .hdr-logo   { height: 32px; width: auto; flex-shrink: 0; }
  .hdr-div    { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; }
  .hdr-title  { font-size: 0.95rem; font-weight: 700; color: var(--purple); line-height: 1.2; }
  .hdr-sub    {
    font-family: 'JetBrains Mono', monospace; font-size: 0.50rem;
    color: var(--muted2); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 2px;
  }
  .hdr-right  { margin-left: auto; display: flex; align-items: center; gap: 0.5rem; }

  .lang-toggle { display: flex; border: 1px solid var(--border); border-radius: 20px; overflow: hidden; }
  .lang-btn {
    padding: 3px 13px; border: none; background: transparent; cursor: pointer;
    font-family: 'JetBrains Mono', monospace; font-size: 0.60rem; font-weight: 500;
    color: var(--muted2); transition: all 0.16s;
  }
  .lang-btn.active { background: var(--purple); color: #fff; }

  /* ── Main area (below fixed header) ── */
  .main {
    position: fixed;
    top: var(--hdr); left: 0; right: 0; bottom: 0;
    display: grid;
    grid-template-columns: 1fr var(--side);
    gap: 0;
    overflow: hidden;
  }

  /* ── Canvas area ── */
  .canvas-wrap {
    position: relative;
    background: var(--bg);
    display: flex; flex-direction: column;
    padding: 10px 8px 6px 10px;
    overflow: hidden;
  }
  .canvas-card {
    flex: 1;
    background: var(--panel);
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  #cv {
    display: block;
    width: 100%;
    height: 100%;
    flex: 1;
    object-fit: contain;
  }
  /* Step controls below canvas card */
  .step-controls {
    flex-shrink: 0;
    min-height: 28px; height: 28px;
    display: flex; gap: 8px; align-items: center;
    margin-top: 6px; flex-wrap: nowrap; overflow: hidden;
  }
  .mode-toggle {
    display: inline-flex; background: var(--bg);
    border: 1px solid var(--border); border-radius: 20px; padding: 2px; gap: 2px;
  }
  .mode-toggle button {
    border: none; background: transparent; padding: 3px 12px;
    font-family: 'Google Sans', sans-serif; font-size: 0.70rem; font-weight: 600;
    cursor: pointer; color: var(--muted); border-radius: 14px; transition: all 0.14s;
  }
  .mode-toggle button.active { background: var(--purple); color: #fff; }
  .mode-info {
    font-family: 'JetBrains Mono', monospace; font-size: 0.60rem;
    background: var(--purple-soft); color: var(--purple-dark);
    padding: 3px 10px; border-radius: 20px; white-space: nowrap;
  }
  .reset-btn {
    font-family: 'Google Sans', sans-serif; font-size: 0.70rem; font-weight: 600;
    background: var(--panel); border: 1px solid var(--border); border-radius: 7px;
    padding: 4px 12px; cursor: pointer; color: var(--ink); transition: all 0.14s;
    white-space: nowrap;
  }
  .reset-btn:hover { border-color: var(--purple-mid); color: var(--purple); background: var(--purple-soft); }

  /* Tooltip */
  #tooltip {
    position: absolute; pointer-events: none;
    background: rgba(18,22,38,0.97); color: #fff;
    padding: 9px 13px; border-radius: 9px; font-size: 12.5px;
    line-height: 1.6; max-width: 270px;
    transform: translate(-50%,-100%); margin-top: -12px;
    opacity: 0; transition: opacity 0.11s; z-index: 50;
    box-shadow: 0 8px 24px rgba(0,0,0,0.32); border: 1px solid rgba(255,255,255,0.09);
  }
  #tooltip.show { opacity: 1; }
  #tooltip b { color: #c4a0f0; }

  /* ── Side Panel ── */
  .side {
    background: var(--panel);
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .side-inner {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 1rem 1.1rem 0.5rem;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }
  .side-inner::-webkit-scrollbar { width: 4px; }
  .side-inner::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .step-eyebrow {
    font-family: 'JetBrains Mono', monospace; font-size: 0.54rem;
    color: var(--muted2); text-transform: uppercase; letter-spacing: 0.14em; margin-bottom: 0.3rem;
  }
  .step-title { font-size: 1.08rem; font-weight: 700; color: var(--ink); margin-bottom: 0.6rem; line-height: 1.3; }
  .step-body  { font-size: 0.82rem; line-height: 1.76; color: #3a4055; }
  .step-body ul { padding-left: 1.1rem; margin: 0.35rem 0; }
  .step-body li { margin-bottom: 0.28rem; }
  .step-body b  { font-weight: 700; color: var(--ink); }
  .step-body code {
    background: var(--purple-soft); padding: 1px 6px; border-radius: 4px;
    font-family: 'JetBrains Mono', monospace; font-size: 0.70rem; color: var(--purple-dark);
  }
  .hint-box {
    margin-top: 0.7rem; display: flex; gap: 9px; align-items: flex-start;
    background: var(--bg); border: 1px solid var(--border); border-radius: 9px; padding: 9px 11px;
  }
  .hint-icon {
    flex: none; width: 28px; height: 28px; border-radius: 50%;
    background: var(--purple-soft); display: flex; align-items: center;
    justify-content: center; font-size: 13px;
  }
  .hint-text { font-size: 0.71rem; line-height: 1.58; color: #4a5070; flex: 1; align-self: center; }

  /* Deep Dive accordion */
  .deep-wrap {
    margin-top: 0.85rem; border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden; background: var(--panel);
  }
  .deep-hdr {
    display: flex; align-items: center; gap: 0.55rem; padding: 0.65rem 0.85rem;
    cursor: pointer; user-select: none; background: var(--panel); transition: background 0.15s;
  }
  .deep-hdr:hover { background: var(--bg); }
  .deep-hdr.open { background: var(--purple-soft); border-bottom: 1px solid var(--border); }
  .deep-icon  { font-size: 1rem; flex-shrink: 0; }
  .deep-title { font-size: 0.80rem; font-weight: 700; color: var(--ink); flex: 1; line-height: 1.3; }
  .deep-badge {
    background: var(--purple); color: #fff; font-family: 'JetBrains Mono', monospace;
    font-size: 0.50rem; font-weight: 700; padding: 2px 7px; border-radius: 4px; flex-shrink: 0;
    letter-spacing: 0.04em;
  }
  .deep-chevron { font-size: 0.62rem; color: var(--muted2); transition: transform 0.2s; flex-shrink: 0; }
  .deep-hdr.open .deep-chevron { transform: rotate(180deg); }
  .deep-body { max-height: 0; overflow: hidden; transition: max-height 0.35s ease; background: var(--bg); }
  .deep-body.open { max-height: 2000px; }
  .deep-inner { padding: 0.85rem 0.9rem; font-size: 0.76rem; line-height: 1.78; color: #4a5070; }
  .deep-inner p + p { margin-top: 0.6em; }
  .deep-inner b { color: var(--ink); }
  .deep-inner .deep-eq {
    background: var(--charcoal,#2D2D2D); border-radius: 6px; padding: 0.55rem 0.8rem;
    font-family: 'JetBrains Mono', monospace; font-size: 0.74rem; color: #FFD580;
    margin: 0.5rem 0; overflow-x: auto; letter-spacing: 0.03em; line-height: 1.6;
  }
  .deep-inner .deep-hl {
    background: var(--purple-soft); border-left: 3px solid var(--purple);
    border-radius: 0 7px 7px 0; padding: 0.5rem 0.8rem; margin: 0.5rem 0;
    font-size: 0.74rem; line-height: 1.7; color: var(--purple-dark);
  }
  .deep-inner ul { padding-left: 1.1rem; margin: 0.35rem 0; }
  .deep-inner li { margin-bottom: 0.3rem; }

  /* Side footer: step buttons + nav */
  .side-footer {
    flex-shrink: 0;
    padding: 0.65rem 1.1rem 0.8rem;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  .step-btns { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 0.6rem; }
  .step-btn {
    padding: 5px 10px; font-size: 0.70rem; font-weight: 600;
    border: 1px solid var(--border); background: var(--panel); border-radius: 6px;
    cursor: pointer; color: var(--muted); transition: all 0.13s;
    font-family: 'Google Sans', sans-serif; min-width: 30px; text-align: center;
  }
  .step-btn:hover { border-color: var(--purple-mid); color: var(--purple); background: var(--purple-soft); }
  .step-btn.active { background: var(--purple); color: #fff; border-color: var(--purple); }

  .nav-row { display: flex; gap: 7px; }
  .nav-btn {
    flex: 1; padding: 9px; font-size: 0.78rem; font-weight: 700;
    border: none; background: var(--ink); color: #fff; border-radius: 8px;
    cursor: pointer; font-family: 'Google Sans', sans-serif; transition: background 0.14s;
  }
  .nav-btn:hover:not(:disabled) { background: var(--purple); }
  .nav-btn:disabled { background: var(--border); color: var(--muted2); cursor: not-allowed; }

  /* Footer bar */
  .foot {
    display: none; /* hidden — space too tight in full-screen mode */
  }
</style>
</head>
<body>

<!-- Fixed Header -->
<header class="hdr">
  <a href="https://benedu-insight.github.io/" target="_blank" rel="noopener noreferrer"
     style="display:inline-flex;align-items:center;text-decoration:none;">
    <img class="hdr-logo"
      src="https://benedu-insight.github.io/logo_png/benedu_insight_logo_EN_horizontal.png"
      alt="Benedu Insight">
  </a>
  <div class="hdr-div"></div>
  <div>
    <div class="hdr-title" id="hTitle">CCP Oxide Etching — Interactive Lesson</div>
    <div class="hdr-sub"   id="hSub">Class 2 · C₄F₈ + Ar + O₂ → SiO₂ RIE · Benedu Insight</div>
  </div>
  <div class="hdr-right">
    <div class="lang-toggle">
      <button class="lang-btn active" id="btnEN" onclick="setLang('en')">EN</button>
      <button class="lang-btn"        id="btnKO" onclick="setLang('ko')">KO</button>
    </div>
  </div>
</header>

<!-- Main 2-column layout -->
<div class="main">

  <!-- Left: Canvas + controls -->
  <div class="canvas-wrap" id="canvasWrap">
    <div class="canvas-card" id="canvasCard">
      <canvas id="cv"></canvas>
      <div id="tooltip"></div>
    </div>
    <div class="step-controls" id="stepControls"></div>
  </div>

  <!-- Right: Side panel -->
  <div class="side">
    <div class="side-inner" id="sideInner">
      <div class="step-eyebrow">Step <span id="stepNum">S</span> / 9</div>
      <div class="step-title" id="stepTitle"></div>
      <div class="step-body"  id="stepBody"></div>
      <div class="hint-box"   id="stepHint" style="display:none;"></div>
      <div id="deepDiveContainer"></div>
    </div>
    <div class="side-footer">
      <div class="step-btns" id="stepButtons"></div>
      <div class="nav-row">
        <button class="nav-btn" id="prevBtn">◀ Prev</button>
        <button class="nav-btn" id="nextBtn">Next ▶</button>
      </div>
    </div>
  </div>

</div>

<script>
/* ============================================================
   CCP Oxide Etching Interactive Lesson v2
   Benedu Insight · Google Sans · Full-viewport layout
   Responsive Canvas — geometry scales with window size
   C4F8 + Ar + O2 -> SiO2 RIE (Asymmetric CCP, DC Self-Bias)
   Showerhead (top) = GROUNDED, full width
   Wafer Chuck (bottom) = RF-POWERED via Blocking Capacitor, ~60% width
   KO / EN bilingual
   ============================================================ */

// ── Canvas & ctx ──────────────────────────────────────────────
const canvas = document.getElementById('cv');
const ctx    = canvas.getContext('2d');
const tooltip     = document.getElementById('tooltip');
const stepCtrlEl  = document.getElementById('stepControls');

// ── Logical canvas dimensions (constant ratio 900:640) ────────
const LW = 900, LH = 640;
let DPR = window.devicePixelRatio || 1;

let renderScale = 1, renderOffX = 0, renderOffY = 0;
function resizeCanvas() {
  const card = document.getElementById('canvasCard');
  const cw = card.clientWidth;
  const ch = card.clientHeight;
  DPR = window.devicePixelRatio || 1;
  canvas.width  = Math.round(cw * DPR);
  canvas.height = Math.round(ch * DPR);
  canvas.style.width  = cw + 'px';
  canvas.style.height = ch + 'px';
  const aspect = LW / LH;
  let drawW, drawH;
  if (cw / ch > aspect) { drawH = ch; drawW = ch * aspect; }
  else                   { drawW = cw; drawH = cw / aspect; }
  renderScale = drawW / LW;
  renderOffX = (cw - drawW) / 2;
  renderOffY = (ch - drawH) / 2;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(renderScale * DPR, renderScale * DPR);
  ctx.translate(renderOffX / renderScale, renderOffY / renderScale);
}

const ro = new ResizeObserver(() => resizeCanvas());
ro.observe(document.getElementById('canvasCard'));
resizeCanvas();

// ── Brand ─────────────────────────────────────────────────────
const FONT = '"Google Sans","Noto Sans KR",system-ui,sans-serif';
const MONO = '"JetBrains Mono",monospace';
const B = {
  purple:'#7030A0', purpleSoft:'#F0E6F6', purpleDark:'#521a78',
  green:'#0F8C50',  greenSoft:'#E5F4EC',
  charcoal:'#2D2D2D', muted:'#6B7280', muted2:'#9CA3AF',
  bg:'#F7F8FA', panel:'#FFFFFF', border:'#E5E7EB',
  red:'#E8553B', blue:'#3A7AD6',
};

// ── Logo ──────────────────────────────────────────────────────
const LOGO = new Image();
LOGO.crossOrigin = 'anonymous';
LOGO.src = 'https://benedu-insight.github.io/logo_png/benedu_insight_logo_EN_horizontal.png';
function drawLogo(a=0.45) {
  if (!LOGO.complete || !LOGO.naturalWidth) return;
  const lh=26, lw=Math.round(lh*LOGO.naturalWidth/LOGO.naturalHeight);
  ctx.save(); ctx.globalAlpha=a;
  ctx.drawImage(LOGO, LW-lw-12, LH-lh-10, lw, lh);
  ctx.restore();
}

// ── Geometry — all in LW×LH (900×640) logical space ──────────
// CORRECTED ASYMMETRIC CCP for oxide etching:
//   - Showerhead (TOP)   = GROUNDED, gas distributor, spans full inner width (large A_g)
//   - Wafer Chuck (BOTTOM) = RF-POWERED via Blocking Capacitor, ~60% width (small A_p)
//   - Wafer sits on the powered chuck — this is where the DC self-bias
//     accelerates ions into the SiO2 film.
const W=LW, H=LH;
const CH={x:215,y:175,w:470,h:380,r:18};
const IP=18, inX=CH.x+IP, inY=CH.y+IP, inW=CH.w-IP*2, inH=CH.h-IP*2;
// Showerhead — GROUNDED, full inner width (top)
const SH={x:inX, y:inY, w:inW, h:26};
// Wafer Chuck — RF-POWERED, ~60% of inner width (bottom)
const PEW=Math.round(inW*0.60);
const SC={x:inX+Math.round((inW-PEW)/2), y:inY+inH-30, w:PEW, h:30};
const wW=Math.round(PEW*0.88);
const WF={x:SC.x+Math.round((PEW-wW)/2), y:SC.y-5, w:wW, h:5};
// Sheaths: top (thin, grounded side), bottom (thick, DC self-bias side)
const ST={x:inX+6, y:SH.y+SH.h, w:inW-12, h:18};
// Bottom sheath base height is intentionally larger than the top sheath's
// (18px) so the DC-self-bias asymmetry is visible even before V_DC ramps up.
const SB_H_BASE=34;
const SB={x:SC.x-4, y:0, w:SC.w+8, h:SB_H_BASE}; // y assigned below
const SIO2_MAX=26, PR_H=13;
SB.y = WF.y - SIO2_MAX - PR_H - SB_H_BASE;
const PL={x:ST.x,y:ST.y+ST.h,w:ST.w,h:SB.y-(ST.y+ST.h)};
// Ground symbol — top-left of chamber, connects down to the showerhead's
// grounded chamber-wall connection point.
const GND_X = CH.x+55;

// Gas system — per guideline: vertical BUS just right of the chamber,
// then VALVE (⋈) symbols, then gas-name BOXES on the far-right edge.
// Order top-to-bottom: C4F8, O2, Ar. Flow: Box -> Valve -> Bus -> Showerhead.
const GAS_BUS_X = 730;
const M1={cx:780, cy:38};
const M2={cx:780, cy:88};
const M3={cx:780, cy:138};
const G1S={x:820, y:M1.cy-12, w:70, h:24};
const G2S={x:820, y:M2.cy-12, w:70, h:24};
const G3S={x:820, y:M3.cy-12, w:70, h:24};

// RF Matcher (LEFT) + RF Generator (RIGHT) — bottom of chamber, horizontal.
// DC Blocking Capacitor sits above the Matcher and routes right to the
// chuck's RF feed point at the chamber's bottom-right corner.
const MAT={x:500,y:580,w:110,h:44,r:10};
const RFG={x:MAT.x+MAT.w+14,y:580,w:110,h:44,r:10};
const BCAP={cx:MAT.x+55,cy:560};

// Backside He Cooling — directly below the powered chuck's center.
const HEC={x:425,y:592,w:50,h:30,r:8};
const HEC_GLASS_CY=560;

// Turbo Pump + Dry Vacuum Pump — bottom of chamber, left of the He cooling
// box, near the chamber's bottom-left corner.
const TP={x:222,y:588,w:84,h:40,r:20};
const DVP={x:TP.x+TP.w+12,y:582,w:92,h:52,r:8};

// ── Species — C4F8 + Ar + O2 -> SiO2 RIE ──────────────────────
const SP={
  'C4F8': {f:'C4F8', c:'#2a3145',  sz:11, q:0,  m:200,    cat:'neutral' },
  'Ar':   {f:'Ar',   c:'#2a3145',  sz:11, q:0,  m:40,     cat:'neutral' },
  'O2':   {f:'O2',   c:'#2a3145',  sz:11, q:0,  m:32,     cat:'neutral' },
  'CF3':  {f:'CF3',  c:B.blue,     sz:11, q:0,  m:69,     cat:'radical' },
  'CF2':  {f:'CF2',  c:B.blue,     sz:11, q:0,  m:50,     cat:'radical' },
  'F':    {f:'F',    c:B.blue,     sz:10, q:0,  m:19,     cat:'radical' },
  'O':    {f:'O',    c:'#52a87c',  sz:10, q:0,  m:16,     cat:'radical' },
  'CF3+': {f:'CF3+', c:B.red,      sz:11, q:+1, m:69,     cat:'ion'     },
  'Ar+':  {f:'Ar+',  c:B.red,      sz:11, q:+1, m:40,     cat:'ion'     },
  'CF2+': {f:'CF2+', c:B.red,      sz:11, q:+1, m:50,     cat:'ion'     },
  'e-':   {f:'e-',   c:B.red,      sz:10, q:-1, m:0.0005, cat:'electron'},
  'SiF4': {f:'SiF4', c:'#9CA3AF',  sz:10, q:0,  m:104,    cat:'byproduct'},
  'CO2':  {f:'CO2',  c:'#9CA3AF',  sz:10, q:0,  m:44,     cat:'byproduct'},
};
// ── Bilingual text ────────────────────────────────────────────
const T = {
en:{
  hTitle:'CCP Oxide Etching — Interactive Lesson',
  hSub:'Class 2 · C₄F₈ + Ar + O₂ → SiO₂ RIE · Benedu Insight',
  stepLabel:'Step',
  modeInfoDC:'Select DC to watch the plasma collapse on insulating SiO₂',
  modeInfoRF:'RF sustains the plasma · DC self-bias active',
  resetEtch:'↻ Reset Etch Depth',
  prevBtn:'◀ Prev', nextBtn:'Next ▶',
  modeLabel:'Mode', plasmaLabel:'Plasma intensity',
  extinguished:'⚠  Plasma extinguished — DC fails on SiO₂',
  sustained:'RF sustained · DC self-bias active',
  molCount:'Gas Molecules',
  vdcLabel:'V_DC — Self-Bias (powered chuck)',
  ionEnergyLabel:'Ion energy ≈ |V_DC + V_RF| × q',
  etchLabel:'Etch Depth', etchPctOf:'% of SiO₂', eqLabel:'Overall:',
  etchThrough:'✓ Etch through SiO₂ — Si stop reached',
  koenig:'|V_DC| ∝ (A_g / A_p)ⁿ,  n ≈ 2.5',
  steps:[
    { title:'Asymmetric CCP — Chamber Structure',
      body:`Parallel-plate <b>Capacitively Coupled Plasma</b> chamber for SiO₂ Oxide Etch (RIE).
        <ul>
          <li><b>Showerhead (top)</b> — Grounded electrode &amp; gas distributor, full chamber width (large A<sub>g</sub>)</li>
          <li><b>Wafer Chuck (bottom)</b> — RF-Powered electrode, smaller width (A<sub>p</sub>), driven through a <b>Blocking Capacitor</b></li>
          <li><b>Key relationship:</b> A<sub>g</sub> ≫ A<sub>p</sub> → DC self-bias develops on the chuck</li>
          <li>Gas: <code>C₄F₈ + Ar + O₂</code>, each via its own MFC</li>
          <li>Low-pressure environment: <code>5–50 mTorr</code></li>
        </ul>
        Pre-ignition overview — gas flowing, plasma not yet formed.
        <b>Compare the showerhead width to the chuck width</b> — this area asymmetry is the origin of everything in Steps 4–5, and the wafer sits on the <b>smaller, RF-powered</b> electrode.`,
      hint:'💡 Hover over chamber parts for details.' },
    { title:'Gas Fill & Electrode Asymmetry',
      body:`C₄F₈ + Ar + O₂ injected through the <b>Showerhead</b>, rapidly filling the chamber.
        <ul>
          <li><b>Showerhead</b> spans the full chamber width → large grounded area A<sub>g</sub></li>
          <li><b>Wafer Chuck</b> spans ≈60% of the chamber width → small RF-powered area A<sub>p</sub></li>
          <li><b>A<sub>g</sub> / A<sub>p</sub> ≈ 1.7</b> — this ratio is what will drive the DC self-bias once plasma ignites</li>
          <li>At 5–50 mTorr, the mean free path is long enough that ion flux can become highly directional</li>
        </ul>`,
      hint:'⚙ The width markers show the electrode area ratio — the single most important design parameter in this chamber.' },
    { title:'RF Ignition — Fluorocarbon Dissociation',
      body:`RF power is applied to the <b>Wafer Chuck</b>. Accelerated electrons dissociate and ionize the process gases.
        <ul>
          <li><code>e⁻ + C₄F₈ → 2CF₂· + CF₃· + F·</code> &nbsp;(ring-opening dissociation)</li>
          <li><code>e⁻ + Ar → Ar⁺ + 2e⁻</code> &nbsp;(ionization)</li>
          <li><code>e⁻ + O₂ → 2O· + e⁻</code> &nbsp;(dissociation)</li>
        </ul>
        <b>Blue</b> = fluorocarbon radicals (CF₂·, CF₃·, F·) &nbsp;·&nbsp; <b>Red</b> = ions &amp; e⁻.
        At this instant <b>V_DC = 0 V</b> — the self-bias has not yet had time to build up.`,
      hint:'⚡ C₄F₈ undergoes ring-opening dissociation, releasing reactive fluorocarbon radicals. V_DC = 0 V initially.',
      deepDive:{
        title:'How Does Plasma Actually Ignite?',
        body:`<p>At this stage the chamber is full of <b>neutral molecules only</b> — RF power has just turned on. A natural question: is the RF field itself strong enough to ionize a neutral molecule directly?</p>
<p><b>No — not directly.</b> A neutral molecule has no charge, so an electric field exerts no net force on it. Direct field-ionization would require field strengths many orders of magnitude beyond typical RIE conditions.</p>
<div class="deep-hl">Plasma ignition is a <b>two-step energy relay</b>, not a one-step field effect.</div>
<p><b>Step 1 — Seed electrons exist already.</b> Even before RF power is applied, trace free electrons are present from cosmic rays, background radiation, and spontaneous ionization of residual gas.</p>
<p><b>Step 2 — The field accelerates electrons, not molecules.</b> Electrons are roughly 30,000–400,000× lighter than C₄F₈, Ar, or O₂. From <b>a = qE / m</b>, the same field gives an electron enormous acceleration — it can gain several to tens of eV of kinetic energy within one RF cycle.</p>
<div class="deep-eq">e⁻ (accelerated by RF field) + Ar  → Ar⁺ + 2e⁻        (ionization, ~15.8 eV)
e⁻ (accelerated by RF field) + C₄F₈ → 2CF₂· + CF₃· + F· + e⁻  (dissociation, lower threshold)</div>
<p><b>Step 3 — Avalanche.</b> Each ionizing collision produces a new electron, which is itself accelerated and causes further collisions. This <b>electron avalanche</b> rapidly builds the plasma from a near-vacuum of charged species to a self-sustaining discharge.</p>
<div class="deep-hl">Key takeaway: the RF field's role is to <b>pump energy into electrons</b>. The electrons then deliver that energy to neutral molecules via collisions. This is why electron temperature (T<sub>e</sub>) is so much higher than gas temperature in a CCP discharge — and it's the same mechanism regardless of which electrode RF is applied to. What's different here is <b>which</b> electrode RF is applied to: the small, wafer-bearing chuck — and that choice is what sets up Step 4.</div>` }
    },
    { title:'DC Self-Bias Formation',
      body:`Electrons (very light, fast) reach the small powered chuck more efficiently than ions on every RF half-cycle. The <b>Blocking Capacitor</b> traps the resulting charge imbalance.
        <ul>
          <li>Net negative charge accumulates on the chuck, cycle after cycle</li>
          <li>V_DC (self-bias) shifts: 0 V → <b>−200 to −500 V</b></li>
          <li><b>Koenig–Maissel scaling:</b> |V_DC| ∝ (A<sub>g</sub>/A<sub>p</sub>)ⁿ, with n ≈ 2.5</li>
          <li>The bottom sheath (chuck side) thickens as V_DC grows; the top sheath (showerhead side) stays thin</li>
        </ul>`,
      hint:'📊 Watch the waveform shift negative. The V_DC meter builds from 0 to about −350 V over roughly 8 seconds.',
      deepDive:{
        title:'The "Two Buckets, One Drain" Picture of DC Self-Bias',
        body:`<p>Forget electrons and ions for a moment. Imagine <b>two buckets</b> sitting under the <b>same rain shower</b> (the oscillating plasma current, which is symmetric on average — equal current must flow to both electrodes over one RF cycle, because the discharge circuit must be closed).</p>
<ul>
  <li><b>Bucket A (Showerhead, grounded):</b> has a <b>wide-open drain pipe straight to the ground</b> — a true DC path to earth. Whatever rain falls in drains right back out. The water level stays at zero.</li>
  <li><b>Bucket B (Wafer Chuck, RF-powered):</b> its drain pipe has a <b>one-way valve that blocks DC flow</b> — that valve is the <b>Blocking Capacitor</b>. AC current (the rhythmic sloshing of the rain) can still pass through a capacitor, but any steady, one-directional flow cannot.</li>
</ul>
<div class="deep-hl">Because electrons arrive at <b>every</b> surface in contact with plasma far more often than ions (electrons are tens of thousands of times lighter), the "rain" itself is negatively charged on average — both buckets receive a net negative charge per unit time, before any equilibrium is reached.</div>
<p><b>What happens at Bucket A (showerhead, open drain):</b> negative charge arrives, but the open path to ground lets it flow away immediately. The bucket's water level (its potential) stays essentially at <b>0 V</b> — this is the definition of "ground."</p>
<p><b>What happens at Bucket B (chuck, capacitor-blocked drain):</b> negative charge arrives — but the blocking capacitor prevents any <b>net</b> (DC) current from leaving. The charge has nowhere to go, so it <b>accumulates</b>, cycle after cycle. The bucket's water level <b>drops below zero</b> — it becomes a negative DC voltage. This is exactly the electrode the wafer sits on.</p>
<div class="deep-eq">Cycle 1: small negative charge ΔQ accumulates on the chuck (Bucket B)
Cycle 2: a little more ΔQ accumulates → chuck potential drops further (more negative)
...
Cycle N: chuck potential is now negative enough that it starts
         REPELLING incoming electrons and ATTRACTING ions
→ at some negative voltage V_DC, electron flux = ion flux again (flux balance restored)
→ system reaches equilibrium — charge stops accumulating</div>
<div class="deep-hl">Why "hundreds of volts" and not "a few volts"? The magnitude of V_DC scales with how unequal the two "buckets" are — specifically the <b>ratio of the electrode areas</b>, captured by the Koenig–Maissel relation |V_DC| ∝ (A_g/A_p)ⁿ with n ≈ 2.5. A small powered-chuck area relative to the large grounded showerhead area means a much larger negative V_DC is needed to throttle the electron flux down to match the (smaller) ion flux arriving at that small area.</div>
<p><b>One sentence summary:</b> <b>DC self-bias is the steady-state "water level" that a one-way-valved bucket settles at, once it has accumulated just enough negative charge to make its own outgoing electron flux match its incoming ion flux — and a small powered electrode facing a large grounded area has to drop a lot lower to achieve that match.</b> Because the wafer sits directly on this "Bucket B" electrode, it is bathed in the resulting deep negative potential — which is precisely what Step 5 puts to use.</p>` }
    },
    { title:'Asymmetric Sheath & Ion Acceleration',
      body:`The fully-developed DC self-bias (≈ −350 V) creates a <b>deep potential well in the bottom sheath</b>, above the powered chuck. Positive ions accelerate across this sheath and gain large directional energy.
        <ul>
          <li><b>Bottom sheath</b> (chuck side): |V_DC + V_RF| → ion energy <b>200–1000+ eV</b></li>
          <li><b>Top sheath</b> (showerhead side): very thin, low voltage — large grounded area keeps it shallow</li>
          <li>Ion flux arrives <b>nearly perpendicular</b> to the wafer → <b>anisotropic etching</b></li>
          <li>By contrast, a symmetric CCP (as used for PE-CVD) develops <b>no</b> DC self-bias — this asymmetry is unique to (and essential for) etch-type chambers</li>
        </ul>`,
      hint:'💥 High-energy ions bombard the wafer vertically. The grounded showerhead sees almost no bombardment.',
      deepDive:{
        title:'Is "Hundreds of eV" Bombardment a Problem Here?',
        body:`<p>A common intuition from deposition processes: <b>"ion bombardment damages the film."</b> In a symmetric PE-CVD chamber, sheath voltages are only tens of volts, and that level of bombardment is mild — often even beneficial (densification). Here in oxide RIE, the question flips:</p>
<div class="deep-eq">Ion energy ≈ q × |V_DC + V_RF|
Symmetric CCP (PE-CVD):  V_sheath ≈ tens of volts    → E_ion ≈ tens of eV    (mild / densification)
Asymmetric CCP (RIE):    V_sheath ≈ hundreds of volts → E_ion ≈ 200–1000+ eV  (bond-breaking / etch)</div>
<p><b>In oxide RIE, hundreds of eV is exactly the intended operating regime</b> — not a side effect to avoid. Ion energy in this range exceeds the bond-breaking threshold for Si–O (~50–100 eV), which is precisely what's needed to:</p>
<ul>
  <li><b>Break Si–O bonds</b> at the SiO₂ surface, activating reaction sites for F radicals</li>
  <li><b>Physically sputter</b> weakly-bonded reaction products, helping desorption of volatile byproducts (SiF₄, CO₂)</li>
  <li>Provide <b>directionality</b> — ions arrive nearly perpendicular to the wafer, accelerated straight down through the thick bottom sheath, giving <b>anisotropic, vertical-sidewall</b> profiles instead of isotropic (sideways) etching</li>
</ul>
<div class="deep-hl">The same physics (q × V_sheath) that is mild at tens of eV in a symmetric PE-CVD chamber becomes the <b>primary etch-driving mechanism</b> at hundreds of eV in this asymmetric RIE chamber. The "good" or "bad" label depends entirely on the process goal — deposit-and-densify vs. remove-and-shape — not on the physics itself. The area asymmetry (A_g ≫ A_p, Steps 2–4) is precisely what raises V_DC into the regime oxide RIE needs.</div>
<p><b>Could V_sheath be "too high"?</b> Yes — excessive ion energy can cause substrate damage (dangling bonds, ion implantation into underlying layers), reduced selectivity (etching the mask or underlying layer too), and feature-bottom roughening. Process engineers tune RF power, pressure, and electrode area ratio to keep V_DC in the range that balances etch rate against these side effects.</p>` }
    },
    { title:'Surface Reaction — Reactive Ion Etching',
      body:`Physical sputtering and chemical reaction work <b>synergistically</b> on SiO₂.
        <ul>
          <li>Ion bombardment breaks Si–O bonds and activates reaction sites</li>
          <li><code>SiO₂ + 4F· → SiF₄↑ + O₂↑</code> &nbsp;(chemical / radical-driven)</li>
          <li><code>SiO₂ + CF₃⁺ → SiF₄↑ + CO₂↑</code> &nbsp;(ion-enhanced)</li>
          <li>All products are volatile → pumped away; <b>no redeposition</b></li>
        </ul>`,
      hint:'🎯 Gray SiF₄ / CO₂ byproducts rise away from the surface and are evacuated.',
      deepDive:{
        title:'Why Does Etching Need Both Radicals AND Ions?',
        body:`<p>F radicals are highly reactive with SiO₂ on their own — this is "chemical" etching, and it happens even with purely thermal F-atom exposure and no ions at all. So why does this chamber bother generating <b>energetic ions</b> via the large V_DC from Step 4? Two reasons:</p>
<div class="deep-hl">① Directionality — anisotropic profiles</div>
<p>Pure chemical etching by neutral F radicals is <b>isotropic</b> — radicals arrive from random directions (diffusion), so they etch sideways under the photoresist mask just as fast as straight down. This produces rounded, undercut profiles — unacceptable for modern high-aspect-ratio features.</p>
<p>Ions, by contrast, are accelerated <b>nearly perpendicular</b> to the wafer by the thick bottom sheath (Step 5). Their bombardment energy is concentrated at the <b>bottom</b> of a trench, not the sidewalls. This gives <b>anisotropic (vertical-sidewall) etching</b> — the defining requirement of modern oxide RIE.</p>
<div class="deep-hl">② Ion-Enhanced / Synergistic etching — rate boost beyond either alone</div>
<p>Experimentally, the etch rate with <b>both</b> F radicals and energetic ions present is often much <b>higher than the sum</b> of (chemical-only etch rate) + (physical-sputter-only rate). This synergy arises because:</p>
<ul>
  <li>Ion bombardment <b>breaks Si–O bonds</b> and disrupts the surface lattice, creating reactive sites that F radicals can attack more readily</li>
  <li>Ion impact helps <b>desorb</b> reaction products (SiF₄, CO₂) that might otherwise remain adsorbed and block further reaction — "clearing the surface" for the next cycle</li>
</ul>
<div class="deep-hl">Summary: F radicals (from C₄F₈ + O₂) supply the <b>chemistry</b> (what bonds form/break), while Ar⁺/CF₃⁺ ions supply the <b>direction and surface activation</b> (where it happens, and how fast). Neither alone gives the combination of etch rate and anisotropy that modern oxide RIE requires — which is exactly why the asymmetric-electrode CCP design (built specifically to generate a large V_DC on the wafer-bearing chuck) is the standard architecture for this process.</div>
<p><b>Role of Ar:</b> Argon is chemically inert — it doesn't directly react with SiO₂. Its job is purely physical: Ar⁺ ions (40 amu, relatively heavy) deliver efficient momentum transfer for sputtering, supplementing the chemically-driven F·/CF₃⁺ pathway and helping stabilize the discharge.</p>` }
    },
    { title:'DC vs RF — Why RF for Oxide Etching?',
      body:`A fixed DC discharge <b>cannot etch SiO₂ effectively</b> — for a reason specific to insulating films.
        <ul>
          <li><b>DC mode:</b> positive ions arriving at the SiO₂ surface neutralize there, but cannot be replenished by conduction (SiO₂ is an insulator) → the surface charges up positively → the accelerating E-field collapses → plasma <b>extinguishes</b></li>
          <li><b>RF mode:</b> polarity reverses 13.56 million times/sec → any surface charge is neutralized again each half-cycle, before it can build up enough to collapse the field → plasma <b>sustained</b></li>
          <li>RF is also what makes the <b>Blocking Capacitor</b> (Step 4) functional — it passes AC but blocks DC, which is how it traps charge to build V_DC while still letting RF power flow</li>
        </ul>`,
      hint:'🔁 Toggle DC ↔ RF below: DC mode causes surface charge buildup and plasma collapse.',
      deepDive:[{
        title:'RF Sustains Ionization AND Builds DC Self-Bias — At the Same Time',
        body:`<p>This may look like a contradiction at first: RF keeps electrons <b>oscillating</b> (this step's main point), while Step 4 says a steady <b>DC offset</b> (V_DC) builds up on the powered chuck. How can an oscillating signal create something described as "DC"?</p>
<div class="deep-hl">The resolution: V_DC is a DC <b>offset</b> superimposed on an RF <b>waveform</b> — not a replacement for it. The instantaneous voltage on the chuck is V(t) = V_DC + V_RF·sin(ωt). The waveform still swings up and down at 13.56 MHz (sustaining ionization via electron oscillation), but its <b>average value</b> sits at a large negative number (V_DC) instead of zero.</div>
<p>The blocking capacitor is what allows this split to exist: it passes the oscillating (RF) component freely — so RF power still couples into the plasma and electrons still oscillate — but it <b>cannot</b> pass the net (DC) component, so any DC charge imbalance accumulated each cycle stays trapped on the chuck side of the capacitor as V_DC.</p>
<div class="deep-eq">V(t) on the powered chuck = V_DC (large negative, slowly-varying)
                           + V_RF · sin(2π × 13.56MHz × t)  (oscillating, sustains ionization)</div>
<p>This is in addition to — not instead of — the insulating-surface-charging issue covered in this step's main text. Both effects (sustained ionization on an insulating SiO₂ surface, and the chuck-side self-bias offset) require the <b>same</b> RF drive; they are two faces of the same coin. If the system were run on pure DC, neither would exist: the plasma would collapse from surface charging (as shown when you toggle to DC mode), and there would be no oscillation to repeatedly "test" the flux balance that defines V_DC.</p>`
      }] },
    { title:'Full RIE — Anisotropic Trench Formation',
      body:`With DC self-bias fully active, ions bombard the SiO₂ <b>vertically</b> through the photoresist (PR) mask opening.
        <ul>
          <li>Directional ion flux → <b>vertical sidewalls</b></li>
          <li>PR mask protects the covered SiO₂ — no lateral etch under the mask</li>
          <li>High SiO₂/Si selectivity achievable with the right C₄F₈ : O₂ ratio</li>
        </ul>
        Overall: <code>SiO₂ + C₄F₈ + Ar → SiF₄↑ + CO₂↑ + COF₂↑</code>`,
      hint:'🎯 Watch the trench deepen with vertical sidewalls. Press Reset to restart the animation.' },
    { title:'CCP Oxide Etching — Key Takeaways',
      body:`Consolidated reference for asymmetric CCP oxide etching.
        <ul>
          <li>Asymmetric electrodes (A<sub>g</sub> ≫ A<sub>p</sub>) → <b>DC self-bias</b> on the wafer-bearing chuck → high directional ion energy</li>
          <li>RF sustains the plasma on dielectric SiO₂ — DC fails due to surface charging</li>
          <li>C₄F₈ / Ar / O₂ combines reactive F· chemistry with physical Ar⁺ sputtering</li>
          <li>Low pressure + high |V_DC| → <b>anisotropic (vertical) etch</b> profiles</li>
        </ul>`,
      hint:'📋 Summary of all CCP oxide-etching concepts — compare with the PE-CVD deposition module.' },
  ],

  steps:[
    { title:'Asymmetric CCP — Chamber 구조',
      body:`SiO₂ Oxide Etch (RIE)를 위한 평행판 <b>Capacitively Coupled Plasma</b> Chamber.
        <ul>
          <li><b>Showerhead (상부)</b> — 접지(Grounded) 전극 &amp; 가스 분배기, Chamber 전체 폭 (넓은 면적 A<sub>g</sub>)</li>
          <li><b>Wafer Chuck (하부)</b> — RF-Powered 전극, 더 작은 폭(A<sub>p</sub>), <b>Blocking Capacitor</b>를 통해 구동</li>
          <li><b>핵심 관계:</b> A<sub>g</sub> ≫ A<sub>p</sub> → Chuck에 DC Self-Bias 형성</li>
          <li>가스: <code>C₄F₈ + Ar + O₂</code>, 각각 독립 MFC로 제어</li>

<p>실험적으로, F Radical과 고에너지 Ion이 <b>둘 다</b> 존재할 때의 Etch Rate는 종종 (화학적 Etch 단독 Rate) + (물리적 Sputter 단독 Rate)의 <b>단순 합보다 훨씬 큽니다</b>. 이 시너지는 다음에서 비롯됩니다:</p>
<ul>
  <li>Ion Bombardment가 <b>Si–O 결합을 끊고</b> 표면 격자를 교란시켜, F Radical이 더 쉽게 공격할 수 있는 반응 자리(Reactive Site)를 만듦</li>
  <li>Ion 충격이 그렇지 않으면 표면에 흡착된 채 남아 추가 반응을 막을 수 있는 반응 생성물(SiF₄, CO₂)의 <b>탈착(Desorption)</b>을 도와 — 다음 반응을 위한 "표면 정리" 역할</li>
</ul>
<div class="deep-hl">정리: (C₄F₈ + O₂에서 생성된) F Radical은 <b>화학(어떤 결합이 형성/파괴되는가)</b>을, Ar⁺/CF₃⁺ Ion은 <b>방향성과 표면 활성화(어디서, 얼마나 빠르게 일어나는가)</b>를 제공합니다. 둘 중 하나만으로는 현대 Oxide RIE가 요구하는 Etch Rate와 Anisotropy의 조합을 얻을 수 없습니다 — 이것이 바로 (웨이퍼를 탑재한 Chuck에 큰 V_DC를 만들도록 설계된) 비대칭 전극 CCP가 이 공정의 표준 구조인 이유입니다.</div>
<p><b>Ar의 역할:</b> Argon은 화학적으로 불활성이며 SiO₂와 직접 반응하지 않습니다. 그 역할은 순수하게 물리적입니다 — Ar⁺ Ion(40 amu, 비교적 무거움)이 효율적인 운동량 전달로 Sputtering을 수행하여, 화학적으로 작동하는 F·/CF₃⁺ 경로를 보완하고 Discharge를 안정화합니다.</p>` }

// ── Drawing helpers ───────────────────────────────────────────
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
function pipe(pts,col='#b3bac8',w=2.2){
  ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.stroke();
}
function arw(x0,y0,x1,y1,col='#1d2436',w=1.2){
  ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=w;
  ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.stroke();
  const a=Math.atan2(y1-y0,x1-x0),h=5.5;
  ctx.beginPath();ctx.moveTo(x1,y1);
  ctx.lineTo(x1-h*Math.cos(a-0.4),y1-h*Math.sin(a-0.4));
  ctx.lineTo(x1-h*Math.cos(a+0.4),y1-h*Math.sin(a+0.4));
  ctx.closePath();ctx.fill();
}
function gnd(cx,cy){
  ctx.strokeStyle='#1d2436';ctx.lineWidth=1.5;ctx.beginPath();
  ctx.moveTo(cx,cy);ctx.lineTo(cx,cy+6);
  ctx.moveTo(cx-10,cy+6);ctx.lineTo(cx+10,cy+6);
  ctx.moveTo(cx-7,cy+10);ctx.lineTo(cx+7,cy+10);
  ctx.moveTo(cx-4,cy+14);ctx.lineTo(cx+4,cy+14);
  ctx.stroke();
}
function chem(formula,x,y,sz=11,col='#1d2436'){  ctx.fillStyle=col;
  const bF=`bold ${sz}px ${FONT}`,sF=`bold ${Math.round(sz*.7)}px ${FONT}`,pF=`bold ${Math.round(sz*.75)}px ${FONT}`;
  ctx.textAlign='left';ctx.textBaseline='middle';
  const segs=[];let i=0;
  while(i<formula.length){
    const ch=formula[i];
    if(/[A-Za-z]/.test(ch)){let s=ch;while(i+1<formula.length&&/[a-z]/.test(formula[i+1])){s+=formula[++i];}segs.push({t:'b',s});}
    else if(/[0-9]/.test(ch))segs.push({t:'sub',s:ch});
    else if(ch==='+'||ch==='-')segs.push({t:'sup',s:ch});
    i++;
  }
  let tot=0;for(const s of segs){ctx.font=s.t==='b'?bF:s.t==='sub'?sF:pF;tot+=ctx.measureText(s.s).width;}
  let cx=x-tot/2;
  for(const s of segs){
    ctx.font=s.t==='b'?bF:s.t==='sub'?sF:pF;
    const oy=s.t==='sub'?sz*.30:s.t==='sup'?-sz*.32:0;
    ctx.fillText(s.s,cx,y+oy);cx+=ctx.measureText(s.s).width;
  }

// driving the chuck, the instantaneous polarity of chuck vs. showerhead
// flips every half-cycle. Returns +1 / -1 representing the chuck's

function rfPolarity(t,freq=0.6){
  return Math.sin(t*2*Math.PI*freq)>0 ? +1 : -1;

// Striped PR mask pattern: 9 segments alternating PURPLE(PR)/WHITE(opening),
// 5 PR blocks + 4 openings, matching the chamber-configuration guideline.
// The center PR block carries the "PR" label.
const PR_SEGMENTS=9;
function drawPRStripes(x,y,w,h,labeled){
  const segW=w/PR_SEGMENTS;
  const prg=ctx.createLinearGradient(0,y,0,y+h);prg.addColorStop(0,'#7030A0');prg.addColorStop(1,'#5a1f82');
  for(let i=0;i<PR_SEGMENTS;i++){
    const sx=x+i*segW;
    if(i%2===0){ // PR block (purple)
      ctx.fillStyle=prg;ctx.fillRect(sx,y,segW,h);
      if(labeled&&i===4){
        ctx.fillStyle='rgba(255,255,255,.82)';ctx.font=`bold 8px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText('PR',sx+segW/2,y+h/2);
      }
    }else{ // opening (white)
      ctx.fillStyle='#ffffff';ctx.fillRect(sx,y,segW,h);
      ctx.strokeStyle='rgba(112,48,160,.18)';ctx.lineWidth=.6;ctx.strokeRect(sx,y,segW,h);
    }

}
// Wafer with trench (step 8): anisotropic etch into SiO2 through ALL of
// the PR mask's striped openings (white segments 1,3,5,7 of the 9-segment
// pattern). `eds` is an array indexed by segment number giving each
// opening's etch depth; TRENCH_SEG carries the on-screen depth readout.
const OPEN_SEGS=[1,3,5,7];
const TRENCH_SEG=5;
function drawWaferWithTrench(eds){
  const sy=WF.y-SIO2_MAX, my=sy-PR_H;
  const segW=WF.w/PR_SEGMENTS;
  ctx.fillStyle='#4a5470';ctx.fillRect(WF.x,WF.y,WF.w,WF.h);
  const sg=ctx.createLinearGradient(0,sy,0,WF.y);sg.addColorStop(0,'rgba(70,150,220,.82)');sg.addColorStop(1,'rgba(50,120,190,.92)');
  // Base SiO2 layer across the full width
  ctx.fillStyle=sg;ctx.fillRect(WF.x,sy,WF.w,SIO2_MAX);
  // Cut each open segment's trench into the SiO2
  for(const seg of OPEN_SEGS){
    const tL=Math.round(WF.x+seg*segW), tR=Math.round(tL+segW);
    const et=Math.min(eds[seg]||0,SIO2_MAX);
    if(et<=0)continue;
    ctx.fillStyle='#0c1020';ctx.fillRect(tL,sy,tR-tL,et);
    ctx.strokeStyle='rgba(70,140,210,.45)';ctx.lineWidth=1;ctx.strokeRect(tL,sy,tR-tL,et);
  }
  // PR stripe pattern — purple PR blocks at even segments; odd segments are
  // open (white-bordered outline only, so the trench/SiO2 beneath is visible)
  const prg=ctx.createLinearGradient(0,my,0,my+PR_H);prg.addColorStop(0,'#7030A0');prg.addColorStop(1,'#5a1f82');
  for(let i=0;i<PR_SEGMENTS;i++){
    const sx=WF.x+i*segW;
    if(i%2===0){
      ctx.fillStyle=prg;ctx.fillRect(sx,my,segW,PR_H);
      if(i===4){
        ctx.fillStyle='rgba(255,255,255,.82)';ctx.font=`bold 8px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText('PR',sx+segW/2,my+PR_H/2);
      }
    }else{
      ctx.strokeStyle='rgba(112,48,160,.18)';ctx.lineWidth=.6;ctx.strokeRect(sx,my,segW,PR_H);
    }
  }
  ctx.fillStyle='rgba(255,255,255,.72)';ctx.font=`bold 9px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('SiO₂',WF.x+28,sy+SIO2_MAX/2);
  ctx.fillStyle='#8a90a0';ctx.font=`9px ${FONT}`;ctx.textAlign='right';ctx.fillText('Si',WF.x+WF.w-5,WF.y+3);
  // Depth readout — shown on the primary tracked trench (TRENCH_SEG)
  const etP=eds[TRENCH_SEG]||0;
  if(etP>2){
    const tL=Math.round(WF.x+TRENCH_SEG*segW);
    const ax=tL-14;
    ctx.strokeStyle='#e8553b';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(ax,sy);ctx.lineTo(ax,sy+etP);ctx.stroke();
    arw(ax,sy+5,ax,sy,'#e8553b',.9);arw(ax,sy+etP-5,ax,sy+etP,'#e8553b',.9);
    ctx.fillStyle='#e8553b';ctx.font=`bold 9px ${FONT}`;ctx.textAlign='right';ctx.textBaseline='middle';
    ctx.fillText(`${Math.round(etP/SIO2_MAX*100)}%`,ax-3,sy+etP/2);
  }
}

// V_electrode(t) waveform (Step 4 only) — V_RF·sin(wt) + V_DC offset.
// V_RF amplitude (380V) is intentionally larger than the maximum |V_DC|
// (350V): even at full self-bias, the waveform's positive peak sits a
// little above 0V (the brief instant each cycle when the electron flux
// can balance the ion flux — this is what defines the equilibrium V_DC).
// The whole sine wave shifts down as V_DC builds; it is never clipped or
// half-rectified.
function drawVoltageWaveform(dcOff,t){
  const gx=22,gy=H-170,gw=215,gh=140;
  ctx.fillStyle='#111827';rr(gx,gy,gw,gh,8);ctx.fill();
  ctx.strokeStyle='#1e3048';ctx.lineWidth=.8;rr(gx,gy,gw,gh,8);ctx.stroke();
  ctx.fillStyle='#7eb5d6';ctx.font=`bold 10px ${FONT}`;ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillText(lang==='ko'?'V_electrode (Powered Chuck)':'V_electrode (powered chuck)',gx+8,gy+8);
  const ax=gx+22, ay0=gy+26, aw=gw-32, ah=gh-40;
  const rfA=380; // V_RF amplitude (volts) — kept > max |V_DC| so the peak can cross 0V
  const span=rfA + (350+rfA); // 0..+rfA headroom, plus -(350+rfA) at full bias
  const vScale=ah/span;
  const zeroY=ay0+rfA*vScale; // y-position of the 0 V reference line
  ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=.8;
  ctx.beginPath();ctx.moveTo(ax,zeroY);ctx.lineTo(ax+aw,zeroY);ctx.stroke();
  ctx.strokeStyle='#4f8ff0';ctx.lineWidth=1.5;ctx.beginPath();
  for(let i=0;i<=aw;i++){
    const ph=(i/aw)*Math.PI*6+t*3.2;
    const vy=zeroY-(rfA*Math.sin(ph)+dcOff)*vScale;
    i===0?ctx.moveTo(ax+i,vy):ctx.lineTo(ax+i,vy);
  }
  ctx.stroke();
  if(Math.abs(dcOff)>8){
    const dcY=zeroY-dcOff*vScale;
    ctx.strokeStyle='#f06060';ctx.lineWidth=1;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(ax,dcY);ctx.lineTo(ax+aw,dcY);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#f06060';ctx.font=`bold 9.5px ${FONT}`;ctx.textAlign='left';ctx.textBaseline='bottom';
    ctx.fillText(`V_DC = ${dcOff.toFixed(0)} V`,ax+3,dcY-2);
  }
  ctx.fillStyle='rgba(255,255,255,.45)';ctx.font=`9px ${FONT}`;ctx.textAlign='right';ctx.textBaseline='middle';
  ctx.fillText('0',ax-3,zeroY);
  ctx.fillStyle='#4f8ff0';ctx.textAlign='right';ctx.textBaseline='bottom';
  ctx.fillText('V_RF (13.56 MHz)',ax+aw,gy+gh-4);
}

function spawn(type,x,y,vx=null,vy=null){
  particles.push({type,x,y,vx:vx!==null?vx:(Math.random()-.5)*.4,vy:vy!==null?vy:(Math.random()-.5)*.4,age:0});
  return particles[particles.length-1];
}
function rndPt(){return{x:PL.x+10+Math.random()*(PL.w-20),y:PL.y+8+Math.random()*(PL.h-16)};}
function clr(){particles=[];lights=[];impacts=[];}
function updP(p,dt,o){
  const d=SP[p.type];p.age+=dt;
  if(d.cat==='byproduct'){
    p.vy-=0.55;p.vx+=(Math.random()-.5)*.08;p.vx*=.97;p.vy*=.97;
    return p.age<1.8;
  }
  if(d.q!==0&&o.fieldActive){
    // Bottom sheath (powered chuck, DC self-bias) is much stronger than
    // the top sheath (grounded showerhead).
    let boost=1;
    if(p.y<ST.y+ST.h) boost=2.5;
    else if(p.y>SB.y) boost=5.0;
    const f=d.q*o.fieldDir*o.fieldStrength*boost;
    p.vy+=f/Math.max(d.m,5e-4)*dt*.5;
  }
  // Mass-independent downward drift toward the powered chuck (bottom) —
  // represents the strong directional acceleration across the thick
  // bottom sheath for ions, and general transport toward the etch front
  // for neutral radicals; without this, species drift far too slowly
  // under the mass-scaled field force above to reach the surface within
  // an observable timescale.
  if(o.driftBot&&(d.cat==='ion'||d.cat==='radical')){
    const target=d.cat==='ion'?2.0:1.2;
    if(p.vy<target)p.vy+=(target-p.vy)*Math.min(1,dt*1.2);
  }
  const br=o.brownian??0.08,dr=o.drag??0.96;
  if(d.cat==='neutral'||d.cat==='radical'){p.vx+=(Math.random()-.5)*br;p.vy+=(Math.random()-.5)*br;}
  else p.vx+=(Math.random()-.5)*(br*.5);
  p.vx*=dr;p.vy*=dr;
  const mx=d.cat==='electron'?4.5:d.cat==='ion'?2.4:1.0,sp=Math.hypot(p.vx,p.vy);
  if(sp>mx){p.vx*=mx/sp;p.vy*=mx/sp;}
  p.x+=p.vx;p.y+=p.vy;
  if(p.x<PL.x+4){p.x=PL.x+4;p.vx=Math.abs(p.vx)*.4;}
  if(p.x>PL.x+PL.w-4){p.x=PL.x+PL.w-4;p.vx=-Math.abs(p.vx)*.4;}
  // Top boundary (grounded showerhead side)
  if(p.y<ST.y+2){
    if(d.cat==='electron'&&o.absorbElectronTop)return false;
    if(d.cat==='ion'&&o.absorbIonTop){o.onImpact&&o.onImpact(p,'top');return false;}
    p.y=ST.y+2;p.vy=Math.abs(p.vy)*.4;
  }
  // Bottom boundary (powered chuck / SiO2 surface)
  if(p.y>SB.y+SB.h-2){
    if(d.cat==='ion'&&o.absorbIonBot){o.onImpact&&o.onImpact(p,'bot');return false;}
    if(d.cat==='electron'&&o.absorbElectronBot)return false;
    if(d.cat==='radical'&&o.absorbRadBot){o.onImpact&&o.onImpact(p,'bot');return false;}
    p.y=SB.y+SB.h-2;p.vy=-Math.abs(p.vy)*.4;
  }
  return true;
}

  ctx.fillText(lang==='ko'?'휘발성 부산물':'volatile byproducts',22,110);
}
let t7=0;
function s7(dt,t){
  let fieldDir,plasmaI,sheathI,chuckCharge;
  if(mode==='RF'){
    fieldDir=Math.sin(t*2*Math.PI*.7)>0?+1:-1;plasmaI=1.0;sheathI=.9;
    chuckCharge=fieldDir>0?-1:+1;step7DCDecay=0;
  }else{
    fieldDir=+1;step7DCDecay=Math.min(step7DCDecay+dt*.22,1);
    plasmaI=Math.max(0,1-step7DCDecay);sheathI=Math.max(0,1-step7DCDecay*.7);
    chuckCharge=plasmaI>.05?-1:0;
  }
  chrome(mode==='RF',t);
  drawGlow(plasmaI,t);drawSheaths(sheathI,mode==='RF'?1:0);
  drawShowerhead(mode==='RF'?-chuckCharge:0);drawChuck(chuckCharge);drawWafer();drawSideLabels();drawDCMeter(getVdc());
  const opts={fieldActive:plasmaI>.05,fieldDir,fieldStrength:.25,absorbElectronTop:mode==='DC',absorbIonBot:mode==='DC'};
  particles=particles.filter(p=>updP(p,dt,opts));
  t7+=dt;if(mode==='RF'&&t7>.20){t7=0;
    if(particles.filter(p=>SP[p.type].cat==='electron').length<6){const r=rndPt();spawn('e-',r.x,r.y);}
    if(particles.filter(p=>SP[p.type].cat==='ion').length<7){const r=rndPt();spawn(Math.random()<.5?'CF3+':'Ar+',r.x,r.y);}
  }
  drawParts();
  ctx.fillStyle=B.muted;ctx.font=`11px ${MONO}`;ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillText(`${L().modeLabel}: ${mode}`,22,72);
  if(mode==='DC'){
    ctx.fillStyle=step7DCDecay>.5?B.red:B.muted;ctx.fillText(`${L().plasmaLabel}: ${(plasmaI*100).toFixed(0)}%`,22,88);
    if(plasmaI<.05){ctx.fillStyle=B.red;ctx.font=`bold 13px ${FONT}`;ctx.fillText(L().extinguished,22,106);}
  }else ctx.fillText(L().sustained,22,88);
}

let t8=0;
function s8(dt,t){
  chrome(true,t);const rfPh=Math.sin(t*2*Math.PI*.9);
  drawGlow(1.0,t);drawSheaths(1.0,1.0);
  {const chuckCharge=rfPh>0?-1:+1;drawShowerhead(-chuckCharge);drawChuck(chuckCharge);}
  drawWaferWithTrench(etchDepths);drawSideLabels();drawDCMeter(getVdc());
  const surfY=SB.y+SB.h-2;
  const segW=WF.w/PR_SEGMENTS;
  // Precompute the x-ranges of all PR-open segments
  const openRanges=OPEN_SEGS.map(seg=>({seg,tL:Math.round(WF.x+seg*segW),tR:Math.round(WF.x+(seg+1)*segW)}));
  const opts={fieldActive:true,fieldDir:+1,fieldStrength:.38,absorbIonBot:true,absorbRadBot:true,driftBot:true,
    onImpact:(p,w)=>{
      if(w!=='bot')return;
      addImp(p.x,surfY);
      const hit=openRanges.find(r=>p.x>=r.tL&&p.x<=r.tR);
      if(hit){
        const cur=etchDepths[hit.seg]||0;
        if(cur<SIO2_MAX){
          // Both ion-enhanced (faster) and radical (chemical, slower) etching
          const isIon=SP[p.type].cat==='ion';
          etchDepths[hit.seg]=cur+(isIon?.22:.10);
          emitL(p.x,surfY,'rgba(180,220,255,1)',.3);
          if(Math.random()<.45){spawn(Math.random()<.55?'SiF4':'CO2',p.x,surfY,(Math.random()-.5)*.5,-1.6-Math.random()*.5);}
        }
      }
    }};
  particles=particles.filter(p=>updP(p,dt,opts));
  t8+=dt;if(t8>.12){t8=0;
    if(Math.random()<.7){
      const x=SH.x+20+Math.random()*(SH.w-40),y=SH.y+SH.h+4;
      const tp=['CF3','F','Ar+','CF3+','CF2'];
      const p=spawn(tp[Math.floor(Math.random()*tp.length)],x,y);p.vy=.4;
    }
    if(particles.filter(p=>SP[p.type].cat==='ion').length<9){const r=rndPt();spawn(Math.random()<.5?'CF3+':'Ar+',r.x,r.y);}
    if(particles.filter(p=>SP[p.type].cat==='electron').length<5){const r=rndPt();spawn('e-',r.x,r.y);}
    if(particles.filter(p=>SP[p.type].cat==='radical').length<8){const r=rndPt();spawn(Math.random()<.5?'CF3':'F',r.x,r.y);}
    if(Math.random()<.5){const r=rndPt();emitL(r.x,r.y,'rgba(210,225,255,1)',.4);}
  }
  updL(dt);updImp(dt);drawParts();drawL();drawImp();
  // Equation / Etch-Depth overlay — placed BELOW the V_DC meter (which
  // occupies x:22-182, y:22-66) so the two never overlap.
  const eqY=86;ctx.fillStyle='#3a4358';ctx.font=`bold 12px ${FONT}`;ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText(L().eqLabel,22,eqY);
  chem('SiO2',isKoX(84,100),eqY,12,'#1d2436');ctx.fillText('+',isKoX(108,124),eqY);
  chem('C4F8',isKoX(126,148),eqY,12,'#6b2fa0');ctx.fillText('+',isKoX(156,180),eqY);
  chem('Ar',isKoX(170,198),eqY,12,'#4a7ab0');ctx.fillText('→',isKoX(192,222),eqY);
  chem('SiF4',isKoX(220,256),eqY,12,'#8a8a9a');ctx.fillText('+',isKoX(248,288),eqY);
  chem('CO2',isKoX(268,308),eqY,12,'#8a8a9a');ctx.fillText('↑',isKoX(290,328),eqY);
  const etP=etchDepths[TRENCH_SEG]||0;
  ctx.fillStyle=B.muted;ctx.font=`11px ${MONO}`;ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillText(`${L().etchLabel}: ${(etP/SIO2_MAX*100).toFixed(1)} ${L().etchPctOf}`,22,114);
  ctx.fillStyle=B.border;ctx.fillRect(22,130,200,5);
  ctx.fillStyle=etP>=SIO2_MAX?B.green:'#3a9af0';
  ctx.fillRect(22,130,Math.min(200,etP/SIO2_MAX*200),5);
  if(etP>=SIO2_MAX){ctx.fillStyle=B.green;ctx.font=`bold 10px ${FONT}`;ctx.fillText(L().etchThrough,22,142);}
}
function isKoX(en,ko){return lang==='ko'?ko:en;}

// ── STEP 9 (K) — Key Takeaways ──────────────────────────────────
function s9(){
  ctx.fillStyle=B.bg;ctx.fillRect(0,0,W,H);
  const hg=ctx.createLinearGradient(0,0,W,0);hg.addColorStop(0,B.purple);hg.addColorStop(1,'#8B40B8');
  ctx.fillStyle=hg;ctx.fillRect(0,0,W,64);
  ctx.fillStyle='#fff';ctx.font=`bold 19px ${FONT}`;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(L().takeawayHeader,24,26);
  ctx.fillStyle='rgba(255,255,255,.72)';ctx.font=`11.5px ${FONT}`;ctx.fillText(L().takeawaySubheader,24,50);
  ctx.fillStyle=B.green;ctx.fillRect(0,64,W,4);
  function secLbl(txt,x,y){ctx.fillStyle=B.purple;ctx.fillRect(x,y-7,3,14);ctx.font=`bold 12.5px ${FONT}`;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillStyle=B.charcoal;ctx.fillText(txt,x+10,y);}
  const LX=20,LWc=408;secLbl(L().takeawayDesign,LX,84);
  L().principles.forEach(([title,desc],i)=>{
    const cy=100+i*82,ch=72;
    ctx.save();rr(LX,cy,LWc,ch,8);ctx.clip();ctx.fillStyle='rgba(15,140,80,.07)';ctx.fillRect(LX,cy,LWc,ch);ctx.restore();
    rr(LX,cy,LWc,ch,8);ctx.strokeStyle='rgba(15,140,80,.28)';ctx.lineWidth=.8;ctx.stroke();
    ctx.fillStyle=B.green;ctx.beginPath();ctx.arc(LX+22,cy+ch/2,11,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.font=`bold 13px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('✓',LX+22,cy+ch/2);
    ctx.fillStyle='#0a5e34';ctx.font=`bold 12.5px ${FONT}`;ctx.textAlign='left';ctx.fillText(title,LX+42,cy+24);
    ctx.fillStyle='#4a5565';ctx.font=`10.5px ${FONT}`;ctx.fillText(desc,LX+42,cy+48);
  });
  const RX=446,RW=436;secLbl(L().takeawayParams,RX,84);
  const TY=98,RH=30,cols=[0,192,314,436],totH=RH*(L().tRows.length+1);
  ctx.save();rr(RX,TY,RW,totH,8);ctx.clip();
  ctx.fillStyle=B.purple;ctx.fillRect(RX,TY,RW,RH);
  L().tHeaders.forEach((h,ci)=>{const mx=RX+(cols[ci]+cols[ci+1])/2;ctx.fillStyle='#fff';ctx.font=`bold 11.5px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(h,mx,TY+RH/2);});
  L().tRows.forEach((row,ri)=>{
    const ry=TY+RH+ri*RH;ctx.fillStyle=ri%2===0?B.purpleSoft:'#fff';ctx.fillRect(RX,ry,RW,RH);
    ctx.strokeStyle='#ddd0ee';ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(RX,ry+RH);ctx.lineTo(RX+RW,ry+RH);ctx.stroke();
    [1,2].forEach(ci=>{ctx.beginPath();ctx.moveTo(RX+cols[ci],ry);ctx.lineTo(RX+cols[ci],ry+RH);ctx.stroke();});
    row.forEach((cell,ci)=>{
      ctx.fillStyle=ci===0?B.charcoal:ci===1?B.purple:'#6b7388';ctx.font=ci===0?`11px ${FONT}`:`bold 11px ${FONT}`;
      ctx.textAlign=ci===0?'left':'center';ctx.textBaseline='middle';
      ctx.fillText(cell,ci===0?RX+8:RX+(cols[ci]+cols[ci+1])/2,ry+RH/2);
    });
  });
  ctx.restore();rr(RX,TY,RW,totH,8);ctx.strokeStyle='#d0c0e8';ctx.lineWidth=1;ctx.stroke();
  const PWY=TY+totH+18;
  ctx.fillStyle=B.green;ctx.fillRect(RX,PWY,3,14);ctx.fillStyle=B.charcoal;ctx.font=`bold 12px ${FONT}`;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(L().takeawayWindow,RX+10,PWY+7);
  L().pwItems.forEach(([k,v],i)=>{
    const py=PWY+26+i*22;ctx.fillStyle='#7a7a8a';ctx.font=`11px ${FONT}`;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(k,RX+10,py);
    ctx.fillStyle=B.charcoal;ctx.font=`bold 11px ${FONT}`;ctx.textAlign='right';ctx.fillText(v,RX+RW-6,py);
  });
  const BX=20,BY=514,BW=W-40,BH=74,HDH=30;
  ctx.save();rr(BX,BY,BW,BH,8);ctx.clip();ctx.fillStyle='rgba(242,201,76,.13)';ctx.fillRect(BX,BY,BW,HDH);ctx.fillStyle='#fff';ctx.fillRect(BX,BY+HDH,BW,BH-HDH);ctx.restore();
  rr(BX,BY,BW,BH,8);ctx.strokeStyle='rgba(190,155,40,.32)';ctx.lineWidth=.8;ctx.stroke();
  ctx.strokeStyle='rgba(190,155,40,.32)';ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(BX+1,BY+HDH);ctx.lineTo(BX+BW-1,BY+HDH);ctx.stroke();
  ctx.fillStyle='rgba(242,201,76,.50)';ctx.beginPath();ctx.arc(BX+20,BY+HDH/2,9,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#7a5800';ctx.font=`bold 12px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('!',BX+20,BY+HDH/2);
  ctx.fillStyle=B.charcoal;ctx.font=`bold 12.5px ${FONT}`;ctx.textAlign='left';ctx.fillText(L().takeawayLimits,BX+36,BY+HDH/2);
  ctx.fillStyle='#5a6070';ctx.font=`10.5px ${FONT}`;
  L().limitLines.forEach((ln,i)=>ctx.fillText(ln,BX+14,BY+HDH+16+i*18));
  drawLogo(.55);
}

const RENDERS=[s1,s2,s3,s4,s5,s6,s7,s8,s9];

// ── Step controls ─────────────────────────────────────────────
function renderStepCtrl(i){
  stepCtrlEl.innerHTML='';
  if(i===6){
    const wrap=document.createElement('div');wrap.className='mode-toggle';
    const rfB=document.createElement('button');rfB.textContent='RF';
    const dcB=document.createElement('button');dcB.textContent='DC';
    if(mode==='RF')rfB.classList.add('active');else dcB.classList.add('active');
    rfB.addEventListener('click',()=>{mode='RF';step7DCDecay=0;setupStep(6);});
    dcB.addEventListener('click',()=>{mode='DC';step7DCDecay=0;setupStep(6);});
    wrap.appendChild(rfB);wrap.appendChild(dcB);stepCtrlEl.appendChild(wrap);
    const note=document.createElement('span');note.className='mode-info';
    note.textContent=mode==='RF'?L().modeInfoRF:L().modeInfoDC;
    stepCtrlEl.appendChild(note);
  }else if(i===7){
    const btn=document.createElement('button');btn.className='reset-btn';btn.textContent=L().resetEtch;
    btn.addEventListener('click',()=>{etchDepths={};});stepCtrlEl.appendChild(btn);
  }
}

// ── Main loop ─────────────────────────────────────────────────
function render(){
  const now=performance.now(),dt=Math.min((now-lastT)/1000,.05);lastT=now;
  ctx.save();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle=B.bg;
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.restore();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(renderScale * DPR, renderScale * DPR);
  ctx.translate(renderOffX / renderScale, renderOffY / renderScale);
  RENDERS[currentStep](dt,(now-t0)/1000);
  requestAnimationFrame(render);
}
document.fonts.ready.then(()=>render()).catch(()=>render());

// ── Step buttons ──────────────────────────────────────────────
const sBEl=document.getElementById('stepButtons');
function buildBtns(){
  sBEl.innerHTML='';
  L().steps.forEach((s,i)=>{
    const b=document.createElement('button');b.className='step-btn'+(i===currentStep?' active':'');
    b.textContent=i===0?'S':i===L().steps.length-1?'K':i;b.title=s.title;
    b.addEventListener('click',()=>setStep(i));sBEl.appendChild(b);
  });
}
const prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn');
prevBtn.addEventListener('click',()=>setStep(currentStep-1));
nextBtn.addEventListener('click',()=>setStep(currentStep+1));

function fmtHint(raw){
  if(!raw)return'';const sp=raw.indexOf(' ');
  if(sp>0){const icon=raw.slice(0,sp),body=raw.slice(sp+1);if(/\p{Emoji}/u.test(icon))return`<div class="hint-icon">${icon}</div><div class="hint-text">${body}</div>`;}
  return`<div class="hint-text">${raw}</div>`;
}
const DEEP_DIVE_LABEL = { en:'Deep Dive', ko:'심화학습' };
function toggleDeepDive(idx){
  const hdr=document.getElementById('ddHdr'+idx), body=document.getElementById('ddBody'+idx);
  if(!hdr||!body)return;
  const open=body.classList.toggle('open');
  hdr.classList.toggle('open',open);
}
function setStep(i){
  if(i<0||i>=L().steps.length)return;currentStep=i;
  document.querySelectorAll('.step-btn.active').forEach(b=>b.classList.remove('active'));
  if(sBEl.children[i])sBEl.children[i].classList.add('active');
  document.getElementById('stepNum').textContent=i===0?'S':i===L().steps.length-1?'K':i;
  document.getElementById('stepTitle').textContent=L().steps[i].title;
  document.getElementById('stepBody').innerHTML=L().steps[i].body;
  const hEl=document.getElementById('stepHint');
  if(L().steps[i].hint){hEl.innerHTML=fmtHint(L().steps[i].hint);hEl.style.display='';}
  else hEl.style.display='none';
  const ddEl=document.getElementById('deepDiveContainer');
  let dds=L().steps[i].deepDive;
  if(dds && !Array.isArray(dds)) dds=[dds];
  if(dds && dds.length){
    ddEl.innerHTML=dds.map((dd,idx)=>`
      <div class="deep-wrap">
        <div class="deep-hdr" id="ddHdr${idx}" onclick="toggleDeepDive(${idx})">
          <span class="deep-icon">📚</span>
          <span class="deep-title">${dd.title}</span>
          <span class="deep-badge">${DEEP_DIVE_LABEL[lang]}</span>
          <span class="deep-chevron">▼</span>
        </div>
        <div class="deep-body" id="ddBody${idx}">
          <div class="deep-inner">${dd.body}</div>
        </div>
      </div>`).join('');
  } else {
    ddEl.innerHTML='';
  }
  prevBtn.disabled=(i===0);nextBtn.disabled=(i===L().steps.length-1);
  prevBtn.textContent=L().prevBtn;nextBtn.textContent=L().nextBtn;
  document.getElementById('sideInner').scrollTop=0;
  setupStep(i);
}

// ── Language ──────────────────────────────────────────────────
function setLang(l){
  lang=l;
  document.getElementById('btnEN').classList.toggle('active',l==='en');
  document.getElementById('btnKO').classList.toggle('active',l==='ko');
  document.getElementById('hTitle').textContent=L().hTitle;
  document.getElementById('hSub').textContent=L().hSub;
  buildBtns();setStep(currentStep);
}

// ── Tooltip ───────────────────────────────────────────────────
function ptIn(x,y,r){return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;}
canvas.addEventListener('mousemove',e=>{
  const cr=canvas.getBoundingClientRect();
  const mx=(e.clientX-cr.left), my=(e.clientY-cr.top);
  const cx=(mx-renderOffX)/renderScale, cy=(my-renderOffY)/renderScale;
  if(currentStep!==0){hoveredHotspot=null;tooltip.classList.remove('show');canvas.style.cursor='default';return;}
  let foundR=null;for(const h of HR){if(ptIn(cx,cy,h.rect)){foundR=h;break;}}
  hoveredHotspot=foundR;
  if(foundR){
    const hs=L().hotspots.find(h=>h.n===foundR.n);
    tooltip.classList.add('show');
    tooltip.innerHTML=`<b>${hs.title}</b><br>${hs.text.replace(/\n/g,'<br>')}`;
    const cardRect=canvas.parentElement.getBoundingClientRect();
    tooltip.style.left=(e.clientX-cardRect.left)+'px';
    tooltip.style.top=(e.clientY-cardRect.top-10)+'px';
    canvas.style.cursor='pointer';
  }else{tooltip.classList.remove('show');canvas.style.cursor='default';}
});
canvas.addEventListener('mouseleave',()=>{hoveredHotspot=null;tooltip.classList.remove('show');});

// ── Init ──────────────────────────────────────────────────────
buildBtns();
setStep(0);
</script>
</body>
