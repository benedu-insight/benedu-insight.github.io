<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DC Magnetron PVD v5 — Interactive Lesson · Benedu Insight</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/benedu-insight/benedu-insight.github.io/refs/heads/main/logo_png/benedu_insight_Symbol.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8FAFB; --card:#FFFFFF; --border:#E2E8F0; --line:#EEF2F6;
  --text:#1A202C; --ink2:#334155; --muted:#64748B; --label:#94A3B8;
  --green:#0F8C50; --green-lt:#E6F4ED; --green-dk:#0A6B3C;
  --purple:#7030A0; --purple-lt:#F0E8F8; --purple-mid:#9B59D0; --purple-dk:#521A78;
  --coral:#E8553B; --coral-lt:#FDEEEA; --coral-dk:#8A2E1C;
  --amber:#B7791F; --amber-lt:#FEF6E4; --amber-dk:#7A4E0B;
  --shadow:0 2px 12px rgba(15,23,42,.06);
  --hdr:56px; --side:440px;
  --sans:'Google Sans',system-ui,sans-serif;
  --mono:var(--sans);
  --serif:var(--sans);
  --code:'JetBrains Mono','Noto Sans KR',ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html[lang=ko]{--sans:'Google Sans','Noto Sans KR',system-ui,sans-serif}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit}

/* ── Header ── */
.hdr{position:fixed;top:0;left:0;right:0;height:var(--hdr);z-index:50;display:flex;align-items:center;gap:14px;
  padding:0 20px;background:var(--card);border-bottom:1px solid var(--border)}
.hdr-logo{height:32px;display:block}
.hdr-div{width:1px;height:26px;background:var(--border)}
.hdr-title{font-size:15px;font-weight:700;color:var(--purple);line-height:1.2;white-space:nowrap}
.hdr-sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--label);margin-top:2px;white-space:nowrap}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.lang-toggle{display:flex;background:var(--bg);border:1.5px solid var(--border);border-radius:20px;padding:3px;gap:2px}
.lang-btn{font-family:'Google Sans','Noto Sans KR',sans-serif;white-space:nowrap;font-size:12px;font-weight:600;padding:3px 12px;border-radius:16px;border:none;background:transparent;color:var(--muted);cursor:pointer;transition:all .18s}
.lang-btn.active{background:var(--purple);color:#fff}

/* ── App grid ── */
.app{position:fixed;top:var(--hdr);left:0;right:0;bottom:0;display:grid;grid-template-columns:minmax(0,1fr) var(--side)}
.stage{display:flex;flex-direction:column;gap:8px;padding:10px 10px 10px 12px;min-width:0;min-height:0}

/* recipe bar */
.recipe{display:flex;align-items:center;gap:4px;flex-wrap:nowrap;overflow:hidden;flex-shrink:0;padding:0 2px}
.recipe-k{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--label);margin-right:6px;white-space:nowrap}
.rp{font-size:11px;font-weight:600;color:var(--label);padding:4px 9px;border-radius:999px;border:1px solid var(--border);background:var(--card);white-space:nowrap;transition:all .2s}
.rp.on{background:var(--purple);border-color:var(--purple);color:#fff;box-shadow:0 2px 8px rgba(112,48,160,.25)}
.rp.done{color:var(--muted)}
.rp-sep{color:var(--border);font-size:10px}

/* canvas card */
.canvas-card{flex:1;min-height:0;position:relative;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.cv-wrap{flex:1;min-height:0;position:relative}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.sbar{display:flex;align-items:center;gap:6px;padding:6px 10px;border-top:1px solid var(--line);min-height:36px;flex-wrap:wrap;flex-shrink:0}
.rd{font-family:var(--sans);font-variant-numeric:tabular-nums;font-size:11px;color:var(--ink2);background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:2px 7px;white-space:nowrap}
.rd b{font-weight:500;color:var(--label);margin-right:4px}
.rd.on{border-color:#d9c6ec;background:var(--purple-lt);color:var(--purple-dk)}
.rd.slow{color:var(--muted);background:transparent;border-style:dashed}
.sbar-sp{flex:1}
.legend{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lg{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--ink2);white-space:nowrap}
.lg i{width:8px;height:8px;border-radius:50%;display:inline-block}
.lg i.ion{box-shadow:0 0 0 2px rgba(232,85,59,.25)}
.lg i.pw{border-radius:2px;background:#CBD5E1;border:1px solid #94A3B8}
.lbl-btn{font-size:11px;font-weight:600;border:1px solid var(--border);background:var(--card);color:var(--muted);border-radius:6px;padding:2px 8px;cursor:pointer}
.lbl-btn.on{background:var(--purple-lt);color:var(--purple);border-color:#d9c6ec}
.msg{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--green-lt);color:var(--green-dk);white-space:nowrap}
.msg.warn{background:var(--coral-lt);color:var(--coral-dk)}
.msg.info{background:var(--purple-lt);color:var(--purple-dk)}
.msg:empty{display:none}
sub,sup{font-size:.72em;line-height:0}

#tooltip{position:absolute;pointer-events:none;z-index:20;max-width:300px;background:rgba(17,24,39,.96);color:#fff;
  padding:10px 13px;border-radius:10px;font-size:12.5px;line-height:1.55;opacity:0;transition:opacity .12s;
  box-shadow:0 10px 30px rgba(0,0,0,.28);transform:translate(-50%,calc(-100% - 14px))}
#tooltip.show{opacity:1}
#tooltip b{display:block;color:#d8b9f3;margin-bottom:2px;font-size:12.5px}

/* takeaway overlay */
.stage-html{position:absolute;inset:0;overflow:auto;background:var(--card);display:none;padding:22px 24px 28px}
.stage-html.show{display:block}

/* instrument panel */
.inst{flex-shrink:0;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(250px,1fr);gap:8px;height:216px}
.inst.tall{height:286px}
.inst.one{grid-template-columns:1fr;height:auto}
.icard{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:9px 12px;min-width:0;min-height:0;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.ihead{display:flex;align-items:center;gap:8px;flex-shrink:0}
.ihead h3{font-size:12px;font-weight:600;color:var(--ink2)}
.badge{display:inline-flex;align-items:center;gap:5px;background:var(--green-lt);color:var(--green);font-size:9.5px;font-weight:600;letter-spacing:.08em;padding:2px 8px;border-radius:4px;flex-shrink:0}
.badge-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.chart{flex:1;min-height:0;width:100%;display:block}
.crow{flex:1;min-height:0;display:flex;gap:8px}
.crow .chart{flex:1;min-width:0;height:100%}
.ctls{display:flex;flex-direction:column;gap:6px;overflow:auto;min-height:0;padding-right:2px}
.ctls.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:14px;row-gap:8px;align-content:start}
.ctls.g2 .seg-row{grid-column:1/-1}
.ctl-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:2px;line-height:1.25}
.ctl-h label{font-size:11.5px;color:var(--muted);font-weight:500}
.ctl-h output{font-family:var(--mono);font-size:11.5px;color:var(--purple);font-weight:600;white-space:nowrap}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--green),var(--purple-mid));outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;border:2.5px solid var(--purple);box-shadow:0 1px 4px rgba(0,0,0,.18)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:2.5px solid var(--purple)}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:none;background:transparent;padding:4px 10px;font-size:11.5px;font-weight:600;color:var(--muted);border-radius:6px;cursor:pointer}
.seg button.on{background:var(--purple);color:#fff}
.seg-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg-row .k{font-size:11.5px;color:var(--muted);min-width:64px}
.btn{font-size:11.5px;font-weight:600;border:1px solid var(--border);background:var(--card);color:var(--ink2);border-radius:8px;padding:5px 12px;cursor:pointer;transition:all .15s}
.btn:hover{border-color:#d9c6ec;color:var(--purple);background:var(--purple-lt)}
.btn.pri{background:var(--purple);border-color:var(--purple);color:#fff}
.btn.pri:hover{background:var(--purple-dk)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.stats.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.stats.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 8px;min-width:0}
.stat-k{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-v{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--purple);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-v small{font-size:10px;color:var(--muted);font-weight:500}
.stat.pass{background:var(--green-lt);border-color:#cde9da}.stat.pass .stat-v{color:var(--green-dk)}
.stat.fail{background:var(--coral-lt);border-color:#f6d3ca}.stat.fail .stat-v{color:var(--coral-dk)}
.ticker{font-family:var(--sans);font-size:11.5px;line-height:1.7;color:var(--ink2);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 9px;min-height:68px}
.ticker div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticker div em{font-style:normal;color:var(--label)}
.phase-chips{display:flex;flex-wrap:wrap;gap:4px}
.pc{font-size:11px;font-weight:600;border:1px solid var(--border);background:var(--card);color:var(--muted);border-radius:999px;padding:3px 9px;cursor:pointer}
.pc.on{background:var(--purple);color:#fff;border-color:var(--purple)}
.pc.done{color:var(--green-dk);border-color:#cde9da;background:var(--green-lt)}
.note{font-size:10.5px;color:var(--label);line-height:1.45}

/* ── Side panel ── */
.side{background:var(--card);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.side-scroll{flex:1;overflow-y:auto;padding:18px 22px 16px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.chap{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--green);background:var(--green-lt);padding:2px 8px;border-radius:4px}
.scount{font-family:var(--mono);font-size:10px;color:var(--label);letter-spacing:.08em}
.s-title{font-size:20px;font-weight:700;line-height:1.28;color:var(--text);margin-bottom:8px;letter-spacing:-.005em}
.s-lead{font-family:var(--sans);font-size:14px;line-height:1.7;color:var(--muted);margin-bottom:10px}
.s-body{font-size:13px;line-height:1.72;color:#3b4456}
.s-body ul{padding-left:1.05rem;margin:4px 0}
.s-body li{margin-bottom:4px}
.s-body li::marker{color:var(--purple-mid)}
.s-body b{color:var(--text);font-weight:600}
code,.s-body code{font-family:var(--mono);font-size:11.5px;background:var(--purple-lt);color:var(--purple-dk);padding:1px 5px;border-radius:4px;white-space:nowrap}
.parts{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.part{font-size:11.5px;border:1px solid var(--border);background:var(--card);color:var(--ink2);border-radius:999px;padding:3px 10px;cursor:pointer;transition:all .14s}
.part:hover,.part.on{border-color:#d9c6ec;background:var(--purple-lt);color:var(--purple-dk)}
.co{display:flex;gap:10px;padding:10px 12px;border-radius:10px;margin-top:10px;font-size:12.5px;line-height:1.62}
.co svg{flex:none;width:18px;height:18px;margin-top:2px}
.co .tag{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;margin-bottom:2px;opacity:.85}
.co.try{background:var(--purple-lt);color:var(--purple-dk)}
.co.myth{background:var(--coral-lt);color:var(--coral-dk)}
.co.key{background:var(--green-lt);color:var(--green-dk)}
.co.warn{background:var(--amber-lt);color:var(--amber-dk)}
.dd{margin-top:10px;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--card)}
.dd summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:12.5px;font-weight:600;color:var(--text);user-select:none}
.dd summary::-webkit-details-marker{display:none}
.dd summary .db{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;background:var(--purple);color:#fff;padding:2px 6px;border-radius:4px;flex-shrink:0}
.dd summary .dt{flex:1}
.dd summary .chev{color:var(--label);font-size:10px;transition:transform .2s}
.dd[open] summary{background:var(--purple-lt);border-bottom:1px solid var(--border)}
.dd[open] summary .chev{transform:rotate(180deg)}
.dd-in{padding:12px 14px;font-size:12.5px;line-height:1.75;color:#3b4456;background:var(--bg)}
.dd-in p+p,.dd-in p+ul,.dd-in ul+p{margin-top:8px}
.dd-in ul{padding-left:1.05rem}
.dd-in b{color:var(--text)}
.eq{font-family:var(--code);font-size:11.5px;line-height:1.7;background:#1F2433;color:#FFD580;border-radius:8px;padding:9px 12px;margin:8px 0;white-space:pre;overflow-x:auto}
.dd-hl{border-left:3px solid var(--purple);background:var(--purple-lt);color:var(--purple-dk);border-radius:0 8px 8px 0;padding:8px 11px;margin-top:8px;font-size:12px;line-height:1.65}
.side-foot{flex-shrink:0;border-top:1px solid var(--border);padding:10px 18px 12px;background:var(--card)}
.prog{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:9px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--purple));transition:width .3s}
.pills{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:9px}
.pill{width:28px;height:26px;border-radius:7px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-family:var(--mono);font-size:11px;font-weight:600;cursor:pointer;transition:all .13s}
.pill:hover{border-color:#d9c6ec;color:var(--purple);background:var(--purple-lt)}
.pill.on{background:var(--purple);border-color:var(--purple);color:#fff}
.pill-gap{width:6px}
.nav{display:flex;gap:8px}
.nav button{flex:1;padding:9px;font-size:13px;font-weight:700;border:none;border-radius:9px;background:var(--text);color:#fff;cursor:pointer;transition:background .15s}
.nav button:hover:not(:disabled){background:var(--purple)}
.nav button:disabled{background:var(--line);color:var(--label);cursor:not-allowed}
.kbd{font-family:var(--mono);font-size:9.5px;color:var(--label);text-align:center;margin-top:6px;letter-spacing:.06em}

/* takeaway */
.tk-hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:16px}
.tk-hero h2{font-size:24px;font-weight:700;letter-spacing:-.01em}
.tk-hero p{font-family:var(--serif);font-size:14px;color:var(--muted);margin-top:4px}
.tk-btns{display:flex;gap:8px;flex-wrap:wrap}
.tk-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.tk-sec{border:1px solid var(--border);border-radius:12px;padding:14px 16px;background:var(--card)}
.tk-sec h4{font-size:11px;font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--green);margin-bottom:10px}
.pr-list{display:grid;gap:8px}
.pr{display:flex;gap:10px;align-items:flex-start}
.pr .n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--purple);color:#fff;font-family:var(--mono);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
.pr b{display:block;font-size:13px}
.pr span{font-size:12px;color:var(--muted);line-height:1.5}
.tk-table{width:100%;border-collapse:collapse;font-size:12px}
.tk-table th{background:var(--purple);color:#fff;font-weight:600;padding:6px 8px;text-align:left}
.tk-table th:first-child{border-radius:6px 0 0 0}.tk-table th:last-child{border-radius:0 6px 0 0}
.tk-table td{padding:6px 8px;border-bottom:1px solid var(--line)}
.tk-table td:nth-child(2){color:var(--purple-dk);font-family:var(--mono);font-size:11.5px}
.tk-table td:nth-child(3){color:var(--muted);font-family:var(--mono);font-size:11.5px}
.tk-table tr:nth-child(even) td{background:#FBF8FD}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.kv span:last-child{font-family:var(--mono);color:var(--text);font-weight:600;font-size:12px;text-align:right}
.myths{display:grid;gap:7px}
.myth-row{display:grid;grid-template-columns:1fr 18px 1.3fr;gap:6px;align-items:start;font-size:12px;line-height:1.5}
.myth-row .x{color:var(--coral-dk);text-decoration:line-through;text-decoration-color:rgba(232,85,59,.5)}
.myth-row .a{color:var(--label);text-align:center}
.myth-row .o{color:var(--green-dk)}
.lim-row{display:grid;grid-template-columns:1fr 18px 1fr;gap:6px;font-size:12px;padding:5px 0;border-bottom:1px dashed var(--line)}
.lim-row .a{color:var(--label);text-align:center}
.lim-row span:last-child{color:var(--purple-dk);font-weight:600}
.tk-note{font-size:11px;color:var(--label);margin-top:8px}

/* popup */
.pop{display:none;position:fixed;inset:0;z-index:300;background:rgba(15,18,30,.78);align-items:center;justify-content:center;padding:28px}
.pop.show{display:flex}
.pop-box{position:relative;background:#fff;border-radius:14px;padding:14px;max-width:min(94vw,1100px);max-height:92vh;display:flex;flex-direction:column;gap:8px;box-shadow:0 24px 70px rgba(0,0,0,.45)}
.pop-box img{max-width:100%;max-height:calc(92vh - 80px);object-fit:contain;border-radius:8px;display:block}
.pop-cap{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.5}
.pop-x{position:absolute;top:-13px;right:-13px;width:32px;height:32px;border-radius:50%;border:none;background:var(--text);color:#fff;font-size:15px;cursor:pointer}
.pop-x:hover{background:var(--purple)}

/* responsive */
@media (max-width:1200px){:root{--side:380px}.inst{grid-template-columns:minmax(0,1.2fr) minmax(230px,1fr)}}
@media (max-width:940px){
  html,body{overflow:auto;height:auto}
  .hdr{position:sticky}
  .hdr-sub{display:none}
  .hdr{padding:0 12px;gap:10px}
  .hdr-div{display:none}
  .hdr-logo{height:26px}
  .hdr-title{white-space:normal;font-size:12.5px}
  .lang-btn{padding:3px 9px}
  .app{position:static;display:block}
  .stage{padding:10px 16px}
  .canvas-card{flex:none;height:min(78vw,560px);min-height:300px}
  .inst,.inst.tall{grid-template-columns:1fr;height:auto}
  .inst .icard{min-height:200px}
  .inst .chart{flex:none;height:190px}
  .inst .crow{flex:none;height:190px}
  .inst .crow .chart{height:100%;flex:1 1 0;width:auto;min-width:0}
  .side{border-left:none;border-top:1px solid var(--border)}
  .side-scroll{overflow:visible;padding:16px}
  .side-foot{position:sticky;bottom:0}
  .tk-grid{grid-template-columns:1fr}
  .recipe{overflow-x:auto}
}

    bp:['Backing plate + cooling','Copper plate with water channels. Most of the discharge power ends up as heat in the target.'],
    dss:['Dark-space shield (grounded)','Sits closer to the target edge than the sheath thickness, so no plasma can form there — keeps the sides of the target from sputtering.'],
    liner:['Shields / liners','Replaceable shields catch the metal that misses the wafer; they are cleaned or swapped at maintenance.'],

    ar:['Ar','Inert sputtering gas, 40 amu, ionization 15.8 eV. A projectile carrier — not a reactant.'],
    n2:['N₂ (reactive option)','Added for reactive sputtering, e.g. TiN barriers from a Ti target (Step 9).'],

    dc:['DC power supply','Applies negative DC directly to the conductive target — no matching network. Power-controlled, with fast arc detection; pulsed-DC for reactive work.'],

  },
  sp:{Ar:'Ar',Arp:'Ar⁺',e:'e⁻',Al:'Al atom',H2O:'H₂O',N2:'N₂',Ti:'Ti atom',fast:'fast neutral',powder:'flake'},

    s8:{chart:'Reactive sputtering hysteresis (Ti + N₂)',n2:'N₂ flow',sup:'Supply',dc:'DC',pdc:'Pulsed-DC',rf:'RF',mode:'Target mode',met:'metallic',pois:'poisoned',rate:'Dep. rate',arc:'Arcs / min',film:'Film',stoich:'TiN (gold)',tirich:'Ti-rich (grey)',up:'flow up',dn:'flow down',msgArc:'Insulating TiN patches charge up under DC → arcing',msgOk:'Stable sputtering',ti:'Ti target'},
    s9:{chart:'Target life',kwh:'Target life',pm:'Perform PM',groove:'Max groove depth',u:'Uniformity 1<span class="nc">σ</span>',flake:'Shield flake risk',dep:'Shield deposit',eol:'end of life',low:'low',med:'medium',high:'high',msgEol:'Target near end of life — schedule PM',msgOk:'Within target life',msgPM:'New target + shield kit — burn-in before production'},
  },
  steps:[
  { ch:0, title:'Inside a DC Magnetron PVD Chamber',
    lead:'Sputter deposition works the other way round from PE-CVD: the film material is a <b>solid target</b> at the top, and the plasma\'s job is to knock atoms out of it. A <b>magnet pack behind the target</b> is what makes that possible at a few mTorr.',
    body:`<ul>
<li><b>Al target</b> (cathode) on a water-cooled backing plate, driven to −300 … −700 V DC</li>
<li><b>Magnet pack</b> behind it: center and outer poles → arched field → closed <b>racetrack</b> (top view, upper left)</li>
<li><b>Dark-space shield + liners</b> — grounded anode, and they catch the Al that misses the wafer</li>
<li><b>Heated pedestal</b> — wafer temperature sets grain size and lets hot Al flow into vias</li>
<li><b>Cryo pump</b> to < 10⁻⁸ Torr base, then 2–5 mTorr Ar during deposition</li></ul>`,
    co:[['try','Hover over the drawing — or tap a part below — to see what it does.'],
        ['key','Short-throw magnetron: target–wafer ≈ 5 cm. Mean free paths, collisions and step coverage in this lesson are all measured against that gap.']],
    dd:[{t:'The target is metal — how does the magnetic field get through?', b:`<p>A metal blocks a magnetic field only if it is <b>ferromagnetic</b> (Fe, Ni, Co — μr ≫ 1 shunts the flux) or if the field is <b>time-varying</b> (eddy currents, skin effect). A permanent-magnet field is static, and Al and Cu are non-magnetic (μr ≈ 1.00002), so the field passes through the target essentially unchanged.</p>
<div class="eq">Static B through Al / Cu (μr ≈ 1) : passes unchanged
Static B through Ni / Co / Fe       : shunted → weak field in front
13.56 MHz field into Al             : skin depth ≈ 22 µm → blocked</div>
<div class="dd-hl">What limits the magnet is distance: the field falls off quickly from the poles, so target thickness is part of the magnetron design. Ferromagnetic targets need thin plates or stronger magnets — and an RF coil (ICP) must couple through a dielectric window, never through metal.</div>`}] },

  { ch:0, title:'Pump-Down & Base Pressure — Purity Starts Here',
    lead:'There is no precursor chemistry to clean up a PVD film — whatever residual gas hits the wafer during deposition ends up inside it. That is why metal PVD chambers pump to <b>ultra-high vacuum</b> before any Ar flows.',
    body:`<ul>
<li>Cryo pump → base pressure 10⁻⁹–10⁻⁸ Torr; wafers are degassed and Ar-precleaned in other chambers first</li>
<li>Residual H₂O / O₂ striking the surface: Γ = p / √(2πmkT) — compare it with the Al arrival rate</li>
<li>Impurity fraction ≈ (sticking × Γ<sub>gas</sub>) / Γ<sub>Al</sub> — oxygen raises resistivity and roughness</li>
<li>Then Ar flows at 2–5 mTorr; ultra-pure Ar does not react with Al</li></ul>`,
    co:[['try','Raise the base pressure from 10⁻⁸ to 10⁻⁶ Torr and lower the deposition rate: watch oxygen content and resistivity climb.'],
        ['key','At 10⁻⁶ Torr a full monolayer of gas arrives every second — comparable to the Al deposition rate. At 10⁻⁹ Torr it takes about 15 minutes.']],
    dd:[{t:'Why argon — and not a reactive gas?', b:`<p>In PE-CVD the gas <i>is</i> the film precursor. In sputtering the precursor is the solid target; the gas only provides projectiles. Argon is ideal: heavy enough (40 amu) for efficient momentum transfer, easy to ionize (15.8 eV), chemically inert and cheap.</p>
<p>Adding N₂ or O₂ on purpose gives <b>reactive sputtering</b> (TiN, TaN, AlN, Al₂O₃) — a different operating regime with its own instabilities (Step 9).</p>`}] },

  { ch:1, title:'Ignition & the Cathode Sheath',
    lead:'The DC supply holds the target hundreds of volts negative. Almost all of that voltage drops across a thin <b>cathode sheath</b>: Ar⁺ fall through it into the target, and secondary electrons are fired back out.',
    body:`<ul>
<li>The plasma sits a few volts above ground; the wafer floats ~10–20 V below the plasma</li>
<li>Ar⁺ hit the target with E ≈ e·(|V<sub>target</sub>| + V<sub>p</sub>) — hundreds of eV</li>
<li>Each impact releases a <b>secondary electron</b> with probability γ ≈ 0.1 (Ar⁺ on Al), accelerated away with the full sheath energy</li>
<li>No blocking capacitor: a metal target is simply wired to the supply</li></ul>`,
    co:[['try','Change the target voltage: ion energy, sputter yield and the potential profile follow.'],
        ['myth','“The target needs RF self-bias like an etch electrode.” A conductive target is biased directly by DC; RF self-bias is only needed for insulating targets (Step 9).']],
    dd:[{t:'Two ways to make the target negative', b:`<div class="eq">① DC (metal target: Al, Ti, Ta, Cu, W …)
   supply sets V_target directly (−300 … −700 V)
   cathode sheath ≈ |V_target|   →   E_ion ≈ e·|V_target|
② RF (insulating target: Al₂O₃, SiO₂, HfO₂ …)
   target acts as its own blocking capacitor
   small target vs. large grounded area → negative self-bias</div>
<p>Route ② is the etch-chamber mechanism with the asymmetry reversed. Route ① needs no self-bias at all. Either way, the target sheath is far larger than the wafer sheath: the target is bombarded with hundreds of eV, the growing film with only ~10–20 eV.</p>`}] },

  { ch:1, title:'Magnetron — Trapping Electrons with E × B',
    lead:'Secondary electrons carry the discharge, but in a plain diode they cross the gap and are lost before they ionize enough. The magnet bends their path into a <b>closed racetrack</b>, stretching it from centimetres to metres.',
    body:`<ul>
<li><b>Magnet off (diode)</b>: at a few mTorr, λ<sub>iz</sub> ≈ 107 / p[mTorr] cm ≫ 5 cm gap → too few ionizations; works only at ≳ 20 mTorr and kV</li>
<li><b>Magnet on</b>: where B is parallel to the target, B ⊥ E → electrons drift along E × B, sideways around the racetrack</li>
<li>Dense plasma ring (10¹¹–10¹² cm⁻³) at 1–10 mTorr and only −300 … −700 V</li>
<li>Ions are <b>not</b> trapped (Larmor radius of cm): they fall straight into the target beneath the ring</li></ul>`,
    co:[['try','Switch the magnet off and lower the pressure: the diode dies below ~20 mTorr. Switch it on: the magnetron runs down to ~1 mTorr.'],
        ['myth','“The magnet steers the ions onto the target.” It traps only electrons (r<sub>L</sub> ≈ 1 mm); Ar⁺ are effectively unmagnetized. The erosion groove is a map of where the electrons were trapped.']],
    dd:[{t:'Why a diode fails at mTorr — the numbers', b:`<div class="eq">Sustaining condition   γ · M ≥ 1      γ ≈ 0.1 → M ≈ 10 ion pairs per γ-electron
λ_iz = 1/(n·σ_iz) ≈ 107 / p[mTorr] cm
  3 mTorr → 36 cm  (gap 5 cm → ~0.1 ionization per pass)
  30 mTorr → 3.6 cm</div>
<p>The energy budget is not the problem (400 eV / ~30 eV per pair ≈ 13 pairs) — the path length is. The magnetron does not give the electron more energy, it gives it a longer path.</p>`},
        {t:'Why B must be parallel to the target', b:`<div class="eq">F = q (E + v × B)      E ⊥ B  →  v_drift = E × B / B²
Larmor radius r_L = m·v⊥ / (|q|·B),   B ≈ 300 G
  e⁻ (100 eV)  → ≈ 1 mm   trapped
  Ar⁺ (1 eV)   → ≈ 3 cm   unmagnetized</div>
<p>Above the racetrack the arched field runs parallel to the surface, so electrons drift sideways along it. Because the poles form a closed shape, the drift path closes on itself. Where B is perpendicular to the target, E × B = 0 and electrons would escape along B — the field there acts only as a magnetic mirror.</p>`}] },

  { ch:1, title:'Sputtering & Racetrack Erosion',
    lead:'Ar⁺ from the dense ring strike the target right beneath it and eject Al atoms by <b>momentum transfer</b> — a collision cascade, no chemistry. The target erodes in a groove that maps the trapped electrons.',
    body:`<ul>
<li>Yield Y ≈ 1 Al atom per Ar⁺ at 500 eV (threshold ~15 eV, rising slowly)</li>
<li>Sputtered atoms leave with a roughly <b>cosine</b> angular distribution and a few eV (Thompson distribution)</li>
<li>Static magnet: narrow groove, ~20–30 % target utilization</li>
<li>Rotating off-center magnet: erosion spreads across the face → better utilization and uniformity</li></ul>`,
    co:[['try','Move the target voltage along the yield curve, then compare static and rotating erosion.'],
        ['key','Sputtering and PE-CVD densification are the same physics (q·V<sub>sheath</sub>) at different energies: tens of eV densify a film, hundreds of eV remove material.']],
    dd:[{t:'Target utilization and end of life', b:`<p>Target life ends when the <b>deepest</b> point of the groove approaches the backing plate — not when the average thickness runs out. That is why life is tracked in kWh and why magnet design sets cost per wafer.</p>
<p>As the groove deepens, the eroding surface moves closer to the magnets and the plasma ring sharpens; deposition rate and uniformity drift slowly over target life, and recipes compensate (Step 10).</p>`}] },

  { ch:2, title:'Transport to the Wafer — Line of Sight',
    lead:'Sputtered Al atoms are neutral: neither E nor B steers them. They fly straight until they hit an Ar atom — and at magnetron pressures that happens only a couple of times across the gap.',
    body:`<ul>
<li>Mean free path of sputtered Al in Ar: λ ≈ 6 / p[mTorr] cm</li>
<li>Short throw (5 cm) at 3 mTorr: ~2–3 collisions → forward-directed but broadened</li>
<li>Long throw (20–30 cm) below 1 mTorr: nearly ballistic and directional — but lower rate</li>
<li>High pressure (tens of mTorr): atoms thermalize and diffuse → low rate, poor directionality</li></ul>`,
    co:[['try','Change pressure and throw distance: watch collisions, the collision-free fraction and the arrival energy.'],
        ['key','Contrast PE-CVD: radicals are created everywhere and diffuse; sputtered atoms leave a surface and fly. That is why PVD coverage is directional.']],
    dd:[{t:'Long throw, collimators and ionized PVD', b:`<p>To get more metal to the bottom of deep features, the arrival angles must narrow. <b>Long-throw</b> sputtering lowers the pressure and moves the wafer far away, so only near-normal atoms arrive. <b>Collimators</b> (a honeycomb plate) filter out oblique atoms, at the cost of rate and collimator build-up.</p>
<p><b>Ionized PVD</b> goes further: a second high-density plasma ionizes the sputtered metal itself, and an RF bias on the wafer pulls the metal ions in vertically — the basis of modern barrier and seed deposition.</p>`}] },

  { ch:2, title:'Step Coverage & Hot-Al Reflow',
    lead:'Line-of-sight deposition shades the inside of narrow features: metal piles up at the opening (<b>overhang</b>) and the bottom corners stay thin. At high temperature Al atoms diffuse along the surface and can <b>flow into</b> the feature.',
    body:`<ul>
<li>The flux reaching a trench bottom is limited by the solid angle it can “see”</li>
<li>Overhang grows and can pinch off the opening → a <b>void</b></li>
<li>Broader arrival angles coat the sidewalls more, but the opening closes sooner</li>
<li>Hot Al (≈ 400–450 °C), or a cold seed followed by a hot fill, uses surface diffusion to fill vias</li></ul>`,
    co:[['try','At AR ≥ 1.5 with a wide spread, the opening pinches off. Narrow the spread (collimated / long-throw) and compare the bottom coverage — or raise the wafer temperature to 450 °C and watch the hot-Al reflow.'],
        ['warn','Teaching model: a 2D ballistic Monte Carlo with simple surface diffusion; dimensions are illustrative.']],
    dd:[{t:'Why copper replaced aluminium for fine lines', b:`<p>Hot-Al fill reaches its limits as vias shrink, and Al lines suffer electromigration at high current density. Copper (lower resistivity, much better electromigration life) took over via the damascene route: PVD deposits only a thin barrier (Ta/TaN) and Cu seed, and electroplating fills the features.</p>
<p>Aluminium remains for top metal layers and bond pads, where lines are wide — exactly where the sputtering covered here is still used.</p>`}] },

  { ch:2, title:'Film Properties — The Process Window',
    lead:'Power sets the rate; pressure and temperature set how atoms arrive and settle. Grain size, resistivity, stress and reflectivity all move together — find a recipe that meets every spec at once.',
    body:`<ul>
<li><b>Power</b> → deposition rate (≈ linear); faster deposition also means fewer impurities per Al atom</li>
<li><b>Pressure</b> → bombardment by energetic neutrals: low p = compressive (atomic peening), high p = tensile / porous</li>
<li><b>Temperature</b> → adatom mobility: bigger grains, lower resistivity — but hillocks and a hazy surface</li>
<li><b>Magnet rotation</b> → thickness uniformity</li></ul>`,
    co:[['try','Target: rate ≥ 400 nm/min · resistivity ≤ 3.0 µΩ·cm · stress −100 to +150 MPa · reflectivity ≥ 85 % · uniformity ≤ 3 %.'],
        ['warn','Teaching model: trends follow published Al-film behavior; the numbers are illustrative.']],
    dd:[{t:'The structure-zone model (Thornton)', b:`<p>Film microstructure is set mainly by the homologous temperature T/T<sub>m</sub> and the pressure. Al melts at 933 K, so room temperature is already T/T<sub>m</sub> ≈ 0.32 — Al films are mobile, which is why grains grow quickly with temperature.</p>
<div class="eq">zone 1  (low T, high p) : porous, tapered columns
zone T  (low T, low p)  : dense, fine fibrous
zone 2  (T/Tm ≈ 0.3–0.5): columnar grains
zone 3  (T/Tm > 0.5)    : large equiaxed grains, rough</div>
<p>On cooling, Al (α ≈ 23 ppm/K) shrinks more than Si (2.6 ppm/K), adding tensile stress; on heating, compressive stress pushes out <b>hillocks</b>.</p>`}] },

  { ch:2, title:'Power Supplies & Reactive Sputtering',
    lead:'For a clean metal target, DC is all you need. Add N₂ to sputter a compound — e.g. a TiN barrier from a Ti target — and the <b>target surface itself gets poisoned</b>: the process becomes hysteretic and prone to arcs.',
    body:`<ul>
<li>N₂ reacts with the growing film <i>and</i> with the target; the poisoned compound sputters 5–10× slower</li>
<li>Rising flow: metallic mode survives up to a critical flow, then jumps to poisoned; falling flow: returns at a lower flow — <b>hysteresis</b></li>
<li>Insulating patches (outside the racetrack first) charge up under DC → <b>arcs</b> and particles</li>
<li><b>Pulsed-DC</b> (tens–hundreds of kHz) discharges them each cycle; <b>RF</b> is used for fully insulating targets</li></ul>`,
    co:[['try','Ramp N₂ up and down. Then switch the supply from DC to pulsed-DC and watch the arc rate.'],
        ['key','Production TiN runs in or near the transition region with feedback control (target voltage or OES), to get a stoichiometric film at a usable rate.']],
    dd:[{t:'Where the hysteresis comes from', b:`<p>At low flow, metal deposited on the shields and wafer “getters” almost all the N₂, so its partial pressure stays low and the target stays metallic. Once the target poisons, the sputter rate drops, there is less fresh metal to getter N₂, and the N₂ pressure jumps — which keeps the target poisoned. To recover, the flow must fall well below the original threshold.</p>
<p>Higher pumping speed, a smaller target–getter area ratio, or fast feedback on the N₂ flow shrink or stabilize the loop.</p>`}] },

  { ch:2, title:'Target Life & Chamber Maintenance',
    lead:'A PVD chamber changes slowly as it runs: the racetrack groove deepens and metal builds up on the shields. Both are tracked in <b>kWh</b>, and both end in planned maintenance.',
    body:`<ul>
<li>Deeper groove → the eroding face moves closer to the magnets and the ring sharpens → uniformity drifts</li>
<li>Rate per kW stays roughly constant; recipes adjust time over target life</li>
<li>Shield deposits build up; thick, stressed films flake → particles</li>
<li>PM: new target + shield kit, then a <b>burn-in</b> to clean the target surface</li></ul>`,
    co:[['try','Run the target toward end of life and watch uniformity and flake risk; then perform the PM.']],
    dd:[{t:'Burn-in, shutters and pasting', b:`<p>After a PM, the new target is <b>burned in</b>: sputtered at stepwise increasing power onto a shutter disk (protecting the chuck) until oxide and handling contamination are removed and the rate is stable.</p>
<p>Between wafers, some processes deposit a short <b>pasting</b> layer (e.g. Ti) onto the shields to lock down loosely bound deposits before they flake.</p>`}] },

  { ch:3, title:'Key Takeaways', lead:'', body:'', co:[], dd:[] },
  ],
  tk:{
    h:'DC magnetron PVD on one page', p:'Plasma physics with no chemistry — and the misconceptions corrected along the way.',
    btn1:'Compare: PE-CVD lesson', btn2:'Compare: ICP metal etch',
    sPr:'Design principles', sTab:'PVD vs. PE-CVD vs. ICP etch', sWin:'Typical process window · Al sputtering, 300 mm', sMyth:'Misconceptions corrected', sLim:'Limitations → what solves them',
    pr:[['Magnetron E × B trap','γ-electrons circulate in the racetrack → dense plasma at 2–5 mTorr and −300 … −700 V.'],

  steps:[
  { ch:0, title:'DC Magnetron PVD Chamber 들여다보기',
    lead:'Sputter 증착은 PE-CVD와 반대로 작동합니다: 막의 재료가 위쪽의 <b>고체 Target</b>이고, Plasma의 역할은 거기서 원자를 떼어내는 것입니다. <b>Target 뒤의 Magnet Pack</b>이 이를 수 mTorr에서 가능하게 합니다.',
    body:`<ul>
<li><b>Al Target</b>(Cathode) — 수냉 Backing Plate 위, DC로 −300 … −700 V 인가</li>
<li>뒤쪽의 <b>Magnet Pack</b>: 중앙 극과 외곽 극 → 아치형 자기장 → 닫힌 <b>Racetrack</b> (좌상단 위에서 본 그림)</li>
<li><b>Dark-Space Shield + Liner</b> — 접지 Anode이자, 웨이퍼를 벗어난 Al을 받아냄</li>
<li><b>가열 Pedestal</b> — 웨이퍼 온도가 Grain 크기를 정하고 Hot Al이 Via로 흐르게 함</li>
<li><b>Cryo Pump</b>로 < 10⁻⁸ Torr Base, 증착 중에는 Ar 2–5 mTorr</li></ul>`,
    co:[['try','그림에 마우스를 올리거나, 아래 부품 버튼을 눌러 역할을 확인하세요.'],
        ['key','Short-Throw Magnetron: Target–웨이퍼 ≈ 5 cm. 이 강의의 평균 자유 행정, 충돌 수, Step Coverage는 모두 이 Gap을 기준으로 합니다.']],
    dd:[{t:'Target은 금속인데 자기장은 어떻게 통과할까?', b:`<p>금속이 자기장을 막는 경우는 두 가지뿐입니다: <b>강자성체</b>(Fe, Ni, Co — μr ≫ 1이 자속을 흡수)이거나, 자기장이 <b>시간에 따라 변할 때</b>(와전류, 표피 효과). 영구자석의 자기장은 정적이고 Al·Cu는 비자성(μr ≈ 1.00002)이므로, 자기장은 Target을 거의 그대로 통과합니다.</p>
<div class="eq">정적 B → Al / Cu (μr ≈ 1)   : 그대로 통과
정적 B → Ni / Co / Fe        : 내부로 흡수 → 앞쪽 자기장 약함
13.56 MHz 자기장 → Al        : 표피 깊이 ≈ 22 µm → 차단</div>
<div class="dd-hl">자석을 제한하는 것은 거리입니다: 자기장은 극에서 멀어질수록 빠르게 약해지므로 Target 두께도 Magnetron 설계의 일부입니다. 강자성 Target은 얇게 만들거나 강한 자석이 필요하고 — ICP 코일은 금속이 아닌 유전체 Window를 통해 결합해야 합니다.</div>`}] },

  { ch:0, title:'Pump-Down & Base 압력 — 순도는 여기서 시작',
    lead:'PVD 막에는 불순물을 정리해 줄 전구체 화학이 없습니다 — 증착 중 웨이퍼에 닿는 잔류 가스는 그대로 막 안에 들어갑니다. 그래서 금속 PVD Chamber는 Ar을 흘리기 전에 <b>초고진공</b>까지 배기합니다.',
    body:`<ul>
<li>Cryo Pump → Base 압력 10⁻⁹–10⁻⁸ Torr; 웨이퍼는 다른 Chamber에서 Degas와 Ar Preclean을 먼저 거침</li>
<li>표면에 부딪히는 잔류 H₂O / O₂: Γ = p / √(2πmkT) — Al 도달 속도와 비교</li>
<li>불순물 비율 ≈ (부착 확률 × Γ<sub>gas</sub>) / Γ<sub>Al</sub> — 산소는 비저항과 거칠기를 높임</li>
<li>이후 Ar을 2–5 mTorr로 흘림; 초고순도 Ar은 Al과 반응하지 않음</li></ul>`,
    co:[['try','Base 압력을 10⁻⁸에서 10⁻⁶ Torr로 올리고 증착 속도를 낮춰 보세요: 산소 함량과 비저항이 올라갑니다.'],
        ['key','10⁻⁶ Torr에서는 1초마다 가스 단원자층 하나가 도달합니다 — Al 증착 속도와 비슷한 수준. 10⁻⁹ Torr에서는 약 15분이 걸립니다.']],
    dd:[{t:'왜 아르곤이고, 왜 반응성 가스가 아닐까?', b:`<p>PE-CVD에서는 가스가 곧 막의 전구체입니다. Sputtering에서는 전구체가 고체 Target이고, 가스는 발사체만 제공합니다. 아르곤은 이상적입니다: 운동량 전달에 충분히 무겁고(40 amu), 이온화가 쉬우며(15.8 eV), 화학적으로 불활성이고 저렴합니다.</p>
<p>N₂나 O₂를 일부러 넣으면 <b>반응성 Sputtering</b>(TiN, TaN, AlN, Al₂O₃)이 됩니다 — 고유한 불안정성을 가진 다른 운전 영역입니다(Step 9).</p>`}] },

  { ch:1, title:'점화와 Cathode Sheath',
    lead:'DC 전원은 Target을 수백 V 음(−)으로 유지합니다. 그 전압 거의 전부가 얇은 <b>Cathode Sheath</b>에 걸립니다: Ar⁺는 이를 통과해 Target에 떨어지고, 2차 전자는 반대로 튀어나옵니다.',
    body:`<ul>
<li>Plasma는 접지보다 수 V 높고, 웨이퍼는 Plasma보다 ~10–20 V 낮게 Floating</li>
<li>Ar⁺는 E ≈ e·(|V<sub>target</sub>| + V<sub>p</sub>) — 수백 eV로 Target에 충돌</li>
<li>충돌마다 γ ≈ 0.1(Al 위의 Ar⁺)의 확률로 <b>2차 전자</b>가 나오고, Sheath 에너지 전부로 가속되어 튀어나감</li>
<li>Blocking Capacitor 불필요: 금속 Target은 전원에 그냥 연결됨</li></ul>`,
    co:[['try','Target 전압을 바꿔 보세요: 이온 에너지, Sputter Yield, 전위 분포가 함께 변합니다.'],
        ['myth','“Target도 식각 전극처럼 RF Self-Bias가 필요하다.” 도체 Target은 DC로 직접 Bias됩니다; RF Self-Bias는 절연체 Target에만 필요합니다(Step 9).']],
    dd:[{t:'Target을 음(−)으로 만드는 두 가지 방법', b:`<div class="eq">① DC (금속 Target: Al, Ti, Ta, Cu, W …)
   전원이 V_target을 직접 설정 (−300 … −700 V)
   Cathode Sheath ≈ |V_target|   →   E_ion ≈ e·|V_target|
② RF (절연체 Target: Al₂O₃, SiO₂, HfO₂ …)
   Target 자체가 Blocking Capacitor 역할
   작은 Target vs. 큰 접지 면적 → 음(−)의 Self-Bias</div>
<p>②는 식각 Chamber의 메커니즘을 비대칭만 뒤집은 것이고, ①은 Self-Bias가 전혀 필요 없습니다. 어느 쪽이든 Target Sheath가 웨이퍼 Sheath보다 훨씬 커서, Target은 수백 eV로, 성장 중인 막은 ~10–20 eV로만 충격을 받습니다.</p>`}] },

  { ch:1, title:'Magnetron — E × B로 전자 가두기',
    lead:'2차 전자가 방전을 이끌지만, 단순 Diode에서는 충분히 이온화하기 전에 Gap을 건너 사라집니다. 자석은 그 경로를 <b>닫힌 Racetrack</b>으로 휘어, cm에서 m 단위로 늘립니다.',
    body:`<ul>
<li><b>자석 Off (Diode)</b>: 수 mTorr에서 λ<sub>iz</sub> ≈ 107 / p[mTorr] cm ≫ Gap 5 cm → 이온화 부족; ≳ 20 mTorr, kV에서만 동작</li>
<li><b>자석 On</b>: B가 Target과 평행한 곳에서 B ⊥ E → 전자는 E × B 방향으로, Racetrack을 따라 옆으로 Drift</li>
<li>1–10 mTorr, −300 … −700 V만으로 고밀도 Plasma 고리(10¹¹–10¹² cm⁻³)</li>
<li>이온은 갇히지 <b>않음</b>(Larmor 반경 cm 단위): 고리 바로 아래 Target으로 곧장 떨어짐</li></ul>`,
    co:[['try','자석을 끄고 압력을 낮춰 보세요: Diode는 ~20 mTorr 아래에서 꺼집니다. 자석을 켜면 Magnetron은 ~1 mTorr까지 유지됩니다.'],
        ['myth','“자석이 이온을 Target 쪽으로 유도한다.” 자석은 전자만 가둡니다(r<sub>L</sub> ≈ 1 mm); Ar⁺는 사실상 자화되지 않습니다. 침식 홈은 전자가 갇혀 있던 위치의 지도입니다.']],
    dd:[{t:'Diode가 mTorr에서 실패하는 이유 — 숫자로', b:`<div class="eq">유지 조건   γ · M ≥ 1      γ ≈ 0.1 → γ 전자 하나당 이온쌍 ≈ 10
λ_iz = 1/(n·σ_iz) ≈ 107 / p[mTorr] cm
  3 mTorr → 36 cm  (Gap 5 cm → 1회 통과당 이온화 ~0.1)
  30 mTorr → 3.6 cm</div>
<p>에너지 예산은 문제가 아닙니다(400 eV / 이온쌍당 ~30 eV ≈ 13쌍) — 경로 길이가 문제입니다. Magnetron은 전자에 에너지를 더 주는 게 아니라 더 긴 경로를 줍니다.</p>`},
        {t:'B가 Target과 평행해야 하는 이유', b:`<div class="eq">F = q (E + v × B)      E ⊥ B  →  v_drift = E × B / B²
Larmor 반경 r_L = m·v⊥ / (|q|·B),   B ≈ 300 G
  e⁻ (100 eV)  → ≈ 1 mm   포획
  Ar⁺ (1 eV)   → ≈ 3 cm   비자화</div>
<p>Racetrack 위에서는 아치형 자기장이 표면과 평행하므로 전자가 표면을 따라 옆으로 Drift합니다. 극이 닫힌 모양이라 Drift 경로도 닫힙니다. B가 Target에 수직인 곳에서는 E × B = 0이 되어 전자가 B를 따라 빠져나가려 하며 — 그곳의 자기장은 자기 거울 역할만 합니다.</p>`}] },

  { ch:1, title:'Sputtering & Racetrack 침식',
    lead:'고밀도 고리에서 생긴 Ar⁺는 바로 아래 Target에 충돌해 <b>운동량 전달</b>로 Al 원자를 떼어냅니다 — 충돌 연쇄이며 화학은 없습니다. Target은 갇힌 전자의 위치를 따라 홈 모양으로 침식됩니다.',
    body:`<ul>
<li>Yield Y ≈ 500 eV에서 Ar⁺ 하나당 Al 원자 1개 (임계 ~15 eV, 완만히 증가)</li>
<li>Sputtering된 원자는 대략 <b>Cosine</b> 각도 분포와 수 eV로 방출 (Thompson 분포)</li>
<li>고정 자석: 좁은 홈, Target 이용률 ~20–30 %</li>
<li>중심에서 벗어난 회전 자석: 침식이 전면으로 퍼짐 → 이용률과 균일도 향상</li></ul>`,
    co:[['try','Yield 곡선 위에서 Target 전압을 움직이고, 고정·회전 자석의 침식을 비교해 보세요.'],
        ['key','Sputtering과 PE-CVD의 치밀화는 같은 물리(q·V<sub>sheath</sub>)의 다른 에너지 영역입니다: 수십 eV는 막을 치밀하게, 수백 eV는 재료를 제거합니다.']],
    dd:[{t:'Target 이용률과 수명 끝', b:`<p>Target 수명은 평균 두께가 아니라 홈의 <b>가장 깊은</b> 지점이 Backing Plate에 가까워질 때 끝납니다. 그래서 수명을 kWh로 관리하고, 자석 설계가 웨이퍼당 비용을 좌우합니다.</p>
<p>홈이 깊어지면 침식 면이 자석에 가까워지고 Plasma 고리가 날카로워져, 증착 속도와 균일도가 수명에 따라 서서히 변합니다. Recipe가 이를 보정합니다(Step 10).</p>`}] },

  { ch:2, title:'웨이퍼로의 수송 — Line of Sight',
    lead:'Sputtering된 Al 원자는 중성이라 E도 B도 방향을 바꾸지 못합니다. Ar 원자와 부딪힐 때까지 직선으로 날아가며 — Magnetron 압력에서는 Gap을 건너는 동안 겨우 몇 번 충돌합니다.',
    body:`<ul>
<li>Ar 속 Sputter Al의 평균 자유 행정: λ ≈ 6 / p[mTorr] cm</li>
<li>Short Throw(5 cm), 3 mTorr: ~2–3회 충돌 → 앞쪽 방향성 유지, 다소 퍼짐</li>
<li>Long Throw(20–30 cm), 1 mTorr 이하: 거의 탄도 비행, 방향성 큼 — 대신 속도 낮음</li>
<li>고압(수십 mTorr): 원자가 열화·확산 → 낮은 속도, 방향성 약함</li></ul>`,
    co:[['try','압력과 Throw 거리를 바꿔 충돌 수, 무충돌 비율, 도달 에너지를 확인하세요.'],
        ['key','PE-CVD와 대비: Radical은 모든 곳에서 생겨 확산하고, Sputter 원자는 표면에서 떠나 날아갑니다. 그래서 PVD의 Coverage는 방향성을 가집니다.']],
    dd:[{t:'Long Throw, Collimator, Ionized PVD', b:`<p>깊은 패턴 바닥에 금속을 더 보내려면 도달 각도가 좁아야 합니다. <b>Long Throw</b>는 압력을 낮추고 웨이퍼를 멀리 두어 거의 수직인 원자만 도달하게 합니다. <b>Collimator</b>(벌집 판)는 비스듬한 원자를 걸러내지만 속도가 떨어지고 Collimator에 증착이 쌓입니다.</p>
<p><b>Ionized PVD</b>는 더 나아가 두 번째 고밀도 Plasma로 Sputter 금속 자체를 이온화하고, 웨이퍼의 RF Bias로 금속 이온을 수직으로 끌어당깁니다 — 최신 Barrier·Seed 증착의 기반입니다.</p>`}] },

  { ch:2, title:'Step Coverage & Hot-Al Reflow',
    lead:'직선 증착은 좁은 패턴 안쪽을 가립니다: 입구에 금속이 쌓이고(<b>Overhang</b>) 바닥 모서리는 얇게 남습니다. 고온에서는 Al 원자가 표면을 따라 확산해 패턴 안으로 <b>흘러 들어갈</b> 수 있습니다.',
    body:`<ul>
<li>Trench 바닥에 닿는 Flux는 바닥이 “볼 수 있는” 입체각으로 제한됨</li>
<li>Overhang이 자라 입구가 막히면 → <b>Void</b></li>
<li>도달 각도가 넓으면 측벽은 더 덮이지만 입구가 더 빨리 막힘</li>
<li>Hot Al(≈ 400–450 °C), 또는 저온 Seed 후 고온 Fill이 표면 확산으로 Via를 채움</li></ul>`,
    co:[['try','종횡비 1.5 이상에서 도달 각도가 넓으면 입구가 막힙니다. 각도를 좁혀(Collimated / Long Throw) 바닥 Coverage를 비교하거나 — 웨이퍼 온도를 450 °C로 올려 Hot-Al Reflow를 관찰해 보세요.'],
        ['warn','교육용 모델: 단순 표면 확산을 넣은 2D 탄도 Monte Carlo이며, 치수는 예시입니다.']],
    dd:[{t:'왜 미세 배선은 구리로 바뀌었나', b:`<p>Via가 작아지면서 Hot-Al Fill은 한계에 닿았고, Al 배선은 높은 전류 밀도에서 Electromigration을 겪습니다. 구리(더 낮은 비저항, 훨씬 긴 Electromigration 수명)가 Damascene 방식으로 대체했습니다: PVD는 얇은 Barrier(Ta/TaN)와 Cu Seed만 증착하고, 도금이 패턴을 채웁니다.</p>
<p>알루미늄은 선폭이 넓은 최상위 금속층과 Bond Pad에 남아 있으며 — 바로 여기서 다룬 Sputtering이 여전히 쓰이는 곳입니다.</p>`}] },

  { ch:2, title:'막 특성 — 공정 Window',
    lead:'파워는 증착 속도를, 압력과 온도는 원자가 어떻게 도착해 자리 잡는지를 정합니다. Grain 크기, 비저항, 응력, 반사율이 함께 움직이므로 — 모든 Spec을 동시에 만족하는 Recipe를 찾아보세요.',
    body:`<ul>
<li><b>파워</b> → 증착 속도(거의 선형); 빠를수록 Al 원자당 불순물도 줄어듦</li>
<li><b>압력</b> → 고에너지 중성입자 충격: 저압 = 압축(Atomic Peening), 고압 = 인장 / 다공성</li>
<li><b>온도</b> → Adatom 이동도: 큰 Grain, 낮은 비저항 — 대신 Hillock과 뿌연 표면</li>
<li><b>자석 회전</b> → 두께 균일도</li></ul>`,
    co:[['try','목표: 증착 속도 ≥ 400 nm/min · 비저항 ≤ 3.0 µΩ·cm · 응력 −100 ~ +150 MPa · 반사율 ≥ 85 % · 균일도 ≤ 3 %.'],
        ['warn','교육용 모델: 경향은 발표된 Al 막 거동을 따르지만, 수치는 예시입니다.']],
    dd:[{t:'구조 영역 모델 (Thornton)', b:`<p>막의 미세구조는 주로 상동 온도 T/T<sub>m</sub>과 압력으로 정해집니다. Al은 933 K에서 녹으므로 상온도 이미 T/T<sub>m</sub> ≈ 0.32 — Al 막은 이동도가 커서 온도에 따라 Grain이 빠르게 자랍니다.</p>
<div class="eq">Zone 1 (저온, 고압)     : 다공성, 가늘어지는 기둥
Zone T (저온, 저압)     : 치밀한 미세 섬유
Zone 2 (T/Tm ≈ 0.3–0.5) : 기둥형 Grain
Zone 3 (T/Tm > 0.5)     : 큰 등축 Grain, 거친 표면</div>
<p>냉각 시 Al(α ≈ 23 ppm/K)은 Si(2.6 ppm/K)보다 더 수축해 인장 응력이 더해지고, 가열 시 압축 응력이 <b>Hillock</b>을 밀어 올립니다.</p>`}] },

  { ch:2, title:'전원 & 반응성 Sputtering',
    lead:'깨끗한 금속 Target이라면 DC면 충분합니다. 화합물을 증착하려고 N₂를 넣으면 — 예: Ti Target으로 TiN Barrier — <b>Target 표면 자체가 Poisoning</b>되어 공정이 히스테리시스를 보이고 Arc가 잘 생깁니다.',
    body:`<ul>
<li>N₂는 성장 막뿐 아니라 Target과도 반응; Poisoning된 화합물은 5–10배 느리게 Sputtering됨</li>
<li>유량 증가: 임계 유량까지 금속 모드 유지 후 Poisoned로 점프; 유량 감소: 더 낮은 유량에서 복귀 — <b>히스테리시스</b></li>
<li>절연성 패치(Racetrack 바깥부터)가 DC에서 Charging → <b>Arc</b>와 파티클</li>
<li><b>Pulsed-DC</b>(수십–수백 kHz)가 매 주기 방전시킴; 완전 절연 Target에는 <b>RF</b></li></ul>`,
    co:[['try','N₂를 올렸다 내려 보세요. 그다음 전원을 DC에서 Pulsed-DC로 바꿔 Arc 빈도를 보세요.'],
        ['key','양산 TiN은 피드백 제어(Target 전압 또는 OES)로 전이 영역 근처에서 운전해, 쓸 만한 속도로 화학량론적 막을 얻습니다.']],
    dd:[{t:'히스테리시스는 어디서 오는가', b:`<p>유량이 낮을 때는 Shield와 웨이퍼에 쌓이는 금속이 N₂를 거의 다 “Getter”해서 분압이 낮게 유지되고 Target은 금속 상태로 남습니다. Target이 Poisoning되면 Sputter 속도가 떨어지고 N₂를 잡을 새 금속이 줄어 N₂ 압력이 뛰어오르며 — 이것이 Target을 계속 Poisoned 상태로 유지합니다. 복귀하려면 유량을 원래 임계값보다 한참 낮춰야 합니다.</p>
<p>배기 속도를 높이거나, Target 대비 Getter 면적을 줄이거나, N₂ 유량을 빠르게 피드백 제어하면 루프가 줄거나 안정됩니다.</p>`}] },

  { ch:2, title:'Target 수명 & Chamber 정비',
    lead:'PVD Chamber는 운전하면서 서서히 변합니다: Racetrack 홈이 깊어지고 Shield에 금속이 쌓입니다. 둘 다 <b>kWh</b>로 관리하며, 둘 다 계획된 정비로 끝납니다.',
    body:`<ul>
<li>홈이 깊어짐 → 침식 면이 자석에 가까워지고 고리가 날카로워짐 → 균일도 Drift</li>
<li>kW당 증착 속도는 대략 일정; Recipe가 수명에 따라 시간을 보정</li>
<li>Shield 증착물이 쌓이고, 두껍고 응력이 큰 막은 벗겨져 → 파티클</li>
<li>PM: 새 Target + Shield Kit, 이후 <b>Burn-in</b>으로 Target 표면 세정</li></ul>`,
    co:[['try','Target을 수명 끝까지 사용해 균일도와 Flake 위험을 확인한 뒤, PM을 실시해 보세요.']],
    dd:[{t:'Burn-in, Shutter, Pasting', b:`<p>PM 후 새 Target은 <b>Burn-in</b>합니다: Chuck을 보호하는 Shutter Disk 위로 파워를 단계적으로 올리며 Sputtering해, 산화막과 취급 오염이 제거되고 속도가 안정될 때까지 진행합니다.</p>
<p>일부 공정은 웨이퍼 사이사이에 짧은 <b>Pasting</b>층(예: Ti)을 Shield에 증착해, 느슨한 증착물이 벗겨지기 전에 고정합니다.</p>`}] },

<script>
'use strict';
/* ============================== ENGINE ============================== */
const $=id=>document.getElementById(id);
const TAU=Math.PI*2, rnd=Math.random;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
let lang='en';
const L=()=>T[lang];
const IL=k=>T[lang].I[k];

/* ---------- canvas & logical frame (960×600, letterboxed) ---------- */
const cv=$('cv'), ctx=cv.getContext('2d'), wrap=$('cvWrap');
const LW=960, LH=600;
let DPR=1, RS=1, OX=0, OY=0;
function resize(){
  const w=wrap.clientWidth, h=wrap.clientHeight; if(!w||!h) return;
  DPR=window.devicePixelRatio||1;
  cv.width=Math.round(w*DPR); cv.height=Math.round(h*DPR);
  RS=Math.min(w/LW,h/LH); OX=(w-LW*RS)/2; OY=(h-LH*RS)/2;
}
new ResizeObserver(resize).observe(wrap); resize();
function beginFrame(){
  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(RS*DPR,0,0,RS*DPR,OX*DPR,OY*DPR);

const FONT='"Google Sans","Noto Sans KR",system-ui,sans-serif', MONO=FONT;   // Latin & digits: Google Sans; Hangul falls back to Noto Sans KR

function gnd(x,y){ctx.save();ctx.strokeStyle='#475569';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+6);ctx.moveTo(x-9,y+6);ctx.lineTo(x+9,y+6);ctx.moveTo(x-6,y+10);ctx.lineTo(x+6,y+10);ctx.moveTo(x-3,y+14);ctx.lineTo(x+3,y+14);ctx.stroke();ctx.restore();}
function chemText(f,x,y,sz,col,align){
  ctx.save();ctx.fillStyle=col;ctx.textBaseline='middle';ctx.textAlign='left';

function drawPlasma(st,I){

/* ---------- particles & effects ---------- */
function spawn(s,x,y,vx=0,vy=0){const p={s,x,y,vx,vy,age:0};parts.push(p);return p;}
function bulkPt(m=10){return{x:X0+m+rnd()*(X1-X0-2*m),y:YT+45+rnd()*(YB-YT-90)};}
function placeBulk(p){const q=bulkPt();p.x=q.x;p.y=q.y;p.vx=0;p.vy=0;p.age=0;}
function lang_(p,f,kick,drag){p.vx+=(rnd()-.5)*kick*f;p.vy+=(rnd()-.5)*kick*f;const d=Math.pow(drag,f);p.vx*=d;p.vy*=d;}
function boxR(p,x0,x1,y0,y1){if(p.x<x0){p.x=x0;p.vx=Math.abs(p.vx);}if(p.x>x1){p.x=x1;p.vx=-Math.abs(p.vx);}if(p.y<y0){p.y=y0;p.vy=Math.abs(p.vy);}if(p.y>y1){p.y=y1;p.vy=-Math.abs(p.vy);}}
function cap(p,m){const s=Math.hypot(p.vx,p.vy);if(s>m){p.vx*=m/s;p.vy*=m/s;}}
function moveE(p,st,f){
  lang_(p,f,2.4,.9);cap(p,5);p.x+=p.vx*f;p.y+=p.vy*f;
  if(p.x<X0+3){p.x=X0+3;p.vx=Math.abs(p.vx);}if(p.x>X1-3){p.x=X1-3;p.vx=-Math.abs(p.vx);}
  const yT=YT+st.sT, yB=YB-st.sB;
  if(p.y<yT){if(st.sT<7&&rnd()<.3)return'T';p.y=yT+1+rnd()*3;p.vy=Math.abs(p.vy);}
  if(p.y>yB){if(st.sB<7&&rnd()<.3)return'B';p.y=yB-1-rnd()*3;p.vy=-Math.abs(p.vy);}
  return null;
}
function moveIon(p,st,f){
  const yTm=YT+st.sTm, yBm=YB-st.sBm;
  if(p.y>yTm&&p.y<yBm){lang_(p,f,.12,.96);p.vy+=(p.y<(yTm+yBm)/2?-1:1)*.004*f;}
  else{const top=p.y<=yTm,V=top?st.Vt:st.Vb,s=Math.max(top?st.sTm:st.sBm,5);p.vy+=(top?-1:1)*.22*V/s*f;p.vx*=.98;}
  cap(p,10);p.x+=p.vx*f;p.y+=p.vy*f;
  if(p.x<X0+3){p.x=X0+3;p.vx=Math.abs(p.vx);}if(p.x>X1-3){p.x=X1-3;p.vx=-Math.abs(p.vx);}
  if(p.y<=YT+1)return'T'; if(p.y>=YB-1)return'B'; return null;
}
function moveRF(f,st,onE,onI){

    else if(c==='i'){const r=moveIon(p,st,f);if(r){onI&&onI(p,r);placeBulk(p);}}}
}

  if(on==='d')on=0;
  const key=lang+'|'+on;if(key===lastRec)return;lastRec=key;
  $('recipe').innerHTML=`<span class="recipe-k">${L().recipeK}</span>`+R.map((r,i)=>`${i?'<span class="rp-sep">›</span>':''}<span class="rp ${on==='all'?'done':i===on?'on':(on!=null&&i<on?'done':'')}">${r}</span>`).join('');}
function setMsg(s,cls){const k=s+'|'+cls;if(k===lastMsg)return;lastMsg=k;const m=$('msg');m.textContent=s||'';m.className='msg '+(cls||'');}
function setReadouts(){const r=SC[cur].rd?SC[cur].rd():null,R=L().rd;if(!r)return;
  let h=`<span class="rd"><b>${R.p}</b>${r.p}</span><span class="rd"><b>${R.T}</b>${r.T}</span>`;
  if(cur!==10)h+=`<span class="rd ${r.hf?'on':''}"><b>${R.hf}</b>${r.hf||R.off}</span>`;
  if(r.lf)h+=`<span class="rd on"><b>${R.lf}</b>${r.lf}</span>`;if(r.gas)h+=`<span class="rd"><b>${R.gas}</b>${r.gas}</span>`;if(r.slow)h+=`<span class="rd slow">${R.slow}</span>`;
  if(h!==lastRd){$('readouts').innerHTML=h;lastRd=h;}}
let lastLeg='';
function renderLegend(){const keys=SC[cur].legend||[],sp=L().sp;const k=lang+keys.join();if(k===lastLeg)return;lastLeg=k;
  $('legend').innerHTML=keys.map(s=>{const d=SP[s];const cls=d.cat==='i'?'ion':d.cat==='p'?'pw':'';return`<span class="lg"><i class="${cls}" style="${d.cat==='p'?'':'background:'+d.c}"></i>${sp[s]}</span>`;}).join('');
  $('lblBtn').style.display=keys.length&&!SC[cur].noLabels?'':'none';}
function renderInst(){const sc=SC[cur],el=$('inst'),h=sc.inst?sc.inst():'';el.innerHTML=h;el.className='inst'+(sc.cls&&sc.cls!=='none'?' '+sc.cls:'');el.style.display=h?'':'none';sc.bind&&sc.bind();}
function renderSide(){const s=L().steps[cur],n=L().steps.length;
  $('chap').textContent=L().chapters[s.ch];$('scount').textContent=`${String(cur+1).padStart(2,'0')} ${L().of} ${n}`;
  $('sTitle').innerHTML=s.title;const lead=cur===10?L().tk.p:s.lead;$('sLead').innerHTML=lead;
  let body=s.body;
  if(cur===0)body+=`<div class="parts">${Object.keys(L().parts).map(id=>`<button class="part ${pinPart===id?'on':''}" data-p="${id}">${L().parts[id][0]}</button>`).join('')}</div>`;
  if(cur===10)body=`<div class="parts">${L().steps.slice(0,10).map((t,i)=>`<button class="part" data-go="${i}">${String(i+1).padStart(2,'0')} · ${t.title}</button>`).join('')}</div>`;
  $('sBody').innerHTML=body;
  $('sCo').innerHTML=s.co.map(([k,t])=>`<div class="co ${k}">${ICON[k]}<div><span class="tag">${L().tags[k]}</span>${t}</div></div>`).join('');
  $('sDd').innerHTML=s.dd.map(d=>`<details class="dd"><summary><span class="db">${L().dd}</span><span class="dt">${d.t}</span><span class="chev">▼</span></summary><div class="dd-in">${d.b}</div></details>`).join('');
  $('sBody').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{pinPart=pinPart===b.dataset.p?null:b.dataset.p;$('sBody').querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('on',x.dataset.p===pinPart));tipPinned();});
  $('sBody').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));
  $('prog').style.width=((cur+1)/n*100)+'%';
  $('prevBtn').disabled=cur===0;$('nextBtn').disabled=cur===n-1;$('prevBtn').textContent=L().prev;$('nextBtn').textContent=L().next;$('kbd').textContent=L().kbd;
  $('pills').querySelectorAll('.pill').forEach(p=>p.classList.toggle('on',+p.dataset.i===cur));}
function renderPills(){let h='',prev=-1;L().steps.forEach((s,i)=>{if(prev!==-1&&s.ch!==prev)h+='<span class="pill-gap"></span>';prev=s.ch;h+=`<button class="pill" data-i="${i}" title="${s.title.replace(/"/g,'&quot;')}">${i+1}</button>`;});
  $('pills').innerHTML=h;$('pills').querySelectorAll('.pill').forEach(b=>b.onclick=()=>go(+b.dataset.i));}
function tipPinned(){if(cur!==0||!pinPart){showTip(null);return;}const p=partById(pinPart),[x,y,w]=p.r[0];showTip(pinPart,OX+(x+w/2)*RS,OY+y*RS);}
function enterScene(keepInst){fx=[];SC[cur].init();lastLeg='';renderLegend();if(!keepInst)renderInst();}
function go(i){const n=L().steps.length;if(i<0||i>=n)return;cur=i;hoverPart=null;if(i!==0)pinPart=null;showTip(null);setMsg('','');
  $('stageHtml').classList.toggle('show',i===10);if(i===10)renderTK();
  enterScene();renderSide();renderRecipe();setReadouts();$('sideScroll').scrollTop=0;}
function setLang(l){lang=l;document.documentElement.lang=l;$('btnEN').classList.toggle('active',l==='en');$('btnKO').classList.toggle('active',l==='ko');
  $('hTitle').textContent=L().title;$('hSub').textContent=L().sub;$('lblBtn').textContent=L().labels;lastRec=lastRd=lastLeg=lastMsg='';
  renderPills();renderSide();renderInst();renderRecipe();renderLegend();setReadouts();if(cur===10)renderTK();if(cur===0)tipPinned();}

$('btnEN').onclick=()=>setLang('en');$('btnKO').onclick=()=>setLang('ko');
$('prevBtn').onclick=()=>go(cur-1);$('nextBtn').onclick=()=>go(cur+1);
$('lblBtn').onclick=()=>{S.labels=!S.labels;$('lblBtn').classList.toggle('on',S.labels);};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePop();return;}const t=e.target.tagName;if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT')return;
  if(e.key==='ArrowRight'){go(cur+1);e.preventDefault();}if(e.key==='ArrowLeft'){go(cur-1);e.preventDefault();}});
cv.addEventListener('mousemove',e=>{if(cur!==0){cv.style.cursor='default';return;}const r=cv.getBoundingClientRect(),sx=e.clientX-r.left,sy=e.clientY-r.top,x=(sx-OX)/RS,y=(sy-OY)/RS;
  hoverPart=partAt(x,y);cv.style.cursor=hoverPart?'pointer':'default';if(hoverPart)showTip(hoverPart,sx,sy);else tipPinned();});
cv.addEventListener('mouseleave',()=>{hoverPart=null;tipPinned();});
cv.addEventListener('click',e=>{if(cur!==0)return;const r=cv.getBoundingClientRect(),x=(e.clientX-r.left-OX)/RS,y=(e.clientY-r.top-OY)/RS,id=partAt(x,y);
  pinPart=id&&id!==pinPart?id:null;$('sBody').querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('on',b.dataset.p===pinPart));});

/* ---------- main loop ---------- */
let last=performance.now(),rdT=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;frameN++;
  if(!(SC[cur].pausable&&S.paused))phase+=dt*TAU*FA;
  const sc=SC[cur];
  if(cur!==10){beginFrame();if(sc.update&&!(SC[cur].pausable&&S.paused))sc.update(dt);if(!(SC[cur].pausable&&S.paused))stepFx(dt);sc.draw();}
  if(sc.chart)sc.chart(dt);
  rdT+=dt;if(rdT>.15){rdT=0;setReadouts();if(cur===9){renderRecipe();renderLegend();}if(cur===1)renderLegend();}
  requestAnimationFrame(loop);}
setLang('en');go(0);
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>requestAnimationFrame(loop));
</script>
</body>
</html>
