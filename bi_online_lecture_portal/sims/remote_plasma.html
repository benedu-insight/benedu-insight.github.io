<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remote Plasma Source — Interactive Lesson · Benedu Insight</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/benedu-insight/benedu-insight.github.io/refs/heads/main/logo_png/benedu_insight_Symbol.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:          #F7F8FA;
    --panel:       #FFFFFF;
    --ink:         #2D2D2D;
    --muted:       #6B7280;
    --muted2:      #9CA3AF;
    --purple:      #7030A0;
    --purple-soft: #F0E6F6;
    --purple-mid:  #d9b8ed;
    --purple-dark: #521a78;
    --green:       #0F8C50;
    --border:      #E5E7EB;
    --shadow:      0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.06);
    --hdr:         52px;
    --side:        450px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; overflow: hidden; }
  body {
    height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: 'Google Sans','Noto Sans KR','Segoe UI',system-ui,sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header ── */
  .hdr {
    position: fixed; top: 0; left: 0; right: 0; z-index: 200;
    height: var(--hdr); background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 1rem; padding: 0 1.25rem;
    box-shadow: 0 1px 6px rgba(0,0,0,0.07);
  }
  .hdr-logo   { height: 32px; width: auto; flex-shrink: 0; }
  .hdr-div    { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; }
  .hdr-title  { font-size: 0.95rem; font-weight: 700; color: var(--purple); line-height: 1.2; }
  .hdr-sub    {
    font-family: 'JetBrains Mono', monospace; font-size: 0.50rem;
    color: var(--muted2); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 2px;
  }
  .hdr-right  { margin-left: auto; display: flex; align-items: center; gap: 0.5rem; }

  .lang-toggle { display: flex; border: 1px solid var(--border); border-radius: 20px; overflow: hidden; }
  .lang-btn {
    padding: 3px 13px; border: none; background: transparent; cursor: pointer;
    font-family: 'JetBrains Mono', monospace; font-size: 0.60rem; font-weight: 500;
    color: var(--muted2); transition: all 0.16s;
  }
  .lang-btn.active { background: var(--purple); color: #fff; }

  /* ── Main area (below fixed header) ── */
  .main {
    position: fixed;
    top: var(--hdr); left: 0; right: 0; bottom: 0;
    display: grid;
    grid-template-columns: 1fr var(--side);
    gap: 0;
    overflow: hidden;
  }

  /* ── Canvas area ── */
  .canvas-wrap {
    position: relative;
    background: var(--bg);
    display: flex; flex-direction: column;
    padding: 10px 8px 6px 10px;
    overflow: hidden;
  }
  .canvas-card {
    flex: 1;
    background: var(--panel);
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  #cv {
    display: block;
    width: 100%;
    height: 100%;
    flex: 1;
    object-fit: contain;
  }
  /* Step controls below canvas card */
  .step-controls {
    flex-shrink: 0;
    min-height: 28px; height: 28px;
    display: flex; gap: 8px; align-items: center;
    margin-top: 6px; flex-wrap: nowrap; overflow: hidden;
  }
  .mode-toggle {
    display: inline-flex; background: var(--bg);
    border: 1px solid var(--border); border-radius: 20px; padding: 2px; gap: 2px;
  }
  .mode-toggle button {
    border: none; background: transparent; padding: 3px 12px;
    font-family: 'Google Sans', sans-serif; font-size: 0.70rem; font-weight: 600;
    cursor: pointer; color: var(--muted); border-radius: 14px; transition: all 0.14s;
  }
  .mode-toggle button.active { background: var(--purple); color: #fff; }
  .mode-info {
    font-family: 'JetBrains Mono', monospace; font-size: 0.60rem;
    background: var(--purple-soft); color: var(--purple-dark);
    padding: 3px 10px; border-radius: 20px; white-space: nowrap;
  }
  .reset-btn {
    font-family: 'Google Sans', sans-serif; font-size: 0.70rem; font-weight: 600;
    background: var(--panel); border: 1px solid var(--border); border-radius: 7px;
    padding: 4px 12px; cursor: pointer; color: var(--ink); transition: all 0.14s;
    white-space: nowrap;
  }
  .reset-btn:hover { border-color: var(--purple-mid); color: var(--purple); background: var(--purple-soft); }

  /* Tooltip */
  #tooltip {
    position: absolute; pointer-events: none;
    background: rgba(18,22,38,0.97); color: #fff;
    padding: 9px 13px; border-radius: 9px; font-size: 12.5px;
    line-height: 1.6; max-width: 270px;
    transform: translate(-50%,-100%); margin-top: -12px;
    opacity: 0; transition: opacity 0.11s; z-index: 50;
    box-shadow: 0 8px 24px rgba(0,0,0,0.32); border: 1px solid rgba(255,255,255,0.09);
  }
  #tooltip.show { opacity: 1; }
  #tooltip b { color: #c4a0f0; }

  /* ── Side Panel ── */
  .side {
    background: var(--panel);
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .side-inner {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 1rem 1.1rem 0.5rem;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }
  .side-inner::-webkit-scrollbar { width: 4px; }
  .side-inner::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .step-eyebrow {
    font-family: 'JetBrains Mono', monospace; font-size: 0.54rem;
    color: var(--muted2); text-transform: uppercase; letter-spacing: 0.14em; margin-bottom: 0.3rem;
  }
  .step-title { font-size: 1.08rem; font-weight: 700; color: var(--ink); margin-bottom: 0.6rem; line-height: 1.3; }
  .step-body  { font-size: 0.82rem; line-height: 1.76; color: #3a4055; }
  .step-body ul { padding-left: 1.1rem; margin: 0.35rem 0; }
  .step-body li { margin-bottom: 0.28rem; }
  .step-body b  { font-weight: 700; color: var(--ink); }
  .step-body code {
    background: var(--purple-soft); padding: 1px 6px; border-radius: 4px;
    font-family: 'JetBrains Mono', monospace; font-size: 0.70rem; color: var(--purple-dark);
  }
  .hint-box {
    margin-top: 0.7rem; display: flex; gap: 9px; align-items: flex-start;
    background: var(--bg); border: 1px solid var(--border); border-radius: 9px; padding: 9px 11px;
  }
  .hint-icon {
    flex: none; width: 28px; height: 28px; border-radius: 50%;
    background: var(--purple-soft); display: flex; align-items: center;
    justify-content: center; font-size: 13px;
  }
  .hint-text { font-size: 0.71rem; line-height: 1.58; color: #4a5070; flex: 1; align-self: center; }

  /* Deep Dive accordion */
  .deep-wrap {
    margin-top: 0.85rem; border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden; background: var(--panel);
  }
  .deep-hdr {
    display: flex; align-items: center; gap: 0.55rem; padding: 0.65rem 0.85rem;
    cursor: pointer; user-select: none; background: var(--panel); transition: background 0.15s;
  }
  .deep-hdr:hover { background: var(--bg); }
  .deep-hdr.open { background: var(--purple-soft); border-bottom: 1px solid var(--border); }
  .deep-icon  { font-size: 1rem; flex-shrink: 0; }
  .deep-title { font-size: 0.80rem; font-weight: 700; color: var(--ink); flex: 1; line-height: 1.3; }
  .deep-badge {
    background: var(--purple); color: #fff; font-family: 'JetBrains Mono', monospace;
    font-size: 0.50rem; font-weight: 700; padding: 2px 7px; border-radius: 4px; flex-shrink: 0;
    letter-spacing: 0.04em;
  }
  .deep-chevron { font-size: 0.62rem; color: var(--muted2); transition: transform 0.2s; flex-shrink: 0; }
  .deep-hdr.open .deep-chevron { transform: rotate(180deg); }
  .deep-body { max-height: 0; overflow: hidden; transition: max-height 0.35s ease; background: var(--bg); }
  .deep-body.open { max-height: 2000px; }
  .deep-inner { padding: 0.85rem 0.9rem; font-size: 0.76rem; line-height: 1.78; color: #4a5070; }
  .deep-inner p + p { margin-top: 0.6em; }
  .deep-inner b { color: var(--ink); }
  .deep-inner .deep-eq {
    background: var(--charcoal,#2D2D2D); border-radius: 6px; padding: 0.55rem 0.8rem;
    font-family: 'JetBrains Mono', monospace; font-size: 0.74rem; color: #FFD580;
    margin: 0.5rem 0; overflow-x: auto; letter-spacing: 0.03em; line-height: 1.6;
  }
  .deep-inner .deep-hl {
    background: var(--purple-soft); border-left: 3px solid var(--purple);
    border-radius: 0 7px 7px 0; padding: 0.5rem 0.8rem; margin: 0.5rem 0;
    font-size: 0.74rem; line-height: 1.7; color: var(--purple-dark);
  }
  .deep-inner ul { padding-left: 1.1rem; margin: 0.35rem 0; }
  .deep-inner li { margin-bottom: 0.3rem; }
  .deep-inner .deep-img-wrap { margin: 0.6rem 0; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); cursor: zoom-in; }
  .deep-inner .deep-img-wrap img { display: block; width: 100%; height: auto; transition: opacity 0.15s; }
  .deep-inner .deep-img-wrap:hover img { opacity: 0.88; }
  .deep-inner .deep-cap { font-size: 0.70rem; color: #8a93ad; text-align: center; margin-top: 0.35rem; line-height: 1.5; }
  .img-lightbox {
    position: fixed; inset: 0; background: rgba(20,22,34,0.82);
    display: none; align-items: center; justify-content: center;
    z-index: 1000; cursor: zoom-out; padding: 2.5rem;
  }
  .img-lightbox.open { display: flex; }
  .img-lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; box-shadow: 0 12px 48px rgba(0,0,0,0.45); }
  .img-lightbox .lightbox-close {
    position: absolute; top: 1.1rem; right: 1.4rem; width: 38px; height: 38px;
    border-radius: 50%; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25);
    color: #fff; font-size: 1.1rem; line-height: 1; display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .img-lightbox .lightbox-close:hover { background: rgba(255,255,255,0.22); }

  /* Side footer: step buttons + nav */
  .side-footer {
    flex-shrink: 0;
    padding: 0.65rem 1.1rem 0.8rem;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  .step-btns { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 0.6rem; }
  .step-btn {
    padding: 5px 10px; font-size: 0.70rem; font-weight: 600;
    border: 1px solid var(--border); background: var(--panel); border-radius: 6px;
    cursor: pointer; color: var(--muted); transition: all 0.13s;
    font-family: 'Google Sans', sans-serif; min-width: 30px; text-align: center;
  }
  .step-btn:hover { border-color: var(--purple-mid); color: var(--purple); background: var(--purple-soft); }
  .step-btn.active { background: var(--purple); color: #fff; border-color: var(--purple); }

  .nav-row { display: flex; gap: 7px; }
  .nav-btn {
    flex: 1; padding: 9px; font-size: 0.78rem; font-weight: 700;
    border: none; background: var(--ink); color: #fff; border-radius: 8px;
    cursor: pointer; font-family: 'Google Sans', sans-serif; transition: background 0.14s;
  }
  .nav-btn:hover:not(:disabled) { background: var(--purple); }
  .nav-btn:disabled { background: var(--border); color: var(--muted2); cursor: not-allowed; }

  /* Footer bar */
  .foot {
    display: none; /* hidden — space too tight in full-screen mode */
  }
</style>
</head>
<body>

<!-- Fixed Header -->
<header class="hdr">
  <a href="https://benedu-insight.github.io/" target="_blank" rel="noopener noreferrer"
     style="display:inline-flex;align-items:center;text-decoration:none;">
    <img class="hdr-logo"
      src="https://benedu-insight.github.io/logo_png/benedu_insight_logo_EN_horizontal.png"
      alt="Benedu Insight">
  </a>
  <div class="hdr-div"></div>
  <div>
    <div class="hdr-title" id="hTitle">Remote Plasma Source — Interactive Lesson</div>
    <div class="hdr-sub"   id="hSub">Class 5 · O₂ → O Radical → PR Ashing (Remote Plasma Source) · Benedu Insight</div>
  </div>
  <div class="hdr-right">
    <div class="lang-toggle">
      <button class="lang-btn active" id="btnEN" onclick="setLang('en')">EN</button>
      <button class="lang-btn"        id="btnKO" onclick="setLang('ko')">KO</button>
    </div>
  </div>
</header>

<!-- Main 2-column layout -->
<div class="main">

  <!-- Left: Canvas + controls -->
  <div class="canvas-wrap" id="canvasWrap">
    <div class="canvas-card" id="canvasCard">
      <canvas id="cv"></canvas>
      <div id="tooltip"></div>
    </div>
    <div class="step-controls" id="stepControls"></div>
  </div>

  <!-- Right: Side panel -->
  <div class="side">
    <div class="side-inner" id="sideInner">
      <div class="step-eyebrow">Step <span id="stepNum">S</span> / 9</div>
      <div class="step-title" id="stepTitle"></div>
      <div class="step-body"  id="stepBody"></div>
      <div class="hint-box"   id="stepHint" style="display:none;"></div>
      <div id="deepDiveContainer"></div>
    </div>
    <div class="side-footer">
      <div class="step-btns" id="stepButtons"></div>
      <div class="nav-row">
        <button class="nav-btn" id="prevBtn">◀ Prev</button>
        <button class="nav-btn" id="nextBtn">Next ▶</button>
      </div>
    </div>
  </div>

</div>

<div class="img-lightbox" id="imgLightbox" onclick="closeLightbox()">
  <div class="lightbox-close" onclick="closeLightbox()">✕</div>
  <img id="imgLightboxSrc" src="" alt="">
</div>

<script>
/* ============================================================
   Remote Plasma Source (RPS) Interactive Lesson v1
   Benedu Insight · Google Sans · Full-viewport layout
   Responsive Canvas — geometry scales with window size
   O2 -> O Radical -> PR Ashing (Toroidal RPS, Transformer-Coupled)
   LEFT  : Toroidal Quartz Tube + Split Ferrite Core + Primary Coil
           -- AC Source (400 kHz), single circuit, no matcher/bias
   MID   : Downstream Transport Duct -- charged-species filter
   RIGHT : Process (Ashing) Chamber -- grounded, NO RF,
           passive radical showerhead + heated wafer chuck
   KO / EN bilingual
   ============================================================ */

// ── Canvas & ctx ──────────────────────────────────────────────
const canvas = document.getElementById('cv');
const ctx    = canvas.getContext('2d');
const tooltip     = document.getElementById('tooltip');
const stepCtrlEl  = document.getElementById('stepControls');

// ── Logical canvas dimensions (constant ratio 900:640) ────────
const LW = 900, LH = 640;
let DPR = window.devicePixelRatio || 1;

let renderScale = 1, renderOffX = 0, renderOffY = 0;
function resizeCanvas() {
  const card = document.getElementById('canvasCard');
  const cw = card.clientWidth;
  const ch = card.clientHeight;
  DPR = window.devicePixelRatio || 1;
  canvas.width  = Math.round(cw * DPR);
  canvas.height = Math.round(ch * DPR);
  canvas.style.width  = cw + 'px';
  canvas.style.height = ch + 'px';
  const aspect = LW / LH;
  let drawW, drawH;
  if (cw / ch > aspect) { drawH = ch; drawW = ch * aspect; }
  else                   { drawW = cw; drawH = cw / aspect; }
  renderScale = drawW / LW;
  renderOffX = (cw - drawW) / 2;
  renderOffY = (ch - drawH) / 2;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(renderScale * DPR, renderScale * DPR);
  ctx.translate(renderOffX / renderScale, renderOffY / renderScale);
}

const ro = new ResizeObserver(() => resizeCanvas());
ro.observe(document.getElementById('canvasCard'));
resizeCanvas();

// ── Brand ─────────────────────────────────────────────────────
const FONT = '"Google Sans","Noto Sans KR",system-ui,sans-serif';
const MONO = '"JetBrains Mono",monospace';
const B = {
  purple:'#7030A0', purpleSoft:'#F0E6F6', purpleDark:'#521a78',
  green:'#0F8C50',  greenSoft:'#E5F4EC',
  charcoal:'#2D2D2D', muted:'#6B7280', muted2:'#9CA3AF',
  bg:'#F7F8FA', panel:'#FFFFFF', border:'#E5E7EB',
  red:'#E8553B', blue:'#3A7AD6', teal:'#1f9e8e', amber:'#caa23a',
};

// ── Logo ──────────────────────────────────────────────────────
const LOGO = new Image();
LOGO.crossOrigin = 'anonymous';
LOGO.src = 'https://benedu-insight.github.io/logo_png/benedu_insight_logo_EN_horizontal.png';
function drawLogo(a=0.45) {
  if (!LOGO.complete || !LOGO.naturalWidth) return;
  const lh=26, lw=Math.round(lh*LOGO.naturalWidth/LOGO.naturalHeight);
  ctx.save(); ctx.globalAlpha=a;
  ctx.drawImage(LOGO, LW-lw-12, LH-lh-10, lw, lh);
  ctx.restore();
}
// ── Geometry — all in LW×LH (900×640) logical space ──────────
// REMOTE PLASMA SOURCE (RPS) for PR Ashing (+ Chamber Cleaning, deepDive):
//   LEFT  : Toroidal RPS module — ferrite-core transformer coupling.
//           A helical primary coil wraps a split ferrite core; the
//           plasma forms a closed current loop (secondary) INSIDE a
//           quartz toroidal tube. Driven by an AC source (400 kHz, common).
//   MID   : Downstream transport duct — ions/electrons recombine on
//           the duct walls; only NEUTRAL RADICALS (O·) survive to
//           reach the process chamber.
//   RIGHT : Process (Ashing) Chamber — grounded, NO RF applied here.
//           Radical shower-head style inlet at top, wafer chuck
//           (grounded, temperature-controlled) at bottom, pump below.
const W=LW, H=LH;

// ── RPS Toroid (left module) ───────────────────────────────────
const TOR={cx:175, cy:230, rOut:92, rIn:50};      // outer/inner radius of ceramic torus (drawn as a ring in cross-section)
const TOR_TUBE_W = TOR.rOut - TOR.rIn;            // tube wall thickness (visual)
// Ferrite core halves (split core clamped around one side of the torus)
const FCORE={cx:TOR.cx, cy:TOR.cy-TOR.rOut-26, w:96, h:40, r:8};
FCORE.x = FCORE.cx - FCORE.w/2;
FCORE.y = FCORE.cy - FCORE.h/2;
// AC Source — single circuit driving the primary coil directly. RPS
// plasma is not used to bias/accelerate ions toward any wafer, so there
// is no separate matcher/bias supply — just one AC source.
const AC_SRC={x:TOR.cx-75, y:TOR.cy+TOR.rOut+16, w:150, h:46, r:10};

// ── Downstream transport duct (mid section) ─────────────────────
// Horizontal duct connecting the RPS outlet (right side of torus) to
// the Process Chamber inlet (left wall, top region).
const DUCT={x:TOR.cx+TOR.rOut+14, y:118, w:150, h:34};

// ── RPS Module bounding box (dashed) ─────────────────────────────
// AC Source + Ferrite Core + Toroid + Downstream Duct inlet are supplied
// as a single product. Gas supply (MFCs/sources) sits BELOW this box,
// outside its boundary.
const RPS_BOX={x:30, y:FCORE.y-14, w:(DUCT.x+DUCT.w)-30, h:(AC_SRC.y+AC_SRC.h)-(FCORE.y-14)+10};

// ── Process (Ashing) Chamber (right module) ──────────────────────
const PCH={x:430, y:90, w:430, h:430, r:18};
const PIP=18, pinX=PCH.x+PIP, pinY=PCH.y+PIP, pinW=PCH.w-PIP*2, pinH=PCH.h-PIP*2;

// Radical shower-head — grounded, distributes O· across the chamber top.
// NOTE: unlike PE-CVD, this showerhead carries NO RF — it is a passive gas
// distribution plate fed by the downstream duct.
const RSH={x:pinX, y:pinY, w:pinW-46, h:18};

// Wafer chuck — grounded, temperature-controlled (often heated for ashing),
// NOT RF-powered. No sheath/V_DC physics here — this is the defining
// contrast with CCP/ICP direct-plasma chambers.
const PCW=Math.round(pinW*0.62);
const PSC={x:pinX+Math.round((pinW-PCW)/2), y:pinY+pinH-32, w:PCW, h:32};

// PR film on wafer — ashing target. Drawn as a uniform top layer that
// thins isotropically (top-down) as O radicals consume it.
const PR_FULL_H = 22;
const PWF={x:PSC.x+Math.round(PCW*0.08), y:PSC.y-PR_FULL_H, w:Math.round(PCW*0.84), h:PR_FULL_H};

// Plasma-free "reaction zone" — the volume between showerhead and wafer
// where O· radicals diffuse and react. No glow drawn here (no plasma).
const RZ={x:pinX+8, y:RSH.y+RSH.h, w:pinW-16, h:PSC.y-(RSH.y+RSH.h)-4};

// Process chamber pump — Dry Vacuum Pump only (no turbo; not used at
// RPS-typical pressures of 0.5–5 Torr). Positioned below the chamber.
const PDVP={x:PCH.x+60, y:PCH.y+PCH.h+34, w:110, h:56, r:8};

// ── Gas system — O2 (ashing) + NF3/Ar (cleaning, alt mode) ───────
// Two gas boxes feed a shared MFC manifold into the RPS toroid inlet.
// Positioned BELOW the RPS module's bounding box (gas supply is external
// to the single-product RPS module).
const GM1={cx:175, cy:RPS_BOX.y+RPS_BOX.h+44};   // MFC for O2
const GM2={cx:175, cy:GM1.cy+48};                // MFC for NF3 (cleaning mode) / N2
const GS1={x:50, y:GM1.cy-12, w:62, h:24};
const GS2={x:50, y:GM2.cy-12, w:62, h:24};
const TOR_INLET={x:TOR.cx, y:TOR.cy+TOR.rOut};   // gas enters torus from below
const TOR_OUTLET={x:TOR.cx+TOR.rOut, y:TOR.cy};  // radicals exit toroid toward duct

// ── Species — O2 (Ashing) / NF3+Ar (Cleaning, deepDive only) ─────
const SP={
  'O2':  {f:'O2',  c:'#2a3145', sz:11, q:0,  m:32,  cat:'neutral' },

        body:`<p>토로이달 튜브, 페라이트 코어, AC Source로 구성된 동일한 하드웨어가 <b>가스 화학</b>과 <b>Downstream 목적지</b>만 바꾸어 여러 응용에 재사용됩니다.</p>

// ── Drawing helpers (unchanged from CCP/ICP reference) ─────────
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
function pipe(pts,col='#b3bac8',w=2.2){
  ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.stroke();
}
function arw(x0,y0,x1,y1,col='#1d2436',w=1.2){
  ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=w;
  ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.stroke();
  const a=Math.atan2(y1-y0,x1-x0),h=5.5;
  ctx.beginPath();ctx.moveTo(x1,y1);
  ctx.lineTo(x1-h*Math.cos(a-0.4),y1-h*Math.sin(a-0.4));
  ctx.lineTo(x1-h*Math.cos(a+0.4),y1-h*Math.sin(a+0.4));
  ctx.closePath();ctx.fill();
}
function gnd(cx,cy){
  ctx.strokeStyle='#1d2436';ctx.lineWidth=1.5;ctx.beginPath();
  ctx.moveTo(cx,cy);ctx.lineTo(cx,cy+6);
  ctx.moveTo(cx-10,cy+6);ctx.lineTo(cx+10,cy+6);
  ctx.moveTo(cx-7,cy+10);ctx.lineTo(cx+7,cy+10);
  ctx.moveTo(cx-4,cy+14);ctx.lineTo(cx+4,cy+14);
  ctx.stroke();
}
function chem(formula,x,y,sz=11,col='#1d2436'){  ctx.fillStyle=col;
  const bF=`bold ${sz}px ${FONT}`,sF=`bold ${Math.round(sz*.7)}px ${FONT}`,pF=`bold ${Math.round(sz*.75)}px ${FONT}`;
  ctx.textAlign='left';ctx.textBaseline='middle';
  const segs=[];let i=0;
  while(i<formula.length){
    const ch=formula[i];
    if(/[A-Za-z]/.test(ch)){let s=ch;while(i+1<formula.length&&/[a-z]/.test(formula[i+1])){s+=formula[++i];}segs.push({t:'b',s});}
    else if(/[0-9]/.test(ch))segs.push({t:'sub',s:ch});
    else if(ch==='+'||ch==='-')segs.push({t:'sup',s:ch});
    i++;
  }
  let tot=0;for(const s of segs){ctx.font=s.t==='b'?bF:s.t==='sub'?sF:pF;tot+=ctx.measureText(s.s).width;}
  let cx=x-tot/2;
  for(const s of segs){
    ctx.font=s.t==='b'?bF:s.t==='sub'?sF:pF;
    const oy=s.t==='sub'?sz*.30:s.t==='sup'?-sz*.32:0;
    ctx.fillText(s.s,cx,y+oy);cx+=ctx.measureText(s.s).width;
  }
}

// ── Component renderers ─────────────────────────────────────────
function drawGasSrc(x,y,w,h,formula,sc){
  rr(x,y,w,h,8);const g=ctx.createLinearGradient(x,y,x,y+h);g.addColorStop(0,'#fff');g.addColorStop(1,'#eef0f5');
  ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#cdd2dd';ctx.lineWidth=1.2;ctx.stroke();
  ctx.fillStyle=sc;ctx.fillRect(x+6,y+h-5,w-12,3);chem(formula,x+w/2,y+h/2-3,12,'#1d2436');
}
function drawMFC(cx,cy){
  ctx.fillStyle='#fff';ctx.strokeStyle='#cdd2dd';ctx.lineWidth=1.2;rr(cx-15,cy-13,30,26,4);ctx.fill();ctx.stroke();
  ctx.strokeStyle='#5a6479';ctx.lineWidth=1.3;ctx.beginPath();
  ctx.moveTo(cx-7,cy-6);ctx.lineTo(cx+7,cy+6);ctx.lineTo(cx+7,cy-6);ctx.lineTo(cx-7,cy+6);ctx.closePath();ctx.stroke();
}
// Gas system — O2 (primary, ashing) + NF3/Ar (alternate, cleaning mode).
// Both share a manifold feeding the toroid inlet from below, routed
// around the right side of the AC Source module.
function drawGasSys(cleanMode=false){
  // Draw all pipe segments first...
  pipe([[GM1.cx+15,GM1.cy],[GS1.x,GM1.cy]]);
  pipe([[GM2.cx+15,GM2.cy],[GS2.x,GM2.cy]]);
  // Manifold: both MFC outputs merge into a vertical bus, then route
  // around the right edge of the AC Source module up to the toroid inlet.
  const busX=AC_SRC.x+AC_SRC.w+24;
  pipe([[GM1.cx-15,GM1.cy],[busX,GM1.cy]]);
  pipe([[GM2.cx-15,GM2.cy],[busX,GM2.cy]]);
  pipe([[busX,GM1.cy],[busX,TOR_INLET.y]]);
  pipe([[busX,TOR_INLET.y],[TOR_INLET.x,TOR_INLET.y]]);
  ctx.fillStyle='#7c8499';rr(TOR_INLET.x-4,TOR_INLET.y-4,8,8,2);ctx.fill();
  // ...then gas source boxes and MFC shapes on top, so pipes never
  // visually overlap the component shapes.
  drawGasSrc(GS1.x,GS1.y,GS1.w,GS1.h,'O2','#3A7AD6');
  drawGasSrc(GS2.x,GS2.y,GS2.w,GS2.h,'NF3+Ar','#0F8C50');
  drawMFC(GM1.cx,GM1.cy);drawMFC(GM2.cx,GM2.cy);
  // Highlight whichever line is active
  ctx.fillStyle=cleanMode?'rgba(15,140,80,.85)':'rgba(58,122,214,.85)';
  ctx.font=`bold 9px ${FONT}`;ctx.textAlign='left';ctx.textBaseline='middle';
  const lbl = cleanMode ? (lang==='ko'?'Cleaning 모드 (NF₃+Ar)':'Cleaning mode (NF₃+Ar)')
                        : (lang==='ko'?'Ashing 모드 (O₂)':'Ashing mode (O₂)');
  ctx.fillText(lbl, GS1.x, GM1.cy-26);
}

// Toroidal RPS module — closed ceramic ring (cross-section: two concentric
// circles), wrapped by a split ferrite core + primary coil at the top.
function drawToroid(active,t){
  // Outer/inner ring = ceramic tube cross-section
  const g=ctx.createRadialGradient(TOR.cx,TOR.cy,TOR.rIn*0.8,TOR.cx,TOR.cy,TOR.rOut);
  g.addColorStop(0,'#ffffff');g.addColorStop(1,'#eef0f5');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(TOR.cx,TOR.cy,TOR.rOut,0,Math.PI*2);
  ctx.arc(TOR.cx,TOR.cy,TOR.rIn,0,Math.PI*2,true);ctx.fill('evenodd');
  ctx.strokeStyle='#c4cad8';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(TOR.cx,TOR.cy,TOR.rOut,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.arc(TOR.cx,TOR.cy,TOR.rIn,0,Math.PI*2);ctx.stroke();
  // Label
  ctx.fillStyle='rgba(120,95,30,0.78)';ctx.font=`bold 10px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.save();ctx.translate(TOR.cx-TOR.rOut-14, TOR.cy);ctx.rotate(-Math.PI/2);
  ctx.fillText(lang==='ko'?'석영 토로이드':'Quartz Toroid', 0, 0);
  ctx.restore();
  if(active){
    const ph=Math.sin(t*2*Math.PI*0.9);
    const rMid=(TOR.rOut+TOR.rIn)/2;
    const g2=ctx.createRadialGradient(TOR.cx,TOR.cy,TOR.rIn,TOR.cx,TOR.cy,TOR.rOut);
    g2.addColorStop(0,`rgba(220,230,255,${0+0*ph})`);
    g2.addColorStop(0.5,`rgba(200,218,255,${0.55+0.20*Math.abs(ph)})`);
    g2.addColorStop(1,`rgba(185,182,225,${0.20})`);
    ctx.save();
    ctx.beginPath();ctx.arc(TOR.cx,TOR.cy,TOR.rOut,0,Math.PI*2);
    ctx.arc(TOR.cx,TOR.cy,TOR.rIn,0,Math.PI*2,true);ctx.clip('evenodd');
    ctx.fillStyle=g2;ctx.fillRect(TOR.cx-TOR.rOut,TOR.cy-TOR.rOut,TOR.rOut*2,TOR.rOut*2);
    ctx.restore();
  }
}
// Split ferrite core — sits across the top of the toroid, primary coil wound around it
function drawFerriteCore(active,t){
  const fx=FCORE.cx-FCORE.w/2, fy=FCORE.y;
  const g=ctx.createLinearGradient(fx,fy,fx,fy+FCORE.h);
  g.addColorStop(0,'#6b7388');g.addColorStop(1,'#3f4658');
  ctx.fillStyle=g;rr(fx,fy,FCORE.w,FCORE.h,FCORE.r);ctx.fill();
  // split gap (two halves clamped)
  ctx.strokeStyle='#1d2436';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(fx+FCORE.w/2,fy);ctx.lineTo(fx+FCORE.w/2,fy+FCORE.h);ctx.stroke();
  ctx.fillStyle='#fff';ctx.font=`bold 10px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='bottom';
  ctx.fillText(lang==='ko'?'페라이트 코어 (분리형)':'Ferrite Core (split)', FCORE.cx, fy-6);
  // Primary coil — windings around the core
  const N=6;
  ctx.strokeStyle='#8a6fb0';ctx.lineWidth=2.2;
  for(let i=0;i<N;i++){
    const wx=fx+8+i*(FCORE.w-16)/(N-1);
    ctx.beginPath();ctx.ellipse(wx,fy+FCORE.h/2,7,FCORE.h*0.62,0,0,Math.PI*2);ctx.stroke();
  }
  if(active){
    const ph=Math.sin(t*2*Math.PI*0.9);
    ctx.fillStyle=`rgba(112,48,160,${0.16+0.14*Math.abs(ph)})`;
    rr(fx-4,fy-4,FCORE.w+8,FCORE.h+8,8);ctx.fill();
  }
  // Feed from AC Source up to the primary coil — routed around the
  // toroid's left side to avoid crossing through the plasma ring.
  const feedX=TOR.cx-TOR.rOut-30;
  pipe([[AC_SRC.x,AC_SRC.y+AC_SRC.h/2],[feedX,AC_SRC.y+AC_SRC.h/2],[feedX,fy+FCORE.h/2],[fx,fy+FCORE.h/2]],'#5a6479',1.5);
}
// Circulating current/E-field inside the toroidal plasma loop (Step 3+)
// Drawn as a ring of arrows following the toroid's midline, direction
// alternating with the AC phase — the transformer's secondary current.
function drawCirculatingEField(t,al=.55){
  const rMid=(TOR.rOut+TOR.rIn)/2;
  const dirSign=Math.sin(t*2*Math.PI*0.55)>0?1:-1;
  const N=10;
  for(let i=0;i<N;i++){
    const a0=(i/N)*Math.PI*2, a1=((i+0.72)/N)*Math.PI*2;
    const x0=TOR.cx+rMid*Math.cos(a0), y0=TOR.cy+rMid*Math.sin(a0);
    const x1=TOR.cx+rMid*Math.cos(a1), y1=TOR.cy+rMid*Math.sin(a1);
    if(dirSign>0) arw(x0,y0,x1,y1,`rgba(112,48,160,${al})`,1.4);
    else arw(x1,y1,x0,y0,`rgba(112,48,160,${al})`,1.4);
  }
}
// Vertical flux lines through the ferrite core, into the plasma loop
function drawCoreFluxLines(t,al=.85){
  const phase=Math.sin(t*2*Math.PI*0.9);
  const dirUp=phase>=0;
  const mag=Math.abs(phase);
  const col=dirUp?B.teal:B.amber;
  const fx=FCORE.cx-FCORE.w/2, fy=FCORE.y;
  const N=4;
  for(let i=0;i<N;i++){
    const x=fx+(i+0.5)*FCORE.w/N;
    const a=al*(0.30+0.70*mag);
    ctx.save();ctx.globalAlpha=a;
    ctx.strokeStyle=col;ctx.lineWidth=1.3;ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.moveTo(x,fy-2);ctx.lineTo(x,fy+FCORE.h+2);ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }
}

// ── Particle system ───────────────────────────────────────────
function spawn(type,x,y,vx=null,vy=null){
  particles.push({type,x,y,vx:vx!==null?vx:(Math.random()-.5)*.4,vy:vy!==null?vy:(Math.random()-.5)*.4,age:0});
  return particles[particles.length-1];
}
// Random point inside the toroid ring (donut cross-section)
function rndPtTor(){
  const a=Math.random()*Math.PI*2;
  const r=TOR.rIn+6+Math.random()*(TOR.rOut-TOR.rIn-12);
  return {x:TOR.cx+r*Math.cos(a), y:TOR.cy+r*Math.sin(a)};
}
function clr(){particles=[];lights=[];impacts=[];}
// Generic boundary: keep particles inside a rect, bouncing off walls
function bounceRect(p,rect,damp=.4){
  if(p.x<rect.x+3){p.x=rect.x+3;p.vx=Math.abs(p.vx)*damp;}
  if(p.x>rect.x+rect.w-3){p.x=rect.x+rect.w-3;p.vx=-Math.abs(p.vx)*damp;}
  if(p.y<rect.y+3){p.y=rect.y+3;p.vy=Math.abs(p.vy)*damp;}
  if(p.y>rect.y+rect.h-3){p.y=rect.y+rect.h-3;p.vy=-Math.abs(p.vy)*damp;}
}
function drawParts(){
  for(const p of particles){
    const d=SP[p.type];
    if(d.cat==='byproduct'){ctx.save();ctx.globalAlpha=Math.max(0,1-p.age/1.8);chem(d.f,p.x,p.y,d.sz,d.c);ctx.restore();}
    else chem(d.f,p.x,p.y,d.sz,d.c);
  }
}
function emitL(x,y,col='rgba(255,220,200,1)',life=.6){lights.push({x,y,col,life,maxLife:life,r:0});}
function updL(dt){for(let i=lights.length-1;i>=0;i--){const Lp=lights[i];Lp.life-=dt;Lp.r+=30*dt;if(Lp.life<=0)lights.splice(i,1);}}
function drawL(){
  for(const Lp of lights){const a=Lp.life/Lp.maxLife,g=ctx.createRadialGradient(Lp.x,Lp.y,0,Lp.x,Lp.y,Lp.r);
    g.addColorStop(0,Lp.col.replace('1)',`${a})`));g.addColorStop(1,Lp.col.replace('1)','0)'));
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(Lp.x,Lp.y,Lp.r,0,Math.PI*2);ctx.fill();}
}
function addImp(x,y){impacts.push({x,y,life:.4,maxLife:.4});}
function updImp(dt){for(let i=impacts.length-1;i>=0;i--){impacts[i].life-=dt;if(impacts[i].life<=0)impacts.splice(i,1);}}
function drawImp(){
  for(const I of impacts){const a=I.life/I.maxLife;ctx.strokeStyle=`rgba(232,85,59,${a})`;ctx.lineWidth=1.4;
    ctx.beginPath();for(let k=0;k<8;k++){const ag=k*Math.PI*2/8,r0=4,r1=4+(1-a)*12;ctx.moveTo(I.x+r0*Math.cos(ag),I.y+r0*Math.sin(ag));ctx.lineTo(I.x+r1*Math.cos(ag),I.y+r1*Math.sin(ag));}ctx.stroke();}
}

function setupStep(i){
  clr();
  if(i===8){ashRemain=1.0;}
  if(i===1){
    // Gas-fill: starts empty, particles spawn via MFC inlet
  }else if(i===2||i===3){
    for(let k=0;k<22;k++){const p=rndPtTor();spawn('O2',p.x,p.y);}
  }else if(i===4){
    for(let k=0;k<14;k++){const p=rndPtTor();spawn('O2',p.x,p.y);}
    for(let k=0;k<6;k++){const p=rndPtTor();spawn('O',p.x,p.y);}
    for(let k=0;k<3;k++){const p=rndPtTor();spawn('O2+',p.x,p.y);}
    for(let k=0;k<4;k++){const p=rndPtTor();spawn('e-',p.x,p.y);}
  }else if(i===5){
    for(let k=0;k<10;k++){const p=rndPtTor();spawn('O2',p.x,p.y);}
    for(let k=0;k<8;k++){const p=rndPtTor();spawn('O',p.x,p.y);}
    for(let k=0;k<3;k++){const p=rndPtTor();spawn('O2+',p.x,p.y);}
    for(let k=0;k<4;k++){const p=rndPtTor();spawn('e-',p.x,p.y);}
  }else if(i===6){
    for(let k=0;k<10;k++){const p={x:RZ.x+Math.random()*RZ.w,y:RZ.y+Math.random()*RZ.h*0.5};spawn('O',p.x,p.y,(Math.random()-.5)*.3,.3+Math.random()*.3);}
    for(let k=0;k<6;k++){const p={x:RZ.x+Math.random()*RZ.w,y:RZ.y+Math.random()*RZ.h*0.5};spawn('O2',p.x,p.y,(Math.random()-.5)*.3,.2+Math.random()*.3);}
  }else if(i===7){
    mode='REMOTE';
    for(let k=0;k<10;k++){const p={x:RZ.x+Math.random()*RZ.w,y:RZ.y+Math.random()*RZ.h*0.5};spawn('O',p.x,p.y,(Math.random()-.5)*.3,.3+Math.random()*.3);}
  }
  renderStepCtrl(i);
}

// ── Step renderers ────────────────────────────────────────────
// steps[0]=S0->s1 (system overview), steps[1]=S1->s2 (gas fill O2),
// steps[2]=S2->s3 (RPS RF ignition / TCP), steps[3]=S3->s4 (O2 dissociation, confined plasma),
// steps[4]=S4->s5 (downstream transport — ion/e- filtering), steps[5]=S5->s6 (process chamber, radical diffusion),
// steps[6]=S6->s7 (Direct vs Remote toggle), steps[7]=S7->s8 (full PR ashing),
// steps[8]=K->s9 (Key Takeaways)

function s1(dt,t){
  chrome(false,t);
  drawWaferWithPR(1.0);

  drawCoreFluxLines(0,0.12);
  if(hoveredHotspot){
    const r=hoveredHotspot.rect;ctx.strokeStyle=B.purple;ctx.lineWidth=2;ctx.setLineDash([5,4]);
    rr(r.x-3,r.y-3,r.w+6,r.h+6,6);ctx.stroke();ctx.setLineDash([]);
  }
  ctx.fillStyle='rgba(60,70,95,.42)';ctx.font=`12px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(lang==='ko'?'플라즈마 (점화 전)':'Plasma (pre-ignition)', TOR.cx, TOR.cy);
}

function s2(dt,t){
  chrome(false,t);
  drawWaferWithPR(1.0);
  drawSideLabels();
  drawCoreFluxLines(0,0.12);
  // O2 fills the toroid via the inlet
  if(particles.length<40&&Math.random()<.22){
    const p=spawn('O2',TOR_INLET.x-2,TOR_INLET.y-4);
    p.vx=(Math.random()-.5)*.1;p.vy=-.25-Math.random()*.15;
  }
  particles=particles.filter(p=>{
    p.age+=dt;
    p.vx+=(Math.random()-.5)*.08;p.vy+=(Math.random()-.5)*.08;
    p.vx*=.97;p.vy*=.97;
    p.x+=p.vx;p.y+=p.vy;
    // confine to toroid annulus
    const dx=p.x-TOR.cx, dy=p.y-TOR.cy, r=Math.hypot(dx,dy);
    if(r>TOR.rOut-4||r<TOR.rIn+4){
      const targetR=Math.min(Math.max(r,TOR.rIn+4),TOR.rOut-4);
      const a=Math.atan2(dy,dx);
      p.x=TOR.cx+targetR*Math.cos(a);p.y=TOR.cy+targetR*Math.sin(a);
      p.vx*=-.3;p.vy*=-.3;
    }
    return true;
  });
  drawParts();
  ctx.fillStyle=B.muted;ctx.font=`11px ${MONO}`;ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillText(`${L().molCount}: ${particles.length}`,22,22);
  const pct=Math.min(particles.length/40,1);
  ctx.fillStyle=B.border;ctx.fillRect(22,38,130,5);ctx.fillStyle=B.blue;ctx.fillRect(22,38,130*pct,5);
}

let t3=0;
function s3(dt,t){
  chrome(true,t);
  drawWaferWithPR(1.0);
  drawSideLabels();
  drawCoreFluxLines(t,0.85);
  drawCirculatingEField(t,.45);
  // particles drift along the toroid annulus
  particles=particles.filter(p=>{
    p.age+=dt;
    const dx=p.x-TOR.cx, dy=p.y-TOR.cy, r=Math.hypot(dx,dy), a=Math.atan2(dy,dx);
    const na=a+dt*0.6;
    const nr=Math.min(Math.max(r+(Math.random()-.5)*.6,TOR.rIn+4),TOR.rOut-4);
    p.x=TOR.cx+nr*Math.cos(na);p.y=TOR.cy+nr*Math.sin(na);
    return true;
  });
  t3+=dt;if(t3>.30){t3=0;
    // O2 -> O2+ + e- ionization event somewhere in the ring
    const o2s=particles.filter(p=>p.type==='O2');
    if(o2s.length>2){
      const tgt=o2s[Math.floor(Math.random()*o2s.length)],idx=particles.indexOf(tgt);
      particles.splice(idx,1);
      spawn('O2+',tgt.x,tgt.y);spawn('e-',tgt.x+3,tgt.y-2);
      emitL(tgt.x,tgt.y,'rgba(220,230,255,1)',.4);
    }
  }
  updL(dt);drawL();drawParts();
  ctx.fillStyle=B.muted;ctx.font=`10px ${FONT}`;ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillText(lang==='ko'?'AC Source 점화 중 — 변압기 결합형 플라즈마 형성':'AC Source igniting — transformer-coupled plasma forming',22,22);
}

function s4(dt,t){
  chrome(true,t);
  drawWaferWithPR(1.0);
  drawSideLabels();
  drawCoreFluxLines(t,0.85);
  drawCirculatingEField(t,.55);
  particles=particles.filter(p=>{
    p.age+=dt;
    const dx=p.x-TOR.cx, dy=p.y-TOR.cy, r=Math.hypot(dx,dy), a=Math.atan2(dy,dx);
    const speed = SP[p.type].cat==='electron'?1.4:SP[p.type].cat==='ion'?0.9:0.6;
    const na=a+dt*0.6*speed;
    const nr=Math.min(Math.max(r+(Math.random()-.5)*.8,TOR.rIn+4),TOR.rOut-4);
    p.x=TOR.cx+nr*Math.cos(na);p.y=TOR.cy+nr*Math.sin(na);
    return true;
  });
  let t4=window.__t4||0;t4+=dt;window.__t4=t4;
  if(t4>.24){window.__t4=0;
    // e- + O2 -> 2O (dissociation) or O2+ + 2e- (ionization)
    const o2s=particles.filter(p=>p.type==='O2');
    if(o2s.length>2){
      const tgt=o2s[Math.floor(Math.random()*o2s.length)],idx=particles.indexOf(tgt);
      particles.splice(idx,1);
      if(Math.random()<.65){
        spawn('O',tgt.x-3,tgt.y);spawn('O',tgt.x+3,tgt.y);
      }else{
        spawn('O2+',tgt.x,tgt.y);spawn('e-',tgt.x+3,tgt.y-2);
      }
      emitL(tgt.x,tgt.y,'rgba(220,230,255,1)',.4);
    }
    // replenish O2 supply slowly from inlet
    if(particles.filter(p=>p.type==='O2').length<6){
      const p=rndPtTor();spawn('O2',p.x,p.y);
    }
  }
  updL(dt);drawL();drawParts();
  const nO=particles.filter(p=>p.type==='O').length;
  const nIon=particles.filter(p=>SP[p.type].cat==='ion').length;
  const nE=particles.filter(p=>SP[p.type].cat==='electron').length;
  ctx.fillStyle=B.muted;ctx.font=`10px ${FONT}`;ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillText(L().densityLabel,22,22);
  ctx.fillText(`O·: ${nO}   O⁺/O₂⁺: ${nIon}   e⁻: ${nE}`,22,38);
}

function s5(dt,t){
  chrome(true,t);
  drawWaferWithPR(1.0);
  drawSideLabels();
  drawCoreFluxLines(t,0.65);
  drawCirculatingEField(t,.40);
  // Particles travel from toroid outlet, through duct, into RZ.
  const exitPt={x:TOR_OUTLET.x, y:TOR_OUTLET.y};
  particles=particles.filter(p=>{
    p.age+=dt;
    if(p.phase===undefined)p.phase='toroid';
    if(p.phase==='toroid'){
      const dx=p.x-TOR.cx, dy=p.y-TOR.cy, r=Math.hypot(dx,dy), a=Math.atan2(dy,dx);
      const speed = SP[p.type].cat==='electron'?1.4:SP[p.type].cat==='ion'?0.9:0.6;
      let na=a+dt*0.6*speed;
      const nr=Math.min(Math.max(r+(Math.random()-.5)*.8,TOR.rIn+4),TOR.rOut-4);
      p.x=TOR.cx+nr*Math.cos(na);p.y=TOR.cy+nr*Math.sin(na);
      // near the outlet angle (a≈0, right side) -> chance to exit into duct
      const aN=((na%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
      if(aN<0.35 && Math.random()<0.02){
        p.phase='duct';p.x=DUCT.x+4;p.y=DUCT.y+DUCT.h/2+(Math.random()-.5)*8;
        p.vx=.6+Math.random()*.3;p.vy=(Math.random()-.5)*.1;
      }
      return true;
    }
    if(p.phase==='duct'){
      p.x+=p.vx;p.y+=p.vy;
      p.vy*=.95;
      // wall collision check -> charged species recombine and vanish
      if(p.y<DUCT.y+3||p.y>DUCT.y+DUCT.h-3){
        if(SP[p.type].cat==='ion'||SP[p.type].cat==='electron'){
          emitL(p.x,p.y,'rgba(255,210,200,1)',.35);
          return false; // recombined on wall
        }
        p.y=Math.min(Math.max(p.y,DUCT.y+3),DUCT.y+DUCT.h-3);
        p.vy*=-.4;
      }
      if(p.x>DUCT.x+DUCT.w){
        p.phase='rz';p.x=RZ.x+4;p.y=RSH.y+RSH.h+6;p.vx=(Math.random()-.5)*.3;p.vy=.3+Math.random()*.3;
      }
      return true;
    }
    // phase 'rz' — diffuse toward wafer, bounce within reaction zone
    p.vx+=(Math.random()-.5)*.08;p.vy+=(Math.random()-.5)*.04;
    p.vx*=.97;p.vy*=.97;
    p.x+=p.vx;p.y+=p.vy;
    bounceRect(p,RZ,.5);
    return p.age<6;
  });
  // replenish O2/O in toroid so the flow continues
  let t5=window.__t5||0;t5+=dt;window.__t5=t5;
  if(t5>.30){window.__t5=0;
    const inTor=particles.filter(p=>p.phase==='toroid');
    if(inTor.filter(p=>p.type==='O2').length<4){const p=rndPtTor();spawn('O2',p.x,p.y).phase='toroid';}
    if(inTor.filter(p=>p.type==='O').length<5){const p=rndPtTor();spawn('O',p.x,p.y).phase='toroid';}
    if(inTor.filter(p=>SP[p.type].cat==='ion').length<3){const p=rndPtTor();spawn('O2+',p.x,p.y).phase='toroid';}
    if(inTor.filter(p=>SP[p.type].cat==='electron').length<3){const p=rndPtTor();spawn('e-',p.x,p.y).phase='toroid';}
    // ionization/dissociation inside toroid
    const o2s=inTor.filter(p=>p.type==='O2');
    if(o2s.length>1 && Math.random()<.6){
      const tgt=o2s[Math.floor(Math.random()*o2s.length)],idx=particles.indexOf(tgt);
      particles.splice(idx,1);
      spawn('O',tgt.x-3,tgt.y).phase='toroid';spawn('O',tgt.x+3,tgt.y).phase='toroid';
    }
  }
  updL(dt);drawL();drawParts();
  ctx.fillStyle=B.muted;ctx.font=`10px ${FONT}`;ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillText(lang==='ko'?'이온·전자: Duct 벽에서 재결합 소멸 / 라디칼(O·): 통과':'Ions·electrons: recombine on duct walls / Radicals (O·): pass through',22,22);
}

function s6(dt,t){
  chrome(false,t);
  drawWaferWithPR(1.0);
  drawSideLabels();
  // Process chamber: pure diffusion, no field, no glow
  particles=particles.filter(p=>{
    p.age+=dt;
    p.vx+=(Math.random()-.5)*.10;p.vy+=(Math.random()-.5)*.06;
    p.vx*=.97;p.vy*=.97;
    p.x+=p.vx;p.y+=p.vy;

    if(p.type==='O' && p.y>PWF.y-2 && p.y<PWF.y+PWF.h && Math.random()<0.02){

  let t6=window.__t6||0;t6+=dt;window.__t6=t6;

    if(particles.filter(p=>p.type==='O').length<10){
      const p={x:RSH.x+Math.random()*RSH.w,y:RSH.y+RSH.h+2};spawn('O',p.x,p.y,(Math.random()-.5)*.2,.3+Math.random()*.3);
    }
    if(particles.filter(p=>p.type==='O2').length<5){
      const p={x:RSH.x+Math.random()*RSH.w,y:RSH.y+RSH.h+2};spawn('O2',p.x,p.y,(Math.random()-.5)*.2,.2+Math.random()*.2);
    }
  }
  updL(dt);drawL();drawParts();
  ctx.fillStyle=B.muted;ctx.font=`10px ${FONT}`;ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillText(L().noVdc,22,22);
  ctx.fillStyle='rgba(80,110,160,.85)';
  ctx.fillText(lang==='ko'?'O· 라디칼이 확산되어 PR과 반응 (CO₂, H₂O 생성)':'O· radicals diffuse and react with PR (forming CO₂, H₂O)',22,38);
}

  }else{

      p.vx*=.97;p.vy*=.97;

        if(p.type==='O'&&Math.random()<0.02){

          return false;
        }
      }
      return p.age<6;
    }
  });
  let t7=window.__t7||0;t7+=dt;window.__t7=t7;
  if(t7>.22){window.__t7=0;
    if(isRemote){
      if(particles.filter(p=>p.type==='O').length<10){
        const p={x:RSH.x+Math.random()*RSH.w,y:RSH.y+RSH.h+2};spawn('O',p.x,p.y,(Math.random()-.5)*.2,.3+Math.random()*.3);
      }
    }else{
      if(particles.filter(p=>p.type==='O').length<8){
        const p={x:RZ.x+Math.random()*RZ.w,y:RZ.y+2};spawn('O',p.x,p.y,(Math.random()-.5)*.3,.2+Math.random()*.3);
      }
      if(particles.filter(p=>SP[p.type].cat==='ion').length<6){
        const p={x:RZ.x+Math.random()*RZ.w,y:RZ.y+2};spawn(Math.random()<.5?'O+':'O2+',p.x,p.y,(Math.random()-.5)*.2,.15);
      }
      if(particles.filter(p=>SP[p.type].cat==='electron').length<4){
        const p={x:RZ.x+Math.random()*RZ.w,y:RZ.y+2};spawn('e-',p.x,p.y);
      }
    }
  }
  updImp(dt);drawParts();drawImp();
  ctx.fillStyle=B.muted;ctx.font=`11px ${MONO}`;ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillText(`${L().modeLabel}: ${isRemote?'Remote Plasma':'Direct Plasma'}`,22,22);
  ctx.fillStyle=isRemote?B.blue:B.purple;
  ctx.fillText(isRemote?L().modeInfoRemote:L().modeInfoDirect,22,38);
}

let t8=0;
function s8(dt,t){
  chrome(false,t);
  drawSideLabels();
  if(ashRemain>0){
    particles=particles.filter(p=>{
      p.age+=dt;
      p.vx+=(Math.random()-.5)*.10;p.vy+=(Math.random()-.5)*.06;
      p.vx*=.97;p.vy*=.97;
      p.x+=p.vx;p.y+=p.vy;
      bounceRect(p,RZ,.5);
      const prTopY=PWF.y+PWF.h*(1-ashRemain);
      if(p.type==='O' && p.y>prTopY-2 && p.y<prTopY+6 && Math.random()<0.03){
        addImp(p.x,prTopY);
        spawn(Math.random()<.5?'CO2':'H2O',p.x,prTopY-2,(Math.random()-.5)*.3,-.8-Math.random()*.4);
        ashRemain=Math.max(0,ashRemain-0.0035);
        return false;
      }
      return p.age<8;
    });
    t8+=dt;if(t8>.18){t8=0;
      if(particles.filter(p=>p.type==='O').length<12){
        const p={x:RSH.x+Math.random()*RSH.w,y:RSH.y+RSH.h+2};spawn('O',p.x,p.y,(Math.random()-.5)*.2,.3+Math.random()*.3);
      }
      if(particles.filter(p=>p.type==='O2').length<5){
        const p={x:RSH.x+Math.random()*RSH.w,y:RSH.y+RSH.h+2};spawn('O2',p.x,p.y,(Math.random()-.5)*.2,.2+Math.random()*.2);
      }
    }
  }
  drawWaferWithPR(ashRemain);
  updImp(dt);drawParts();drawImp();
  // Overall equation
  const eqY=22;ctx.fillStyle='#3a4358';ctx.font=`bold 12px ${FONT}`;ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText(L().eqLabel,22,eqY);
  const eqX0=22+ctx.measureText(L().eqLabel).width+14;
  chem('CxHy',eqX0+18,eqY,12,B.purple);ctx.fillStyle='#3a4358';ctx.font=`bold 12px ${FONT}`;ctx.fillText('+ O\u00b7 \u2192',eqX0+50,eqY);
  chem('CO2',eqX0+108,eqY,12,'#9CA3AF');ctx.fillStyle='#3a4358';ctx.fillText('+',eqX0+132,eqY);chem('H2O',eqX0+158,eqY,12,'#9CA3AF');
  ctx.fillStyle=B.muted;ctx.font=`11px ${MONO}`;ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillText(`${L().ashLabel}: ${(ashRemain*100).toFixed(0)} ${L().ashPctOf}`,22,46);
  ctx.fillStyle=B.border;ctx.fillRect(22,62,200,5);
  ctx.fillStyle=ashRemain<=0?B.green:B.blue;
  ctx.fillRect(22,62,200*(1-ashRemain),5);
  if(ashRemain<=0){ctx.fillStyle=B.green;ctx.font=`bold 10px ${FONT}`;ctx.fillText(L().ashComplete,22,74);}
}

// ── STEP 9 (K) — Key Takeaways ──────────────────────────────────
function s9(){
  ctx.fillStyle=B.bg;ctx.fillRect(0,0,W,H);
  const hg=ctx.createLinearGradient(0,0,W,0);hg.addColorStop(0,B.purple);hg.addColorStop(1,'#8B40B8');
  ctx.fillStyle=hg;ctx.fillRect(0,0,W,64);
  ctx.fillStyle='#fff';ctx.font=`bold 19px ${FONT}`;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(L().takeawayHeader,24,26);
  ctx.fillStyle='rgba(255,255,255,.72)';ctx.font=`11.5px ${FONT}`;ctx.fillText(L().takeawaySubheader,24,50);
  ctx.fillStyle=B.green;ctx.fillRect(0,64,W,4);
  function secLbl(txt,x,y){ctx.fillStyle=B.purple;ctx.fillRect(x,y-7,3,14);ctx.font=`bold 12.5px ${FONT}`;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillStyle=B.charcoal;ctx.fillText(txt,x+10,y);}
  const LX=20,LWc=408;secLbl(L().takeawayDesign,LX,84);
  L().principles.forEach(([title,desc],i)=>{
    const cy=100+i*82,ch=72;
    ctx.save();rr(LX,cy,LWc,ch,8);ctx.clip();ctx.fillStyle='rgba(15,140,80,.07)';ctx.fillRect(LX,cy,LWc,ch);ctx.restore();
    rr(LX,cy,LWc,ch,8);ctx.strokeStyle='rgba(15,140,80,.28)';ctx.lineWidth=.8;ctx.stroke();
    ctx.fillStyle=B.green;ctx.beginPath();ctx.arc(LX+22,cy+ch/2,11,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.font=`bold 13px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('✓',LX+22,cy+ch/2);
    ctx.fillStyle='#0a5e34';ctx.font=`bold 12.5px ${FONT}`;ctx.textAlign='left';ctx.fillText(title,LX+42,cy+24);
    ctx.fillStyle='#4a5565';ctx.font=`10.5px ${FONT}`;ctx.fillText(desc,LX+42,cy+48);
  });
  const RX=446,RW=436;secLbl(L().takeawayParams,RX,84);
  const TY=98,RH=30,cols=[0,192,314,436],totH=RH*(L().tRows.length+1);
  ctx.save();rr(RX,TY,RW,totH,8);ctx.clip();
  ctx.fillStyle=B.purple;ctx.fillRect(RX,TY,RW,RH);
  L().tHeaders.forEach((h,ci)=>{const mx=RX+(cols[ci]+cols[ci+1])/2;ctx.fillStyle='#fff';ctx.font=`bold 11.5px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(h,mx,TY+RH/2);});
  L().tRows.forEach((row,ri)=>{
    const ry=TY+RH+ri*RH;ctx.fillStyle=ri%2===0?B.purpleSoft:'#fff';ctx.fillRect(RX,ry,RW,RH);
    ctx.strokeStyle='#ddd0ee';ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(RX,ry+RH);ctx.lineTo(RX+RW,ry+RH);ctx.stroke();
    [1,2].forEach(ci=>{ctx.beginPath();ctx.moveTo(RX+cols[ci],ry);ctx.lineTo(RX+cols[ci],ry+RH);ctx.stroke();});
    row.forEach((cell,ci)=>{
      ctx.fillStyle=ci===0?B.charcoal:ci===1?B.purple:'#6b7388';ctx.font=ci===0?`11px ${FONT}`:`bold 11px ${FONT}`;
      ctx.textAlign=ci===0?'left':'center';ctx.textBaseline='middle';
      ctx.fillText(cell,ci===0?RX+8:RX+(cols[ci]+cols[ci+1])/2,ry+RH/2);
    });
  });
  ctx.restore();rr(RX,TY,RW,totH,8);ctx.strokeStyle='#d0c0e8';ctx.lineWidth=1;ctx.stroke();
  const PWY=TY+totH+18;
  ctx.fillStyle=B.green;ctx.fillRect(RX,PWY,3,14);ctx.fillStyle=B.charcoal;ctx.font=`bold 12px ${FONT}`;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(L().takeawayWindow,RX+10,PWY+7);
  L().pwItems.forEach(([k,v],i)=>{
    const py=PWY+26+i*22;ctx.fillStyle='#7a7a8a';ctx.font=`11px ${FONT}`;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(k,RX+10,py);
    ctx.fillStyle=B.charcoal;ctx.font=`bold 11px ${FONT}`;ctx.textAlign='right';ctx.fillText(v,RX+RW-6,py);
  });
  const BX=20,BY=514,BW=W-40,BH=74,HDH=30;
  ctx.save();rr(BX,BY,BW,BH,8);ctx.clip();ctx.fillStyle='rgba(242,201,76,.13)';ctx.fillRect(BX,BY,BW,HDH);ctx.fillStyle='#fff';ctx.fillRect(BX,BY+HDH,BW,BH-HDH);ctx.restore();
  rr(BX,BY,BW,BH,8);ctx.strokeStyle='rgba(190,155,40,.32)';ctx.lineWidth=.8;ctx.stroke();
  ctx.strokeStyle='rgba(190,155,40,.32)';ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(BX+1,BY+HDH);ctx.lineTo(BX+BW-1,BY+HDH);ctx.stroke();
  ctx.fillStyle='rgba(242,201,76,.50)';ctx.beginPath();ctx.arc(BX+20,BY+HDH/2,9,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#7a5800';ctx.font=`bold 12px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('!',BX+20,BY+HDH/2);
  ctx.fillStyle=B.charcoal;ctx.font=`bold 12.5px ${FONT}`;ctx.textAlign='left';ctx.fillText(L().takeawayLimits,BX+36,BY+HDH/2);
  ctx.fillStyle='#5a6070';ctx.font=`10.5px ${FONT}`;
  L().limitLines.forEach((ln,i)=>ctx.fillText(ln,BX+14,BY+HDH+16+i*18));
  drawLogo(.55);
}

const RENDERS=[s1,s2,s3,s4,s5,s6,s7,s8,s9];

// ── Step controls ─────────────────────────────────────────────
function renderStepCtrl(i){
  stepCtrlEl.innerHTML='';
  if(i===6){
    const wrap=document.createElement('div');wrap.className='mode-toggle';
    const remB=document.createElement('button');remB.textContent='Remote Plasma';
    const dirB=document.createElement('button');dirB.textContent='Direct Plasma';
    if(mode==='REMOTE')remB.classList.add('active');else dirB.classList.add('active');
    remB.addEventListener('click',()=>{mode='REMOTE';setupStep(6);});
    dirB.addEventListener('click',()=>{mode='DIRECT';setupStep(6);});
    wrap.appendChild(remB);wrap.appendChild(dirB);stepCtrlEl.appendChild(wrap);
    const note=document.createElement('span');note.className='mode-info';
    note.textContent=mode==='REMOTE'?L().modeInfoRemote:L().modeInfoDirect;
    stepCtrlEl.appendChild(note);
  }else if(i===7){
    const btn=document.createElement('button');btn.className='reset-btn';btn.textContent=L().resetAsh;
    btn.addEventListener('click',()=>{ashRemain=1.0;});stepCtrlEl.appendChild(btn);
  }
}

// ── Main loop ─────────────────────────────────────────────────
function render(){
  const now=performance.now(),dt=Math.min((now-lastT)/1000,.05);lastT=now;
  ctx.save();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle=B.bg;
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.restore();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(renderScale * DPR, renderScale * DPR);
  ctx.translate(renderOffX / renderScale, renderOffY / renderScale);
  RENDERS[currentStep](dt,(now-t0)/1000);
  requestAnimationFrame(render);
}
document.fonts.ready.then(()=>render()).catch(()=>render());

// ── Step buttons ──────────────────────────────────────────────
const sBEl=document.getElementById('stepButtons');
function buildBtns(){
  sBEl.innerHTML='';
  L().steps.forEach((s,i)=>{
    const b=document.createElement('button');b.className='step-btn'+(i===currentStep?' active':'');
    b.textContent=i===0?'S':i===L().steps.length-1?'K':i;b.title=s.title;
    b.addEventListener('click',()=>setStep(i));sBEl.appendChild(b);
  });
}
const prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn');
prevBtn.addEventListener('click',()=>setStep(currentStep-1));
nextBtn.addEventListener('click',()=>setStep(currentStep+1));

function fmtHint(raw){
  if(!raw)return'';const sp=raw.indexOf(' ');
  if(sp>0){const icon=raw.slice(0,sp),body=raw.slice(sp+1);if(/\p{Emoji}/u.test(icon))return`<div class="hint-icon">${icon}</div><div class="hint-text">${body}</div>`;}
  return`<div class="hint-text">${raw}</div>`;
}
const DEEP_DIVE_LABEL = { en:'Deep Dive', ko:'심화학습' };
function toggleDeepDive(idx){
  const hdr=document.getElementById('ddHdr'+idx), body=document.getElementById('ddBody'+idx);
  if(!hdr||!body)return;
  const open=body.classList.toggle('open');
  hdr.classList.toggle('open',open);
}
function setStep(i){
  if(i<0||i>=L().steps.length)return;currentStep=i;
  document.querySelectorAll('.step-btn.active').forEach(b=>b.classList.remove('active'));
  if(sBEl.children[i])sBEl.children[i].classList.add('active');
  document.getElementById('stepNum').textContent=i===0?'S':i===L().steps.length-1?'K':i;
  document.getElementById('stepTitle').textContent=L().steps[i].title;
  document.getElementById('stepBody').innerHTML=L().steps[i].body;
  const hEl=document.getElementById('stepHint');
  if(L().steps[i].hint){hEl.innerHTML=fmtHint(L().steps[i].hint);hEl.style.display='';}
  else hEl.style.display='none';
  const ddEl=document.getElementById('deepDiveContainer');
  let dds=L().steps[i].deepDive;
  if(dds && !Array.isArray(dds)) dds=[dds];
  if(dds && dds.length){
    ddEl.innerHTML=dds.map((dd,idx)=>`
      <div class="deep-wrap">
        <div class="deep-hdr" id="ddHdr${idx}" onclick="toggleDeepDive(${idx})">
          <span class="deep-icon">📚</span>
          <span class="deep-title">${dd.title}</span>
          <span class="deep-badge">${DEEP_DIVE_LABEL[lang]}</span>
          <span class="deep-chevron">▼</span>
        </div>
        <div class="deep-body" id="ddBody${idx}">
          <div class="deep-inner">${dd.body}</div>
        </div>
      </div>`).join('');
  } else {
    ddEl.innerHTML='';
  }
  prevBtn.disabled=(i===0);nextBtn.disabled=(i===L().steps.length-1);
  prevBtn.textContent=L().prevBtn;nextBtn.textContent=L().nextBtn;
  document.getElementById('sideInner').scrollTop=0;
  renderStepCtrl(i);
  setupStep(i);
}

// ── Language ──────────────────────────────────────────────────
function setLang(l){
  lang=l;
  document.getElementById('btnEN').classList.toggle('active',l==='en');
  document.getElementById('btnKO').classList.toggle('active',l==='ko');
  document.getElementById('hTitle').textContent=L().hTitle;
  document.getElementById('hSub').textContent=L().hSub;
  buildBtns();setStep(currentStep);
}

// ── Tooltip ───────────────────────────────────────────────────
function ptIn(x,y,r){return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;}
canvas.addEventListener('mousemove',e=>{
  const cr=canvas.getBoundingClientRect();
  const mx=(e.clientX-cr.left), my=(e.clientY-cr.top);
  const cx=(mx-renderOffX)/renderScale, cy=(my-renderOffY)/renderScale;
  if(currentStep!==0){hoveredHotspot=null;tooltip.classList.remove('show');canvas.style.cursor='default';return;}
  let foundR=null;for(const h of HR){if(ptIn(cx,cy,h.rect)){foundR=h;break;}}
  hoveredHotspot=foundR;
  if(foundR){
    const hs=L().hotspots.find(h=>h.n===foundR.n);
    tooltip.classList.add('show');
    tooltip.innerHTML=`<b>${hs.title}</b><br>${hs.text.replace(/\n/g,'<br>')}`;
    const cardRect=canvas.parentElement.getBoundingClientRect();
    tooltip.style.left=(e.clientX-cardRect.left)+'px';
    tooltip.style.top=(e.clientY-cardRect.top-10)+'px';
    canvas.style.cursor='pointer';
  }else{tooltip.classList.remove('show');canvas.style.cursor='default';}
});
canvas.addEventListener('mouseleave',()=>{hoveredHotspot=null;tooltip.classList.remove('show');});

// ── Image Lightbox ────────────────────────────────────────────
function openLightbox(src){
  const lb=document.getElementById('imgLightbox'), img=document.getElementById('imgLightboxSrc');
  img.src=src;lb.classList.add('open');
}
function closeLightbox(){
  document.getElementById('imgLightbox').classList.remove('open');
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox();});

// ── Init ──────────────────────────────────────────────────────
buildBtns();
setStep(0);
</script>
</body>
