<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCP PE-CVD v5 — Interactive Lesson · Benedu Insight</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/benedu-insight/benedu-insight.github.io/refs/heads/main/logo_png/benedu_insight_Symbol.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8FAFB; --card:#FFFFFF; --border:#E2E8F0; --line:#EEF2F6;
  --text:#1A202C; --ink2:#334155; --muted:#64748B; --label:#94A3B8;
  --green:#0F8C50; --green-lt:#E6F4ED; --green-dk:#0A6B3C;
  --purple:#7030A0; --purple-lt:#F0E8F8; --purple-mid:#9B59D0; --purple-dk:#521A78;
  --coral:#E8553B; --coral-lt:#FDEEEA; --coral-dk:#8A2E1C;
  --amber:#B7791F; --amber-lt:#FEF6E4; --amber-dk:#7A4E0B;
  --shadow:0 2px 12px rgba(15,23,42,.06);
  --hdr:56px; --side:440px;
  --sans:'Google Sans',system-ui,sans-serif;
  --mono:var(--sans);
  --serif:var(--sans);
  --code:'JetBrains Mono','Noto Sans KR',ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html[lang=ko]{--sans:'Google Sans','Noto Sans KR',system-ui,sans-serif}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit}

/* ── Header ── */
.hdr{position:fixed;top:0;left:0;right:0;height:var(--hdr);z-index:50;display:flex;align-items:center;gap:14px;
  padding:0 20px;background:var(--card);border-bottom:1px solid var(--border)}
.hdr-logo{height:32px;display:block}
.hdr-div{width:1px;height:26px;background:var(--border)}
.hdr-title{font-size:15px;font-weight:700;color:var(--purple);line-height:1.2;white-space:nowrap}
.hdr-sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--label);margin-top:2px;white-space:nowrap}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.lang-toggle{display:flex;background:var(--bg);border:1.5px solid var(--border);border-radius:20px;padding:3px;gap:2px}
.lang-btn{font-family:'Google Sans','Noto Sans KR',sans-serif;white-space:nowrap;font-size:12px;font-weight:600;padding:3px 12px;border-radius:16px;border:none;background:transparent;color:var(--muted);cursor:pointer;transition:all .18s}
.lang-btn.active{background:var(--purple);color:#fff}

/* ── App grid ── */
.app{position:fixed;top:var(--hdr);left:0;right:0;bottom:0;display:grid;grid-template-columns:minmax(0,1fr) var(--side)}
.stage{display:flex;flex-direction:column;gap:8px;padding:10px 10px 10px 12px;min-width:0;min-height:0}

/* recipe bar */
.recipe{display:flex;align-items:center;gap:4px;flex-wrap:nowrap;overflow:hidden;flex-shrink:0;padding:0 2px}
.recipe-k{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--label);margin-right:6px;white-space:nowrap}
.rp{font-size:11px;font-weight:600;color:var(--label);padding:4px 9px;border-radius:999px;border:1px solid var(--border);background:var(--card);white-space:nowrap;transition:all .2s}
.rp.on{background:var(--purple);border-color:var(--purple);color:#fff;box-shadow:0 2px 8px rgba(112,48,160,.25)}
.rp.done{color:var(--muted)}
.rp-sep{color:var(--border);font-size:10px}

/* canvas card */
.canvas-card{flex:1;min-height:0;position:relative;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.cv-wrap{flex:1;min-height:0;position:relative}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.sbar{display:flex;align-items:center;gap:6px;padding:6px 10px;border-top:1px solid var(--line);min-height:36px;flex-wrap:wrap;flex-shrink:0}
.rd{font-family:var(--sans);font-variant-numeric:tabular-nums;font-size:11px;color:var(--ink2);background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:2px 7px;white-space:nowrap}
.rd b{font-weight:500;color:var(--label);margin-right:4px}
.rd.on{border-color:#d9c6ec;background:var(--purple-lt);color:var(--purple-dk)}
.rd.slow{color:var(--muted);background:transparent;border-style:dashed}
.sbar-sp{flex:1}
.legend{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lg{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--ink2);white-space:nowrap}
.lg i{width:8px;height:8px;border-radius:50%;display:inline-block}
.lg i.ion{box-shadow:0 0 0 2px rgba(232,85,59,.25)}
.lg i.pw{border-radius:2px;background:#CBD5E1;border:1px solid #94A3B8}
.lbl-btn{font-size:11px;font-weight:600;border:1px solid var(--border);background:var(--card);color:var(--muted);border-radius:6px;padding:2px 8px;cursor:pointer}
.lbl-btn.on{background:var(--purple-lt);color:var(--purple);border-color:#d9c6ec}
.msg{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--green-lt);color:var(--green-dk);white-space:nowrap}
.msg.warn{background:var(--coral-lt);color:var(--coral-dk)}
.msg.info{background:var(--purple-lt);color:var(--purple-dk)}
.msg:empty{display:none}
sub,sup{font-size:.72em;line-height:0}

#tooltip{position:absolute;pointer-events:none;z-index:20;max-width:300px;background:rgba(17,24,39,.96);color:#fff;
  padding:10px 13px;border-radius:10px;font-size:12.5px;line-height:1.55;opacity:0;transition:opacity .12s;
  box-shadow:0 10px 30px rgba(0,0,0,.28);transform:translate(-50%,calc(-100% - 14px))}
#tooltip.show{opacity:1}
#tooltip b{display:block;color:#d8b9f3;margin-bottom:2px;font-size:12.5px}

/* takeaway overlay */
.stage-html{position:absolute;inset:0;overflow:auto;background:var(--card);display:none;padding:22px 24px 28px}
.stage-html.show{display:block}

/* instrument panel */
.inst{flex-shrink:0;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(250px,1fr);gap:8px;height:216px}
.inst.tall{height:286px}
.inst.one{grid-template-columns:1fr;height:auto}
.icard{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:9px 12px;min-width:0;min-height:0;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.ihead{display:flex;align-items:center;gap:8px;flex-shrink:0}
.ihead h3{font-size:12px;font-weight:600;color:var(--ink2)}
.badge{display:inline-flex;align-items:center;gap:5px;background:var(--green-lt);color:var(--green);font-size:9.5px;font-weight:600;letter-spacing:.08em;padding:2px 8px;border-radius:4px;flex-shrink:0}
.badge-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.chart{flex:1;min-height:0;width:100%;display:block}
.crow{flex:1;min-height:0;display:flex;gap:8px}
.crow .chart{flex:1;min-width:0;height:100%}
.ctls{display:flex;flex-direction:column;gap:6px;overflow:auto;min-height:0;padding-right:2px}
.ctls.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:14px;row-gap:8px;align-content:start}
.ctls.g2 .seg-row{grid-column:1/-1}
.ctl-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:2px;line-height:1.25}
.ctl-h label{font-size:11.5px;color:var(--muted);font-weight:500}
.ctl-h output{font-family:var(--mono);font-size:11.5px;color:var(--purple);font-weight:600;white-space:nowrap}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--green),var(--purple-mid));outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;border:2.5px solid var(--purple);box-shadow:0 1px 4px rgba(0,0,0,.18)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:2.5px solid var(--purple)}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:none;background:transparent;padding:4px 10px;font-size:11.5px;font-weight:600;color:var(--muted);border-radius:6px;cursor:pointer}
.seg button.on{background:var(--purple);color:#fff}
.seg-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg-row .k{font-size:11.5px;color:var(--muted);min-width:64px}
.btn{font-size:11.5px;font-weight:600;border:1px solid var(--border);background:var(--card);color:var(--ink2);border-radius:8px;padding:5px 12px;cursor:pointer;transition:all .15s}
.btn:hover{border-color:#d9c6ec;color:var(--purple);background:var(--purple-lt)}
.btn.pri{background:var(--purple);border-color:var(--purple);color:#fff}
.btn.pri:hover{background:var(--purple-dk)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.stats.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.stats.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 8px;min-width:0}
.stat-k{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-v{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--purple);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-v small{font-size:10px;color:var(--muted);font-weight:500}
.stat.pass{background:var(--green-lt);border-color:#cde9da}.stat.pass .stat-v{color:var(--green-dk)}
.stat.fail{background:var(--coral-lt);border-color:#f6d3ca}.stat.fail .stat-v{color:var(--coral-dk)}
.ticker{font-family:var(--sans);font-size:11.5px;line-height:1.7;color:var(--ink2);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 9px;min-height:68px}
.ticker div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticker div em{font-style:normal;color:var(--label)}
.phase-chips{display:flex;flex-wrap:wrap;gap:4px}
.pc{font-size:11px;font-weight:600;border:1px solid var(--border);background:var(--card);color:var(--muted);border-radius:999px;padding:3px 9px;cursor:pointer}
.pc.on{background:var(--purple);color:#fff;border-color:var(--purple)}
.pc.done{color:var(--green-dk);border-color:#cde9da;background:var(--green-lt)}
.note{font-size:10.5px;color:var(--label);line-height:1.45}

/* ── Side panel ── */
.side{background:var(--card);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.side-scroll{flex:1;overflow-y:auto;padding:18px 22px 16px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.chap{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--green);background:var(--green-lt);padding:2px 8px;border-radius:4px}
.scount{font-family:var(--mono);font-size:10px;color:var(--label);letter-spacing:.08em}
.s-title{font-size:20px;font-weight:700;line-height:1.28;color:var(--text);margin-bottom:8px;letter-spacing:-.005em}
.s-lead{font-family:var(--sans);font-size:14px;line-height:1.7;color:var(--muted);margin-bottom:10px}
.s-body{font-size:13px;line-height:1.72;color:#3b4456}
.s-body ul{padding-left:1.05rem;margin:4px 0}
.s-body li{margin-bottom:4px}
.s-body li::marker{color:var(--purple-mid)}
.s-body b{color:var(--text);font-weight:600}
code,.s-body code{font-family:var(--mono);font-size:11.5px;background:var(--purple-lt);color:var(--purple-dk);padding:1px 5px;border-radius:4px;white-space:nowrap}
.parts{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.part{font-size:11.5px;border:1px solid var(--border);background:var(--card);color:var(--ink2);border-radius:999px;padding:3px 10px;cursor:pointer;transition:all .14s}
.part:hover,.part.on{border-color:#d9c6ec;background:var(--purple-lt);color:var(--purple-dk)}
.co{display:flex;gap:10px;padding:10px 12px;border-radius:10px;margin-top:10px;font-size:12.5px;line-height:1.62}
.co svg{flex:none;width:18px;height:18px;margin-top:2px}
.co .tag{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;margin-bottom:2px;opacity:.85}
.co.try{background:var(--purple-lt);color:var(--purple-dk)}
.co.myth{background:var(--coral-lt);color:var(--coral-dk)}
.co.key{background:var(--green-lt);color:var(--green-dk)}
.co.warn{background:var(--amber-lt);color:var(--amber-dk)}
.dd{margin-top:10px;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--card)}
.dd summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:12.5px;font-weight:600;color:var(--text);user-select:none}
.dd summary::-webkit-details-marker{display:none}
.dd summary .db{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;background:var(--purple);color:#fff;padding:2px 6px;border-radius:4px;flex-shrink:0}
.dd summary .dt{flex:1}
.dd summary .chev{color:var(--label);font-size:10px;transition:transform .2s}
.dd[open] summary{background:var(--purple-lt);border-bottom:1px solid var(--border)}
.dd[open] summary .chev{transform:rotate(180deg)}
.dd-in{padding:12px 14px;font-size:12.5px;line-height:1.75;color:#3b4456;background:var(--bg)}
.dd-in p+p,.dd-in p+ul,.dd-in ul+p{margin-top:8px}
.dd-in ul{padding-left:1.05rem}
.dd-in b{color:var(--text)}
.eq{font-family:var(--code);font-size:11.5px;line-height:1.7;background:#1F2433;color:#FFD580;border-radius:8px;padding:9px 12px;margin:8px 0;white-space:pre;overflow-x:auto}
.dd-hl{border-left:3px solid var(--purple);background:var(--purple-lt);color:var(--purple-dk);border-radius:0 8px 8px 0;padding:8px 11px;margin-top:8px;font-size:12px;line-height:1.65}
.side-foot{flex-shrink:0;border-top:1px solid var(--border);padding:10px 18px 12px;background:var(--card)}
.prog{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:9px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--purple));transition:width .3s}
.pills{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:9px}
.pill{width:28px;height:26px;border-radius:7px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-family:var(--mono);font-size:11px;font-weight:600;cursor:pointer;transition:all .13s}
.pill:hover{border-color:#d9c6ec;color:var(--purple);background:var(--purple-lt)}
.pill.on{background:var(--purple);border-color:var(--purple);color:#fff}
.pill-gap{width:6px}
.nav{display:flex;gap:8px}
.nav button{flex:1;padding:9px;font-size:13px;font-weight:700;border:none;border-radius:9px;background:var(--text);color:#fff;cursor:pointer;transition:background .15s}
.nav button:hover:not(:disabled){background:var(--purple)}
.nav button:disabled{background:var(--line);color:var(--label);cursor:not-allowed}
.kbd{font-family:var(--mono);font-size:9.5px;color:var(--label);text-align:center;margin-top:6px;letter-spacing:.06em}

/* takeaway */
.tk-hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:16px}
.tk-hero h2{font-size:24px;font-weight:700;letter-spacing:-.01em}
.tk-hero p{font-family:var(--serif);font-size:14px;color:var(--muted);margin-top:4px}
.tk-btns{display:flex;gap:8px;flex-wrap:wrap}
.tk-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.tk-sec{border:1px solid var(--border);border-radius:12px;padding:14px 16px;background:var(--card)}
.tk-sec h4{font-size:11px;font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--green);margin-bottom:10px}
.pr-list{display:grid;gap:8px}
.pr{display:flex;gap:10px;align-items:flex-start}
.pr .n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--purple);color:#fff;font-family:var(--mono);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
.pr b{display:block;font-size:13px}
.pr span{font-size:12px;color:var(--muted);line-height:1.5}
.tk-table{width:100%;border-collapse:collapse;font-size:12px}
.tk-table th{background:var(--purple);color:#fff;font-weight:600;padding:6px 8px;text-align:left}
.tk-table th:first-child{border-radius:6px 0 0 0}.tk-table th:last-child{border-radius:0 6px 0 0}
.tk-table td{padding:6px 8px;border-bottom:1px solid var(--line)}
.tk-table td:nth-child(2){color:var(--purple-dk);font-family:var(--mono);font-size:11.5px}
.tk-table td:nth-child(3){color:var(--muted);font-family:var(--mono);font-size:11.5px}
.tk-table tr:nth-child(even) td{background:#FBF8FD}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.kv span:last-child{font-family:var(--mono);color:var(--text);font-weight:600;font-size:12px;text-align:right}
.myths{display:grid;gap:7px}
.myth-row{display:grid;grid-template-columns:1fr 18px 1.3fr;gap:6px;align-items:start;font-size:12px;line-height:1.5}
.myth-row .x{color:var(--coral-dk);text-decoration:line-through;text-decoration-color:rgba(232,85,59,.5)}
.myth-row .a{color:var(--label);text-align:center}
.myth-row .o{color:var(--green-dk)}
.lim-row{display:grid;grid-template-columns:1fr 18px 1fr;gap:6px;font-size:12px;padding:5px 0;border-bottom:1px dashed var(--line)}
.lim-row .a{color:var(--label);text-align:center}
.lim-row span:last-child{color:var(--purple-dk);font-weight:600}
.tk-note{font-size:11px;color:var(--label);margin-top:8px}

/* popup */
.pop{display:none;position:fixed;inset:0;z-index:300;background:rgba(15,18,30,.78);align-items:center;justify-content:center;padding:28px}
.pop.show{display:flex}
.pop-box{position:relative;background:#fff;border-radius:14px;padding:14px;max-width:min(94vw,1100px);max-height:92vh;display:flex;flex-direction:column;gap:8px;box-shadow:0 24px 70px rgba(0,0,0,.45)}
.pop-box img{max-width:100%;max-height:calc(92vh - 80px);object-fit:contain;border-radius:8px;display:block}
.pop-cap{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.5}
.pop-x{position:absolute;top:-13px;right:-13px;width:32px;height:32px;border-radius:50%;border:none;background:var(--text);color:#fff;font-size:15px;cursor:pointer}
.pop-x:hover{background:var(--purple)}

/* responsive */
@media (max-width:1200px){:root{--side:380px}.inst{grid-template-columns:minmax(0,1.2fr) minmax(230px,1fr)}}
@media (max-width:940px){
  html,body{overflow:auto;height:auto}
  .hdr{position:sticky}
  .hdr-sub{display:none}
  .hdr{padding:0 12px;gap:10px}
  .hdr-div{display:none}
  .hdr-logo{height:26px}
  .hdr-title{white-space:normal;font-size:12.5px}
  .lang-btn{padding:3px 9px}
  .app{position:static;display:block}
  .stage{padding:10px 16px}
  .canvas-card{flex:none;height:min(78vw,560px);min-height:300px}
  .inst,.inst.tall{grid-template-columns:1fr;height:auto}
  .inst .icard{min-height:200px}
  .inst .chart{flex:none;height:190px}
  .inst .crow{flex:none;height:190px}
  .inst .crow .chart{height:100%;flex:1 1 0;width:auto;min-width:0}
  .side{border-left:none;border-top:1px solid var(--border)}
  .side-scroll{overflow:visible;padding:16px}
  .side-foot{position:sticky;bottom:0}
  .tk-grid{grid-template-columns:1fr}
  .recipe{overflow-x:auto}
}
</style>
</head>

  steps:[
  { ch:0, title:'Inside a PECVD Chamber',
    lead:'A single-wafer, parallel-plate CCP chamber that deposits SiO₂ from SiH₄ + N₂O. Before anything glows, know where each part sits — and <b>which electrode is powered</b>.',
    body:`<ul>
<li><b>Showerhead</b> — the RF-powered top electrode. Gas fills a plenum and exits through hundreds of small holes.</li>
<li><b>Heater pedestal</b> — the grounded bottom electrode; holds the wafer at 300–400 °C.</li>
<li><b>Chamber wall</b> — also grounded, so the grounded area is larger than the powered area.</li>
<li><b>Ceramic isolator</b> — separates the RF-hot showerhead from the grounded body.</li>
<li><b>RF generator → matching network</b> — 13.56 MHz HF; many tools add a ~400 kHz LF source.</li>
<li><b>Throttle valve + pump</b> — hold 1–5 Torr while gas flows continuously.</li>
<li><b>RPS</b> — remote plasma source for NF₃ chamber cleaning.</li></ul>`,
    co:[['try','Hover over the drawing — or tap a part below — to see what it does.'],
        ['key','Gap ≈ 10 mm, pressure ≈ 2.5 Torr. A molecule travels only ~20–50 µm between collisions — hundreds of collisions across the gap. This one number explains much of what follows.']],
    dd:[{t:'Why a showerhead — and why are its holes so small?', b:`<p><b>Uniform gas supply.</b> Each hole is a small flow restriction. The plenum behind the faceplate equalizes pressure, so every hole delivers nearly the same flow and gas arrives evenly across the 300 mm wafer.</p>
<p><b>No plasma inside the holes.</b> If a hole is wider than roughly the sheath thickness, plasma can ignite inside it as a <i>hollow-cathode discharge</i> — a local hot spot that erodes the faceplate and sheds particles. Hole diameters are therefore kept around a millimetre or below.</p>
<p><b>Spacing is a knob.</b> The showerhead-to-wafer gap (typically ~5–15 mm) changes the electric field, the gas residence time and radial uniformity. It is set by moving the pedestal — part of the recipe.</p>
<div class="dd-hl">The showerhead is three things at once: gas distributor, RF electrode, and a surface that also gets coated — which is why it returns in Step 10.</div>`}] },

  { ch:0, title:'Recipe Start — Pump, Heat, Stabilize',
    lead:'Before RF turns on, the tool brings the wafer to temperature and establishes a stable gas mixture and pressure. No plasma yet — and with N₂O, <b>no chemistry yet</b>.',
    body:`<ul>
<li>Wafer on the heater pedestal → temperature settles (here 350 °C)</li>
<li>MFCs set the flows: SiH₄ ≈ 150 sccm, N₂O <b>20–100× larger</b> (here 40 : 1)</li>
<li>The throttle valve closes until the capacitance manometer reads the setpoint (here 2.5 Torr)</li>
<li>Gas flows radially outward over the wafer, around the pedestal and down to the pump</li></ul>`,
    co:[['try','Switch the oxidant to O₂ — no plasma, no RF — and watch what happens.'],
        ['myth','“N₂O is used because it is safer.” The real reason: SiH₄ + O₂ reacts spontaneously in the gas phase and forms SiO₂ powder before reaching the wafer. N₂O stays inert with SiH₄ until plasma electrons break it — so chemistry happens only where and when the plasma is.'],
        ['warn','Display: SiH₄ is drawn at 1 : 10 so it stays visible; the real ratio here is ≈ 1 : 40.']],
    dd:[{t:'Choosing the oxygen source: N₂O, O₂ or TEOS', b:`<p><b>SiH₄ + O₂</b> reacts without plasma. That is used on purpose in thermal LTO (~400 °C), but in a Torr-range PECVD gap it nucleates particles in the gas phase.</p>
<p><b>SiH₄ + N₂O</b> needs electron impact to release O. The cost: a little nitrogen and hydrogen end up in the film (Si–N, N–H, Si–H). A large N₂O excess pushes the film toward stoichiometric SiO₂ (refractive index ≈ 1.46).</p>
<p><b>Too little N₂O</b> gives a silicon-rich oxide: the refractive index rises above 1.46 and Si–H bonds increase. The N₂O/SiH₄ ratio is one of the first numbers checked when RI drifts.</p>
<p><b>TEOS + O₂</b> is the other workhorse PECVD oxide. Its surface chemistry gives better step coverage, at the price of carbon and moisture management — a lesson of its own.</p>`}] },

  { ch:1, title:'Ignition — Seed Electrons to Avalanche',
    lead:'An electric field cannot ionize a neutral molecule directly — there is no charge to push. The field gives energy to the few free electrons already present, and <b>they</b> do the rest.',
    body:`<ul>
<li><b>Seed electrons</b> are always present: cosmic rays, natural radioactivity, leftover charge</li>
<li>The field accelerates them (a = qE/m); above ~13 eV they ionize N₂O: <code>e⁻ + N₂O → N₂O⁺ + 2e⁻</code></li>
<li>Each ionization adds an electron → <b>avalanche</b>: exponential growth, over in microseconds</li>
<li>Whether it lights depends on <b>pressure × gap (pd)</b> — Paschen's law</li></ul>`,
    co:[['try','Set pressure and gap, then press <b>Strike</b>. Can you find a pd where the plasma will not light with the 500 V available?'],
        ['key','Recipe conditions (2.5 Torr × 1 cm) sit on the gentle right side of the Paschen minimum — that is why PECVD strikes reliably.']],
    dd:[{t:"Townsend's criterion & Paschen's law", b:`<p>Electrons multiply with the first Townsend coefficient α = A·p·exp(−B·p/E). Breakdown occurs when each electron leaving the gap leaves enough ions behind to release, on average, one new electron from the cathode (secondary emission γ):</p>
<div class="eq">γ·(e^(αd) − 1) = 1
⟹  V_b = B·pd / [ ln(A·pd) − ln(ln(1 + 1/γ)) ]</div>
<p><b>Left of the minimum</b> (low pd): too few collisions — electrons reach the electrode before they can ionize. <b>Right of the minimum</b> (high pd): too many collisions — electrons lose energy before reaching the ionization threshold.</p>
<p>The chart uses DC coefficients for N₂ (A = 12 cm⁻¹Torr⁻¹, B = 342 V·cm⁻¹Torr⁻¹, γ = 0.05) as a proxy. In RF, electrons oscillate inside the gap instead of being swept out, so RF breakdown is usually lower and less dependent on γ — but the trend with pd is the same.</p>
<div class="dd-hl">The field pumps energy into <b>electrons</b>; electrons hand it to molecules by collision. That is why T<sub>e</sub> (a few eV ≈ tens of thousands of K) is far above the gas temperature (~400–600 K).</div>`}] },

  { ch:1, title:"Sustaining the Plasma — Electrons Follow, Ions Don't",
    lead:'At 13.56 MHz the light electrons respond within each cycle; the heavy ions feel only the time-averaged field. The result: <b>two sheaths that breathe in and out, opposite in phase</b>.',
    body:`<ul>
<li><b>Bulk plasma</b> — quasi-neutral, nearly field-free, glowing</li>
<li><b>Sheaths</b> — thin (~0.5–1.5 mm) electron-depleted layers that carry almost all the voltage; the bulk fills most of the gap</li>
<li>Each cycle one sheath collapses (a burst of electrons reaches that electrode) while the other expands: the <b>electron cloud sloshes</b></li>
<li><b>Ions</b> are pulled <b>outward to both electrodes</b> by the time-averaged sheath field — they never reverse with the RF</li>
<li>The plasma potential is always the most positive point in the chamber</li></ul>`,
    co:[['try','Increase A<sub>gnd</sub>/A<sub>pwr</sub>. The showerhead develops a negative DC self-bias and the wafer-side sheath voltage drops.'],
        ['myth','“Ions swing back and forth with the RF polarity.” The ion plasma frequency here is only ~1–5 MHz — below 13.56 MHz — so ions see just the average field.'],
        ['key','The glow is brightest at whichever sheath edge is <b>expanding</b>: electrons are heated there by the moving sheath (stochastic heating). Watch the bands.']],
    dd:[{t:'How much faster are electrons — and can ions follow the RF?', b:`<p>An O⁺ ion is ~2.9×10⁴ times heavier than an electron; N₂O⁺ ~8.1×10⁴. In the same field a = qE/m, so electrons respond essentially instantly.</p>
<p>The cleaner test is each species' natural response frequency, the plasma frequency f = (1/2π)·√(n e² / ε₀ m):</p>
<div class="eq">n = 10¹⁰ cm⁻³ :
  f_pe          ≈ 0.9 GHz  ≫ 13.56 MHz  → electrons follow
  f_pi (N₂O⁺)  ≈ 3 MHz    < 13.56 MHz  → ions see the average</div>
<p>Ions also need many RF cycles to cross a ~1 mm collisional sheath, so their energy is set by the <b>time-averaged</b> sheath voltage. An LF source (~400 kHz) is slower than f_pi — ions <i>can</i> follow it, which is exactly why LF raises ion energy (Step 6).</p>`},
        {t:'Self-bias: why the wafer sits on the grounded side', b:`<p>The match has a series (blocking) capacitor, so the powered electrode can float to a DC offset. The two time-averaged sheath voltages divide roughly as the inverse area ratio to a power:</p>
<div class="eq">V̄_pwr / V̄_gnd ≈ (A_gnd / A_pwr)^q     q ≈ 1–2.5  (this sim: 1.5)
V_dc (self-bias) = V̄_gnd − V̄_pwr</div>
<p>In a real PECVD chamber the grounded area (pedestal + walls) exceeds the showerhead area, so the showerhead self-biases negative and carries the larger sheath. The wafer, on the grounded pedestal, sees the <b>smaller</b> sheath — tens of volts.</p>
<p><b>Not the same as floating potential.</b> An isolated surface charges until electron and ion fluxes balance — a few T<sub>e</sub> below the plasma potential. Self-bias is a DC offset of the RF-powered electrode, created by asymmetry and the blocking capacitor. A perfectly symmetric reactor has ~zero self-bias, yet each sheath still averages about half the RF amplitude.</p>`},
        {t:'How thick is the sheath — and why not thicker?', b:`<p>The sheath scale is set by the Debye length λ_D = 7430·√(Tₑ/nₑ) m (Tₑ in eV, nₑ in m⁻³). With Tₑ ≈ 3 eV and nₑ ≈ 10¹⁰ cm⁻³, λ_D ≈ 0.13 mm. A sheath that holds V volts is many Debye lengths thick (Child law):</p>
<div class="eq">collisionless:  s ≈ 0.47·λ_D·(2V/Tₑ)^(3/4)
   V = 50 V → 0.85 mm      V = 150 V → 1.9 mm
collisional (2.5 Torr, λ_i ≈ 60 µm) → thinner:
   V = 50 V → ≈ 0.7 mm     V = 150 V → ≈ 1.3 mm</div>
<p>So in a 10 mm PECVD gap the two sheaths take only ~15–25 %; most of the gap is glowing bulk. Dark spaces several millimetres thick appear only at low density (≲ 10⁹ cm⁻³) or low pressure.</p>
<p><b>More power does not mean a thicker sheath.</b> In collisional scaling s ∝ V^0.6 · nₑ^−0.4 · p^−0.2. Raising RF power raises nₑ roughly in step with V_rf, so the two effects nearly cancel: the plasma gets denser while the sheath barely changes.</p>
<div class="dd-hl">This simulation uses s ≈ (0.15 + 0.043·V^0.6) mm × (V_rf / 220 V)^−0.4 × (p / 2.5 Torr)^−0.2. The same model drives the canvas, the V(x, t) chart and the IEDF in Step 6.</div>`}] },

  { ch:1, title:'Why RF — Not DC?',
    lead:'A DC glow discharge runs fine between metal electrodes — that is how DC sputtering works. It fails here because <b>PECVD coats every surface with an insulator</b>.',
    body:`<ul>
<li><b>DC + bare metal</b> — ions striking the cathode release secondary electrons (γ); current closes through the metal → steady glow</li>
<li><b>DC + SiO₂-coated</b> — charge piles up on the insulating surfaces (+ on the cathode side, − on the anode side) and cancels the applied voltage within ~0.1 ms → the plasma dies</li>
<li><b>RF</b> — polarity reverses every 37 ns. Ion charge collected in one half-cycle is neutralized by the electron burst of the next; current crosses the film as <b>displacement current</b></li></ul>`,
    co:[['try','Try all four combinations: source (RF / DC) × electrode surface (metal / coated).'],
        ['key','In PECVD the showerhead, walls and wafer are all being coated with dielectric. Capacitive (RF) coupling is not optional — it is the only way current gets through.']],
    dd:[{t:'Displacement current — and why 13.56 MHz?', b:`<p>A dielectric film is a capacitor: it passes current only while the voltage across it changes, I = C·dV/dt. Under DC, dV/dt → 0 once charged. How fast?</p>
<div class="eq">100 nm SiO₂ :  C/A = ε₀·3.9 / 100 nm ≈ 3.5×10⁻⁴ F/m²
J_ion ≈ 1 A/m² (0.1 mA/cm²)  →  dV/dt ≈ 3 V/µs
→ a few hundred volts cancelled in ~0.1 ms</div>
<p>At 13.56 MHz a half-cycle lasts only 37 ns, so the surface voltage moves by ~0.1 V before the polarity flips — negligible. That is capacitive coupling.</p>
<p><b>Why 13.56 MHz?</b> It is an ISM frequency reserved for industrial use (with harmonics 27.12 and 40.68 MHz), so it can leak without disturbing communications. Higher frequencies (VHF) give more density at the same voltage; low frequencies (~400 kHz, below f_pi) let ions follow the field and raise ion energy — the basis of dual-frequency PECVD for stress control.</p>`}] },

  { ch:1, title:'Ion Bombardment at the Wafer',
    lead:'Ions cross the wafer-side sheath and strike the growing film. At PECVD pressures their energy is set less by the sheath voltage than by <b>how many collisions they suffer on the way</b>.',
    body:`<ul>
<li>Upper limit: E ≤ e·V̄<sub>sheath</sub> — tens of volts at the grounded wafer</li>
<li>At 1–5 Torr the ion mean free path (~30–150 µm) is far shorter than the sheath (~0.5–1 mm): the sheath is <b>collisional</b></li>
<li>Charge-exchange collisions leave a slow ion and a fast neutral → a broad IEDF piled up at low energy</li>
<li>A few to ~20 eV aids surface mobility → denser film, less H. LF power raises the energy → more compressive stress</li></ul>`,
    co:[['try','Lower the pressure or add LF power and watch the IEDF move to higher energy.'],
        ['myth','“Ion bombardment always damages the film.” At PECVD pressures most ions arrive with only a few eV. Sputtering and bond damage need roughly ≳ 50 eV — reached only with strong LF bias or at low pressure.']],
    dd:[{t:'The collisional sheath in numbers', b:`<div class="eq">n_g  = p / k_B·T        (2.5 Torr, 450 K → 5.4×10²² m⁻³)
λ_i  = 1 / (n_g·σ_cx)   (σ_cx ≈ 3×10⁻¹⁹ m² → λ_i ≈ 60 µm)
s ≈ 0.6–1 mm  →  s/λ_i ≈ 10–15 collisions</div>
<p>In a collisional sheath the potential grows roughly as Φ ∝ z^(5/3). An ion gains energy only after its <b>last</b> collision, so E = V̄·[1 − (z_c/s)^(5/3)], where z_c is that last collision point — usually close to the wafer. The IEDF therefore peaks near zero with a tail reaching e·V̄.</p>
<p>Compare dry etch at a few mTorr: λ_i ≫ s, so ions cross collision-free and arrive with nearly the full e·V̄ — often hundreds of eV. Same physics, different regime.</p>
<div class="dd-hl">Simplifications: every collision is treated as full charge exchange, sheath width uses the collisional Child-law scaling of Step 4, and the HF modulation is averaged out (ion transit ≫ 74 ns). Thresholds on the chart are order-of-magnitude guides; they depend on ion species, angle and film.</div>`}] },

  { ch:1, title:'Plasma Chemistry & Glow',
    lead:'Electrons with a few eV drive the chemistry: they break N₂O and SiH₄ into reactive radicals and excite atoms that emit light. <b>The glow is a spectrum you can read.</b>',
    body:`<ul>
<li><code>e⁻ + SiH₄ → SiH₃· + H· + e⁻</code> — dissociation (≈ 8 eV)</li>
<li><code>e⁻ + N₂O → N₂ + O· + e⁻</code> — dissociation</li>
<li><code>e⁻ + N₂O → N₂ + O⁻</code> — dissociative attachment (≈ 2 eV): N₂O is <b>electronegative</b></li>
<li><code>e⁻ + N₂O → N₂O⁺ + 2e⁻</code> — ionization (≈ 12.9 eV)</li>
<li>Excitation → emission: O 777 nm, SiH 414 nm, H<sub>α</sub> 656 nm, N₂ 337 nm</li>
<li>The ionization degree is only ~10⁻⁷–10⁻⁶: radicals vastly outnumber ions</li></ul>`,
    co:[['try','Change N₂O/SiH₄ and RF power — the optical emission spectrum (OES) shifts. Fabs watch these lines to monitor stability and to find the endpoint of chamber cleans.'],
        ['myth','“The glow comes from ions recombining with electrons.” At these pressures electron–ion recombination in the gas is negligible; charged particles are lost at the walls. The light is electron-impact excitation followed by de-excitation.']],
    dd:[{t:'N₂O is electronegative — what changes?', b:`<p>Dissociative attachment (e⁻ + N₂O → N₂ + O⁻) has a large cross-section near 2 eV, so part of the electrons is converted into negative ions.</p>
<ul><li><b>O⁻ is trapped</b> in the bulk: the sheaths repel negative charge, so it cannot reach the walls. It is lost by detachment or by ion–ion recombination with positive ions — the one volume recombination that does matter.</li>
<li><b>Fewer free electrons</b>: to keep ionization going, the remaining electrons run slightly hotter.</li>
<li><b>Reading OES</b>: line intensity ∝ (density of the emitter) × (electron excitation rate). Ratios such as O 777 / SiH 414 track trends; adding a known inert tracer (actinometry) makes them semi-quantitative.</li></ul>`}] },

  { ch:2, title:'Deposition — Radicals Build the Film',
    lead:'Neutral radicals, not ions, carry most of the film. They random-walk through the gas and react on whatever surface they reach — <b>the wafer included</b>.',
    body:`<ul>
<li>SiH₃· and O· are created in the bulk by electron impact</li>
<li>No field pushes them: they <b>diffuse</b>. Surfaces consume them, so concentration falls toward each electrode (see profile)</li>
<li>At the surface a <b>reaction probability</b> decides whether a radical bonds or bounces</li>
<li>Growth is <b>continuous</b>: thickness = rate × time (silane oxide: typically a few hundred nm/min)</li>
<li>Byproducts (N₂, H₂, H₂O) leave through the pump — and the showerhead gets coated too</li>
<li>Idealized net reaction: <code>SiH₄ + 2N₂O → SiO₂ + 2N₂ + 2H₂</code></li></ul>`,
    co:[['try','Watch the radical profile: highest mid-gap, falling toward both electrodes. That gradient is what delivers radicals to the wafer.'],
        ['myth','“PECVD grows the film one monolayer at a time.” That is ALD (self-limiting, cycled). PECVD is continuous: radicals arrive and react everywhere at once.'],
        ['key','Wafer color = oxide thickness (thin-film interference). Engineers read it at a glance: ~100 nm violet, ~150 nm light blue, ~200 nm gold.']],
    dd:[{t:'How radicals reach the wafer — and what sets film quality', b:`<div class="eq">Fick's law :  J = −D · dn/dx        D ∝ 1/p</div>
<p><b>Diffusion dominates.</b> Higher pressure shortens the mean free path and slows diffusion; radicals then spend longer in the gas, which favors gas-phase reactions (and particles).</p>
<p><b>Convective flow is secondary.</b> Gas moves radially outward over the wafer to the pump; it shapes the edge profile more than it delivers radicals.</p>
<p><b>Reaction probability shapes conformality.</b> SiH₃ reacts with a relatively low probability, so it can bounce and reach sidewalls — moderate step coverage. Highly reactive fragments (SiH₂, SiH, O) stick almost on contact and deposit near the top of features.</p>
<p><b>Temperature sets hydrogen content.</b> At lower temperature Si–OH and Si–H survive in the film → lower density and a faster wet-etch rate. Within the thermal budget (BEOL ≤ ~400 °C), hotter is better.</p>
<div class="dd-hl">Here the radicals do a genuine random walk with absorbing surfaces — the gradient in the chart emerges by itself; nothing pushes them downward.</div>`}] },

  { ch:2, title:'The Process Window',
    lead:'Every knob moves several film properties at once. Find a recipe that meets the spec — and <b>feel the trade-offs</b>.',
    body:`<ul>
<li><b>HF power</b> → more dissociation → higher rate; too much → particles, non-uniformity</li>
<li><b>Pressure</b> → residence time, diffusion, ion energy (higher p = gentler bombardment)</li>
<li><b>Temperature</b> → hydrogen out-diffusion: hotter = denser, lower wet-etch rate</li>
<li><b>N₂O / SiH₄</b> → stoichiometry: low ratio = Si-rich, RI ↑</li>
<li><b>Gap</b> → field distribution and uniformity</li>
<li><b>LF power</b> → ion energy → compressive stress, density</li></ul>`,
    co:[['try','Target: RI 1.46 ± 0.01 · stress −100 to −250 MPa · uniformity &lt; 2 % (1σ) · WER &lt; 2.5× thermal oxide.'],
        ['warn','Teaching model: the trends follow typical silane-oxide PECVD behavior, but the numbers are illustrative — not calibrated to any specific tool.']],
    dd:[{t:'Why the knobs are coupled', b:`<p><b>One HF power does two jobs.</b> It sets both radical production (rate) and sheath voltage (ion energy). Dual-frequency tools split them: HF for density, LF for ion energy.</p>
<p><b>Pressure trades rate against uniformity and particles.</b> Higher pressure raises residence time and gas-phase reactions; lower pressure raises ion energy.</p>
<p><b>Temperature is capped by the thermal budget.</b> Over finished metal (BEOL) ~400 °C is the ceiling, so film quality must then come from ion bombardment (LF) and chemistry.</p>
<div class="dd-hl">That is why recipes are developed with a DOE (design of experiments): a change aimed at one property almost always moves two others.</div>`}] },

  { ch:2, title:'End of Recipe — Purge, Clean & Season',
    lead:'When RF turns off, the plasma vanishes within microseconds. What remains is a chamber coated with oxide, which must be cleaned and re-conditioned so the <b>next</b> wafer gets the same film.',
    body:`<ul>
<li>RF off → purge and pump out the process gas → wafer leaves through the slit valve</li>
<li>Every wafer also coats the showerhead and walls; thick deposits crack and flake → particles</li>
<li><b>NF₃ remote-plasma clean</b>: F radicals from the RPS etch the oxide — <code>SiO₂ + 4F → SiF₄↑ + O₂</code></li>
<li><b>Seasoning</b>: a thin, controlled oxide re-coats the chamber so the next wafer sees the same surfaces</li></ul>`,
    co:[['try','Turn seasoning off and watch the first wafer after each clean drift away from the others.']],
    dd:[{t:'Why chamber surfaces matter — the first-wafer effect', b:`<p>The walls are part of the process. Their condition changes:</p>
<ul><li><b>Radical loss</b> — how readily O· and SiH₃· recombine on the wall, and so how many reach the wafer</li>
<li><b>RF return path & sheath capacitance</b> — a dielectric layer of changing thickness shifts the voltage split and the self-bias</li>
<li><b>Residual fluorine</b> after a clean — it can consume radicals or end up in the next film</li></ul>
<p>A freshly cleaned chamber therefore deposits differently from a “used” one: the <b>first-wafer effect</b>. Seasoning puts the surfaces into a known, reproducible state.</p>
<p><b>Why a remote plasma?</b> Making F in a separate source avoids ion bombardment of the showerhead and heater, which would erode them and create particles. Ceramic heaters (e.g. AlN) and coated or anodized parts resist fluorine; uniform surfaces also avoid local field spikes that trigger micro-arcing.</p>`}] },

    co:[['try','Chamber 그림에 마우스를 올리거나, 아래 부품 버튼을 눌러 역할을 확인하세요.'],
        ['key','Gap ≈ 10 mm, 압력 ≈ 2.5 Torr. 분자는 충돌 사이에 겨우 ~20–50 µm만 이동합니다 — Gap을 건너는 동안 수백 번 충돌한다는 뜻입니다. 이 숫자 하나가 이후 내용의 상당 부분을 설명합니다.']],
    dd:[{t:'Showerhead는 왜 쓰고, 구멍은 왜 그렇게 작을까?', b:`<p><b>균일한 가스 공급.</b> 각 구멍은 작은 유동 저항입니다. Faceplate 뒤의 Plenum이 압력을 균등화하므로 모든 구멍이 거의 같은 유량을 내보내고, 300 mm 웨이퍼 전면에 가스가 고르게 도달합니다.</p>
<p><b>구멍 안에서 Plasma가 켜지면 안 됩니다.</b> 구멍이 대략 Sheath 두께보다 크면 그 안에서 <i>Hollow-Cathode Discharge</i>가 점화될 수 있습니다. 이 국부 Hot Spot은 Faceplate를 침식시키고 파티클을 만듭니다. 그래서 구멍 지름은 보통 1 mm 안팎 이하로 설계합니다.</p>
<p><b>Spacing도 공정 Knob입니다.</b> Showerhead–웨이퍼 간격(보통 ~5–15 mm)은 전기장, 가스 체류 시간, 반경 방향 균일도를 바꿉니다. Pedestal을 올리고 내려 설정하며 Recipe의 일부입니다.</p>
<div class="dd-hl">Showerhead는 가스 분배기이자 RF 전극이고, 동시에 막이 쌓이는 표면이기도 합니다 — 그래서 Step 10에서 다시 등장합니다.</div>`}] },

  { ch:0, title:'Recipe 시작 — Pump, Heat, Stabilize',
    lead:'RF를 켜기 전에 장비는 웨이퍼 온도를 맞추고 가스 조성과 압력을 안정화합니다. 아직 Plasma는 없고, N₂O를 쓰는 한 <b>화학 반응도 아직 없습니다</b>.',
    body:`<ul>
<li>웨이퍼가 Heater Pedestal에 놓이고 온도가 안정화 (여기서는 350 °C)</li>
<li>MFC가 유량 설정: SiH₄ ≈ 150 sccm, N₂O는 그 <b>20–100배</b> (여기서는 40 : 1)</li>
<li>Capacitance Manometer가 설정값(여기서는 2.5 Torr)을 읽을 때까지 Throttle Valve가 닫힘</li>
<li>가스는 웨이퍼 위에서 바깥쪽으로 퍼져 Pedestal을 돌아 Pump로 빠져나감</li></ul>`,
    co:[['try','산화제를 O₂로 바꿔 보세요 — Plasma도 RF도 없는데 무슨 일이 일어날까요?'],
        ['myth','“N₂O는 더 안전해서 쓴다.” 진짜 이유는 SiH₄ + O₂가 기상(gas phase)에서 자발적으로 반응해 웨이퍼에 닿기 전에 SiO₂ 분말(파티클)을 만들기 때문입니다. N₂O는 Plasma 전자가 분해하기 전까지 SiH₄와 반응하지 않으므로, 화학 반응이 Plasma가 있는 곳·있는 동안에만 일어납니다.'],
        ['warn','표시 비율: SiH₄가 보이도록 1 : 10으로 그렸습니다. 이 Recipe의 실제 비율은 ≈ 1 : 40입니다.']],
    dd:[{t:'산소 공급원 선택: N₂O, O₂, TEOS', b:`<p><b>SiH₄ + O₂</b>는 Plasma 없이도 반응합니다. 열 LTO(~400 °C)에서는 이를 일부러 이용하지만, Torr 영역의 PECVD Gap에서는 기상에서 파티클이 핵생성됩니다.</p>
<p><b>SiH₄ + N₂O</b>는 전자 충돌이 있어야 O가 나옵니다. 대가로 약간의 질소와 수소가 막에 들어갑니다(Si–N, N–H, Si–H). N₂O를 크게 과량으로 쓰면 막이 화학량론적 SiO₂(굴절률 ≈ 1.46)에 가까워집니다.</p>
<p><b>N₂O가 부족하면</b> Si-rich 산화막이 됩니다: 굴절률이 1.46보다 커지고 Si–H 결합이 늘어납니다. RI가 흔들리면 가장 먼저 확인하는 숫자가 N₂O/SiH₄ 비율입니다.</p>
<p><b>TEOS + O₂</b>는 또 하나의 대표적인 PECVD 산화막입니다. 표면 반응 특성상 Step Coverage가 더 좋지만 탄소·수분 관리가 필요합니다 — 별도 강의 주제입니다.</p>`}] },

  { ch:1, title:'점화 — Seed Electron에서 Avalanche까지',
    lead:'전기장은 중성 분자를 직접 이온화할 수 없습니다 — 밀어낼 전하가 없기 때문입니다. 전기장은 이미 존재하는 소수의 자유전자에 에너지를 주고, 나머지는 <b>전자</b>가 해냅니다.',
    body:`<ul>
<li><b>Seed Electron</b>은 항상 존재: 우주선, 자연 방사선, 잔류 전하</li>
<li>전기장이 전자를 가속(a = qE/m) → ~13 eV 이상이면 N₂O를 이온화: <code>e⁻ + N₂O → N₂O⁺ + 2e⁻</code></li>
<li>이온화마다 전자가 하나씩 늘어남 → <b>Avalanche</b>: 지수적 증가, 실제로는 수 µs 안에 끝남</li>
<li>점화 여부는 <b>압력 × Gap (pd)</b>에 달려 있음 — Paschen 법칙</li></ul>`,
    co:[['try','압력과 Gap을 정하고 <b>Strike</b>를 누르세요. 가용 전압 500 V로는 점화되지 않는 pd를 찾을 수 있나요?'],
        ['key','Recipe 조건(2.5 Torr × 1 cm)은 Paschen 최소점의 완만한 오른쪽에 있습니다 — PECVD가 안정적으로 점화되는 이유입니다.']],
    dd:[{t:'Townsend 조건과 Paschen 법칙', b:`<p>전자는 1차 Townsend 계수 α = A·p·exp(−B·p/E)로 증식합니다. Gap을 빠져나가는 전자 하나가 남긴 이온들이 Cathode에서 평균 하나의 새 전자(2차 전자 방출 γ)를 만들어 내면 방전이 개시됩니다:</p>
<div class="eq">γ·(e^(αd) − 1) = 1
⟹  V_b = B·pd / [ ln(A·pd) − ln(ln(1 + 1/γ)) ]</div>
<p><b>최소점 왼쪽</b>(낮은 pd): 충돌이 너무 적음 — 전자가 이온화하기 전에 전극에 도달합니다. <b>최소점 오른쪽</b>(높은 pd): 충돌이 너무 많음 — 전자가 이온화 에너지에 도달하기 전에 에너지를 잃습니다.</p>
<p>차트는 N₂의 DC 계수(A = 12 cm⁻¹Torr⁻¹, B = 342 V·cm⁻¹Torr⁻¹, γ = 0.05)를 근사로 사용합니다. RF에서는 전자가 매 주기 쓸려나가지 않고 Gap 안에서 진동하므로, 보통 방전 개시 전압이 더 낮고 γ 의존성도 약합니다 — 하지만 pd에 대한 경향은 같습니다.</p>
<div class="dd-hl">전기장은 <b>전자</b>에 에너지를 주고, 전자가 충돌로 분자에 전달합니다. 그래서 T<sub>e</sub>(수 eV ≈ 수만 K)가 가스 온도(~400–600 K)보다 훨씬 높습니다.</div>`}] },

  { ch:1, title:'Plasma 유지 — 전자는 따라가고, 이온은 못 따라간다',
    lead:'13.56 MHz에서 가벼운 전자는 매 주기 안에 반응하지만, 무거운 이온은 시간 평균된 전기장만 느낍니다. 그 결과 <b>두 Sheath가 서로 반대 위상으로 숨을 쉬듯</b> 늘었다 줄었다 합니다.',
    body:`<ul>
<li><b>Bulk Plasma</b> — 준중성, 전기장이 거의 없고, 발광하는 영역</li>
<li><b>Sheath</b> — 전압 대부분이 걸리는 얇은(~0.5–1.5 mm) 전자 결핍층; Gap의 대부분은 Bulk가 차지</li>
<li>매 주기 한쪽 Sheath가 붕괴(그 순간 전자 다발이 전극에 도달)하고 다른 쪽은 팽창: <b>전자 구름이 출렁임</b></li>
<li><b>이온</b>은 시간 평균 Sheath 전기장에 의해 <b>양쪽 전극 바깥 방향으로</b> 가속 — RF에 따라 방향이 바뀌지 않음</li>
<li>Plasma 전위는 항상 Chamber 안에서 가장 높은(+) 전위</li></ul>`,
    co:[['try','A<sub>gnd</sub>/A<sub>pwr</sub>를 키워 보세요. Showerhead에 음(−)의 DC Self-Bias가 생기고, 웨이퍼 쪽 Sheath 전압은 줄어듭니다.'],
        ['myth','“이온이 RF 극성에 따라 위아래로 왕복한다.” 여기서 이온 Plasma 주파수는 ~1–5 MHz로 13.56 MHz보다 낮습니다. 그래서 이온은 평균 전기장만 느낍니다.'],
        ['key','발광은 <b>팽창 중인</b> Sheath 경계에서 가장 밝습니다. 움직이는 Sheath가 전자를 가열하기 때문입니다(Stochastic Heating). 밝은 띠를 관찰하세요.']],
    dd:[{t:'전자는 얼마나 빠르고, 이온은 RF를 따라갈 수 있을까?', b:`<p>O⁺ 이온은 전자보다 ~2.9×10⁴배, N₂O⁺는 ~8.1×10⁴배 무겁습니다. 같은 전기장에서 a = qE/m이므로 전자는 사실상 즉시 반응합니다.</p>
<p>더 정확한 기준은 각 입자의 고유 응답 주파수인 Plasma 주파수 f = (1/2π)·√(n e² / ε₀ m)입니다:</p>
<div class="eq">n = 10¹⁰ cm⁻³ :
  f_pe          ≈ 0.9 GHz  ≫ 13.56 MHz  → 전자는 따라감
  f_pi (N₂O⁺)  ≈ 3 MHz    < 13.56 MHz  → 이온은 평균만 느낌</div>
<p>이온은 ~1 mm 충돌성 Sheath를 건너는 데에도 여러 RF 주기가 걸리므로, 에너지는 <b>시간 평균</b> Sheath 전압으로 정해집니다. LF(~400 kHz)는 f_pi보다 느려서 이온이 따라갈 <i>수 있고</i> — 바로 그래서 LF가 이온 에너지를 높입니다(Step 6).</p>`},
        {t:'Self-Bias: 웨이퍼를 접지 쪽에 두는 이유', b:`<p>Match에는 직렬(Blocking) Capacitor가 있어 RF 전극이 DC 오프셋으로 떠 있을 수 있습니다. 두 Sheath의 시간 평균 전압은 대략 면적비의 역수의 거듭제곱으로 나뉩니다:</p>
<div class="eq">V̄_pwr / V̄_gnd ≈ (A_gnd / A_pwr)^q     q ≈ 1–2.5  (이 시뮬레이션: 1.5)
V_dc (Self-Bias) = V̄_gnd − V̄_pwr</div>
<p>실제 PECVD Chamber는 접지 면적(Pedestal + 벽)이 Showerhead보다 크므로, Showerhead가 음(−)으로 Self-Bias되어 큰 Sheath를 떠안습니다. 접지 Pedestal 위의 웨이퍼는 <b>작은</b> Sheath — 수십 V — 만 봅니다.</p>
<p><b>Floating 전위와 다릅니다.</b> 고립된 표면은 전자·이온 Flux가 같아질 때까지 Charging되어 Plasma 전위보다 수 T<sub>e</sub> 낮은 전위에 머뭅니다. Self-Bias는 비대칭과 Blocking Capacitor 때문에 RF 전극에 생기는 DC 오프셋입니다. 완전 대칭 반응기의 Self-Bias는 ~0이지만, 각 Sheath는 여전히 평균 RF 진폭의 절반 정도를 가집니다.</p>`},
        {t:'Sheath는 얼마나 두꺼울까 — 왜 더 두껍지 않을까?', b:`<p>Sheath의 길이 척도는 Debye 길이 λ_D = 7430·√(Tₑ/nₑ) m (Tₑ는 eV, nₑ는 m⁻³)입니다. Tₑ ≈ 3 eV, nₑ ≈ 10¹⁰ cm⁻³이면 λ_D ≈ 0.13 mm. 전압 V를 지탱하는 Sheath는 Debye 길이의 수 배~수십 배 두께입니다(Child 법칙):</p>
<div class="eq">무충돌:  s ≈ 0.47·λ_D·(2V/Tₑ)^(3/4)
   V = 50 V → 0.85 mm      V = 150 V → 1.9 mm
충돌성 (2.5 Torr, λ_i ≈ 60 µm) → 더 얇아짐:
   V = 50 V → ≈ 0.7 mm     V = 150 V → ≈ 1.3 mm</div>
<p>즉 10 mm PECVD Gap에서 두 Sheath가 차지하는 비율은 ~15–25 %에 불과하고, Gap 대부분은 발광하는 Bulk입니다. 수 mm 두께의 Dark Space는 밀도가 낮거나(≲ 10⁹ cm⁻³) 압력이 낮은 조건에서나 나타납니다.</p>
<p><b>파워를 올린다고 Sheath가 두꺼워지지 않습니다.</b> 충돌성 Scaling에서 s ∝ V^0.6 · nₑ^−0.4 · p^−0.2입니다. RF 파워를 올리면 V_rf와 함께 nₑ도 대략 비례해 커지므로 두 효과가 거의 상쇄됩니다: Plasma는 더 조밀해지고 Sheath 두께는 거의 그대로입니다.</p>
<div class="dd-hl">이 시뮬레이션은 s ≈ (0.15 + 0.043·V^0.6) mm × (V_rf / 220 V)^−0.4 × (p / 2.5 Torr)^−0.2를 사용합니다. 같은 모델이 Canvas, V(x, t) 차트, Step 6의 IEDF를 모두 구동합니다.</div>`}] },

  { ch:1, title:'왜 DC가 아닌 RF인가?',
    lead:'DC Glow 방전은 금속 전극 사이에서 잘 유지됩니다 — DC Sputtering이 그렇게 동작합니다. 여기서 실패하는 이유는 <b>PECVD가 모든 표면을 절연막으로 덮기 때문</b>입니다.',
    body:`<ul>
<li><b>DC + 금속 노출</b> — Cathode에 충돌한 이온이 2차 전자(γ)를 방출하고, 전류가 금속을 통해 닫힘 → 안정적 Glow</li>
<li><b>DC + SiO₂ 코팅</b> — 절연 표면에 전하가 쌓여(Cathode 쪽 +, Anode 쪽 −) ~0.1 ms 안에 인가 전압을 상쇄 → Plasma 소멸</li>
<li><b>RF</b> — 37 ns마다 극성 반전. 반주기 동안 모인 이온 전하를 다음 반주기의 전자 다발이 중화하고, 전류는 막을 <b>변위 전류</b>로 통과</li></ul>`,
    co:[['try','네 가지 조합을 모두 해보세요: 전원(RF / DC) × 전극 표면(금속 / 코팅).'],
        ['key','PECVD에서는 Showerhead, 벽, 웨이퍼 모두에 절연막이 쌓이고 있습니다. 용량성(RF) 결합은 선택이 아니라 전류가 통과할 유일한 방법입니다.']],
    dd:[{t:'변위 전류 — 그리고 왜 13.56 MHz인가?', b:`<p>절연막은 Capacitor입니다: 양단 전압이 변할 때만 전류가 흐릅니다, I = C·dV/dt. DC에서는 충전이 끝나면 dV/dt → 0. 얼마나 빨리 충전될까요?</p>
<div class="eq">100 nm SiO₂ :  C/A = ε₀·3.9 / 100 nm ≈ 3.5×10⁻⁴ F/m²
J_ion ≈ 1 A/m² (0.1 mA/cm²)  →  dV/dt ≈ 3 V/µs
→ 수백 V가 ~0.1 ms 안에 상쇄됨</div>
<p>13.56 MHz의 반주기는 37 ns에 불과하므로, 극성이 바뀌기 전 표면 전압 변화는 ~0.1 V로 무시할 수 있습니다. 이것이 용량성 결합입니다.</p>
<p><b>왜 13.56 MHz?</b> 산업용으로 할당된 ISM 주파수(고조파 27.12, 40.68 MHz)라서 누설되어도 통신을 방해하지 않습니다. 더 높은 주파수(VHF)는 같은 전압에서 더 높은 밀도를, 낮은 주파수(~400 kHz, f_pi 이하)는 이온이 전기장을 따라가게 해 이온 에너지를 높입니다 — 응력 제어용 Dual-Frequency PECVD의 원리입니다.</p>`}] },

  { ch:1, title:'웨이퍼의 Ion Bombardment',
    lead:'이온은 웨이퍼 쪽 Sheath를 건너 성장 중인 막에 충돌합니다. PECVD 압력에서는 이온 에너지가 Sheath 전압보다 <b>도중에 몇 번 충돌하느냐</b>에 더 크게 좌우됩니다.',
    body:`<ul>
<li>상한: E ≤ e·V̄<sub>sheath</sub> — 접지 웨이퍼에서는 수십 V</li>
<li>1–5 Torr에서 이온 평균 자유 행정(~30–150 µm)은 Sheath(~0.5–1 mm)보다 훨씬 짧음: <b>충돌성(Collisional) Sheath</b></li>
<li>전하교환 충돌이 느린 이온과 고속 중성입자를 남김 → 저에너지 쪽에 몰린 넓은 IEDF</li>
<li>수~20 eV는 표면 이동도를 높여 막을 치밀하게 하고 H를 줄임. LF 파워는 에너지를 높여 압축 응력을 키움</li></ul>`,
    co:[['try','압력을 낮추거나 LF 파워를 더해 IEDF가 높은 에너지 쪽으로 이동하는 것을 확인하세요.'],
        ['myth','“Ion Bombardment는 항상 막을 손상시킨다.” PECVD 압력에서 대부분의 이온은 수 eV로 도달합니다. Sputtering·결합 손상에는 대략 ≳ 50 eV가 필요하며, 강한 LF 바이어스나 낮은 압력에서만 그 영역에 들어갑니다.']],
    dd:[{t:'숫자로 보는 충돌성 Sheath', b:`<div class="eq">n_g  = p / k_B·T        (2.5 Torr, 450 K → 5.4×10²² m⁻³)
λ_i  = 1 / (n_g·σ_cx)   (σ_cx ≈ 3×10⁻¹⁹ m² → λ_i ≈ 60 µm)
s ≈ 0.6–1 mm  →  s/λ_i ≈ 10–15 회 충돌</div>
<p>충돌성 Sheath의 전위는 대략 Φ ∝ z^(5/3)로 증가합니다. 이온은 <b>마지막</b> 충돌 이후에만 에너지를 얻으므로 E = V̄·[1 − (z_c/s)^(5/3)]이고, 마지막 충돌 지점 z_c는 대개 웨이퍼 가까이에 있습니다. 그래서 IEDF는 0 근처에서 최대이고 꼬리가 e·V̄까지 이어집니다.</p>
<p>수 mTorr의 Dry Etch와 비교하면: λ_i ≫ s이므로 이온이 충돌 없이 건너 거의 e·V̄ 전체 — 흔히 수백 eV — 로 도달합니다. 같은 물리, 다른 영역입니다.</p>

<script>
'use strict';
/* ============================== ENGINE ============================== */
const $=id=>document.getElementById(id);

const clamp=(v,a,b)=>v<a?a:v>b?b:v;

/* ---------- canvas & logical frame (960×600, letterboxed) ---------- */
const cv=$('cv'), ctx=cv.getContext('2d'), wrap=$('cvWrap');
const LW=960, LH=600;
let DPR=1, RS=1, OX=0, OY=0;
function resize(){
  const w=wrap.clientWidth, h=wrap.clientHeight; if(!w||!h) return;
  DPR=window.devicePixelRatio||1;
  cv.width=Math.round(w*DPR); cv.height=Math.round(h*DPR);
  RS=Math.min(w/LW,h/LH); OX=(w-LW*RS)/2; OY=(h-LH*RS)/2;
}
new ResizeObserver(resize).observe(wrap); resize();
function beginFrame(){
  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height);

/* ---------- plasma (RF sheath model) ----------
   Sheath voltages: V̄_gnd = V0/(1+R), V̄_pwr = V0 − V̄_gnd, R = (A_gnd/A_pwr)^1.5
   v_top(t) = V̄_pwr(1 − sin φ), v_bot(t) = V̄_gnd(1 + sin φ), V_sh(t) = V_dc + V0 sin φ  */
/* Sheath width — collisional Child-law scaling, calibrated to 2.5 Torr, nₑ ~ 1e10 cm⁻³:
   s ≈ (0.15 + 0.043·V^0.6) mm · (nₑ/nₑ0)^−0.4 · (p/2.5 Torr)^−0.2,  with nₑ ∝ V_rf  */

  const R=Math.pow(ratio,1.5), Vb=V0/(1+R), Vt=V0-Vb, Vdc=Vb-Vt, s=Math.sin(phase), c=Math.cos(phase);
  const vt=Vt*(1-s), vb=Vb*(1+s), nf=Math.pow(V0/220,-.4);
  return {V0,Vb,Vt,Vdc,vt,vb,nf,vsh:Vdc+V0*s,vp:vb,sT:sw(vt,nf),sB:sw(vb,nf),sTm:sw(Vt,nf),sBm:sw(Vb,nf),expT:Math.max(0,-c),expB:Math.max(0,c)};
}

/* ---------- particles & effects ---------- */
function spawn(s,x,y,vx=0,vy=0){const p={s,x,y,vx,vy,age:0};parts.push(p);return p;}
function bulkPt(m=10){return{x:X0+m+rnd()*(X1-X0-2*m),y:YT+45+rnd()*(YB-YT-90)};}
function placeBulk(p){const q=bulkPt();p.x=q.x;p.y=q.y;p.vx=0;p.vy=0;p.age=0;}
function lang_(p,f,kick,drag){p.vx+=(rnd()-.5)*kick*f;p.vy+=(rnd()-.5)*kick*f;const d=Math.pow(drag,f);p.vx*=d;p.vy*=d;}
function boxR(p,x0,x1,y0,y1){if(p.x<x0){p.x=x0;p.vx=Math.abs(p.vx);}if(p.x>x1){p.x=x1;p.vx=-Math.abs(p.vx);}if(p.y<y0){p.y=y0;p.vy=Math.abs(p.vy);}if(p.y>y1){p.y=y1;p.vy=-Math.abs(p.vy);}}
function cap(p,m){const s=Math.hypot(p.vx,p.vy);if(s>m){p.vx*=m/s;p.vy*=m/s;}}
function moveE(p,st,f){
  lang_(p,f,2.4,.9);cap(p,5);p.x+=p.vx*f;p.y+=p.vy*f;
  if(p.x<X0+3){p.x=X0+3;p.vx=Math.abs(p.vx);}if(p.x>X1-3){p.x=X1-3;p.vx=-Math.abs(p.vx);}
  const yT=YT+st.sT, yB=YB-st.sB;
  if(p.y<yT){if(st.sT<7&&rnd()<.3)return'T';p.y=yT+1+rnd()*3;p.vy=Math.abs(p.vy);}
  if(p.y>yB){if(st.sB<7&&rnd()<.3)return'B';p.y=yB-1-rnd()*3;p.vy=-Math.abs(p.vy);}
  return null;
}
function moveIon(p,st,f){
  const yTm=YT+st.sTm, yBm=YB-st.sBm;
  if(p.y>yTm&&p.y<yBm){lang_(p,f,.12,.96);p.vy+=(p.y<(yTm+yBm)/2?-1:1)*.004*f;}
  else{const top=p.y<=yTm,V=top?st.Vt:st.Vb,s=Math.max(top?st.sTm:st.sBm,5);p.vy+=(top?-1:1)*.22*V/s*f;p.vx*=.98;}
  cap(p,10);p.x+=p.vx*f;p.y+=p.vy*f;
  if(p.x<X0+3){p.x=X0+3;p.vx=Math.abs(p.vx);}if(p.x>X1-3){p.x=X1-3;p.vx=-Math.abs(p.vx);}
  if(p.y<=YT+1)return'T'; if(p.y>=YB-1)return'B'; return null;
}
function moveRF(f,st,onE,onI){
  for(const p of parts){const c=SP[p.s].cat;
    if(c==='e'){const r=moveE(p,st,f);if(r){onE&&onE(p,r);placeBulk(p);}}
    else if(c==='i'){const r=moveIon(p,st,f);if(r){onI&&onI(p,r);placeBulk(p);}}}
}
function count(s){let n=0;for(const p of parts)if(p.s===s)n++;return n;}
function trim(s,n){const c=count(s);if(c>n){const i=parts.findIndex(p=>p.s===s);if(i>=0)parts.splice(i,1);}}
function drawPowder(p){ctx.save();ctx.fillStyle='#E2E8F0';ctx.strokeStyle='#94A3B8';ctx.lineWidth=.8;const r=p.r||2.5;
  [[0,0],[r*.7,-r*.4],[-r*.6,r*.3],[r*.2,r*.7]].forEach(([dx,dy],i)=>{if(i>Math.min(3,Math.floor(r/1.5)))return;ctx.beginPath();ctx.arc(p.x+dx,p.y+dy,r*.75,0,TAU);ctx.fill();ctx.stroke();});ctx.restore();}
function drawParts(list){
  list=list||parts;
  for(const p of list){const s=SP[p.s];
    if(s.cat==='p'){drawPowder(p);continue;}
    if(p.a!=null)ctx.globalAlpha=clamp(p.a,0,1);
    if(s.cat==='e'){ctx.fillStyle='rgba(224,161,0,.22)';ctx.beginPath();ctx.arc(p.x,p.y,3.8,0,TAU);ctx.fill();}
    ctx.fillStyle=s.c;ctx.beginPath();ctx.arc(p.x,p.y,s.r,0,TAU);ctx.fill();
    if(s.cat==='i'){ctx.strokeStyle='rgba(232,85,59,.35)';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(p.x,p.y,s.r+2.3,0,TAU);ctx.stroke();}
    else if(s.cat==='ni'){ctx.strokeStyle='rgba(15,118,110,.4)';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(p.x,p.y,s.r+2.3,0,TAU);ctx.stroke();}
    else if(s.cat==='r'){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x,p.y,Math.max(.7,s.r*.36),0,TAU);ctx.fill();}
    ctx.globalAlpha=1;

  }
}

function chartCtx(id){const c=$(id);if(!c)return null;const r=c.getBoundingClientRect();if(r.width<8||r.height<8)return null;

  const g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,r.width,r.height);return{g,W:r.width,H:r.height};}
function gt(g,s,x,y,o={}){g.font=`${o.w||400} ${o.sz||10}px ${o.mono?MONO:FONT}`;g.fillStyle=o.c||C.muted;g.textAlign=o.a||'left';g.textBaseline=o.b||'middle';g.fillText(s,x,y);}
function gl(g,pts,col,w,dash){g.save();g.strokeStyle=col;g.lineWidth=w||1;if(dash)g.setLineDash(dash);g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke();g.restore();}
function hex2rgb(h){const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}
function wl2rgb(w){let r=0,g=0,b=0;
  if(w<380)return[123,92,214];
  if(w<440){r=-(w-440)/60;b=1;}else if(w<490){g=(w-440)/50;b=1;}else if(w<510){g=1;b=-(w-510)/20;}else if(w<580){r=(w-510)/70;g=1;}else if(w<645){r=1;g=-(w-645)/65;}else{r=1;}
  let f=1;if(w>700)f=Math.max(.35,.3+.7*(780-w)/80);else if(w<420)f=.3+.7*(w-380)/40;
  return[Math.round(255*Math.pow(r*f,.8)),Math.round(255*Math.pow(g*f,.8)),Math.round(255*Math.pow(b*f,.8))];}

}

        const nb=parts.findIndex(p=>p.s==='N2O'&&Math.abs(p.x-src.x)<40&&Math.abs(p.y-src.y)<40);if(nb>=0)parts.splice(nb,1);}}
    const st=st2.ign?rfState(220,2):null;

      if(p.s==='e'){
        if(st2.ign){if(moveE(p,st,f))placeBulk(p);}

          if(p.y<YT+3||p.y>YB-3){if(!ok&&rnd()<.25){placeBulk(p);}else{p.y=clamp(p.y,YT+3,YB-3);p.vy*=-.4;}}

let lastLeg='';
function renderLegend(){const keys=SC[cur].legend||[],sp=L().sp;const k=lang+keys.join();if(k===lastLeg)return;lastLeg=k;
  $('legend').innerHTML=keys.map(s=>{const d=SP[s];const cls=d.cat==='i'?'ion':d.cat==='p'?'pw':'';return`<span class="lg"><i class="${cls}" style="${d.cat==='p'?'':'background:'+d.c}"></i>${sp[s]}</span>`;}).join('');
  $('lblBtn').style.display=keys.length&&cur!==5?'':'none';}
function renderInst(){const sc=SC[cur],el=$('inst'),h=sc.inst?sc.inst():'';el.innerHTML=h;el.className='inst'+(sc.cls&&sc.cls!=='none'?' '+sc.cls:'');el.style.display=h?'':'none';sc.bind&&sc.bind();}
function renderSide(){const s=L().steps[cur],n=L().steps.length;
  $('chap').textContent=L().chapters[s.ch];$('scount').textContent=`${String(cur+1).padStart(2,'0')} ${L().of} ${n}`;
  $('sTitle').innerHTML=s.title;const lead=cur===10?L().tk.p:s.lead;$('sLead').innerHTML=lead;
  let body=s.body;
  if(cur===0)body+=`<div class="parts">${Object.keys(L().parts).map(id=>`<button class="part ${pinPart===id?'on':''}" data-p="${id}">${L().parts[id][0]}</button>`).join('')}</div>`;
  if(cur===10)body=`<div class="parts">${L().steps.slice(0,10).map((t,i)=>`<button class="part" data-go="${i}">${String(i+1).padStart(2,'0')} · ${t.title}</button>`).join('')}</div>`;
  $('sBody').innerHTML=body;
  $('sCo').innerHTML=s.co.map(([k,t])=>`<div class="co ${k}">${ICON[k]}<div><span class="tag">${L().tags[k]}</span>${t}</div></div>`).join('');
  $('sDd').innerHTML=s.dd.map(d=>`<details class="dd"><summary><span class="db">${L().dd}</span><span class="dt">${d.t}</span><span class="chev">▼</span></summary><div class="dd-in">${d.b}</div></details>`).join('');
  $('sBody').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{pinPart=pinPart===b.dataset.p?null:b.dataset.p;$('sBody').querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('on',x.dataset.p===pinPart));tipPinned();});
  $('sBody').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));
  $('prog').style.width=((cur+1)/n*100)+'%';
  $('prevBtn').disabled=cur===0;$('nextBtn').disabled=cur===n-1;$('prevBtn').textContent=L().prev;$('nextBtn').textContent=L().next;$('kbd').textContent=L().kbd;
  $('pills').querySelectorAll('.pill').forEach(p=>p.classList.toggle('on',+p.dataset.i===cur));}
function renderPills(){let h='',prev=-1;L().steps.forEach((s,i)=>{if(prev!==-1&&s.ch!==prev)h+='<span class="pill-gap"></span>';prev=s.ch;h+=`<button class="pill" data-i="${i}" title="${s.title.replace(/"/g,'&quot;')}">${i+1}</button>`;});
  $('pills').innerHTML=h;$('pills').querySelectorAll('.pill').forEach(b=>b.onclick=()=>go(+b.dataset.i));}
function tipPinned(){if(cur!==0||!pinPart){showTip(null);return;}const p=partById(pinPart),[x,y,w]=p.r[0];showTip(pinPart,OX+(x+w/2)*RS,OY+y*RS);}
function enterScene(keepInst){fx=[];SC[cur].init();lastLeg='';renderLegend();if(!keepInst)renderInst();}
function go(i){const n=L().steps.length;if(i<0||i>=n)return;cur=i;hoverPart=null;if(i!==0)pinPart=null;showTip(null);setMsg('','');
  $('stageHtml').classList.toggle('show',i===10);if(i===10)renderTK();
  enterScene();renderSide();renderRecipe();setReadouts();$('sideScroll').scrollTop=0;}
function setLang(l){lang=l;document.documentElement.lang=l;$('btnEN').classList.toggle('active',l==='en');$('btnKO').classList.toggle('active',l==='ko');
  $('hTitle').textContent=L().title;$('hSub').textContent=L().sub;$('lblBtn').textContent=L().labels;lastRec=lastRd=lastLeg=lastMsg='';
  renderPills();renderSide();renderInst();renderRecipe();renderLegend();setReadouts();if(cur===10)renderTK();if(cur===0)tipPinned();}

$('btnEN').onclick=()=>setLang('en');$('btnKO').onclick=()=>setLang('ko');
$('prevBtn').onclick=()=>go(cur-1);$('nextBtn').onclick=()=>go(cur+1);
$('lblBtn').onclick=()=>{S.labels=!S.labels;$('lblBtn').classList.toggle('on',S.labels);};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePop();return;}const t=e.target.tagName;if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT')return;
  if(e.key==='ArrowRight'){go(cur+1);e.preventDefault();}if(e.key==='ArrowLeft'){go(cur-1);e.preventDefault();}});
cv.addEventListener('mousemove',e=>{if(cur!==0){cv.style.cursor='default';return;}const r=cv.getBoundingClientRect(),sx=e.clientX-r.left,sy=e.clientY-r.top,x=(sx-OX)/RS,y=(sy-OY)/RS;
  hoverPart=partAt(x,y);cv.style.cursor=hoverPart?'pointer':'default';if(hoverPart)showTip(hoverPart,sx,sy);else tipPinned();});
cv.addEventListener('mouseleave',()=>{hoverPart=null;tipPinned();});
cv.addEventListener('click',e=>{if(cur!==0)return;const r=cv.getBoundingClientRect(),x=(e.clientX-r.left-OX)/RS,y=(e.clientY-r.top-OY)/RS,id=partAt(x,y);
  pinPart=id&&id!==pinPart?id:null;$('sBody').querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('on',b.dataset.p===pinPart));});

/* ---------- main loop ---------- */
let last=performance.now(),rdT=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;frameN++;
  if(!(cur===3&&S.paused))phase+=dt*TAU*FA;
  const sc=SC[cur];
  if(cur!==10){beginFrame();if(sc.update&&!(cur===3&&S.paused))sc.update(dt);if(!(cur===3&&S.paused))stepFx(dt);sc.draw();}
  if(sc.chart)sc.chart(dt);
  rdT+=dt;if(rdT>.15){rdT=0;setReadouts();if(cur===9){renderRecipe();renderLegend();}if(cur===1)renderLegend();}
  requestAnimationFrame(loop);}
setLang('en');go(0);
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>requestAnimationFrame(loop));
</script>
</body>
