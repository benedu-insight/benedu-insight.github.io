<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magnetron Sputter PVD — Interactive Lesson · Benedu Insight</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/benedu-insight/benedu-insight.github.io/refs/heads/main/logo_png/benedu_insight_Symbol.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:          #F7F8FA;
    --panel:       #FFFFFF;
    --ink:         #2D2D2D;
    --muted:       #6B7280;
    --muted2:      #9CA3AF;
    --purple:      #7030A0;
    --purple-soft: #F0E6F6;
    --purple-mid:  #d9b8ed;
    --purple-dark: #521a78;
    --green:       #0F8C50;
    --border:      #E5E7EB;
    --shadow:      0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.06);
    --hdr:         52px;
    --side:        450px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; overflow: hidden; }
  body {
    height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: 'Google Sans','Noto Sans KR','Segoe UI',system-ui,sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header ── */
  .hdr {
    position: fixed; top: 0; left: 0; right: 0; z-index: 200;
    height: var(--hdr); background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 1rem; padding: 0 1.25rem;
    box-shadow: 0 1px 6px rgba(0,0,0,0.07);
  }
  .hdr-logo   { height: 32px; width: auto; flex-shrink: 0; }
  .hdr-div    { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; }
  .hdr-title  { font-size: 0.95rem; font-weight: 700; color: var(--purple); line-height: 1.2; }
  .hdr-sub    {
    font-family: 'JetBrains Mono', monospace; font-size: 0.50rem;
    color: var(--muted2); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 2px;
  }
  .hdr-right  { margin-left: auto; display: flex; align-items: center; gap: 0.5rem; }

  .lang-toggle { display: flex; border: 1px solid var(--border); border-radius: 20px; overflow: hidden; }
  .lang-btn {
    padding: 3px 13px; border: none; background: transparent; cursor: pointer;
    font-family: 'JetBrains Mono', monospace; font-size: 0.60rem; font-weight: 500;
    color: var(--muted2); transition: all 0.16s;
  }
  .lang-btn.active { background: var(--purple); color: #fff; }

  /* ── Main area (below fixed header) ── */
  .main {
    position: fixed;
    top: var(--hdr); left: 0; right: 0; bottom: 0;
    display: grid;
    grid-template-columns: 1fr var(--side);
    gap: 0;
    overflow: hidden;
  }

  /* ── Canvas area ── */
  .canvas-wrap {
    position: relative;
    background: var(--bg);
    display: flex; flex-direction: column;
    padding: 10px 8px 6px 10px;
    overflow: hidden;
  }
  .canvas-card {
    flex: 1;
    background: var(--panel);
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  #cv {
    display: block;
    width: 100%;
    height: 100%;
    flex: 1;
    object-fit: contain;
  }
  /* Step controls below canvas card */
  .step-controls {
    flex-shrink: 0;
    min-height: 28px; height: 28px;
    display: flex; gap: 8px; align-items: center;
    margin-top: 6px; flex-wrap: nowrap; overflow: hidden;
  }
  .mode-toggle {
    display: inline-flex; background: var(--bg);
    border: 1px solid var(--border); border-radius: 20px; padding: 2px; gap: 2px;
  }
  .mode-toggle button {
    border: none; background: transparent; padding: 3px 12px;
    font-family: 'Google Sans', sans-serif; font-size: 0.70rem; font-weight: 600;
    cursor: pointer; color: var(--muted); border-radius: 14px; transition: all 0.14s;
  }
  .mode-toggle button.active { background: var(--purple); color: #fff; }
  .mode-info {
    font-family: 'JetBrains Mono', monospace; font-size: 0.60rem;
    background: var(--purple-soft); color: var(--purple-dark);
    padding: 3px 10px; border-radius: 20px; white-space: nowrap;
  }
  .reset-btn {
    font-family: 'Google Sans', sans-serif; font-size: 0.70rem; font-weight: 600;
    background: var(--panel); border: 1px solid var(--border); border-radius: 7px;
    padding: 4px 12px; cursor: pointer; color: var(--ink); transition: all 0.14s;
    white-space: nowrap;
  }
  .reset-btn:hover { border-color: var(--purple-mid); color: var(--purple); background: var(--purple-soft); }
  .p-slider { width: 150px; accent-color: var(--purple); cursor: pointer; }
  .p-val {
    font-family: 'JetBrains Mono', monospace; font-size: 0.66rem; font-weight: 500;
    color: var(--purple-dark); min-width: 66px; white-space: nowrap;
  }

  /* Tooltip */
  #tooltip {
    position: absolute; pointer-events: none;
    background: rgba(18,22,38,0.97); color: #fff;
    padding: 9px 13px; border-radius: 9px; font-size: 12.5px;
    line-height: 1.6; max-width: 270px;
    transform: translate(-50%,-100%); margin-top: -12px;
    opacity: 0; transition: opacity 0.11s; z-index: 50;
    box-shadow: 0 8px 24px rgba(0,0,0,0.32); border: 1px solid rgba(255,255,255,0.09);
  }
  #tooltip.show { opacity: 1; }
  #tooltip b { color: #c4a0f0; }

  /* ── Side Panel ── */
  .side {
    background: var(--panel);
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .side-inner {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 1rem 1.1rem 0.5rem;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }
  .side-inner::-webkit-scrollbar { width: 4px; }
  .side-inner::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .step-eyebrow {
    font-family: 'JetBrains Mono', monospace; font-size: 0.54rem;
    color: var(--muted2); text-transform: uppercase; letter-spacing: 0.14em; margin-bottom: 0.3rem;
  }
  .step-title { font-size: 1.08rem; font-weight: 700; color: var(--ink); margin-bottom: 0.6rem; line-height: 1.3; }
  .step-body  { font-size: 0.82rem; line-height: 1.76; color: #3a4055; }
  .step-body ul { padding-left: 1.1rem; margin: 0.35rem 0; }
  .step-body li { margin-bottom: 0.28rem; }
  .step-body b  { font-weight: 700; color: var(--ink); }
  .step-body code {
    background: var(--purple-soft); padding: 1px 6px; border-radius: 4px;
    font-family: 'JetBrains Mono', monospace; font-size: 0.70rem; color: var(--purple-dark);
  }
  .hint-box {
    margin-top: 0.7rem; display: flex; gap: 9px; align-items: flex-start;
    background: var(--bg); border: 1px solid var(--border); border-radius: 9px; padding: 9px 11px;
  }
  .hint-icon {
    flex: none; width: 28px; height: 28px; border-radius: 50%;
    background: var(--purple-soft); display: flex; align-items: center;
    justify-content: center; font-size: 13px;
  }
  .hint-text { font-size: 0.71rem; line-height: 1.58; color: #4a5070; flex: 1; align-self: center; }

  /* Deep Dive accordion */
  .deep-wrap {
    margin-top: 0.85rem; border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden; background: var(--panel);
  }
  .deep-hdr {
    display: flex; align-items: center; gap: 0.55rem; padding: 0.65rem 0.85rem;
    cursor: pointer; user-select: none; background: var(--panel); transition: background 0.15s;
  }
  .deep-hdr:hover { background: var(--bg); }
  .deep-hdr.open { background: var(--purple-soft); border-bottom: 1px solid var(--border); }
  .deep-icon  { font-size: 1rem; flex-shrink: 0; }
  .deep-title { font-size: 0.80rem; font-weight: 700; color: var(--ink); flex: 1; line-height: 1.3; }
  .deep-badge {
    background: var(--purple); color: #fff; font-family: 'JetBrains Mono', monospace;
    font-size: 0.50rem; font-weight: 700; padding: 2px 7px; border-radius: 4px; flex-shrink: 0;
    letter-spacing: 0.04em;
  }
  .deep-chevron { font-size: 0.62rem; color: var(--muted2); transition: transform 0.2s; flex-shrink: 0; }
  .deep-hdr.open .deep-chevron { transform: rotate(180deg); }
  .deep-body { max-height: 0; overflow: hidden; transition: max-height 0.35s ease; background: var(--bg); }
  .deep-body.open { max-height: 2000px; }
  .deep-inner { padding: 0.85rem 0.9rem; font-size: 0.76rem; line-height: 1.78; color: #4a5070; }
  .deep-inner p + p { margin-top: 0.6em; }
  .deep-inner b { color: var(--ink); }
  .deep-inner .deep-eq {
    background: var(--charcoal,#2D2D2D); border-radius: 6px; padding: 0.55rem 0.8rem;
    font-family: 'JetBrains Mono', monospace; font-size: 0.74rem; color: #FFD580;
    margin: 0.5rem 0; overflow-x: auto; letter-spacing: 0.03em; line-height: 1.6;
  }
  .deep-inner .deep-hl {
    background: var(--purple-soft); border-left: 3px solid var(--purple);
    border-radius: 0 7px 7px 0; padding: 0.5rem 0.8rem; margin: 0.5rem 0;
    font-size: 0.74rem; line-height: 1.7; color: var(--purple-dark);
  }
  .deep-inner ul { padding-left: 1.1rem; margin: 0.35rem 0; }
  .deep-inner li { margin-bottom: 0.3rem; }

  /* Side footer: step buttons + nav */
  .side-footer {
    flex-shrink: 0;
    padding: 0.65rem 1.1rem 0.8rem;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  .step-btns { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 0.6rem; }
  .step-btn {
    padding: 5px 10px; font-size: 0.70rem; font-weight: 600;
    border: 1px solid var(--border); background: var(--panel); border-radius: 6px;
    cursor: pointer; color: var(--muted); transition: all 0.13s;
    font-family: 'Google Sans', sans-serif; min-width: 30px; text-align: center;
  }
  .step-btn:hover { border-color: var(--purple-mid); color: var(--purple); background: var(--purple-soft); }
  .step-btn.active { background: var(--purple); color: #fff; border-color: var(--purple); }

  .nav-row { display: flex; gap: 7px; }
  .nav-btn {
    flex: 1; padding: 9px; font-size: 0.78rem; font-weight: 700;
    border: none; background: var(--ink); color: #fff; border-radius: 8px;
    cursor: pointer; font-family: 'Google Sans', sans-serif; transition: background 0.14s;
  }
  .nav-btn:hover:not(:disabled) { background: var(--purple); }
  .nav-btn:disabled { background: var(--border); color: var(--muted2); cursor: not-allowed; }

  /* Footer bar */
  .foot {
    display: none; /* hidden — space too tight in full-screen mode */
  }
</style>
</head>

<body>

<!-- Fixed Header -->
<header class="hdr">
  <a href="https://benedu-insight.github.io/" target="_blank" rel="noopener noreferrer"
     style="display:inline-flex;align-items:center;text-decoration:none;">
    <img class="hdr-logo"
      src="https://benedu-insight.github.io/logo_png/benedu_insight_logo_EN_horizontal.png"
      alt="Benedu Insight">
  </a>
  <div class="hdr-div"></div>
  <div>
    <div class="hdr-title" id="hTitle">Magnetron Sputter PVD — Interactive Lesson</div>
    <div class="hdr-sub"   id="hSub">Class 2 · Ar/Al DC Magnetron Sputter Deposition · Benedu Insight</div>
  </div>
  <div class="hdr-right">
    <div class="lang-toggle">
      <button class="lang-btn active" id="btnEN" onclick="setLang('en')">EN</button>
      <button class="lang-btn"        id="btnKO" onclick="setLang('ko')">KO</button>
    </div>
  </div>
</header>

<!-- Main 2-column layout -->
<div class="main">

  <!-- Left: Canvas + controls -->
  <div class="canvas-wrap" id="canvasWrap">
    <div class="canvas-card" id="canvasCard">
      <canvas id="cv"></canvas>
      <div id="tooltip"></div>
    </div>
    <div class="step-controls" id="stepControls"></div>
  </div>

  <!-- Right: Side panel -->
  <div class="side">
    <div class="side-inner" id="sideInner">
      <div class="step-eyebrow">Step <span id="stepNum">S</span> / <span id="stepTot">10</span></div>
      <div class="step-title" id="stepTitle"></div>
      <div class="step-body"  id="stepBody"></div>
      <div class="hint-box"   id="stepHint" style="display:none;"></div>
      <div id="deepDiveContainer"></div>
    </div>
    <div class="side-footer">
      <div class="step-btns" id="stepButtons"></div>
      <div class="nav-row">
        <button class="nav-btn" id="prevBtn">◀ Prev</button>
        <button class="nav-btn" id="nextBtn">Next ▶</button>
      </div>
    </div>
  </div>

</div>

<script>

/* ============================================================
   Magnetron Sputter PVD Interactive Lesson — Class 2 (Chapter 3)
   Benedu Insight · Google Sans · Full-viewport layout
   Responsive Canvas — geometry scales with window size
   Ar⁺ + Al Target → Sputtered Al → Film  (DC Magnetron, Ar/Al)
   rev2: Magnetron (E×B electron trap), racetrack erosion,
         diode-vs-magnetron lab, pressure-dependent transport
   KO / EN bilingual
   ============================================================ */

// ── Canvas & ctx ──────────────────────────────────────────────
const canvas = document.getElementById('cv');
const ctx    = canvas.getContext('2d');
const tooltip     = document.getElementById('tooltip');
const stepCtrlEl  = document.getElementById('stepControls');

// ── Logical canvas dimensions (constant ratio 900:640) ────────
const LW = 900, LH = 640;
let DPR = window.devicePixelRatio || 1;
let renderScale = 1, renderOffX = 0, renderOffY = 0;
function resizeCanvas() {
  const card = document.getElementById('canvasCard');
  const cw = card.clientWidth;
  const ch = card.clientHeight;
  DPR = window.devicePixelRatio || 1;
  canvas.width  = Math.round(cw * DPR);
  canvas.height = Math.round(ch * DPR);
  canvas.style.width  = cw + 'px';
  canvas.style.height = ch + 'px';
  const aspect = LW / LH;
  let drawW, drawH;
  if (cw / ch > aspect) { drawH = ch; drawW = ch * aspect; }
  else                   { drawW = cw; drawH = cw / aspect; }
  renderScale = drawW / LW;
  renderOffX = (cw - drawW) / 2;
  renderOffY = (ch - drawH) / 2;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(renderScale * DPR, renderScale * DPR);
  ctx.translate(renderOffX / renderScale, renderOffY / renderScale);
}
const ro = new ResizeObserver(() => resizeCanvas());
ro.observe(document.getElementById('canvasCard'));
resizeCanvas();

// ── Brand ─────────────────────────────────────────────────────
const FONT = '"Google Sans","Noto Sans KR",system-ui,sans-serif';
const MONO = '"JetBrains Mono",monospace';
const B = {
  purple:'#7030A0', purpleSoft:'#F0E6F6', purpleDark:'#521a78',
  green:'#0F8C50',  greenSoft:'#E5F4EC',
  charcoal:'#2D2D2D', muted:'#6B7280', muted2:'#9CA3AF',
  bg:'#F7F8FA', panel:'#FFFFFF', border:'#E5E7EB',
  red:'#E8553B', blue:'#3A7AD6', amber:'#B7791F',
};

// ── Logo ──────────────────────────────────────────────────────
const LOGO = new Image();
LOGO.crossOrigin = 'anonymous';
LOGO.src = 'https://benedu-insight.github.io/logo_png/benedu_insight_logo_EN_horizontal.png';
function drawLogo(a=0.45) {
  if (!LOGO.complete || !LOGO.naturalWidth) return;
  const lh=26, lw=Math.round(lh*LOGO.naturalWidth/LOGO.naturalHeight);
  ctx.save(); ctx.globalAlpha=a;
  ctx.drawImage(LOGO, LW-lw-12, LH-lh-10, lw, lh);
  ctx.restore();
}

// ── Geometry — all in LW×LH (900×640) logical space ──────────
const W=LW, H=LH;
const CH={x:215,y:175,w:470,h:380,r:18};
const IP=18, inX=CH.x+IP, inY=CH.y+IP, inW=CH.w-IP*2, inH=CH.h-IP*2;
// Al target = top electrode (cathode); wafer/susceptor = bottom; grounded walls/shields = anode
const SH={x:inX,y:inY,w:inW,h:30};               // Al target slab
const TGT_BOT=SH.y+SH.h;                          // target face (y)
const wW=Math.round(inW*0.83);
const SC={x:inX,y:inY+inH-28,w:inW,h:28};         // Susceptor
const WF={x:inX+Math.round((inW-wW)/2),y:SC.y-5,w:wW,h:5};
const ST={x:inX+6,y:TGT_BOT,     w:inW-12,h:34};  // Cathode sheath (high V)
const SB={x:inX+6,y:SC.y-16,      w:inW-12,h:16}; // Wafer sheath (low V)
const PL={x:ST.x,y:ST.y+ST.h,w:ST.w,h:SB.y-(ST.y+ST.h)};
const MP={x:inX,y:124,w:inW,h:46};                // Magnet pack (behind target, outside vacuum)
const POLE={oL:inX+16, c:inX+inW/2, oR:inX+inW-16};
const RT0={L:(POLE.oL+POLE.c)/2, R:(POLE.c+POLE.oR)/2, a:(POLE.c-POLE.oL)/2};
const G1S={x:826,y:56, w:58,h:34};                // Ar source
const M1={cx:855,cy:112};
const GAS_Y=330;                                   // side gas inlet height
const RF={x:762,y:198,w:110,h:76,r:10};
const PU={x:768,y:510,w:90, h:56,r:8};
const INSET={cx:104,cy:372,r:66};
const GAP_CM=5, PX_PER_CM=(WF.y-TGT_BOT)/GAP_CM;  // ~56 px per cm

// ── Species ───────────────────────────────────────────────────
const SP={
  'Ar':  {f:'Ar',  c:'#2a3145',  sz:11, q:0,  m:40,     cat:'neutral' },
  'Ar+': {f:'Ar+', c:B.red,      sz:11, q:+1, m:40,     cat:'ion'     },
  'Al':  {f:'Al',  c:'#7a8aa3',  sz:11, q:0,  m:27,     cat:'radical' },
  'e-':  {f:'e-',  c:B.red,      sz:10, q:-1, m:0.0005, cat:'electron'},
};
const AL_GLOW='rgba(180,190,210,1)';

// ── Qualitative discharge model (Step 4 lab and transport) ────
// Numbers are order-of-magnitude teaching values, not a fluid/PIC simulation.
const LAB={pminMag:0.6, pminDiode:20, gap:GAP_CM};
function labState(mag,p){
  const pmin=mag?LAB.pminMag:LAB.pminDiode, on=p>=pmin;
  let V=0,I=0;
  if(on){
    if(mag){ V=380+260*Math.exp(-(p-pmin)/2.5); I=1-0.6*Math.exp(-(p-pmin)/1.2); }
    else   { V=1000+2000*Math.exp(-(p-pmin)/20); I=0.08*(1-Math.exp(-(p-pmin+1)/15)); }
  }
  const Y=on?1.05*Math.pow(V/500,0.6):0;          // Ar⁺→Al sputter yield (approx.)
  const lamAl=6/p;                                 // sputtered-Al mean free path [cm]
  const nColl=LAB.gap/lamAl;                       // mean gas collisions over the gap
  const eta=1/(1+0.15*nColl);                      // fraction reaching the wafer (scatter loss)
  const lamIz=107/p;                               // fast-e⁻ ionization MFP in Ar [cm]
  const rate=on?Y*I*eta:0;
  return {on,pmin,V,I,Y,lamAl,nColl,eta,lamIz,rate};
}
const RATE_REF=labState(true,3).rate;

// ── Bilingual text ────────────────────────────────────────────
const T = {
en:{
  hTitle:'Magnetron Sputter PVD — Interactive Lesson',
  hSub:'Class 2 · Ar/Al DC Magnetron Sputter Deposition · Benedu Insight',
  stepLabel:'Step',
  modeInfoDC:'DC — the production default for a conductive Al target',
  modeInfoAC:'AC/RF — needed for insulating / poisoned targets',
  resetFilm:'↻ Reset Film', resetTarget:'↻ Reset Target',
  prevBtn:'◀ Prev', nextBtn:'Next ▶',
  modeLabel:'Mode', plasmaLabel:'Plasma intensity',
  sustained:'Plasma sustained · target is a conductor — no charge buildup',
  molCount:'Ar Atoms',
  sheathLabel:'Cathode sheath → Ar⁺ bombardment energy',
  sputterCount:'Al atoms sputtered',
  filmLabel:'Al Film Growth', filmRel:'(relative)',
  pecvdCompareNote:'Unlike PE-CVD (Class 1), the deposited species here is a sputtered metal atom — not a chemical reaction product.',
  insetTitle:'TOP VIEW · Target face', insetNoTrap:'no magnet → no racetrack',
  magOn:'Magnet ON', magOffLbl:'Magnet OFF', pLabel:'Ar pressure',
  staticLbl:'Static magnet', rotLbl:'Rotating magnet',
  labMag:'Magnet ON → Magnetron', labDiode:'Magnet OFF → Diode (no magnet)',
  labOkMag:'Plasma sustained — γ-electrons trapped by E × B',
  labOkDiode:'Sustained only by high pressure + kV voltage',
  labOff:'⚠ Plasma cannot be sustained (diode needs ≳ 20 mTorr)',
  ionCur:'Ion current (rel.)', depRate:'Deposition rate (rel.)',
  lamIz:'λ_iz (fast e⁻)', gapTxt:'gap', util:'Target utilization ≈', grooveMax:'groove depth (max)',
  lamAl:'λ (sputtered Al)', coll:'mean collisions over 5 cm gap',
  gammaNote:'γ-electrons leave the target — where do they go? (Step 4)',
  vTarget:'V_target', vWafer:'Wafer sheath', magRemoved:'— magnet removed —', reach:'fraction reaching the wafer ≈', pwrOff:'Power OFF', permNote:'Permanent magnets — the B-field is always present, power ON or OFF',
  steps:[
    { title:'Magnetron Sputter Chamber — Structure',
      body:`Production sputter PVD chamber for Ar/Al deposition — a <b>DC magnetron</b>. It starts from the same parallel-plate picture as the CCP chambers of Classes 1–2, with one decisive addition: a <b>magnet pack behind the target</b>.
        <ul>
          <li>Top = <b>Al Target</b> (cathode) — the film source material itself, driven strongly negative</li>
          <li>Behind the target = <b>Magnet Pack</b>: a center pole and an outer pole of opposite polarity. Field lines arch out of the target face and back in — the <b>B-field component parallel to the target surface</b> is what matters (Step 4)</li>
          <li>Bottom = <b>wafer</b> on a grounded/floating stage; the grounded chamber wall and shields act as the anode</li>
          <li><b>Ar</b> (inert sputtering gas) metered by one MFC, injected from the side</li>
          <li><b>DC power</b> on the target — the production default for a conductive metal target (AC/RF: Step 7)</li>
          <li>Low pressure: <code>1–10 mTorr</code> — possible only <i>because</i> of the magnet</li>
        </ul>
        Left inset: the target seen from the front — the closed <b>racetrack</b> loop where electrons are trapped. A–A′ marks the cross-section shown in the chamber.`,
      hint:'💡 Hover over chamber parts — including the magnet pack, the arched B-field and the top-view inset.',
      deepDive:{
        title:'The Target Is Metal — How Does the Magnetic Field Get Through It?',
        body:`<p>A metal blocks a magnetic field only in two situations, and a magnetron's Al target falls into neither.</p>
<div class="deep-hl">① The metal is <b>ferromagnetic</b> (Fe, Ni, Co). It has a high permeability (μr ≫ 1), so it "sucks in" the flux and guides it through itself — little field is left in front of it. This is magnetic <b>shunting</b>.</div>
<div class="deep-hl">② The field is <b>time-varying</b> (AC/RF). It induces eddy currents in a conductor that cancel the field inside — the skin effect. The faster the field changes and the better the conductor, the thinner the layer it can penetrate.</div>
<p>A permanent-magnet field is <b>static</b>, so ② does not apply: a constant B-field induces no eddy currents, and conductivity is irrelevant. Aluminum (and the copper backing plate) are <b>non-magnetic</b> — μr ≈ 1.00002 — so ① does not apply either. To a static magnetic field, an Al target is practically the same as air or vacuum.</p>
<div class="deep-eq">Static B through Al / Cu (μr ≈ 1):   passes essentially unchanged
Static B through Ni / Co / Fe (μr ≫ 1):  shunted inside the target → weak B∥ in front
RF B at 13.56 MHz into Al:  skin depth δ = √(2ρ / ωμ) ≈ 22 µm  → blocked</div>
<p>What does limit the magnet is <b>distance</b>: the field falls off quickly away from the poles, and the magnets sit behind the backing plate and target (typically ~1–2 cm in total). Target thickness is therefore part of the magnetron design — and as the groove deepens, the eroded face moves closer to the magnets and sees a stronger field.</p>
<div class="deep-hl">Two practical consequences: <b>ferromagnetic targets</b> (Ni, Co for silicides) must be made thin or used with much stronger magnets. And a <b>rotating</b> magnet does create small eddy currents in the Cu backing plate — but at ~1 revolution per second they are tiny, unlike the 13.56 MHz case. The same skin effect is why an ICP coil (next chapters) must couple through a <b>dielectric</b> window: an RF field cannot get through a metal lid.</div>` }
    },
    { title:'Ar Gas Fill',
      body:`Ar enters through the side inlet and fills the chamber.
        <ul>
          <li>Only neutral <b>Ar</b> atoms present (thermal motion)</li>
          <li>Power off — no ionization yet. The magnet field is already there, but it cannot act on neutral atoms</li>
          <li>Ar is chemically inert — it does <b>not</b> react with Al; its only role is to be ionized and accelerated</li>
          <li>Pressure ~100–1000× lower than PE-CVD → much longer mean free path</li>
        </ul>`,
      hint:'⚙ Ar atoms fill the chamber uniformly before power-on.' },
    { title:'Power On — Ar Ionization',
      body:`A negative DC voltage on the target sets up an <b>E-field</b> between the target (cathode) and the grounded anode. Seed electrons are accelerated and collide with Ar, causing <b>ionization</b>.
        <ul>
          <li><code>e⁻ + Ar → Ar⁺ + 2e⁻</code> &nbsp;(ionization threshold ~15.8 eV)</li>
          <li>No dissociation chemistry — Ar is monatomic and inert</li>
          <li><b>Red</b> = Ar⁺ ions and e⁻ &nbsp;·&nbsp; dark grey = neutral Ar</li>
        </ul>
        The seed-electron + avalanche ignition is the same as PE-CVD (Class 1). What keeps <i>this</i> discharge alive at only a few mTorr is a different story — Steps 3–4.`,
      hint:'⚡ Electrons gain energy from the field and ionize Ar on collision.',
      deepDive:{
        title:'Why Argon? Why Not a Reactive Gas?',
        body:`<p>In PE-CVD, the process gases (SiH₄, N₂O) are chosen because they participate <b>chemically</b> in the film-forming reaction. In sputter deposition, the situation is reversed: the film material (Al) is already a solid sitting in the chamber as the target. The plasma's only job is to <b>generate ions that physically eject atoms from that target</b>.</p>
<div class="deep-hl">This is why an inert gas is preferred: Ar contributes nothing to the film's chemistry. Its ionization energy (~15.8 eV) is low enough to ionize efficiently, and its atomic mass (40 amu) is heavy enough to deliver substantial momentum on impact — both desirable for sputtering. It is also abundant and inexpensive.</div>
<p>If a reactive gas were added (e.g. N₂ or O₂ for "reactive sputtering" of nitrides/oxides), it would react with the sputtered metal at the substrate — and also at the target surface — to form TiN, TaN, AlN or Al₂O₃. That is a real and widely used technique, but it is a deliberate addition on top of the baseline Ar sputter process covered here (see Step 7).</p>
<div class="deep-hl">Key contrast with PE-CVD: there, the gas <b>is</b> the film precursor. Here, the gas is a <b>projectile carrier</b> — the film precursor is the solid target itself.</div>` }
    },
    { title:'Cathode Sheath — Why the Target Sits Hundreds of Volts Negative',
      body:`In DC sputtering, the power supply <b>directly applies</b> a negative voltage (typically −300 to −700 V in a magnetron) to the conductive Al target. The plasma sits a few volts above ground, so almost the entire applied voltage drops across a thin <b>cathode sheath</b> in front of the target.
        <ul>
          <li>Ar⁺ entering the cathode sheath are accelerated into the target → <code>E_ion ≈ e·|V_target|</code> ≈ hundreds of eV</li>
          <li>The wafer-side sheath stays small (a few to tens of V) — the growing film is not heavily bombarded</li>
          <li>Each Ar⁺ impact can also release a <b>secondary electron</b> (γ ≈ 0.1 per ion for Ar⁺ on Al). The same sheath that pulls ions in pushes these electrons <i>out</i> — with hundreds of eV. They are the main fuel of the discharge.</li>
        </ul>
        Same physics as the asymmetric CCP of Class 2 — a strongly negative electrode, a thick sheath, ions accelerated into it — but now aimed at the target instead of the wafer.`,
      hint:'🔬 Watch V_target ramp negative and the cathode sheath darken. The red e⁻ shooting downward from the target are secondary (γ) electrons.',
      deepDive:{
        title:'Two Ways to Make the Target Negative — Applied DC vs. RF Self-Bias',
        body:`<p>In Class 2 (dry etch), the wafer electrode went strongly negative through <b>RF self-bias</b>: a blocking capacitor plus a small powered-electrode area, with flux balance (Γ_e = Γ_i) forcing a large negative V_DC. A sputter target reaches the same end state — a thick, high-voltage sheath with ions flying into it — by one of two routes:</p>
<div class="deep-eq">① DC sputtering (conductive metal target — Al, Ti, Ta, Cu, W…)
   PSU applies V_target directly (−300 to −700 V, magnetron)
   Plasma potential ≈ a few V above ground
   → cathode sheath ≈ |V_target|  →  E_ion ≈ e·|V_target|

② RF sputtering (insulating target — Al₂O₃, SiO₂, HfO₂…)
   The insulating target itself acts as the blocking capacitor
   Flux balance + small target area vs. large grounded area
   → negative self-bias (hundreds of V) builds on the target face</div>
<p>Route ② is exactly the Class 2 mechanism with the asymmetry turned around: the small powered electrode is now the target, and the large grounded electrode is the chamber wall + wafer stage. Route ① needs no self-bias at all — a metal target is a conductor wired to a DC supply, so its potential is simply what the supply sets.</p>
<div class="deep-hl">Either way the resulting geometry is the same: target sheath ≫ wafer sheath. Ar⁺ hit the target with hundreds of eV while the growing film sees only a few to tens of eV. "Asymmetric sheath" remains the right mental model for Chapter 3 — but for production metal PVD, the negative target voltage is <b>applied</b>, not self-generated.</div>
<p>One more consequence of the cathode sheath: every Ar⁺ impact can knock out a <b>secondary electron</b>, and the sheath launches it back into the gas with hundreds of eV. Whether those energetic electrons are used or wasted is the entire subject of the next step.</p>` }
    },
    { title:'Magnetron — Trapping Electrons with E × B',
      body:`Try it: switch the magnet <b>OFF</b> and lower the pressure.
        <ul>
          <li><b>Magnet OFF (diode)</b>: γ-electrons shoot straight across the ~5 cm gap and are lost to the anode / wafer. At a few mTorr their ionization mean free path (<code>λ_iz ≈ 107 / p[mTorr] cm</code> → ~36 cm at 3 mTorr) is far longer than the gap — they ionize almost nothing on the way. The discharge survives only at ≳ 20 mTorr with kV-level voltage.</li>
          <li><b>Magnet ON (magnetron)</b>: where the arched B-field runs <b>parallel</b> to the target surface, it is perpendicular to the sheath E-field. Electrons then drift along <code>v = E × B / B²</code> — sideways, around a closed <b>racetrack</b> — instead of escaping. Their path stretches to meters, so each γ-electron spends its energy on ionization right in front of the target.</li>
          <li>Result: a dense plasma ring (10¹¹–10¹² cm⁻³), stable at 1–10 mTorr and only −300 to −700 V, with an order of magnitude higher deposition rate.</li>
        </ul>
        Ions are <b>not</b> trapped: an Ar⁺ Larmor radius is centimeters or more, so they fall almost straight into the target beneath the dense ring.`,
      hint:'🧲 Toggle Magnet ON/OFF and drag the pressure slider. With the magnet OFF, the plasma cannot be sustained below ~20 mTorr.',
      deepDive:[{
        title:'Why a Plain Diode Fails at mTorr — the Numbers',
        body:`<p>A DC glow discharge is self-sustaining only if each secondary (γ) electron leaving the cathode, together with its descendants, creates enough new ions to replace the ion that released it:</p>
<div class="deep-eq">Sustaining condition:   γ · M ≥ 1
γ ≈ 0.1  (Ar⁺ on Al)   →  each γ-electron must yield ~10 ions
Energy budget: ~400 eV / ~30 eV per ion pair ≈ 13 ionizations — enough,
IF the electron stays in the gas long enough to spend it.</div>
<p>The real question is whether it stays. The ionization mean free path of a fast (~100 eV) electron in Ar is:</p>
<div class="deep-eq">λ_iz = 1 / (n_Ar · σ_iz),   σ_iz ≈ 3×10⁻¹⁶ cm² (near peak)
λ_iz ≈ 107 / p[mTorr]   cm
  p = 3 mTorr   →  λ_iz ≈ 36 cm   (gap ~5 cm → ~0.1 ionization per pass)
  p = 30 mTorr  →  λ_iz ≈ 3.6 cm  (comparable to the gap)</div>
<p>In a diode, a γ-electron crosses the target–wafer gap in a straight line and is collected by the anode. At a few mTorr it almost never ionizes on the way, so the discharge cannot sustain itself. The only cures are higher pressure (tens of mTorr or more) and higher voltage (kV-level) — both bad for PVD: more gas scattering, lower rate, more Ar incorporation, and energetic electrons bombarding and heating the wafer.</p>
<div class="deep-hl">The magnetron does not give the electron more energy — it gives it a <b>longer path</b>. A trapped electron circulates around the racetrack for meters before it finally diffuses out, so even with λ_iz = 36 cm it spends essentially all its energy on ionization directly in front of the target.</div>`
      },{
        title:'Why the B-field Must Be Parallel to the Target — E × B Drift',
        body:`<p>The force on a moving charge is the Lorentz force. In crossed fields its guiding center drifts sideways:</p>
<div class="deep-eq">F = q (E + v × B)
E ⊥ B  →  v_E×B = (E × B) / B²     (same for electrons and ions)</div>
<p>In front of the target, the sheath E-field points into the target surface (perpendicular to it). The magnet pack is arranged so that above the racetrack the arched field lines run <b>parallel</b> to the surface. There E ⊥ B, and electrons drift <b>sideways along the surface</b> — not away from it. Because the poles form a closed shape (a center pole surrounded by an outer pole), that sideways path closes on itself: the racetrack. In this cross-section the drift points into the page (⊗) on one side and out of the page (⊙) on the other.</p>
<p>If the field were <b>perpendicular</b> to the target (parallel to E), E × B = 0: electrons would simply spiral along B straight toward the anode — exactly the escape route we want to block. The perpendicular field near the poles still helps, acting as a magnetic mirror that bounces electrons back along the arch, but the trap itself is made by the parallel component.</p>
<div class="deep-eq">Larmor radius   r_L = m·v⊥ / (|q|·B),   B ≈ 300 G (0.03 T)
e⁻  (~100 eV)          r_L ≈ 1 mm    → magnetized, trapped
Ar⁺ (~1 eV, bulk)      r_L ≈ 3 cm    → far larger at sheath energies → effectively unmagnetized</div>
<div class="deep-hl">The magnet does not steer the ions — it traps only the electrons. Ions are created where the electrons are dense, directly under the racetrack, then fall almost straight through the sheath into the target. The erosion groove is a map of where the electrons were trapped.</div>
<p>Typical values: B∥ ≈ 200–500 G at the target face; plasma density in the ring 10¹¹–10¹² cm⁻³; discharge voltage −300 to −700 V with a very steep current–voltage curve (I ∝ Vⁿ, n ≈ 5–15). A few tens of volts change the current strongly, which is why magnetron supplies usually run in power-control mode.</p>`
      }]
    },
    { title:'Sputtering & Racetrack Erosion',
      body:`Ar⁺ formed in the dense ring fall straight through the cathode sheath and strike the target <b>beneath the racetrack</b>, ejecting Al atoms by <b>momentum transfer</b> — a purely physical process.
        <ul>
          <li><code>Ar⁺ (hundreds of eV) + Al(target) → Al(ejected, neutral) + Ar(reflected/neutralized)</code></li>
          <li>Sputtering yield Y ≈ 1 Al atom per Ar⁺ at ~500 eV, rising slowly with energy</li>
          <li>Ejected Al atoms leave with a roughly <b>cosine</b> angular distribution and a few to tens of eV</li>
          <li>Ion flux is concentrated under the racetrack, so the target erodes in a <b>groove</b> — watch the profile grow</li>
        </ul>
        Switch to <b>Rotating magnet</b>: the magnet pack sweeps the racetrack across the target face, spreading the erosion and raising target utilization.`,
      hint:'💥 Compare the erosion profile and the utilization readout for Static vs Rotating. (Rotation is drawn schematically as a sideways sweep in this cross-section.)',
      deepDive:[{
        title:'Sputtering vs. Densification — Same Physics, Different Energy Window',
        body:`<p>PE-CVD Class 1 (Step 5 deep dive) made the point that <b>"ion bombardment = damage" is not a universal rule</b> — at the low sheath voltages of symmetric PE-CVD (tens of volts → tens of eV), ion impacts are below the bond-breaking threshold and instead promote beneficial <b>densification</b> of the growing film.</p>
<p>Sputter PVD sits firmly on the <b>other side</b> of that same threshold — and that is the entire design intent:</p>
<div class="deep-eq">Ion energy ≈ q × V_sheath
PE-CVD (symmetric CCP):   V_sheath ≈ tens of V      → E_ion ≈ tens of eV      → densification
Sputter PVD (cathode):    V_sheath ≈ hundreds of V  → E_ion ≈ hundreds of eV  → material REMOVAL</div>
<p>At hundreds of eV, an incoming Ar⁺ ion's kinetic energy is far above the surface binding energy of Al (~3.4 eV). The impact initiates a <b>collision cascade</b> within the first few atomic layers: the struck Al atom hits its neighbors, which hit theirs, and so on. If enough momentum is redirected back toward the surface, a surface atom is ejected — this is <b>sputtering</b>.</p>
<div class="deep-hl">The <b>sputtering yield</b> Y (atoms ejected per incident ion) depends on ion energy, ion mass, target mass and angle of incidence. For Ar⁺ on Al, Y ≈ 1 near 500 eV — efficient enough for practical deposition rates.</div>
<p>So the same underlying physics (q × V_sheath, momentum transfer to a solid surface) gives <b>densification</b> in PE-CVD and <b>controlled removal</b> in sputter PVD — purely because the ion energy sits on a different side of the bond-breaking threshold. There is no new law here, only a different operating point on the same energy axis.</p>
<div class="deep-hl">A second contrast: in PE-CVD, bombardment acts on the <b>growing film</b> at the wafer. In sputter PVD, it acts on the <b>source material</b> (the target) — the wafer-side sheath is deliberately kept small so the growing Al film is not re-sputtered or damaged.</div>`
      },{
        title:'Racetrack Erosion, Target Utilization & Rotating Magnets',
        body:`<p>The groove is not a defect — it is the fingerprint of the magnetron. Ion flux follows the trapped electrons, so a static magnet sputters a narrow ring of the target while the center and edges barely erode.</p>
<div class="deep-eq">Target utilization ≈ material actually consumed / total target material
Static planar magnetron:            ~20–30 %
Rotating / optimized magnet designs: substantially higher
Target end-of-life: set by the DEEPEST point of the groove, not the average</div>
<ul>
<li><b>Target life & cost</b>: because the groove bottom decides when a target must be replaced, target life is tracked in kWh and the magnet design directly sets cost per wafer.</li>
<li><b>Film uniformity</b>: a fixed ring source deposits a non-uniform profile on the wafer. Rotating an off-center magnet behind the target averages the racetrack over the whole face — broader erosion and better wafer uniformity.</li>
<li><b>Redeposition zones</b>: regions outside the racetrack (center, edges) collect back-scattered material but get little sputter cleaning. In reactive processes this is where insulating layers grow first — the root of arcing (Step 7).</li>
<li><b>Ferromagnetic targets</b> (Ni, Co, Fe): the target itself shunts the magnetic flux and weakens B∥ in front of it, so these need thinner targets or stronger magnet designs.</li>
</ul>
<div class="deep-hl">Field note: as the groove deepens over target life, the erosion profile — and with it the deposition rate and uniformity — slowly changes. This is why PVD recipes are often compensated (power or time) as target kWh accumulate.</div>`
      }]
    },
    { title:'Al Atom Transport to the Wafer',
      body:`Ejected Al atoms are <b>neutral</b> — neither the E-field nor the magnet acts on them. They fly in straight lines until they hit a gas atom.
        <ul>
          <li>Mean free path of sputtered Al in Ar: <code>λ ≈ 6 / p[mTorr] cm</code> → ~2 cm at 3 mTorr, comparable to the ~5 cm target–wafer gap</li>
          <li>At magnetron pressures most atoms arrive after <b>zero to a few</b> collisions — <b>near line-of-sight</b>, with some angular broadening and energy loss</li>
          <li>At diode pressures (tens of mTorr) atoms suffer dozens of collisions, thermalize and <b>diffuse</b> — lower rate and much less directional</li>
          <li>Sticking coefficient ≈ 1; arriving atoms surface-diffuse briefly before settling into the film</li>
        </ul>
        This step uses the pressure set in Step 4 — go back, raise it to 20–30 mTorr, and compare.`,
      hint:'🎯 Grey Al atoms fly from the target; a sudden change of direction is a gas collision.',
      deepDive:{
        title:'Line-of-Sight vs. Diffusion-Dominated Transport — Contrast with PE-CVD',
        body:`<p>PE-CVD Class 1 (Step 8 deep dive) explained that SiH₃· and O· radicals reach the wafer primarily by <b>diffusion</b>, driven by the concentration gradient the surface reaction creates. Sputter PVD operates in a different transport regime, for two reasons:</p>
<div class="deep-hl">① Much lower pressure → much longer mean free path</div>
<p>PE-CVD runs at 0.5–5 Torr; magnetron sputtering at 1–10 mTorr — roughly <b>100–1000× lower</b>. For a sputtered Al atom in Ar, λ ≈ 6 / p[mTorr] cm: about 2–3 cm at 2–3 mTorr. Over a ~5 cm gap, atoms therefore make only a couple of collisions — partly scattered, but still strongly forward-directed. For nearly ballistic transport, <b>long-throw PVD</b> lowers the pressure below ~1 mTorr and increases the gap — possible only because the magnetron keeps the discharge alive at such low pressure.</p>
<div class="deep-hl">② Directional ejection from a surface, not isotropic generation in a volume</div>
<p>SiH₃·/O· radicals are generated <b>throughout the bulk plasma</b> by dissociation, with no preferred direction. Sputtered Al atoms leave a localized <b>surface</b> (the target) with a cosine-like distribution — predominantly toward the wafer.</p>
<div class="deep-eq">PE-CVD:   generation volumetric + isotropic   →  transport diffusion-dominated (Fick's law)
Sputter:  generation surface + directional    →  transport near line-of-sight (ballistic)</div>
<p>This difference has a major practical consequence: <b>step coverage</b>. Diffusion-dominated transport coats sidewalls and trench bottoms relatively conformally. Near line-of-sight transport preferentially coats surfaces in "view" of the target, so high-aspect-ratio features suffer <b>overhang at the opening and thin bottom/sidewall coverage</b> — a well-known limitation of conventional sputtering.</p>
<div class="deep-hl">How do we steer metal into the bottom of a deep hole if the depositing atoms are neutral? Answering that requires ionizing the sputtered metal itself — <b>Ionized PVD</b> — which needs a second, high-density plasma source. We return to it after ICP.</div>` }
    },
    { title:'DC Sputtering — The Default, with AC/RF Where DC Fails',
      body:`A metal Al target is a <b>conductor</b>, so <b>DC power is the production default</b> — a DC magnetron supply, no matching network, simple and fast. AC/RF is reserved for cases where DC runs into trouble.
        <ul>
          <li><b>DC mode</b> (default): target held at a constant negative voltage → continuous Ar⁺ bombardment → continuous sputtering. The vast majority of production metal PVD (Al, Cu, Ti, Ta, W…) runs this way, often as <b>pulsed-DC</b> for arc suppression.</li>
          <li><b>AC/RF mode</b>: polarity oscillates at 13.56 MHz (with a matcher). Needed when the target surface is — or becomes — <b>insulating</b> (see Deep Dive).</li>
        </ul>
        Toggle DC ↔ AC below — both sustain the plasma on this clean metal target; the deep dives explain why that picture changes in modern processes.`,
      hint:'🔁 Toggle DC ↔ AC below — DC is the default; AC/RF is the fallback for insulating targets.',
      deepDive:[{
        title:'Why DC Is the Natural Default for a Metal Target',
        body:`<p>PE-CVD Class 1 (Step 6 deep dive) showed that DC fails for SiO₂ deposition because the growing <b>insulating</b> film charges up like a capacitor, cancelling the applied field until the plasma stalls.</p>
<div class="deep-eq">PE-CVD (insulating film):
DC bias → (+) charge accumulates on insulating SiO₂ surface → no path to ground
→ accumulated charge cancels applied field → net field → 0 → plasma stalls
→ AC required: charge/neutralize cycle each half-period prevents net buildup</div>
<p><b>The Al target is a conductor.</b> Positive charge delivered by incoming Ar⁺ ions is immediately neutralized by the free electrons of the metal, replenished from the external power supply circuit. There is no insulating layer to "charge up" — the target behaves like an ordinary electrode in a closed circuit.</p>
<div class="deep-eq">Sputter PVD (conductive target):
DC bias → (+) charge from Ar⁺ neutralized instantly by free electrons in Al
→ charge flows continuously through external circuit → closed loop
→ net field maintained indefinitely → plasma sustained under pure DC</div>
<div class="deep-hl">This is why DC is the natural starting point for metal PVD: it is the simplest circuit that works, with no need for the charge/neutralize machinery that AC provides. AC only becomes necessary once that simple picture breaks down — the topic of the next deep dive.</div>`
      },{
        title:'Why Is AC/RF (or Pulsed-DC) Needed in Modern Semiconductor PVD?',
        body:`<p>If a clean metal target is a perfect conductor, DC should always be enough. In practice, two situations break that assumption.</p>
<div class="deep-hl">① Target Poisoning in Reactive Sputtering</div>
<p>Many PVD steps are <b>reactive</b>: N₂ or O₂ is added to Ar so the sputtered metal forms a compound film directly — TiN and TaN barriers, AlN, Al₂O₃. The same reactive gas also reacts with the <b>target surface</b>, forming a thin insulating compound layer — <b>target poisoning</b>. In a magnetron, poisoning grows first <b>outside the racetrack</b> (target center and edges), where sputter cleaning is weak.</p>
<div class="deep-eq">Reactive sputtering (e.g. Al target + O₂):
Target surface outside racetrack: Al + O₂ → Al₂O₃ (insulating patch)
→ Under pure DC: the patch charges up exactly like the PE-CVD SiO₂ case
→ local breakdown → micro-arcs, particles, rate instability
→ pulsed-DC or AC/RF needed to discharge the patch each cycle</div>
<div class="deep-hl">② Direct Sputtering of Insulating (Dielectric / High-k) Targets</div>
<p>For targets that are <b>insulators from the start</b> (Al₂O₃, SiO₂, HfO₂…), the situation is the PE-CVD Class 1 case from the beginning: the target itself is the insulating "film" that charges up under DC. RF (13.56 MHz, with a matcher) is required for the discharge to be sustained at all — and the target then reaches its negative potential by RF self-bias (Step 3 deep dive, route ②).</p>
<div class="deep-hl">③ The Practical Middle Ground — Pulsed-DC</div>
<p>Full RF hardware is more complex and costly than DC. The dominant industrial compromise for moderately reactive processes is <b>pulsed-DC</b> (typically tens to a few hundred kHz): the target voltage is briefly reversed, just often enough to bleed off charge on poisoned patches, without the complexity of RF.</p>
<div class="deep-hl">Summary: DC (and pulsed-DC) remains the default for metal targets because it is the simplest circuit that works on a clean conductor. As processes move toward reactive sputtering and direct PVD of dielectrics, the PE-CVD charge-accumulation problem re-appears at the target, making pulsed-DC or RF necessary for those applications.</div>`
      }]
    },
    { title:'Al Film Growth on the Wafer',
      body:`Al atoms arriving at the wafer surface accumulate into a continuous metal film.
        <ul>
          <li>Deposition rate ∝ (sputtering yield) × (Ar⁺ flux under the racetrack) × (transport efficiency to the wafer, Step 6)</li>
          <li>Film grows by nucleation → island coalescence → continuous film, typical of metal PVD</li>
          <li>No chemical by-products to pump away — unlike PE-CVD's N₂/H₂O</li>
          <li>Film quality (grain size, resistivity, stress) depends on adatom mobility, set by substrate temperature and any ion assist</li>
        </ul>
        Watch the grey Al layer thicken on the wafer.`,
      hint:'🎯 Watch the Al layer (grey) thicken on the wafer.',
      deepDive:{
        title:'Why No Chemical Equation Here?',
        body:`<p>PE-CVD Class 1 ended its deposition step with an overall reaction (<code>SiH₄ + 4N₂O → SiO₂ + 4N₂ + 2H₂O</code>) — a genuine chemical transformation with by-products requiring vacuum removal.</p>
<div class="deep-hl">Sputter PVD has no analogous equation, because no chemical bonds are broken or formed in the deposition step itself. The process is, in essence: Al(solid, target) → Al(vapor, transported) → Al(solid, film). The atom's chemical identity never changes — only its location and, briefly, its phase/kinetic state.</div>
<p>This is why sputtering is a <b>physical</b> vapor deposition process, in contrast to the <b>chemical</b> vapor deposition of PE-CVD. The plasma's role in both cases is to provide energetic ions — but in PE-CVD those ions densify a film formed by surface chemistry, while in PVD those ions <b>are</b> the mechanism that liberates the film material from its source.</p>
<div class="deep-hl">Practical implication: PVD film purity is set largely by target purity and chamber base pressure (residual gas incorporation), since there is no precursor chemistry to control stoichiometry. PE-CVD composition, by contrast, is tuned via gas flow ratios because it <b>is</b> a chemical reaction.</div>` }

      hint:'💡 Chamber 각 부품에 마우스를 올려 보세요 — Magnet Pack, 아치형 B-field, Top View Inset도 포함됩니다.',
      deepDive:{
        title:'Target은 금속인데, 자기장은 어떻게 통과할까?',
        body:`<p>금속이 자기장을 막는 경우는 두 가지뿐이며, Magnetron의 Al Target은 어느 쪽에도 해당하지 않습니다.</p>
<div class="deep-hl">① 금속이 <b>강자성체</b>(Fe, Ni, Co)인 경우. 투자율이 매우 커서(μr ≫ 1) 자속을 자기 내부로 끌어들여 흘려보내므로, Target 앞쪽에는 자기장이 거의 남지 않습니다. 이것을 자속 <b>Shunting</b>이라고 합니다.</div>
<div class="deep-hl">② 자기장이 <b>시간에 따라 변하는</b>(AC/RF) 경우. 도체 안에 와전류(Eddy Current)가 유도되어 내부 자기장을 상쇄합니다 — 표피 효과(Skin Effect). 변화가 빠르고 도체가 좋을수록 침투 깊이가 얇아집니다.</div>
<p>영구자석의 자기장은 <b>정적(Static)</b>이므로 ②는 적용되지 않습니다. 변하지 않는 B-field는 와전류를 만들지 않고, 전도도와도 무관합니다. 또한 Al(그리고 Cu Backing Plate)은 <b>비자성체</b>(μr ≈ 1.00002)이므로 ①도 적용되지 않습니다. 정적 자기장 입장에서 Al Target은 공기나 진공과 사실상 같습니다.</p>
<div class="deep-eq">정적 B → Al / Cu (μr ≈ 1):        거의 그대로 통과
정적 B → Ni / Co / Fe (μr ≫ 1):   Target 내부로 Shunt → 앞쪽 B∥ 약화
RF B (13.56 MHz) → Al:  표피 깊이 δ = √(2ρ / ωμ) ≈ 22 µm  → 차단</div>
<p>실제로 자석의 효과를 제한하는 것은 <b>거리</b>입니다. 자기장은 극에서 멀어질수록 빠르게 약해지고, 자석은 Backing Plate와 Target 뒤(합계 보통 1–2 cm)에 있습니다. 그래서 Target 두께는 Magnetron 설계 변수이며, Groove가 깊어질수록 깎인 면이 자석에 가까워져 더 강한 자기장을 받게 됩니다.</p>
<div class="deep-hl">실무적 결과 두 가지: <b>강자성 Target</b>(Silicide용 Ni, Co)은 얇게 만들거나 훨씬 강한 자석을 써야 합니다. 그리고 <b>회전 자석</b>은 Cu Backing Plate에 작은 와전류를 만들지만, 초당 1회전 정도로는 13.56 MHz와 비교할 수 없을 만큼 미미합니다. 같은 표피 효과 때문에 다음 Chapter의 ICP Coil은 금속 덮개가 아닌 <b>유전체 Window</b>를 통해 결합해야 합니다 — RF 자기장은 금속을 통과하지 못하기 때문입니다.</div>` }

      hint:'⚡ 전자가 전기장에서 에너지를 얻어 Ar와 충돌하며 이온화시킵니다.',
      deepDive:{
        title:'왜 Argon인가? 왜 반응성 가스가 아닌가?',
        body:`<p>PE-CVD에서는 공정 가스(SiH₄, N₂O)가 막 형성 반응에 <b>화학적으로</b> 참여하기 때문에 선택됩니다. Sputter 증착에서는 상황이 반대입니다 — 막 재료(Al)는 이미 Chamber 안에 Target이라는 고체 형태로 존재합니다. Plasma의 유일한 역할은 <b>이 Target에서 원자를 물리적으로 떼어낼 이온을 생성</b>하는 것입니다.</p>
<div class="deep-hl">이것이 불활성 가스가 선호되는 이유입니다: Ar는 막의 화학 성분에 아무것도 기여하지 않습니다. 이온화 에너지(약 15.8 eV)가 충분히 낮아 효율적으로 이온화되며, 원자 질량(40 amu)이 충분히 무거워 충돌 시 상당한 운동량을 전달합니다 — 둘 다 Sputtering에 유리한 특성입니다. 공기 중에 풍부해 값이 싸다는 점도 장점입니다.</div>
<p>반응성 가스(예: 질화물/산화물 \"Reactive Sputtering\"을 위한 N₂ 또는 O₂)를 추가하면, Sputter된 금속이 기판에서 — 그리고 Target 표면에서도 — 반응하여 TiN, TaN, AlN, Al₂O₃를 형성합니다. 이는 실제로 널리 쓰이는 기법이지만, 여기서 다루는 기본 Ar Sputter 공정 위에 의도적으로 추가하는 것입니다 (Step 7 참고).</p>
<div class="deep-hl">PE-CVD와의 핵심 대비: PE-CVD에서는 가스 자체가 막의 전구체(Precursor)입니다. 여기서는 가스가 <b>운동량 전달용 발사체(Projectile)</b>일 뿐이며 — 막의 전구체는 고체 Target 자체입니다.</div>` }
    },
    { title:'Cathode Sheath — Target이 수백 V 음(−)전위에 있는 이유',
      body:`DC Sputtering에서는 Power Supply가 도전성 Al Target에 음(−)전압을 <b>직접 인가</b>합니다 (Magnetron에서 보통 −300 ~ −700 V). Plasma는 접지보다 수 V 높은 전위에 있으므로, 인가 전압의 거의 전부가 Target 앞의 얇은 <b>Cathode Sheath</b>에 걸립니다.
        <ul>

      hint:'🔬 V_target이 음(−)으로 커지며 Cathode Sheath가 짙어지는 것을 관찰하세요. Target에서 아래로 튀어나오는 빨간 e⁻가 2차(γ) 전자입니다.',
      deepDive:{
        title:'Target을 음(−)으로 만드는 두 가지 방법 — DC 직접 인가 vs RF Self-Bias',
        body:`<p>Class 2(Dry Etch)에서 웨이퍼 전극은 <b>RF Self-Bias</b>로 강한 음(−)전위가 되었습니다 — Blocking Capacitor + 작은 Power 전극 면적, 그리고 Flux Balance(Γ_e = Γ_i)가 큰 음의 V_DC를 만들었습니다. Sputter Target도 같은 최종 상태 — 이온이 날아드는 두껍고 높은 전압의 Sheath — 에 도달하지만, 경로는 두 가지입니다:</p>
<div class="deep-eq">① DC Sputtering (도전성 금속 Target — Al, Ti, Ta, Cu, W…)
   Power Supply가 V_target을 직접 인가 (Magnetron: −300 ~ −700 V)
   Plasma 전위 ≈ 접지보다 수 V 높음
   → Cathode Sheath ≈ |V_target|  →  E_ion ≈ e·|V_target|

② RF Sputtering (절연성 Target — Al₂O₃, SiO₂, HfO₂…)
   절연성 Target 자체가 Blocking Capacitor 역할
   Flux Balance + 작은 Target 면적 vs 큰 접지 면적

// ── Helpers ───────────────────────────────────────────────────
function gauss(){let u=0,v=0;while(u===0)u=Math.random();while(v===0)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
function wrapText(text,cx,cy,maxW,lineH){
  const words=text.split(' ');
  const lines=[];let cur='';
  for(const w of words){
    const test=cur?cur+' '+w:w;
    if(ctx.measureText(test).width>maxW&&cur){lines.push(cur);cur=w;}else cur=test;
  }
  if(cur)lines.push(cur);
  const startY=cy-(lines.length-1)*lineH/2;
  lines.forEach((ln,i)=>ctx.fillText(ln,cx,startY+i*lineH));
}
function pipe(pts,col='#b3bac8',w=2.2){
  ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.stroke();
}
function arw(x0,y0,x1,y1,col='#1d2436',w=1.2){
  ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=w;
  ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.stroke();
  const a=Math.atan2(y1-y0,x1-x0),h=5.5;
  ctx.beginPath();ctx.moveTo(x1,y1);
  ctx.lineTo(x1-h*Math.cos(a-0.4),y1-h*Math.sin(a-0.4));
  ctx.lineTo(x1-h*Math.cos(a+0.4),y1-h*Math.sin(a+0.4));
  ctx.closePath();ctx.fill();
}
function gnd(cx,cy){
  ctx.strokeStyle='#1d2436';ctx.lineWidth=1.5;ctx.beginPath();
  ctx.moveTo(cx,cy);ctx.lineTo(cx,cy+6);
  ctx.moveTo(cx-10,cy+6);ctx.lineTo(cx+10,cy+6);
  ctx.moveTo(cx-7,cy+10);ctx.lineTo(cx+7,cy+10);
  ctx.moveTo(cx-4,cy+14);ctx.lineTo(cx+4,cy+14);

}
function chem(formula,x,y,sz=11,col='#1d2436'){
  ctx.fillStyle=col;
  const bF=`bold ${sz}px ${FONT}`,sF=`bold ${Math.round(sz*.7)}px ${FONT}`,pF=`bold ${Math.round(sz*.75)}px ${FONT}`;
  ctx.textAlign='left';ctx.textBaseline='middle';
  const segs=[];let i=0;
  while(i<formula.length){
    const ch=formula[i];
    if(/[A-Za-z]/.test(ch)){let s=ch;while(i+1<formula.length&&/[a-z]/.test(formula[i+1])){s+=formula[++i];}segs.push({t:'b',s});}
    else if(/[0-9]/.test(ch))segs.push({t:'sub',s:ch});
    else if(ch==='+'||ch==='-')segs.push({t:'sup',s:ch});
    i++;
  }
  let tot=0;for(const s of segs){ctx.font=s.t==='b'?bF:s.t==='sub'?sF:pF;tot+=ctx.measureText(s.s).width;}
  let cx=x-tot/2;
  for(const s of segs){
    ctx.font=s.t==='b'?bF:s.t==='sub'?sF:pF;
    const oy=s.t==='sub'?sz*.30:s.t==='sup'?-sz*.32:0;
    ctx.fillText(s.s,cx,y+oy);cx+=ctx.measureText(s.s).width;
  }
}

// ── Magnetron geometry helpers ────────────────────────────────
function rtX(side){return (side<0?RT0.L:RT0.R)+magOff;}           // racetrack crossing x in this cross-section
function depthAt(x){const i=Math.floor((x-SH.x)/SH.w*NB);return (i>=0&&i<NB)?EP[i]/Math.max(1,EPmax):0;}
const GROOVE_PX=16;
function faceY(x){return TGT_BOT-depthAt(x)*GROOVE_PX;}
function erode(x,k=0.03){
  const i0=(x-SH.x)/SH.w*NB;
  for(let i=Math.max(0,Math.floor(i0-5));i<=Math.min(NB-1,Math.ceil(i0+5));i++){
    EP[i]+=k*Math.exp(-((i-i0)**2)/(2*1.6*1.6));if(EP[i]>EPmax)EPmax=EP[i];
  }
}
function utilization(){let s=0,m=0;for(let i=0;i<NB;i++){s+=EP[i];if(EP[i]>m)m=EP[i];}return m>0?s/NB/m:0;}
function maxDepth(){return EPmax;}
function updRotation(dt){
  if(rotating){rotAngle+=dt*0.9;magOff=58*Math.cos(rotAngle);}
  else{magOff*=Math.pow(0.02,dt);}
}

// ── Particle system ───────────────────────────────────────────
function spawn(type,x,y,vx=null,vy=null){
  const p={type,x,y,vx:vx!==null?vx:(Math.random()-.5)*.4,vy:vy!==null?vy:(Math.random()-.5)*.4,age:0};
  particles.push(p);return p;
}
let pendingSpawns=[];
function spawnQueued(type,x,y,vx=null,vy=null){
  const p={type,x,y,vx:vx!==null?vx:(Math.random()-.5)*.4,vy:vy!==null?vy:(Math.random()-.5)*.4,age:0};
  pendingSpawns.push(p);return p;
}
function flushSpawns(){ if(pendingSpawns.length){ particles.push(...pendingSpawns); pendingSpawns=[]; } }
function rndPt(){return{x:PL.x+10+Math.random()*(PL.w-20),y:PL.y+8+Math.random()*(PL.h-16)};}
function rndPtTop(){return{x:PL.x+10+Math.random()*(PL.w-20),y:PL.y+6+Math.random()*Math.min(40,PL.h*0.3)};}
function clr(){particles=[];lights=[];impacts=[];atoms=[];trapE=[];gammaE=[];pendingSpawns=[];}
function updP(p,dt,o){
  const d=SP[p.type];p.age+=dt;
  if(d.q!==0&&o.fieldActive){
    const sb=p.y<ST.y+ST.h||p.y>SB.y?3.5:1;
    p.vy+=d.q*o.fieldDir*o.fieldStrength*sb/Math.max(d.m,.001)*dt*.5;
  }
  const br=o.brownian??0.08,dr=o.drag??0.96;
  if(d.cat==='neutral'||d.cat==='radical'){p.vx+=(Math.random()-.5)*br;p.vy+=(Math.random()-.5)*br;}
  else p.vx+=(Math.random()-.5)*(br*.5);
  p.vx*=dr;p.vy*=dr;
  const mx=d.cat==='electron'?4.5:d.cat==='ion'?2.2:1.0,sp=Math.hypot(p.vx,p.vy);
  if(sp>mx){p.vx*=mx/sp;p.vy*=mx/sp;}
  p.x+=p.vx;p.y+=p.vy;
  if(p.x<PL.x+4){p.x=PL.x+4;p.vx=Math.abs(p.vx)*.4;}
  if(p.x>PL.x+PL.w-4){p.x=PL.x+PL.w-4;p.vx=-Math.abs(p.vx)*.4;}
  const top=faceY(p.x)+2;
  if(p.y<top){
    if(d.cat==='electron'&&o.absorbElectronTop)return false;
    if(d.cat==='ion'&&o.absorbIonTop){o.onImpact&&o.onImpact(p,'top');return false;}
    p.y=top;p.vy=Math.abs(p.vy)*.4;
  }
  if(p.y>SB.y+SB.h-2){
    if(d.cat==='ion'&&o.absorbIonBot){o.onImpact&&o.onImpact(p,'bot');return false;}
    if(d.cat==='electron'&&o.absorbElectronBot)return false;
    p.y=SB.y+SB.h-2;p.vy=-Math.abs(p.vy)*.4;
  }
  return true;
}
function drawParts(){for(const p of particles){const d=SP[p.type];chem(d.f,p.x,p.y,d.sz,d.c);}}
function emitL(x,y,col='rgba(255,220,200,1)',life=.6){lights.push({x,y,col,life,maxLife:life,r:0});}
function updL(dt){for(let i=lights.length-1;i>=0;i--){const L_=lights[i];L_.life-=dt;L_.r+=30*dt;if(L_.life<=0)lights.splice(i,1);}}
function drawL(){
  for(const L_ of lights){const a=L_.life/L_.maxLife,g=ctx.createRadialGradient(L_.x,L_.y,0,L_.x,L_.y,Math.max(L_.r,.1));
    g.addColorStop(0,L_.col.replace('1)',`${a})`));g.addColorStop(1,L_.col.replace('1)','0)'));
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(L_.x,L_.y,Math.max(L_.r,.1),0,Math.PI*2);ctx.fill();}
}
function addImp(x,y){impacts.push({x,y,life:.4,maxLife:.4});}
function updImp(dt){for(let i=impacts.length-1;i>=0;i--){impacts[i].life-=dt;if(impacts[i].life<=0)impacts.splice(i,1);}}
function drawImp(){
  for(const I of impacts){const a=I.life/I.maxLife;ctx.strokeStyle=`rgba(232,85,59,${a})`;ctx.lineWidth=1.4;
    ctx.beginPath();for(let k=0;k<8;k++){const ag=k*Math.PI*2/8,r0=4,r1=4+(1-a)*12;ctx.moveTo(I.x+r0*Math.cos(ag),I.y+r0*Math.sin(ag));ctx.lineTo(I.x+r1*Math.cos(ag),I.y+r1*Math.sin(ag));}ctx.stroke();}
}

// ── Sputtered Al atoms: ballistic flight with pressure-dependent gas collisions ──
function emitAl(x){
  const th=Math.asin(2*Math.random()-1)*0.98, sp=1.1+Math.random()*0.6; // cosine-like distribution
  atoms.push({x,y:faceY(x)+3,vx:Math.sin(th)*sp,vy:Math.cos(th)*sp,hit:0});
}
function updAtoms(collectFilm){
  const lamPx=(6/pressure)*PX_PER_CM;
  for(let i=atoms.length-1;i>=0;i--){
    const a=atoms[i],s=Math.hypot(a.vx,a.vy);
    if(Math.random()<s/lamPx){ // gas collision: random new direction, energy loss
      const ang=Math.random()*Math.PI*2,ns=Math.max(.38,s*.62);a.vx=Math.cos(ang)*ns;a.vy=Math.sin(ang)*ns;a.hit=.25;
    }
    a.x+=a.vx;a.y+=a.vy;a.hit=Math.max(0,a.hit-.016);
    if(a.x<PL.x||a.x>PL.x+PL.w||a.y<faceY(a.x)){atoms.splice(i,1);continue;}
    if(a.y>WF.y-2-Math.min(filmThickness,30)){
      if(a.x>=WF.x&&a.x<=WF.x+WF.w){if(collectFilm)filmThickness+=.5;emitL(a.x,WF.y-Math.min(filmThickness,30),AL_GLOW,.3);}
      atoms.splice(i,1);
    }
  }
  if(atoms.length>100)atoms.splice(0,atoms.length-100);
}
function drawAtoms(){
  for(const a of atoms){
    if(a.hit>0){ctx.strokeStyle=`rgba(232,85,59,${a.hit*3})`;ctx.lineWidth=1;ctx.beginPath();ctx.arc(a.x,a.y,8,0,Math.PI*2);ctx.stroke();}
    chem('Al',a.x,a.y,11,'#7a8aa3');
  }
}

// ── Electrons for the magnetron steps ──
function ensureTrapped(n){
  while(trapE.length<n)trapE.push({side:Math.random()<.5?-1:1,ph:Math.random()*6.28,wb:2.2+Math.random()*1.6,k:.35+Math.random()*.55,g:Math.random()*6.28});
  if(trapE.length>n)trapE.length=n;
}
function trapPos(e){
  const u=Math.sin(e.ph),xc=rtX(e.side),aE=RT0.a*e.k,bE=60*e.k*.8;
  return {x:xc+aE*u+3.5*Math.cos(e.g), y:TGT_BOT+5+bE*Math.sqrt(Math.max(0,1-u*u))+2.5*Math.sin(e.g)};
}
function updTrapped(dt){for(const e of trapE){e.ph+=dt*e.wb;e.g+=dt*16;}}
function drawTrapped(){for(const e of trapE){const p=trapPos(e);chem('e-',p.x,p.y,9,B.red);}}
// γ-electrons launched from the target face (diode / step 3)
function launchGamma(x,fade){gammaE.push({x,y:faceY(x)+4,vx:(Math.random()-.5)*.5,vy:3.2+Math.random()*.6,life:fade?0.6:9,fade});}
function updGamma(dt,ionize,lamIzPx){
  for(let i=gammaE.length-1;i>=0;i--){
    const e=gammaE[i];e.x+=e.vx;e.y+=e.vy;e.life-=dt;
    if(ionize&&Math.random()<e.vy/lamIzPx){spawnQueued('Ar+',e.x,e.y,(Math.random()-.5)*.3,-1.2);emitL(e.x,e.y,'rgba(255,230,180,1)',.35);}
    if(e.y>WF.y-2){if(e.x>=WF.x&&e.x<=WF.x+WF.w)emitL(e.x,WF.y,'rgba(232,85,59,1)',.35);gammaE.splice(i,1);continue;}
    if(e.life<=0)gammaE.splice(i,1);
  }
}
function drawGamma(){
  for(const e of gammaE){const a=e.fade?Math.max(0,e.life/.6):1;ctx.globalAlpha=a;
    ctx.strokeStyle='rgba(232,85,59,.35)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(e.x-e.vx*5,e.y-e.vy*5);ctx.lineTo(e.x,e.y);ctx.stroke();
    chem('e-',e.x,e.y,9,B.red);ctx.globalAlpha=1;}
}

function setupStep(i){
  clr();
  if(i!==8)filmThickness=0;
  if(i>=2&&i<=3){
    for(let k=0;k<28;k++){const p=rndPt();spawn('Ar',p.x,p.y);}
    for(let k=0;k<3;k++){const p=rndPt();spawn('e-',p.x,p.y);}
    for(let k=0;k<2;k++){const p=rndPt();spawn('Ar+',p.x,p.y);}
  }
  if(i>=4&&i<=8){for(let k=0;k<16;k++){const p=rndPt();spawn('Ar',p.x,p.y);}}
  if(i===3)sheathBuild=0;
  if(i<=5){EP.fill(0);EPmax=0;sputtered=0;}
  renderStepCtrl(i);
}

let t4=0,t4g=0;
function s4(dt,t){ // magnetron lab

}

    rr(LX,cy,LWd,chh,8);ctx.strokeStyle='rgba(15,140,80,.28)';ctx.lineWidth=.8;ctx.stroke();
    ctx.fillStyle=B.green;ctx.beginPath();ctx.arc(LX+22,cy+chh/2,11,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.font=`bold 13px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('✓',LX+22,cy+chh/2);
    ctx.fillStyle='#0a5e34';ctx.font=`bold 12.5px ${FONT}`;ctx.textAlign='left';ctx.fillText(title,LX+42,cy+24);
    ctx.fillStyle='#4a5565';ctx.font=`10.5px ${FONT}`;ctx.fillText(desc,LX+42,cy+48);
  });
  const RX=446,RW=436;secLbl(L().takeawayParams,RX,84);
  const TY=98,RH=30,cols=[0,170,303,436],totH=RH*(L().tRows.length+1);
  ctx.save();rr(RX,TY,RW,totH,8);ctx.clip();
  ctx.fillStyle=B.purple;ctx.fillRect(RX,TY,RW,RH);
  L().tHeaders.forEach((h,ci)=>{const mx=RX+(cols[ci]+cols[ci+1])/2;ctx.fillStyle='#fff';ctx.font=`bold 11.5px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(h,mx,TY+RH/2);});
  L().tRows.forEach((row,ri)=>{
    const ry=TY+RH+ri*RH;ctx.fillStyle=ri%2===0?B.purpleSoft:'#fff';ctx.fillRect(RX,ry,RW,RH);
    ctx.strokeStyle='#ddd0ee';ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(RX,ry+RH);ctx.lineTo(RX+RW,ry+RH);ctx.stroke();
    [1,2].forEach(ci=>{ctx.beginPath();ctx.moveTo(RX+cols[ci],ry);ctx.lineTo(RX+cols[ci],ry+RH);ctx.stroke();});
    row.forEach((cell,ci)=>{
      ctx.fillStyle=ci===0?B.charcoal:ci===1?B.purple:'#6b7388';ctx.font=ci===0?`11px ${FONT}`:`bold 11px ${FONT}`;
      ctx.textAlign=ci===0?'left':'center';ctx.textBaseline='middle';
      ctx.fillText(cell,ci===0?RX+8:RX+(cols[ci]+cols[ci+1])/2,ry+RH/2);
    });
  });
  ctx.restore();rr(RX,TY,RW,totH,8);ctx.strokeStyle='#d0c0e8';ctx.lineWidth=1;ctx.stroke();
  const PWY=TY+totH+18;
  ctx.fillStyle=B.green;ctx.fillRect(RX,PWY,3,14);ctx.fillStyle=B.charcoal;ctx.font=`bold 12px ${FONT}`;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(L().takeawayWindow,RX+10,PWY+7);
  L().pwItems.forEach(([k,v],i)=>{
    const py=PWY+26+i*22;ctx.fillStyle='#7a7a8a';ctx.font=`11px ${FONT}`;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(k,RX+10,py);
    ctx.fillStyle=B.charcoal;ctx.font=`bold 11px ${FONT}`;ctx.textAlign='right';ctx.fillText(v,RX+RW-6,py);
  });
  {
    const ibY=PWY+26+L().pwItems.length*22+4, ibH=40;
    ctx.save();rr(RX,ibY,RW,ibH,8);ctx.clip();
    ctx.fillStyle='rgba(112,48,160,0.07)';ctx.fillRect(RX,ibY,RW,ibH);
    ctx.restore();
    rr(RX,ibY,RW,ibH,8);ctx.strokeStyle='rgba(112,48,160,0.32)';ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle=B.purple;ctx.font=`bold 10.5px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';
    wrapText(L().pecvdCompareNote,RX+RW/2,ibY+ibH/2,RW-24,13);
  }
  const BX=20,BY=528,BW=W-40,BH=74,HDH=30;
  ctx.save();rr(BX,BY,BW,BH,8);ctx.clip();ctx.fillStyle='rgba(242,201,76,.13)';ctx.fillRect(BX,BY,BW,HDH);ctx.fillStyle='#fff';ctx.fillRect(BX,BY+HDH,BW,BH-HDH);ctx.restore();
  rr(BX,BY,BW,BH,8);ctx.strokeStyle='rgba(190,155,40,.32)';ctx.lineWidth=.8;ctx.stroke();
  ctx.strokeStyle='rgba(190,155,40,.32)';ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(BX+1,BY+HDH);ctx.lineTo(BX+BW-1,BY+HDH);ctx.stroke();
  ctx.fillStyle='rgba(242,201,76,.50)';ctx.beginPath();ctx.arc(BX+20,BY+HDH/2,9,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#7a5800';ctx.font=`bold 12px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('!',BX+20,BY+HDH/2);
  ctx.fillStyle=B.charcoal;ctx.font=`bold 12.5px ${FONT}`;ctx.textAlign='left';ctx.fillText(L().takeawayLimits,BX+36,BY+HDH/2);
  ctx.fillStyle='#5a6070';ctx.font=`10.5px ${FONT}`;
  L().limitLines.forEach((ln,i)=>ctx.fillText(ln,BX+14,BY+HDH+16+i*18));
  drawLogo(.55);
}

const RENDERS=[s0,s1,s2,s3,s4,s5,s6,s7,s8,s9];

// ── Step controls ─────────────────────────────────────────────
function mkToggle(labels,activeIdx,onPick){
  const wrap=document.createElement('div');wrap.className='mode-toggle';
  labels.forEach((lb,k)=>{const b=document.createElement('button');b.textContent=lb;if(k===activeIdx)b.classList.add('active');
    b.addEventListener('click',()=>onPick(k));wrap.appendChild(b);});
  return wrap;
}
function renderStepCtrl(i){
  stepCtrlEl.innerHTML='';
  if(i===4){
    stepCtrlEl.appendChild(mkToggle([L().magOn,L().magOffLbl],magnetOn?0:1,k=>{magnetOn=(k===0);setupStep(4);}));
    const lab=document.createElement('span');lab.className='mode-info';lab.textContent=L().pLabel;stepCtrlEl.appendChild(lab);
    const sl=document.createElement('input');sl.type='range';sl.min='1';sl.max='50';sl.step='1';sl.value=String(pressure);sl.className='p-slider';
    const val=document.createElement('span');val.className='p-val';val.textContent=`${pressure} mTorr`;
    sl.addEventListener('input',()=>{pressure=+sl.value;val.textContent=`${pressure} mTorr`;});
    stepCtrlEl.appendChild(sl);stepCtrlEl.appendChild(val);
  }else if(i===5){
    stepCtrlEl.appendChild(mkToggle([L().staticLbl,L().rotLbl],rotating?1:0,k=>{rotating=(k===1);EP.fill(0);EPmax=0;sputtered=0;renderStepCtrl(5);}));
    const btn=document.createElement('button');btn.className='reset-btn';btn.textContent=L().resetTarget;
    btn.addEventListener('click',()=>{EP.fill(0);EPmax=0;sputtered=0;});stepCtrlEl.appendChild(btn);
  }else if(i===7){
    stepCtrlEl.appendChild(mkToggle(['DC','AC'],mode==='AC'?1:0,k=>{mode=k?'AC':'DC';setupStep(7);}));
    const note=document.createElement('span');note.className='mode-info';
    note.textContent=mode==='AC'?L().modeInfoAC:L().modeInfoDC;stepCtrlEl.appendChild(note);
  }else if(i===8){
    const btn=document.createElement('button');btn.className='reset-btn';btn.textContent=L().resetFilm;
    btn.addEventListener('click',()=>{filmThickness=0;});stepCtrlEl.appendChild(btn);
  }
}

// ── Main loop ─────────────────────────────────────────────────
function render(){
  const now=performance.now(),dt=Math.min((now-lastT)/1000,.05);lastT=now;
  ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=B.bg;ctx.fillRect(0,0,canvas.width,canvas.height);ctx.restore();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(renderScale * DPR, renderScale * DPR);
  ctx.translate(renderOffX / renderScale, renderOffY / renderScale);
  // the magnet stays ON outside the lab step (the lab is the only place it can be removed)
  if(currentStep!==4&&!magnetOn)magnetOn=true;
  if(currentStep<9)updRotation(dt);
  RENDERS[currentStep](dt,(now-t0)/1000);
  requestAnimationFrame(render);
}
document.fonts.ready.then(()=>render()).catch(()=>render());

// ── Step buttons ──────────────────────────────────────────────
const sBEl=document.getElementById('stepButtons');
function buildBtns(){
  sBEl.innerHTML='';
  L().steps.forEach((s,i)=>{
    const b=document.createElement('button');b.className='step-btn'+(i===currentStep?' active':'');
    b.textContent=i===0?'S':i===L().steps.length-1?'K':i;b.title=s.title;
    b.addEventListener('click',()=>setStep(i));sBEl.appendChild(b);
  });
}
const prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn');
prevBtn.addEventListener('click',()=>setStep(currentStep-1));
nextBtn.addEventListener('click',()=>setStep(currentStep+1));

function fmtHint(raw){
  if(!raw)return'';const sp=raw.indexOf(' ');
  if(sp>0){const icon=raw.slice(0,sp),body=raw.slice(sp+1);if(/\p{Emoji}/u.test(icon))return`<div class="hint-icon">${icon}</div><div class="hint-text">${body}</div>`;}
  return`<div class="hint-text">${raw}</div>`;
}
const DEEP_DIVE_LABEL = { en:'Deep Dive', ko:'심화학습' };
function toggleDeepDive(idx){
  const hdr=document.getElementById('ddHdr'+idx), body=document.getElementById('ddBody'+idx);
  if(!hdr||!body)return;
  const open=body.classList.toggle('open');
  hdr.classList.toggle('open',open);
}
function setStep(i){
  if(i<0||i>=L().steps.length)return;currentStep=i;
  document.querySelectorAll('.step-btn.active').forEach(b=>b.classList.remove('active'));
  if(sBEl.children[i])sBEl.children[i].classList.add('active');
  document.getElementById('stepNum').textContent=i===0?'S':i===L().steps.length-1?'K':i;
  document.getElementById('stepTot').textContent=L().steps.length;
  document.getElementById('stepTitle').textContent=L().steps[i].title;
  document.getElementById('stepBody').innerHTML=L().steps[i].body;
  const hEl=document.getElementById('stepHint');
  if(L().steps[i].hint){hEl.innerHTML=fmtHint(L().steps[i].hint);hEl.style.display='';}
  else hEl.style.display='none';
  const ddEl=document.getElementById('deepDiveContainer');
  let dds=L().steps[i].deepDive;
  if(dds && !Array.isArray(dds)) dds=[dds];
  if(dds && dds.length){
    ddEl.innerHTML=dds.map((dd,idx)=>`
      <div class="deep-wrap">
        <div class="deep-hdr" id="ddHdr${idx}" onclick="toggleDeepDive(${idx})">
          <span class="deep-icon">📚</span>
          <span class="deep-title">${dd.title}</span>
          <span class="deep-badge">${DEEP_DIVE_LABEL[lang]}</span>
          <span class="deep-chevron">▼</span>
        </div>
        <div class="deep-body" id="ddBody${idx}">
          <div class="deep-inner">${dd.body}</div>
        </div>
      </div>`).join('');
  } else {
    ddEl.innerHTML='';
  }
  prevBtn.disabled=(i===0);nextBtn.disabled=(i===L().steps.length-1);
  prevBtn.textContent=L().prevBtn;nextBtn.textContent=L().nextBtn;
  document.getElementById('sideInner').scrollTop=0;
  setupStep(i);
}

// ── Language ──────────────────────────────────────────────────
function setLang(l){
  lang=l;
  document.documentElement.lang=l;
  document.getElementById('btnEN').classList.toggle('active',l==='en');
  document.getElementById('btnKO').classList.toggle('active',l==='ko');
  document.getElementById('hTitle').textContent=L().hTitle;
  document.getElementById('hSub').textContent=L().hSub;
  buildBtns();setStep(currentStep);
}

// ── Tooltip ───────────────────────────────────────────────────
function ptIn(x,y,r){return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;}
canvas.addEventListener('mousemove',e=>{
  const cr=canvas.getBoundingClientRect();
  const mx=(e.clientX-cr.left), my=(e.clientY-cr.top);
  const cx=(mx-renderOffX)/renderScale, cy=(my-renderOffY)/renderScale;
  if(currentStep!==0){hoveredHotspot=null;tooltip.classList.remove('show');canvas.style.cursor='default';return;}
  let foundR=null;for(const h of HR){if(ptIn(cx,cy,h.rect)){foundR=h;break;}}
  hoveredHotspot=foundR;
  if(foundR){
    const hs=L().hotspots.find(h=>h.n===foundR.n);
    tooltip.classList.add('show');
    tooltip.innerHTML=`<b>${hs.title}</b><br>${hs.text.replace(/\n/g,'<br>')}`;
    const cardRect=canvas.parentElement.getBoundingClientRect();
    tooltip.style.left=(e.clientX-cardRect.left)+'px';
    tooltip.style.top=(e.clientY-cardRect.top-10)+'px';
    canvas.style.cursor='pointer';
  }else{tooltip.classList.remove('show');canvas.style.cursor='default';}
});
canvas.addEventListener('mouseleave',()=>{hoveredHotspot=null;tooltip.classList.remove('show');});

// ── Init ──────────────────────────────────────────────────────
buildBtns();
setStep(0);
</script>
