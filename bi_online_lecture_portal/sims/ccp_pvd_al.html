<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCP PVD (Sputter) — Interactive Lesson · Benedu Insight</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/benedu-insight/benedu-insight.github.io/refs/heads/main/logo_png/benedu_insight_Symbol.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:          #F7F8FA;
    --panel:       #FFFFFF;
    --ink:         #2D2D2D;
    --muted:       #6B7280;
    --muted2:      #9CA3AF;
    --purple:      #7030A0;
    --purple-soft: #F0E6F6;
    --purple-mid:  #d9b8ed;
    --purple-dark: #521a78;
    --green:       #0F8C50;
    --border:      #E5E7EB;
    --shadow:      0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.06);
    --hdr:         52px;
    --side:        450px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; overflow: hidden; }
  body {
    height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: 'Google Sans','Noto Sans KR','Segoe UI',system-ui,sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header ── */
  .hdr {
    position: fixed; top: 0; left: 0; right: 0; z-index: 200;
    height: var(--hdr); background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 1rem; padding: 0 1.25rem;
    box-shadow: 0 1px 6px rgba(0,0,0,0.07);
  }
  .hdr-logo   { height: 32px; width: auto; flex-shrink: 0; }
  .hdr-div    { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; }
  .hdr-title  { font-size: 0.95rem; font-weight: 700; color: var(--purple); line-height: 1.2; }
  .hdr-sub    {
    font-family: 'JetBrains Mono', monospace; font-size: 0.50rem;
    color: var(--muted2); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 2px;
  }
  .hdr-right  { margin-left: auto; display: flex; align-items: center; gap: 0.5rem; }

  .lang-toggle { display: flex; border: 1px solid var(--border); border-radius: 20px; overflow: hidden; }
  .lang-btn {
    padding: 3px 13px; border: none; background: transparent; cursor: pointer;
    font-family: 'JetBrains Mono', monospace; font-size: 0.60rem; font-weight: 500;
    color: var(--muted2); transition: all 0.16s;
  }
  .lang-btn.active { background: var(--purple); color: #fff; }

  /* ── Main area (below fixed header) ── */
  .main {
    position: fixed;
    top: var(--hdr); left: 0; right: 0; bottom: 0;
    display: grid;
    grid-template-columns: 1fr var(--side);
    gap: 0;
    overflow: hidden;
  }

  /* ── Canvas area ── */
  .canvas-wrap {
    position: relative;
    background: var(--bg);
    display: flex; flex-direction: column;
    padding: 10px 8px 6px 10px;
    overflow: hidden;
  }
  .canvas-card {
    flex: 1;
    background: var(--panel);
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  #cv {
    display: block;
    width: 100%;
    height: 100%;
    flex: 1;
    object-fit: contain;
  }
  /* Step controls below canvas card */
  .step-controls {
    flex-shrink: 0;
    min-height: 28px; height: 28px;
    display: flex; gap: 8px; align-items: center;
    margin-top: 6px; flex-wrap: nowrap; overflow: hidden;
  }
  .mode-toggle {
    display: inline-flex; background: var(--bg);
    border: 1px solid var(--border); border-radius: 20px; padding: 2px; gap: 2px;
  }
  .mode-toggle button {
    border: none; background: transparent; padding: 3px 12px;
    font-family: 'Google Sans', sans-serif; font-size: 0.70rem; font-weight: 600;
    cursor: pointer; color: var(--muted); border-radius: 14px; transition: all 0.14s;
  }
  .mode-toggle button.active { background: var(--purple); color: #fff; }
  .mode-info {
    font-family: 'JetBrains Mono', monospace; font-size: 0.60rem;
    background: var(--purple-soft); color: var(--purple-dark);
    padding: 3px 10px; border-radius: 20px; white-space: nowrap;
  }
  .reset-btn {
    font-family: 'Google Sans', sans-serif; font-size: 0.70rem; font-weight: 600;
    background: var(--panel); border: 1px solid var(--border); border-radius: 7px;
    padding: 4px 12px; cursor: pointer; color: var(--ink); transition: all 0.14s;
    white-space: nowrap;
  }
  .reset-btn:hover { border-color: var(--purple-mid); color: var(--purple); background: var(--purple-soft); }

  /* Tooltip */
  #tooltip {
    position: absolute; pointer-events: none;
    background: rgba(18,22,38,0.97); color: #fff;
    padding: 9px 13px; border-radius: 9px; font-size: 12.5px;
    line-height: 1.6; max-width: 270px;
    transform: translate(-50%,-100%); margin-top: -12px;
    opacity: 0; transition: opacity 0.11s; z-index: 50;
    box-shadow: 0 8px 24px rgba(0,0,0,0.32); border: 1px solid rgba(255,255,255,0.09);
  }
  #tooltip.show { opacity: 1; }
  #tooltip b { color: #c4a0f0; }

  /* ── Side Panel ── */
  .side {
    background: var(--panel);
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .side-inner {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 1rem 1.1rem 0.5rem;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }
  .side-inner::-webkit-scrollbar { width: 4px; }
  .side-inner::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .step-eyebrow {
    font-family: 'JetBrains Mono', monospace; font-size: 0.54rem;
    color: var(--muted2); text-transform: uppercase; letter-spacing: 0.14em; margin-bottom: 0.3rem;
  }
  .step-title { font-size: 1.08rem; font-weight: 700; color: var(--ink); margin-bottom: 0.6rem; line-height: 1.3; }
  .step-body  { font-size: 0.82rem; line-height: 1.76; color: #3a4055; }
  .step-body ul { padding-left: 1.1rem; margin: 0.35rem 0; }
  .step-body li { margin-bottom: 0.28rem; }
  .step-body b  { font-weight: 700; color: var(--ink); }
  .step-body code {
    background: var(--purple-soft); padding: 1px 6px; border-radius: 4px;
    font-family: 'JetBrains Mono', monospace; font-size: 0.70rem; color: var(--purple-dark);
  }
  .hint-box {
    margin-top: 0.7rem; display: flex; gap: 9px; align-items: flex-start;
    background: var(--bg); border: 1px solid var(--border); border-radius: 9px; padding: 9px 11px;
  }
  .hint-icon {
    flex: none; width: 28px; height: 28px; border-radius: 50%;
    background: var(--purple-soft); display: flex; align-items: center;
    justify-content: center; font-size: 13px;
  }
  .hint-text { font-size: 0.71rem; line-height: 1.58; color: #4a5070; flex: 1; align-self: center; }

  /* Deep Dive accordion */
  .deep-wrap {
    margin-top: 0.85rem; border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden; background: var(--panel);
  }
  .deep-hdr {
    display: flex; align-items: center; gap: 0.55rem; padding: 0.65rem 0.85rem;
    cursor: pointer; user-select: none; background: var(--panel); transition: background 0.15s;
  }
  .deep-hdr:hover { background: var(--bg); }
  .deep-hdr.open { background: var(--purple-soft); border-bottom: 1px solid var(--border); }
  .deep-icon  { font-size: 1rem; flex-shrink: 0; }
  .deep-title { font-size: 0.80rem; font-weight: 700; color: var(--ink); flex: 1; line-height: 1.3; }
  .deep-badge {
    background: var(--purple); color: #fff; font-family: 'JetBrains Mono', monospace;
    font-size: 0.50rem; font-weight: 700; padding: 2px 7px; border-radius: 4px; flex-shrink: 0;
    letter-spacing: 0.04em;
  }
  .deep-chevron { font-size: 0.62rem; color: var(--muted2); transition: transform 0.2s; flex-shrink: 0; }
  .deep-hdr.open .deep-chevron { transform: rotate(180deg); }
  .deep-body { max-height: 0; overflow: hidden; transition: max-height 0.35s ease; background: var(--bg); }
  .deep-body.open { max-height: 2000px; }
  .deep-inner { padding: 0.85rem 0.9rem; font-size: 0.76rem; line-height: 1.78; color: #4a5070; }
  .deep-inner p + p { margin-top: 0.6em; }
  .deep-inner b { color: var(--ink); }
  .deep-inner .deep-eq {
    background: var(--charcoal,#2D2D2D); border-radius: 6px; padding: 0.55rem 0.8rem;
    font-family: 'JetBrains Mono', monospace; font-size: 0.74rem; color: #FFD580;
    margin: 0.5rem 0; overflow-x: auto; letter-spacing: 0.03em; line-height: 1.6;
  }
  .deep-inner .deep-hl {
    background: var(--purple-soft); border-left: 3px solid var(--purple);
    border-radius: 0 7px 7px 0; padding: 0.5rem 0.8rem; margin: 0.5rem 0;
    font-size: 0.74rem; line-height: 1.7; color: var(--purple-dark);
  }
  .deep-inner ul { padding-left: 1.1rem; margin: 0.35rem 0; }
  .deep-inner li { margin-bottom: 0.3rem; }

  /* Side footer: step buttons + nav */
  .side-footer {
    flex-shrink: 0;
    padding: 0.65rem 1.1rem 0.8rem;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  .step-btns { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 0.6rem; }
  .step-btn {
    padding: 5px 10px; font-size: 0.70rem; font-weight: 600;
    border: 1px solid var(--border); background: var(--panel); border-radius: 6px;
    cursor: pointer; color: var(--muted); transition: all 0.13s;
    font-family: 'Google Sans', sans-serif; min-width: 30px; text-align: center;
  }
  .step-btn:hover { border-color: var(--purple-mid); color: var(--purple); background: var(--purple-soft); }
  .step-btn.active { background: var(--purple); color: #fff; border-color: var(--purple); }

  .nav-row { display: flex; gap: 7px; }
  .nav-btn {
    flex: 1; padding: 9px; font-size: 0.78rem; font-weight: 700;
    border: none; background: var(--ink); color: #fff; border-radius: 8px;
    cursor: pointer; font-family: 'Google Sans', sans-serif; transition: background 0.14s;
  }
  .nav-btn:hover:not(:disabled) { background: var(--purple); }
  .nav-btn:disabled { background: var(--border); color: var(--muted2); cursor: not-allowed; }

  /* Footer bar */
  .foot {
    display: none; /* hidden — space too tight in full-screen mode */
  }
</style>
</head>

<body>

<!-- Fixed Header -->
<header class="hdr">
  <a href="https://benedu-insight.github.io/" target="_blank" rel="noopener noreferrer"
     style="display:inline-flex;align-items:center;text-decoration:none;">
    <img class="hdr-logo"
      src="https://benedu-insight.github.io/logo_png/benedu_insight_logo_EN_horizontal.png"
      alt="Benedu Insight">
  </a>
  <div class="hdr-div"></div>
  <div>
    <div class="hdr-title" id="hTitle">CCP PVD (Sputter) — Interactive Lesson</div>
    <div class="hdr-sub"   id="hSub">Class 2 · Ar/Al Sputter Deposition · Benedu Insight</div>
  </div>
  <div class="hdr-right">
    <div class="lang-toggle">
      <button class="lang-btn active" id="btnEN" onclick="setLang('en')">EN</button>
      <button class="lang-btn"        id="btnKO" onclick="setLang('ko')">KO</button>
    </div>
  </div>
</header>

<!-- Main 2-column layout -->
<div class="main">

  <!-- Left: Canvas + controls -->
  <div class="canvas-wrap" id="canvasWrap">
    <div class="canvas-card" id="canvasCard">
      <canvas id="cv"></canvas>
      <div id="tooltip"></div>
    </div>
    <div class="step-controls" id="stepControls"></div>
  </div>

  <!-- Right: Side panel -->
  <div class="side">
    <div class="side-inner" id="sideInner">
      <div class="step-eyebrow">Step <span id="stepNum">S</span> / 9</div>
      <div class="step-title" id="stepTitle"></div>
      <div class="step-body"  id="stepBody"></div>
      <div class="hint-box"   id="stepHint" style="display:none;"></div>
      <div id="deepDiveContainer"></div>
    </div>
    <div class="side-footer">
      <div class="step-btns" id="stepButtons"></div>
      <div class="nav-row">
        <button class="nav-btn" id="prevBtn">◀ Prev</button>
        <button class="nav-btn" id="nextBtn">Next ▶</button>
      </div>
    </div>
  </div>

</div>

<script>

/* ============================================================
   CCP PVD (Sputter) Interactive Lesson — Class 2
   Benedu Insight · Google Sans · Full-viewport layout
   Responsive Canvas — geometry scales with window size
   Ar⁺ + Al Target → Sputtered Al → Film  (Ar/Al Sputter Deposition)
   KO / EN bilingual
   ============================================================ */

// ── Canvas & ctx ──────────────────────────────────────────────
const canvas = document.getElementById('cv');
const ctx    = canvas.getContext('2d');
const tooltip     = document.getElementById('tooltip');
const stepCtrlEl  = document.getElementById('stepControls');

// ── Logical canvas dimensions (constant ratio 900:640) ────────
// These are the LOGICAL drawing coordinates — always 900×640
// Physical canvas pixels = logical × DPR, scaled by CSS to fill card
const LW = 900, LH = 640;
let DPR = window.devicePixelRatio || 1;

// Offset/scale used to center the 900x640 logical drawing inside the canvas
let renderScale = 1, renderOffX = 0, renderOffY = 0;
function resizeCanvas() {
  const card = document.getElementById('canvasCard');
  const cw = card.clientWidth;
  const ch = card.clientHeight;
  // Canvas always fills the card — no leftover background gap
  DPR = window.devicePixelRatio || 1;
  canvas.width  = Math.round(cw * DPR);
  canvas.height = Math.round(ch * DPR);
  canvas.style.width  = cw + 'px';
  canvas.style.height = ch + 'px';
  // Fit the 900x640 logical content within the card, centered (letterbox)
  const aspect = LW / LH;
  let drawW, drawH;
  if (cw / ch > aspect) { drawH = ch; drawW = ch * aspect; }
  else                   { drawW = cw; drawH = cw / aspect; }
  renderScale = drawW / LW;
  renderOffX = (cw - drawW) / 2;
  renderOffY = (ch - drawH) / 2;
  // scale so all drawing code uses LW×LH logical coordinates,
  // with the result centered within the full canvas
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(renderScale * DPR, renderScale * DPR);
  ctx.translate(renderOffX / renderScale, renderOffY / renderScale);
}

// Observe canvas card resize
const ro = new ResizeObserver(() => resizeCanvas());
ro.observe(document.getElementById('canvasCard'));
resizeCanvas();

// ── Brand ─────────────────────────────────────────────────────
const FONT = '"Google Sans","Noto Sans KR",system-ui,sans-serif';
const MONO = '"JetBrains Mono",monospace';
const B = {
  purple:'#7030A0', purpleSoft:'#F0E6F6', purpleDark:'#521a78',
  green:'#0F8C50',  greenSoft:'#E5F4EC',
  charcoal:'#2D2D2D', muted:'#6B7280', muted2:'#9CA3AF',
  bg:'#F7F8FA', panel:'#FFFFFF', border:'#E5E7EB',
  red:'#E8553B', blue:'#3A7AD6',
};

// ── Logo ──────────────────────────────────────────────────────
const LOGO = new Image();
LOGO.crossOrigin = 'anonymous';
LOGO.src = 'https://benedu-insight.github.io/logo_png/benedu_insight_logo_EN_horizontal.png';
function drawLogo(a=0.45) {
  if (!LOGO.complete || !LOGO.naturalWidth) return;
  const lh=26, lw=Math.round(lh*LOGO.naturalWidth/LOGO.naturalHeight);
  ctx.save(); ctx.globalAlpha=a;
  ctx.drawImage(LOGO, LW-lw-12, LH-lh-10, lw, lh);
  ctx.restore();
}

// ── Geometry — all in LW×LH (900×640) logical space ──────────
const W=LW, H=LH;
const CH={x:215,y:175,w:470,h:380,r:18};
const IP=18, inX=CH.x+IP, inY=CH.y+IP, inW=CH.w-IP*2, inH=CH.h-IP*2;
// Asymmetric CCP: Al target = top electrode (cathode), wafer/susceptor = bottom (anode/ground)
const SH={x:inX,y:inY,w:inW,h:30};               // Al target (thicker than showerhead — solid slab)
const wW=Math.round(inW*0.83);
const SC={x:inX,y:inY+inH-28,w:inW,h:28};         // Susceptor (grounded)
const WF={x:inX+Math.round((inW-wW)/2),y:SC.y-5,w:wW,h:5};
const ST={x:inX+6,y:SH.y+SH.h,    w:inW-12,h:34}; // Target sheath — wider (asymmetric, high V)
const SB={x:inX+6,y:SC.y-16,       w:inW-12,h:16}; // Wafer sheath — narrower (low V, grounded side)
const PL={x:ST.x,y:ST.y+ST.h,w:ST.w,h:SB.y-(ST.y+ST.h)};
const G1S={x:826,y:56, w:58,h:34};                // single Ar source
const M1={cx:855,cy:112};
const RF={x:762,y:198,w:110,h:76,r:10};
const PU={x:768,y:510,w:90, h:56,r:8};

// ── Species ───────────────────────────────────────────────────
const SP={
  'Ar':  {f:'Ar',  c:'#2a3145',  sz:11, q:0,  m:40,     cat:'neutral' },
  'Ar+': {f:'Ar+', c:B.red,      sz:11, q:+1, m:40,     cat:'ion'     },
  'Al':  {f:'Al',  c:'#7a8aa3',  sz:11, q:0,  m:27,     cat:'radical' }, // sputtered metal atom (neutral)
  'e-':  {f:'e-',  c:B.red,      sz:10, q:-1, m:0.0005, cat:'electron'},
};
const AL_COLOR='#9aa6ba', AL_GLOW='rgba(180,190,210,1)';

// ── Bilingual text ────────────────────────────────────────────
const T = {
en:{
  hTitle:'CCP PVD (Sputter) — Interactive Lesson',
  hSub:'Class 2 · Ar/Al Sputter Deposition · Benedu Insight',
  stepLabel:'Step',
  modeInfoDC:'DC — the production default for a conductive Al target',
  modeInfoAC:'AC/RF — supplementary mode, increasingly needed for insulating/poisoned targets',
  resetFilm:'↻ Reset Film',
  prevBtn:'◀ Prev', nextBtn:'Next ▶',
  modeLabel:'Mode', plasmaLabel:'Plasma intensity',
  extinguished:'⚠  Plasma extinguished',
  sustained:'Plasma sustained · target is a conductor — no charge buildup',
  molCount:'Ar Atoms',
  sheathLabel:'Target sheath potential → Ar⁺ bombardment energy',
  sputterCount:'Al atoms sputtered',
  filmLabel:'Al Film Growth', filmRel:'(relative)', eqLabel:'Process:',
  pecvdCompareNote:'Unlike PE-CVD (Class 1), the deposited species here is a sputtered metal atom — not a chemical reaction product.',
  steps:[
    { title:'Chamber Structure',
      body:`Parallel-plate <b>CCP (Capacitively Coupled Plasma)</b> chamber for Ar/Al sputter deposition — an <b>asymmetric</b> electrode configuration.
        <ul>
          <li>Top electrode = <b>Al Target</b> (cathode) — the source material itself</li>
          <li>Bottom = grounded <b>Susceptor</b> &amp; wafer stage (anode)</li>
          <li><b>Ar</b> (inert sputtering gas) metered by a single MFC</li>
          <li><b>DC power</b> applied to the target — the conventional default for metal sputtering, since Al is a <b>conductor</b>; AC/RF is available as a supplementary mode (Step 7)</li>
          <li>Low-pressure environment (Sputter: <code>1–10 mTorr</code>, much lower than PECVD)</li>
        </ul>
        Pre-ignition — Ar flowing, plasma not yet formed.`,
      hint:'💡 Hover over chamber parts for details.' },
    { title:'Ar Gas Fill',
      body:`Ar injected from above, diffusing to fill the chamber.
        <ul>
          <li>Only neutral <b>Ar</b> atoms present (thermal motion)</li>
          <li>Power Off — no ionization yet</li>
          <li>Ar is chemically inert — it does <b>not</b> react with Al; its only role is to be ionized and accelerated</li>
          <li>Lower pressure than PECVD → longer mean free path, more directional ion flux later</li>
        </ul>`,
      hint:'⚙ Ar atoms fill the chamber uniformly before power-on.' },
    { title:'Power On — Ar Ionization',
      body:`Applied voltage → oscillating/DC <b>E-field</b>. Accelerated electrons collide with Ar atoms causing <b>ionization</b>.
        <ul>
          <li><code>e⁻ + Ar → Ar⁺ + 2e⁻</code> &nbsp;(ionization, ~15.8 eV)</li>
          <li>No dissociation chemistry — Ar is monatomic and inert</li>
          <li><b>Red</b> = Ar⁺ ions &nbsp;·&nbsp; dark grey = neutral Ar</li>
        </ul>
        The seed-electron + avalanche ignition mechanism is identical to PE-CVD (Class 1) — only the gas species differs.`,
      hint:'⚡ Electrons gain energy from the field and ionize Ar on collision.',
      deepDive:{
        title:'Why Argon? Why Not a Reactive Gas?',
        body:`<p>In PE-CVD, the process gases (SiH₄, N₂O) are chosen because they participate <b>chemically</b> in the film-forming reaction. In sputter deposition, the situation is reversed: the film material (Al) is already a solid sitting in the chamber as the target. The plasma's only job is to <b>generate ions that physically eject atoms from that target</b>.</p>
<div class="deep-hl">This is why an inert gas is preferred: Ar contributes nothing to the film's chemistry. Its ionization energy (~15.8 eV) is low enough to ionize efficiently in a CCP discharge, and its atomic mass (40 amu) is heavy enough to deliver substantial momentum on impact — both desirable for sputtering.</div>
<p>If a reactive gas were used instead (e.g. O₂ or N₂ for "reactive sputtering" of oxides/nitrides), it would react with the ejected Al atoms either in the gas phase or at the substrate to form Al₂O₃ or AlN. That is a real and useful technique — but it is a deliberate addition on top of the baseline Ar sputter process covered in this lesson, not a substitute for it.</p>
<div class="deep-hl">Key contrast with PE-CVD: there, the gas <b>is</b> the film precursor. Here, the gas is a <b>projectile carrier</b> — the film precursor is the solid target itself.</div>` }
    },
    { title:'Asymmetric Sheath — Self-Bias Development',
      body:`Unlike the <b>symmetric</b> electrodes of PE-CVD, the Al target and grounded susceptor have very different effective areas/impedances — this is an <b>asymmetric CCP</b>.
        <ul>
          <li>The target develops a large <b>negative DC self-bias</b> (hundreds of volts)</li>
          <li>The wafer-side sheath remains small (a few to tens of volts)</li>
          <li>Ar⁺ ions are continuously accelerated toward the <b>target</b>, not the wafer</li>
          <li>Electrons, being light, equilibrate quickly and establish this asymmetric bias</li>
        </ul>
        This large target sheath voltage is the entire point of the PVD configuration — it is what gives Ar⁺ enough energy to sputter.`,
      hint:'🔬 Watch the target sheath darken as V_target grows increasingly negative.',
      deepDive:{
        title:'Why Does an Asymmetric CCP Self-Bias So Strongly Negative?',
        body:`<p>This builds directly on the Self-Bias / flux-balance picture from PE-CVD Class 1 (Step 4 deep dive there). The core mechanism — fast electrons vs. slow ions, flux balance, negative charging — is identical. What differs here is the <b>electrode area ratio</b>.</p>
<p>In PE-CVD's <b>symmetric</b> CCP, both electrodes have equal area, so both develop similar (small) negative self-biases relative to the plasma — sheath voltages of only a few to tens of volts.</p>
<p>In a sputter CCP, the system is deliberately built <b>asymmetric</b>: the powered target electrode is effectively decoupled (capacitively, often through a blocking capacitor) while the grounded chamber walls + susceptor present a much larger total grounded area.</p>
<div class="deep-eq">Flux balance at the powered (target) electrode:
Γ_e (electron flux in) = Γ_i (ion flux in)
→ because the target's effective area is small relative to the grounded area,
→ the target must charge to a much MORE NEGATIVE potential
→ to repel enough electrons to match the (smaller) ion flux it receives</div>
<p>The result is a strongly negative target self-bias — typically <b>hundreds of volts</b> — vs. only tens of volts at the grounded wafer/walls. The same Maxwell-Boltzmann + Poisson equation framework from Class 1 applies; only the boundary condition (area ratio) changes.</p>
<div class="deep-hl">Practical consequence: Ar⁺ ions accelerated across this large target sheath arrive with hundreds of eV of kinetic energy — enough to physically knock Al atoms out of the target lattice (sputtering), which is the entire purpose of this configuration. This is the same q × V_sheath relation from Class 1, just operating at a much larger V.</div>` }
    },
    { title:'Sputtering Event — Momentum Transfer',
      body:`High-energy Ar⁺ ions strike the Al target surface and physically eject Al atoms via <b>momentum transfer</b> — a purely physical (non-chemical) process.
        <ul>
          <li><code>Ar⁺ (hundreds of eV) + Al(surface) → Al(ejected) + Ar(reflected/neutralized)</code></li>
          <li>Each impact has a probability of ejecting 0–several Al atoms — the <b>sputtering yield</b> (Y)</li>
          <li>Ejected Al atoms are <b>neutral</b> — diffusion/line-of-sight transport follows next</li>
          <li>The target surface slowly erodes, forming a "racetrack" groove</li>
        </ul>`,
      hint:'💥 Watch Ar⁺ impacts on the target eject grey Al atoms downward.',
      deepDive:{
        title:'Sputtering vs. Densification — Same Physics, Different Energy Window',
        body:`<p>PE-CVD Class 1 (Step 5 deep dive) made the point that <b>"ion bombardment = damage" is not a universal rule</b> — at the low sheath voltages of symmetric PE-CVD (tens of volts → tens of eV), ion impacts are below the bond-breaking threshold and instead promote beneficial <b>densification</b> of the growing film.</p>
<p>Sputter PVD sits firmly on the <b>other side</b> of that same threshold — and that is the entire design intent:</p>
<div class="deep-eq">Ion energy ≈ q × V_sheath
PE-CVD (symmetric CCP):  V_sheath ≈ tens of volts → E_ion ≈ tens of eV   → densification (no removal)
Sputter PVD (asymmetric CCP): V_sheath ≈ hundreds of volts → E_ion ≈ hundreds of eV → material REMOVAL</div>
<p>At hundreds of eV, an incoming Ar⁺ ion's kinetic energy is well above the lattice binding energy of Al (a few eV per atom). Instead of being gently absorbed, the impact initiates a <b>collision cascade</b> within the first few atomic layers of the target: the struck Al atom collides with its neighbors, which collide with theirs, and so on. If enough momentum is redirected back toward the surface, a surface atom is ejected — this is <b>sputtering</b>.</p>
<div class="deep-hl">The <b>sputtering yield</b> Y (atoms ejected per incident ion) depends on ion energy, ion mass, target mass, and the angle of incidence. For Ar⁺ on Al at a few hundred eV, Y is typically in the range of roughly 1–3 atoms/ion — efficient enough for practical deposition rates.</div>
<p>So: the same underlying physics (q × V_sheath, momentum transfer to a solid surface) that gives <b>beneficial densification</b> in PE-CVD gives <b>controlled material removal</b> in sputter PVD — purely because the sheath voltage, and therefore the ion energy, sits on a different side of the bond-breaking threshold. There is no new physical law here, only a different operating point on the same energy axis.</p>
<div class="deep-hl">A second contrast with PE-CVD: in PE-CVD, ion bombardment acts on the <b>growing film</b> (SiO₂) at the wafer. In sputter PVD, ion bombardment acts on the <b>source material</b> (Al target) — the wafer-side sheath is deliberately kept small so the growing Al film is <b>not</b> subjected to the same high-energy bombardment (which would otherwise re-sputter/damage it).</div>` }
    },
    { title:'Al Adatom Transport to the Wafer',
      body:`Ejected Al atoms are <b>neutral</b>, carrying initial kinetic energy from the sputtering event, then traveling to the wafer.
        <ul>
          <li><b>Line-of-sight</b> transport dominates at sputter pressures (1–10 mTorr) — long mean free path means few gas-phase collisions</li>
          <li>Minor <b>diffusion/scattering</b> from residual Ar collisions broadens the arrival angle distribution</li>
          <li>Sticking coefficient on arrival ≈ 1 for metal adatoms on most surfaces</li>
          <li>Arriving Al atoms can also <b>surface-diffuse</b> short distances before settling into the growing film</li>
        </ul>`,
      hint:'🎯 Grey Al atoms drift from the target toward the wafer.',
      deepDive:{
        title:'Line-of-Sight vs. Diffusion-Dominated Transport — Contrast with PE-CVD',
        body:`<p>PE-CVD Class 1 (Step 8 deep dive) explained that SiH₃· and O· radicals reach the wafer primarily via <b>diffusion</b> — driven by the concentration gradient created as the surface reaction consumes them, with convective flow as a secondary contributor. Neither gravity nor a directed "beam" plays a meaningful role there.</p>
<p>Sputter PVD operates in a fundamentally different transport regime, for two reasons:</p>
<div class="deep-hl">① Much lower pressure → much longer mean free path</div>
<p>PE-CVD operates at 0.5–5 Torr; sputter PVD typically at 1–10 mTorr — roughly <b>100–1000× lower</b>. The mean free path scales inversely with pressure, so at sputter pressures an ejected Al atom can often travel from target to wafer (a gap of perhaps 5–15 cm) with <b>few or no gas-phase collisions</b>.</p>
<div class="deep-hl">② Directional ejection, not isotropic generation</div>
<p>SiH₃·/O· radicals are generated <b>throughout the bulk plasma</b> by dissociation — isotropically, with no preferred initial direction. Sputtered Al atoms, by contrast, are ejected from a localized <b>surface</b> (the target) with a velocity/angle distribution set by the collision cascade — predominantly directed away from the target, i.e. toward the wafer.</p>
<div class="deep-eq">PE-CVD:  generation is volumetric + isotropic  →  transport is diffusion-dominated (Fick's law)
Sputter: generation is surface + directional   →  transport is line-of-sight-dominated (ballistic)</div>
<p>This distinction has a major practical consequence: <b>step coverage</b>. Diffusion-dominated transport (PE-CVD) tends to coat all surfaces — including sidewalls and the bottoms of trenches — relatively conformally. Line-of-sight transport (sputter PVD) preferentially coats surfaces that are in "view" of the target, leading to <b>poorer sidewall/bottom coverage</b> in high-aspect-ratio features — a well-known limitation of conventional sputtering for advanced interconnects.</p>
<div class="deep-hl">Both processes share the same final "capture" step — a sticking coefficient near 1 for reactive radicals (PE-CVD) and for metal adatoms on most surfaces (PVD). The difference is entirely in <b>how the species gets to the surface</b>, which traces back to where and how it was generated.</div>` }
    },
    { title:'DC Sputtering — The Default, with AC as a Growing Necessity',
      body:`A metal Al target is a <b>conductor</b>, so <b>DC power is the conventional default</b> for sputter deposition — simple equipment, a closed-loop circuit, and high deposition rates. AC/RF is a <b>supplementary mode</b>, reserved for cases where DC runs into trouble.
        <ul>
          <li><b>DC mode</b> (default): target held at a constant negative bias → continuous Ar⁺ bombardment → continuous sputtering. The vast majority of production metal PVD (Al, Cu, Ti, Ta, W…) runs this way, often as <b>pulsed-DC</b> for arc suppression.</li>
          <li><b>AC/RF mode</b> (supplementary): polarity oscillates at 13.56 MHz. Needed when the target surface is — or becomes — <b>insulating</b> (see Deep Dive).</li>
        </ul>
        Toggle DC ↔ AC below — both sustain the plasma on this clean metal target, but the deep dives explain why that picture changes in modern processes.`,
      hint:'🔁 Toggle DC ↔ AC below — DC is the default; AC is the fallback.',
      deepDive:[{
        title:'Why DC Is the Natural Default for a Metal Target',
        body:`<p>PE-CVD Class 1 (Step 6 deep dive) showed that DC fails for SiO₂ deposition because the growing <b>insulating</b> film charges up like a capacitor, cancelling the applied field until the plasma stalls.</p>
<div class="deep-eq">PE-CVD (insulating film):
DC bias → (+) charge accumulates on insulating SiO₂ surface → no path to ground
→ accumulated charge cancels applied field → net field → 0 → plasma stalls
→ AC required: charge/neutralize cycle each half-period prevents net buildup</div>
<p><b>The Al target is a conductor.</b> Positive charge delivered by incoming Ar⁺ ions is immediately neutralized by the free electrons of the metal, which are replenished from the external power supply circuit. There is no insulating layer to "charge up" — the target behaves like an ordinary electrode in a closed circuit.</p>
<div class="deep-eq">Sputter PVD (conductive target):
DC bias → (+) charge from Ar⁺ neutralized instantly by free electrons in Al
→ charge flows continuously through external circuit → closed loop
→ net field maintained indefinitely → plasma sustained under pure DC</div>
<div class="deep-hl">This is why DC is the natural starting point for metal PVD: it is the simplest possible circuit that works, with no need for the charge/neutralize machinery that AC provides. AC only becomes necessary once that simple picture breaks down — which is exactly the topic of the next deep dive.</div>`
      },{
        title:'Why Is AC/RF Becoming More Necessary in Modern Semiconductor PVD?',
        body:`<p>If a clean metal target is a perfect conductor, DC should always be enough. In practice, two trends in advanced semiconductor manufacturing are steadily eroding that assumption — both push toward AC/RF, or the pulsed-DC compromise between the two.</p>
<div class="deep-hl">① Target Poisoning in Reactive Sputtering</div>
<p>Many modern PVD steps are <b>reactive</b>: a reactive gas (O₂, N₂) is added to Ar so the sputtered metal forms a compound film directly — e.g. TiN and TaN diffusion barriers, or Al₂O₃ for capacitor dielectrics and encapsulation layers. The same reactive gas that reacts at the wafer also reacts with the <b>target surface</b>, forming a thin insulating compound layer on the target itself — a phenomenon called <b>target poisoning</b>.</p>
<div class="deep-eq">Reactive sputtering (e.g. Al target + O₂):
Target surface: Al + O₂ → Al₂O₃ (insulating layer forms on target)
→ Under pure DC: this patch charges up exactly like the PE-CVD SiO₂ case
→ Local field collapses on poisoned patches → non-uniform sputtering + micro-arcing
→ AC/RF (or pulsed-DC) needed to discharge the patch each cycle</div>
<p>This is the same charge/neutralize mechanism from PE-CVD Class 1 — but now happening at the <b>target</b> rather than the wafer. The more reactive-gas content a process needs (and advanced barrier/dielectric films often need more), the more this becomes an issue.</p>
<div class="deep-hl">② Direct Sputtering of Insulating (High-k / Dielectric) Targets</div>
<p>Beyond reactive sputtering of metal targets, advanced nodes increasingly call for PVD of materials that are <b>insulators from the start</b> — high-k dielectrics (HfO₂, ZrO₂, Ta₂O₅, Al₂O₃) for MIM capacitors, gate stacks, and encapsulation/barrier layers, often chosen for throughput or cost reasons where ALD/CVD would otherwise be used.</p>
<div class="deep-hl">For these targets, the situation is the PE-CVD Class 1 case from the start: the target itself is the insulating "film" that charges up under DC. AC/RF (or a blocking-capacitor + matching network) is required for the discharge to be sustained at all — exactly the Class 1 logic, just applied to the target electrode instead of the wafer.</div>
<div class="deep-hl">③ The Practical Middle Ground — Pulsed-DC</div>
<p>Full RF hardware (matching networks, generators) is more complex and costly than DC. The dominant industrial compromise for moderately reactive processes is <b>pulsed-DC</b>: the DC bias is briefly reversed (or set to zero) at a much lower frequency than 13.56 MHz — just often enough to bleed off charge accumulating on poisoned patches between pulses, without the full complexity of RF.</p>
<div class="deep-hl">Summary: DC remains the default starting point because it is the simplest circuit that works on a clean conductor. But as processes move toward reactive sputtering (target poisoning) and direct PVD of dielectric/high-k materials — both increasingly common in advanced semiconductor flows — the same charge-accumulation problem that made AC essential for PE-CVD's SiO₂ film re-appears at the target, making AC/RF (or pulsed-DC) progressively more necessary.</div>` }
      ]
    },
    { title:'Al Film Growth on the Wafer',
      body:`Al adatoms arriving at the wafer surface accumulate into a continuous metal film.
        <ul>
          <li>Deposition rate ∝ (sputtering yield) × (Ar⁺ flux at target) × (target-to-wafer transport efficiency)</li>
          <li>Film grows by nucleation → island coalescence → continuous film, typical of metal PVD</li>
          <li>No chemical byproducts to pump away — unlike PE-CVD's N₂/H₂O</li>
          <li>Film quality (grain size, resistivity, stress) depends on adatom mobility, which depends on substrate temperature and ion-assist</li>
        </ul>
        Watch the grey Al layer thicken on the wafer.`,
      hint:'🎯 Watch the Al layer (grey) thicken on the wafer.',
      deepDive:{
        title:'Why No Chemical Equation Here?',
        body:`<p>PE-CVD Class 1 ended its deposition step with an overall reaction equation (<code>SiH₄ + 4N₂O → SiO₂ + 4N₂ + 2H₂O</code>) — a genuine chemical transformation with byproducts requiring vacuum removal.</p>
<div class="deep-hl">Sputter PVD has no analogous equation, because no chemical bonds are broken or formed in the deposition step itself. The process is, in essence: Al(solid, target) → Al(vapor, transported) → Al(solid, film). The atom's chemical identity never changes — only its location and, briefly, its phase/kinetic state.</div>
<p>This is why sputter PVD is often described as a <b>physical</b> vapor deposition process, in contrast to the <b>chemical</b> vapor deposition of PE-CVD. The plasma's role in both cases is to provide energetic ions — but in PE-CVD those ions densify a film formed by surface chemistry, while in PVD those ions <b>are</b> the mechanism that liberates the film material from its source in the first place.</p>
<div class="deep-hl">Practical implication: PVD film purity is set largely by target purity and chamber base pressure (residual gas incorporation), since there is no precursor chemistry to control stoichiometry. PE-CVD film composition, by contrast, is tunable via gas flow ratios (e.g. SiH₄:N₂O) because it <b>is</b> a chemical reaction.</div>` }
    },
    { title:'CCP Sputter — Key Takeaways',
      body:`Consolidated CCP PVD (Sputter) design principles, contrasted with PE-CVD (Class 1).
        <ul>
          <li>Asymmetric electrodes + high target self-bias enable <b>controlled, efficient sputtering</b></li>
          <li>Same q × V_sheath physics as PE-CVD — different operating point → removal instead of densification</li>
          <li>DC <b>or</b> AC both work on a conductive target — unlike dielectric PE-CVD</li>
        </ul>`,
      hint:'📋 Summary of Steps 1–8, with PE-CVD comparison.' },

  steps:[
    { title:'Chamber 구조',
      body:`Ar/Al Sputter 증착용 평행판 <b>CCP (Capacitively Coupled Plasma)</b> Chamber — <b>비대칭(Asymmetric)</b> 전극 구성입니다.

    { title:'Power On — Ar 이온화',
      body:`인가 전압 → 진동/DC <b>E-field</b> → 가속된 전자가 Ar 원자와 충돌 → <b>이온화</b>.

        Seed Electron + Avalanche에 의한 점화 메커니즘은 PE-CVD(Class 1)와 동일 — 가스 종류만 다릅니다.`,
      hint:'⚡ 전자가 전기장에서 에너지를 얻어 Ar와 충돌하며 이온화시킵니다.',
      deepDive:{
        title:'왜 Argon인가? 왜 반응성 가스가 아닌가?',
        body:`<p>PE-CVD에서는 공정 가스(SiH₄, N₂O)가 막 형성 반응에 <b>화학적으로</b> 참여하기 때문에 선택됩니다. Sputter 증착에서는 상황이 반대입니다 — 막 재료(Al)는 이미 Chamber 안에 Target이라는 고체 형태로 존재합니다. Plasma의 유일한 역할은 <b>이 Target에서 원자를 물리적으로 떼어낼 이온을 생성</b>하는 것입니다.</p>
<div class="deep-hl">이것이 불활성 가스가 선호되는 이유입니다: Ar는 막의 화학 성분에 아무것도 기여하지 않습니다. 이온화 에너지(약 15.8 eV)가 충분히 낮아 CCP Discharge에서 효율적으로 이온화되며, 원자 질량(40 amu)이 충분히 무거워 충돌 시 상당한 운동량을 전달할 수 있습니다 — 둘 다 Sputtering에 유리한 특성입니다.</p>

        body:`<p>깨끗한 금속 Target이 완벽한 도체라면 DC만으로 항상 충분해야 합니다. 그러나 실제로는 첨단 반도체 공정의 두 가지 흐름이 이 전제를 점점 무너뜨리고 있으며 — 둘 다 AC/RF, 또는 그 중간 타협안인 Pulsed-DC를 필요로 하게 만듭니다.</p>
<div class="deep-hl">① Reactive Sputtering에서의 Target Poisoning</div>
<p>최신 PVD 공정 중 다수는 <b>Reactive(반응성)</b> 공정입니다: Ar에 반응성 가스(O₂, N₂)를 추가하여 Sputter된 금속이 웨이퍼에서 직접 화합물 막을 형성하도록 합니다 — 예를 들어 TiN/TaN Diffusion Barrier, 또는 Capacitor 유전체·Encapsulation용 Al₂O₃ 등입니다. 웨이퍼에서 반응하는 동일한 반응성 가스가 <b>Target 표면</b>에서도 반응하여, Target 자체에 얇은 절연성 화합물 층을 형성합니다 — 이를 <b>Target Poisoning</b>이라 부릅니다.</p>
<div class="deep-eq">Reactive Sputtering 예시 (Al Target + O₂):
Target 표면: Al + O₂ → Al₂O₃ (Target에 절연층 형성)
→ 순수 DC에서는: 이 패치가 PE-CVD의 SiO₂ 사례와 정확히 동일하게 충전됨
→ Poisoning된 패치에서 국부 전기장 붕괴 → 불균일한 Sputtering + Micro-Arcing
→ 매 주기마다 패치를 방전시키기 위해 AC/RF (또는 Pulsed-DC) 필요</div>
<p>이는 PE-CVD Class 1과 동일한 충전/중화 메커니즘이지만 — 이번에는 웨이퍼가 아닌 <b>Target</b>에서 발생합니다. 공정에 필요한 반응성 가스 비율이 높을수록(첨단 Barrier/유전체 막은 흔히 더 높은 비율을 요구) 이 문제는 더 커집니다.</p>
<div class="deep-hl">② 절연성(High-k/유전체) Target의 직접 Sputtering</div>
<p>금속 Target의 Reactive Sputtering을 넘어서, 첨단 노드에서는 처음부터 <b>절연체인</b> 재료의 PVD가 점점 더 요구됩니다 — MIM Capacitor, Gate Stack, Encapsulation/Barrier 층용 High-k 유전체(HfO₂, ZrO₂, Ta₂O₅, Al₂O₃) 등이며, 흔히 처리량(Throughput)이나 비용 측면에서 ALD/CVD 대신 선택됩니다.</p>
<div class="deep-hl">이러한 Target에서는 처음부터 PE-CVD Class 1의 상황과 동일합니다: Target 자체가 DC 하에서 충전되는 절연성 "막"인 셈입니다. Discharge가 유지되려면 AC/RF (또는 Blocking Capacitor + Matching Network)가 필수이며 — Class 1의 논리가 웨이퍼 전극이 아닌 Target 전극에 그대로 적용되는 것입니다.</div>
<div class="deep-hl">③ 실무적 중간 지점 — Pulsed-DC</div>
<p>완전한 RF 장비(Matching Network, Generator)는 DC보다 훨씬 복잡하고 비용이 높습니다. 중간 정도의 Reactive 공정에서 산업계가 채택하는 주된 타협안은 <b>Pulsed-DC</b>입니다: 13.56 MHz보다 훨씬 낮은 주파수로 DC Bias를 짧게 반전(또는 0으로 설정)시켜, RF의 모든 복잡성 없이도 Pulse 사이에 Poisoning된 패치에 쌓인 전하를 충분히 방전시킵니다.</p>
<div class="deep-hl">정리: DC는 깨끗한 도체에서 동작하는 가장 단순한 회로이기 때문에 여전히 기본 출발점입니다. 그러나 공정이 Reactive Sputtering(Target Poisoning)과 유전체/High-k 재료의 직접 PVD 방향으로 이동함에 따라 — 둘 다 첨단 반도체 공정에서 점점 보편화되고 있음 — PE-CVD의 SiO₂ 막에서 AC를 필수로 만들었던 동일한 전하 축적 문제가 이번에는 Target에서 재현되며, AC/RF (또는 Pulsed-DC)의 필요성이 점차 커지고 있습니다.</div>` }

// ── Drawing helpers ───────────────────────────────────────────
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
// Centered, word-wrapped text block. cx/cy = center point, maxW = max line width, lineH = line spacing.
function wrapText(text,cx,cy,maxW,lineH){
  const words=text.split(' ');
  const lines=[];let cur='';
  for(const w of words){
    const test=cur?cur+' '+w:w;
    if(ctx.measureText(test).width>maxW&&cur){lines.push(cur);cur=w;}else cur=test;
  }
  if(cur)lines.push(cur);
  const startY=cy-(lines.length-1)*lineH/2;
  lines.forEach((ln,i)=>ctx.fillText(ln,cx,startY+i*lineH));
}
function pipe(pts,col='#b3bac8',w=2.2){
  ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.stroke();
}
function arw(x0,y0,x1,y1,col='#1d2436',w=1.2){
  ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=w;
  ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.stroke();
  const a=Math.atan2(y1-y0,x1-x0),h=5.5;
  ctx.beginPath();ctx.moveTo(x1,y1);
  ctx.lineTo(x1-h*Math.cos(a-0.4),y1-h*Math.sin(a-0.4));
  ctx.lineTo(x1-h*Math.cos(a+0.4),y1-h*Math.sin(a+0.4));
  ctx.closePath();ctx.fill();
}
function gnd(cx,cy){
  ctx.strokeStyle='#1d2436';ctx.lineWidth=1.5;ctx.beginPath();
  ctx.moveTo(cx,cy);ctx.lineTo(cx,cy+6);
  ctx.moveTo(cx-10,cy+6);ctx.lineTo(cx+10,cy+6);
  ctx.moveTo(cx-7,cy+10);ctx.lineTo(cx+7,cy+10);
  ctx.moveTo(cx-4,cy+14);ctx.lineTo(cx+4,cy+14);
  ctx.stroke();
}
function chem(formula,x,y,sz=11,col='#1d2436'){
  ctx.fillStyle=col;
  const bF=`bold ${sz}px ${FONT}`,sF=`bold ${Math.round(sz*.7)}px ${FONT}`,pF=`bold ${Math.round(sz*.75)}px ${FONT}`;
  ctx.textAlign='left';ctx.textBaseline='middle';
  const segs=[];let i=0;
  while(i<formula.length){
    const ch=formula[i];
    if(/[A-Za-z]/.test(ch)){let s=ch;while(i+1<formula.length&&/[a-z]/.test(formula[i+1])){s+=formula[++i];}segs.push({t:'b',s});}
    else if(/[0-9]/.test(ch))segs.push({t:'sub',s:ch});
    else if(ch==='+'||ch==='-')segs.push({t:'sup',s:ch});
    i++;
  }
  let tot=0;for(const s of segs){ctx.font=s.t==='b'?bF:s.t==='sub'?sF:pF;tot+=ctx.measureText(s.s).width;}
  let cx=x-tot/2;
  for(const s of segs){
    ctx.font=s.t==='b'?bF:s.t==='sub'?sF:pF;
    const oy=s.t==='sub'?sz*.30:s.t==='sup'?-sz*.32:0;
    ctx.fillText(s.s,cx,y+oy);cx+=ctx.measureText(s.s).width;
  }
}

function drawGasSrc(x,y,w,h,formula,sc){
  rr(x,y,w,h,8);const g=ctx.createLinearGradient(x,y,x,y+h);g.addColorStop(0,'#fff');g.addColorStop(1,'#eef0f5');
  ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#cdd2dd';ctx.lineWidth=1.2;ctx.stroke();
  ctx.fillStyle=sc;ctx.fillRect(x+6,y+h-5,w-12,3);chem(formula,x+w/2,y+h/2-3,14,'#1d2436');
}
function drawMFC(cx,cy){
  ctx.fillStyle='#fff';ctx.strokeStyle='#cdd2dd';ctx.lineWidth=1.2;rr(cx-15,cy-13,30,26,4);ctx.fill();ctx.stroke();

  ctx.moveTo(cx-7,cy-6);ctx.lineTo(cx+7,cy+6);ctx.lineTo(cx+7,cy-6);ctx.lineTo(cx-7,cy+6);ctx.closePath();ctx.stroke();
  ctx.fillStyle='#8b91a3';ctx.font=`9px ${MONO}`;ctx.textAlign='center';ctx.fillText('MFC',cx,cy+22);
}
function drawGasSys(){

function spawn(type,x,y,vx=null,vy=null){
  const p={type,x,y,vx:vx!==null?vx:(Math.random()-.5)*.4,vy:vy!==null?vy:(Math.random()-.5)*.4,age:0};

// Use during particles.filter(...) iteration (e.g. inside onImpact) — particles pushed
// mid-filter are dropped by Array.filter's return value, so queue them here and
// flush via flushSpawns() after the filter completes.
let pendingSpawns=[];
function spawnQueued(type,x,y,vx=null,vy=null){
  const p={type,x,y,vx:vx!==null?vx:(Math.random()-.5)*.4,vy:vy!==null?vy:(Math.random()-.5)*.4,age:0};
  pendingSpawns.push(p);
  return p;
}
function flushSpawns(){ if(pendingSpawns.length){ particles.push(...pendingSpawns); pendingSpawns=[]; } }
function rndPt(){return{x:PL.x+10+Math.random()*(PL.w-20),y:PL.y+8+Math.random()*(PL.h-16)};}
function rndPtTop(){return{x:PL.x+10+Math.random()*(PL.w-20),y:PL.y+6+Math.random()*Math.min(40,PL.h*0.3)};}

function updP(p,dt,o){
  const d=SP[p.type];p.age+=dt;
  if(d.q!==0&&o.fieldActive){
    const sb=p.y<ST.y+ST.h||p.y>SB.y?3.5:1;
    p.vy+=d.q*o.fieldDir*o.fieldStrength*sb/Math.max(d.m,.001)*dt*.5;
  }
  const br=o.brownian??0.08,dr=o.drag??0.96;
  if(d.cat==='neutral'||d.cat==='radical'){p.vx+=(Math.random()-.5)*br;p.vy+=(Math.random()-.5)*br;}
  else p.vx+=(Math.random()-.5)*(br*.5);
  p.vx*=dr;p.vy*=dr;
  const mx=d.cat==='electron'?4.5:d.cat==='ion'?2.2:1.0,sp=Math.hypot(p.vx,p.vy);
  if(sp>mx){p.vx*=mx/sp;p.vy*=mx/sp;}
  p.x+=p.vx;p.y+=p.vy;
  if(p.x<PL.x+4){p.x=PL.x+4;p.vx=Math.abs(p.vx)*.4;}
  if(p.x>PL.x+PL.w-4){p.x=PL.x+PL.w-4;p.vx=-Math.abs(p.vx)*.4;}
  if(p.y<ST.y+2){
    if(d.cat==='electron'&&o.absorbElectronTop)return false;
    if(d.cat==='ion'&&o.absorbIonTop){o.onImpact&&o.onImpact(p,'top');return false;}
    p.y=ST.y+2;p.vy=Math.abs(p.vy)*.4;
  }
  if(p.y>SB.y+SB.h-2){
    if(d.cat==='ion'&&o.absorbIonBot){o.onImpact&&o.onImpact(p,'bot');return false;}
    if(d.cat==='electron'&&o.absorbElectronBot)return false;
    p.y=SB.y+SB.h-2;p.vy=-Math.abs(p.vy)*.4;
  }

      const al=spawnQueued('Al',p.x,SH.y+SH.h+2,Math.sin(ang)*sp,Math.cos(ang)*sp);al.vy=Math.abs(al.vy);
      emitL(p.x,SH.y+SH.h,'rgba(255,210,170,1)',.35);
    }}};
  // Al adatoms: steady downward drift (line-of-sight + minor diffusion) toward wafer
  for(const p of particles){
    if(p.type==='Al'){ p.vy=Math.max(p.vy,0.55); }
  }
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    if(p.type==='Al'&&p.y>WF.y-4&&p.x>=WF.x&&p.x<=WF.x+WF.w){particles.splice(i,1);emitL(p.x,WF.y,AL_GLOW,.3);}
  }
  particles=particles.filter(p=>updP(p,dt,opts));flushSpawns();
  t6+=dt;if(t6>.22){t6=0;
    if(particles.filter(p=>SP[p.type].cat==='ion').length<7){const r=rndPtTop();spawn('Ar+',r.x,r.y,(Math.random()-.5)*.4,-(1.0+Math.random()*0.8));}
    if(particles.filter(p=>SP[p.type].cat==='electron').length<6){const r=rndPt();spawn('e-',r.x,r.y);}
  }
  updL(dt);updImp(dt);drawParts();drawL();drawImp();
}
let t7=0,dcD=0;
function s7(dt,t){
  chrome(true,t,mode);
  let fd,pi,siT,siB,erosionShow=erosion;
  if(mode==='AC'){fd=-1;pi=1;siT=1;siB=.25;dcD=0;}
  else{fd=-1;dcD=0;pi=1;siT=1;siB=.25;} // metal target → DC sustains fine (no charge buildup)
  drawGlow(pi,t);drawSheaths(siT,siB);drawEField(fd,.5);drawTarget(-1,erosionShow);drawSusceptor(0);drawWafer(0);drawSideLabels();
  const opts={fieldActive:true,fieldDir:fd,fieldStrength:3.0,absorbIonTop:true,
    onImpact:(p,w)=>{ if(w==='top'){ addImp(p.x,SH.y+SH.h);
      const ang=(Math.random()*0.8-0.4),sp=0.7+Math.random()*0.6;
      const al=spawnQueued('Al',p.x,SH.y+SH.h+2,Math.sin(ang)*sp,Math.cos(ang)*sp);al.vy=Math.abs(al.vy);
      emitL(p.x,SH.y+SH.h,'rgba(255,210,170,1)',.35);
    }}};
  for(const p of particles){ if(p.type==='Al'){ p.vy=Math.max(p.vy,0.5); } }
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    if(p.type==='Al'&&p.y>WF.y-4&&p.x>=WF.x&&p.x<=WF.x+WF.w){particles.splice(i,1);emitL(p.x,WF.y,AL_GLOW,.3);}
  }
  particles=particles.filter(p=>updP(p,dt,opts));flushSpawns();
  t7+=dt;if(t7>.2){t7=0;
    if(particles.filter(p=>SP[p.type].cat==='electron').length<6){const r=rndPt();spawn('e-',r.x,r.y);}
    if(particles.filter(p=>SP[p.type].cat==='ion').length<7){const r=rndPtTop();spawn('Ar+',r.x,r.y,(Math.random()-.5)*.4,-(1.0+Math.random()*0.8));}
  }
  drawParts();
  ctx.fillStyle=B.muted;ctx.font=`11px ${MONO}`;ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillText(`${L().modeLabel}: ${mode}`,22,22);
  ctx.fillStyle=B.green;ctx.fillText(L().sustained,22,38);
}
let t8=0;
function s8(dt,t){
  chrome(true,t,'DC');const fd=-1;
  drawGlow(.8,t);drawSheaths(.95,.25);drawEField(fd,.45);drawTarget(-1,erosion);drawSusceptor(0);drawWafer(filmThickness);drawSideLabels();
  const opts={fieldActive:true,fieldDir:fd,fieldStrength:3.0,absorbIonTop:true,
    onImpact:(p,w)=>{ if(w==='top'){ addImp(p.x,SH.y+SH.h);
      const ang=(Math.random()*0.8-0.4),sp=0.7+Math.random()*0.6;
      const al=spawnQueued('Al',p.x,SH.y+SH.h+2,Math.sin(ang)*sp,Math.cos(ang)*sp);al.vy=Math.abs(al.vy);
      emitL(p.x,SH.y+SH.h,'rgba(255,210,170,1)',.35);
    }}};
  for(const p of particles){
    if(p.type==='Al'){ p.vy=Math.max(p.vy, 0.85); }
  }
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    if(p.type==='Al'&&p.y>WF.y-4&&p.x>=WF.x&&p.x<=WF.x+WF.w){filmThickness+=.5;particles.splice(i,1);emitL(p.x,WF.y,AL_GLOW,.3);}
  }
  particles=particles.filter(p=>updP(p,dt,opts));flushSpawns();
  t8+=dt;if(t8>.06){t8=0;
    if(particles.filter(p=>SP[p.type].cat==='ion').length<8){const r=rndPtTop();spawn('Ar+',r.x,r.y,(Math.random()-.5)*.4,-(1.0+Math.random()*0.8));}
    if(particles.filter(p=>SP[p.type].cat==='electron').length<6){const r=rndPt();spawn('e-',r.x,r.y);}
  }
  updL(dt);updImp(dt);drawParts();drawL();drawImp();
  ctx.fillStyle=B.muted;ctx.font=`11px ${MONO}`;ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillText(`${L().filmLabel}: ${(filmThickness*5).toFixed(2)} nm ${L().filmRel}`,22,22);
  ctx.fillStyle=B.border;ctx.fillRect(22,38,200,5);ctx.fillStyle=B.muted2;ctx.fillStyle='#7a8aa3';ctx.fillRect(22,38,Math.min(200,filmThickness*7),5);
}
function s9(){
  ctx.fillStyle=B.bg;ctx.fillRect(0,0,W,H);
  const hg=ctx.createLinearGradient(0,0,W,0);hg.addColorStop(0,B.purple);hg.addColorStop(1,'#8B40B8');
  ctx.fillStyle=hg;ctx.fillRect(0,0,W,64);
  ctx.fillStyle='#fff';ctx.font=`bold 19px ${FONT}`;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(L().takeawayHeader,24,26);
  ctx.fillStyle='rgba(255,255,255,.72)';ctx.font=`11.5px ${FONT}`;ctx.fillText(L().takeawaySubheader,24,50);
  ctx.fillStyle=B.green;ctx.fillRect(0,64,W,4);
  function secLbl(txt,x,y){ctx.fillStyle=B.purple;ctx.fillRect(x,y-7,3,14);ctx.font=`bold 12.5px ${FONT}`;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillStyle=B.charcoal;ctx.fillText(txt,x+10,y);}
  const LX=20,LW=408;secLbl(L().takeawayDesign,LX,84);
  L().principles.forEach(([title,desc],i)=>{
    const cy=100+i*82,ch=72;
    ctx.save();rr(LX,cy,LW,ch,8);ctx.clip();ctx.fillStyle='rgba(15,140,80,.07)';ctx.fillRect(LX,cy,LW,ch);ctx.restore();
    rr(LX,cy,LW,ch,8);ctx.strokeStyle='rgba(15,140,80,.28)';ctx.lineWidth=.8;ctx.stroke();
    ctx.fillStyle=B.green;ctx.beginPath();ctx.arc(LX+22,cy+ch/2,11,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.font=`bold 13px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('✓',LX+22,cy+ch/2);
    ctx.fillStyle='#0a5e34';ctx.font=`bold 12.5px ${FONT}`;ctx.textAlign='left';ctx.fillText(title,LX+42,cy+24);
    ctx.fillStyle='#4a5565';ctx.font=`10.5px ${FONT}`;ctx.fillText(desc,LX+42,cy+48);
  });
  const RX=446,RW=436;secLbl(L().takeawayParams,RX,84);
  const TY=98,RH=30,cols=[0,192,314,436],totH=RH*(L().tRows.length+1);
  ctx.save();rr(RX,TY,RW,totH,8);ctx.clip();
  ctx.fillStyle=B.purple;ctx.fillRect(RX,TY,RW,RH);
  L().tHeaders.forEach((h,ci)=>{const mx=RX+(cols[ci]+cols[ci+1])/2;ctx.fillStyle='#fff';ctx.font=`bold 11.5px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(h,mx,TY+RH/2);});
  L().tRows.forEach((row,ri)=>{
    const ry=TY+RH+ri*RH;ctx.fillStyle=ri%2===0?B.purpleSoft:'#fff';ctx.fillRect(RX,ry,RW,RH);
    ctx.strokeStyle='#ddd0ee';ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(RX,ry+RH);ctx.lineTo(RX+RW,ry+RH);ctx.stroke();
    [1,2].forEach(ci=>{ctx.beginPath();ctx.moveTo(RX+cols[ci],ry);ctx.lineTo(RX+cols[ci],ry+RH);ctx.stroke();});
    row.forEach((cell,ci)=>{
      ctx.fillStyle=ci===0?B.charcoal:ci===1?B.purple:'#6b7388';ctx.font=ci===0?`11px ${FONT}`:`bold 11px ${FONT}`;
      ctx.textAlign=ci===0?'left':'center';ctx.textBaseline='middle';
      ctx.fillText(cell,ci===0?RX+8:RX+(cols[ci]+cols[ci+1])/2,ry+RH/2);
    });
  });
  ctx.restore();rr(RX,TY,RW,totH,8);ctx.strokeStyle='#d0c0e8';ctx.lineWidth=1;ctx.stroke();
  const PWY=TY+totH+18;
  ctx.fillStyle=B.green;ctx.fillRect(RX,PWY,3,14);ctx.fillStyle=B.charcoal;ctx.font=`bold 12px ${FONT}`;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(L().takeawayWindow,RX+10,PWY+7);
  L().pwItems.forEach(([k,v],i)=>{
    const py=PWY+26+i*22;ctx.fillStyle='#7a7a8a';ctx.font=`11px ${FONT}`;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(k,RX+10,py);
    ctx.fillStyle=B.charcoal;ctx.font=`bold 11px ${FONT}`;ctx.textAlign='right';ctx.fillText(v,RX+RW-6,py);
  });
  // Comparison note box — fills the gap below Process Window (PE-CVD vs PVD/Sputter)
  {
    const ibY=PWY+26+L().pwItems.length*22+4, ibH=40;
    ctx.save();rr(RX,ibY,RW,ibH,8);ctx.clip();
    ctx.fillStyle='rgba(112,48,160,0.07)';ctx.fillRect(RX,ibY,RW,ibH);
    ctx.restore();
    rr(RX,ibY,RW,ibH,8);ctx.strokeStyle='rgba(112,48,160,0.32)';ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle=B.purple;ctx.font=`bold 10.5px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';
    wrapText(L().pecvdCompareNote,RX+RW/2,ibY+ibH/2,RW-24,13);
  }
  const BX=20,BY=514,BW=W-40,BH=74,HDH=30;
  ctx.save();rr(BX,BY,BW,BH,8);ctx.clip();ctx.fillStyle='rgba(242,201,76,.13)';ctx.fillRect(BX,BY,BW,HDH);ctx.fillStyle='#fff';ctx.fillRect(BX,BY+HDH,BW,BH-HDH);ctx.restore();
  rr(BX,BY,BW,BH,8);ctx.strokeStyle='rgba(190,155,40,.32)';ctx.lineWidth=.8;ctx.stroke();
  ctx.strokeStyle='rgba(190,155,40,.32)';ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(BX+1,BY+HDH);ctx.lineTo(BX+BW-1,BY+HDH);ctx.stroke();
  ctx.fillStyle='rgba(242,201,76,.50)';ctx.beginPath();ctx.arc(BX+20,BY+HDH/2,9,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#7a5800';ctx.font=`bold 12px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('!',BX+20,BY+HDH/2);
  ctx.fillStyle=B.charcoal;ctx.font=`bold 12.5px ${FONT}`;ctx.textAlign='left';ctx.fillText(L().takeawayLimits,BX+36,BY+HDH/2);
  ctx.fillStyle='#5a6070';ctx.font=`10.5px ${FONT}`;
  L().limitLines.forEach((ln,i)=>ctx.fillText(ln,BX+14,BY+HDH+16+i*18));
  drawLogo(.55);
}

const RENDERS=[s1,s2,s3,s4,s5,s6,s7,s8,s9];

// ── Step controls ─────────────────────────────────────────────
function renderStepCtrl(i){
  stepCtrlEl.innerHTML='';
  if(i===6){
    const wrap=document.createElement('div');wrap.className='mode-toggle';
    const dcB=document.createElement('button');dcB.textContent='DC';
    const acB=document.createElement('button');acB.textContent='AC';
    if(mode==='AC')acB.classList.add('active');else dcB.classList.add('active');
    dcB.addEventListener('click',()=>{mode='DC';dcD=0;setupStep(6);});
    acB.addEventListener('click',()=>{mode='AC';dcD=0;setupStep(6);});
    wrap.appendChild(dcB);wrap.appendChild(acB);stepCtrlEl.appendChild(wrap);
    const note=document.createElement('span');note.className='mode-info';
    note.textContent=mode==='AC'?L().modeInfoAC:L().modeInfoDC;
    stepCtrlEl.appendChild(note);
  }else if(i===7){
    const btn=document.createElement('button');btn.className='reset-btn';btn.textContent=L().resetFilm;
    btn.addEventListener('click',()=>{filmThickness=0;});stepCtrlEl.appendChild(btn);
  }
}

// ── Main loop ─────────────────────────────────────────────────
function render(){
  const now=performance.now(),dt=Math.min((now-lastT)/1000,.05);lastT=now;
  // Fill the entire physical canvas (including any letterbox margins) with
  // the background color first, in identity transform space.
  ctx.save();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle=B.bg;
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.restore();
  // Re-apply the centered (letterboxed) logical transform for drawing
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(renderScale * DPR, renderScale * DPR);
  ctx.translate(renderOffX / renderScale, renderOffY / renderScale);
  RENDERS[currentStep](dt,(now-t0)/1000);
  requestAnimationFrame(render);
}
document.fonts.ready.then(()=>render()).catch(()=>render());

// ── Step buttons ──────────────────────────────────────────────
const sBEl=document.getElementById('stepButtons');
function buildBtns(){
  sBEl.innerHTML='';
  L().steps.forEach((s,i)=>{
    const b=document.createElement('button');b.className='step-btn'+(i===currentStep?' active':'');
    b.textContent=i===0?'S':i===L().steps.length-1?'K':i;b.title=s.title;
    b.addEventListener('click',()=>setStep(i));sBEl.appendChild(b);
  });
}
const prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn');
prevBtn.addEventListener('click',()=>setStep(currentStep-1));
nextBtn.addEventListener('click',()=>setStep(currentStep+1));

function fmtHint(raw){
  if(!raw)return'';const sp=raw.indexOf(' ');
  if(sp>0){const icon=raw.slice(0,sp),body=raw.slice(sp+1);if(/\p{Emoji}/u.test(icon))return`<div class="hint-icon">${icon}</div><div class="hint-text">${body}</div>`;}
  return`<div class="hint-text">${raw}</div>`;
}
const DEEP_DIVE_LABEL = { en:'Deep Dive', ko:'심화학습' };
function toggleDeepDive(idx){
  const hdr=document.getElementById('ddHdr'+idx), body=document.getElementById('ddBody'+idx);
  if(!hdr||!body)return;
  const open=body.classList.toggle('open');
  hdr.classList.toggle('open',open);
}
function setStep(i){
  if(i<0||i>=L().steps.length)return;currentStep=i;
  document.querySelectorAll('.step-btn.active').forEach(b=>b.classList.remove('active'));
  if(sBEl.children[i])sBEl.children[i].classList.add('active');
  document.getElementById('stepNum').textContent=i===0?'S':i===L().steps.length-1?'K':i;
  document.getElementById('stepTitle').textContent=L().steps[i].title;
  document.getElementById('stepBody').innerHTML=L().steps[i].body;
  const hEl=document.getElementById('stepHint');
  if(L().steps[i].hint){hEl.innerHTML=fmtHint(L().steps[i].hint);hEl.style.display='';}
  else hEl.style.display='none';
  // Deep Dive accordion(s) — supports single object or array
  const ddEl=document.getElementById('deepDiveContainer');
  let dds=L().steps[i].deepDive;
  if(dds && !Array.isArray(dds)) dds=[dds];
  if(dds && dds.length){
    ddEl.innerHTML=dds.map((dd,idx)=>`
      <div class="deep-wrap">
        <div class="deep-hdr" id="ddHdr${idx}" onclick="toggleDeepDive(${idx})">
          <span class="deep-icon">📚</span>
          <span class="deep-title">${dd.title}</span>
          <span class="deep-badge">${DEEP_DIVE_LABEL[lang]}</span>
          <span class="deep-chevron">▼</span>
        </div>
        <div class="deep-body" id="ddBody${idx}">
          <div class="deep-inner">${dd.body}</div>
        </div>
      </div>`).join('');
  } else {
    ddEl.innerHTML='';
  }
  prevBtn.disabled=(i===0);nextBtn.disabled=(i===L().steps.length-1);
  prevBtn.textContent=L().prevBtn;nextBtn.textContent=L().nextBtn;
  // scroll side panel to top
  document.getElementById('sideInner').scrollTop=0;
  setupStep(i);
}

// ── Language ──────────────────────────────────────────────────
function setLang(l){
  lang=l;
  document.getElementById('btnEN').classList.toggle('active',l==='en');
  document.getElementById('btnKO').classList.toggle('active',l==='ko');
  document.getElementById('hTitle').textContent=L().hTitle;
  document.getElementById('hSub').textContent=L().hSub;
  buildBtns();setStep(currentStep);
}

// ── Tooltip ───────────────────────────────────────────────────
function ptIn(x,y,r){return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;}
canvas.addEventListener('mousemove',e=>{
  const cr=canvas.getBoundingClientRect();
  const mx=(e.clientX-cr.left), my=(e.clientY-cr.top);
  const cx=(mx-renderOffX)/renderScale, cy=(my-renderOffY)/renderScale;
  if(currentStep!==0){hoveredHotspot=null;tooltip.classList.remove('show');canvas.style.cursor='default';return;}
  let foundR=null;for(const h of HR){if(ptIn(cx,cy,h.rect)){foundR=h;break;}}
  hoveredHotspot=foundR;
  if(foundR){
    const hs=L().hotspots.find(h=>h.n===foundR.n);
    tooltip.classList.add('show');
    tooltip.innerHTML=`<b>${hs.title}</b><br>${hs.text.replace(/\n/g,'<br>')}`;
    const cardRect=canvas.parentElement.getBoundingClientRect();
    tooltip.style.left=(e.clientX-cardRect.left)+'px';
    tooltip.style.top=(e.clientY-cardRect.top-10)+'px';
    canvas.style.cursor='pointer';
  }else{tooltip.classList.remove('show');canvas.style.cursor='default';}
});
canvas.addEventListener('mouseleave',()=>{hoveredHotspot=null;tooltip.classList.remove('show');});

// ── Init ──────────────────────────────────────────────────────
buildBtns();
setStep(0);
</script>
