<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Module 05 — Matching Network | Benedu Insight RF Lecture Series</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/benedu-insight/benedu-insight.github.io/refs/heads/main/logo_png/benedu_insight_Symbol.png"/>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet"/>

  startup: { typeset: false }

<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
<style>
/* ═══════════════════════════════════════════════
   BENEDU INSIGHT — MODULE 05 BASE STYLES
   Module 04 구조 계승, Module 05(Matching Network) 아이덴티티 추가
═══════════════════════════════════════════════ */
:root {
  --bg: #F7F8FA;
  --card: #F1EFEA;
  --card-hd: #E7E4DD;
  --purple: #7030A0;
  --green: #0F8C50;
  --plasma: #E87B1E;
  --blue: #1A6FB5;
  --red: #C0392B;
  --teal: #C8860D;
  --amber: #C8860D;
  --text: #1A1A2E;
  --text-sub: #5A5A7A;
  --border: #D8D5CE;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --radius: 12px;
  --font: 'Google Sans', 'Noto Sans KR', sans-serif;
  --mono: 'JetBrains Mono', monospace;
  --batang: 'Gowun Batang', serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; scroll-behavior: smooth; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  display: flex;
  min-height: 100vh;
}

/* ── SIDEBAR ── */
#sidebar {
  width: 260px;
  min-height: 100vh;
  background: #FFFFFF;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0;
  overflow-y: auto;
  z-index: 100;
}
.sb-brand {
  padding: 20px 18px 16px;
  border-bottom: 1px solid var(--border);
}
.sb-brand .module-tag {
  margin-top: 4px;
  font-size: 0.72rem;
  color: var(--text-sub);
}
.sb-era {
  padding: 10px 14px 6px;
  font-size: 0.65rem;
  font-weight: 700;
  color: var(--text-sub);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.sb-era-bar {
  height: 3px;
  border-radius: 2px;
  margin: 4px 14px 8px;
  background: var(--teal);
  opacity: 0.4;
}
.sb-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 9px 14px;
  cursor: pointer;
  border-radius: 8px;
  margin: 1px 8px;
  transition: background 0.15s;
  text-decoration: none;
}
.sb-item:hover { background: #E8F7F2; }
.sb-item.active { background: #D1F0E6; }
.sb-dot {
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.65rem;
  font-family: var(--mono);
  font-weight: 600;
  flex-shrink: 0;
  margin-top: 1px;
}
.sb-label { font-size: 0.78rem; line-height: 1.35; color: var(--text); }
.sb-sub { font-size: 0.68rem; color: var(--text-sub); margin-top: 2px; }
.sb-lang {
  margin-top: auto;
  padding: 14px 16px;
  border-top: 1px solid var(--border);
  display: flex; gap: 8px;
}
.lang-btn {
  flex: 1; padding: 7px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  background: transparent;
  font-family: var(--font);
  font-size: 0.78rem;
  cursor: pointer;
  transition: all 0.15s;
  color: var(--text-sub);
}
.lang-btn.active {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
  font-weight: 600;
}

/* ── TOP LOGO BAR ── */
#top-logo-bar {
  position: fixed;
  top: 0; left: 260px; right: 0;
  height: 44px;
  background: #fff;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: 0 28px;
  z-index: 150;
}
#top-logo-bar img {
  height: 22px;
  width: auto;
  object-fit: contain;
  opacity: 0.88;
}

/* ── MAIN CONTENT ── */
#main {
  margin-left: 260px;
  flex: 1;
  padding: 64px 36px 32px;
  max-width: calc(100vw - 260px);
}

/* ── SLIDE HEADER ── */
.slide-header { margin-bottom: 28px; }
.slide-eyebrow {
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--teal);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.slide-title {
  font-size: 1.9rem;
  font-weight: 700;
  color: var(--text);
  line-height: 1.2;
}
.slide-title span { color: var(--teal); }
.slide-subtitle {
  margin-top: 8px;
  font-size: 0.92rem;
  color: var(--text-sub);
  line-height: 1.5;
}

/* ── TAB SYSTEM ── */
.tab-row {
  display: flex;
  gap: 4px;
  margin-bottom: 24px;
  border-bottom: 2px solid var(--border);
  padding-bottom: 0;
}
.tab-btn {
  padding: 8px 18px 10px;
  font-family: var(--font);
  font-size: 0.82rem;
  font-weight: 500;
  border: none;
  background: transparent;
  color: var(--text-sub);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  transition: all 0.15s;
}
.tab-btn.active {
  color: var(--teal);
  border-bottom-color: var(--teal);
  font-weight: 700;
}
.tab-btn:hover:not(.active) { color: var(--text); }
.tab-pane { display: none; }
.tab-pane.active { display: block; }

/* ── DIAGRAM CARD ── */
.d-wrap {
  background: var(--card);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}
.d-header {
  background: var(--card-hd);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-radius: var(--radius) var(--radius) 0 0;
}
.d-badge {
  background: var(--teal);
  color: #fff;
  font-size: 0.65rem;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 20px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  font-family: var(--mono);
}
.d-badge.purple { background: var(--purple); }
.d-badge.green  { background: var(--green); }
.d-badge.plasma { background: var(--plasma); }
.d-badge.red    { background: var(--red); }
.d-title { font-size: 0.9rem; font-weight: 700; color: var(--text); }
.d-body { padding: 1.2rem; }

/* ── THEORY CARDS ── */
.theory-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
  margin-bottom: 20px;
}
.theory-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.05);
}
.theory-card h4 {
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--teal);
  margin-bottom: 7px;
  display: flex; align-items: center; gap: 6px;
}
.theory-card p { font-size: 0.82rem; color: var(--text-sub); line-height: 1.55; }

/* ── EQUATION BLOCK ── */
.eq-block {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 18px;
  margin: 10px 0;
  font-family: var(--mono);
  font-size: 0.9rem;
  text-align: center;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}
.eq-label {
  font-size: 0.7rem;
  color: var(--text-sub);
  text-align: right;
  margin-top: 4px;
  font-family: var(--font);
}

/* ── CALLOUT ── */
.callout {
  background: #F0FAFF;
  border: 1px solid #A8D8E8;
  border-radius: 10px;
  padding: 14px 16px;
  margin: 14px 0;
  font-size: 0.84rem;
  line-height: 1.6;
  color: var(--text);
}
.callout.green  { background: #F0FAF4; border-color: #A8D5B8; }
.callout.plasma { background: #FFF8F0; border-color: #F5C89A; }
.callout.purple { background: #F8F6FF; border-color: #C9B8E8; }
.callout.red    { background: #FDF0EE; border-color: #EAB0A8; }
.callout-title {
  font-weight: 700;
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 6px;
  color: var(--teal);
}
.callout.green  .callout-title { color: var(--green); }
.callout.plasma .callout-title { color: var(--plasma); }
.callout.purple .callout-title { color: var(--purple); }
.callout.red    .callout-title { color: var(--red); }

/* ── QUIZ ── */
.quiz-card {
  background: #fff;
  border: 1.5px solid #A8D8E8;
  border-radius: 10px;
  padding: 18px;
  margin-top: 10px;
}
.quiz-q {
  font-size: 0.88rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 14px;
  line-height: 1.5;
}
.quiz-opts { display: flex; flex-direction: column; gap: 8px; }
.quiz-opt {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 14px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.82rem;
  line-height: 1.4;
  transition: all 0.15s;
  background: var(--bg);
}
.quiz-opt:hover { border-color: var(--teal); background: #F0FAFF; }
.quiz-opt.correct { border-color: var(--green); background: #F0FAF4; color: var(--green); }
.quiz-opt.wrong   { border-color: var(--red); background: #FDF0EE; color: var(--red); }
.quiz-opt span.opt-key {
  font-family: var(--mono);
  font-weight: 700;
  font-size: 0.75rem;
  width: 20px; flex-shrink: 0;
}
.quiz-feedback {
  margin-top: 12px;
  font-size: 0.8rem;
  padding: 10px 12px;
  border-radius: 8px;
  display: none;
  line-height: 1.5;
}
.quiz-feedback.show { display: block; }
.quiz-feedback.ok { background: #F0FAF4; color: var(--green); }
.quiz-feedback.ng { background: #FDF0EE; color: var(--red); }

/* ── CONNECTIONS ── */
.connections { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.conn-chip {
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 0.75rem;
  font-family: var(--mono);
  font-weight: 600;
  border: 1.5px solid var(--border);
  cursor: pointer;
  transition: all 0.15s;
  background: #fff;
  color: var(--text-sub);
}
.conn-chip:hover { border-color: var(--teal); color: var(--teal); background: #F0FAFF; }

/* ── DEEP STUDY ── */
.deep-section h3 {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--teal);
  margin: 20px 0 10px;
  padding-bottom: 6px;
  border-bottom: 1.5px solid #A8D8E8;
}
.deep-section p  { font-size: 0.84rem; line-height: 1.7; color: var(--text); margin-bottom: 10px; }
.deep-section ul { padding-left: 18px; margin-bottom: 10px; }
.deep-section ul li { font-size: 0.83rem; line-height: 1.65; color: var(--text); margin-bottom: 4px; }

/* ── TABLE ── */
.data-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin: 10px 0; }
.data-table th {
  background: var(--card-hd);
  padding: 9px 12px;
  text-align: left;
  font-weight: 700;
  font-size: 0.75rem;
  color: var(--text-sub);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.data-table td { padding: 9px 12px; border-bottom: 1px solid var(--border); color: var(--text); line-height: 1.4; }
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { background: #F0FAFF; }

/* ── CANVAS SIMULATOR ── */
.sim-wrap { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin: 10px 0; }
.sim-canvas {
  width: 100%;
  max-width: 100%;
  height: auto;
  border-radius: 8px;
  background: #0D1117;
  display: block;
  image-rendering: -webkit-optimize-contrast;
  image-rendering: crisp-edges;
  box-sizing: border-box;
}
.sim-controls { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 14px; align-items: center; }
.sim-ctrl-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 140px; }
.sim-ctrl-label { font-size: 0.72rem; font-weight: 700; color: var(--text-sub); display: flex; justify-content: space-between; }
.sim-ctrl-val { font-family: var(--mono); font-size: 0.72rem; color: var(--teal); font-weight: 600; }
.sim-slider {
  -webkit-appearance: none; width: 100%; height: 4px; border-radius: 2px;
  background: var(--border); outline: none;
}
.sim-slider::-webkit-slider-thumb {
  -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
  background: var(--teal); cursor: pointer;
}
.sim-btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.sim-btn {
  padding: 7px 16px; border-radius: 8px;
  border: 1.5px solid var(--teal);
  background: transparent; color: var(--teal);
  font-family: var(--font); font-size: 0.78rem; font-weight: 600;
  cursor: pointer; transition: all 0.15s;
}
.sim-btn:hover, .sim-btn.active { background: var(--teal); color: #fff; }
.sim-btn.purple-btn { border-color: var(--purple); color: var(--purple); }
.sim-btn.purple-btn:hover, .sim-btn.purple-btn.active { background: var(--purple); color: #fff; }
.sim-info {
  margin-top: 10px; padding: 10px 14px;
  background: var(--bg); border-radius: 8px;
  font-size: 0.78rem; color: var(--text-sub); line-height: 1.5; min-height: 36px;
}

/* ── REVEAL BLOCK (함께 생각해 보기) ── */
.reveal-wrap {
  background: #fff;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 16px;
  box-shadow: 0 1px 6px rgba(0,0,0,0.06);
}
.reveal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  cursor: pointer;
  user-select: none;
  transition: background 0.15s;
}
.reveal-header:hover { background: #F4F6FB; }
.reveal-q {
  font-size: 0.92rem;
  font-weight: 700;
  color: var(--text);
  line-height: 1.4;
  flex: 1;
}
.reveal-badge {
  flex-shrink: 0;
  background: var(--teal);
  color: #fff;
  font-size: 0.68rem;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 10px;
  font-family: var(--mono);
  letter-spacing: 0.04em;
  margin-right: 12px;
}
.reveal-chevron { flex-shrink: 0; font-size: 0.8rem; color: var(--text-sub); transition: transform 0.22s; }
.reveal-header.open .reveal-chevron { transform: rotate(180deg); }
.reveal-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.35s ease, opacity 0.25s ease;
  opacity: 0;
  border-top: 1px solid transparent;
}
.reveal-body.open {
  max-height: 2000px;
  opacity: 1;
  border-top-color: var(--border);
}
.reveal-inner { padding: 18px; }

/* ── Journey Key Block styles (Step 2) ── */
.jkey-block {
  display: block;
  margin-bottom: 0;
}
.jkey-spacer {
  display: block;
  height: 14px;
}
.jkey-h {
  display: block;
  font-size: 0.92rem;
  font-weight: 700;
  color: #E8EEF8;
  font-family: 'Google Sans', sans-serif;
  line-height: 1.7;
}
.jkey-tag {
  font-size: 0.78rem;
  font-weight: 600;
  color: #A0BBCC;
  font-family: 'Google Sans', sans-serif;
}
.jkey-f {
  display: block;
  font-size: 1.15rem;
  font-weight: 700;
  color: #E8EEF8;
  font-family: 'Google Sans', sans-serif;
  line-height: 1.8;
  padding-left: 18px;
}
.jkey-f sup {
  font-size: 0.72em;
  vertical-align: super;
}

#img-popup {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.85); z-index: 9999;
  align-items: center; justify-content: center;
  overflow: hidden;
}
#img-popup.open { display: flex; }
#img-popup-viewport {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  overflow: auto;
  cursor: zoom-in;
}
#img-popup-viewport.zoomed {
  cursor: grab;
  align-items: flex-start; justify-content: flex-start;
}
#img-popup-viewport.zoomed:active { cursor: grabbing; }
#img-popup img {
  max-width: 90vw; max-height: 85vh;
  border-radius: 10px; box-shadow: 0 8px 40px rgba(0,0,0,0.4);
  transition: max-width 0.2s ease, max-height 0.2s ease, width 0.2s ease;
  user-select: none;
}
#img-popup-viewport.zoomed img {
  max-width: none; max-height: none;
  width: 220%;
  border-radius: 6px;
  transition: none;
}
#img-popup-cap {
  position: fixed; bottom: 30px; left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.7); color: #fff;
  padding: 8px 18px; border-radius: 20px; font-size: 0.8rem;
  pointer-events: none;
  z-index: 2;
}
#img-popup-close {
  position: fixed; top: 20px; right: 28px;
  width: 40px; height: 40px; border-radius: 50%;
  background: rgba(255,255,255,0.12); color: #fff;
  border: 1.5px solid rgba(255,255,255,0.4);
  font-size: 1.3rem; line-height: 1; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  z-index: 2;
}
#img-popup-close:hover { background: rgba(255,255,255,0.25); }
#img-popup-hint {
  position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.6); color: #fff;
  padding: 6px 14px; border-radius: 16px; font-size: 0.74rem;
  pointer-events: none; z-index: 2;
}

/* ── PROGRESS BAR ── */
.progress-bar { position: fixed; top: 44px; left: 260px; right: 0; height: 3px; background: var(--border); z-index: 200; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--teal), var(--green)); transition: width 0.3s ease; }

/* ── RESPONSIVE ── */
@media (max-width: 768px) {
  #sidebar { display: none; }
  #main { margin-left: 0; padding: 64px 16px 20px; max-width: 100vw; }
  .progress-bar { left: 0; }
  #top-logo-bar { left: 0; }
}

/* ── 임피던스 페이저 다이어그램 ── */
.phasor-legend {
  display: flex; flex-wrap: wrap; gap: 10px;
  margin-top: 10px; align-items: center;
}
.phasor-dot {
  display: inline-block; width: 12px; height: 12px;
  border-radius: 50%; margin-right: 5px; vertical-align: middle;
}

/* ── Z 표기 큰 수식 ── */
.z-formula-block {
  display: flex; align-items: center; gap: 0;
  background: #fff; border: 2px solid #C9B8E8;
  border-radius: 14px; padding: 20px 28px;
  margin: 16px 0; flex-wrap: wrap; justify-content: center;
}
.z-formula-block .z-sym {
  font-size: 3rem; font-weight: 900;
  color: var(--purple); font-family: var(--mono);
  margin-right: 12px;
}
.z-formula-block .z-eq { font-size: 2.2rem; color: var(--text-sub); margin: 0 10px; }
.z-formula-block .z-r  { font-size: 2.2rem; font-weight: 700; color: var(--blue); }
.z-formula-block .z-pm { font-size: 2rem; color: var(--text-sub); margin: 0 8px; }
.z-formula-block .z-x  { font-size: 2.2rem; font-weight: 700; color: var(--purple); }
.z-formula-block .z-j  { font-size: 2.2rem; font-weight: 700; color: var(--purple); }
.z-sub-label {
  font-size: 0.72rem; color: var(--text-sub); text-align: center;
  margin-top: 4px; font-family: var(--mono);
}
</style>
<body>

<!-- IMAGE POPUP -->
<div id="img-popup">
  <button id="img-popup-close" onclick="closeImgPopup()" aria-label="Close">✕</button>
  <div id="img-popup-hint">🔍 클릭해서 확대 / 다시 클릭하면 축소 · ✕ 또는 Esc로 닫기</div>
  <div id="img-popup-viewport" onclick="toggleImgZoom(event)">
    <img id="img-popup-img" src="" alt=""/>
  </div>
  <div id="img-popup-cap"></div>
</div>

   HiDPI Canvas Utility
═══════════════════════════════════════════ */
function setupHiDPI(canvas) {
  const dpr  = window.devicePixelRatio || 1;
  const cssW = canvas.offsetWidth  || canvas.parentElement && canvas.parentElement.offsetWidth || 680;
  const attrH = parseInt(canvas.getAttribute('data-h') || canvas.height || 260);
  const attrW = parseInt(canvas.getAttribute('data-w') || canvas.width  || 680);
  const cssH  = Math.round(attrH * (cssW / attrW));
  canvas.width  = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  canvas.style.width  = '100%';
  canvas.style.height = cssH + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  return { ctx, W: cssW, H: cssH, dpr };
}

function renderSidebar() {
  const sl = slides();
  const nl = document.getElementById('nav-list');
  nl.innerHTML = '';
  sl.forEach(s => {
    const div = document.createElement('div');
    div.className = 'sb-item' + (s.id === currentId ? ' active' : '');
    div.onclick = () => navigateTo(s.id);
    const color = ERA_COLORS[s.era] || '#C8860D';
    const alpha = s.placeholder ? '0.45' : '1';
    const sub = currentLang === 'ko' ? SB_SUBS_KO[s.id] : SB_SUBS_EN[s.id];
    div.style.opacity = alpha;
    div.innerHTML = `
      <div class="sb-dot" style="background:${color}20;color:${color}">${SB_ICONS[s.id]||'●'}</div>
      <div>
        <div class="sb-label">${s.title}</div>
        <div class="sb-sub">${sub||''}</div>
      </div>`;
    nl.appendChild(div);
  });
  updateProgress();
}

function updateProgress() {
  const sl = slides();
  const idx = sl.findIndex(s => s.id === currentId);
  const pct = sl.length > 1 ? (idx / (sl.length - 1)) * 100 : 0;
  document.getElementById('progressFill').style.width = pct + '%';
}

/* ═══════════════════════════════════════════
   SIMULATOR — Topic 1 (d50): standing wave on the line
   13.56MHz, VF\u22480.66 => \u03bb \u2248 15m, line length = 30m (\u2248 2\u03bb, \u2248 4 half-wavelengths)
   z is measured from the LOAD (z=0 at load) toward the SOURCE (z=L at source).
═══════════════════════════════════════════ */
var D50_Z0 = 50;
var D50_F = 13.56e6;
var D50_VF = 0.66;
var D50_C = 3e8;
var D50_LAMBDA = (D50_C / D50_F) * D50_VF;      // \u2248 14.6 m
var D50_BETA = 2 * Math.PI / D50_LAMBDA;         // rad/m
var D50_LINE_LEN = 30;                            // m, Source-to-Load distance
var D50_LOADS = {
  mismatch: { R: 2,  X: 20 },
  matched:  { R: 50, X: 0  },
};
window._d50LoadKey = 'mismatch';
window._d50Playing = false;
window._d50PlayTimer = null;
window._d50Phase = 0;

function d50Gamma(R, X) {
  var Z0 = D50_Z0;
  var numRe = R - Z0, numIm = X, denRe = R + Z0, denIm = X;
  var denMag2 = denRe*denRe + denIm*denIm || 1e-9;
  return { re: (numRe*denRe + numIm*denIm)/denMag2, im: (numIm*denRe - numRe*denIm)/denMag2 };
}

// Instantaneous (normalized, Vplus=1) voltage at distance z from the LOAD, at phase wt (animation time)
// V(z,t) = Re[ (e^{j\u03b2z} + \u0393_L e^{-j\u03b2z}) e^{jwt} ]
function d50InstantV(z, R, X, wt) {
  var G = d50Gamma(R, X);
  var phPlus = D50_BETA * z;
  var phMinus = -D50_BETA * z;
  // forward wave phasor e^{j\u03b2z}, reflected wave phasor \u0393_L * e^{-j\u03b2z}
  var fRe = Math.cos(phPlus), fIm = Math.sin(phPlus);
  var rRe = G.re*Math.cos(phMinus) - G.im*Math.sin(phMinus);
  var rIm = G.re*Math.sin(phMinus) + G.im*Math.cos(phMinus);
  var totRe = fRe + rRe, totIm = fIm + rIm;
  // multiply by e^{jwt} and take real part: Re[(totRe+j*totIm)(cos(wt)+j sin(wt))]
  return totRe*Math.cos(wt) - totIm*Math.sin(wt);
}

// Envelope (VSWR shape) at distance z from the LOAD
function d50Envelope(z, R, X) {
  var G = d50Gamma(R, X);
  var mag = Math.sqrt(G.re*G.re + G.im*G.im);
  var ang = Math.atan2(G.im, G.re);
  return Math.sqrt(1 + mag*mag + 2*mag*Math.cos(2*D50_BETA*z - ang));
}

function drawD50Canvas() {
  var canvas = document.getElementById('d50-canvas');
  if (!canvas) return;
  var hi = setupHiDPI(canvas);
  var ctx = hi.ctx, W = hi.W, H = hi.H;
  var isEn = currentLang === 'en';
  var MONO = "'JetBrains Mono',monospace";

  var L = D50_LOADS[window._d50LoadKey];

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#FAFBFF'; ctx.fillRect(0,0,W,H);

  // layout: Source at left (z=L, i.e. 30m from load), Load at right (z=0)
  var padL = 60, padR = 60;
  var lineY = H*0.5;
  var x0 = padL, x1 = W - padR; // x0 = Source side, x1 = Load side
  var ampPx = H*0.36; // pixels per unit normalized voltage (Vplus=1 maps to ampPx)

  function zOfX(x) {
    // z measured from the load: at x1 (load) z=0, at x0 (source) z=D50_LINE_LEN
    var t = (x1 - x) / (x1 - x0); // 0 at load, 1 at source
    return t * D50_LINE_LEN;
  }

  // baseline
  ctx.strokeStyle = '#3C3530'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x0,lineY); ctx.lineTo(x1,lineY); ctx.stroke();

  // envelope (upper & lower) as a filled red dotted curve, and instantaneous wave as blue line
  var N = 240;
  ctx.beginPath();
  for (var i=0;i<=N;i++) {
    var x = x0 + (x1-x0)*i/N;
    var z = zOfX(x);
    var env = d50Envelope(z, L.R, L.X);
    var y = lineY - env*ampPx;
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  for (var i=N;i>=0;i--) {
    var x = x0 + (x1-x0)*i/N;
    var z = zOfX(x);
    var env = d50Envelope(z, L.R, L.X);
    var y = lineY + env*ampPx;
    ctx.lineTo(x,y);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(192,57,43,0.07)';
  ctx.fill();

  // envelope curves (dotted, red) -- this is the SWR envelope, the "boundary" the wave oscillates within
  ctx.strokeStyle = '#C0392B'; ctx.lineWidth = 1.6; ctx.setLineDash([4,3]);
  ctx.beginPath();
  for (var i=0;i<=N;i++) {
    var x = x0 + (x1-x0)*i/N;
    var z = zOfX(x);
    var env = d50Envelope(z, L.R, L.X);
    var y = lineY - env*ampPx;
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke();
  ctx.beginPath();
  for (var i=0;i<=N;i++) {
    var x = x0 + (x1-x0)*i/N;
    var z = zOfX(x);
    var env = d50Envelope(z, L.R, L.X);
    var y = lineY + env*ampPx;
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke();
  ctx.setLineDash([]);

  // instantaneous wave (solid, blue)
  ctx.strokeStyle = '#1A6FB5'; ctx.lineWidth = 2.2;
  ctx.beginPath();
  for (var i=0;i<=N;i++) {
    var x = x0 + (x1-x0)*i/N;
    var z = zOfX(x);
    var v = d50InstantV(z, L.R, L.X, window._d50Phase);
    var y = lineY - v*ampPx;
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke();

  // markers: node / antinode dots on the upper envelope (visual reference)
  // mark the half-wavelength spacing along the bottom axis
  ctx.fillStyle = '#9A8A68'; ctx.font = '9px ' + MONO; ctx.textAlign = 'center';
  var halfLambdaPx = (x1-x0) * (D50_LAMBDA/2) / D50_LINE_LEN;
  var nTicks = Math.floor(D50_LINE_LEN / (D50_LAMBDA/2));
  for (var k=0; k<=nTicks; k++) {
    var xz = x1 - k*halfLambdaPx;
    if (xz < x0-1) break;
    ctx.strokeStyle = '#D8D5CE'; ctx.lineWidth = 1; ctx.setLineDash([2,2]);
    ctx.beginPath(); ctx.moveTo(xz, lineY-ampPx*2.05); ctx.lineTo(xz, lineY+ampPx*2.05); ctx.stroke();
    ctx.setLineDash([]);
  }

  // Source label
  ctx.fillStyle = '#3C3530'; ctx.font = 'bold 12px ' + MONO; ctx.textAlign = 'left';
  ctx.fillText('Zs=50Ω', x0-2, lineY - ampPx*2.25);
  ctx.beginPath(); ctx.arc(x0, lineY, 5, 0, Math.PI*2); ctx.fillStyle='#3C3530'; ctx.fill();

  // Load label
  ctx.textAlign = 'right';
  ctx.fillStyle = (window._d50LoadKey === 'matched') ? '#0F8C50' : '#C0392B';
  var loadLabel = (window._d50LoadKey === 'matched') ? 'Z_L=50Ω' : 'Z_L=2+j20Ω';
  ctx.fillText(loadLabel, x1+2, lineY - ampPx*2.25);
  ctx.beginPath(); ctx.arc(x1, lineY, 5, 0, Math.PI*2); ctx.fill();

  // distance label
  ctx.fillStyle = '#9A8A68'; ctx.font = '10px ' + MONO; ctx.textAlign = 'center';
  ctx.fillText('30 m  (\u2248 2\u03bb @ 13.56MHz, VF\u22480.66, \u03bb\u224815m)', (x0+x1)/2, H-8);

  // VSWR readout on canvas
  var G = d50Gamma(L.R, L.X);
  var Gmag = Math.sqrt(G.re*G.re+G.im*G.im);
  var vswr = (1+Gmag)/Math.max(1e-6,1-Gmag);
  ctx.fillStyle = '#3C3530'; ctx.font = 'bold 11px ' + MONO; ctx.textAlign='left';
  ctx.fillText('VSWR \u2248 ' + (vswr>100? '\u221e' : vswr.toFixed(2)) + ' : 1', x0-2, lineY + ampPx*2.4);
}

function updateD50Readout() {
  var ro = document.getElementById('d50-readout');
  if (!ro) return;
  var isEn = currentLang === 'en';
  var L = D50_LOADS[window._d50LoadKey];
  var G = d50Gamma(L.R, L.X);
  var Gmag = Math.sqrt(G.re*G.re + G.im*G.im);
  var Gang = Math.atan2(G.im, G.re) * 180/Math.PI;
  var vswr = (1+Gmag)/Math.max(1e-6,1-Gmag);
  var pctReflected = Gmag*Gmag*100;
  var matched = window._d50LoadKey === 'matched';

  var loadStr = matched ? '50 + j0' : '2 + j20';

  ro.innerHTML =
    '<div style="font-size:0.78rem;font-weight:700;color:#FFD580;margin-bottom:10px;font-family:\'Google Sans\',sans-serif">'+

      '<div>Z_L = '+loadStr+' Ω</div>'+
      '<div>Γ = '+G.re.toFixed(3)+(G.im>=0?' + j':' \u2212 j')+Math.abs(G.im).toFixed(3)+
        '  (|Γ|='+Gmag.toFixed(3)+', ∠'+Gang.toFixed(1)+'°)</div>'+
      '<div>|Γ|² ≈ <span style="color:#FF8A7A;font-weight:700">'+pctReflected.toFixed(1)+'%</span> '+(isEn?'reflected':'반사됨')+'</div>'+
      '<div>VSWR = <span style="color:'+(matched?'#7FD8A0':'#FF8A7A')+';font-weight:700">'+(vswr>100?'\u221e':vswr.toFixed(2))+' : 1</span></div>'+
    '</div>'+
    '<div style="font-size:0.78rem;color:#E8DCC0;line-height:1.6;margin-top:10px;border-top:1px solid rgba(255,255,255,0.15);padding-top:10px">'+
      (matched
        ? (isEn ? 'With Z_L=50Ω the envelope flattens into a straight line \u2014 the voltage amplitude is the same everywhere on the line, exactly V\u207a, because there is no reflected wave at all.'
                : 'Z_L=50Ω일 때 envelope가 완전한 수평선이 됩니다 — 반사파가 전혀 없으므로 선로 위 어디서나 전압 진폭이 똑같이 V⁺입니다.')
        : (isEn ? 'With Z_L=2+j20Ω, the envelope swings between V\u207a(1+|\u0393|)\u22481.93 and V\u207a(1\u2212|\u0393|)\u22480.07 \u2014 nearly double the source voltage at the antinode.'
                : 'Z_L=2+j20Ω일 때 envelope는 V⁺(1+|Γ|)≈1.93과 V⁺(1−|Γ|)≈0.07 사이를 오갑니다 — antinode에서는 거의 보내는 전압의 2배에 달합니다.'))+
    '</div>';
}

function complexParallel(re1, im1, re2, im2) {
  // (Z1*Z2)/(Z1+Z2)
  var numRe = re1*re2 - im1*im2, numIm = re1*im2 + im1*re2;
  var denRe = re1+re2, denIm = im1+im2;
  var denMag2 = denRe*denRe + denIm*denIm || 1e-12;
  return { re: (numRe*denRe + numIm*denIm)/denMag2, im: (numIm*denRe - numRe*denIm)/denMag2 };
}

/* ═══════════════════════════════════════════
   SIMULATOR — Topic 5 (d54): realistic load + conjugate matching
═══════════════════════════════════════════ */
var D54_Z0 = 50;
window._d54Step = 0;
// Path of {R, X, type} representing the impedance looking from Source into the network at each step
window._d54Path = [
  { R: 50, X: 0,      type: 'source' },
  { R: 2,  X: -10.207, type: 'loadcap' },   // after parallel Load Cap (real part matched to 2, leftover -j9.798... but we show network-side conjugate build)
];

function d54Gamma(R, X) {
  var Z0 = D54_Z0;
  var numRe = R-Z0, numIm = X, denRe = R+Z0, denIm = X;
  var denMag2 = denRe*denRe + denIm*denIm || 1e-9;
  return { re: (numRe*denRe + numIm*denIm)/denMag2, im: (numIm*denRe - numRe*denIm)/denMag2 };
}

window.setD54Step = function(step) {
  window._d54Step = step;
  document.querySelectorAll('[id^="d54-step-"]').forEach(function(b){ b.classList.remove('active'); });
  var btn = document.getElementById('d54-step-' + step);
  if (btn) btn.classList.add('active');
  renderD54();
};

function renderD54() {
  drawD54Chart();
  updateD54Readout();
}

function d54StateAt(step) {
  // Network-side impedance as seen from Source, at each construction step,
  // tracking the same numeric path used in Topics 3/4/5's worked example,
  // generalized to the conjugate target of Z_L = 2+j20.
  // step0: Source alone (50)
  // step1: Zs‖Za  (Load Cap, parallel)            -> 2.000 - j9.798
  // step2: + Tune Coil (series, +j9.798)            -> 2.000 + 0j
  // step3: + Tune Cap (series, -j20)                -> 2.000 - j20  (= Z_L*)
  if (step <= 0) return { R: 50, X: 0 };
  if (step === 1) return { R: 2.000, X: -9.798 };
  if (step === 2) return { R: 2.000, X: 0 };
  return { R: 2.000, X: -20 };
}

function drawD54Chart() {
  var canvas = document.getElementById('d54-chart');
  if (!canvas) return;
  var dpr = window.devicePixelRatio||1;
  var W = canvas.offsetWidth, H = canvas.offsetHeight;
  if (!W||!H) return;
  canvas.width = Math.round(W*dpr); canvas.height = Math.round(H*dpr);
  var ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr);
  var isEn = currentLang === 'en';
  var MONO = "'JetBrains Mono',monospace";

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#FAFBFF'; ctx.fillRect(0,0,W,H);

  var cx = W*0.5, cy = H*0.5;
  var rad = Math.min(W*0.42, H*0.42);

  ctx.strokeStyle = '#444'; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.arc(cx,cy,rad,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle = '#D8D5CE'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx-rad,cy); ctx.lineTo(cx+rad,cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx,cy-rad); ctx.lineTo(cx,cy+rad); ctx.stroke();

  function toXY(R, X) { var g = d54Gamma(R,X); return { x: cx+g.re*rad, y: cy-g.im*rad }; }

  // fixed reference: the actual load Z_L = 2+j20
  var loadPt = toXY(2, 20);
  ctx.fillStyle = '#C8B89A';
  ctx.beginPath(); ctx.arc(loadPt.x, loadPt.y, 5, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(loadPt.x, loadPt.y, 5, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = '#9A8A68'; ctx.font = '9px '+MONO; ctx.textAlign='center';
  ctx.fillText('Z_L=2+j20', loadPt.x, loadPt.y-12);

  // center target
  ctx.fillStyle = '#0F8C50';
  ctx.beginPath(); ctx.arc(cx,cy,3.5,0,Math.PI*2); ctx.fill();

  var step = window._d54Step;
  var path = [];
  for (var i=0; i<=step; i++) path.push(d54StateAt(i));

  // draw connecting arcs (simple straight-ish guide, since each step mixes series/shunt moves
  // through an intermediate normalization not directly expressible as one circle on this Z0=50 chart)
  for (var i=1; i<path.length; i++) {
    var p1 = toXY(path[i-1].R, path[i-1].X), p2 = toXY(path[i].R, path[i].X);
    ctx.strokeStyle = '#C8860D88'; ctx.lineWidth = 2;
    ctx.setLineDash([5,3]);
    ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
    ctx.setLineDash([]);
  }

  // draw points
  path.forEach(function(p, i){
    var pt = toXY(p.R, p.X);
    var isLast = (i === path.length-1);
    if (isLast) {
      var glow = ctx.createRadialGradient(pt.x,pt.y,0,pt.x,pt.y,16);
      glow.addColorStop(0,'#C8860D77'); glow.addColorStop(1,'transparent');
      ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(pt.x,pt.y,16,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#C8860D';
    } else {
      ctx.fillStyle = '#1A6FB5';
    }
    ctx.beginPath(); ctx.arc(pt.x,pt.y, isLast?7:5, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(pt.x,pt.y,isLast?7:5,0,Math.PI*2); ctx.stroke();
  });

  if (step >= 3) {
    ctx.fillStyle = '#0F8C50'; ctx.font = 'bold 10px '+MONO; ctx.textAlign='center';
    ctx.fillText(isEn?'\u0393\u22480 looking into network':'네트워크 쪽 Γ≈0', cx, cy+rad+18);
  }
}

var D55_LOADS = {
  center: { R: 2.1, X: 20 },
  hi:     { R: 2.0, X: 30 },
  lo:     { R: 2.0, X: 10 },
  neg:    { R: 2.0, X: -20 },

window.setD55Preset = function(key) {
  window._d55LoadKey = key;
  document.querySelectorAll('[id^="d55-preset-"]').forEach(function(b){ b.classList.remove('active'); });
  var btn = document.getElementById('d55-preset-' + key);
  if (btn) btn.classList.add('active');

function d55Compute(R, X) {
  // Classic L-network synthesis: first cancel the load's own reactance with a conceptual
  // series step, leaving a pure resistance R; then a shunt (Load Cap) at the Z0 side
  // and a combined series reactance (Tune) bring the network to Z0's conjugate.
  var Z0 = 50;
  var Qm = Math.sqrt(Math.max(0, Z0 / R - 1));   // Q of the L-section needed for this R
  var Bshunt = Qm / Z0;                           // shunt susceptance magnitude (Load Cap, at source side)
  var XseriesTotal = Qm * R;                      // total series reactance magnitude needed across the section
  var loadCapX = -1 / Bshunt;                      // Load Cap expressed as a reactance (negative => capacitive)
  var tuneTotalX = XseriesTotal - X;                // net series reactance still required, after accounting for load's own +X
  return { loadCapX: loadCapX, tuneTotalX: tuneTotalX, Rprime: R, Qm: Qm };
}

function navigateTo(id) {

  currentId = id;
  currentTab = 'diagram';
  renderDetail(id);

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  const pane = document.getElementById('tab-' + tab);
  if (pane) pane.classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b => {
    if (b.getAttribute('onclick') === `switchTab('${tab}')`) b.classList.add('active');
  });
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise();
  // 탭 전환 후 시뮬 재초기화
  if (tab === 'diagram') {
    if (currentId === 'd50') setTimeout(() => initD50Sim(), 80);
    if (currentId === 'd52') setTimeout(() => initD52Sim(), 80);
    if (currentId === 'd53') setTimeout(() => initD53Sim(), 80);
    if (currentId === 'd54') setTimeout(() => initD54Sim(), 80);
    if (currentId === 'd55') setTimeout(() => initD55Sim(), 80);
  }
}

  const opts = el.parentElement.querySelectorAll('.quiz-opt');

    fb.textContent = correct ? s.classroom.feedback_ok : s.classroom.feedback_ng;
    fb.className   = 'quiz-feedback show ' + (correct ? 'ok' : 'ng');

  var img = document.getElementById('img-popup-img');
  var viewport = document.getElementById('img-popup-viewport');
  img.src = src;
  document.getElementById('img-popup-cap').textContent = cap;
  viewport.classList.remove('zoomed');
  viewport.scrollTop = 0;
  viewport.scrollLeft = 0;
  document.getElementById('img-popup').classList.add('open');
  document.addEventListener('keydown', handleImgPopupKey);
}
function closeImgPopup() {
  document.getElementById('img-popup').classList.remove('open');
  document.getElementById('img-popup-viewport').classList.remove('zoomed');
  document.removeEventListener('keydown', handleImgPopupKey);
}
function handleImgPopupKey(e) {
  if (e.key === 'Escape') closeImgPopup();
}
function toggleImgZoom(e) {
  var viewport = document.getElementById('img-popup-viewport');
  var isZoomed = viewport.classList.contains('zoomed');
  if (!isZoomed) {
    var img = document.getElementById('img-popup-img');
    var rect = img.getBoundingClientRect();
    var relX = (e.clientX - rect.left) / rect.width;
    var relY = (e.clientY - rect.top) / rect.height;
    viewport.classList.add('zoomed');
    requestAnimationFrame(function() {
      var img2 = document.getElementById('img-popup-img');
      var targetX = relX * img2.offsetWidth - viewport.clientWidth / 2;
      var targetY = relY * img2.offsetHeight - viewport.clientHeight / 2;
      viewport.scrollLeft = Math.max(0, targetX);
      viewport.scrollTop = Math.max(0, targetY);
    });
  } else {
    viewport.classList.remove('zoomed');
    viewport.scrollTop = 0;
    viewport.scrollLeft = 0;
  }
}

/* ── Responsive Canvas: resize handler ── */
function reinitCurrentSimulator() {
  if (currentId === 'd50') { initD50Sim(); }
  if (currentId === 'd52') { initD52Sim(); }
  if (currentId === 'd53') { initD53Sim(); }
  if (currentId === 'd54') { initD54Sim(); }
  if (currentId === 'd55') { initD55Sim(); }
}

var _resizeTimer = null;
window.addEventListener('resize', function() {
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(function() {
    reinitCurrentSimulator();
  }, 120);
});

window.addEventListener('DOMContentLoaded', () => {
  renderSidebar();
  renderDetail(currentId);
});
</script>
