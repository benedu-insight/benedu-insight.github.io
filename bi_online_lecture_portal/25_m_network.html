<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Module 05 — Matching Network | Benedu Insight RF Lecture Series</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/benedu-insight/benedu-insight.github.io/refs/heads/main/logo_png/benedu_insight_Symbol.png"/>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet"/>
<script>
window.MathJax = {
  tex: { inlineMath: [['$','$'],['\\(','\\)']], displayMath: [['$$','$$'],['\\[','\\]']] },
  startup: { typeset: false }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
<style>
/* ═══════════════════════════════════════════════
   BENEDU INSIGHT — MODULE 05 BASE STYLES
   Module 04 구조 계승, Module 05(Matching Network) 아이덴티티 추가
═══════════════════════════════════════════════ */
:root {
  --bg: #F7F8FA;
  --card: #F1EFEA;
  --card-hd: #E7E4DD;
  --purple: #7030A0;
  --green: #0F8C50;
  --plasma: #E87B1E;
  --blue: #1A6FB5;
  --red: #C0392B;
  --teal: #C8860D;
  --amber: #C8860D;
  --text: #1A1A2E;
  --text-sub: #5A5A7A;
  --border: #D8D5CE;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --radius: 12px;
  --font: 'Google Sans', 'Noto Sans KR', sans-serif;
  --mono: 'JetBrains Mono', monospace;
  --batang: 'Gowun Batang', serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; scroll-behavior: smooth; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  display: flex;
  min-height: 100vh;
}

/* ── SIDEBAR ── */
#sidebar {
  width: 260px;
  height: 100vh;
  background: #FFFFFF;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0;
  overflow-y: auto;
  z-index: 100;
}
.sb-brand {
  padding: 20px 18px 16px;
  border-bottom: 1px solid var(--border);
}
.sb-brand .module-tag {
  margin-top: 4px;
  font-size: 0.72rem;
  color: var(--text-sub);
}
.sb-era {
  padding: 10px 14px 6px;
  font-size: 0.65rem;
  font-weight: 700;
  color: var(--text-sub);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.sb-era-bar {
  height: 3px;
  border-radius: 2px;
  margin: 4px 14px 8px;
  background: var(--teal);
  opacity: 0.4;
}
.sb-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 9px 14px;
  cursor: pointer;
  border-radius: 8px;
  margin: 1px 8px;
  transition: background 0.15s;
  text-decoration: none;
}
.sb-item:hover { background: #E8F7F2; }
.sb-item.active { background: #D1F0E6; }
.sb-dot {
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.65rem;
  font-family: var(--mono);
  font-weight: 600;
  flex-shrink: 0;
  margin-top: 1px;
}
.sb-label { font-size: 0.78rem; line-height: 1.35; color: var(--text); }
.sb-sub { font-size: 0.68rem; color: var(--text-sub); margin-top: 2px; }
.sb-lang {
  margin-top: auto;
  padding: 14px 16px;
  border-top: 1px solid var(--border);
  display: flex; gap: 8px;
}
.lang-btn {
  flex: 1; padding: 7px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  background: transparent;
  font-family: var(--font);
  font-size: 0.78rem;
  cursor: pointer;
  transition: all 0.15s;
  color: var(--text-sub);
}
.lang-btn.active {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
  font-weight: 600;
}

/* ── TOP LOGO BAR ── */
#top-logo-bar {
  position: fixed;
  top: 0; left: 260px; right: 0;
  height: 44px;
  background: #fff;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: 0 28px;
  z-index: 150;
}
#top-logo-bar img {
  height: 22px;
  width: auto;
  object-fit: contain;
  opacity: 0.88;
}

/* ── MAIN CONTENT ── */
#main {
  margin-left: 260px;
  flex: 1;
  padding: 64px 36px 32px;
  max-width: calc(100vw - 260px);
}

/* ── SLIDE HEADER ── */
.slide-header { margin-bottom: 28px; }
.slide-eyebrow {
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--teal);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.slide-title {
  font-size: 1.9rem;
  font-weight: 700;
  color: var(--text);
  line-height: 1.2;
}
.slide-title span { color: var(--teal); }
.slide-subtitle {
  margin-top: 8px;
  font-size: 0.92rem;
  color: var(--text-sub);
  line-height: 1.5;
}

/* ── TAB SYSTEM ── */
.tab-row {
  display: flex;
  gap: 4px;
  margin-bottom: 24px;
  border-bottom: 2px solid var(--border);
  padding-bottom: 0;
}
.tab-btn {
  padding: 8px 18px 10px;
  font-family: var(--font);
  font-size: 0.82rem;
  font-weight: 500;
  border: none;
  background: transparent;
  color: var(--text-sub);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  transition: all 0.15s;
}
.tab-btn.active {
  color: var(--teal);
  border-bottom-color: var(--teal);
  font-weight: 700;
}
.tab-btn:hover:not(.active) { color: var(--text); }
.tab-pane { display: none; }
.tab-pane.active { display: block; }

/* ── DIAGRAM CARD ── */
.d-wrap {
  background: var(--card);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}
.d-header {
  background: var(--card-hd);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-radius: var(--radius) var(--radius) 0 0;
}
.d-badge {
  background: var(--teal);
  color: #fff;
  font-size: 0.65rem;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 20px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  font-family: var(--mono);
}
.d-badge.purple { background: var(--purple); }
.d-badge.green  { background: var(--green); }
.d-badge.plasma { background: var(--plasma); }
.d-badge.red    { background: var(--red); }
.d-title { font-size: 0.9rem; font-weight: 700; color: var(--text); }
.d-body { padding: 1.2rem; }

/* ── THEORY CARDS ── */
.theory-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
  margin-bottom: 20px;
}
.theory-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.05);
}
.theory-card h4 {
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--teal);
  margin-bottom: 7px;
  display: flex; align-items: center; gap: 6px;
}
.theory-card p { font-size: 0.82rem; color: var(--text-sub); line-height: 1.55; }

/* ── EQUATION BLOCK ── */
.eq-block {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 18px;
  margin: 10px 0;
  font-family: var(--mono);
  font-size: 0.9rem;
  text-align: center;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}
.eq-label {
  font-size: 0.7rem;
  color: var(--text-sub);
  text-align: right;
  margin-top: 4px;
  font-family: var(--font);
}

/* ── CALLOUT ── */
.callout {
  background: #F0FAFF;
  border: 1px solid #A8D8E8;
  border-radius: 10px;
  padding: 14px 16px;
  margin: 14px 0;
  font-size: 0.84rem;
  line-height: 1.6;
  color: var(--text);
}
.callout.green  { background: #F0FAF4; border-color: #A8D5B8; }
.callout.plasma { background: #FFF8F0; border-color: #F5C89A; }
.callout.purple { background: #F8F6FF; border-color: #C9B8E8; }
.callout.red    { background: #FDF0EE; border-color: #EAB0A8; }
.callout-title {
  font-weight: 700;
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 6px;
  color: var(--teal);
}
.callout.green  .callout-title { color: var(--green); }
.callout.plasma .callout-title { color: var(--plasma); }
.callout.purple .callout-title { color: var(--purple); }
.callout.red    .callout-title { color: var(--red); }

/* ── QUIZ ── */
.quiz-card {
  background: #fff;
  border: 1.5px solid #A8D8E8;
  border-radius: 10px;
  padding: 18px;
  margin-top: 10px;
}
.quiz-q {
  font-size: 0.88rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 14px;
  line-height: 1.5;
}
.quiz-opts { display: flex; flex-direction: column; gap: 8px; }
.quiz-opt {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 14px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.82rem;
  line-height: 1.4;
  transition: all 0.15s;
  background: var(--bg);
}
.quiz-opt:hover { border-color: var(--teal); background: #F0FAFF; }
.quiz-opt.correct { border-color: var(--green); background: #F0FAF4; color: var(--green); }
.quiz-opt.wrong   { border-color: var(--red); background: #FDF0EE; color: var(--red); }
.quiz-opt span.opt-key {
  font-family: var(--mono);
  font-weight: 700;
  font-size: 0.75rem;
  width: 20px; flex-shrink: 0;
}
.quiz-feedback {
  margin-top: 12px;
  font-size: 0.8rem;
  padding: 10px 12px;
  border-radius: 8px;
  display: none;
  line-height: 1.5;
}
.quiz-feedback.show { display: block; }
.quiz-feedback.ok { background: #F0FAF4; color: var(--green); }
.quiz-feedback.ng { background: #FDF0EE; color: var(--red); }

/* ── CONNECTIONS ── */
.connections { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.conn-chip {
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 0.75rem;
  font-family: var(--mono);
  font-weight: 600;
  border: 1.5px solid var(--border);
  cursor: pointer;
  transition: all 0.15s;
  background: #fff;
  color: var(--text-sub);
}
.conn-chip:hover { border-color: var(--teal); color: var(--teal); background: #F0FAFF; }

/* ── DEEP STUDY ── */
.deep-section h3 {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--teal);
  margin: 20px 0 10px;
  padding-bottom: 6px;
  border-bottom: 1.5px solid #A8D8E8;
}
.deep-section p  { font-size: 0.84rem; line-height: 1.7; color: var(--text); margin-bottom: 10px; }
.deep-section ul { padding-left: 18px; margin-bottom: 10px; }
.deep-section ul li { font-size: 0.83rem; line-height: 1.65; color: var(--text); margin-bottom: 4px; }

/* ── TABLE ── */
.data-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin: 10px 0; }
.data-table th {
  background: var(--card-hd);
  padding: 9px 12px;
  text-align: left;
  font-weight: 700;
  font-size: 0.75rem;
  color: var(--text-sub);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.data-table td { padding: 9px 12px; border-bottom: 1px solid var(--border); color: var(--text); line-height: 1.4; }
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { background: #F0FAFF; }

/* ── CANVAS SIMULATOR ── */
.sim-wrap { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin: 10px 0; }
.sim-canvas {
  width: 100%;
  max-width: 100%;
  height: auto;
  border-radius: 8px;
  background: #0D1117;
  display: block;
  image-rendering: -webkit-optimize-contrast;
  image-rendering: crisp-edges;
  box-sizing: border-box;
}
.sim-controls { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 14px; align-items: center; }
.sim-ctrl-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 140px; }
.sim-ctrl-label { font-size: 0.72rem; font-weight: 700; color: var(--text-sub); display: flex; justify-content: space-between; }
.sim-ctrl-val { font-family: var(--mono); font-size: 0.72rem; color: var(--teal); font-weight: 600; }
.sim-slider {
  -webkit-appearance: none; width: 100%; height: 4px; border-radius: 2px;
  background: var(--border); outline: none;
}
.sim-slider::-webkit-slider-thumb {
  -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
  background: var(--teal); cursor: pointer;
}
.sim-btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.sim-btn {
  padding: 7px 16px; border-radius: 8px;
  border: 1.5px solid var(--teal);
  background: transparent; color: var(--teal);
  font-family: var(--font); font-size: 0.78rem; font-weight: 600;
  cursor: pointer; transition: all 0.15s;
}
.sim-btn:hover, .sim-btn.active { background: var(--teal); color: #fff; }
.sim-btn.purple-btn { border-color: var(--purple); color: var(--purple); }
.sim-btn.purple-btn:hover, .sim-btn.purple-btn.active { background: var(--purple); color: #fff; }
.sim-info {
  margin-top: 10px; padding: 10px 14px;
  background: var(--bg); border-radius: 8px;
  font-size: 0.78rem; color: var(--text-sub); line-height: 1.5; min-height: 36px;
}

/* ── L-NETWORK SHARED SIMULATOR (Topic 2~5) — checkbox chips ── */
.lnet-chip-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 8px;
}
.lnet-main-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
  gap: 14px;
  align-items: stretch;
}
@media (max-width: 760px) {
  .lnet-main-grid { grid-template-columns: 1fr; }
}
.lnet-chip {
  display: flex; align-items: center; gap: 8px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 7px 10px;
  cursor: pointer;
  background: #fff;
  transition: all 0.15s;
  user-select: none;
}
.lnet-chip:hover { background: var(--bg); }
.lnet-chip.active { background: #FFF8EC; border-color: var(--teal); box-shadow: 0 0 0 1px var(--teal) inset; }
.lnet-chip-box {
  flex-shrink: 0;
  width: 18px; height: 18px;
  border: 1.6px solid var(--border-strong, #B8AC92);
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.7rem; font-weight: 900; color: #fff;
  background: #fff;
}
.lnet-chip.active .lnet-chip-box { background: var(--teal); border-color: var(--teal); }

/* ── REVEAL BLOCK (함께 생각해 보기) ── */
.reveal-wrap {
  background: #fff;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 16px;
  box-shadow: 0 1px 6px rgba(0,0,0,0.06);
}
.reveal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  cursor: pointer;
  user-select: none;
  transition: background 0.15s;
}
.reveal-header:hover { background: #F4F6FB; }
.reveal-q {
  font-size: 0.92rem;
  font-weight: 700;
  color: var(--text);
  line-height: 1.4;
  flex: 1;
}
.reveal-badge {
  flex-shrink: 0;
  background: var(--teal);
  color: #fff;
  font-size: 0.68rem;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 10px;
  font-family: var(--mono);
  letter-spacing: 0.04em;
  margin-right: 12px;
}
.reveal-chevron { flex-shrink: 0; font-size: 0.8rem; color: var(--text-sub); transition: transform 0.22s; }
.reveal-header.open .reveal-chevron { transform: rotate(180deg); }
.reveal-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.35s ease, opacity 0.25s ease;
  opacity: 0;
  border-top: 1px solid transparent;
}
.reveal-body.open {
  max-height: 2000px;
  opacity: 1;
  border-top-color: var(--border);
}
.reveal-inner { padding: 18px; }

/* ── Journey Key Block styles (Step 2) ── */
.jkey-block {
  display: block;
  margin-bottom: 0;
}
.jkey-spacer {
  display: block;
  height: 14px;
}
.jkey-h {
  display: block;
  font-size: 0.92rem;
  font-weight: 700;
  color: #E8EEF8;
  font-family: 'Google Sans', sans-serif;
  line-height: 1.7;
}
.jkey-tag {
  font-size: 0.78rem;
  font-weight: 600;
  color: #A0BBCC;
  font-family: 'Google Sans', sans-serif;
}
.jkey-f {
  display: block;
  font-size: 1.15rem;
  font-weight: 700;
  color: #E8EEF8;
  font-family: 'Google Sans', sans-serif;
  line-height: 1.8;
  padding-left: 18px;
}
.jkey-f sup {
  font-size: 0.72em;
  vertical-align: super;
}

#img-popup {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.85); z-index: 9999;
  align-items: center; justify-content: center;
  overflow: hidden;
}
#img-popup.open { display: flex; }
#img-popup-viewport {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  overflow: auto;
  cursor: zoom-in;
}
#img-popup-viewport.zoomed {
  cursor: grab;
  align-items: flex-start; justify-content: flex-start;
}
#img-popup-viewport.zoomed:active { cursor: grabbing; }
#img-popup img {
  max-width: 90vw; max-height: 85vh;
  border-radius: 10px; box-shadow: 0 8px 40px rgba(0,0,0,0.4);
  transition: max-width 0.2s ease, max-height 0.2s ease, width 0.2s ease;
  user-select: none;
}
#img-popup-viewport.zoomed img {
  max-width: none; max-height: none;
  width: 220%;
  border-radius: 6px;
  transition: none;
}
#img-popup-cap {
  position: fixed; bottom: 30px; left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.7); color: #fff;
  padding: 8px 18px; border-radius: 20px; font-size: 0.8rem;
  pointer-events: none;
  z-index: 2;
}
#img-popup-close {
  position: fixed; top: 20px; right: 28px;
  width: 40px; height: 40px; border-radius: 50%;
  background: rgba(255,255,255,0.12); color: #fff;
  border: 1.5px solid rgba(255,255,255,0.4);
  font-size: 1.3rem; line-height: 1; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  z-index: 2;
}
#img-popup-close:hover { background: rgba(255,255,255,0.25); }
#img-popup-hint {
  position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.6); color: #fff;
  padding: 6px 14px; border-radius: 16px; font-size: 0.74rem;
  pointer-events: none; z-index: 2;
}

/* ── PROGRESS BAR ── */
.progress-bar { position: fixed; top: 44px; left: 260px; right: 0; height: 3px; background: var(--border); z-index: 200; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--teal), var(--green)); transition: width 0.3s ease; }

/* ── RESPONSIVE ── */
@media (max-width: 768px) {
  #sidebar { display: none; }
  #main { margin-left: 0; padding: 64px 16px 20px; max-width: 100vw; }
  .progress-bar { left: 0; }
  #top-logo-bar { left: 0; }
}

/* ── 임피던스 페이저 다이어그램 ── */
.phasor-legend {
  display: flex; flex-wrap: wrap; gap: 10px;
  margin-top: 10px; align-items: center;
}
.phasor-dot {
  display: inline-block; width: 12px; height: 12px;
  border-radius: 50%; margin-right: 5px; vertical-align: middle;
}

/* ── Z 표기 큰 수식 ── */
.z-formula-block {
  display: flex; align-items: center; gap: 0;
  background: #fff; border: 2px solid #C9B8E8;
  border-radius: 14px; padding: 20px 28px;
  margin: 16px 0; flex-wrap: wrap; justify-content: center;
}
.z-formula-block .z-sym {

   HiDPI Canvas Utility
═══════════════════════════════════════════ */
function setupHiDPI(canvas) {
  const dpr  = window.devicePixelRatio || 1;
  const cssW = canvas.offsetWidth  || canvas.parentElement && canvas.parentElement.offsetWidth || 680;
  const attrH = parseInt(canvas.getAttribute('data-h') || canvas.height || 260);
  const attrW = parseInt(canvas.getAttribute('data-w') || canvas.width  || 680);
  const cssH  = Math.round(attrH * (cssW / attrW));
  canvas.width  = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  canvas.style.width  = '100%';
  canvas.style.height = cssH + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  return { ctx, W: cssW, H: cssH, dpr };
}

      { icon: '🎯', title: 'The Condition for Maximum Power Transfer, and Today\u2019s Goal', body: 'To deliver maximum power from Source to Load, the source impedance (Zs) and load impedance (Z_L) must be equal. The realistic load from Topic 1 is Z_L=2+j20Ω \u2014 so the problem we need to solve is: "how do we pull Zs=50Ω down until it eventually looks like the conjugate of Z_L, which is 2\u2212j20Ω?" The first move is to tackle the biggest gap first: the real part, from 50Ω down toward 2Ω.' },
      { icon: '🏭', title: 'Why Change the Source, Not the Load — The Reality of the Plasma Chamber', body: 'The load is the reactor of the semiconductor plasma equipment itself. Chamber structure, electrode geometry, gas chemistry, and pressure are determined by process requirements — they cannot be designed to present 50Ω for the sake of RF matching. The realistic choice, then, is to wrap the Generator\u2019s output in an adjustable matching network so it can follow whatever impedance the load happens to present.' },
      { icon: '🔀', title: 'Why Parallel, Not Series — The Only Way to Lower the Real Part', body: 'Adding an element in series with 50Ω never lowers the real part. Zs+jX is always 50+jX \u2014 the real part stays stuck at 50 no matter what reactance you add. Adding an element in parallel, however, can pull the real part well below 50: for example, Zs‖(j10Ω)\u22481.92+j9.62Ω, because the parallel-combination arithmetic (Z\u2081Z\u2082/(Z\u2081+Z\u2082)) is structurally capable of producing a value smaller than either impedance. To bring 50Ω down toward 2Ω, a parallel path is mandatory.' },
      { icon: '🤔', title: 'An Intuitive First Attempt — What If We Put a Resistor in That Parallel Spot?', body: 'So far so good \u2014 we know it has to be parallel. What if, in the simplest possible move, we just put a resistor Z_a there? Connecting Z_a=2.09Ω in parallel gives Zs‖Z_a = (50·2.09)/(50+2.09) \u2248 2.006Ω \u2014 by the real-part number alone, we appear to land almost exactly on the target (2Ω).' },
      { icon: '🚫', title: 'The Choice You Must Never Make — Two Flaws of the Resistor', body: 'And yet an RF power transmission engineer never uses this method, for two reasons. \u2460 A resistor, when current flows through it, always dissipates power as heat (P=I²R) \u2014 a significant fraction of the power the Source sent vanishes as heat before it ever reaches the load. \u2461 A resistor is purely real \u2014 it has no ability whatsoever to cancel the load\u2019s reactive part (+j20Ω). Matching only the real-part number is a half-measure: there was never any path from there to the load\u2019s true target value, 2\u2212j20Ω.' },
      { icon: '⚖️', title: 'The Key Judgment Criterion — "Matching" Is Not "Discarding"', body: 'There are infinitely many ways to make two impedances equal. Of all of them, the only ones an RF engineer can choose are those satisfying a single condition: shifting both the real AND reactive parts to the target values, without consuming energy. A resistor fails both halves of this condition and is immediately disqualified. On the next page, we put a reactive element \u2014 the capacitor \u2014 in that same parallel spot.' },

      { icon: '🤯', title: 'The Point Many Students Find Surprising — Why Does the Sum Become 50Ω?', body: 'You might expect that adding the impedance from the Source up to the Load Capacitor (2−j20Ω) and the load that follows it (2+j20Ω) in series should give (2−j20)+(2+j20) = 4Ω. Yet the impedance measured at any point along the line actually reads 50Ω. That is because these two are not in a "summing" relationship but a "facing each other with reflection cancelled" relationship — the reactances cancel each other out, leaving only pure resistance, and that resistance is designed to preserve exactly the transmission line\u2019s characteristic impedance Z₀=50Ω.' },
      { icon: '💡', title: 'The Intuition Behind Conjugate Matching — Two Waves Facing Each Other Like Mirror Images', body: 'If you cut the circuit at a particular point, looking left you see Z_S\u2019=2−j20Ω, and looking right you see Z_L=2+j20Ω. When these two are conjugates of each other (the same R, with X exactly opposite in sign), the phases of the incident and reflected waves align perfectly at that boundary, so no energy bounces back in either direction — this is why "impedances being conjugate," not "impedances being equal," is the true condition for matching. Because the overall circuit (Generator + matching network), viewed from the Source side, is designed so its output impedance is Z₀=50Ω (purely resistive), you read 50Ω no matter where on the line you measure.' },

function renderSidebar() {
  const sl = slides();
  const nl = document.getElementById('nav-list');
  nl.innerHTML = '';
  sl.forEach(s => {
    const div = document.createElement('div');
    div.className = 'sb-item' + (s.id === currentId ? ' active' : '');
    div.onclick = () => navigateTo(s.id);
    const color = ERA_COLORS[s.era] || '#C8860D';
    const alpha = s.placeholder ? '0.45' : '1';
    const sub = currentLang === 'ko' ? SB_SUBS_KO[s.id] : SB_SUBS_EN[s.id];
    div.style.opacity = alpha;
    div.innerHTML = `
      <div class="sb-dot" style="background:${color}20;color:${color}">${SB_ICONS[s.id]||'●'}</div>
      <div>
        <div class="sb-label">${s.title}</div>
        <div class="sb-sub">${sub||''}</div>
      </div>`;
    nl.appendChild(div);
  });
  updateProgress();
}

function updateProgress() {
  const sl = slides();
  const idx = sl.findIndex(s => s.id === currentId);
  const pct = sl.length > 1 ? (idx / (sl.length - 1)) * 100 : 0;
  document.getElementById('progressFill').style.width = pct + '%';
}

    <div style="background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:14px">
      <canvas id="d50-canvas" data-w="700" data-h="248" style="width:100%;height:248px;border-radius:6px;background:#FAFBFF"></canvas>
      <div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:0.7rem;color:var(--text-sub);font-family:'Google Sans',sans-serif">
        <span><span style="display:inline-block;width:16px;height:2px;background:#1A6FB5;margin-right:4px;vertical-align:2px"></span>${isEn?'Instantaneous V(z,t)':'순간 전압 파형 V(z,t)'}</span>
        <span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#C0392B;margin-right:4px;vertical-align:-1px"></span>${isEn?'Standing-wave envelope (VSWR shape)':'정재파 envelope (VSWR 포락선)'}</span>
      </div>
    </div>

    <div style="background:linear-gradient(135deg,#1A1A2E,#2A2210);border:2px solid #C8860D;border-radius:12px;padding:16px 18px;margin-bottom:14px" id="d50-readout">
    </div>

    <div class="reveal-wrap">
      <div class="reveal-header" onclick="toggleReveal('d50-reveal-gamma')">
        <span class="reveal-badge">${isEn?'DEEP DIVE':'심화학습'}</span>
        <span class="reveal-q">🤔 ${isEn ? 'Common Confusion: Does |Γ| Itself Equal the Reflected Power?' : '흔한 오해: |Γ| 자체가 반사되는 전력의 비율 아닌가요?'}</span>
        <span class="reveal-chevron">▼</span>
      </div>
      <div class="reveal-body" id="d50-reveal-gamma">
        <div class="reveal-inner">
          ${isEn ? `
          <p style="margin:0 0 10px;line-height:1.7;font-size:0.86rem;color:var(--text)">
            It's natural to read "Γ = reflection coefficient" and assume Γ itself is the fraction of power reflected.
            It isn't \u2014 <b>Γ is a voltage ratio</b>, and the fraction of <b>power</b> reflected is <b>|Γ|²</b>.
          </p>
          <div style="background:var(--bg);border-radius:8px;padding:12px 14px;margin-bottom:10px;font-family:'JetBrains Mono',monospace;font-size:0.82rem;line-height:1.9">
            Γ = V<sub>reflected</sub> / V<sub>incident</sub> &nbsp;\u2014&nbsp; a complex number (magnitude <i>and</i> phase)<br/>
            |Γ| = 0.933 &nbsp;\u2192&nbsp; this is how much the <b>voltage</b> amplitude comes back, not power<br/>
            P<sub>reflected</sub> / P<sub>incident</sub> = |Γ|² = 0.933² \u2248 <b>0.871 (87.1%)</b>
          </div>
          <p style="margin:0 0 10px;line-height:1.7;font-size:0.86rem;color:var(--text)">
            The reason is simple: power is proportional to the <b>square</b> of voltage (P = V²/Z₀), not to voltage
            itself. So whatever fraction comes back in voltage, the power that comes back is that fraction <i>squared</i>
            \u2014 and squaring a number less than 1 always makes it smaller. 93.3% voltage reflection becomes 87.1% power
            reflection, not a bigger number.
          </p>
          <p style="margin:0;line-height:1.7;font-size:0.86rem;color:var(--text)">
            Current behaves the same way, just with a sign flip: the current reflection coefficient is exactly
            \u2212Γ, so |I<sub>reflected</sub>/I<sub>incident</sub>| is the same 0.933 \u2014 current doesn't introduce a
            separate ratio. The squaring happens because <i>power itself</i> is defined as a product of voltage and
            current (or equivalently V² or I²), not because current "adds" anything extra.
          </p>
          ` : `
          <p style="margin:0 0 10px;line-height:1.7;font-size:0.86rem;color:var(--text)">
            "Γ = 반사계수"라는 이름 때문에 Γ 자체가 곧 반사되는 전력의 비율이라고 생각하기 쉽습니다.
            하지만 그렇지 않습니다 \u2014 <b>Γ는 전압의 비율</b>이고, <b>전력</b>의 반사 비율은 <b>|Γ|²</b>입니다.
          </p>
          <div style="background:var(--bg);border-radius:8px;padding:12px 14px;margin-bottom:10px;font-family:'JetBrains Mono',monospace;font-size:0.82rem;line-height:1.9">
            Γ = V<sub>반사파</sub> / V<sub>입사파</sub> &nbsp;\u2014&nbsp; 복소수 (크기와 위상을 모두 가짐)<br/>
            |Γ| = 0.933 &nbsp;\u2192&nbsp; 이건 <b>전압</b> 진폭이 얼마나 되돌아오는지를 뜻함, 전력이 아님<br/>
            P<sub>반사</sub> / P<sub>입사</sub> = |Γ|² = 0.933² \u2248 <b>0.871 (87.1%)</b>
          </div>
          <p style="margin:0 0 10px;line-height:1.7;font-size:0.86rem;color:var(--text)">
            이유는 단순합니다 \u2014 전력은 전압에 비례하는 게 아니라 전압의 <b>제곱</b>에 비례합니다(P = V²/Z₀).
            그래서 전압이 어떤 비율로 되돌아오든, 전력은 그 비율의 <i>제곱</i>만큼만 되돌아옵니다 \u2014 1보다 작은 수를
            제곱하면 항상 더 작아지므로, 전압 기준 93.3% 반사가 전력 기준으로는 87.1%로 줄어드는 것이지 더 커지는
            게 아닙니다.
          </p>
          <p style="margin:0;line-height:1.7;font-size:0.86rem;color:var(--text)">
            전류도 똑같은 원리로 움직이며, 부호만 반대입니다 \u2014 전류의 반사계수는 정확히 \u2212Γ이므로
            |I<sub>반사파</sub>/I<sub>입사파</sub>|도 똑같이 0.933입니다. 전류가 별도의 비율을 더 만들어내는 게 아닙니다.
            제곱이 등장하는 진짜 이유는 <i>전력 자체가</i> 전압과 전류의 곱(또는 동등하게 V²이나 I²)으로
            정의되어 있기 때문입니다.
          </p>
          `}
        </div>
      </div>
    </div>


    <div style="font-size:0.74rem;font-weight:700;color:var(--text-sub);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:10px;font-family:var(--mono)">
      💥 ${isEn?'Four Failure Cases — Same Reflection, Four Different Breakdowns':'네 가지 고장 케이스 — 같은 반사, 서로 다른 파손'}
    </div>

      ${isEn
        ? 'Foldback protection prevents catastrophic failure by cutting power \u2014 but the process itself loses power and cannot proceed normally. Eliminating the reflected wave at its source (Γ\u22480) through matching is the only solution that does not sacrifice process performance.'
        : '폴드백 보호 회로는 전력을 줄여 치명적 고장은 막지만, 그만큼 공정 자체의 파워가 깎여 정상 진행이 어려워집니다. 매칭을 통해 반사파 자체를 근원에서 없애는 것(Γ≈0)만이 공정 성능을 희생하지 않는 유일한 해법입니다.'}

}

/* ═══════════════════════════════════════════
   SIMULATOR — Topic 1 (d50): standing wave on the line
   13.56MHz, VF\u22480.66 => \u03bb \u2248 15m, line length = 30m (\u2248 2\u03bb, \u2248 4 half-wavelengths)
   z is measured from the LOAD (z=0 at load) toward the SOURCE (z=L at source).
═══════════════════════════════════════════ */
var D50_Z0 = 50;
var D50_F = 13.56e6;
var D50_VF = 0.66;
var D50_C = 3e8;
var D50_LAMBDA = (D50_C / D50_F) * D50_VF;      // \u2248 14.6 m
var D50_BETA = 2 * Math.PI / D50_LAMBDA;         // rad/m
var D50_LINE_LEN = 30;                            // m, Source-to-Load distance
var D50_LOADS = {
  mismatch: { R: 2,  X: 20 },
  matched:  { R: 50, X: 0  },
};
window._d50LoadKey = 'mismatch';
window._d50Playing = false;
window._d50PlayTimer = null;
window._d50Phase = 0;

function d50Gamma(R, X) {
  var Z0 = D50_Z0;
  var numRe = R - Z0, numIm = X, denRe = R + Z0, denIm = X;
  var denMag2 = denRe*denRe + denIm*denIm || 1e-9;
  return { re: (numRe*denRe + numIm*denIm)/denMag2, im: (numIm*denRe - numRe*denIm)/denMag2 };
}

// Instantaneous (normalized, Vplus=1) voltage at distance z from the LOAD, at phase wt (animation time)
// V(z,t) = Re[ (e^{j\u03b2z} + \u0393_L e^{-j\u03b2z}) e^{jwt} ]
function d50InstantV(z, R, X, wt) {
  var G = d50Gamma(R, X);
  var phPlus = D50_BETA * z;
  var phMinus = -D50_BETA * z;
  // forward wave phasor e^{j\u03b2z}, reflected wave phasor \u0393_L * e^{-j\u03b2z}
  var fRe = Math.cos(phPlus), fIm = Math.sin(phPlus);
  var rRe = G.re*Math.cos(phMinus) - G.im*Math.sin(phMinus);
  var rIm = G.re*Math.sin(phMinus) + G.im*Math.cos(phMinus);
  var totRe = fRe + rRe, totIm = fIm + rIm;
  // multiply by e^{jwt} and take real part: Re[(totRe+j*totIm)(cos(wt)+j sin(wt))]
  return totRe*Math.cos(wt) - totIm*Math.sin(wt);
}

// Envelope (VSWR shape) at distance z from the LOAD
function d50Envelope(z, R, X) {
  var G = d50Gamma(R, X);
  var mag = Math.sqrt(G.re*G.re + G.im*G.im);
  var ang = Math.atan2(G.im, G.re);
  return Math.sqrt(1 + mag*mag + 2*mag*Math.cos(2*D50_BETA*z - ang));
}

window.setD50Load = function(key) {
  window._d50LoadKey = key;
  document.querySelectorAll('[id^="d50-load-"]').forEach(function(b){ b.classList.remove('active'); });
  var btn = document.getElementById('d50-load-' + key);
  if (btn) btn.classList.add('active');
  renderD50();
};

window.toggleD50Play = function() {
  window._d50Playing = !window._d50Playing;
  var btn = document.getElementById('d50-play');
  var isEn = currentLang === 'en';
  if (window._d50Playing) {
    if (btn) { btn.classList.add('active'); btn.innerHTML = '⏸ ' + (isEn?'Pause':'정지'); }
    window._d50PlayTimer = setInterval(function() {
      window._d50Phase += 0.18;
      drawD50Canvas();
    }, 40);
  } else {
    if (btn) { btn.classList.remove('active'); btn.innerHTML = '▶ ' + (isEn?'Animate':'애니메이션'); }
    if (window._d50PlayTimer) { clearInterval(window._d50PlayTimer); window._d50PlayTimer = null; }
  }
};

function renderD50() {
  drawD50Canvas();
  updateD50Readout();
}

function drawD50Canvas() {
  var canvas = document.getElementById('d50-canvas');
  if (!canvas) return;
  var hi = setupHiDPI(canvas);
  var ctx = hi.ctx, W = hi.W, H = hi.H;
  var isEn = currentLang === 'en';
  var MONO = "'JetBrains Mono',monospace";

  var L = D50_LOADS[window._d50LoadKey];
  var isMatched = (window._d50LoadKey === 'matched');

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#FAFBFF'; ctx.fillRect(0,0,W,H);

  // layout: Source at left (z=L, i.e. 30m from load), Load at right (z=0)
  var padL = 92, padR = 92;
  var lineY = H*0.65;
  var x0 = padL, x1 = W - padR; // x0 = Source side, x1 = Load side
  // envelope max is V+(1+|Gamma|); for the worst case in this module (|Gamma|~0.93) that's ~1.93x.
  // ampPx must be small enough that the envelope clears BOTH the load's circuit-symbol stack above
  // the line (resistor+inductor+ground, ~124px tall) and the label/footer space below the line.
  var maxEnv = 1.9333;
  var loadStackHeight = 120;
  var topMargin = 8, bottomMargin = 40;
  var ampFromAbove = (lineY - loadStackHeight - topMargin) / maxEnv;
  var ampFromBelow = (H - lineY - bottomMargin) / maxEnv;
  var ampPx = Math.max(14, Math.min(ampFromAbove, ampFromBelow));

  function zOfX(x) {
    // z measured from the load: at x1 (load) z=0, at x0 (source) z=D50_LINE_LEN
    var t = (x1 - x) / (x1 - x0); // 0 at load, 1 at source
    return t * D50_LINE_LEN;
  }

  // baseline (the coax line itself) -- starts at the right edge of the Source symbol so the
  // line doesn't cut across the source circle; the source's own lead-out covers the gap.
  var srcR = 16; // radius of the Source circle symbol, reused below when drawing it
  ctx.strokeStyle = '#3C3530'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x0+srcR,lineY); ctx.lineTo(x1,lineY); ctx.stroke();

  // envelope (upper & lower) as a filled red dotted curve, and instantaneous wave as blue line
  var N = 240;
  ctx.beginPath();
  for (var i=0;i<=N;i++) {
    var x = x0 + (x1-x0)*i/N;
    var z = zOfX(x);
    var env = d50Envelope(z, L.R, L.X);
    var y = lineY - env*ampPx;
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  for (var i=N;i>=0;i--) {
    var x = x0 + (x1-x0)*i/N;
    var z = zOfX(x);
    var env = d50Envelope(z, L.R, L.X);
    var y = lineY + env*ampPx;
    ctx.lineTo(x,y);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(192,57,43,0.07)';
  ctx.fill();

  // envelope curves (dotted, red) -- this is the SWR envelope, the "boundary" the wave oscillates within
  ctx.strokeStyle = '#C0392B'; ctx.lineWidth = 1.6; ctx.setLineDash([4,3]);
  ctx.beginPath();
  for (var i=0;i<=N;i++) {
    var x = x0 + (x1-x0)*i/N;
    var z = zOfX(x);
    var env = d50Envelope(z, L.R, L.X);
    var y = lineY - env*ampPx;
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke();
  ctx.beginPath();
  for (var i=0;i<=N;i++) {
    var x = x0 + (x1-x0)*i/N;
    var z = zOfX(x);
    var env = d50Envelope(z, L.R, L.X);
    var y = lineY + env*ampPx;
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke();
  ctx.setLineDash([]);

  // instantaneous wave (solid, blue)
  ctx.strokeStyle = '#1A6FB5'; ctx.lineWidth = 2.2;
  ctx.beginPath();
  for (var i=0;i<=N;i++) {
    var x = x0 + (x1-x0)*i/N;
    var z = zOfX(x);
    var v = d50InstantV(z, L.R, L.X, window._d50Phase);
    var y = lineY - v*ampPx;
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke();

  // markers: half-wavelength spacing along the line
  var halfLambdaPx = (x1-x0) * (D50_LAMBDA/2) / D50_LINE_LEN;
  var nTicks = Math.floor(D50_LINE_LEN / (D50_LAMBDA/2));
  for (var k=0; k<=nTicks; k++) {
    var xz = x1 - k*halfLambdaPx;
    if (xz < x0-1) break;
    ctx.strokeStyle = '#D8D5CE'; ctx.lineWidth = 1; ctx.setLineDash([2,2]);
    ctx.beginPath(); ctx.moveTo(xz, lineY-ampPx*2.05); ctx.lineTo(xz, lineY+ampPx*2.05); ctx.stroke();
    ctx.setLineDash([]);
  }

  // ── Source symbol: AC voltage source (circle with sine squiggle) + Zs label ──
  var srcCx = x0, srcCy = lineY;
  ctx.strokeStyle = '#3C3530'; ctx.lineWidth = 1.6; ctx.fillStyle = '#FAFBFF';
  ctx.beginPath(); ctx.arc(srcCx, srcCy, srcR, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  // sine squiggle inside the circle
  ctx.beginPath();
  for (var i=0;i<=20;i++) {
    var t = i/20;
    var sx = srcCx - srcR*0.62 + t*srcR*1.24;
    var sy = srcCy - Math.sin(t*Math.PI*2)*srcR*0.42;
    if (i===0) ctx.moveTo(sx,sy); else ctx.lineTo(sx,sy);
  }
  ctx.stroke();
  // (no separate lead-out needed -- the baseline itself now starts exactly at the circle's right edge)
  // ground symbol below source
  ctx.beginPath(); ctx.moveTo(srcCx, srcCy+srcR); ctx.lineTo(srcCx, srcCy+srcR+12); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(srcCx-9, srcCy+srcR+12); ctx.lineTo(srcCx+9, srcCy+srcR+12); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(srcCx-6, srcCy+srcR+16); ctx.lineTo(srcCx+6, srcCy+srcR+16); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(srcCx-3, srcCy+srcR+20); ctx.lineTo(srcCx+3, srcCy+srcR+20); ctx.stroke();

  // Source label (characteristic impedance, explicit) -- placed above the envelope's peak, never overlapping it
  var envelopeTopY = lineY - maxEnv*ampPx;
  var srcLabelY2 = Math.min(srcCy - srcR - 14, envelopeTopY - 16);
  var srcLabelY1 = srcLabelY2 - 12;
  ctx.fillStyle = '#3C3530'; ctx.font = 'bold 12px ' + MONO; ctx.textAlign = 'center';
  ctx.fillText('Zs = 50 Ω', srcCx, srcLabelY1);
  ctx.font = '9px ' + MONO; ctx.fillStyle = '#9A8A68';
  ctx.fillText(isEn?'(source)':'(소스)', srcCx, srcLabelY2);

  // ── Load symbol: resistor (zig-zag) + reactive element (L or C) in series, or pure R when matched ──
  var loadX0 = x1, loadCy = lineY;
  var legUp = 22; // how far above the line the load symbol stack starts
  ctx.strokeStyle = (isMatched ? '#0F8C50' : '#C0392B');
  ctx.lineWidth = 1.6;
  // lead from line up to the component stack
  ctx.beginPath(); ctx.moveTo(loadX0, loadCy); ctx.lineTo(loadX0, loadCy - legUp); ctx.stroke();

  // resistor zig-zag (vertical), representing the real part R
  var rTopY = loadCy - legUp, rBotY = rTopY - 24;
  ctx.beginPath();
  var zigN = 6, zigW = 7;
  ctx.moveTo(loadX0, rTopY);
  for (var i=0;i<zigN;i++) {
    var yy = rTopY - (i+1)*(rTopY-rBotY)/zigN;
    var xx = loadX0 + (i%2===0 ? zigW : -zigW);
    ctx.lineTo(xx, yy);
  }
  ctx.lineTo(loadX0, rBotY);
  ctx.stroke();

  var topmostY; // tracks the highest point drawn, so the label never collides with the symbol
  if (isMatched) {
    // pure resistor straight up to a ground/termination symbol -- no reactive element
    var g1 = rBotY - 10, g2 = rBotY - 14, g3 = rBotY - 18;
    ctx.beginPath(); ctx.moveTo(loadX0, rBotY); ctx.lineTo(loadX0, g1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(loadX0-9, g1); ctx.lineTo(loadX0+9, g1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(loadX0-6, g2); ctx.lineTo(loadX0+6, g2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(loadX0-3, g3); ctx.lineTo(loadX0+3, g3); ctx.stroke();
    topmostY = g3;
  } else {
    // series inductor (coil loops) above the resistor, representing +jX
    var lBotY = rBotY, lTopY = rBotY - 20;
    ctx.beginPath();
    var loops = 4;
    for (var i=0;i<loops;i++) {
      var yA = lBotY - i*((lBotY-lTopY)/loops);
      var yB = lBotY - (i+1)*((lBotY-lTopY)/loops);
      ctx.moveTo(loadX0, yA);
      ctx.arc(loadX0, (yA+yB)/2, Math.abs(yA-yB)/2, Math.PI*0.5, Math.PI*1.5, true);
    }
    ctx.stroke();
    var leadTopY = lTopY - 10;
    ctx.beginPath(); ctx.moveTo(loadX0, lTopY); ctx.lineTo(loadX0, leadTopY); ctx.stroke();
    // ground at the very top
    var g1b = leadTopY - 4, g2b = leadTopY - 8, g3b = leadTopY - 12;
    ctx.beginPath(); ctx.moveTo(loadX0-9, g1b); ctx.lineTo(loadX0+9, g1b); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(loadX0-6, g2b); ctx.lineTo(loadX0+6, g2b); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(loadX0-3, g3b); ctx.lineTo(loadX0+3, g3b); ctx.stroke();
    topmostY = g3b;
  }

  // Load label -- always placed a fixed clearance above whatever was actually drawn (topmostY)
  var labelClearance = 14;
  ctx.textAlign = 'center';
  ctx.fillStyle = isMatched ? '#0F8C50' : '#C0392B';
  var loadLabel = isMatched ? 'Z_L = 50 Ω' : 'Z_L = 2 + j20 Ω';
  ctx.font = 'bold 12px ' + MONO;
  ctx.fillText(loadLabel, loadX0, topmostY - labelClearance - 12);
  ctx.font = '9px ' + MONO; ctx.fillStyle = '#9A8A68';
  ctx.fillText(isEn ? (isMatched?'(R only)':'(R + L, series)') : (isMatched?'(R만)':'(R + L 직렬)'),
               loadX0, topmostY - labelClearance);

  // distance label
  ctx.fillStyle = '#9A8A68'; ctx.font = '10px ' + MONO; ctx.textAlign = 'center';
  ctx.fillText('30 m  (\u2248 2\u03bb @ 13.56MHz, VF\u22480.66, \u03bb\u224815m)', (x0+x1)/2, H-10);

  // VSWR readout on canvas -- placed just below the envelope's lowest point, well clear of the distance label
  var G = d50Gamma(L.R, L.X);
  var Gmag = Math.sqrt(G.re*G.re+G.im*G.im);
  var vswr = (1+Gmag)/Math.max(1e-6,1-Gmag);
  ctx.fillStyle = '#3C3530'; ctx.font = 'bold 11px ' + MONO; ctx.textAlign='left';
  ctx.fillText('VSWR \u2248 ' + (vswr>100? '\u221e' : vswr.toFixed(2)) + ' : 1', x0-20, lineY + maxEnv*ampPx + 16);
}

function updateD50Readout() {
  var ro = document.getElementById('d50-readout');
  if (!ro) return;
  var isEn = currentLang === 'en';
  var L = D50_LOADS[window._d50LoadKey];
  var G = d50Gamma(L.R, L.X);
  var Gmag = Math.sqrt(G.re*G.re + G.im*G.im);
  var Gang = Math.atan2(G.im, G.re) * 180/Math.PI;
  var vswr = (1+Gmag)/Math.max(1e-6,1-Gmag);
  var pctReflected = Gmag*Gmag*100;
  var matched = window._d50LoadKey === 'matched';

  var loadStr = matched ? '50 + j0' : '2 + j20';

  ro.innerHTML =
    '<div style="font-size:0.78rem;font-weight:700;color:#FFD580;margin-bottom:10px;font-family:\'Google Sans\',sans-serif">'+
      '🔢 ' + (isEn?'The Numbers':'계산 결과') +
    '</div>'+
    '<div style="font-family:\'JetBrains Mono\',monospace;font-size:0.84rem;color:#E8DCC0;line-height:2.1;display:flex;gap:28px;flex-wrap:wrap">'+
      '<div>Z_L = '+loadStr+' Ω</div>'+
      '<div>Γ = '+G.re.toFixed(3)+(G.im>=0?' + j':' \u2212 j')+Math.abs(G.im).toFixed(3)+
        '  (|Γ|='+Gmag.toFixed(3)+', ∠'+Gang.toFixed(1)+'°)</div>'+
      '<div>|Γ|² ≈ <span style="color:#FF8A7A;font-weight:700">'+pctReflected.toFixed(1)+'%</span> '+(isEn?'reflected':'반사됨')+'</div>'+
      '<div>VSWR = <span style="color:'+(matched?'#7FD8A0':'#FF8A7A')+';font-weight:700">'+(vswr>100?'\u221e':vswr.toFixed(2))+' : 1</span></div>'+
    '</div>'+
    '<div style="font-size:0.78rem;color:#E8DCC0;line-height:1.6;margin-top:10px;border-top:1px solid rgba(255,255,255,0.15);padding-top:10px">'+
      (matched
        ? (isEn ? 'With Z_L=50Ω the envelope flattens into a straight line \u2014 the voltage amplitude is the same everywhere on the line, exactly V\u207a, because there is no reflected wave at all.'
                : 'Z_L=50Ω일 때 envelope가 완전한 수평선이 됩니다 — 반사파가 전혀 없으므로 선로 위 어디서나 전압 진폭이 똑같이 V⁺입니다.')
        : (isEn ? 'With Z_L=2+j20Ω, the envelope swings between V\u207a(1+|\u0393|)\u22481.93 and V\u207a(1\u2212|\u0393|)\u22480.07 \u2014 nearly double the source voltage at the antinode.'
                : 'Z_L=2+j20Ω일 때 envelope는 V⁺(1+|Γ|)≈1.93과 V⁺(1−|Γ|)≈0.07 사이를 오갑니다 — antinode에서는 거의 보내는 전압의 2배에 달합니다.'))+
    '</div>';
}

function initD50Sim() {
  renderD50();
}

/* ═══════════════════════════════════════════
   SHARED SIMULATOR — Topic 2~5 (d51~d54): L-network builder
   One circuit (Source 50Ω — node — Load 2+j20Ω), seven checkable
   components. ALL checked "parallel" components combine with the
   source at the same node (admittance sum). ALL checked "series"
   components stack afterward in a fixed order, between that node
   and the load.
═══════════════════════════════════════════ */
var LNET_Z0 = 50;
var LNET_ZL = { re: 2, im: 20 };

var LNET_CHOICES = {
  R_series:        { re: 2.09,  im: 0,      mode: 'series',   sym: 'R',  label_en: 'Resistor 2.09Ω — series',         label_ko: '저항 2.09Ω — 직렬' },
  R_parallel:       { re: 2.09,  im: 0,      mode: 'parallel', sym: 'R',  label_en: 'Resistor 2.09Ω — parallel',       label_ko: '저항 2.09Ω — 병렬' },
  C_load_series:    { re: 0,     im: -10.207, mode: 'series',   sym: 'C',  label_en: 'Cap −j10.2Ω — series',            label_ko: 'Cap −j10.2Ω — 직렬' },
  C_load_parallel:  { re: 0,     im: -10.207, mode: 'parallel', sym: 'C',  label_en: 'Load Cap −j10.2Ω — parallel',     label_ko: 'Load Cap −j10.2Ω — 병렬' },
  L_tune_series:    { re: 0,     im: 9.798,   mode: 'series',   sym: 'L',  label_en: 'Tune Coil +j9.798Ω — series',     label_ko: 'Tune Coil +j9.798Ω — 직렬' },
  L_tune_parallel:  { re: 0,     im: 9.798,   mode: 'parallel', sym: 'L',  label_en: 'Coil +j9.798Ω — parallel',        label_ko: '코일 +j9.798Ω — 병렬' },
  C_tune_series:    { re: 0,     im: -20,     mode: 'series',   sym: 'C',  label_en: 'Tune Cap −j20Ω — series',         label_ko: 'Tune Cap −j20Ω — 직렬' },
};
// fixed stacking order for series elements (downstream of the parallel node, toward the load)
var LNET_SERIES_ORDER = ['R_series', 'C_load_series', 'L_tune_series', 'C_tune_series'];

window._lnetSelected = {}; // populated per-slide via initLNetSim(slideId, defaultKeys)

function lnetCcompute(selectedKeysSet) {
  // Step 1: combine source (Z0) with all checked PARALLEL elements via admittance sum
  var Yre = 1/LNET_Z0, Yim = 0;
  for (var key in LNET_CHOICES) {
    if (!selectedKeysSet[key]) continue;
    var c = LNET_CHOICES[key];
    if (c.mode !== 'parallel') continue;
    var zre = c.re, zim = c.im;
    var mag2 = zre*zre + zim*zim || 1e-12;
    Yre += zre/mag2;
    Yim += -zim/mag2;
  }
  var Ymag2 = Yre*Yre + Yim*Yim || 1e-12;
  var Zre = Yre/Ymag2, Zim = -Yim/Ymag2;

  // Step 2: add all checked SERIES elements, in the fixed defined order
  LNET_SERIES_ORDER.forEach(function(key) {
    if (!selectedKeysSet[key]) return;
    var c = LNET_CHOICES[key];
    Zre += c.re;
    Zim += c.im;
  });

  return { re: Zre, im: Zim };
}

// What does the SOURCE's two terminals actually see, looking outward into (matching network + load)?
// This is the physically meaningful impedance for reflection: series elements sit between the
// parallel node and the load, so they combine with Z_L first; parallel elements then combine with
// that whole branch (NOT with Z0 -- Z0 is the source itself, not part of what it "sees").
function lnetZSeenFromSource(selectedKeysSet) {
  var Zre = LNET_ZL.re, Zim = LNET_ZL.im;
  LNET_SERIES_ORDER.forEach(function(key) {
    if (!selectedKeysSet[key]) return;
    var c = LNET_CHOICES[key];
    Zre += c.re;
    Zim += c.im;
  });

  var anyParallel = false;
  var Yre = 0, Yim = 0;
  var mag2branch = Zre*Zre + Zim*Zim || 1e-12;
  Yre += Zre/mag2branch; Yim += -Zim/mag2branch;
  for (var key in LNET_CHOICES) {
    if (!selectedKeysSet[key]) continue;
    var c = LNET_CHOICES[key];
    if (c.mode !== 'parallel') continue;
    anyParallel = true;
    var zre = c.re, zim = c.im;
    var mag2 = zre*zre + zim*zim || 1e-12;
    Yre += zre/mag2;
    Yim += -zim/mag2;
  }
  var Ymag2 = Yre*Yre + Yim*Yim || 1e-12;
  return { re: Yre/Ymag2, im: -Yim/Ymag2 };
}

function lnetGamma(Zre, Zim) {
  var Z0 = LNET_Z0;
  var numRe = Zre-Z0, numIm = Zim, denRe = Zre+Z0, denIm = Zim;
  var denMag2 = denRe*denRe+denIm*denIm || 1e-12;
  return { re: (numRe*denRe+numIm*denIm)/denMag2, im: (numIm*denRe-numRe*denIm)/denMag2 };
}

function lnetDrawCircuit(canvasId, selectedKeysSet) {
  var canvas = document.getElementById(canvasId);
  if (!canvas) return;
  var hi = setupHiDPI(canvas);
  var ctx = hi.ctx, W = hi.W, H = hi.H;
  var isEn = currentLang === 'en';
  var MONO = "'JetBrains Mono',monospace";

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#FAFBFF'; ctx.fillRect(0,0,W,H);

  var midY = H*0.46;
  var srcX = Math.max(40, W*0.09), nodeX = Math.max(srcX+70, W*0.30), loadX = W - Math.max(55, W*0.13);

  // collect active parallel and series choices, in canonical order
  var parallelKeys = Object.keys(LNET_CHOICES).filter(function(k){ return LNET_CHOICES[k].mode==='parallel' && selectedKeysSet[k]; });
  var seriesKeys = LNET_SERIES_ORDER.filter(function(k){ return selectedKeysSet[k]; });

  // ── Zin (what the Source sees, looking right) and Zm (what the Load sees, looking back left toward the Source) ──
  var ZinVal = lnetZSeenFromSource(selectedKeysSet);
  var ZmVal = lnetCcompute(selectedKeysSet);
  function fmtZ(z) { return z.re.toFixed(2) + (z.im>=0?'+j':'\u2212j') + Math.abs(z.im).toFixed(2); }

  // ── Source symbol ──
  var srcR = 15;
  ctx.strokeStyle = '#3C3530'; ctx.lineWidth = 1.6; ctx.fillStyle = '#FAFBFF';
  ctx.beginPath(); ctx.arc(srcX, midY, srcR, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.beginPath();
  for (var i=0;i<=20;i++) {
    var t = i/20;
    var sx = srcX - srcR*0.62 + t*srcR*1.24;
    var sy = midY - Math.sin(t*Math.PI*2)*srcR*0.4;
    if (i===0) ctx.moveTo(sx,sy); else ctx.lineTo(sx,sy);
  }
  ctx.stroke();
  ctx.font = 'bold 13px ' + MONO; ctx.fillStyle = '#3C3530'; ctx.textAlign = 'center';
  ctx.fillText('Zs=50Ω', srcX, midY - srcR - 10);

  // wire from source to node
  ctx.strokeStyle = '#3C3530'; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.moveTo(srcX+srcR, midY); ctx.lineTo(nodeX, midY); ctx.stroke();
  ctx.beginPath(); ctx.arc(nodeX, midY, 3, 0, Math.PI*2); ctx.fillStyle='#3C3530'; ctx.fill();

  // Zin label: text only, showing what the Source sees
  (function drawZinTag(){
    var midX = (srcX+srcR + nodeX) / 2;
    var tagY = midY - srcR - 36;
    ctx.font = 'bold 11.5px ' + MONO; ctx.fillStyle = '#0F8C50'; ctx.textAlign = 'center';
    ctx.fillText('Zin = ' + fmtZ(ZinVal) + 'Ω', midX, tagY);
  })();

  // ── Parallel branches hanging below the node (stacked if multiple) ──
  var branchGap = 34;
  parallelKeys.forEach(function(key, idx) {
    var c = LNET_CHOICES[key];
    var by0 = midY + 14 + idx*0; // all branches start at the same drop point, fan out by x offset if >1
    var bx = nodeX + (idx - (parallelKeys.length-1)/2) * 26;
    var topY = midY + 10, botY = midY + 60;
    ctx.strokeStyle = c.sym==='R' ? '#C0392B' : (c.im<0 ? '#C8860D' : '#1A6FB5');
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(nodeX, midY); ctx.lineTo(bx, topY); ctx.stroke();
    lnetDrawComponentSymbol(ctx, c.sym, bx, (topY+botY)/2, topY, botY, 'vertical');
    // ground-ish bottom
    ctx.beginPath(); ctx.moveTo(bx, botY); ctx.lineTo(bx, botY+10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx-8,botY+10); ctx.lineTo(bx+8,botY+10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx-5,botY+14); ctx.lineTo(bx+5,botY+14); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx-2,botY+18); ctx.lineTo(bx+2,botY+18); ctx.stroke();
    // label
    ctx.font = 'bold 10.5px ' + MONO; ctx.textAlign='center';
    ctx.fillStyle = ctx.strokeStyle;
    var labelTxt = c.sym + (c.im!==0 ? ((c.im>0?'+j':'\u2212j')+Math.abs(c.im).toFixed(1)) : c.re.toFixed(2));
    ctx.fillText(labelTxt, bx, botY+32);
  });

  // wire continues from node toward load, through series chain
  var afterNodeX = nodeX;
  ctx.strokeStyle = '#3C3530'; ctx.lineWidth = 1.8;

  var chainX = nodeX;
  var seriesSpacing = Math.max(46, (loadX - nodeX - 40) / Math.max(1, seriesKeys.length));
  var SERIES_BODY_LEN = 50; // fixed component-body length, matching the parallel branch's body length
  seriesKeys.forEach(function(key, idx) {
    var c = LNET_CHOICES[key];
    var segStart = chainX;
    var segEnd = chainX + seriesSpacing;
    var segMid = (segStart + segEnd) / 2;
    var bodyStart = segMid - SERIES_BODY_LEN/2;
    var bodyEnd = segMid + SERIES_BODY_LEN/2;
    var color = c.sym==='R' ? '#C0392B' : (c.im<0 ? '#C8860D' : '#1A6FB5');
    ctx.strokeStyle = '#3C3530';
    ctx.beginPath(); ctx.moveTo(segStart, midY); ctx.lineTo(bodyStart, midY); ctx.stroke();
    ctx.strokeStyle = color;
    lnetDrawComponentSymbol(ctx, c.sym, segMid, midY, bodyStart, bodyEnd, 'horizontal');
    ctx.strokeStyle = '#3C3530';
    ctx.beginPath(); ctx.moveTo(bodyEnd, midY); ctx.lineTo(segEnd, midY); ctx.stroke();
    ctx.font = 'bold 10.5px ' + MONO; ctx.textAlign='center'; ctx.fillStyle = color;
    var labelTxt = c.sym + (c.im!==0 ? ((c.im>0?'+j':'\u2212j')+Math.abs(c.im).toFixed(1)) : c.re.toFixed(2));
    var labelOffsetY = c.sym === 'L' ? -36 : -20; // inductor loops arc higher, so its label needs more clearance
    ctx.fillText(labelTxt, segMid, midY+labelOffsetY);
    chainX = segEnd;
  });

  // Zm label: text only, above the series chain (higher than component labels so it never collides)
  (function drawZmTag(){
    var tagY = midY - srcR - 36; // same height as the Zin label, for visual symmetry
    ctx.font = 'bold 11.5px ' + MONO; ctx.fillStyle = '#C8860D'; ctx.textAlign = 'center';
    ctx.fillText('Zm = ' + fmtZ(ZmVal) + 'Ω', (nodeX+loadX)/2, tagY);
  })();

  // final wire segment to load
  ctx.strokeStyle = '#3C3530'; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.moveTo(chainX, midY); ctx.lineTo(loadX, midY); ctx.stroke();

  // ── Load symbol: R + L series (Z_L = 2+j20) ──
  var legUp = 20;
  ctx.strokeStyle = '#7030A0'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(loadX, midY); ctx.lineTo(loadX, midY-legUp); ctx.stroke();
  var rTopY = midY-legUp, rBotY = rTopY-22;
  lnetDrawComponentSymbol(ctx, 'R', loadX, (rTopY+rBotY)/2, rBotY, rTopY, 'vertical');
  var lTopY = rBotY-20;
  lnetDrawComponentSymbol(ctx, 'L', loadX, (rBotY+lTopY)/2, lTopY, rBotY, 'vertical');
  ctx.beginPath(); ctx.moveTo(loadX, lTopY); ctx.lineTo(loadX, lTopY-10); ctx.stroke();
  var g1=lTopY-10-4, g2=lTopY-10-8, g3=lTopY-10-12;
  ctx.beginPath(); ctx.moveTo(loadX-8,g1); ctx.lineTo(loadX+8,g1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(loadX-5,g2); ctx.lineTo(loadX+5,g2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(loadX-2,g3); ctx.lineTo(loadX+2,g3); ctx.stroke();
  ctx.font = 'bold 13px ' + MONO; ctx.fillStyle = '#7030A0'; ctx.textAlign = 'center';
  ctx.fillText('Z_L=2+j20Ω', loadX, g3-10);
}

function lnetDrawComponentSymbol(ctx, sym, cx, cy, start, end, orient) {
  // start/end are along the axis given by orient ('vertical': y-range, 'horizontal': x-range)
  ctx.lineWidth = 1.6;
  if (sym === 'R') {
    // zig-zag resistor
    var n = 6;
    ctx.beginPath();
    if (orient === 'vertical') {
      ctx.moveTo(cx, start);
      for (var i=0;i<n;i++) {
        var yy = start + (i+1)*(end-start)/n;
        var xx = cx + (i%2===0 ? 6 : -6);
        ctx.lineTo(xx, yy);
      }
      ctx.lineTo(cx, end);
    } else {
      ctx.moveTo(start, cy);
      for (var i=0;i<n;i++) {
        var xx = start + (i+1)*(end-start)/n;
        var yy = cy + (i%2===0 ? -6 : 6);
        ctx.lineTo(xx, yy);
      }
      ctx.lineTo(end, cy);
    }
    ctx.stroke();
  } else if (sym === 'C') {
    // two parallel plates
    if (orient === 'vertical') {
      var mid = (start+end)/2;
      ctx.beginPath(); ctx.moveTo(cx, start); ctx.lineTo(cx, mid-3); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx-9, mid-3); ctx.lineTo(cx+9, mid-3); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx-9, mid+3); ctx.lineTo(cx+9, mid+3); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx, mid+3); ctx.lineTo(cx, end); ctx.stroke();
    } else {
      var mid = (start+end)/2;
      ctx.beginPath(); ctx.moveTo(start, cy); ctx.lineTo(mid-3, cy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(mid-3, cy-9); ctx.lineTo(mid-3, cy+9); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(mid+3, cy-9); ctx.lineTo(mid+3, cy+9); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(mid+3, cy); ctx.lineTo(end, cy); ctx.stroke();
    }
  } else if (sym === 'L') {
    // coil loops
    var loops = 3;
    if (orient === 'vertical') {
      ctx.beginPath();
      for (var i=0;i<loops;i++) {
        var yA = start + i*(end-start)/loops;
        var yB = start + (i+1)*(end-start)/loops;
        ctx.moveTo(cx, yA);
        ctx.arc(cx, (yA+yB)/2, Math.abs(yB-yA)/2, -Math.PI*0.5, Math.PI*0.5, true);
      }
      ctx.stroke();
    } else {
      ctx.beginPath();
      for (var i=0;i<loops;i++) {
        var xA = start + i*(end-start)/loops;
        var xB = start + (i+1)*(end-start)/loops;
        ctx.moveTo(xA, cy);
        ctx.arc((xA+xB)/2, cy, Math.abs(xB-xA)/2, Math.PI, Math.PI*2, false);
      }
      ctx.stroke();
    }
  }
}

function lnetBuildHTML(isEn, canvasId, readoutId, checkboxPrefix) {
  var order = ['R_series','R_parallel','C_load_series','C_load_parallel','L_tune_series','L_tune_parallel','C_tune_series'];

    R_series: isEn?'① Resistor':'① 저항', R_parallel: isEn?'① Resistor':'① 저항',
    C_load_series: isEn?'② Load Cap':'② Load Cap', C_load_parallel: isEn?'② Load Cap':'② Load Cap',
    L_tune_series: isEn?'③ Tune Coil':'③ Tune Coil', L_tune_parallel: isEn?'③ Tune Coil':'③ Tune Coil',
    C_tune_series: isEn?'④ Tune Cap':'④ Tune Cap',
  };
  var checkboxesHtml = order.map(function(key) {
    var c = LNET_CHOICES[key];
    var label = isEn ? c.label_en : c.label_ko;
    var modeTag = c.mode === 'series' ? (isEn?'series':'직렬') : (isEn?'parallel':'병렬');
    var color = c.sym==='R' ? '#C0392B' : (c.im<0 ? '#C8860D' : '#1A6FB5');
    return '<label class="lnet-chip" data-key="'+key+'" onclick="event.preventDefault(); toggleLnetChoice(\''+checkboxPrefix+'\',\''+key+'\')" style="border-color:'+color+'33">'+
      '<span class="lnet-chip-box" id="'+checkboxPrefix+'-box-'+key+'"></span>'+
      '<span style="display:flex;flex-direction:column;line-height:1.3">'+
        '<span style="font-size:0.62rem;color:var(--text-sub);font-weight:700">'+groupLabel[key]+' \u00b7 '+modeTag+'</span>'+
        '<span style="font-size:0.74rem;font-weight:700;color:'+color+'">'+label+'</span>'+
      '</span>'+
    '</label>';
  }).join('');

  return `
    <div style="background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:14px">
      <div style="font-size:0.74rem;font-weight:700;color:var(--text-sub);text-transform:uppercase;
                  letter-spacing:0.06em;margin-bottom:10px;font-family:var(--mono)">
        ${isEn ? 'Check any components to add them to the circuit \u2014 mix and match freely' : '회로에 추가할 소자를 체크하세요 — 자유롭게 조합해볼 수 있습니다'}
      </div>
      <div class="lnet-chip-grid" id="${checkboxPrefix}-chips">${checkboxesHtml}</div>
    </div>

    <div class="lnet-main-grid">
      <div style="background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:14px 16px">
        <canvas id="${canvasId}" data-w="440" data-h="280" style="width:100%;height:280px;border-radius:6px;background:#FAFBFF"></canvas></canvas>
      </div>

      <div style="background:linear-gradient(135deg,#1A1A2E,#2A2210);border:2px solid #C8860D;border-radius:12px;padding:16px 18px" id="${readoutId}">
      </div>
    </div>
  `;
}

function lnetUpdateReadout(readoutId, selectedKeysSet) {
  var ro = document.getElementById(readoutId);
  if (!ro) return;
  var isEn = currentLang === 'en';

  // Z: the running impedance built up from the source side (parallel elements at the node,
  // then series elements toward the load) -- used to check the LOAD-side criterion.
  var Z = lnetCcompute(selectedKeysSet);

  // Z_src: what the SOURCE's own terminals actually see looking outward into (network + load).
  // THIS is the physically meaningful impedance for reflection / VSWR -- never Z compared to 50.
  var Zsrc = lnetZSeenFromSource(selectedKeysSet);
  var G = lnetGamma(Zsrc.re, Zsrc.im);
  var Gmag = Math.sqrt(G.re*G.re+G.im*G.im);
  var vswr = (1+Gmag)/Math.max(1e-6,1-Gmag);
  var pctReflected = Gmag*Gmag*100;

  // Criterion 2 (load's perspective): does Z equal Z_L's conjugate (2-j20)?
  var target = { re: 2, im: -20 };
  var distRe = Math.abs(Z.re-target.re), distIm = Math.abs(Z.im-target.im);
  var loadSideMatched = distRe < 0.05 && distIm < 0.3;
  var realOnlyMatched = distRe < 0.05;

  // Criterion 1 (source's perspective): does Zsrc equal Zs's conjugate (50, since Zs is real)?
  var sourceSideMatched = Math.abs(Zsrc.re-50) < 0.1 && Math.abs(Zsrc.im) < 0.1;

  var anyParallel = Object.keys(LNET_CHOICES).some(function(k){ return LNET_CHOICES[k].mode==='parallel' && selectedKeysSet[k]; });
  var anySeries = Object.keys(LNET_CHOICES).some(function(k){ return LNET_CHOICES[k].mode==='series' && selectedKeysSet[k]; });
  var anyResistor = (selectedKeysSet['R_series'] || selectedKeysSet['R_parallel']);
  var nothingSelected = !anyParallel && !anySeries;

  var statusLine;
  if (nothingSelected) {
    statusLine = isEn ? 'Nothing selected \u2014 the source sees the bare load Z_L=2+j20Ω directly, with no matching network in between.'
                       : '아무 것도 선택하지 않음 — Source가 매칭망 없이 부하 Z_L=2+j20Ω을 그대로 마주합니다.';
  } else if (loadSideMatched && sourceSideMatched) {
    statusLine = isEn ? '\u2705 Matched on BOTH sides at once: the load sees the conjugate of itself looking back, and the source sees a clean 50Ω looking out \u2014 zero reflection, by either measure.'
                       : '✅ 양쪽 모두 동시에 매칭! 부하 쪽에서는 자기 자신의 켤레가 보이고, Source 쪽에서는 깔끔한 50Ω이 보입니다 — 어느 기준으로 봐도 반사가 0입니다.';
  } else if (realOnlyMatched) {
    statusLine = isEn ? 'The real part lines up, but the reactive part still differs from the target \u2014 neither side is matched yet.'
                       : '실수부는 맞았지만 허수부가 아직 목표와 다릅니다 — 아직 어느 쪽도 매칭되지 않았습니다.';
  } else if (anyResistor) {

window._lnetState = {}; // { prefix: { selected: {key:true}, canvasId, readoutId } }

window.toggleLnetChoice = function(prefix, key) {
  var state = window._lnetState[prefix];
  if (!state) return;
  state.selected[key] = !state.selected[key];
  lnetRenderAll(prefix);
};

function lnetRenderAll(prefix) {
  var state = window._lnetState[prefix];
  if (!state) return;
  // update chip visuals
  Object.keys(LNET_CHOICES).forEach(function(key) {
    var chip = document.querySelector('[data-key="'+key+'"][onclick*="'+prefix+'"]');
    var box = document.getElementById(prefix+'-box-'+key);
    var active = !!state.selected[key];
    if (chip) chip.classList.toggle('active', active);
    if (box) box.textContent = active ? '\u2713' : '';
  });
  lnetDrawCircuit(state.canvasId, state.selected);
  lnetUpdateReadout(state.readoutId, state.selected);
}

function initLNetSim(prefix, canvasId, readoutId, defaultKeys) {
  if (!window._lnetState[prefix]) {
    var sel = {};
    (defaultKeys||[]).forEach(function(k){ sel[k] = true; });
    window._lnetState[prefix] = { selected: sel, canvasId: canvasId, readoutId: readoutId };
  } else {
    // slide re-entered: keep prior selection state, just refresh ids in case DOM was rebuilt
    window._lnetState[prefix].canvasId = canvasId;
    window._lnetState[prefix].readoutId = readoutId;
  }
  lnetRenderAll(prefix);
}

var D54_Z0 = 50;
window._d54Step = 0;
// Path of {R, X, type} representing the impedance looking from Source into the network at each step
window._d54Path = [
  { R: 50, X: 0,      type: 'source' },
  { R: 2,  X: -10.207, type: 'loadcap' },   // after parallel Load Cap (real part matched to 2, leftover -j9.798... but we show network-side conjugate build)
];

function d54Gamma(R, X) {
  var Z0 = D54_Z0;
  var numRe = R-Z0, numIm = X, denRe = R+Z0, denIm = X;
  var denMag2 = denRe*denRe + denIm*denIm || 1e-9;
  return { re: (numRe*denRe + numIm*denIm)/denMag2, im: (numIm*denRe - numRe*denIm)/denMag2 };
}

window.setD54Step = function(step) {
  window._d54Step = step;
  document.querySelectorAll('[id^="d54-step-"]').forEach(function(b){ b.classList.remove('active'); });
  var btn = document.getElementById('d54-step-' + step);
  if (btn) btn.classList.add('active');
  renderD54();
};

function renderD54() {
  drawD54Chart();
  updateD54Readout();
}

function d54StateAt(step) {
  // Network-side impedance as seen from Source, at each construction step,
  // tracking the same numeric path used in Topics 3/4/5's worked example,
  // generalized to the conjugate target of Z_L = 2+j20.
  // step0: Source alone (50)
  // step1: Zs‖Za  (Load Cap, parallel)            -> 2.000 - j9.798
  // step2: + Tune Coil (series, +j9.798)            -> 2.000 + 0j
  // step3: + Tune Cap (series, -j20)                -> 2.000 - j20  (= Z_L*)
  if (step <= 0) return { R: 50, X: 0 };
  if (step === 1) return { R: 2.000, X: -9.798 };
  if (step === 2) return { R: 2.000, X: 0 };
  return { R: 2.000, X: -20 };
}

function drawD54Chart() {
  var canvas = document.getElementById('d54-chart');
  if (!canvas) return;
  var dpr = window.devicePixelRatio||1;
  var W = canvas.offsetWidth, H = canvas.offsetHeight;
  if (!W||!H) return;
  canvas.width = Math.round(W*dpr); canvas.height = Math.round(H*dpr);
  var ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr);
  var isEn = currentLang === 'en';
  var MONO = "'JetBrains Mono',monospace";

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#FAFBFF'; ctx.fillRect(0,0,W,H);

  var cx = W*0.5, cy = H*0.5;
  var rad = Math.min(W*0.42, H*0.42);

  ctx.strokeStyle = '#444'; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.arc(cx,cy,rad,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle = '#D8D5CE'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx-rad,cy); ctx.lineTo(cx+rad,cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx,cy-rad); ctx.lineTo(cx,cy+rad); ctx.stroke();

  function toXY(R, X) { var g = d54Gamma(R,X); return { x: cx+g.re*rad, y: cy-g.im*rad }; }

  // fixed reference: the actual load Z_L = 2+j20
  var loadPt = toXY(2, 20);
  ctx.fillStyle = '#C8B89A';
  ctx.beginPath(); ctx.arc(loadPt.x, loadPt.y, 5, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(loadPt.x, loadPt.y, 5, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = '#9A8A68'; ctx.font = '9px '+MONO; ctx.textAlign='center';
  ctx.fillText('Z_L=2+j20', loadPt.x, loadPt.y-12);

  // center target
  ctx.fillStyle = '#0F8C50';
  ctx.beginPath(); ctx.arc(cx,cy,3.5,0,Math.PI*2); ctx.fill();

  var step = window._d54Step;
  var path = [];
  for (var i=0; i<=step; i++) path.push(d54StateAt(i));

  // draw connecting arcs (simple straight-ish guide, since each step mixes series/shunt moves
  // through an intermediate normalization not directly expressible as one circle on this Z0=50 chart)
  for (var i=1; i<path.length; i++) {
    var p1 = toXY(path[i-1].R, path[i-1].X), p2 = toXY(path[i].R, path[i].X);
    ctx.strokeStyle = '#C8860D88'; ctx.lineWidth = 2;
    ctx.setLineDash([5,3]);
    ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
    ctx.setLineDash([]);
  }

  // draw points
  path.forEach(function(p, i){
    var pt = toXY(p.R, p.X);
    var isLast = (i === path.length-1);
    if (isLast) {
      var glow = ctx.createRadialGradient(pt.x,pt.y,0,pt.x,pt.y,16);
      glow.addColorStop(0,'#C8860D77'); glow.addColorStop(1,'transparent');
      ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(pt.x,pt.y,16,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#C8860D';
    } else {
      ctx.fillStyle = '#1A6FB5';
    }
    ctx.beginPath(); ctx.arc(pt.x,pt.y, isLast?7:5, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(pt.x,pt.y,isLast?7:5,0,Math.PI*2); ctx.stroke();
  });

  if (step >= 3) {
    ctx.fillStyle = '#0F8C50'; ctx.font = 'bold 10px '+MONO; ctx.textAlign='center';
    ctx.fillText(isEn?'\u0393\u22480 looking into network':'네트워크 쪽 Γ≈0', cx, cy+rad+18);
  }
}

        : (isEn ? 'Step through Load Cap → Tune Coil → Tune Cap and watch the point approach the conjugate of Z_L.'
                : 'Load Cap → Tune Coil → Tune Cap 순서로 진행하며 점이 Z_L의 공액으로 다가가는 것을 확인하세요.'))+

function d55Compute(R, X) {
  // Classic L-network synthesis: first cancel the load's own reactance with a conceptual
  // series step, leaving a pure resistance R; then a shunt (Load Cap) at the Z0 side
  // and a combined series reactance (Tune) bring the network to Z0's conjugate.
  var Z0 = 50;
  var Qm = Math.sqrt(Math.max(0, Z0 / R - 1));   // Q of the L-section needed for this R
  var Bshunt = Qm / Z0;                           // shunt susceptance magnitude (Load Cap, at source side)
  var XseriesTotal = Qm * R;                      // total series reactance magnitude needed across the section
  var loadCapX = -1 / Bshunt;                      // Load Cap expressed as a reactance (negative => capacitive)
  var tuneTotalX = XseriesTotal - X;                // net series reactance still required, after accounting for load's own +X
  return { loadCapX: loadCapX, tuneTotalX: tuneTotalX, Rprime: R, Qm: Qm };
}

window.openLightbox = function(src) {
  var el = document.getElementById('lb-overlay');
  var img = document.getElementById('lb-img');
  if (!el || !img) return;
  img.src = src;
  el.style.display = 'flex';
  document.body.style.overflow = 'hidden';
};
window.closeLightbox = function() {
  var el = document.getElementById('lb-overlay');
  if (!el) return;
  el.style.display = 'none';
  document.body.style.overflow = '';
};
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') window.closeLightbox();
});
