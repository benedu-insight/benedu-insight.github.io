  body[data-lang="en"] .sim-badge,
  body[data-lang="en"] .lang-btn,
  body[data-lang="en"] .era-btn,
  body[data-lang="en"] .toolbar-btn,
  body[data-lang="en"] #scale-indicator,
  body[data-lang="en"] .img-zoom-hint,
  body[data-lang="en"] #imgPopupCaption,
  body[data-lang="en"] code, body[data-lang="en"] pre {
    font-family: 'JetBrains Mono', 'Fira Mono', monospace !important;
  }
  body[data-lang="en"] .detail-name,
  body[data-lang="en"] .sim-title,

<style>
  :root {
    --bg:          #F7F8FA;
    --bg2:         #FFFFFF;
    --bg3:         #F0E6F6;
    --bg4:         #E5F4EC;
    --green:       #0F8C50;
    --green-soft:  #E5F4EC;
    --green-mid:   #cbeadd;
    --green-dark:  #0a6b3d;
    --purple:      #7030A0;
    --purple-soft: #F0E6F6;
    --purple-mid:  #d9b8ed;
    --purple-dark: #521a78;
    --plasma:      #E87B1E;
    --plasma-soft: #FEF0E3;
    --plasma-mid:  #F5C990;
    --plasma-dark: #A84F05;
    --charcoal:    #2D2D2D;
    --text:        #2D2D2D;
    --text2:       #6B7280;
    --text3:       #9CA3AF;
    --border:      #E5E7EB;
    --border2:     #F3F4F6;
    --shadow:      0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md:   0 4px 12px rgba(0,0,0,0.08);
    --max-w:       1400px;
    --scale:       1.0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Gowun Batang', serif;
    min-height: 100vh;
    width: 100%;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header ── */
  header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 0.55rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    box-shadow: var(--shadow);
    width: 100%;
    max-width: var(--max-w);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-logo { height: 38px; width: auto; flex-shrink: 0; }
  .header-divider { width: 1px; height: 28px; background: var(--border); flex-shrink: 0; }
  header h1 {
    font-family: 'Google Sans', 'Gowun Batang', serif;
    font-size: 1.05rem; font-weight: 700;
    color: var(--purple); letter-spacing: 0.02em; line-height: 1.2;
  }
  header p {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.55rem; color: var(--text3);
    letter-spacing: 0.1em; text-transform: uppercase; margin-top: 2px;
  }
  .header-actions { margin-left: auto; display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }

  /* Lang toggle */
  .lang-toggle { display: flex; border: 1px solid var(--border); border-radius: 20px; overflow: hidden; background: var(--bg); }
  .lang-btn {
    padding: 3px 12px; border: none; background: transparent; cursor: pointer;
    font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; font-weight: 500;
    color: var(--text3); transition: all 0.2s;
  }
  .lang-btn.active-lang { background: var(--purple); color: #fff; }

  /* Era filter */
  .era-filter { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; }
  .era-btn {
    background: transparent; border: 1px solid var(--border); border-radius: 20px;
    color: var(--text2); font-family: 'JetBrains Mono', monospace; font-size: 0.62rem;
    padding: 3px 12px; cursor: pointer; transition: all 0.18s;
  }
  .era-btn:hover { border-color: var(--purple-mid); color: var(--purple); background: var(--purple-soft); }
  .era-btn.active { background: var(--purple); border-color: var(--purple); color: #fff; }

  .toolbar-btn {
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg2); color: var(--text); padding: 3px 9px;
    font-size: 0.62rem; cursor: pointer; font-family: 'JetBrains Mono', monospace;
    font-weight: 500; transition: all 0.15s;
  }
  .toolbar-btn:hover { border-color: var(--purple-mid); background: var(--purple-soft); color: var(--purple-dark); }
  #scale-indicator { font-family: 'JetBrains Mono', monospace; font-size: 0.58rem; color: var(--text3); min-width: 32px; text-align: center; }

  /* ── Layout ── */
  .layout {
    display: grid; grid-template-columns: 270px 1fr;
    height: calc(100vh - 58px); width: 100%; max-width: var(--max-w);
  }

  /* ── Sidebar ── */
  .timeline-sidebar {
    border-right: 1px solid var(--border); overflow-y: auto;
    background: var(--bg2); scrollbar-width: thin;
    scrollbar-color: var(--border) transparent; display: flex; flex-direction: column;
  }
  .timeline-sidebar::-webkit-scrollbar { width: 4px; }
  .timeline-sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .sidebar-section-label {
    padding: 0.6rem 1.1rem 0.35rem; font-family: 'JetBrains Mono', monospace;
    font-size: 0.55rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--text3); border-bottom: 1px solid var(--border2);
    position: sticky; top: 0; background: var(--bg2); z-index: 5;
  }
  .era-header {
    position: sticky; top: 0; background: var(--bg2);
    padding: 0.65rem 1rem 0.45rem; border-bottom: 1px solid var(--border2);
    z-index: 5; display: flex; align-items: center; gap: 0.6rem;
    cursor: pointer; user-select: none;
  }
  .era-header:hover { background: var(--bg); }
  .era-label { font-family: 'Google Sans', 'Gowun Batang', serif; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.04em; }
  .era-line { flex: 1; height: 1px; background: var(--border); }
  .era-range { font-family: 'JetBrains Mono', monospace; font-size: 0.55rem; color: var(--text3); letter-spacing: 0.04em; }
  .era-toggle {
    flex-shrink: 0; width: 18px; height: 18px; border-radius: 50%;
    background: var(--border2); display: flex; align-items: center; justify-content: center;
    font-size: 0.6rem; color: var(--text3); transition: background 0.15s, transform 0.22s;
  }
  .era-header.collapsed .era-toggle { transform: rotate(-90deg); }
  .era-header:hover .era-toggle { background: var(--border); color: var(--text2); }
  .era-cards { overflow: hidden; max-height: 2000px; transition: max-height 0.3s ease, opacity 0.25s ease; opacity: 1; }
  .era-cards.collapsed { max-height: 0; opacity: 0; }

  .sci-card {
    padding: 0.75rem 1rem 0.75rem 1.1rem; border-bottom: 1px solid var(--border2);
    cursor: pointer; position: relative; transition: background 0.15s;
    display: flex; gap: 0.65rem; align-items: flex-start; border-left: 4px solid transparent;
  }
  .sci-card:hover { background: var(--bg); }
  .sci-card.active { background: var(--purple-soft); border-left-color: var(--purple); }
  .sci-card.placeholder { opacity: 0.45; cursor: default; }
  .sci-card.placeholder:hover { background: transparent; }
  .sci-year { font-family: 'JetBrains Mono', monospace; font-size: 0.58rem; color: var(--text3); min-width: 48px; padding-top: 2px; line-height: 1.4; }
  .sci-info { flex: 1; min-width: 0; }
  .sci-name { font-size: 0.83rem; font-weight: 700; color: var(--charcoal); line-height: 1.3; }
  .sci-card.active .sci-name { color: var(--purple-dark); }
  .sci-nation { font-size: 0.6rem; color: var(--text3); margin-top: 1px; font-family: 'Gowun Batang', serif; }
  .sci-tags { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
  .sci-tag { font-family: 'JetBrains Mono', monospace; font-size: 0.52rem; padding: 1px 6px; border-radius: 8px; letter-spacing: 0.03em; }

  /* ── Detail Panel ── */
  .detail-panel { display: flex; flex-direction: column; height: 100%; overflow: hidden; background: var(--bg); }
  #detail { flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  #detail::-webkit-scrollbar { width: 4px; }
  #detail::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .detail-content { padding: 1.5rem; max-width: 880px; margin: 0 auto; }

  /* Detail Empty */
  .detail-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 1.2rem; color: var(--text3); }
  .icon-ring { width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--purple-mid); opacity: 0.4; }
  .detail-empty p { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; letter-spacing: 0.08em; }

  /* Hero */
  .detail-hero {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 14px;
    padding: 1.4rem 1.6rem; margin-bottom: 1.1rem; box-shadow: var(--shadow);
  }
  .detail-era-tag {
    font-family: 'JetBrains Mono', monospace; font-size: 0.55rem; letter-spacing: 0.12em;
    text-transform: uppercase; margin-bottom: 0.5rem; display: inline-flex; align-items: center;
    gap: 0.4rem; padding: 2px 9px; border-radius: 10px; font-weight: 500;
  }
  .detail-name {
    font-family: 'Google Sans', 'Montserrat', sans-serif; font-size: calc(1.7rem * var(--scale));
    font-weight: 800; line-height: 1.1; color: var(--purple); margin-bottom: 0.1rem; transition: font-size 0.15s ease-out;
  }
  .detail-name-kr {
    font-family: 'Gowun Batang', serif; font-size: calc(0.9rem * var(--scale));
    color: var(--text2); margin-bottom: 0.6rem; font-weight: 400; transition: font-size 0.15s ease-out;
  }
  .detail-meta {
    display: flex; gap: 1.25rem; flex-wrap: wrap;
    font-family: 'JetBrains Mono', monospace; font-size: calc(0.62rem * var(--scale));
    color: var(--text2); padding-top: 0.6rem; border-top: 1px solid var(--border2); transition: font-size 0.15s ease-out;
  }

  /* Model Showcase */
  .model-showcase {
    display: flex; justify-content: center; align-items: center;
    background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
    padding: 1.75rem; margin-bottom: 1.1rem; box-shadow: var(--shadow);
  }
  .model-img-wrapper { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 0.75rem; }
  .model-img-wrapper img { max-width: 100%; max-height: 420px; object-fit: contain; border-radius: 8px; box-shadow: var(--shadow-md); }
  .model-img-source { font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; color: var(--text3); text-align: center; }
  .img-zoom-hint { font-family: 'JetBrains Mono', monospace; font-size: 0.58rem; color: var(--text3); letter-spacing: 0.06em; }

  /* Quote */
  .quote-block {
    display: flex; gap: 14px; align-items: flex-start; background: var(--bg2);
    border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.1rem;
    margin-bottom: 1.1rem; box-shadow: var(--shadow);
  }
  .quote-badge {
    flex: none; width: 32px; height: 32px; border-radius: 50%;
    background: var(--purple-soft); display: flex; align-items: center;
    justify-content: center; font-size: 1rem; margin-top: 2px;
  }
  .quote-body { flex: 1; min-width: 0; }
  .quote-text { font-family: 'Gowun Batang', serif; font-style: italic; font-size: calc(0.88rem * var(--scale)); color: var(--purple-dark); line-height: 1.78; transition: font-size 0.15s ease-out; }
  .quote-attr { font-family: 'JetBrains Mono', monospace; font-size: calc(0.58rem * var(--scale)); color: var(--text3); margin-top: 0.4rem; letter-spacing: 0.06em; transition: font-size 0.15s ease-out; }

  /* Bio */
  .detail-bio {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
    padding: 1.1rem 1.4rem; font-size: calc(0.88rem * var(--scale)); line-height: 1.85;
    color: var(--text); margin-bottom: 1.1rem; box-shadow: var(--shadow); transition: font-size 0.15s ease-out;
  }
  .detail-bio p + p { margin-top: 0.8em; }

  /* Section Titles */
  .section-title {
    font-family: 'JetBrains Mono', monospace; font-size: 0.58rem; font-weight: 700;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--text3);
    margin-top: 1.5rem; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.6rem;
  }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* Equations */
  .eq-block {
    background: var(--charcoal); border-radius: 8px; padding: 1.1rem 1.4rem; margin-bottom: 0.5rem;
    font-family: 'JetBrains Mono', monospace; font-size: calc(0.9rem * var(--scale));
    color: #FFD580; letter-spacing: 0.04em; overflow-x: auto; transition: font-size 0.15s ease-out;
  }

  /* Theory cards */
  .theories-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 0.7rem; margin-bottom: 1.1rem; }
  .theory-card {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 1rem;
    transition: box-shadow 0.18s, border-color 0.18s; box-shadow: var(--shadow);
  }
  .theory-card:hover { box-shadow: var(--shadow-md); border-color: var(--purple-mid); }
  .theory-year { font-family: 'JetBrains Mono', monospace; font-size: calc(0.58rem * var(--scale)); letter-spacing: 0.06em; margin-bottom: 0.3rem; color: var(--purple); font-weight: 500; transition: font-size 0.15s ease-out; }
  .theory-name { font-size: calc(0.85rem * var(--scale)); font-weight: 700; color: var(--charcoal); margin-bottom: 0.3rem; line-height: 1.3; transition: font-size 0.15s ease-out; }
  .theory-desc { font-size: calc(0.75rem * var(--scale)); color: var(--text2); line-height: 1.65; font-family: 'Gowun Batang', serif; transition: font-size 0.15s ease-out; }

  /* Classroom box */
  details.classroom-box {
    background: #FFFDF0; border: 1px dashed #EEDF8B; border-radius: 12px;
    padding: 1.1rem; margin-bottom: 1.1rem; cursor: pointer; transition: border 0.15s;
  }
  details.classroom-box[open] { border-style: solid; border-color: #D6C359; }
  details.classroom-box summary { font-family: 'Gowun Batang', serif; font-size: 0.82rem; font-weight: 700; color: #8C730F; outline: none; user-select: none; }
  .classroom-body { font-size: calc(0.76rem * var(--scale)); line-height: 1.72; color: #6B5B1E; margin-top: 0.65rem; cursor: default; transition: font-size 0.15s ease-out; }

  /* Connections */
  .conn-list { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1.5rem; }
  .conn-chip {
    background: var(--purple-soft); border: 1px solid var(--purple-mid); border-radius: 20px;
    padding: 3px 12px; font-size: calc(0.74rem * var(--scale)); color: var(--purple-dark);
    cursor: pointer; transition: all 0.15s; font-family: 'Gowun Batang', serif;
  }
  .conn-chip:hover { background: var(--purple); border-color: var(--purple); color: #fff; }

  /* Summary table */
  .summary-matrix { width: 100%; border-collapse: collapse; background: var(--bg2); border-radius: 8px; overflow: hidden; box-shadow: var(--shadow); margin-bottom: 1.1rem; }
  .summary-matrix th, .summary-matrix td { padding: 0.65rem 0.9rem; font-size: calc(0.76rem * var(--scale)); text-align: left; border-bottom: 1px solid var(--border); transition: font-size 0.15s ease-out; }
  .summary-matrix th { background: var(--purple-soft); color: var(--purple-dark); font-weight: 700; font-family: 'Gowun Batang', serif; }

  /* Sim card */
  .sim-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.2rem; margin-bottom: 1.1rem; box-shadow: var(--shadow); }
  .sim-card-header { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.75rem; }
  .sim-badge {
    background: var(--purple); color: #fff; font-family: 'JetBrains Mono', monospace;
    font-size: 0.52rem; font-weight: 700; letter-spacing: 0.06em; padding: 2px 8px; border-radius: 4px; flex-shrink: 0;
  }
  .sim-title { font-family: 'Google Sans', 'Montserrat', sans-serif; font-size: 0.95rem; font-weight: 800; color: var(--charcoal); }
  .sim-btn {
    background: var(--purple); color: #fff; border: none; border-radius: 6px;
    padding: 4px 14px; font-family: 'JetBrains Mono', monospace; font-size: 0.65rem;
    font-weight: 700; cursor: pointer; transition: background 0.15s, transform 0.1s;
  }
  .sim-btn:hover { background: var(--purple-dark); transform: translateY(-1px); }

  /* ── Process Context Image (where this film is used) ── */
  .context-wrap {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
    padding: 1.1rem 1.2rem; margin-bottom: 1.1rem; box-shadow: var(--shadow);
  }
  .context-header {
    display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.85rem;
  }
  .context-badge {
    background: var(--green); color: #fff; font-family: 'JetBrains Mono', monospace;
    font-size: 0.52rem; font-weight: 700; letter-spacing: 0.06em; padding: 2px 8px; border-radius: 4px; flex-shrink: 0;
  }
  .context-title { font-family: 'Google Sans', 'Montserrat', sans-serif; font-size: 0.95rem; font-weight: 800; color: var(--charcoal); }
  .context-img-frame {
    width: 100%; border-radius: 8px; overflow: hidden; border: 1px solid var(--border2);
    cursor: zoom-in; background: #fff;
  }
  .context-img-frame img { width: 100%; display: block; }
  .context-caption {
    margin-top: 0.6rem; font-size: calc(0.8rem * var(--scale)); line-height: 1.78;
    color: var(--text); font-family: 'Gowun Batang', serif; transition: font-size 0.15s ease-out;
  }
  .context-caption b { color: var(--green-dark); }
  .context-foot { margin-top: 0.5rem; display: flex; justify-content: flex-end; }

  /* ── Interactive Simulator Embed ── */
  .sim-embed-wrap {
    background: #0d0d1a; border-radius: 12px; padding: 0; overflow: hidden;
    margin-bottom: 1.1rem; box-shadow: 0 4px 20px rgba(112,48,160,0.2);
    border: 1px solid var(--purple-mid);
  }
  .sim-embed-header {
    background: linear-gradient(90deg, #1a0a2e 0%, #2d1456 100%);
    padding: 0.75rem 1.2rem; display: flex; align-items: center; gap: 0.75rem;
  }
  .sim-embed-badge {
    background: var(--purple); color: #fff; font-family: 'JetBrains Mono', monospace;
    font-size: 0.52rem; font-weight: 700; padding: 2px 8px; border-radius: 4px; letter-spacing: 0.06em;
  }
  .sim-embed-title { font-family: 'Google Sans', sans-serif; font-size: 0.92rem; font-weight: 700; color: #fff; }
  .sim-embed-frame {
    width: 100%; height: 880px; border: none; display: block; background: #0d0d1a;
  }
  .sim-embed-foot {
    background: #1a0a2e; padding: 0.5rem 1.2rem; display: flex; justify-content: flex-end;
  }
  .sim-embed-foot a {
    font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; color: var(--purple-mid);
    text-decoration: none; letter-spacing: 0.04em;
  }
  .sim-embed-foot a:hover { color: #fff; }

  /* ── CCP Chamber Diagram (inline SVG canvas) ── */
  .chamber-wrap {
    background: #0d0d1a; border-radius: 12px; padding: 0; overflow: hidden;
    margin-bottom: 1.1rem; box-shadow: 0 4px 20px rgba(112,48,160,0.2);
    border: 1px solid var(--purple-mid);
  }
  .chamber-header {
    background: linear-gradient(90deg, #1a0a2e 0%, #2d1456 100%);
    padding: 0.75rem 1.2rem; display: flex; align-items: center; gap: 0.75rem;
  }
  .chamber-badge {
    background: var(--purple); color: #fff; font-family: 'JetBrains Mono', monospace;

    quoteAttr: '— 반도체 CVD 공정 기초 (Semiconductor CVD Process Fundamentals)',
    bio: `<b>PE-CVD (Plasma-Enhanced Chemical Vapor Deposition)</b>는 CCP(Capacitively Coupled Plasma) 구조를 이용하여 반응 가스를 플라즈마 상태로 활성화시킨 뒤, 웨이퍼 표면에 박막을 증착하는 공정입니다.\n\n<b>왜 플라즈마가 필요한가?</b> 순수 열에너지(Thermal CVD)만으로 SiO₂나 Si₃N₄를 증착하려면 600~800°C 이상의 고온이 필요합니다. 이 온도는 이미 형성된 금속 배선층(Cu, Al)이나 저유전 물질(low-k dielectric)을 손상시킵니다. 플라즈마는 <b>전자 충돌(electron impact dissociation)</b>로 반응 가스를 라디칼과 이온으로 분해하여, 300~400°C의 저온에서도 충분한 화학 반응 에너지를 공급합니다.`,

  document.querySelectorAll('.era-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}
function openImgPopup(src, caption) {
  const ov = document.getElementById('imgPopupOverlay');
  document.getElementById('imgPopupImg').src = src;
  document.getElementById('imgPopupImg').alt = caption || '';
  document.getElementById('imgPopupCaption').textContent = caption || '';
  ov.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeImgPopup(e) {
  if (e && e.target === document.getElementById('imgPopupInner')) return;
  document.getElementById('imgPopupOverlay').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeImgPopup(); });
function toggleDeepLearn(uid) {
  const hdr = document.getElementById(uid + '_hdr');
  const body = document.getElementById(uid + '_body');
  if (!hdr || !body) return;
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  hdr.classList.toggle('open', !isOpen);
}

// ─────────────────────────────────────────────
//  LANGUAGE TOGGLE
// ─────────────────────────────────────────────
function setLang(l) {
  lang = l;
  document.body.setAttribute('data-lang', l);
  document.getElementById('btnKo').classList.toggle('active-lang', l === 'ko');
  document.getElementById('btnEn').classList.toggle('active-lang', l === 'en');
  const T = UI[lang];
  document.getElementById('hTitle').textContent = T.hTitle;
  document.getElementById('eraAll').textContent  = T.eraAll;
  document.getElementById('eraCCP').textContent  = T.eraCCP;
  document.getElementById('eraICP').textContent  = T.eraICP;
  document.getElementById('eraRPS').textContent  = T.eraRPS;
  buildSidebar(currentEraFilter);
  if (currentId) {
    const slide = getSLIDES().find(s => s.id === currentId);
    if (slide) renderDetail(slide);
  } else {
    document.getElementById('detail').innerHTML =
      `<div class="detail-empty"><div class="icon-ring"></div><p>${T.emptyMsg}</p></div>`;
  }
}

// ─────────────────────────────────────────────
//  SIDEBAR
// ─────────────────────────────────────────────
const eraColors = {
  ccp: { tag: '#7030A0', tagBg: '#F0E6F6', tagBorder: '#d9b8ed' },
  icp: { tag: '#0F8C50', tagBg: '#E5F4EC', tagBorder: '#cbeadd' },
  rps: { tag: '#1565C0', tagBg: '#E3F2FD', tagBorder: '#90CAF9' },
};

function buildSidebar(filter) {
  currentEraFilter = filter;
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = '';
  const T = UI[lang];
  const SLIDES = getSLIDES();
  const eras = ['ccp', 'icp', 'rps'];

  eras.forEach(eraId => {
    const slides = SLIDES.filter(s => s.era === eraId && (filter === 'all' || filter === eraId));
    if (slides.length === 0) return;
    const grp = document.createElement('div');
    grp.className = 'era-group';
    const hdr = document.createElement('div');
    hdr.className = 'era-header';
    const ec = eraColors[eraId];
    hdr.innerHTML = `
      <span class="era-label" style="color:${ec.tag}">${T.eraLabels[eraId]}</span>
      <span class="era-line"></span>
      <span class="era-range">${T.eraRanges[eraId]}</span>
      <span class="era-toggle">▾</span>`;
    grp.appendChild(hdr);
    const cardsWrap = document.createElement('div');
    cardsWrap.className = 'era-cards';
    slides.forEach(slide => {
      const card = document.createElement('div');
      card.className = 'sci-card' + (currentId === slide.id ? ' active' : '') + (slide.placeholder ? ' placeholder' : '');
      card.id = `card-${slide.id}`;
      const tagHtml = slide.tags.slice(0,3).map(t =>
        `<span class="sci-tag" style="background:${ec.tagBg};color:${ec.tag};border:1px solid ${ec.tagBorder}">${t}</span>`
      ).join('');
      card.innerHTML = `
        <div class="sci-year">${slide.chapter}</div>
        <div class="sci-info">
          <div class="sci-name">${slide.nameKr}</div>
          <div class="sci-nation">${slide.period}</div>
          <div class="sci-tags">${tagHtml}</div>
        </div>`;
      if (!slide.placeholder) card.addEventListener('click', () => selectSlide(slide.id));
      cardsWrap.appendChild(card);
    });
    hdr.addEventListener('click', () => {
      const isCollapsed = cardsWrap.classList.toggle('collapsed');
      hdr.classList.toggle('collapsed', isCollapsed);
    });
    grp.appendChild(cardsWrap);
    sidebar.appendChild(grp);
  });
}

// ─────────────────────────────────────────────
//  SELECT SLIDE
// ─────────────────────────────────────────────
function selectSlide(id) {
  document.querySelectorAll('.sci-card').forEach(c => c.classList.remove('active'));
  const SLIDES = getSLIDES();
  const slide = SLIDES.find(s => s.id === id);
  if (!slide || slide.placeholder) return;
  currentId = id;
  const card = document.getElementById(`card-${id}`);
  if (card) {
    const wrap = card.closest('.era-cards');
    if (wrap && wrap.classList.contains('collapsed')) {
      wrap.classList.remove('collapsed');
      wrap.previousElementSibling?.classList.remove('collapsed');
    }
    card.classList.add('active');
    card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  renderDetail(slide);
}

function drawPECVDCanvas() {
  const canvas = document.getElementById('pecvdCanvas');
  if (!canvas) return;
  const labels = window._pecvdLabels || {};
  const CW = 780, CH = 460;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = CW * dpr; canvas.height = CH * dpr;
  canvas.style.height = Math.round(CH * (canvas.offsetWidth / CW)) + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const W = CW, H = CH;

  ctx.fillStyle = '#0d0d1a'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(112,48,160,0.08)'; ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 30) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y = 0; y < H; y += 30) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  const cL=120, cR=660, cT=60, cB=370;
  ctx.strokeStyle='rgba(180,120,255,0.4)'; ctx.lineWidth=2;
  ctx.strokeRect(cL, cT, cR-cL, cB-cT);

  const shY=60, shH=22;
  const g1 = ctx.createLinearGradient(cL,shY,cR,shY+shH);
  g1.addColorStop(0,'#4a1080'); g1.addColorStop(1,'#7030A0');
  ctx.fillStyle=g1; ctx.fillRect(cL,shY,cR-cL,shH);
  ctx.fillStyle='#0d0d1a';
  for (let hx=cL+25; hx<cR-10; hx+=22) { ctx.beginPath(); ctx.arc(hx,shY+shH/2,3,0,Math.PI*2); ctx.fill(); }
  ctx.fillStyle='#d9b8ed'; ctx.font='bold 11px "Google Sans",sans-serif'; ctx.textAlign='center';
  ctx.fillText(labels.showerhead||'', (cL+cR)/2, shY-8);

  const plT=shY+shH, plB=300;
  const pg=ctx.createRadialGradient((cL+cR)/2,(plT+plB)/2,30,(cL+cR)/2,(plT+plB)/2,200);
  pg.addColorStop(0,'rgba(160,80,255,0.18)'); pg.addColorStop(0.5,'rgba(200,120,255,0.10)'); pg.addColorStop(1,'rgba(80,20,160,0.04)');
  ctx.fillStyle=pg; ctx.fillRect(cL+2,plT,cR-cL-4,plB-plT);
  [[250,140],[320,165],[400,130],[470,155],[340,200],[420,190],[290,220],[370,175],[450,210],[310,240],[490,145]].forEach(([px,py])=>{
    const r=ctx.createRadialGradient(px,py,1,px,py,9);
    r.addColorStop(0,'rgba(200,140,255,0.9)'); r.addColorStop(1,'rgba(160,80,255,0)');
    ctx.fillStyle=r; ctx.beginPath(); ctx.arc(px,py,9,0,Math.PI*2); ctx.fill();
  });
  ctx.fillStyle='rgba(200,160,255,0.75)'; ctx.font='italic bold 13px "Google Sans",sans-serif'; ctx.textAlign='center';
  ctx.fillText(labels.plasma||'', (cL+cR)/2, (plT+plB)/2+5);

  ctx.strokeStyle='rgba(255,160,80,0.5)'; ctx.lineWidth=1; ctx.setLineDash([4,3]);
  ctx.beginPath(); ctx.moveTo(cL+2,plT+16); ctx.lineTo(cR-2,plT+16); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cL+2,plB-16); ctx.lineTo(cR-2,plB-16); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='rgba(255,160,80,0.7)'; ctx.font='10px "JetBrains Mono",monospace'; ctx.textAlign='left';
  ctx.fillText(labels.sheath||'', cR+6, plT+20); ctx.fillText(labels.sheath||'', cR+6, plB-12);

  const sucY=300, sucH=22;
  const g2=ctx.createLinearGradient(cL,sucY,cR,sucY+sucH);
  g2.addColorStop(0,'#1a3a1a'); g2.addColorStop(1,'#0F8C50');
  ctx.fillStyle=g2; ctx.fillRect(cL,sucY,cR-cL,sucH);
  ctx.fillStyle='#7fffb3'; ctx.font='bold 11px "Google Sans",sans-serif'; ctx.textAlign='center';
  ctx.fillText(labels.susceptor||'', (cL+cR)/2, sucY+15);

  const wY=sucY-10;
  ctx.fillStyle='#b8d4ff'; ctx.fillRect(cL+60,wY,cR-cL-120,10);
  ctx.fillStyle='rgba(255,200,80,0.7)'; ctx.fillRect(cL+60,wY-5,cR-cL-120,5);
  ctx.fillStyle='#FFD580'; ctx.font='10px "JetBrains Mono",monospace'; ctx.textAlign='center';
  ctx.fillText(labels.film||'', (cL+cR)/2, wY-9);
  ctx.fillStyle='#b8d4ff'; ctx.font='bold 11px "Google Sans",sans-serif';
  ctx.fillText(labels.wafer||'', (cL+cR)/2, wY+7);

  const midX=cR+50;
  ctx.strokeStyle='rgba(255,200,100,0.6)'; ctx.lineWidth=1; ctx.setLineDash([3,2]);
  ctx.beginPath(); ctx.moveTo(midX,shY+shH); ctx.lineTo(midX,sucY); ctx.stroke(); ctx.setLineDash([]);
  function arw(x,y,d){ ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-4,y+(d>0?-8:8)); ctx.lineTo(x+4,y+(d>0?-8:8)); ctx.closePath(); ctx.fill(); }
  ctx.fillStyle='rgba(255,200,100,0.8)'; arw(midX,shY+shH,1); arw(midX,sucY,-1);
  ctx.fillStyle='rgba(255,200,100,0.8)'; ctx.font='10px "JetBrains Mono",monospace'; ctx.textAlign='left';
  (labels.gap||'').split('\n').forEach((l,i)=>ctx.fillText(l, midX+7, (shY+shH+sucY)/2-6+i*13));

  const mX=20,mY=140,mW=80,mH=50;
  ctx.strokeStyle='rgba(200,140,255,0.6)'; ctx.lineWidth=1.5; ctx.strokeRect(mX,mY,mW,mH);
  ctx.fillStyle='rgba(70,0,120,0.5)'; ctx.fillRect(mX,mY,mW,mH);
  ctx.fillStyle='#d9b8ed'; ctx.font='bold 10px "Google Sans",sans-serif'; ctx.textAlign='center';
  (labels.matcher||'').split('\n').forEach((l,i)=>ctx.fillText(l,mX+mW/2,mY+18+i*13));

  const rX=20,rY=220,rW=80,rH=55;
  ctx.strokeStyle='rgba(200,140,255,0.6)'; ctx.lineWidth=1.5; ctx.strokeRect(rX,rY,rW,rH);
  ctx.fillStyle='rgba(70,0,120,0.5)'; ctx.fillRect(rX,rY,rW,rH);
  ctx.fillStyle='#d9b8ed'; ctx.font='bold 10px "Google Sans",sans-serif'; ctx.textAlign='center';
  (labels.rfgen||'').split('\n').forEach((l,i)=>ctx.fillText(l,rX+rW/2,rY+18+i*13));

  ctx.strokeStyle='rgba(200,140,255,0.7)'; ctx.lineWidth=2; ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(mX+mW,mY+mH/2); ctx.lineTo(cL,shY+shH/2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(rX+rW/2,rY); ctx.lineTo(mX+mW/2,mY+mH); ctx.stroke();

  ctx.fillStyle='rgba(255,130,80,0.9)'; ctx.font='10px "JetBrains Mono",monospace'; ctx.textAlign='center';
  ctx.fillText(labels.dcbias||'', (cL+cR)/2, cB+18);

  ctx.fillStyle='rgba(100,200,255,0.8)'; ctx.font='bold 10px "JetBrains Mono",monospace'; ctx.textAlign='center';
  ctx.fillText(labels.gasIn||'', (cL+cR)/2, cT-12);
  ctx.fillStyle='rgba(100,200,255,0.5)';
  for (let ax=cL+60; ax<cR-40; ax+=80) { ctx.beginPath(); ctx.moveTo(ax,cT-5); ctx.lineTo(ax-4,cT+8); ctx.lineTo(ax+4,cT+8); ctx.closePath(); ctx.fill(); }

  ctx.strokeStyle='rgba(100,180,100,0.5)'; ctx.lineWidth=1.5;
  ctx.strokeRect(cL+(cR-cL)/2-35,cB+28,70,28);
  ctx.fillStyle='rgba(15,60,20,0.5)'; ctx.fillRect(cL+(cR-cL)/2-35,cB+28,70,28);
  ctx.fillStyle='rgba(100,200,120,0.8)'; ctx.font='bold 10px "Google Sans",sans-serif'; ctx.textAlign='center';
  ctx.fillText(labels.pump||'', (cL+cR)/2, cB+46);
  ctx.strokeStyle='rgba(100,180,100,0.5)';
  ctx.beginPath(); ctx.moveTo((cL+cR)/2,cB); ctx.lineTo((cL+cR)/2,cB+28); ctx.stroke();
}

function drawEtchCanvas() {
  const canvas = document.getElementById('etchCanvas');
  if (!canvas) return;
  const labels = window._etchLabels || {};
  const CW = 780, CH = 460;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = CW * dpr; canvas.height = CH * dpr;
  canvas.style.height = Math.round(CH * (canvas.offsetWidth / CW)) + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const W = CW, H = CH;

  ctx.fillStyle = '#0d0d1a'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(112,48,160,0.08)'; ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 30) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y = 0; y < H; y += 30) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  const cL=120, cR=660, cT=60, cB=370;
  ctx.strokeStyle='rgba(180,120,255,0.4)'; ctx.lineWidth=2;
  ctx.strokeRect(cL, cT, cR-cL, cB-cT);

  // ── Showerhead (grounded, A_g large) — top ──
  const shY=60, shH=16;
  const g1 = ctx.createLinearGradient(cL,shY,cR,shY+shH);
  g1.addColorStop(0,'#1a3a1a'); g1.addColorStop(1,'#0F8C50');
  ctx.fillStyle=g1; ctx.fillRect(cL,shY,cR-cL,shH);
  ctx.fillStyle='#0d0d1a';
  for (let hx=cL+25; hx<cR-10; hx+=22) { ctx.beginPath(); ctx.arc(hx,shY+shH/2,2.5,0,Math.PI*2); ctx.fill(); }
  ctx.fillStyle='#7fffb3'; ctx.font='bold 11px "Google Sans",sans-serif'; ctx.textAlign='center';
  ctx.fillText(labels.showerhead||'', (cL+cR)/2, shY-8);

  // ── Thin top sheath (small V, grounded side) ──
  const topSheathH=8;
  ctx.fillStyle='rgba(120,120,140,0.18)';
  ctx.fillRect(cL+2, shY+shH, cR-cL-4, topSheathH);
  ctx.fillStyle='rgba(160,160,180,0.6)'; ctx.font='9px "JetBrains Mono",monospace'; ctx.textAlign='left';
  ctx.fillText(labels.sheathTop||'', cR+6, shY+shH+topSheathH-1);

  // ── Bulk plasma ──
  const plT=shY+shH+topSheathH, plB=260;
  const pg=ctx.createRadialGradient((cL+cR)/2,(plT+plB)/2,30,(cL+cR)/2,(plT+plB)/2,200);
  pg.addColorStop(0,'rgba(255,150,200,0.16)'); pg.addColorStop(0.5,'rgba(160,120,255,0.10)'); pg.addColorStop(1,'rgba(80,20,160,0.04)');
  ctx.fillStyle=pg; ctx.fillRect(cL+2,plT,cR-cL-4,plB-plT);
  [[250,140],[320,165],[400,130],[470,155],[340,190],[420,180],[290,205],[370,170],[450,195],[310,215],[490,145]].forEach(([px,py])=>{
    const r=ctx.createRadialGradient(px,py,1,px,py,9);
    r.addColorStop(0,'rgba(255,170,210,0.85)'); r.addColorStop(1,'rgba(160,80,255,0)');
    ctx.fillStyle=r; ctx.beginPath(); ctx.arc(px,py,9,0,Math.PI*2); ctx.fill();
  });
  ctx.fillStyle='rgba(230,170,255,0.8)'; ctx.font='italic bold 13px "Google Sans",sans-serif'; ctx.textAlign='center';
  ctx.fillText(labels.plasma||'', (cL+cR)/2, (plT+plB)/2+5);

  // ── Thick bottom sheath (DC self-bias, RF side) — with downward ion arrows ──
  const botSheathY=plB, botSheathH=34;
  ctx.fillStyle='rgba(255,130,80,0.14)';
  ctx.fillRect(cL+2, botSheathY, cR-cL-4, botSheathH);
  ctx.strokeStyle='rgba(255,160,80,0.5)'; ctx.lineWidth=1; ctx.setLineDash([4,3]);
  ctx.beginPath(); ctx.moveTo(cL+2,botSheathY); ctx.lineTo(cR-2,botSheathY); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='rgba(255,160,80,0.85)'; ctx.font='10px "JetBrains Mono",monospace'; ctx.textAlign='left';
  ctx.fillText(labels.sheathBot||'', cR+6, botSheathY+botSheathH/2+3);
  // downward ion arrows through the thick sheath
  ctx.strokeStyle='rgba(255,170,100,0.85)'; ctx.fillStyle='rgba(255,170,100,0.85)';
  for (let ix=cL+70; ix<cR-50; ix+=70) {
    ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(ix,botSheathY+3); ctx.lineTo(ix,botSheathY+botSheathH-6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ix,botSheathY+botSheathH-2); ctx.lineTo(ix-4,botSheathY+botSheathH-9); ctx.lineTo(ix+4,botSheathY+botSheathH-9); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle='rgba(255,170,100,0.9)'; ctx.font='bold 9px "JetBrains Mono",monospace'; ctx.textAlign='center';
  ctx.fillText(labels.ions||'', (cL+cR)/2, botSheathY-4);

  // ── Wafer + mask on chuck ──
  const wY=botSheathY+botSheathH;
  ctx.fillStyle='#b8d4ff'; ctx.fillRect(cL+60,wY,cR-cL-120,10);
  // mask pattern (small rectangles) + etched trench notch
  ctx.fillStyle='rgba(217,184,237,0.85)';
  ctx.fillRect(cL+90,wY-6,40,6); ctx.fillRect(cL+200,wY-6,40,6); ctx.fillRect(cL+320,wY-6,40,6); ctx.fillRect(cL+430,wY-6,40,6);
  ctx.fillStyle='#FFD580'; ctx.font='10px "JetBrains Mono",monospace'; ctx.textAlign='center';
  ctx.fillText(labels.etch||'', (cL+cR)/2, wY-12);
  ctx.fillStyle='#b8d4ff'; ctx.font='bold 11px "Google Sans",sans-serif';
  ctx.fillText(labels.wafer||'', (cL+cR)/2, wY+22);

  // ── Wafer chuck (RF electrode, A_p small) ──
  const chY=wY+12, chH=18;
  const chuckW = (cR-cL)*0.55, chuckX = cL + (cR-cL-chuckW)/2;
  const g2=ctx.createLinearGradient(chuckX,chY,chuckX+chuckW,chY+chH);
  g2.addColorStop(0,'#4a1080'); g2.addColorStop(1,'#7030A0');
  ctx.fillStyle=g2; ctx.fillRect(chuckX,chY,chuckW,chH);
  ctx.fillStyle='#d9b8ed'; ctx.font='bold 11px "Google Sans",sans-serif'; ctx.textAlign='center';
  ctx.fillText(labels.chuck||'', (cL+cR)/2, chY+chH+16);

  // ── C_block between chuck and RF generator ──
  const cbX=(cL+cR)/2, cbY=chY+chH+26;
  ctx.strokeStyle='rgba(255,200,100,0.8)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(cbX-14,cbY); ctx.lineTo(cbX+14,cbY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cbX-14,cbY+6); ctx.lineTo(cbX+14,cbY+6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cbX,chY+chH); ctx.lineTo(cbX,cbY); ctx.stroke();
  ctx.fillStyle='rgba(255,200,100,0.85)'; ctx.font='10px "JetBrains Mono",monospace'; ctx.textAlign='left';
  ctx.fillText(labels.cblock||'', cbX+18, cbY+4);

  // ── Matcher + RF Generator boxes (left side, like PE-CVD) ──
  const mX=20,mY=140,mW=80,mH=50;
  ctx.strokeStyle='rgba(200,140,255,0.6)'; ctx.lineWidth=1.5; ctx.strokeRect(mX,mY,mW,mH);
  ctx.fillStyle='rgba(70,0,120,0.5)'; ctx.fillRect(mX,mY,mW,mH);
  ctx.fillStyle='#d9b8ed'; ctx.font='bold 10px "Google Sans",sans-serif'; ctx.textAlign='center';
  (labels.matcher||'').split('\n').forEach((l,i)=>ctx.fillText(l,mX+mW/2,mY+18+i*13));

  const rX=20,rY=220,rW=80,rH=55;
  ctx.strokeStyle='rgba(200,140,255,0.6)'; ctx.lineWidth=1.5; ctx.strokeRect(rX,rY,rW,rH);
  ctx.fillStyle='rgba(70,0,120,0.5)'; ctx.fillRect(rX,rY,rW,rH);
  ctx.fillStyle='#d9b8ed'; ctx.font='bold 10px "Google Sans",sans-serif'; ctx.textAlign='center';
  (labels.rfgen||'').split('\n').forEach((l,i)=>ctx.fillText(l,rX+rW/2,rY+18+i*13));

  // wire: RF gen -> matcher -> down to chuck/C_block junction (cbX line)
  ctx.strokeStyle='rgba(200,140,255,0.7)'; ctx.lineWidth=2; ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(rX+rW/2,rY); ctx.lineTo(mX+mW/2,mY+mH); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(mX+mW,mY+mH/2); ctx.lineTo(cbX-14,cbY+3); ctx.stroke();

  // ── V_DC label ──
  ctx.fillStyle='rgba(255,130,80,0.95)'; ctx.font='bold 10px "JetBrains Mono",monospace'; ctx.textAlign='center';
  ctx.fillText(labels.dcbias||'', (cL+cR)/2, cB-6);

  // ── Gas inlet (top) ──
  ctx.fillStyle='rgba(100,200,255,0.8)'; ctx.font='bold 10px "JetBrains Mono",monospace'; ctx.textAlign='center';
  ctx.fillText(labels.gasIn||'', (cL+cR)/2, cT-12);
  ctx.fillStyle='rgba(100,200,255,0.5)';
  for (let ax=cL+60; ax<cR-40; ax+=80) { ctx.beginPath(); ctx.moveTo(ax,cT-5); ctx.lineTo(ax-4,cT+8); ctx.lineTo(ax+4,cT+8); ctx.closePath(); ctx.fill(); }

  // ── Pump (side exhaust, right) ──
  const pX=cR+8, pY=plT+10, pW=70, pH=28;
  ctx.strokeStyle='rgba(100,180,100,0.5)'; ctx.lineWidth=1.5;
  ctx.strokeRect(pX,pY,pW,pH);
  ctx.fillStyle='rgba(15,60,20,0.5)'; ctx.fillRect(pX,pY,pW,pH);
  ctx.fillStyle='rgba(100,200,120,0.8)'; ctx.font='bold 10px "Google Sans",sans-serif'; ctx.textAlign='center';
  ctx.fillText(labels.pump||'', pX+pW/2, pY+pH/2+4);
  ctx.strokeStyle='rgba(100,180,100,0.5)';
  ctx.beginPath(); ctx.moveTo(cR,pY+pH/2); ctx.lineTo(pX,pY+pH/2); ctx.stroke();
}

function drawPVDCanvas() {
  const canvas = document.getElementById('pvdCanvas');
  if (!canvas) return;
  const labels = window._pvdLabels || {};
  const CW = 780, CH = 460;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = CW * dpr; canvas.height = CH * dpr;
  canvas.style.height = Math.round(CH * (canvas.offsetWidth / CW)) + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const W = CW, H = CH;

  ctx.fillStyle = '#0d0d1a'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(112,48,160,0.08)'; ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 30) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y = 0; y < H; y += 30) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  const cL=120, cR=660, cT=60, cB=370;
  ctx.strokeStyle='rgba(180,120,255,0.4)'; ctx.lineWidth=2;
  ctx.strokeRect(cL, cT, cR-cL, cB-cT);

  // ── Al Target (cathode, powered, small effective area) — top ──
  const tY=60, tH=22;
  const g1 = ctx.createLinearGradient(cL,tY,cR,tY+tH);
  g1.addColorStop(0,'#6b6f78'); g1.addColorStop(1,'#a8adb8');
  ctx.fillStyle=g1; ctx.fillRect(cL,tY,cR-cL,tH);
  ctx.fillStyle='#e8eaef'; ctx.font='bold 11px "Google Sans",sans-serif'; ctx.textAlign='center';
  ctx.fillText(labels.target||'', (cL+cR)/2, tY-8);

  // ── Thick target sheath (high V, target self-bias) — with upward ion arrows ──
  const tSheathY=tY+tH, tSheathH=34;
  ctx.fillStyle='rgba(255,130,80,0.14)';
  ctx.fillRect(cL+2, tSheathY, cR-cL-4, tSheathH);
  ctx.strokeStyle='rgba(255,160,80,0.5)'; ctx.lineWidth=1; ctx.setLineDash([4,3]);
  ctx.beginPath(); ctx.moveTo(cL+2,tSheathY+tSheathH); ctx.lineTo(cR-2,tSheathY+tSheathH); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='rgba(255,160,80,0.85)'; ctx.font='10px "JetBrains Mono",monospace'; ctx.textAlign='left';
  ctx.fillText(labels.sheathTarget||'', cR+6, tSheathY+tSheathH/2+3);
  // upward ion arrows accelerating toward the target
  ctx.strokeStyle='rgba(255,170,100,0.85)'; ctx.fillStyle='rgba(255,170,100,0.85)';
  for (let ix=cL+70; ix<cR-50; ix+=70) {
    ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(ix,tSheathY+tSheathH-3); ctx.lineTo(ix,tSheathY+6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ix,tSheathY+2); ctx.lineTo(ix-4,tSheathY+9); ctx.lineTo(ix+4,tSheathY+9); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle='rgba(255,170,100,0.9)'; ctx.font='bold 9px "JetBrains Mono",monospace'; ctx.textAlign='center';
  ctx.fillText(labels.ions||'', (cL+cR)/2, tSheathY+tSheathH+12);

  // sputter-ejected Al atoms (grey dots) drifting down from target
  ctx.fillStyle='rgba(200,205,215,0.85)';
  [[200,tSheathY+tSheathH+8],[340,tSheathY+tSheathH+14],[460,tSheathY+tSheathH+6],[560,tSheathY+tSheathH+16]].forEach(([px,py])=>{
    ctx.beginPath(); ctx.arc(px,py,3,0,Math.PI*2); ctx.fill();
  });
  ctx.fillStyle='rgba(220,225,235,0.85)'; ctx.font='bold 10px "JetBrains Mono",monospace'; ctx.textAlign='center';
  ctx.fillText(labels.sputter||'', (cL+cR)/2-160, tSheathY+tSheathH+26);

  // ── Bulk plasma (Ar/Al) ──
  const plT=tSheathY+tSheathH+30, plB=300;
  const pg=ctx.createRadialGradient((cL+cR)/2,(plT+plB)/2,30,(cL+cR)/2,(plT+plB)/2,200);
  pg.addColorStop(0,'rgba(160,80,255,0.18)'); pg.addColorStop(0.5,'rgba(200,120,255,0.10)'); pg.addColorStop(1,'rgba(80,20,160,0.04)');
  ctx.fillStyle=pg; ctx.fillRect(cL+2,plT,cR-cL-4,plB-plT);
  [[250,150],[320,175],[400,140],[470,165],[340,205],[420,195],[290,225],[370,185],[450,215],[310,235]].forEach(([px,py])=>{
    const r=ctx.createRadialGradient(px,py,1,px,py,9);
    r.addColorStop(0,'rgba(200,140,255,0.9)'); r.addColorStop(1,'rgba(160,80,255,0)');
    ctx.fillStyle=r; ctx.beginPath(); ctx.arc(px,py,9,0,Math.PI*2); ctx.fill();
  });
  // line-of-sight grey Al atoms drifting toward wafer
  ctx.fillStyle='rgba(200,205,215,0.7)';
  [[230,260],[310,275],[400,255],[480,270],[360,290],[430,285]].forEach(([px,py])=>{
    ctx.beginPath(); ctx.arc(px,py,2.5,0,Math.PI*2); ctx.fill();
  });
  ctx.fillStyle='rgba(200,160,255,0.75)'; ctx.font='italic bold 13px "Google Sans",sans-serif'; ctx.textAlign='center';
  ctx.fillText(labels.plasma||'', (cL+cR)/2, (plT+plB)/2+5);

  // ── Thin wafer sheath (low V) ──
  const wSheathY=plB, wSheathH=10;
  ctx.fillStyle='rgba(120,120,140,0.18)';
  ctx.fillRect(cL+2, wSheathY, cR-cL-4, wSheathH);
  ctx.fillStyle='rgba(160,160,180,0.6)'; ctx.font='9px "JetBrains Mono",monospace'; ctx.textAlign='left';
  ctx.fillText(labels.sheathWafer||'', cR+6, wSheathY+wSheathH-1);

  // ── Wafer + growing Al film ──
  const wY=wSheathY+wSheathH;
  ctx.fillStyle='#b8d4ff'; ctx.fillRect(cL+60,wY,cR-cL-120,8);
  ctx.fillStyle='#c8ccd5'; ctx.fillRect(cL+60,wY-5,cR-cL-120,5);
  ctx.fillStyle='#e8eaef'; ctx.font='10px "JetBrains Mono",monospace'; ctx.textAlign='center';
  ctx.fillText(labels.film||'', (cL+cR)/2, wY-9);
  ctx.fillStyle='#b8d4ff'; ctx.font='bold 11px "Google Sans",sans-serif';
  ctx.fillText(labels.wafer||'', (cL+cR)/2, wY+22);

  // ── Susceptor (grounded anode, large area) — bottom ──
  const sucY=wY+12, sucH=22;
  const g2=ctx.createLinearGradient(cL,sucY,cR,sucY+sucH);
  g2.addColorStop(0,'#1a3a1a'); g2.addColorStop(1,'#0F8C50');
  ctx.fillStyle=g2; ctx.fillRect(cL,sucY,cR-cL,sucH);
  ctx.fillStyle='#7fffb3'; ctx.font='bold 11px "Google Sans",sans-serif'; ctx.textAlign='center';
  ctx.fillText(labels.susceptor||'', (cL+cR)/2, sucY+15);

  // ── Matcher + DC/AC Source boxes (left side) ──
  const mX=20,mY=140,mW=80,mH=50;
  ctx.strokeStyle='rgba(200,140,255,0.6)'; ctx.lineWidth=1.5; ctx.strokeRect(mX,mY,mW,mH);
  ctx.fillStyle='rgba(70,0,120,0.5)'; ctx.fillRect(mX,mY,mW,mH);
  ctx.fillStyle='#d9b8ed'; ctx.font='bold 10px "Google Sans",sans-serif'; ctx.textAlign='center';
  (labels.matcher||'').split('\n').forEach((l,i)=>ctx.fillText(l,mX+mW/2,mY+18+i*13));

  const rX=20,rY=220,rW=80,rH=55;
  ctx.strokeStyle='rgba(200,140,255,0.6)'; ctx.lineWidth=1.5; ctx.strokeRect(rX,rY,rW,rH);
  ctx.fillStyle='rgba(70,0,120,0.5)'; ctx.fillRect(rX,rY,rW,rH);
  ctx.fillStyle='#d9b8ed'; ctx.font='bold 10px "Google Sans",sans-serif'; ctx.textAlign='center';
  (labels.rfgen||'').split('\n').forEach((l,i)=>ctx.fillText(l,rX+rW/2,rY+18+i*13));

  // wires: source -> matcher -> target (top)
  ctx.strokeStyle='rgba(200,140,255,0.7)'; ctx.lineWidth=2; ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(rX+rW/2,rY); ctx.lineTo(mX+mW/2,mY+mH); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(mX+mW,mY+mH/2); ctx.lineTo(cL,tY+tH/2); ctx.stroke();

  // ── V_target label ──
  ctx.fillStyle='rgba(255,130,80,0.95)'; ctx.font='bold 10px "JetBrains Mono",monospace'; ctx.textAlign='center';
  ctx.fillText(labels.dcbias||'', (cL+cR)/2, cT-12);

  // ── Ar gas inlet (side, into plasma region) ──
  ctx.fillStyle='rgba(100,200,255,0.8)'; ctx.font='bold 10px "JetBrains Mono",monospace'; ctx.textAlign='left';
  ctx.fillText(labels.gasIn||'', cL+6, plT-4);
  ctx.fillStyle='rgba(100,200,255,0.5)';
  ctx.beginPath(); ctx.moveTo(cL+30,plT+10); ctx.lineTo(cL+18,plT+18); ctx.lineTo(cL+30,plT+18); ctx.closePath(); ctx.fill();

  // ── Pump (side exhaust, right) ──
  const pX=cR+8, pY=plT+10, pW=70, pH=28;
  ctx.strokeStyle='rgba(100,180,100,0.5)'; ctx.lineWidth=1.5;
  ctx.strokeRect(pX,pY,pW,pH);
  ctx.fillStyle='rgba(15,60,20,0.5)'; ctx.fillRect(pX,pY,pW,pH);
  ctx.fillStyle='rgba(100,200,120,0.8)'; ctx.font='bold 10px "Google Sans",sans-serif'; ctx.textAlign='center';
  ctx.fillText(labels.pump||'', pX+pW/2, pY+pH/2+4);
  ctx.strokeStyle='rgba(100,180,100,0.5)';
  ctx.beginPath(); ctx.moveTo(cR,pY+pH/2); ctx.lineTo(pX,pY+pH/2); ctx.stroke();
}
