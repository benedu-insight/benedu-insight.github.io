<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>History of Atomic Theory — Benedu Insight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Gowun+Batang:wght@400;700&family=JetBrains+Mono:wght@400;500;600;700&display=block" rel="stylesheet">
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/benedu-insight/benedu-insight.github.io/refs/heads/main/logo_png/benedu_insight_Symbol.png">

<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']]
    },
    startup: {
      ready: function () {
        MathJax.startup.defaultReady();
        const panel = document.getElementById('detail');
        if (panel && window.MathJax.typesetPromise) {
          MathJax.typesetPromise([panel]).catch(function (err) {
            console.log('MathJax initial typeset failed: ' + err.message);
          });
        }
      }
    }
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<style>
  :root {
    --bg:          #F7F8FA;
    --bg2:         #FFFFFF;
    --bg3:         #F0E6F6;
    --bg4:         #E5F4EC;
    --green:       #0F8C50;
    --green-soft:  #E5F4EC;
    --green-mid:   #cbeadd;
    --green-dark:  #0a6b3d;
    --purple:      #7030A0;
    --purple-soft: #F0E6F6;
    --purple-mid:  #d9b8ed;
    --purple-dark: #521a78;
    --charcoal:    #2D2D2D;
    --text:        #2D2D2D;
    --text2:       #6B7280;
    --text3:       #9CA3AF;
    --border:      #E5E7EB;
    --border2:     #F3F4F6;
    --shadow:      0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md:   0 4px 12px rgba(0,0,0,0.08);
    --max-w:       1400px;
    --scale:       1.0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Google Sans', 'Gowun Batang', serif;
    min-height: 100vh;
    width: 100%;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header ── */
  header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 0.55rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    box-shadow: var(--shadow);
    width: 100%;
    max-width: var(--max-w);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-logo {
    height: 38px;
    width: auto;
    flex-shrink: 0;
  }
  .header-divider {
    width: 1px;
    height: 28px;
    background: var(--border);
    flex-shrink: 0;
  }
  .header-title-block { }
  header h1 {
    font-family: 'Google Sans', 'Gowun Batang', serif;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--purple);
    letter-spacing: 0.02em;
    line-height: 1.2;
  }
  header p {
    font-family: 'JetBrains Mono', 'Gowun Batang', monospace;
    font-size: 0.55rem;
    color: var(--text3);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 2px;
  }
  .header-actions {
    margin-left: auto;
    display: flex;
    gap: 0.5rem;
    align-items: center;
    flex-wrap: wrap;
  }

  /* Language Toggle */
  .lang-toggle {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    background: var(--bg);
  }
  .lang-btn {
    padding: 3px 12px;
    border: none;
    background: transparent;
    cursor: pointer;
    font-family: 'JetBrains Mono', 'Gowun Batang', monospace;
    font-size: 0.62rem;
    font-weight: 500;
    color: var(--text3);
    transition: all 0.2s;
  }
  .lang-btn.active-lang {
    background: var(--purple);
    color: #fff;
  }

  /* Era Filter */
  .era-filter {
    display: flex;
    gap: 0.4rem;
    flex-wrap: wrap;
    align-items: center;
  }
  .era-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text2);
    font-family: 'JetBrains Mono', 'Gowun Batang', monospace;
    font-size: 0.62rem;
    padding: 3px 12px;
    cursor: pointer;
    transition: all 0.18s;
  }
  .era-btn:hover {
    border-color: var(--purple-mid);
    color: var(--purple);
    background: var(--purple-soft);
  }
  .era-btn.active {
    background: var(--purple);
    border-color: var(--purple);
    color: #fff;
  }

  .toolbar-btn {
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg2);
    color: var(--text);
    padding: 3px 9px;
    font-size: 0.62rem;
    cursor: pointer;
    font-family: 'JetBrains Mono', 'Gowun Batang', monospace;
    font-weight: 500;
    transition: all 0.15s;
  }
  .toolbar-btn:hover {
    border-color: var(--purple-mid);
    background: var(--purple-soft);
    color: var(--purple-dark);
  }
  #scale-indicator {
    font-family: 'JetBrains Mono', 'Gowun Batang', monospace;
    font-size: 0.58rem;
    color: var(--text3);
    min-width: 32px;
    text-align: center;
  }

  /* ── Layout ── */
  .layout {
    display: grid;
    grid-template-columns: 270px 1fr;
    height: calc(100vh - 58px);
    width: 100%;
    max-width: var(--max-w);
  }

  /* ── Timeline Sidebar ── */
  .timeline-sidebar {
    border-right: 1px solid var(--border);
    overflow-y: auto;
    background: var(--bg2);
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
    display: flex;
    flex-direction: column;
  }
  .timeline-sidebar::-webkit-scrollbar { width: 4px; }
  .timeline-sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .sidebar-section-label {
    padding: 0.6rem 1.1rem 0.35rem;
    font-family: 'JetBrains Mono', 'Gowun Batang', monospace;
    font-size: 0.55rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text3);
    border-bottom: 1px solid var(--border2);
    position: sticky;
    top: 0;
    background: var(--bg2);
    z-index: 5;
  }
  .sidebar-section-label:not(:first-child) {
    border-top: 2px solid var(--border);
    margin-top: 0.2rem;
  }

  .era-header {
    position: sticky;
    top: 0;
    background: var(--bg2);
    padding: 0.65rem 1rem 0.45rem;
    border-bottom: 1px solid var(--border2);
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    cursor: pointer;
    user-select: none;
  }
  .era-header:hover { background: var(--bg); }
  .era-label {
    font-family: 'Google Sans', 'Gowun Batang', serif;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .era-line { flex: 1; height: 1px; background: var(--border); }
  .era-range {
    font-family: 'JetBrains Mono', 'Gowun Batang', monospace;
    font-size: 0.55rem;
    color: var(--text3);
    letter-spacing: 0.04em;
  }
  .era-toggle {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--border2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.6rem;
    color: var(--text3);
    transition: background 0.15s, transform 0.22s;
  }
  .era-header.collapsed .era-toggle { transform: rotate(-90deg); }
  .era-header:hover .era-toggle { background: var(--border); color: var(--text2); }
  .era-cards {
    overflow: hidden;
    max-height: 2000px;
    transition: max-height 0.3s ease, opacity 0.25s ease;
    opacity: 1;
  }
  .era-cards.collapsed { max-height: 0; opacity: 0; }

  /* Nav Item */
  .sci-card {
    padding: 0.75rem 1rem 0.75rem 1.1rem;
    border-bottom: 1px solid var(--border2);
    cursor: pointer;
    position: relative;
    transition: background 0.15s;
    display: flex;
    gap: 0.65rem;
    align-items: flex-start;
    border-left: 4px solid transparent;
  }
  .sci-card:hover { background: var(--bg); }
  .sci-card.active { background: var(--purple-soft); border-left-color: var(--purple); }
  .sci-year {
    font-family: 'JetBrains Mono', 'Gowun Batang', monospace;
    font-size: 0.58rem;
    color: var(--text3);
    min-width: 48px;
    padding-top: 2px;
    line-height: 1.4;
  }
  .sci-info { flex: 1; min-width: 0; }
  .sci-name {
    font-size: 0.83rem;
    font-weight: 700;
    color: var(--charcoal);
    line-height: 1.3;
  }
  .sci-card.active .sci-name { color: var(--purple-dark); }
  .sci-nation {
    font-size: 0.6rem;
    color: var(--text3);
    margin-top: 1px;
    font-family: 'Google Sans', 'Gowun Batang', serif;
  }
  .sci-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
    margin-top: 4px;
  }
  .sci-tag {
    font-family: 'JetBrains Mono', 'Gowun Batang', monospace;
    font-size: 0.52rem;
    padding: 1px 6px;
    border-radius: 8px;
    letter-spacing: 0.03em;
  }

  /* ── Detail Panel ── */
  .detail-panel {
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
  }
  .content-toolbar {
    background: rgba(247,248,250,0.96);
    backdrop-filter: blur(8px);
    padding: 0.45rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.5rem;
    border-bottom: 1px solid var(--border);
    z-index: 10;
    flex-shrink: 0;
  }
  .toolbar-left { display: flex; gap: 0.35rem; flex-wrap: wrap; align-items: center; }
  .toolbar-right { display: flex; gap: 0.35rem; align-items: center; }

  #detail {
    flex: 1;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  #detail::-webkit-scrollbar { width: 4px; }
  #detail::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .detail-content { padding: 1.5rem; max-width: 880px; margin: 0 auto; }

  /* Hero */
  .detail-hero {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.4rem 1.6rem;
    margin-bottom: 1.1rem;
    box-shadow: var(--shadow);
  }
  .detail-era-tag {
    font-family: 'JetBrains Mono', 'Gowun Batang', monospace;
    font-size: 0.55rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 2px 9px;
    border-radius: 10px;
    font-weight: 500;
  }
  .detail-name {
    font-family: 'Google Sans', 'Gowun Batang', serif;
    font-size: calc(1.7rem * var(--scale));
    font-weight: 800;
    line-height: 1.1;
    color: var(--purple);
    margin-bottom: 0.1rem;
    transition: font-size 0.15s ease-out;
  }
  .detail-name-kr {
    font-family: 'Google Sans', 'Gowun Batang', serif;
    font-size: calc(0.9rem * var(--scale));
    color: var(--text2);
    margin-bottom: 0.6rem;
    font-weight: 400;
    transition: font-size 0.15s ease-out;
  }
  .detail-meta {
    display: flex;
    gap: 1.25rem;
    flex-wrap: wrap;
    font-family: 'JetBrains Mono', 'Gowun Batang', monospace;
    font-size: calc(0.62rem * var(--scale));
    color: var(--text2);
    padding-top: 0.6rem;
    border-top: 1px solid var(--border2);
    transition: font-size 0.15s ease-out;
  }

  /* Model Showcase */
  .model-showcase {
    display: flex;
    justify-content: center;
    align-items: center;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.75rem;
    margin-bottom: 1.1rem;
    box-shadow: var(--shadow);
  }
  .model-svg-wrapper { width: 260px; height: 260px; }
  .model-img-wrapper {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
  }
  .model-img-wrapper img {
    max-width: 100%;
    max-height: 320px;
    object-fit: cover;
    border-radius: 8px;
    box-shadow: var(--shadow-md);
  }
  .model-img-source {
    font-family: 'JetBrains Mono', 'Gowun Batang', monospace;
    font-size: 0.62rem;
    color: var(--text3);
    text-align: center;
  }

  /* Quote */
  .quote-block {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.1rem;
    margin-bottom: 1.1rem;
    box-shadow: var(--shadow);
  }
  .quote-badge {
    flex: none;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--green-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    margin-top: 2px;
  }
  .quote-body { flex: 1; min-width: 0; }
  .quote-text {
    font-family: 'Google Sans', 'Gowun Batang', serif;
    font-style: italic;
    font-size: calc(0.88rem * var(--scale));
    color: var(--green-dark);
    line-height: 1.78;
    transition: font-size 0.15s ease-out;
  }
  .quote-attr {
    font-family: 'JetBrains Mono', 'Gowun Batang', monospace;
    font-size: calc(0.58rem * var(--scale));
    color: var(--text3);
    margin-top: 0.4rem;
    letter-spacing: 0.06em;
    transition: font-size 0.15s ease-out;
  }

  /* Bio */
  .detail-bio {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.1rem 1.4rem;
    font-size: calc(0.88rem * var(--scale));
    line-height: 1.85;
    color: var(--text);
    margin-bottom: 1.1rem;
    box-shadow: var(--shadow);
    transition: font-size 0.15s ease-out;
  }
  .detail-bio p + p { margin-top: 0.8em; }

  /* Section Titles */
  .section-title {
    font-family: 'JetBrains Mono', 'Gowun Batang', monospace;
    font-size: 0.58rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text3);
    margin-top: 1.5rem;
    margin-bottom: 0.75rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* Equations */
  .eq-block {
    background: var(--charcoal);
    border-radius: 8px;
    padding: 1.1rem 1.4rem;
    margin-bottom: 0.5rem;
    font-family: 'JetBrains Mono', 'Gowun Batang', monospace;
    font-size: calc(0.9rem * var(--scale));
    color: #a8f5c8;
    letter-spacing: 0.04em;
    overflow-x: auto;
    transition: font-size 0.15s ease-out;
  }

  /* Theory cards */
  .theories-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 0.7rem;
    margin-bottom: 1.1rem;
  }
  .theory-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem;
    transition: box-shadow 0.18s, border-color 0.18s;
    box-shadow: var(--shadow);
  }
  .theory-card:hover { box-shadow: var(--shadow-md); border-color: var(--purple-mid); }
  .theory-year {
    font-family: 'JetBrains Mono', 'Gowun Batang', monospace;
    font-size: calc(0.58rem * var(--scale));
    letter-spacing: 0.06em;
    margin-bottom: 0.3rem;
    color: var(--green);
    font-weight: 500;
    transition: font-size 0.15s ease-out;
  }
  .theory-name {
    font-size: calc(0.85rem * var(--scale));
    font-weight: 700;
    color: var(--charcoal);
    margin-bottom: 0.3rem;
    line-height: 1.3;
    transition: font-size 0.15s ease-out;
  }
  .theory-desc {
    font-size: calc(0.75rem * var(--scale));
    color: var(--text2);
    line-height: 1.65;
    font-family: 'Google Sans', 'Gowun Batang', serif;
    transition: font-size 0.15s ease-out;
  }

  /* Classroom box */
  details.classroom-box {
    background: #FFFDF0;
    border: 1px dashed #EEDF8B;
    border-radius: 12px;
    padding: 1.1rem;
    margin-bottom: 1.1rem;
    cursor: pointer;
    transition: border 0.15s;
  }
  details.classroom-box[open] { border-style: solid; border-color: #D6C359; }
  details.classroom-box summary {
    font-family: 'Google Sans', 'Gowun Batang', serif;
    font-size: 0.82rem;
    font-weight: 700;
    color: #8C730F;
    outline: none;
    user-select: none;
  }
  .classroom-body {
    font-size: calc(0.76rem * var(--scale));
    line-height: 1.72;
    color: #6B5B1E;
    margin-top: 0.65rem;
    cursor: default;
    transition: font-size 0.15s ease-out;
  }

  /* Overview Dashboard */
  .overview-container {
    background: #EAEBED;
    border-radius: 14px;
    padding: 1.75rem 1.25rem;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    margin-bottom: 1.1rem;
    text-align: center;
  }
  .overview-grid {
    display: flex;
    gap: 0.65rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  .overview-card {
    flex: 1;
    min-width: 118px;
    max-width: 138px;
    background: #FFF;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.1rem 0.5rem;
    cursor: pointer;
    transition: transform 0.2s cubic-bezier(0.16,1,0.3,1), box-shadow 0.2s, border-color 0.2s;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    height: 210px;
    box-shadow: var(--shadow);
  }
  .overview-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-md); border-color: var(--purple-mid); }
  .overview-card-tag {
    background: #F3E15F;
    color: #2D2D2D;
    font-size: 0.56rem;
    font-weight: bold;
    padding: 2px 5px;
    border-radius: 4px;
    width: 100%;
    text-align: center;
    margin-top: 0.5rem;
    font-family: 'JetBrains Mono', 'Gowun Batang', monospace;
  }

  /* Summary Matrix */
  .summary-matrix {
    width: 100%;
    border-collapse: collapse;
    background: var(--bg2);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: var(--shadow);
    margin-bottom: 1.1rem;
  }
  .summary-matrix th, .summary-matrix td {
    padding: 0.65rem 0.9rem;
    font-size: calc(0.76rem * var(--scale));
    text-align: left;
    border-bottom: 1px solid var(--border);
    transition: font-size 0.15s ease-out;
  }
  .summary-matrix th {
    background: var(--purple-soft);
    color: var(--purple-dark);
    font-weight: 700;
    font-family: 'Google Sans', 'Gowun Batang', serif;
  }

  /* Connections */
  .conn-list { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1.5rem; }
  .conn-chip {
    background: var(--purple-soft);
    border: 1px solid var(--purple-mid);
    border-radius: 20px;
    padding: 3px 12px;
    font-size: calc(0.74rem * var(--scale));
    color: var(--purple-dark);
    cursor: pointer;
    transition: all 0.15s;
    font-family: 'Google Sans', 'Gowun Batang', serif;
  }
  .conn-chip:hover { background: var(--purple); border-color: var(--purple); color: #fff; }

  /* ── 수식 인포그래픽 이미지 카드 (ch6) ── */
  .eq-infographic-wrap {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    margin-bottom: 1.1rem;
    box-shadow: var(--shadow-md);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
  }
  .eq-infographic-img {
    width: 100%;
    height: auto;
    border-radius: 8px;
    display: block;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .eq-infographic-fallback {
    width: 100%;
    min-height: 80px;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 1rem;
    text-align: center;
  }
  .eq-infographic-caption {
    font-family: 'JetBrains Mono', 'Gowun Batang', monospace;
    font-size: 0.6rem;
    color: var(--text3);
    letter-spacing: 0.06em;
    text-align: center;
    line-height: 1.5;

.afm-tl{position:relative;height:34px;margin:6px 26px 4px}
.afm-tl .tline{position:absolute;left:0;right:0;top:6px;height:2px;background:#dcd8cf;
  transform-origin:left;animation:afGrow .9s ease .8s both}

.afm-tl .tdot{position:absolute;top:0;transform:translateX(-50%);text-align:center;opacity:0;animation:afRise .4s ease var(--d) forwards}
.afm-tl .tdot i{display:block;width:10px;height:10px;border-radius:50%;background:var(--c);margin:2px auto 0;box-shadow:0 0 0 3px #fff}
.afm-tl .tdot b{display:block;font:600 11px 'JetBrains Mono',monospace;color:var(--af-steel);margin-top:5px;white-space:nowrap}
.afm-call{border-top:1px solid #e8e5de;color:var(--af-ink);padding:14px 2px 0;font-size:16px;line-height:1.45;opacity:0;animation:afRise .5s ease 1.5s forwards}
.afm-call b{font-weight:700}
.afm-note{font-size:12.5px;color:var(--af-soft)}
@media (max-width:1100px){ .afm-grid{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:640px){
  .afm{padding:14px 12px}

  .afm-tl{height:52px;margin:4px 14px}
  .afm-tl .tline{top:22px}
  .afm-tl .tdot{top:16px}
  .afm-tl .tdot b{font-size:9px}
  .afm-tl .tdot:not(.dn) b{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);margin:0}
  .afm-call{font-size:14px;padding:12px 2px 0}
}

    bio: `인류가 물질의 최소 단위를 탐구하기 시작한 최초의 기록은 고대 그리스 철학입니다.\n\n데모크리토스는 "아토모스(Atomos)"라는 개념을 선포하며 우주가 <b>'더 이상 쪼갤 수 없는 미립자'</b>와 그것들이 상호 배열하고 통과하기 위한 <b>'진공(Void)'</b>으로 구성된다고 여겼습니다.\n\n하지만 이 주장은 강력한 논리학자였던 아리스토텔레스의 "연속설(물질 무한분할설 및 진공 무존재설)"에 밀려 서양 과학사 전면에서 매장되는 결과를 초래했습니다. 그러나 이 사변적인 원자론은 기나긴 중세를 지난 후 과학혁명의 결정적 시발점으로 작용했습니다.`,
    theories: [
      { year: 'B.C. 430', name: '아토모스 가설', desc: '영원히 생성과 소멸을 겪지 않고, 성질이 변하지 않는 물질적 최소 단위를 정의.' },

      { year: 'B.C. 350', name: '아리스토텔레스 연속설', desc: '4원소설(흙, 물, 불, 공기)을 기반으로, 진공은 존재하지 않으며 무한히 세분할 수 있다는 주도적 설득.' }

    classroom: '스스로 답해보기: 당시 과학적 실험 도구가 없던 고대 그리스 시절, 아리스토텔레스의 연속설이 어떻게 2,000년 동안 서양을 지배할 수 있었을까요? 눈에 보이지 않는 공백(진공)에 대한 인간의 원초적 직관 공포와 종교 교리와의 논리적 융합 구조를 중심에 놓고 고민해 봅시다.',

    bio: `존 돌턴은 기체의 압력과 성분 원소들의 반응 분석 등 당대 실험 화학의 측정 법칙을 일관되게 규명하기 위해 고대 그리스 철학을 화학 정량론으로 재탄생시켰습니다.\n\n그는 물질을 <b>'더 이상 쪼갤 수 없고 내부가 꽉 채워져 표면이 극도로 조밀한 딱딱한 공(Solid Sphere)'</b>으로 상상했습니다. 이 모델은 라부아지에의 '질량 보존 법칙'과 프루스트의 '일정 성분비 법칙'을 우아하게 수학적으로 해소했습니다.\n\n그러나 원자가 또 다른 내부 구성 전하들로 세분될 수 있다는 점을 눈치채지 못해 이후의 전기적 물리학 혁명 단계로 이행하게 됩니다.`,

      { year: '1808', name: '상대 원자량표 수립', desc: '수소를 기준(1)으로 각 원소의 상대 원자량을 최초로 측정·정리.' }

  {

    bio: `러더퍼드는 얇게 연마한 금박에 무겁고 빠른 에너지의 알파($\\alpha$, 헬륨 이온) 입자를 정면 충돌시키는 투과도 실험을 진행했습니다. 예상대로라면 푸딩처럼 부드러운 원자를 그대로 관통해야 할 알파 입자 중 극히 일부(약 $1/8000$)가 마치 강철 판에 부딪힌 듯 극단적으로 튕겨 산란되는 물리 현상을 맞닥뜨렸습니다.\n\n이 데이터를 토대로 러더퍼드는 양전하와 원자 질량의 $99.9\\%$ 이상이 중심의 극소 공간에 초고밀도로 집중되어 자리하는 <b>'원자핵(Nucleus)'</b>의 존재를 증명했습니다. 전자는 광활하게 빈 주변 궤도를 태양계 행성처럼 원운동하는 <b>행성식 모형</b>을 전개했습니다.`,

      { year: '1919', name: '최초의 인공적 원소 전환', desc: '질소 기체에 알파선을 충돌시켜 산소 동위원소와 양성자로 전이시킴으로써 원소의 불변성을 부정.' }

    classroom: '스스로 답해보기: 러더퍼드의 행성 모형이 마주한 고전 전자기학 및 물리적 치명적인 결함은 무엇이었을까요? 가속 원운동하는 전하를 띤 전자가 지속적으로 방출해야 하는 전자기 붕괴 에너지와 궤도 손실의 인과 관계를 토대로 서술해 봅시다.',

function getSLIDES() {
  return lang === 'ko' ? SLIDES_KO : SLIDES_EN;
}

// ==================== LANGUAGE TOGGLE ====================
function setLang(l) {
  lang = l;
  // body[data-lang] 속성 갱신 → CSS font-override 블록이 EN 모드 감지에 사용
  document.body.setAttribute('data-lang', l);
  document.getElementById('btnKo').classList.toggle('active-lang', l === 'ko');
  document.getElementById('btnEn').classList.toggle('active-lang', l === 'en');
  const T = UI[lang];
  document.getElementById('hTitle').textContent = T.hTitle;
  document.getElementById('eraAll').textContent   = T.eraAll;
  document.getElementById('eraBasic').textContent = T.eraBasic;
  document.getElementById('eraExp').textContent   = T.eraExp;
  document.getElementById('eraQ').textContent     = T.eraQ;
  buildSidebar(currentEraFilter);
  if (currentId) {
    const slide = getSLIDES().find(s => s.id === currentId);
    if (slide) renderDetail(slide);
  } else {
    document.getElementById('detail').innerHTML = `<div class="detail-empty"><div class="icon-ring"></div><p>${T.emptyMsg}</p></div>`;
  }
}

// ==================== SIDEBAR BUILD ====================
function buildSidebar(filter) {
  currentEraFilter = filter;
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = '';
  const T = UI[lang];
  const SLIDES = getSLIDES();

  const eras = ['basic', 'experimental', 'quantum'];
  const eraColors = {
    basic:        { tag: '#0F8C50', tagBg: '#E5F4EC', tagBorder: '#cbeadd' },
    experimental: { tag: '#7030A0', tagBg: '#F0E6F6', tagBorder: '#d9b8ed' },
    quantum:      { tag: '#e0735a', tagBg: '#FCECE9', tagBorder: '#f5c8be' }
  };

  eras.forEach(eraId => {
    const slides = SLIDES.filter(s => s.era === eraId && (filter === 'all' || filter === eraId));
    if (slides.length === 0) return;

    const grp = document.createElement('div');
    grp.className = 'era-group';

    const hdr = document.createElement('div');
    hdr.className = 'era-header';
    hdr.innerHTML = `
      <span class="era-label" style="color:${eraColors[eraId].tag}">${T.eraLabels[eraId]}</span>
      <span class="era-line"></span>
      <span class="era-range">${T.eraRanges[eraId]}</span>
      <span class="era-toggle">▾</span>
    `;
    grp.appendChild(hdr);

    const cardsWrap = document.createElement('div');
    cardsWrap.className = 'era-cards';
    const ec = eraColors[eraId];

    slides.forEach(slide => {
      const card = document.createElement('div');
      card.className = 'sci-card' + (currentId === slide.id ? ' active' : '');
      card.id = `card-${slide.id}`;
      const tagHtml = slide.tags.map(t =>
        `<span class="sci-tag" style="background:${ec.tagBg};color:${ec.tag};border:1px solid ${ec.tagBorder}">${t}</span>`
      ).join('');
      card.innerHTML = `
        <div class="sci-year">${slide.chapter}</div>
        <div class="sci-info">
          <div class="sci-name">${slide.nameKr}</div>
          <div class="sci-nation">${slide.period}</div>
          <div class="sci-tags">${tagHtml}</div>
        </div>
      `;
      card.addEventListener('click', () => selectSlide(slide.id));
      cardsWrap.appendChild(card);
    });

    hdr.addEventListener('click', () => {
      const isCollapsed = cardsWrap.classList.toggle('collapsed');
      hdr.classList.toggle('collapsed', isCollapsed);
    });

    grp.appendChild(cardsWrap);
    sidebar.appendChild(grp);
  });
}

// ==================== SLIDE SELECTION ====================
function selectSlide(id) {
  document.querySelectorAll('.sci-card').forEach(c => c.classList.remove('active'));
  const SLIDES = getSLIDES();
  const slide = SLIDES.find(s => s.id === id);
  if (!slide) return;
  currentId = id;

  const card = document.getElementById(`card-${id}`);
  if (card) {
    const wrap = card.closest('.era-cards');
    if (wrap && wrap.classList.contains('collapsed')) {
      wrap.classList.remove('collapsed');
      wrap.previousElementSibling?.classList.remove('collapsed');
    }
    card.classList.add('active');
    card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  renderDetail(slide);
}

// ==================== RENDER DETAIL ====================

<script id="af-kit-js">
/* ============ Benedu animated-figure kit (ported from Basic Course ch02–05) ============
   A figure is <div class="af" data-af="NAME"></div>. AF.B[NAME](box) fills the box and
   returns {draw(dt)}; one shared rAF loop draws figures that are on screen and drops
   figures whose box has left the DOM (the lecture re-renders the panel on every
   chapter / language change, so figures are rebuilt in the new language).            */
(function(){
  'use strict';
  var AF = window.AF = {B:{}, figs:[]};
  AF.ko = function(){ try { return lang === 'ko'; } catch(e){ return document.documentElement.lang === 'ko'; } };
  AF.L = function(en, ko){ return AF.ko() ? ko : en; };
  AF.cv = function(w, h, cls){
    var c = document.createElement('canvas'); c.width = w*2; c.height = h*2;
    if(cls) c.className = cls; c.style.aspectRatio = w + ' / ' + h; return c;
  };
  AF.chips = function(btns, fn){
    btns.forEach(function(b){ b.addEventListener('click', function(ev){ ev.stopPropagation();
      btns.forEach(function(x){ x.classList.toggle('on', x === b); }); fn(b); }); });
  };
  AF.q = function(box, sel){ return box.querySelector(sel); };
  AF.qa = function(box, sel){ return [].slice.call(box.querySelectorAll(sel)); };
  function vis(el){ var r = el.getBoundingClientRect(); return r.width > 0 && r.bottom > -40 && r.top < innerHeight + 40; }
  var last = performance.now();
  function loop(now){
    var dt = Math.min((now - last)/1000, 0.05); last = now;
    for(var i = AF.figs.length - 1; i >= 0; i--){
      var f = AF.figs[i];
      if(!f.el.isConnected){ AF.figs.splice(i, 1); continue; }
      if(vis(f.el)){ try { f.draw(dt); } catch(err){ console.error('[AF]', err); AF.figs.splice(i, 1); } }
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  AF.mount = function(root){
    [].forEach.call((root || document).querySelectorAll('[data-af]'), function(box){
      if(box._af) return; box._af = 1;
      var b = AF.B[box.dataset.af]; if(!b) return;
      var r = b(box); if(r && r.draw) AF.figs.push({el: box, draw: r.draw});
    });
  };
  var pending = false;
  var mo = new MutationObserver(function(){
    if(pending) return; pending = true;
    Promise.resolve().then(function(){ pending = false; AF.mount(document); });
  });
  function start(){ mo.observe(document.body, {childList: true, subtree: true}); AF.mount(document); }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

/* ============ ATOM STAGE (Basic Course ch03): Bohr atom + energy ladder ============ */
(function(){
  var L = AF.L, GS = '"Google Sans","Gowun Batang",sans-serif';
  function wlCol(nm){

    if(nm<440){ r=-(nm-440)/60; b=1; } else if(nm<490){ g=(nm-440)/50; b=1; } else if(nm<510){ g=1; b=-(nm-510)/20; }
    else if(nm<580){ r=(nm-510)/70; g=1; } else if(nm<645){ r=1; g=-(nm-645)/65; } else { r=1; }
    var f = nm>700 ? .35+.65*(750-nm)/50 : nm<420 ? .35+.65*(nm-380)/40 : 1;
    function h(v){ return Math.round(255*Math.pow(Math.max(0,v*f),.8)); }
    return 'rgb('+h(r)+','+Math.max(h(g),40)+','+Math.max(h(b),40)+')';
  }
  function H_E(n){ return n===0 ? 0 : -13.6/(n*n); }
  function H_dE(a,b){ return Math.abs(H_E(a)-H_E(b)); }
  function H_lam(a,b){ return 1239.84/H_dE(a,b); }
  var H_NM = {'3-2':'Hα','4-2':'Hβ','5-2':'Hγ','6-2':'Hδ'};

    function rN(n){ return n===0 ? P.R*2.2 : P.R*(.14+.86*(n*n-1)/(P.N*P.N-1)); }
    function Y(e){ return P.ly0 + Math.sqrt(-e/13.6)*(P.ly1-P.ly0); }
    function ease(x){ x = Math.max(0,Math.min(1,x)); return x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2; }
    function wrap(x){ while(x>PI) x-=2*PI; while(x<=-PI) x+=2*PI; return x; }
    function period(Lm){ var k = Math.log(Math.max(90,Math.min(1900,Lm))/90)/Math.log(1900/90); return 6+20*k; }

      S.cur=n; S.rad=rN(n); S.ladY=Y(H_E(n)); S.alpha=1;
    }
    function after(sec, fn){ S.timers.push({t:sec, fn:fn}); }

    function go(to, mode, cb, keep){
      if(S.busy || to===S.cur) return false;
      var from = S.cur, up = to===0 || to>from, Lm = H_lam(from,to), col = wlCol(Lm), d = H_dE(from,to);
      var r0 = S.rad, r1 = rN(to), y0 = S.ladY, y1 = to===0 ? P.ly0-30 : Y(H_E(to));
      var a0 = S.ang, da = wrap(PI - S.ang);
      S.busy = true; S.arrow = {y0:y0, y1:y1, p:0, col:col, d:d, L:Lm, up:up, coll:mode==='collision'};
      var t = 0, hit = false;
      if(up){
        var TA = .95, TR = to===0 ? 1.3 : .85;
        var hx = P.ax - r0, hy = P.ay;
        if(mode==='collision') S.proj = {x0:-24, y0:P.ay-100, x1:hx-4, y1:hy-2, tr:[], x:-24, y:P.ay-100, free:false};
        else S.photons.push({x0:-90, y0:hy, x1:hx-6, y1:hy, dur:TA, t:0, L:Lm, col:col, inb:true});
        S.anim = function(dt){

    }

    function draw(dt){

        c.fillStyle = on ? 'rgba(143,233,255,.95)' : 'rgba(220,235,255,.4)'; c.font = (on?'700 ':'500 ')+'10px JetBrains Mono, monospace'; c.textAlign = 'center';

    toB.forEach(function(b){ b.addEventListener('click', function(){ stopAuto(); to = +b.dataset.to; mark(); info(); }); });

          wait = .9; }
      }
      A.draw(dt);
    }};
  };

  /* ---- step-driven stories (excitation / ionization–recombination) ---- */
  function storyFig(box, opt){
    box.innerHTML =
      '<div class="af-stage"><div class="af-tag">'+opt.tag+'</div><div class="af-ov"><button class="af-chip afPrev" type="button">◀</button><button class="af-chip afNext" type="button">'+L('Next step ▶','다음 단계 ▶')+'</button><button class="af-chip afPlay" type="button">'+L('↻ Play all','↻ 전체 재생')+'</button></div></div>'+
      '<div class="af-panel"><div class="af-steps">'+opt.steps.map(function(s,i){
        return '<button type="button" class="af-step" data-i="'+i+'"><span class="no">'+(i+1)+'</span><span><span class="tt" style="display:block">'+s[0]+'</span><span class="dd" style="display:block">'+s[1]+'</span></span></button>'; }).join('')+
      '</div>'+(opt.why ? '<div class="af-why">'+opt.why+'</div>' : '')+'</div>';
    var cv = AF.cv(560, 430); box.querySelector('.af-stage').insertBefore(cv, box.querySelector('.af-ov'));
    var A = AtomStage(cv, opt.P), step = 0, n = opt.steps.length, st = AF.qa(box,'.af-step');
    function mark(){ st.forEach(function(b,i){ b.classList.toggle('on', i<=step); b.classList.toggle('cur', i===step); }); }
    function goTo(s){
      s = Math.max(0, Math.min(n-1, s));
      if(s === step+1) opt.fwd(A, s); else opt.stat(A, s);
      step = s; mark();
    }
    AF.q(box,'.afNext').addEventListener('click', function(){ goTo(step >= n-1 ? 0 : step+1); });
    AF.q(box,'.afPrev').addEventListener('click', function(){ goTo(step-1); });
    st.forEach(function(b){ b.addEventListener('click', function(){ goTo(+b.dataset.i); }); });
    AF.q(box,'.afPlay').addEventListener('click', function(){ step = n-1; mark(); opt.replay(A); });
    opt.stat(A, 0); mark();
    return {draw:function(dt){ A.draw(dt); }};
  }

              [L('Ionization','이온화'), L('A fast electron brings at least 13.6 eV and knocks it out: one ion, two free electrons.','빠른 전자가 13.6 eV 이상을 가져와 전자를 떼어냅니다. 이온 하나와 자유 전자 두 개가 남습니다.')],
              [L('Recombination','재결합'), L('The ion catches a slow free electron. The extra energy leaves as one photon.','이온이 느린 자유 전자를 붙잡습니다. 남는 에너지는 광자 하나로 나갑니다.')],
              [L('Cascade, glow','계단식으로 내려오며 빛'), L('Caught on a high level, the electron steps down and emits light at each step.','높은 준위에 붙잡힌 전자는 한 계단씩 내려오며 그때마다 빛을 냅니다.')]],
      why: L('In a steady plasma, ionization and recombination <b>balance</b>: A + e⁻ → A⁺ + 2e⁻ and A⁺ + e⁻ → A + hν.','안정된 플라즈마에서는 이온화와 재결합이 <b>균형</b>을 이룹니다: A + e⁻ → A⁺ + 2e⁻ , A⁺ + e⁻ → A + hν.'),
      stat: function(A, s){ if(s===1) A.free(); else if(s===2) A.set(3); else A.set(1); },
      fwd: function(A, s){ if(s===1) ionize(A); else if(s===2) catchIt(A); else if(s===3) fall(A); },
