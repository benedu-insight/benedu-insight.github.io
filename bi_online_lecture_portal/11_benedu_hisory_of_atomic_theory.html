<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>History of Atomic Theory — Benedu Insight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style id="font-override">
  /* EN 모드: 모든 요소에 Google Sans 적용 */
  body[data-lang="en"],
  body[data-lang="en"] * {
    font-family: 'Google Sans', 'Segoe UI', system-ui, sans-serif !important;
  }
  /* 모노스페이스 요소는 그대로 유지 */
  body[data-lang="en"] header p,
  body[data-lang="en"] .lang-btn,
  body[data-lang="en"] .era-btn,
  body[data-lang="en"] #scale-indicator,
  body[data-lang="en"] .sidebar-section-label,
  body[data-lang="en"] .era-range,
  body[data-lang="en"] .sci-year,
  body[data-lang="en"] .sci-tag,
  body[data-lang="en"] .detail-era-tag,
  body[data-lang="en"] .detail-meta,
  body[data-lang="en"] .model-img-source,
  body[data-lang="en"] .quote-attr,
  body[data-lang="en"] .section-title,
  body[data-lang="en"] .eq-block,
  body[data-lang="en"] .theory-year,
  body[data-lang="en"] .eq-infographic-caption,
  body[data-lang="en"] .video-badge,
  body[data-lang="en"] .video-thumb-label,
  body[data-lang="en"] .video-source,
  body[data-lang="en"] .toolbar-btn,
  body[data-lang="en"] code,
  body[data-lang="en"] pre {
    font-family: 'JetBrains Mono', 'Fira Mono', monospace !important;
  }
  /* Montserrat 제목류는 Google Sans로 통일 */
  body[data-lang="en"] header h1,
  body[data-lang="en"] .detail-name,
  body[data-lang="en"] .video-title,
  body[data-lang="en"] .theory-name,
  body[data-lang="en"] .era-label,
  body[data-lang="en"] h1,
  body[data-lang="en"] h2,
  body[data-lang="en"] h3 {
    font-family: 'Google Sans', 'Segoe UI', system-ui, sans-serif !important;
  }
</style>

  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']]
    },
    startup: {
      ready: function () {
        MathJax.startup.defaultReady();
        const panel = document.getElementById('detail');
        if (panel && window.MathJax.typesetPromise) {
          MathJax.typesetPromise([panel]).catch(function (err) {

          });
        }
      }
    }
  };

<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<style>
  :root {
    --bg:          #F7F8FA;
    --bg2:         #FFFFFF;
    --bg3:         #F0E6F6;
    --bg4:         #E5F4EC;
    --green:       #0F8C50;
    --green-soft:  #E5F4EC;
    --green-mid:   #cbeadd;
    --green-dark:  #0a6b3d;
    --purple:      #7030A0;
    --purple-soft: #F0E6F6;
    --purple-mid:  #d9b8ed;
    --purple-dark: #521a78;
    --charcoal:    #2D2D2D;
    --text:        #2D2D2D;
    --text2:       #6B7280;
    --text3:       #9CA3AF;
    --border:      #E5E7EB;
    --border2:     #F3F4F6;
    --shadow:      0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md:   0 4px 12px rgba(0,0,0,0.08);
    --max-w:       1400px;
    --scale:       1.0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Gowun Batang', serif;
    min-height: 100vh;
    width: 100%;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header ── */
  header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 0.55rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    box-shadow: var(--shadow);
    width: 100%;
    max-width: var(--max-w);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-logo {
    height: 38px;
    width: auto;
    flex-shrink: 0;
  }
  .header-divider {
    width: 1px;
    height: 28px;
    background: var(--border);
    flex-shrink: 0;
  }
  .header-title-block { }
  header h1 {
    font-family: 'Google Sans', 'Gowun Batang', sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--purple);
    letter-spacing: 0.02em;
    line-height: 1.2;
  }
  header p {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.55rem;
    color: var(--text3);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 2px;
  }
  .header-actions {
    margin-left: auto;
    display: flex;
    gap: 0.5rem;
    align-items: center;
    flex-wrap: wrap;
  }

  /* Language Toggle */
  .lang-toggle {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    background: var(--bg);
  }
  .lang-btn {
    padding: 3px 12px;
    border: none;
    background: transparent;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem;
    font-weight: 500;
    color: var(--text3);
    transition: all 0.2s;
  }
  .lang-btn.active-lang {
    background: var(--purple);
    color: #fff;
  }

  /* Era Filter */
  .era-filter {
    display: flex;
    gap: 0.4rem;
    flex-wrap: wrap;
    align-items: center;
  }
  .era-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text2);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem;
    padding: 3px 12px;
    cursor: pointer;
    transition: all 0.18s;
  }
  .era-btn:hover {
    border-color: var(--purple-mid);
    color: var(--purple);
    background: var(--purple-soft);
  }
  .era-btn.active {
    background: var(--purple);
    border-color: var(--purple);
    color: #fff;
  }

  .toolbar-btn {
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg2);
    color: var(--text);
    padding: 3px 9px;
    font-size: 0.62rem;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    transition: all 0.15s;
  }
  .toolbar-btn:hover {
    border-color: var(--purple-mid);
    background: var(--purple-soft);
    color: var(--purple-dark);
  }
  #scale-indicator {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.58rem;
    color: var(--text3);
    min-width: 32px;
    text-align: center;
  }

  /* ── Layout ── */
  .layout {
    display: grid;
    grid-template-columns: 270px 1fr;
    height: calc(100vh - 58px);
    width: 100%;
    max-width: var(--max-w);
  }

  /* ── Timeline Sidebar ── */
  .timeline-sidebar {
    border-right: 1px solid var(--border);
    overflow-y: auto;
    background: var(--bg2);
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
    display: flex;
    flex-direction: column;
  }
  .timeline-sidebar::-webkit-scrollbar { width: 4px; }
  .timeline-sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .sidebar-section-label {
    padding: 0.6rem 1.1rem 0.35rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.55rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text3);
    border-bottom: 1px solid var(--border2);
    position: sticky;
    top: 0;
    background: var(--bg2);
    z-index: 5;
  }
  .sidebar-section-label:not(:first-child) {
    border-top: 2px solid var(--border);
    margin-top: 0.2rem;
  }

  .era-header {
    position: sticky;
    top: 0;
    background: var(--bg2);
    padding: 0.65rem 1rem 0.45rem;
    border-bottom: 1px solid var(--border2);
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    cursor: pointer;
    user-select: none;
  }
  .era-header:hover { background: var(--bg); }
  .era-label {
    font-family: 'Gowun Batang', serif;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .era-line { flex: 1; height: 1px; background: var(--border); }
  .era-range {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.55rem;
    color: var(--text3);
    letter-spacing: 0.04em;
  }
  .era-toggle {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--border2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.6rem;
    color: var(--text3);
    transition: background 0.15s, transform 0.22s;
  }
  .era-header.collapsed .era-toggle { transform: rotate(-90deg); }
  .era-header:hover .era-toggle { background: var(--border); color: var(--text2); }
  .era-cards {
    overflow: hidden;
    max-height: 2000px;
    transition: max-height 0.3s ease, opacity 0.25s ease;
    opacity: 1;
  }
  .era-cards.collapsed { max-height: 0; opacity: 0; }

  /* Nav Item */
  .sci-card {
    padding: 0.75rem 1rem 0.75rem 1.1rem;
    border-bottom: 1px solid var(--border2);
    cursor: pointer;
    position: relative;
    transition: background 0.15s;
    display: flex;
    gap: 0.65rem;
    align-items: flex-start;
    border-left: 4px solid transparent;
  }
  .sci-card:hover { background: var(--bg); }
  .sci-card.active { background: var(--purple-soft); border-left-color: var(--purple); }
  .sci-year {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.58rem;
    color: var(--text3);
    min-width: 48px;
    padding-top: 2px;
    line-height: 1.4;
  }
  .sci-info { flex: 1; min-width: 0; }
  .sci-name {
    font-size: 0.83rem;
    font-weight: 700;
    color: var(--charcoal);
    line-height: 1.3;
  }
  .sci-card.active .sci-name { color: var(--purple-dark); }
  .sci-nation {
    font-size: 0.6rem;
    color: var(--text3);
    margin-top: 1px;
    font-family: 'Gowun Batang', serif;
  }
  .sci-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
    margin-top: 4px;
  }
  .sci-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.52rem;
    padding: 1px 6px;
    border-radius: 8px;
    letter-spacing: 0.03em;
  }

  /* ── Detail Panel ── */
  .detail-panel {
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
  }
  .content-toolbar {
    background: rgba(247,248,250,0.96);
    backdrop-filter: blur(8px);
    padding: 0.45rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.5rem;
    border-bottom: 1px solid var(--border);
    z-index: 10;
    flex-shrink: 0;
  }
  .toolbar-left { display: flex; gap: 0.35rem; flex-wrap: wrap; align-items: center; }
  .toolbar-right { display: flex; gap: 0.35rem; align-items: center; }

  #detail {
    flex: 1;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  #detail::-webkit-scrollbar { width: 4px; }
  #detail::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .detail-content { padding: 1.5rem; max-width: 880px; margin: 0 auto; }

  /* Hero */
  .detail-hero {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.4rem 1.6rem;
    margin-bottom: 1.1rem;
    box-shadow: var(--shadow);
  }
  .detail-era-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.55rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 2px 9px;
    border-radius: 10px;
    font-weight: 500;
  }
  .detail-name {
    font-family: 'Google Sans', 'Montserrat', sans-serif;
    font-size: calc(1.7rem * var(--scale));
    font-weight: 800;
    line-height: 1.1;
    color: var(--purple);
    margin-bottom: 0.1rem;
    transition: font-size 0.15s ease-out;
  }
  .detail-name-kr {
    font-family: 'Gowun Batang', serif;
    font-size: calc(0.9rem * var(--scale));
    color: var(--text2);
    margin-bottom: 0.6rem;
    font-weight: 400;
    transition: font-size 0.15s ease-out;
  }
  .detail-meta {
    display: flex;
    gap: 1.25rem;
    flex-wrap: wrap;
    font-family: 'JetBrains Mono', monospace;
    font-size: calc(0.62rem * var(--scale));
    color: var(--text2);
    padding-top: 0.6rem;
    border-top: 1px solid var(--border2);
    transition: font-size 0.15s ease-out;
  }

  /* Model Showcase */
  .model-showcase {
    display: flex;
    justify-content: center;
    align-items: center;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.75rem;
    margin-bottom: 1.1rem;
    box-shadow: var(--shadow);
  }
  .model-svg-wrapper { width: 260px; height: 260px; }
  .model-img-wrapper {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
  }
  .model-img-wrapper img {
    max-width: 100%;
    max-height: 320px;
    object-fit: cover;
    border-radius: 8px;
    box-shadow: var(--shadow-md);
  }
  .model-img-source {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem;
    color: var(--text3);
    text-align: center;
  }

  /* Quote */
  .quote-block {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.1rem;
    margin-bottom: 1.1rem;
    box-shadow: var(--shadow);
  }
  .quote-badge {
    flex: none;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--green-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    margin-top: 2px;
  }
  .quote-body { flex: 1; min-width: 0; }
  .quote-text {
    font-family: 'Gowun Batang', serif;
    font-style: italic;
    font-size: calc(0.88rem * var(--scale));
    color: var(--green-dark);
    line-height: 1.78;
    transition: font-size 0.15s ease-out;
  }
  .quote-attr {
    font-family: 'JetBrains Mono', monospace;
    font-size: calc(0.58rem * var(--scale));
    color: var(--text3);
    margin-top: 0.4rem;
    letter-spacing: 0.06em;
    transition: font-size 0.15s ease-out;
  }

  /* Bio */
  .detail-bio {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.1rem 1.4rem;
    font-size: calc(0.88rem * var(--scale));
    line-height: 1.85;
    color: var(--text);
    margin-bottom: 1.1rem;
    box-shadow: var(--shadow);
    transition: font-size 0.15s ease-out;
  }
  .detail-bio p + p { margin-top: 0.8em; }

  /* Section Titles */
  .section-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.58rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text3);
    margin-top: 1.5rem;
    margin-bottom: 0.75rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* Equations */
  .eq-block {
    background: var(--charcoal);
    border-radius: 8px;
    padding: 1.1rem 1.4rem;
    margin-bottom: 0.5rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: calc(0.9rem * var(--scale));
    color: #a8f5c8;
    letter-spacing: 0.04em;
    overflow-x: auto;
    transition: font-size 0.15s ease-out;
  }

  /* Theory cards */
  .theories-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 0.7rem;
    margin-bottom: 1.1rem;
  }
  .theory-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem;
    transition: box-shadow 0.18s, border-color 0.18s;
    box-shadow: var(--shadow);
  }
  .theory-card:hover { box-shadow: var(--shadow-md); border-color: var(--purple-mid); }
  .theory-year {
    font-family: 'JetBrains Mono', monospace;
    font-size: calc(0.58rem * var(--scale));
    letter-spacing: 0.06em;
    margin-bottom: 0.3rem;
    color: var(--green);
    font-weight: 500;
    transition: font-size 0.15s ease-out;
  }
  .theory-name {
    font-size: calc(0.85rem * var(--scale));
    font-weight: 700;
    color: var(--charcoal);
    margin-bottom: 0.3rem;
    line-height: 1.3;
    transition: font-size 0.15s ease-out;
  }
  .theory-desc {
    font-size: calc(0.75rem * var(--scale));
    color: var(--text2);
    line-height: 1.65;
    font-family: 'Gowun Batang', serif;
    transition: font-size 0.15s ease-out;
  }

  /* Classroom box */
  details.classroom-box {
    background: #FFFDF0;
    border: 1px dashed #EEDF8B;
    border-radius: 12px;
    padding: 1.1rem;
    margin-bottom: 1.1rem;
    cursor: pointer;
    transition: border 0.15s;
  }
  details.classroom-box[open] { border-style: solid; border-color: #D6C359; }
  details.classroom-box summary {
    font-family: 'Gowun Batang', serif;
    font-size: 0.82rem;
    font-weight: 700;
    color: #8C730F;
    outline: none;
    user-select: none;
  }
  .classroom-body {
    font-size: calc(0.76rem * var(--scale));
    line-height: 1.72;
    color: #6B5B1E;
    margin-top: 0.65rem;
    cursor: default;
    transition: font-size 0.15s ease-out;
  }

  /* Overview Dashboard */
  .overview-container {
    background: #EAEBED;
    border-radius: 14px;
    padding: 1.75rem 1.25rem;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    margin-bottom: 1.1rem;
    text-align: center;
  }
  .overview-grid {
    display: flex;
    gap: 0.65rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  .overview-card {
    flex: 1;
    min-width: 118px;
    max-width: 138px;
    background: #FFF;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.1rem 0.5rem;
    cursor: pointer;
    transition: transform 0.2s cubic-bezier(0.16,1,0.3,1), box-shadow 0.2s, border-color 0.2s;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    height: 210px;
    box-shadow: var(--shadow);
  }
  .overview-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-md); border-color: var(--purple-mid); }
  .overview-card-tag {
    background: #F3E15F;
    color: #2D2D2D;
    font-size: 0.56rem;
    font-weight: bold;
    padding: 2px 5px;
    border-radius: 4px;
    width: 100%;
    text-align: center;
    margin-top: 0.5rem;
    font-family: 'JetBrains Mono', monospace;
  }

  /* Summary Matrix */
  .summary-matrix {
    width: 100%;
    border-collapse: collapse;
    background: var(--bg2);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: var(--shadow);
    margin-bottom: 1.1rem;
  }
  .summary-matrix th, .summary-matrix td {
    padding: 0.65rem 0.9rem;
    font-size: calc(0.76rem * var(--scale));
    text-align: left;
    border-bottom: 1px solid var(--border);
    transition: font-size 0.15s ease-out;
  }
  .summary-matrix th {
    background: var(--purple-soft);
    color: var(--purple-dark);
    font-weight: 700;
    font-family: 'Gowun Batang', serif;
  }

  /* Connections */
  .conn-list { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1.5rem; }
  .conn-chip {
    background: var(--purple-soft);

    bio: `존 돌턴은 기체의 압력과 성분 원소들의 반응 분석 등 당대 실험 화학의 측정 법칙을 일관되게 규명하기 위해 고대 그리스 철학을 화학 정량론으로 재탄생시켰습니다.\n\n그는 물질을 <b>'더 이상 쪼갤 수 없고 내부가 꽉 채워져 표면이 극도로 조밀한 딱딱한 공(Solid Sphere)'</b>으로 상상했습니다. 이 모델은 라부아지에의 '질량 보존 법칙'과 프루스트의 '일정 성분비 법칙'을 우아하게 수학적으로 해소했습니다.\n\n그러나 원자가 또 다른 내부 구성 전하들로 세분될 수 있다는 점을 눈치채지 못해 이후의 전기적 물리학 혁명 단계로 이행하게 됩니다.`,

    bio: `러더퍼드는 얇게 연마한 금박에 무겁고 빠른 에너지의 알파($\\alpha$, 헬륨 이온) 입자를 정면 충돌시키는 투과도 실험을 진행했습니다. 예상대로라면 푸딩처럼 부드러운 원자를 그대로 관통해야 할 알파 입자 중 극히 일부(약 $1/8000$)가 마치 강철 판에 부딪힌 듯 극단적으로 튕겨 산란되는 물리 현상을 맞닥뜨렸습니다.\n\n이 데이터를 토대로 러더퍼드는 양전하와 원자 질량의 $99.9\\%$ 이상이 중심의 극소 공간에 초고밀도로 집중되어 자리하는 <b>'원자핵(Nucleus)'</b>의 존재를 증명했습니다. 전자는 광활하게 빈 주변 궤도를 태양계 행성처럼 원운동하는 <b>행성식 모형</b>을 전개했습니다.`,

function getSLIDES() {
  return lang === 'ko' ? SLIDES_KO : SLIDES_EN;
}

// ==================== LANGUAGE TOGGLE ====================
function setLang(l) {
  lang = l;
  // body[data-lang] 속성 갱신 → CSS font-override 블록이 EN 모드 감지에 사용
  document.body.setAttribute('data-lang', l);
  document.getElementById('btnKo').classList.toggle('active-lang', l === 'ko');
  document.getElementById('btnEn').classList.toggle('active-lang', l === 'en');
  const T = UI[lang];
  document.getElementById('hTitle').textContent = T.hTitle;
  document.getElementById('eraAll').textContent   = T.eraAll;
  document.getElementById('eraBasic').textContent = T.eraBasic;
  document.getElementById('eraExp').textContent   = T.eraExp;
  document.getElementById('eraQ').textContent     = T.eraQ;
  buildSidebar(currentEraFilter);
  if (currentId) {
    const slide = getSLIDES().find(s => s.id === currentId);
    if (slide) renderDetail(slide);
  } else {
    document.getElementById('detail').innerHTML = `<div class="detail-empty"><div class="icon-ring"></div><p>${T.emptyMsg}</p></div>`;
  }
}

// ==================== SIDEBAR BUILD ====================
function buildSidebar(filter) {
  currentEraFilter = filter;
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = '';
  const T = UI[lang];
  const SLIDES = getSLIDES();

  const eras = ['basic', 'experimental', 'quantum'];
  const eraColors = {
    basic:        { tag: '#0F8C50', tagBg: '#E5F4EC', tagBorder: '#cbeadd' },
    experimental: { tag: '#7030A0', tagBg: '#F0E6F6', tagBorder: '#d9b8ed' },
    quantum:      { tag: '#e0735a', tagBg: '#FCECE9', tagBorder: '#f5c8be' }
  };

  eras.forEach(eraId => {
    const slides = SLIDES.filter(s => s.era === eraId && (filter === 'all' || filter === eraId));
    if (slides.length === 0) return;

    const grp = document.createElement('div');
    grp.className = 'era-group';

    const hdr = document.createElement('div');
    hdr.className = 'era-header';
    hdr.innerHTML = `
      <span class="era-label" style="color:${eraColors[eraId].tag}">${T.eraLabels[eraId]}</span>
      <span class="era-line"></span>
      <span class="era-range">${T.eraRanges[eraId]}</span>
      <span class="era-toggle">▾</span>
    `;
    grp.appendChild(hdr);

    const cardsWrap = document.createElement('div');
    cardsWrap.className = 'era-cards';
    const ec = eraColors[eraId];

    slides.forEach(slide => {
      const card = document.createElement('div');
      card.className = 'sci-card' + (currentId === slide.id ? ' active' : '');
      card.id = `card-${slide.id}`;
      const tagHtml = slide.tags.map(t =>
        `<span class="sci-tag" style="background:${ec.tagBg};color:${ec.tag};border:1px solid ${ec.tagBorder}">${t}</span>`
      ).join('');
      card.innerHTML = `
        <div class="sci-year">${slide.chapter}</div>
        <div class="sci-info">
          <div class="sci-name">${slide.nameKr}</div>
          <div class="sci-nation">${slide.period}</div>
          <div class="sci-tags">${tagHtml}</div>
        </div>
      `;
      card.addEventListener('click', () => selectSlide(slide.id));
      cardsWrap.appendChild(card);
    });

    hdr.addEventListener('click', () => {
      const isCollapsed = cardsWrap.classList.toggle('collapsed');
      hdr.classList.toggle('collapsed', isCollapsed);
    });

    grp.appendChild(cardsWrap);
    sidebar.appendChild(grp);
  });
}

// ==================== SLIDE SELECTION ====================
function selectSlide(id) {
  document.querySelectorAll('.sci-card').forEach(c => c.classList.remove('active'));
  const SLIDES = getSLIDES();
  const slide = SLIDES.find(s => s.id === id);
  if (!slide) return;
  currentId = id;

  const card = document.getElementById(`card-${id}`);
  if (card) {
    const wrap = card.closest('.era-cards');
    if (wrap && wrap.classList.contains('collapsed')) {
      wrap.classList.remove('collapsed');
      wrap.previousElementSibling?.classList.remove('collapsed');
    }
    card.classList.add('active');
    card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  renderDetail(slide);
}

  panel.innerHTML = `
    <div class="detail-content">

  if (window.MathJax && typeof window.MathJax.typesetPromise === 'function') {

// ==================== SCALE CONTROL ====================
function adjustScale(amount) {
  if (amount === 0) { currentScale = 1.0; }
  else { currentScale = Math.max(0.8, Math.min(1.5, currentScale + amount)); }
  document.documentElement.style.setProperty('--scale', currentScale);
  const ind = document.getElementById('scale-indicator');
  if (ind) ind.textContent = Math.round(currentScale * 100) + '%';
}

// ==================== ERA FILTER BUTTONS ====================
document.querySelectorAll('.era-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.era-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    buildSidebar(btn.dataset.era);
    if (currentId) {
      setTimeout(() => {
        const card = document.getElementById(`card-${currentId}`);
        if (card) card.classList.add('active');
      }, 30);
    }
  });
});
