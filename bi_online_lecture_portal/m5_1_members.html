<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>RF Matching Application · Members · Benedu Insight</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/benedu-insight/benedu-insight.github.io/refs/heads/main/logo_png/benedu_insight_Symbol.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Google+Sans:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --font-en:'Google Sans','Segoe UI',system-ui,sans-serif;
    --font-ko:'Google Sans', 'Gowun Batang','Georgia',serif;
    --font-mono:'JetBrains Mono',monospace;
    --font-body: var(--font-en);
    --cream:#FAF9F5; --surface:#EFE9DE; --card:#FFFFFF;
    --ink:#252320; --steel:#6C6A64; --steel-soft:#A09D96; --hairline:#E6DFD8;
    --ink-black:#181715; --coral:#CC785C; --coral-tint:#F5E4DD;
    --purple:#7030A0; --lavender:#F0E6F6; --green:#0F8C50; --green-tint:#E5F4EC;
    --radius-card:14px; --radius-pill:9999px; --ease:cubic-bezier(0.4,0,0.2,1);
    --topbar:60px;
  }
  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{ font-family:var(--font-body); background:var(--cream); color:var(--ink); -webkit-font-smoothing:antialiased; }
  body.lang-ko{ --font-body: var(--font-ko); word-break:keep-all; }
  /* English words / numbers inside Korean text stay in Google Sans */
  body.lang-ko .en, body.lang-ko code, body.lang-ko .mono{ font-family:var(--font-en); }
  ::selection{ background:var(--coral-tint); }
  button{ font-family:inherit; cursor:pointer; }
  :focus-visible{ outline:2.5px solid var(--coral); outline-offset:2px; }

  /* ── Top bar ── */
  .topbar{ position:sticky; top:0; z-index:50; height:var(--topbar); display:flex; align-items:center; gap:14px;
    padding:0 22px; background:rgba(250,249,245,.94); backdrop-filter:blur(8px); border-bottom:1px solid var(--hairline); }
  .topbar img{ height:28px; width:auto; display:block; }
  .topbar .div{ width:1px; height:22px; background:var(--hairline); }
  .tb-title{ font-family:var(--font-en); font-size:.86rem; font-weight:700; color:var(--ink); }
  .tb-sub{ font-family:var(--font-mono); font-size:.58rem; color:var(--steel-soft); letter-spacing:.1em; text-transform:uppercase; }
  .tb-right{ margin-left:auto; display:flex; align-items:center; gap:10px; }
  .member-pill{ font-family:var(--font-mono); font-size:.6rem; font-weight:600; letter-spacing:.08em;
    background:var(--ink-black); color:#fff; padding:4px 10px; border-radius:var(--radius-pill); }
  .user-box{ display:none; align-items:center; gap:8px; font-family:var(--font-en); font-size:.74rem; color:var(--steel); }
  .user-box.show{ display:flex; }
  .btn-ghost{ border:1px solid var(--hairline); background:var(--card); color:var(--ink); border-radius:var(--radius-pill);
    padding:6px 13px; font-family:var(--font-en); font-size:.74rem; font-weight:600; transition:all .15s var(--ease); white-space:nowrap; }
  .btn-ghost:hover{ border-color:var(--coral); color:var(--coral); }
  .lang-toggle{ display:flex; border:1px solid var(--hairline); border-radius:var(--radius-pill); overflow:hidden; background:var(--card); }
  .lang-toggle button{ border:none; background:transparent; padding:5px 12px; font-family:var(--font-mono); font-size:.66rem; color:var(--steel); }
  .lang-toggle button.active{ background:var(--ink-black); color:#fff; }

  .wrap{ max-width:1180px; margin:0 auto; padding:38px 26px 60px; }
  .eyebrow{ font-family:var(--font-mono); font-size:.66rem; letter-spacing:.14em; color:var(--coral); text-transform:uppercase; font-weight:600; }
  h1{ font-size:2rem; line-height:1.25; margin:10px 0 12px; font-weight:800; letter-spacing:-.01em; }
  body.lang-ko h1{ font-weight:700; }
  .lead{ font-size:1rem; line-height:1.8; color:var(--steel); max-width:760px; }

  /* ── Gate (not signed in) ── */
  #gate{ display:none; }
  #gate.show{ display:block; }
  .gate-grid{ display:grid; grid-template-columns:1.15fr .85fr; gap:24px; margin-top:28px; align-items:start; }
  .notice{ background:var(--card); border:1px solid var(--hairline); border-radius:var(--radius-card); padding:28px; }
  .notice .lock{ width:44px; height:44px; border-radius:12px; background:var(--coral-tint); display:flex; align-items:center; justify-content:center; margin-bottom:16px; }
  .notice .lock svg{ width:22px; height:22px; fill:var(--coral); }
  .notice h2{ font-size:1.15rem; margin-bottom:10px; }
  .notice p{ font-size:.93rem; line-height:1.85; color:var(--steel); }
  .notice .mail{ display:inline-flex; align-items:center; gap:8px; margin-top:18px; text-decoration:none;
    background:var(--ink-black); color:#fff; padding:10px 18px; border-radius:var(--radius-pill); font-family:var(--font-en); font-size:.84rem; font-weight:600; }
  .notice .mail:hover{ background:var(--coral); }
  .notice ul{ margin:16px 0 0 18px; color:var(--steel); font-size:.88rem; line-height:1.9; }
  .login{ background:var(--card); border:1px solid var(--hairline); border-radius:var(--radius-card); padding:26px; }
  .login h2{ font-size:1.05rem; margin-bottom:4px; }
  .login .sub{ font-size:.82rem; color:var(--steel); margin-bottom:18px; line-height:1.6; }
  .field{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .field label{ font-family:var(--font-mono); font-size:.62rem; letter-spacing:.1em; text-transform:uppercase; color:var(--steel); }
  .field input{ border:1px solid var(--hairline); border-radius:10px; padding:11px 13px; font-family:var(--font-en); font-size:.92rem; background:var(--cream); color:var(--ink); }
  .field input:focus{ outline:none; border-color:var(--coral); background:#fff; }
  .id-wrap{ display:flex; align-items:stretch; }
  .id-wrap input{ flex:1; min-width:0; border-radius:10px 0 0 10px; }
  .id-suffix{ display:flex; align-items:center; padding:0 12px; border:1px solid var(--hairline); border-left:none;
    border-radius:0 10px 10px 0; background:var(--surface); color:var(--steel); font-family:var(--font-en); font-size:.86rem; white-space:nowrap; }
  .id-suffix{ display:none !important; }
  .id-wrap input{ border-radius:10px !important; }
  .id-wrap.full input{ border-radius:10px; }
  .btn-primary{ width:100%; border:none; border-radius:10px; padding:12px; background:var(--coral); color:#fff; font-family:var(--font-en); font-size:.9rem; font-weight:700; transition:background .15s; }
  .btn-primary:hover{ background:#b8664c; }
  .btn-primary:disabled{ background:var(--steel-soft); cursor:wait; }
  .link-btn{ border:none; background:none; color:var(--steel); font-size:.78rem; text-decoration:underline; margin-top:12px; }
  .msg{ font-size:.82rem; line-height:1.55; margin-top:12px; padding:9px 12px; border-radius:9px; display:none; }
  .msg.err{ display:block; background:#FCECE8; color:#A33A22; }
  .msg.ok{ display:block; background:var(--green-tint); color:#0A6B3C; }

  /* ── Course list (signed in) ── */
  #hub{ display:none; }
  #hub.show{ display:block; }
  .topics{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:20px; margin-top:30px; }
  .topic{ background:var(--card); border:1px solid var(--hairline); border-radius:var(--radius-card); padding:24px 24px 20px;
    display:flex; flex-direction:column; transition:box-shadow .2s var(--ease), transform .2s var(--ease); }
  .topic:hover{ box-shadow:0 10px 30px rgba(37,35,32,.08); transform:translateY(-2px); }
  .topic-head{ display:flex; align-items:baseline; gap:12px; margin-bottom:6px; }
  .topic-num{ white-space:nowrap; flex-shrink:0; font-family:var(--font-en); font-size:2rem; font-weight:800; color:var(--coral); line-height:1; letter-spacing:-.02em; }
  .topic-num small{ font-size:.95rem; font-weight:700; margin-left:4px; letter-spacing:0; }
  .topic-tag{ font-family:var(--font-mono); font-size:.6rem; letter-spacing:.1em; text-transform:uppercase; color:var(--steel-soft); }
  .topic h3{ font-size:1.12rem; line-height:1.4; margin:4px 0 10px; }
  .topic p{ font-size:.88rem; line-height:1.8; color:var(--steel); flex:1; }
  .decks{ display:flex; flex-direction:column; gap:8px; margin-top:18px; }
  .deck-btn{ display:flex; align-items:center; gap:12px; text-align:left; width:100%; border:1px solid var(--hairline);
    background:var(--cream); border-radius:11px; padding:11px 14px; transition:all .15s var(--ease); color:var(--ink); }
  .deck-btn:hover{ border-color:var(--coral); background:#fff; }
  .deck-kind{ flex-shrink:0; font-family:var(--font-mono); font-size:.58rem; font-weight:600; letter-spacing:.08em; padding:3px 8px; border-radius:6px; }
  .k-key{ background:var(--ink-black); color:#fff; }
  .k-adv{ background:var(--lavender); color:var(--purple); }
  .k-app{ background:var(--green-tint); color:var(--green); }
  .k-sim{ background:var(--coral-tint); color:var(--coral); }
  /* Mini window: screenshot of the app; on hover (pointer devices) the live app loads in its place */
  .mini{ display:block; width:100%; padding:0; margin:0 0 18px; text-align:left; border:1px solid var(--hairline);
    border-radius:11px; overflow:hidden; background:var(--card); box-shadow:0 2px 10px rgba(37,35,32,.05);
    transition:box-shadow .2s var(--ease), border-color .2s var(--ease); }
  .mini:hover{ border-color:var(--steel-soft); box-shadow:0 8px 24px rgba(37,35,32,.12); }
  .mini-bar{ display:flex; align-items:center; gap:6px; height:26px; padding:0 10px; background:var(--surface); border-bottom:1px solid var(--hairline); }
  .mini-bar i{ width:8px; height:8px; border-radius:50%; background:var(--steel-soft); opacity:.55; flex-shrink:0; }
  .mini-url{ flex:1; min-width:0; margin-left:6px; font-family:var(--font-mono); font-size:.6rem; color:var(--steel);
    background:var(--card); border-radius:5px; padding:2px 8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mini-live{ font-family:var(--font-mono); font-size:.55rem; font-weight:600; letter-spacing:.08em; color:var(--steel-soft); flex-shrink:0; }
  .mini.live .mini-live{ color:var(--green); }
  .mini-view{ position:relative; aspect-ratio:16/10; overflow:hidden; background:#F4F5F6; }
  .mini-view img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:top left; display:block; }
  /* the live frame renders at 1440×900 and is scaled down to the card width (--s set by ResizeObserver) */
  .mini-view iframe{ position:absolute; top:0; left:0; width:1440px; height:900px; border:0; transform-origin:0 0;
    transform:scale(var(--s, .3)); pointer-events:none; opacity:0; transition:opacity .35s var(--ease); background:#fff; }
  .mini.live .mini-view iframe{ opacity:1; }
  .mini-open{ position:absolute; right:10px; bottom:10px; font-family:var(--font-en); font-size:.7rem; font-weight:700;
    background:rgba(24,23,21,.82); color:#fff; padding:5px 11px; border-radius:var(--radius-pill); opacity:0; transform:translateY(4px);
    transition:all .2s var(--ease); }
  .mini:hover .mini-open, .mini:focus-visible .mini-open{ opacity:1; transform:none; }
  .deck-name{ font-size:.86rem; font-weight:600; flex:1; line-height:1.4; }
  .deck-arrow{ color:var(--steel-soft); font-size:1rem; }

  /* ── Viewer ── */
  #viewer{ display:none; position:fixed; inset:var(--topbar) 0 0 0; background:var(--cream); z-index:40; flex-direction:column; }
  #viewer.show{ display:flex; }
  .v-bar{ display:flex; align-items:center; gap:10px; padding:9px 16px; border-bottom:1px solid var(--hairline); background:var(--card); flex-wrap:wrap; }
  .v-title{ font-weight:700; font-size:.9rem; margin-right:6px; }
  .v-tabs{ display:flex; gap:6px; }
  .v-tab{ border:1px solid var(--hairline); background:var(--cream); border-radius:var(--radius-pill); padding:5px 12px; font-family:var(--font-en); font-size:.72rem; font-weight:600; color:var(--steel); }
  .v-tab.active{ background:var(--ink-black); color:#fff; border-color:var(--ink-black); }
  .v-right{ margin-left:auto; display:flex; gap:8px; }
  .v-frame-wrap{ flex:1; padding:12px; min-height:0; }
  #deckFrame{ width:100%; height:100%; border:1px solid var(--hairline); border-radius:12px; background:#fff; display:block; }

  .loading{ text-align:center; padding:120px 20px; font-family:var(--font-mono); font-size:.72rem; color:var(--steel-soft); letter-spacing:.12em; }
  footer{ text-align:center; padding:26px 20px 40px; font-family:var(--font-en); font-size:.76rem; color:var(--steel-soft); }
  footer a{ color:var(--steel); }

  @media (max-width:860px){
    .gate-grid, .topics{ grid-template-columns:1fr; }
    h1{ font-size:1.6rem; }
    .tb-sub{ display:none; }
  }
</style>
</head>
<body>

<header class="topbar">
  <a href="https://benedu-insight.github.io/" target="_blank" rel="noopener noreferrer" aria-label="Benedu Insight">
    <img src="https://benedu-insight.github.io/logo_png/benedu_insight_logo_EN_horizontal.png" alt="Benedu Insight">
  </a>
  <div class="div"></div>
  <div>
    <div class="tb-title">RF Matching Application</div>
    <div class="tb-sub">Class 02 · Module 05-1 · Members</div>
  </div>
  <div class="tb-right">
    <span class="member-pill">MEMBERS ONLY</span>
    <button class="btn-ghost" id="btnNewWin" style="display:none" onclick="openNewWindow()"></button>
    <div class="user-box" id="userBox">
      <span id="userEmail"></span>
      <button class="btn-ghost" id="btnSignOut"></button>
    </div>
    <div class="lang-toggle">
      <button id="btnEn" onclick="setHubLang('en')">EN</button>
      <button id="btnKo" onclick="setHubLang('ko')">KO</button>
    </div>
  </div>
</header>

<div id="boot" class="loading">CHECKING MEMBERSHIP…</div>

<!-- ── Gate: shown when not signed in ── -->
<section id="gate" class="wrap">
  <div class="eyebrow" data-i18n="gateEyebrow"></div>
  <h1 data-i18n="gateTitle"></h1>
  <p class="lead" data-i18n-html="gateLead"></p>
  <div class="gate-grid">
    <div class="notice">
      <div class="lock"><svg viewBox="0 0 24 24"><path d="M12 2C9.24 2 7 4.24 7 7v3H6c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-8c0-1.1-.9-2-2-2h-1V7c0-2.76-2.24-5-5-5zm-3 5c0-1.66 1.34-3 3-3s3 1.34 3 3v3H9V7z"/></svg></div>
      <h2 data-i18n="noticeTitle"></h2>
      <p data-i18n-html="noticeBody"></p>
      <ul data-i18n-html="noticeList"></ul>
      <a class="mail" href="mailto:benedu.insight@gmail.com?subject=%5BBenedu%20Insight%5D%20Class%2002%20M5-1%20Members%20Access%20Request">
        ✉ benedu.insight@gmail.com
      </a>
    </div>
    <form class="login" id="loginForm" autocomplete="on">
      <h2 data-i18n="loginTitle"></h2>
      <p class="sub" data-i18n="loginSub"></p>
      <div class="field">
        <label for="email">ID</label>
        <div class="id-wrap">
          <input id="email" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" required>
          <span class="id-suffix" id="idSuffix"></span>
        </div>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn-primary" id="btnLogin" type="submit" data-i18n="loginBtn"></button>
      <button class="link-btn" id="btnReset" type="button" data-i18n="resetBtn"></button>
      <div class="msg" id="loginMsg"></div>
    </form>
  </div>
</section>

<!-- ── Hub: shown when signed in ── -->
<section id="hub" class="wrap">
  <div class="eyebrow" data-i18n="hubEyebrow"></div>
  <h1 data-i18n="hubTitle"></h1>
  <p class="lead" data-i18n-html="hubLead"></p>
  <div class="topics" id="topics"></div>
</section>

<!-- ── Viewer: full-height embed frame ── -->
<section id="viewer">
  <div class="v-bar">
    <button class="btn-ghost" onclick="closeViewer()" data-i18n="back"></button>
    <span class="v-title" id="vTitle"></span>
    <div class="v-tabs" id="vTabs"></div>
    <div class="v-right">
      <button class="btn-ghost" onclick="fullscreenDeck()" data-i18n="fullscreen"></button>
    </div>
  </div>
  <div class="v-frame-wrap">
    <iframe id="deckFrame" src="about:blank" title="Members application" allowfullscreen></iframe>
  </div>
</section>

<footer>
  <a href="https://benedu-insight.github.io/" target="_blank" rel="noopener noreferrer">Benedu Insight</a> ·
  <a href="mailto:benedu.insight@gmail.com">benedu.insight@gmail.com</a>
</footer>

<script>
/* ── Member login domain ──
   Members type only their ID; "@" + MEMBER_DOMAIN is appended automatically.
   A full email (containing "@") is still accepted as typed. */
const MEMBER_DOMAIN = 'arc.benedu.internal';   // internal login domain (not a real mailbox)
function toLoginEmail(v){ v = (v || '').trim(); return v.includes('@') ? v : (v ? `${v}@${MEMBER_DOMAIN}` : ''); }

/* ── Application data: 4 topics × 1 app (files live in ./sims/) ── */
const TOPICS = [
  { num:'13.56', tag:'SINGLE FREQUENCY · REVERSE-L',
    title:{ en:'RF Auto Matcher — Single Frequency', ko:'RF Auto Matcher — 단일 주파수' },
    desc:{
      en:'A 13.56 MHz Reverse-L auto matcher in 3D. Shunt Load VVC on the 50 Ω side, series Tune VVC + coil toward the load. Set R load and X load, start from a random detune and watch the two VVCs drive Γ to zero.',
      ko:'13.56 MHz Reverse-L Auto Matcher의 3D 모델입니다. 50 Ω 쪽에 병렬 Load VVC, 부하 쪽에 직렬 Tune VVC + Coil이 놓입니다. R load와 X load를 설정하고 임의의 Detune 상태에서 두 VVC가 Γ를 0으로 수렴시키는 과정을 확인합니다.' },
    apps:[
      { kind:'app', file:'rf_matcher_3d.html', name:{ en:'RF Auto Matcher · 13.56 MHz · Reverse-L', ko:'RF Auto Matcher · 13.56 MHz · Reverse-L' }, tab:'Single Frequency' },
    ] },
  { num:'2f', tag:'DUAL FREQUENCY · T NETWORK × 2',
    title:{ en:'RF Auto Matcher — Dual Frequency', ko:'RF Auto Matcher — 이중 주파수' },
    desc:{
      en:'13.56 MHz 2 kW + 430 kHz 1 kW through two T networks into one output. Plasma load per frequency, HRF↔LRF isolation, output Vpp and the control path (Analog · Serial · Fieldbus).',
      ko:'13.56 MHz 2 kW + 430 kHz 1 kW를 두 개의 T Network로 정합해 하나의 출력으로 합칩니다. 주파수별 Plasma Load, HRF↔LRF Isolation, 출력단 Vpp, 제어 경로(Analog · Serial · Fieldbus)를 다룹니다.' },
    apps:[
      { kind:'app', file:'dual_rfm_3d.html', name:{ en:'Dual-Frequency Auto Matcher · 13.56 MHz + 430 kHz', ko:'Dual-Frequency Auto Matcher · 13.56 MHz + 430 kHz' }, tab:'Dual Frequency' },
    ] },
  { num:'448', tag:'EVC · PIN-DIODE SWITCHED ARRAY',
    title:{ en:'EVC Matcher', ko:'EVC Matcher' },
    desc:{
      en:'Electronic variable capacitors instead of motors: a Pi network with two PIN-diode switched capacitor arrays (6 coarse + 6 fine cells, 448 states each, 17–1431 pF), SiC half-bridge drivers and −HVDC bias for the OFF state.',
      ko:'모터 대신 전자식 가변 커패시터(EVC)를 사용합니다. Pi Network에 PIN Diode 스위칭 커패시터 어레이 2개(Coarse 6 + Fine 6 Cell, 어레이당 448 State, 17–1431 pF), SiC Half-bridge Driver, OFF 상태용 −HVDC Bias로 구성됩니다.' },
    apps:[
      { kind:'app', file:'evc_matcher_3d.html', name:{ en:'EVC Auto Matcher · Pi network · 13.56 MHz', ko:'EVC Auto Matcher · Pi Network · 13.56 MHz' }, tab:'EVC' },
    ] },
  { num:'35–1000<small>pF</small>', tag:'VVC · VARIABLE VACUUM CAPACITOR',
    title:{ en:'VVC Operation', ko:'VVC 동작 원리' },
    desc:{
      en:'Inside the variable vacuum capacitor: stepping motor and encoder, bellows, ceramic insulator. Turn the tuner and read capacitance and impedance at 400 kHz and 13.56 MHz in 2D, 3D and cutaway views.',
      ko:'Variable Vacuum Capacitor의 내부 구조(Stepping Motor와 Encoder, Bellows, Ceramic Insulator)를 다룹니다. Tuner 회전에 따른 정전용량과 400 kHz · 13.56 MHz에서의 임피던스를 2D, 3D, Cutaway 뷰로 확인합니다.' },
    apps:[
      { kind:'sim', file:'vvc_simulator.html', name:{ en:'Variable Vacuum Capacitor Simulator', ko:'Variable Vacuum Capacitor 시뮬레이터' }, tab:'VVC' },
    ] },
];

const I18N = {
  en:{
    gateEyebrow:'Class 02 · Module 05-1', gateTitle:'RF Matching Application',
    gateLead:'Interactive 3D applications of the RF auto matcher — single frequency, dual frequency and EVC — and the variable vacuum capacitor that tunes it.',
    noticeTitle:'This course is open to Benedu Insight members',

let hubLang = new URLSearchParams(location.search).get('lang') === 'ko' ? 'ko' : 'en';
let currentTopic = null, currentDeck = 0, isAuthed = false;
const t = k => I18N[hubLang][k];

function applyI18n(){
  document.documentElement.lang = hubLang;
  document.body.classList.toggle('lang-ko', hubLang === 'ko');
  document.getElementById('btnEn').classList.toggle('active', hubLang === 'en');
  document.getElementById('btnKo').classList.toggle('active', hubLang === 'ko');
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-html]').forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
  document.getElementById('btnSignOut').textContent = t('signOut');
  document.getElementById('btnNewWin').textContent = t('newWin');
  if (isAuthed) renderTopics();
  if (currentTopic !== null) renderViewerBar();
}
function setHubLang(l){
  hubLang = l; applyI18n();
  syncFrameLang();
}
/* Keep the open application in the hub language.
   The 3D matchers have their own EN/KO buttons (#lang-en / #lang-ko); decks may expose __beneduSetLang.
   Same-origin only — on file:// or cross-origin this silently does nothing. */
function syncFrameLang(frame){
  try {
    const w = (frame || document.getElementById('deckFrame')).contentWindow;
    if (!w || !w.document) return;
    if (typeof w.__beneduSetLang === 'function') { w.__beneduSetLang(hubLang); return; }
    const b = w.document.getElementById(hubLang === 'ko' ? 'lang-ko' : 'lang-en');
    if (b) b.click();
  } catch(e){}
}

const kindClass = k => k === 'sim' ? 'k-sim' : 'k-app';
const kindLabel = k => k === 'sim' ? t('kindSim') : t('kindApp');

/* Topics are rendered only after sign-in */
function renderTopics(){
  const box = document.getElementById('topics');
  box.innerHTML = TOPICS.map((tp, i) => `
    <article class="topic">
      <button class="mini" type="button" onclick="openDeck(${i},0)" data-file="${tp.apps[0].file}" aria-label="${tp.apps[0].name[hubLang]}">
        <div class="mini-bar"><i></i><i></i><i></i><span class="mini-url">sims/${tp.apps[0].file}</span><span class="mini-live">LIVE</span></div>
        <div class="mini-view">
          <img src="images/m5_1/${tp.apps[0].file.replace('.html', '.webp')}" alt="" loading="lazy">
          <span class="mini-open">${t('openApp')}</span>
        </div>
      </button>
      <div class="topic-head"><span class="topic-num">${tp.num}</span><span class="topic-tag">${tp.tag}</span></div>
      <h3>${tp.title[hubLang]}</h3>
      <p>${tp.desc[hubLang]}</p>
      <div class="decks">
        ${tp.apps.map((d, j) => `
          <button class="deck-btn" onclick="openDeck(${i},${j})">
            <span class="deck-kind ${kindClass(d.kind)}">${kindLabel(d.kind)}</span>
            <span class="deck-name">${d.name[hubLang]}</span>
            <span class="deck-arrow">→</span>
          </button>`).join('')}
      </div>
    </article>`).join('');
  setupMinis();
}

/* Mini windows: keep the live frame scaled to the card width; load the live app on hover, drop it on leave */
const LIVE_W = 1440;
const miniRO = ('ResizeObserver' in window) ? new ResizeObserver(es => es.forEach(e =>
  e.target.style.setProperty('--s', (e.contentRect.width / LIVE_W).toFixed(4)))) : null;
const canHover = window.matchMedia('(hover:hover) and (pointer:fine)').matches;
function setupMinis(){
  document.querySelectorAll('.mini').forEach(mini => {
    const view = mini.querySelector('.mini-view');
    if (miniRO) miniRO.observe(view);
    if (!canHover) return;
    let timer = null;
    mini.addEventListener('mouseenter', () => {
      timer = setTimeout(() => {
        if (view.querySelector('iframe')) return;
        const f = document.createElement('iframe');
        f.setAttribute('tabindex', '-1'); f.setAttribute('aria-hidden', 'true');
        f.addEventListener('load', () => { if (hubLang === 'ko') syncFrameLang(f); mini.classList.add('live'); });
        f.src = `sims/${mini.dataset.file}?lang=${hubLang}`;
        view.appendChild(f);
      }, 350);
    });
    mini.addEventListener('mouseleave', () => {
      clearTimeout(timer);
      mini.classList.remove('live');
      const f = view.querySelector('iframe');
      if (f) f.remove();   // stop the 3D render loop as soon as the pointer leaves
    });
  });
}

/* Viewer tabs list every application so members can switch without going back */
function renderViewerBar(){
  const tp = TOPICS[currentTopic];
  document.getElementById('vTitle').textContent = tp.title[hubLang];
  document.getElementById('vTabs').innerHTML = TOPICS.map((p, i) =>
    `<button class="v-tab ${i === currentTopic ? 'active' : ''}" onclick="openDeck(${i},0)">${p.apps[0].tab}</button>`).join('');
}
function openDeck(i, j){
  if (!isAuthed) return;
  currentTopic = i; currentDeck = j;
  renderViewerBar();
  document.getElementById('deckFrame').src = `sims/${TOPICS[i].apps[j].file}?lang=${hubLang}`;
  document.getElementById('viewer').classList.add('show');
}
function closeViewer(){
  document.getElementById('viewer').classList.remove('show');
  document.getElementById('deckFrame').src = 'about:blank';
  currentTopic = null;
}
function fullscreenDeck(){
  const f = document.getElementById('deckFrame');
  (f.requestFullscreen ? f.requestFullscreen() : Promise.reject()).catch(() => {});
}
function openNewWindow(){ window.open(`m5_1_members.html?lang=${hubLang}`, '_blank', 'noopener'); }

document.getElementById('deckFrame').addEventListener('load', () => { if (hubLang === 'ko') syncFrameLang(); });

// Embedded inside the portal (index.html)? → offer a larger standalone window
if (window.self !== window.top) document.getElementById('btnNewWin').style.display = '';

applyI18n();
document.getElementById('idSuffix').textContent = '@' + MEMBER_DOMAIN;
document.getElementById('email').addEventListener('input', e => {
  e.target.parentElement.classList.toggle('full', e.target.value.includes('@'));
});
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAJy0GsDI8KYU_0QbdhZ4Z78tTTCeGhAFk",
  authDomain: "arclabtool.firebaseapp.com",
  projectId: "arclabtool",
  storageBucket: "arclabtool.firebasestorage.app",
  messagingSenderId: "116212119538",
  appId: "1:116212119538:web:ca4387e00e4f26feb81d6b"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const $ = id => document.getElementById(id);
const msg = (text, kind) => { const m = $('loginMsg'); m.className = 'msg ' + kind; m.textContent = text; };

onAuthStateChanged(auth, user => {
  $('boot').style.display = 'none';
  isAuthed = !!user;
  $('gate').classList.toggle('show', !user);
  $('hub').classList.toggle('show', !!user);
  $('userBox').classList.toggle('show', !!user);
  $('userEmail').textContent = user ? user.email : '';
  if (user) renderTopics(); else closeViewer();
});

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const email = toLoginEmail($('email').value), pw = $('password').value;
  if (!email || !pw) { msg(t('errEmpty'), 'err'); return; }
  const btn = $('btnLogin'); btn.disabled = true; btn.textContent = t('signingIn');
  try {
    await signInWithEmailAndPassword(auth, email, pw);
    $('loginMsg').className = 'msg'; $('password').value = '';
  } catch (err) {
    const c = err.code || '';
    msg(
      /invalid-credential|wrong-password|user-not-found|invalid-email/.test(c) ? t('errCred') :
      /user-disabled/.test(c) ? t('errDisabled') :
      /too-many-requests/.test(c) ? t('errMany') :
      /network-request-failed/.test(c) ? t('errNet') :
      /unauthorized-domain|operation-not-allowed/.test(c) ? t('errDomain') : t('errOther'), 'err');
  } finally { btn.disabled = false; btn.textContent = t('loginBtn'); }
});

$('btnReset').addEventListener('click', () => {
  // Member accounts use an internal domain that cannot receive mail → reset is handled by the administrator
  const m = $('loginMsg'); m.className = 'msg ok'; m.innerHTML = t('resetAdmin');
});

$('btnSignOut').addEventListener('click', () => signOut(auth));
</script>
