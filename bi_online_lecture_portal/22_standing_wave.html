/* ═══════════════════════════════════════════
   UTILITY — HiDPI / DPR Canvas Setup
   devicePixelRatio 보정으로 캔버스 텍스트/선 선명도 개선
═══════════════════════════════════════════ */
function setupHiDPI(canvas) {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  // logical size가 0이면 기본값 사용 (아직 레이아웃 전)
  const cssW = rect.width  || canvas.width;
  const cssH = rect.height || canvas.height;
  canvas.width  = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  canvas.style.width  = cssW  + 'px';
  canvas.style.height = cssH  + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  // W/H는 CSS logical 픽셀 기준으로 반환
  return { ctx, W: cssW, H: cssH, dpr };
}

═══════════════════════════════════════════ */

    subtitle: '두 가지 질문으로 시작하는 가장 중요한 오개념 교정',

function renderSidebar() {
  const sl = slides();
  const nl = document.getElementById('nav-list');
  nl.innerHTML = '';
  sl.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'sb-item' + (s.id === currentId ? ' active' : '');
    div.onclick = () => navigateTo(s.id);
    const color = ERA_COLORS[s.era] || '#7030A0';
    const sub = currentLang === 'ko' ? SB_SUBS_KO[s.id] : SB_SUBS_EN[s.id];
    div.innerHTML = `
      <div class="sb-dot" style="background:${color}20;color:${color}">${SB_ICONS[s.id]||'●'}</div>
      <div>
        <div class="sb-label">${s.title}</div>
        <div class="sb-sub">${sub||''}</div>
      </div>`;
    nl.appendChild(div);
  });
  updateProgress();
}

function updateProgress() {
  const sl = slides();
  const idx = sl.findIndex(s => s.id === currentId);
  const pct = sl.length > 1 ? (idx / (sl.length - 1)) * 100 : 100;
  document.getElementById('progressFill').style.width = pct + '%';
}

function buildC24pDeepLearn(isEn) {
  return isEn ? `
<div class="deep-section">
  <h3>The Poynting Vector — Energy's True Path</h3>
  <p>The conventional picture of electricity — electrons flowing like water through a pipe, carrying energy with them — is a useful approximation for simple DC circuits. But it breaks down completely when we ask: how fast does energy travel? Where exactly does it flow?</p>
  <h3>Poynting's Theorem (1884)</h3>
  <p>John Henry Poynting proved that electromagnetic energy flows through the fields surrounding a conductor, not through the conductor itself. The energy flux (power per unit area) is described by the Poynting Vector:</p>
  <div class="eq-block">S = E × H &nbsp;&nbsp; [W/m²]</div>
  <p>In a wire carrying DC current: the E-field points along the wire (from high to low potential), the H-field (B-field) circles around the wire, and S = E × H points radially inward — energy flows from the space surrounding the wire into the wire, where it is dissipated as heat. The electrons are not the carriers; they are the medium that shapes the fields.</p>
  <h3>Why the Bulb Lights in ~1/c Seconds</h3>
  <p>In the 1 light-second circuit, closing the switch creates a disturbance in the electromagnetic field that propagates outward at the speed of light. The bulb is 1 meter away from the switch (across the wire gap). The field disturbance reaches the bulb in 1m / c ≈ 3.3 nanoseconds — regardless of how long the wire is.</p>
  <div class="eq-block">t ≈ d_gap / c &nbsp;≈&nbsp; 1m / (3×10⁸ m/s) &nbsp;≈&nbsp; 3.3 ns</div>
  <h3>Connection to RF Engineering</h3>
  <p>This is not merely a curiosity. In RF systems, energy travels through the space between the inner and outer conductors of a coaxial cable as a transverse electromagnetic (TEM) wave — exactly the E×H Poynting flux. The electrons in the conductors guide and shape the fields; they do not transport the energy. This is why impedance matching, transmission line theory, and standing waves are formulated in terms of field quantities (V and I as proxies for E and H), not electron flow.</p>
  <div class="callout green">
    <div class="callout-title">💬 Key Statement</div>
    "In RF systems, we talk about voltage and current because they are convenient proxies for E-field and H-field. The real energy carrier is the Poynting Vector S = E × H, flowing in the space between the conductors. This is what Veritasium showed — and it is the physical foundation of every concept in this module."
  </div>
</div>` : `
<div class="deep-section">
  <h3>Poynting Vector — 에너지의 진짜 경로</h3>
  <p>전통적인 전기 그림 — 물이 파이프를 흐르듯 전자가 에너지를 싣고 전선을 흐른다 — 은 단순한 DC 회로에서는 유용한 근사입니다. 하지만 "에너지는 얼마나 빨리 이동하는가? 정확히 어디를 흐르는가?"라고 물으면 완전히 무너집니다.</p>
  <h3>Poynting 정리 (1884)</h3>
  <p>John Henry Poynting은 전자기 에너지가 도체 내부가 아니라 도체 주변의 전자기장을 통해 흐른다는 것을 증명했습니다. 에너지 플럭스(단위면적당 전력)는 Poynting Vector로 기술됩니다:</p>
  <div class="eq-block">S = E × H &nbsp;&nbsp; [W/m²]</div>
  <p>DC 전류가 흐르는 전선에서: E-field는 전선을 따라(고전위→저전위), H-field는 전선 주위를 회전하고, S = E × H는 전선 중심 방향으로 향합니다 — 에너지는 전선 주변 공간에서 전선 내부로 흘러 들어가 열로 소산됩니다. 전자는 운반체가 아니라 장(field)을 형성하는 매질입니다.</p>
  <h3>왜 전구가 ~1/c초 만에 켜지는가</h3>
  <p>1광초 회로에서 스위치를 닫으면 전자기장의 교란이 빛의 속도로 바깥쪽으로 전파됩니다. 전구는 스위치로부터 전선 간격 1m 거리에 있습니다. 장의 교란이 전구에 도달하는 시간은 전선 길이와 무관하게 1m/c ≈ 3.3 나노초입니다.</p>
  <div class="eq-block">t ≈ d_간격 / c &nbsp;≈&nbsp; 1m / (3×10⁸ m/s) &nbsp;≈&nbsp; 3.3 ns</div>
  <h3>RF 공학과의 연결</h3>
  <p>이것은 단순한 호기심이 아닙니다. RF 시스템에서 에너지는 동축케이블의 내부/외부 도체 사이의 공간을 횡전자기(TEM)파 형태로 이동합니다 — 정확히 E×H Poynting 플럭스입니다. 도체 속 전자는 장을 안내하고 형성할 뿐, 에너지를 운반하지 않습니다. 이것이 임피던스 매칭, 전송선로 이론, 정재파가 전자 흐름이 아닌 장(field) 물리량(V, I는 E, H의 대용)으로 기술되는 이유입니다.</p>
  <div class="callout green">
    <div class="callout-title">💬 핵심 문장</div>
    "RF 시스템에서 전압과 전류를 다루는 것은 E-field와 H-field의 편리한 대용이기 때문입니다. 실제 에너지 운반체는 도체 사이 공간을 흐르는 Poynting Vector S = E × H입니다. 이것이 Veritasium이 보여준 것이며, 이 모듈의 모든 개념의 물리적 토대입니다."
  </div>
</div>`;
}

        </span>

      <div style="display:flex;flex-direction:column;gap:0">

        <!-- STEP 1: 본질 정의 -->

          <div style="display:flex;flex-direction:column;align-items:center;width:48px;flex-shrink:0">
            <div style="background:var(--purple);color:#fff;font-size:0.7rem;font-weight:700;
                        width:32px;height:32px;border-radius:50%;display:flex;align-items:center;
                        justify-content:center;flex-shrink:0;font-family:var(--mono)">①</div>
            <div style="width:2px;flex:1;background:#C9B8E8;margin:4px 0"></div>
          </div>
          <div style="flex:1;padding:0 0 16px 12px">
            <div style="font-size:0.75rem;font-weight:700;color:var(--purple);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.05em">
              ${isEn?'Fundamental Definition — What you observe':'본질 정의 — 관찰되는 현상'}
            </div>
            <div style="background:#F8F6FF;border:1.5px solid #C9B8E8;border-radius:10px;padding:12px">
              <p style="font-size:0.8rem;color:var(--text);line-height:1.65;margin-bottom:10px">
                ${isEn
                  ? 'When a wave reaches a boundary, part of it reflects back. <strong>Γ is simply the ratio of the reflected voltage wave to the incident (forward) voltage wave.</strong> This is the most direct, observable definition.'
                  : '파동이 경계를 만나면 일부가 반사됩니다. <strong>Γ는 반사파 전압과 입사(진행)파 전압의 비율입니다.</strong> 이것이 가장 직접적이고 관찰 가능한 정의입니다.'}
              </p>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
                <div style="background:#fff;border:2px solid var(--purple);border-radius:8px;padding:10px;text-align:center">
                  <div style="font-size:0.68rem;color:var(--text-sub);margin-bottom:4px">${isEn?'Voltage definition':'전압 정의'}</div>
                  <div style="font-family:var(--mono);font-size:1.05rem;font-weight:700;color:var(--purple)">
                    Γ = V<sup>−</sup> / V<sup>+</sup>
                  </div>
                  <div style="font-size:0.65rem;color:var(--text-sub);margin-top:4px">
                    ${isEn?'V⁻ = reflected · V⁺ = incident':'V⁻ = 반사파 · V⁺ = 입사파'}
                  </div>
                </div>
                <div style="background:#fff;border:1.5px solid #C9B8E8;border-radius:8px;padding:10px;text-align:center">
                  <div style="font-size:0.68rem;color:var(--text-sub);margin-bottom:4px">${isEn?'Range':'범위'}</div>
                  <div style="font-size:0.75rem;color:var(--text);line-height:1.8;font-family:var(--mono)">
                    <span style="color:var(--green)">|Γ| = 0</span> ${isEn?'→ no refl.':'→ 반사 없음'}<br>
                    <span style="color:var(--plasma)">0 &lt; |Γ| &lt; 1</span> ${isEn?'→ partial':'→ 부분 반사'}<br>
                    <span style="color:var(--red)">|Γ| = 1</span> ${isEn?'→ total refl.':'→ 완전 반사'}
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- STEP 2: 전력으로 측정 -->
        <div style="display:flex;gap:0;align-items:stretch">
          <div style="display:flex;flex-direction:column;align-items:center;width:48px;flex-shrink:0">
            <div style="background:#1A6FB5;color:#fff;font-size:0.7rem;font-weight:700;
                        width:32px;height:32px;border-radius:50%;display:flex;align-items:center;
                        justify-content:center;flex-shrink:0;font-family:var(--mono)">②</div>
            <div style="width:2px;flex:1;background:#A8C4E8;margin:4px 0"></div>
          </div>
          <div style="flex:1;padding:0 0 16px 12px">
            <div style="font-size:0.75rem;font-weight:700;color:#1A6FB5;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.05em">
              ${isEn?'Measurable Form — Power you can read on an instrument':'측정 가능한 형태 — 계측기로 읽을 수 있는 전력'}
            </div>
            <div style="background:#F0F6FF;border:1.5px solid #A8C4E8;border-radius:10px;padding:12px">
              <p style="font-size:0.8rem;color:var(--text);line-height:1.65;margin-bottom:10px">
                ${isEn
                  ? 'In practice, we measure <em>power</em> — not voltage directly. Since power ∝ V², the reflected power ratio becomes |Γ|². This is what RF power meters actually read.'
                  : '실제로는 전압이 아닌 <em>전력</em>을 측정합니다. 전력 ∝ V²이므로 반사전력 비율은 |Γ|²가 됩니다. RF 전력계가 실제로 읽는 값입니다.'}
              </p>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
                <div style="background:#fff;border:2px solid #1A6FB5;border-radius:8px;padding:10px;text-align:center">
                  <div style="font-size:0.68rem;color:var(--text-sub);margin-bottom:4px">${isEn?'Power definition':'전력 정의'}</div>
                  <div style="font-family:var(--mono);font-size:1.05rem;font-weight:700;color:#1A6FB5">
                    |Γ|² = P<sub>r</sub> / P<sub>f</sub>
                  </div>
                  <div style="font-size:0.65rem;color:var(--text-sub);margin-top:4px">
                    ${isEn?'Pᵣ = reflected power · Pf = forward power':'Pᵣ = 반사전력 · Pf = 전진전력'}
                  </div>
                </div>
                <div style="background:#fff;border:1.5px solid #A8C4E8;border-radius:8px;padding:10px;text-align:center">
                  <div style="font-size:0.68rem;color:var(--text-sub);margin-bottom:4px">${isEn?'Therefore |Γ|':'따라서 |Γ|'}</div>
                  <div style="font-family:var(--mono);font-size:1.05rem;font-weight:700;color:#1A6FB5">
                    |Γ| = √(P<sub>r</sub> / P<sub>f</sub>)
                  </div>
                  <div style="font-size:0.65rem;color:var(--text-sub);margin-top:4px">
                    ${isEn?'Directly from power meter readings':'전력계 수치로 직접 계산'}

            </div>

        </div>

        <!-- STEP 3: 임피던스로 유도 -->
        <div style="display:flex;gap:0;align-items:stretch">

                        width:32px;height:32px;border-radius:50%;display:flex;align-items:center;
                        justify-content:center;flex-shrink:0;font-family:var(--mono)">③</div>
          </div>
          <div style="flex:1;padding:0 0 0 12px">
            <div style="font-size:0.75rem;font-weight:700;color:var(--green);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.05em">
              ${isEn?'Circuit Derivation — From impedance boundary conditions':'회로 유도 — 임피던스 경계조건으로부터'}
            </div>
            <div style="background:#F0FAF4;border:1.5px solid #A8D5B8;border-radius:10px;padding:12px">
              <p style="font-size:0.8rem;color:var(--text);line-height:1.65;margin-bottom:10px">
                ${isEn
                  ? 'Applying voltage and current continuity at the boundary between a line (Z₀) and a load (Z<sub>L</sub>), we derive Γ analytically. This links the observable Γ to the underlying impedance mismatch.'
                  : '선로(Z₀)와 부하(Z<sub>L</sub>) 경계에서 전압·전류 연속 조건을 적용하면 Γ를 해석적으로 유도할 수 있습니다. 이것이 관찰 가능한 Γ를 임피던스 불일치와 연결합니다.'}
              </p>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
                <div style="background:#fff;border:2px solid var(--green);border-radius:8px;padding:10px;text-align:center">
                  <div style="font-size:0.68rem;color:var(--text-sub);margin-bottom:4px">${isEn?'Impedance formula (derived)':'임피던스 공식 (유도)'}
                  </div>
                  <div style="font-family:var(--mono);font-size:0.98rem;font-weight:700;color:var(--green)">
                    Γ = (Z<sub>L</sub> − Z₀) / (Z<sub>L</sub> + Z₀)
                  </div>
                </div>
                <div style="background:#fff;border:1.5px solid #A8D5B8;border-radius:8px;padding:8px">
                  <div style="font-size:0.67rem;color:var(--text-sub);margin-bottom:4px">${isEn?'Special cases':'특수 케이스'}</div>
                  <table style="width:100%;font-size:0.67rem;border-collapse:collapse">
                    ${[
                      {zl:'Z<sub>L</sub>=Z₀', g:'0', c:'var(--green)',  t: isEn?'match':'매칭'},
                      {zl:'Z<sub>L</sub>=0',  g:'−1', c:'var(--red)',   t: isEn?'short':'단락'},
                      {zl:'Z<sub>L</sub>=∞',  g:'+1', c:'var(--blue)',  t: isEn?'open':'개방'},
                    ].map(r=>`
                      <tr>
                        <td style="padding:2px 4px;color:var(--text-sub)">${r.zl}</td>
                        <td style="padding:2px 4px;font-family:var(--mono);font-weight:700;color:${r.c}">Γ=${r.g}</td>
                        <td style="padding:2px 4px;color:${r.c}">${r.t}</td>
                      </tr>
                    `).join('')}
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>

      </div><!-- end 3단계 -->

      <!-- 핵심 메시지 callout -->
      <div style="margin-top:14px;background:#F8F6FF;border:1px solid #C9B8E8;border-radius:8px;padding:10px 14px;
                  font-size:0.78rem;color:var(--text);line-height:1.6">
        <span style="font-weight:700;color:var(--purple)">
          ${isEn?'Key Insight: ':'핵심 통찰: '}
        </span>
        ${isEn
          ? 'Γ = V⁻/V⁺ is the definition. |Γ|² = Pᵣ/Pf is how you measure it. Γ = (Z<sub>L</sub>−Z₀)/(Z<sub>L</sub>+Z₀) is why it happens — all three are the same quantity, seen from different angles.'
          : 'Γ = V⁻/V⁺는 정의입니다. |Γ|² = Pᵣ/Pf는 측정 방법입니다. Γ = (Z<sub>L</sub>−Z₀)/(Z<sub>L</sub>+Z₀)는 발생 원인입니다. 세 가지 모두 같은 물리량을 다른 관점에서 본 것입니다.'}
      </div>

    </div>
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px" id="bcGrid">
      ${conditions.map(c=>`
        <div onclick="selectBC('${c.id}')" id="bc-${c.id}" style="background:#fff;border:2px solid ${c.color}40;border-radius:10px;padding:14px;cursor:pointer;transition:all 0.15s">

      ${isEn?'👆 Click a boundary condition to see details and RF correspondence.':'👆 경계조건을 클릭하여 상세 설명과 RF 대응을 확인하세요.'}
    </div>
    <div style="margin-top:14px">
      <canvas id="bcCanvas" class="sim-canvas" width="680" height="180"></canvas>
      <div class="sim-btn-row">
        ${conditions.map(c=>`<button class="sim-btn" onclick="selectBC('${c.id}')" id="bcbtn-${c.id}">${c.icon} ${c.label.split(' ')[0]} ${c.label.split(' ')[1]||''}</button>`).join('')}
      </div>
      <div class="sim-info" id="bcInfo">${isEn?'Select a boundary condition above to animate the wave reflection behavior.':'위에서 경계조건을 선택하면 반사 거동이 애니메이션으로 표시됩니다.'}</div>
    </div>

    <!-- PhET 시각 학습 링크 -->
    <div style="margin-top:16px;border:1.5px solid #A8C4E8;border-radius:12px;overflow:hidden">

      <!-- 헤더 -->
      <div style="background:#EEF4FF;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="background:#1A6FB5;color:#fff;font-size:0.72rem;font-weight:700;
                      padding:4px 10px;border-radius:6px;letter-spacing:0.04em;font-family:var(--mono)">
            PhET
          </div>
          <div>
            <div style="font-size:0.84rem;font-weight:700;color:#1A3A6E">
              ${isEn?'Interactive Simulation: Wave on a String':'인터랙티브 시뮬레이션: 줄 위의 파동'}
            </div>
            <div style="font-size:0.68rem;color:#4A6A9E;margin-top:1px">
              ${isEn
                ? 'University of Colorado Boulder · PhET Interactive Simulations'
                : '출처: University of Colorado Boulder · PhET Interactive Simulations'}
            </div>
          </div>
        </div>
        <a href="https://phet.colorado.edu/sims/html/wave-on-a-string/latest/wave-on-a-string_all.html"
           target="_blank" rel="noopener noreferrer"
           style="display:inline-flex;align-items:center;gap:6px;
                  background:#1A6FB5;color:#fff;text-decoration:none;
                  padding:8px 16px;border-radius:8px;font-size:0.78rem;font-weight:700;

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          ${[
            { icon:'🔩', title: isEn?'Fixed End':'고정단',
              steps: isEn
                ? 'Set End = <b>Fixed</b>. Send a pulse → observe 180° phase inversion on reflection.'
                : 'End = <b>Fixed End</b> 설정. 펄스 전송 → 반사 시 위상 180° 반전 확인.' },
            { icon:'🚪', title: isEn?'Free End':'자유단',

function buildC27Diagram(isEn) {
  return `
<div class="d-wrap">

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div>
          <div style="font-size:0.72rem;color:var(--text-sub);margin-bottom:4px">${isEn?'① Standing wave voltage amplitude at position x:':'① x 위치의 정재파 전압 진폭:'}</div>
          <div style="font-family:var(--mono);font-size:0.82rem;background:#F0FAF4;padding:8px 10px;border-radius:6px;color:var(--text)">
            |V(x)| = |V⁺| · |1 + Γe<sup>j2βx</sup>|
          </div>
          <div style="font-size:0.72rem;color:var(--text-sub);margin:6px 0 4px">${isEn?'② Maximum and minimum amplitudes:':'② 최대값과 최소값:'}</div>
          <div style="font-family:var(--mono);font-size:0.82rem;background:#F0FAF4;padding:8px 10px;border-radius:6px;color:var(--text)">
            V<sub>max</sub> = |V⁺|(1 + |Γ|)<br>
            V<sub>min</sub> = |V⁺|(1 − |Γ|)
          </div>
        </div>
        <div>
          <div style="font-size:0.72rem;color:var(--text-sub);margin-bottom:4px">${isEn?'③ VSWR definition:':'③ VSWR 정의:'}</div>
          <div style="background:#F0FAF4;border:2px solid var(--green);border-radius:8px;padding:10px;text-align:center">
            <div style="font-family:var(--mono);font-size:1.05rem;font-weight:700;color:var(--green)">
              VSWR = V<sub>max</sub> / V<sub>min</sub>
            </div>
            <div style="font-family:var(--mono);font-size:0.88rem;color:var(--text);margin-top:4px">
              = (1 + |Γ|) / (1 − |Γ|)
            </div>
          </div>
          <div style="font-size:0.72rem;color:var(--text-sub);margin:6px 0 4px">${isEn?'④ Inverse (Γ from VSWR):':'④ 역변환 (VSWR → Γ):'}</div>
          <div style="font-family:var(--mono);font-size:0.82rem;background:#F0FAF4;padding:8px 10px;border-radius:6px;color:var(--text)">
            |Γ| = (VSWR − 1) / (VSWR + 1)
          </div>
        </div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px">
      ${[
        { vswr:'1.0', gamma:'0', refl:'0%', label: isEn?'Perfect Match':'완전 매칭', color:'var(--green)' },
        { vswr:'1.5', gamma:'0.20', refl:'4%', label: isEn?'Practical Limit':'실용 한계', color:'var(--blue)' },
        { vswr:'2.0', gamma:'0.33', refl:'11%', label: isEn?'Caution':'주의', color:'var(--plasma)' },
        { vswr:'∞', gamma:'1.0', refl:'100%', label: isEn?'Total Reflection':'완전 반사', color:'var(--red)' },
      ].map(v=>`
        <div style="background:#fff;border:1.5px solid ${v.color}40;border-radius:10px;padding:12px;text-align:center">
          <div style="font-size:1.5rem;font-family:var(--mono);font-weight:700;color:${v.color}">${v.vswr}</div>
          <div style="font-size:0.68rem;color:var(--text-sub);margin-bottom:6px">VSWR</div>
          <div style="font-size:0.72rem;font-family:var(--mono);color:var(--text)">|Γ| = ${v.gamma}</div>
          <div style="font-size:0.72rem;color:${v.color};font-weight:700">${isEn?'Refl.':'반사'} ${v.refl}</div>
          <div style="font-size:0.68rem;color:var(--text-sub);margin-top:4px">${v.label}</div>
        </div>
      `).join('')}

    <!-- ═══ DEEP DIVE — 펼친 상태 시작, 클릭하면 접힘 ═══ -->
    <div style="border:1.5px solid #E8C66A;border-radius:10px;overflow:hidden;margin-bottom:16px;background:#fff">
      <div onclick="toggleDeepDive('dd-gamma-power')"
           style="background:#FBF3DC;padding:10px 16px;display:flex;align-items:center;
                  justify-content:space-between;cursor:pointer;user-select:none">
        <div style="display:flex;align-items:center;gap:10px">
          <span style="background:#C8860D;color:#fff;font-size:0.66rem;font-weight:700;
                       padding:3px 10px;border-radius:10px;letter-spacing:0.05em;
                       font-family:var(--mono)">DEEP DIVE</span>
          <span style="font-size:0.84rem;font-weight:700;color:var(--text)">
            😅 ${isEn
              ? 'Common Confusion: Does |Γ| Itself Equal the Reflected Power?'
              : '흔한 오해: |Γ| 자체가 반사전력 비율인가?'}
          </span>
        </div>
        <span id="dd-gamma-power-arrow" style="font-size:0.8rem;color:var(--text-sub);

      </div>
      <div id="dd-gamma-power" style="display:block;padding:16px 18px">
        <p style="font-size:0.82rem;color:var(--text);line-height:1.7;margin-bottom:12px">
          ${isEn
            ? 'It\'s natural to read "Γ = reflection coefficient" and assume Γ itself is the fraction of power reflected. It isn\'t — <strong>Γ is a voltage ratio</strong>, and the fraction of <strong>power</strong> reflected is <strong>|Γ|²</strong>.'
            : '"Γ = 반사계수"라는 표현 때문에 Γ 자체가 반사되는 전력의 비율이라고 생각하기 쉽습니다. 하지만 그렇지 않습니다 — <strong>Γ는 전압 비율</strong>이며, <strong>전력</strong>이 반사되는 비율은 <strong>|Γ|²</strong>입니다.'}
        </p>
        <div style="background:#F7F8FA;border-radius:8px;padding:12px 16px;margin-bottom:12px;
                    font-family:var(--mono);font-size:0.82rem;color:var(--text);line-height:2">
          Γ = V<sub>reflected</sub> / V<sub>incident</sub> &nbsp; — &nbsp; ${isEn?'a complex number (magnitude':'복소수 (크기'} <em>${isEn?'and phase':'와 위상'}</em>${isEn?')':' )'}<br>
          |Γ| = 0.933 &nbsp; → &nbsp; ${isEn
            ? 'this is how much the <strong>voltage</strong> amplitude comes back, not power'
            : '<strong>전압</strong> 진폭이 되돌아오는 비율 — 전력이 아닙니다'}<br>
          P<sub>reflected</sub> / P<sub>incident</sub> = |Γ|² = 0.933² ≈ <strong>0.871 (87.1%)</strong>
        </div>
        <p style="font-size:0.82rem;color:var(--text);line-height:1.7;margin-bottom:10px">
          ${isEn
            ? 'The reason is simple: power is proportional to the <strong>square</strong> of voltage (P = V²/Z₀), not to voltage itself. So whatever fraction comes back in voltage, the power that comes back is that fraction <em>squared</em> — and squaring a number less than 1 always makes it smaller. 93.3% voltage reflection becomes 87.1% power reflection, not a bigger number.'
            : '이유는 단순합니다: 전력은 전압 자체가 아니라 전압의 <strong>제곱</strong>에 비례합니다 (P = V²/Z₀). 따라서 전압이 되돌아오는 비율이 무엇이든, 전력이 되돌아오는 비율은 그 값의 <em>제곱</em>입니다 — 1보다 작은 수를 제곱하면 항상 더 작아집니다. 93.3%의 전압 반사는 87.1%의 전력 반사가 되는 것이지, 더 큰 숫자가 되지 않습니다.'}
        </p>
        <p style="font-size:0.82rem;color:var(--text);line-height:1.7">
          ${isEn
            ? 'Current behaves the same way, just with a sign flip: the current reflection coefficient is exactly −Γ, so |I<sub>reflected</sub>/I<sub>incident</sub>| is the same 0.933 — current doesn\'t introduce a separate ratio. The squaring happens because <em>power itself</em> is defined as a product of voltage and current (or equivalently V² or I²), not because current "adds" anything extra.'
            : '전류도 동일하게 거동하며, 부호만 반대입니다: 전류 반사계수는 정확히 −Γ이므로 |I<sub>reflected</sub>/I<sub>incident</sub>|도 동일하게 0.933입니다 — 전류가 별도의 비율을 만들어내지 않습니다. 제곱이 나타나는 이유는 <em>전력 자체</em>가 전압과 전류의 곱(또는 동등하게 V² 혹은 I²)으로 정의되기 때문이지, 전류가 무언가를 "추가"해서가 아닙니다.'}

    <!-- ═══ 별도 계산기 모듈 ═══ -->

        <button onclick="clearCalc()"
          style="padding:4px 12px;border:1px solid #C9B8E8;border-radius:6px;background:transparent;color:var(--purple);font-size:0.72rem;cursor:pointer;font-family:var(--font)">
          ${isEn?'Clear':'초기화'}
        </button>
      </div>

      <!-- 좌(입력) + 우(결과) 2컬럼 -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch">

        <!-- ── 좌측: 입력 패널 (수직 스택) ── -->
        <div style="display:flex;flex-direction:column;gap:10px">

          <!-- ① Γ 입력 -->
          <div style="background:#F8F6FF;border:1.5px solid #C9B8E8;border-radius:10px;padding:12px">

              ${isEn?'① Reflection Coefficient  |Γ|':'① 반사계수  |Γ|'}
            </div>
            <div style="display:flex;align-items:center;gap:8px">
              <span style="font-family:var(--mono);font-size:0.95rem;color:var(--purple);font-weight:700;min-width:28px">|Γ|</span>
              <input id="calc-gamma" type="number" min="0" max="1" step="0.001" value=""
                placeholder="0 ~ 1"
                style="flex:1;padding:8px 10px;border:1.5px solid #C9B8E8;border-radius:7px;font-family:var(--mono);font-size:0.9rem;color:var(--text);background:#fff;outline:none"
                oninput="calcFromGamma(this.value)">
            </div>
            <div style="font-size:0.67rem;color:var(--text-sub);margin-top:5px">
              ${isEn?'0 = no reflection · 1 = total reflection':'0 = 반사 없음 · 1 = 완전 반사'}
            </div>
          </div>

          <!-- ② VSWR 입력 -->
          <div style="background:#F0FAF4;border:1.5px solid #A8D5B8;border-radius:10px;padding:12px">
            <div style="font-size:0.7rem;font-weight:700;color:var(--green);margin-bottom:7px;text-transform:uppercase;letter-spacing:0.05em">
              ${isEn?'② VSWR':'② VSWR'}
            </div>
            <div style="display:flex;align-items:center;gap:8px">
              <span style="font-family:var(--mono);font-size:0.95rem;color:var(--green);font-weight:700;min-width:28px">S</span>
              <input id="calc-vswr" type="number" min="1" step="0.01" value=""
                placeholder="≥ 1.00"
                style="flex:1;padding:8px 10px;border:1.5px solid #A8D5B8;border-radius:7px;font-family:var(--mono);font-size:0.9rem;color:var(--text);background:#fff;outline:none"
                oninput="calcFromVSWR(this.value)">
            </div>
            <div style="font-size:0.67rem;color:var(--text-sub);margin-top:5px">
              ${isEn?'1 = ideal · ∞ = open or short circuit':'1 = 이상 · ∞ = 개방 또는 단락'}
            </div>
          </div>

          <!-- ③ Pf / Pr 입력 -->
          <div style="background:#FFF8F0;border:1.5px solid #F5C89A;border-radius:10px;padding:12px">
            <div style="font-size:0.7rem;font-weight:700;color:var(--plasma);margin-bottom:7px;text-transform:uppercase;letter-spacing:0.05em">
              ${isEn?'③ Forward / Reflected Power':'③ 전진전력 / 반사전력'}
            </div>
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:7px">
              <span style="font-family:var(--mono);font-size:0.88rem;color:var(--plasma);font-weight:700;min-width:28px">P<sub>f</sub></span>
              <input id="calc-pf" type="number" min="0" step="0.1" value=""
                placeholder="${isEn?'W or any unit':'W 또는 임의단위'}"
                style="flex:1;padding:7px 10px;border:1.5px solid #F5C89A;border-radius:7px;font-family:var(--mono);font-size:0.88rem;color:var(--text);background:#fff;outline:none"
                oninput="calcFromPower()">
            </div>
            <div style="display:flex;align-items:center;gap:8px">
              <span style="font-family:var(--mono);font-size:0.88rem;color:var(--red);font-weight:700;min-width:28px">P<sub>r</sub></span>
              <input id="calc-pr" type="number" min="0" step="0.1" value=""
                placeholder="${isEn?'W or any unit':'W 또는 임의단위'}"
                style="flex:1;padding:7px 10px;border:1.5px solid #F5C89A;border-radius:7px;font-family:var(--mono);font-size:0.88rem;color:var(--text);background:#fff;outline:none"
                oninput="calcFromPower()">
            </div>
            <div style="font-size:0.67rem;color:var(--text-sub);margin-top:5px">
              ${isEn?'|Γ| = √(Pr / Pf)':'|Γ| = √(Pr / Pf) 로 계산'}
            </div>
          </div>

        </div><!-- end 좌측 -->

        <!-- ── 우측: 결과 패널 (수직 스택) ── -->
        <div style="background:#1A1A2E;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:0">

          <div style="font-size:0.7rem;font-weight:700;color:#6688AA;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:12px">
            ${isEn?'Calculated Results':'계산 결과'}
          </div>

          <!-- 결과 행들 -->
          ${[
            { id:'cr-gamma', label:'|Γ|',            color:'#D4AAFF', desc: isEn?'Reflection Coefficient':'반사계수' },
            { id:'cr-vswr',  label:'VSWR',            color:'#66EEA0', desc: isEn?'Voltage Standing Wave Ratio':'전압정재파비' },
            { id:'cr-refl',  label: isEn?'Refl %':'반사전력 %',  color:'#FF8080', desc: isEn?'|Γ|² × 100':'|Γ|² × 100' },
            { id:'cr-del',   label: isEn?'Del %':'전달전력 %',   color:'#66EEA0', desc: isEn?'(1 − |Γ|²) × 100':'(1 − |Γ|²) × 100' },
            { id:'cr-rl',    label:'Return Loss',     color:'#FFAA44', desc: isEn?'−20·log|Γ| (dB)':'−20·log|Γ| (dB)' },
          ].map((r,i)=>`
            <div style="display:flex;align-items:center;justify-content:space-between;
                 padding:10px 0;${i>0?'border-top:1px solid #2A3A5A':''}">
              <div>
                <div style="font-size:0.72rem;font-weight:700;color:${r.color};margin-bottom:2px">${r.label}</div>
                <div style="font-size:0.62rem;color:#556677;font-family:var(--mono)">${r.desc}</div>
              </div>
              <div id="${r.id}"
                style="font-family:var(--mono);font-size:1.15rem;font-weight:700;color:${r.color};
                       background:#0D1117;padding:6px 14px;border-radius:7px;min-width:110px;text-align:right">
                —
              </div>
            </div>
          `).join('')}

        </div><!-- end 우측 -->

      </div><!-- end 2컬럼 -->
    </div>
  </div>
</div>`;
}

function buildC28Diagram(isEn) {
  const rows = isEn ? [
    ['String Property','Symbol','RF Line Property','Symbol'],
    ['Tension','T','Inductance per unit length','L'],
    ['Linear mass density','μ','Capacitance per unit length','C'],
    ['Wave speed','√(T/μ)','Wave speed','1/√(LC)'],
    ['Fixed end','y=0 boundary','Short circuit','Z<sub>L</sub> = 0'],
    ['Free end','dy/dx=0','Open circuit','Z<sub>L</sub> = ∞'],
    ['Impedance ratio','√(T₁μ₁)/√(T₂μ₂)','Characteristic impedance','Z₀ = √(L/C)'],
  ] : [
    ['줄의 물성','기호','RF 선로 물성','기호'],
    ['장력','T','단위길이당 인덕턴스','L'],
    ['선밀도','μ','단위길이당 커패시턴스','C'],
    ['파동속도','√(T/μ)','파동속도','1/√(LC)'],
    ['고정단','y=0 경계','단락 회로','Z<sub>L</sub> = 0'],
    ['자유단','dy/dx=0','개방 회로','Z<sub>L</sub> = ∞'],
    ['임피던스 비율','√(T₁μ₁)/√(T₂μ₂)','특성 임피던스','Z₀ = √(L/C)'],
  ];
  return `
<div class="d-wrap">
  <div class="d-header">

        <td>${r[0]}</td>
        <td><code style="font-family:var(--mono);font-size:0.78rem;color:var(--blue)">${r[1]}</code></td>
        <td>${r[2]}</td>
        <td><code style="font-family:var(--mono);font-size:0.78rem;color:var(--plasma)">${r[3]}</code></td>
      </tr>`).join('')}</tbody>
    </table>
    <div class="callout green" style="margin-top:14px">
      <div class="callout-title">⚗️ ${isEn?'CCP Reactor Boundary Condition':'CCP Reactor의 경계조건'}</div>
      ${isEn
        ? 'Before plasma ignition: CCP electrodes ≈ Open circuit (high impedance capacitive load). After ignition: complex resistive+capacitive impedance that changes dynamically with pressure, gas, and power. The RF Matcher tracks this change in real time.'
        : '플라즈마 점화 전: CCP 전극 ≈ 개방 회로(고임피던스 용량성 부하). 점화 후: 압력·가스·전력에 따라 동적으로 변하는 복소 저항+용량성 임피던스. RF Matcher가 이 변화를 실시간으로 추적합니다.'}
    </div>
    <div style="margin-top:14px;background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden">
      <!-- 헤더 -->
      <div style="padding:12px 16px 10px;border-bottom:1px solid var(--border)">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <div style="font-size:0.9rem;font-weight:700;color:var(--purple)">

          </div>
          <a href="./sims/poynting.html" target="_blank"

                    border:1px solid #C9B8E8;border-radius:5px;padding:4px 12px;
                    transition:all 0.15s;flex-shrink:0"

            ↗ ${isEn?'Full screen':'전체화면'}

            <span style="font-family:var(--mono);font-size:1.25rem;font-weight:700;color:var(--purple)">S</span>

              <span style="color:var(--text-sub)">${isEn?'Electric field (V/m) — creates voltage':'전기장 (V/m) — 전압을 형성'}</span>

            <div style="display:flex;align-items:center;gap:8px;font-size:0.82rem">

            </div>
          </div>
          <div style="background:#F0FAF4;border:1px solid #A8D5B8;border-radius:8px;padding:8px 14px;font-size:0.8rem;color:var(--text)">
            ${isEn

          </div>
        </div>
      </div>
      <!-- iframe -->
      <iframe src="./sims/poynting.html"
              style="width:100%;height:470px;border:none;display:block"

</div>`;

function buildC26DeepLearn(isEn) {

  <h3>Telegraph Equation — The Transmission Line Wave Equation</h3>
  <p>For a lossless transmission line, the distributed-element model gives us two coupled first-order equations (Telegrapher's equations):</p>
  <div class="eq-block">∂V/∂x = −L · ∂I/∂t &nbsp;&nbsp;&nbsp; ∂I/∂x = −C · ∂V/∂t</div>
  <p>Combining these two equations yields the second-order wave equations for both V and I, structurally identical to the string wave equation. This mathematical equivalence is why string intuition maps perfectly to transmission line behavior.</p>
  <h3>Standing Wave: Superposition of Forward and Reflected Waves</h3>
  <div class="eq-block">V(x,t) = V⁺cos(ωt − βx) + V⁻cos(ωt + βx)</div>
  <p>At specific positions where the two waves always cancel (nodes), amplitude is permanently zero. At antinodes, they always reinforce. The result is a spatial amplitude pattern that does not move — a standing wave.</p>
  <h3>Why Power Does Not Form a Standing Wave</h3>
  <p>Instantaneous power P(x,t) = V(x,t)·I(x,t). When you expand this product for the standing wave case, the position-dependent terms cancel out in the time average. The time-averaged (active) power:</p>
  <div class="eq-block">⟨P⟩ = (1/2)|V⁺|²/Z₀ · (1 − |Γ|²) = constant w.r.t. x</div>
  <p>This is a fundamental result: net power flow is uniform along the line. Only V and I oscillate spatially — the delivered power does not.</p>

    </tbody>
  </table>
  <p>Return Loss가 높을수록 반사가 적고 매칭이 좋습니다. Return Loss 20dB는 |Γ|=0.1, VSWR≈1.22, 반사전력 1%에 해당합니다.</p>

// ── C25: Wave Simulator ──
let waveAnim = null;
function initWaveSim() {
  const canvas = document.getElementById('waveCanvas');
  if (!canvas) return;
  const { ctx, W, H } = setupHiDPI(canvas);
  let freq = 2, amp = 28, speed = 200, t = 0;
  const isEn = currentLang === 'en';

  const freqSlider = document.getElementById('freqSlider');
  const ampSlider = document.getElementById('ampSlider');
  const speedSlider = document.getElementById('speedSlider');

  function update() {
    freq = parseFloat(freqSlider.value);
    amp = parseFloat(ampSlider.value);
    speed = parseFloat(speedSlider.value);
    document.getElementById('freqVal').textContent = freq.toFixed(1) + ' Hz';
    document.getElementById('ampVal').textContent = Math.round(amp);
    document.getElementById('speedVal').textContent = Math.round(speed);
    const lambda = speed / freq;
    const T = 1 / freq;
    document.getElementById('waveInfo').innerHTML =
      `λ = ${lambda.toFixed(1)} &nbsp;|&nbsp; T = ${T.toFixed(3)}s &nbsp;|&nbsp; `+
      (isEn ? `Wave speed = ${Math.round(speed)} (arbitrary units)` : `파동속도 = ${Math.round(speed)} (임의 단위)`);
  }

  freqSlider.addEventListener('input', update);
  ampSlider.addEventListener('input', update);
  speedSlider.addEventListener('input', update);
  update();

  if (waveAnim) cancelAnimationFrame(waveAnim);
  function draw() {
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = '#0D1117'; ctx.fillRect(0,0,W,H);

    // Grid
    ctx.strokeStyle = '#1E2940'; ctx.lineWidth = 1;
    for (let y=0; y<=H; y+=40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
    for (let x=0; x<=W; x+=80) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }

    // Center line
    ctx.strokeStyle = '#2A3A5A'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0,H/2); ctx.lineTo(W,H/2); ctx.stroke();

    const k = (2*Math.PI*freq) / speed;
    const omega = 2*Math.PI*freq;
    const xStart = 0, xEnd = W;    // 입자 루프 범위

    // Forward wave
    ctx.strokeStyle = '#7030A0'; ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let px=0; px<W; px++) {
      const x = px / W * W;
      const xNorm = px / W;
      const y = H/2 - amp * Math.sin(omega*t - k*x);
      if (px===0) ctx.moveTo(px,y); else ctx.lineTo(px,y);
    }
    ctx.stroke();

    // Medium particles — 제자리 상하 진동 (에너지는 이동, 매질은 제자리 진동)
    const nParticles = 14;
    for (let i = 1; i <= nParticles; i++) {
      const px = Math.round(xStart + i * (xEnd - xStart) / (nParticles + 1));
      // 각 입자는 해당 x 위치에서 파동의 변위값으로 수직 진동
      const py = H/2 - amp * Math.sin(omega * t - k * px);
      // 수직 진동 궤적 (흐릿한 선)
      const trailLen = amp * 0.8;
      const grad = ctx.createLinearGradient(px, H/2 - trailLen, px, H/2 + trailLen);
      grad.addColorStop(0, 'rgba(232,123,30,0)');
      grad.addColorStop(0.5, 'rgba(232,123,30,0.18)');
      grad.addColorStop(1, 'rgba(232,123,30,0)');
      ctx.strokeStyle = grad; ctx.lineWidth = 2;
      ctx.setLineDash([2, 3]);
      ctx.beginPath(); ctx.moveTo(px, H/2 - trailLen); ctx.lineTo(px, H/2 + trailLen);
      ctx.stroke(); ctx.setLineDash([]);
      // 입자 점
      ctx.fillStyle = '#F5A85A';
      ctx.beginPath(); ctx.arc(px, py, 4.5, 0, Math.PI*2); ctx.fill();
      // 입자 테두리
      ctx.strokeStyle = '#E87B1E'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(px, py, 4.5, 0, Math.PI*2); ctx.stroke();
    }

    // Labels
    ctx.fillStyle = '#C09EE0'; ctx.font = 'bold 12px "JetBrains Mono",monospace';
    ctx.fillText(isEn?'→ forward wave':'→ 진행파', 10, 20);
    ctx.fillStyle = '#F5A85A'; ctx.font = 'bold 10px "JetBrains Mono",monospace';
    ctx.fillText(isEn?'● medium oscillates in place':'● 매질은 제자리 상하 진동', 10, H - 10);
    ctx.fillStyle = '#AABBCC'; ctx.font = '11px "JetBrains Mono",monospace';
    ctx.fillText(`f=${freq.toFixed(1)}Hz  A=${Math.round(amp)}  v=${Math.round(speed)}`, W-220, 20);

    t += 0.016;
    waveAnim = requestAnimationFrame(draw);
  }
  draw();
}

let bcAnim = null, bcMode = 'free', bcPhase = 0;

window.selectBC = function(mode) {

    match: { ko:'완전 매칭: 반사가 없습니다. 모든 에너지가 투과됩니다. Γ = 0. RF 대응: Z<sub>L</sub> = Z₀', en:'Perfect Match: No reflection. All energy transmits. Γ = 0. RF: Z<sub>L</sub> = Z₀' },
  };

function initBCSim() {
  const canvas = document.getElementById('bcCanvas');
  if (!canvas) return;
  const { ctx, W, H } = setupHiDPI(canvas);
  let t = 0;
  if (bcAnim) cancelAnimationFrame(bcAnim);

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0D1117'; ctx.fillRect(0, 0, W, H);

    const isEn = currentLang === 'en';
    const midY = H/2, amp = 38, k = Math.PI*4/W, omega = Math.PI*2;
    const midX = W * 0.65;

    // Boundary line
    ctx.strokeStyle = bcMode==='fixed'?'#E05050':bcMode==='match'?'#30C870':bcMode==='free'?'#4A9FE0':'#F5A85A';
    ctx.lineWidth = 2.5; ctx.setLineDash([6,4]);
    ctx.beginPath(); ctx.moveTo(midX, 10); ctx.lineTo(midX, H-10); ctx.stroke();
    ctx.setLineDash([]);

    // Incident wave
    ctx.strokeStyle = '#A06CD0'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let px=20; px<=midX; px++) {
      const y = midY - amp * Math.sin(omega*t - k*(px-20)*4);
      if (px===20) ctx.moveTo(px,y); else ctx.lineTo(px,y);
    }
    ctx.stroke();

    // Reflected wave
    if (bcMode !== 'match') {
      const refAmp = bcMode==='partial' ? amp*0.45 : amp;
      const phaseFlip = bcMode==='fixed' ? -1 : 1;
      ctx.strokeStyle = '#F5A85A'; ctx.lineWidth = 2;
      ctx.beginPath();
      for (let px=20; px<=midX; px++) {
        const dist = midX - px;
        const y = midY - refAmp * phaseFlip * Math.sin(omega*t - k*dist*4 + Math.PI);
        if (px===20) ctx.moveTo(px,y); else ctx.lineTo(px,y);
      }
      ctx.stroke();
    }

    // Transmitted wave
    if (bcMode === 'match' || bcMode === 'partial') {
      const transAmp = bcMode==='match' ? amp : amp*0.65;
      ctx.strokeStyle = '#30C870'; ctx.lineWidth = 2;
      ctx.beginPath();
      for (let px=midX; px<=W-20; px++) {
        const y = midY - transAmp * Math.sin(omega*t - k*(px-midX)*4);
        if (px===midX) ctx.moveTo(px,y); else ctx.lineTo(px,y);
      }
      ctx.stroke();
    }

    // Fixed end hatching
    if (bcMode==='fixed') {
      ctx.fillStyle = '#E05050';
      for (let yi=10; yi<H; yi+=14) { ctx.fillRect(midX+1, yi, 10, 7); }
    }

    // Center line
    ctx.strokeStyle = '#2A3A5A'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0,midY); ctx.lineTo(W,midY); ctx.stroke();

    // Labels — bright, readable
    const font13 = 'bold 13px "JetBrains Mono",monospace';
    const font11 = '11px "JetBrains Mono",monospace';
    ctx.font = font13;
    ctx.fillStyle = '#D4AAFF';
    ctx.fillText(isEn?'→ incident':'→ 입사파', 25, midY-48);
    if (bcMode !== 'match') {
      ctx.fillStyle = '#FFBB66';
      ctx.fillText(isEn?'← reflected':'← 반사파', 25, midY+62);
    }
    if (bcMode==='match'||bcMode==='partial') {
      ctx.fillStyle = '#66EEA0';
      ctx.fillText(isEn?'→ transmitted':'→ 투과파', midX+12, midY-48);
    }
    const labels = { free:isEn?'FREE END':'자유단', fixed:isEn?'FIXED END':'고정단', partial:isEn?'PARTIAL':'부분반사', match:isEn?'MATCHED':'완전매칭' };
    ctx.fillStyle = '#FFFFFF';
    ctx.font = 'bold 12px "JetBrains Mono",monospace';
    ctx.fillText(labels[bcMode], midX+10, 22);

    t += 0.016;
    bcAnim = requestAnimationFrame(draw);
  }
  draw();
}

// ── C26: Standing Wave Simulator — Dual Panel ──
let swAnim = null, swPaused = false;

window.toggleSWPause = function() {
  swPaused = !swPaused;
  const btn = document.getElementById('swPauseBtn');
  if (btn) btn.textContent = swPaused
    ? (currentLang==='en' ? '▶ Resume' : '▶ 재생')
    : (currentLang==='en' ? '⏸ Pause' : '⏸ 일시정지');
};

function drawPanel(ctx, W, H, gamma, t, omega, k, amp, isVoltage) {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0D1117'; ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();

  const midY = H / 2;
  // 각 패널은 자신의 amp 기준으로 ±amp 범위 내에서 표시
  // V: 최대진폭 amp*(1+γ)이 H/2 내에 들어오도록 스케일 고정
  // I: 동일하게 amp*(1+γ) 기준 — 독립 스케일이므로 시각적 크기 동일

  // ── 포락선 (물리적으로 올바른 수식) ──
  // V(x,t) = amp·sin(ωt-kx) - γ·amp·sin(ωt+kx)  [반사파 +π 적용]
  // 진폭 포락선 = amp · sqrt(1 + γ² - 2γ·cos(2kx))  [표준 전송선로 공식]
  // → x=0:   (1-γ)  → Node  (최소)
  // → x=λ/4: (1+γ)  → Antinode (최대)
  //
  // I는 V와 cos↔sin 교환 (λ/4 위상 이동):
  // I 포락선 = amp · sqrt(1 + γ² + 2γ·cos(2kx))  [부호 반전]
  // → x=0:   (1+γ)  → I-Antinode (최대)  ← V의 Node와 같은 위치
  // → x=λ/4: (1-γ)  → I-Node (최소)     ← V의 Antinode와 같은 위치
  const envColor  = isVoltage ? '#FFD700' : '#00E5CC';
  const waveColor = isVoltage ? '#A06CD0' : '#30C870';

  ctx.strokeStyle = envColor; ctx.lineWidth = 1; ctx.setLineDash([7, 5]);

  if (gamma < 0.005) {
    // Γ=0: 수평 일자선 (진폭 = amp 고정)
    ctx.beginPath(); ctx.moveTo(0, midY - amp); ctx.lineTo(W, midY - amp); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, midY + amp); ctx.lineTo(W, midY + amp); ctx.stroke();
  } else {
    // 올바른 포락선
    // V: sqrt(1 + γ² - 2γ·cos(2kx))  → 부호 -
    // I: sqrt(1 + γ² + 2γ·cos(2kx))  → 부호 +
    const sign = isVoltage ? -1 : +1;
    ctx.beginPath();
    for (let px = 0; px < W; px++) {
      const e = amp * Math.sqrt(1 + gamma*gamma + sign*2*gamma*Math.cos(2*k*px));
      if (px === 0) ctx.moveTo(px, midY - e); else ctx.lineTo(px, midY - e);
    }
    ctx.stroke();
    ctx.beginPath();
    for (let px = 0; px < W; px++) {
      const e = amp * Math.sqrt(1 + gamma*gamma + sign*2*gamma*Math.cos(2*k*px));
      if (px === 0) ctx.moveTo(px, midY + e); else ctx.lineTo(px, midY + e);
    }
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // 파동 (2px 실선)
  ctx.strokeStyle = waveColor; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let px = 0; px < W; px++) {
    let val;
    if (isVoltage) {
      // V(x,t) = amp·sin(ωt - kx) + γ·amp·sin(ωt + kx + π)
      val = amp * Math.sin(omega * t - k * px)
          + gamma * amp * Math.sin(omega * t + k * px + Math.PI);
    } else {
      // I(x,t) = amp·cos(ωt - kx) - γ·amp·cos(ωt + kx + π)
      // → I는 V와 90° 위상차, V_max에서 I=0, V=0에서 I_max
      val = amp * Math.cos(omega * t - k * px)
          - gamma * amp * Math.cos(omega * t + k * px + Math.PI);
    }
    if (px === 0) ctx.moveTo(px, midY - val); else ctx.lineTo(px, midY - val);
  }
  ctx.stroke();

  // 중심선
  ctx.strokeStyle = '#2A3A5A'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, midY); ctx.lineTo(W, midY); ctx.stroke();

  // ── Node / Antinode 마커 + 레이블 (γ > 0.1) ──
  if (gamma > 0.1) {
    const lambda    = (2 * Math.PI) / k;
    const halfLambda = lambda / 2;
    const nodeLabel      = isVoltage ? 'V-node'      : 'I-node';
    const antinodeLabel  = isVoltage ? 'V-antinode'  : 'I-antinode';
    const nodeColor      = isVoltage ? '#FFD700CC'   : '#00E5CCCC';
    const antinodeColor  = isVoltage ? '#A06CD0CC'   : '#30C870CC';

    // 새 포락선: V는 x=0에서 최소(Node), x=λ/4에서 최대(Antinode)
    //            I는 x=0에서 최대(Antinode), x=λ/4에서 최소(Node)
    const firstNodeX     = isVoltage ? 0         : Math.PI / (2 * k);  // V-node@0, I-node@λ/4
    const firstAntinodeX = isVoltage ? Math.PI / (2 * k) : 0;          // V-anti@λ/4, I-anti@0

    ctx.font = '10px "JetBrains Mono",monospace';

    // Node 마커
    for (let nx = firstNodeX; nx < W; nx += halfLambda) {
      const px = Math.round(nx);
      if (px < 4 || px >= W - 4) continue;
      const env_min = amp * (1 - gamma);  // Node에서 포락선 최소값

      // 수직 점선
      ctx.strokeStyle = '#FFFFFF22'; ctx.lineWidth = 1; ctx.setLineDash([3,3]);
      ctx.beginPath(); ctx.moveTo(px, 6); ctx.lineTo(px, H - 6); ctx.stroke();
      ctx.setLineDash([]);

      // 위쪽 삼각형 (포락선 최소점 아래에)
      ctx.fillStyle = nodeColor;
      ctx.beginPath();
      ctx.moveTo(px, midY - env_min - 3);
      ctx.lineTo(px - 5, midY - env_min - 12);
      ctx.lineTo(px + 5, midY - env_min - 12);
      ctx.closePath(); ctx.fill();

      ctx.fillStyle = nodeColor;
      ctx.textAlign = 'center';
      ctx.fillText(nodeLabel, px, midY - env_min - 14);
      ctx.textAlign = 'left';
    }

    // Antinode 마커
    for (let nx = firstAntinodeX; nx < W; nx += halfLambda) {
      const px = Math.round(nx);
      if (px < 4 || px >= W - 4) continue;
      const env_max = amp * (1 + gamma);  // Antinode에서 포락선 최대값

      ctx.fillStyle = antinodeColor;
      ctx.beginPath();
      ctx.moveTo(px, midY - env_max + 3);
      ctx.lineTo(px - 5, midY - env_max + 12);
      ctx.lineTo(px + 5, midY - env_max + 12);
      ctx.closePath(); ctx.fill();

      ctx.fillStyle = antinodeColor;
      ctx.textAlign = 'center';
      ctx.fillText(antinodeLabel, px, midY - env_max + 22);
      ctx.textAlign = 'left';
    }
  }

  ctx.restore();
}

function initSWSim() {
  const vCanvas = document.getElementById('swVCanvas');
  const iCanvas = document.getElementById('swICanvas');
  if (!vCanvas || !iCanvas) return;

  const { ctx: vCtx, W: vW, H: vH } = setupHiDPI(vCanvas);
  const { ctx: iCtx, W: iW, H: iH } = setupHiDPI(iCanvas);

  let t = 0;
  const isEn = currentLang === 'en';
  const gammaSlider = document.getElementById('gammaSlider');
  const FONT_B = 'bold 13px "JetBrains Mono",monospace';
  const FONT_S = '11px "JetBrains Mono",monospace';

  if (swAnim) cancelAnimationFrame(swAnim);

  function draw() {
    const gamma = parseFloat(gammaSlider.value);
    document.getElementById('gammaVal').textContent = gamma.toFixed(2);
    const vswr = gamma < 1 ? (1 + gamma) / (1 - gamma) : 999;
    const refl = (gamma * gamma * 100).toFixed(1);
    document.getElementById('swInfo').innerHTML =
      `Γ = ${gamma.toFixed(2)} &nbsp;|&nbsp; VSWR = ${vswr < 999 ? vswr.toFixed(2) : '∞'} &nbsp;|&nbsp; ${isEn ? 'Reflected Power' : '반사전력'} = ${refl}%`;

    const omega = 2 * Math.PI * 1.5;
    const k = 2 * Math.PI / (vW * 0.6);

    // amp 고정: γ=0에서 H/4 크기(절반), γ=1에서 H/2(두 배)가 되도록
    // γ=1 최대진폭 = amp*(1+1) = 2*amp <= H/2 - margin
    // → amp = (H/2 - margin) / 2  (γ에 무관하게 고정)
    const amp = (vH / 2 - 8) / 2;

    // V 패널
    drawPanel(vCtx, vW, vH, gamma, t, omega, k, amp, true);
    vCtx.font = FONT_B; vCtx.fillStyle = '#D4AAFF';
    vCtx.fillText('V(x)', 8, 18);
    vCtx.font = FONT_S; vCtx.fillStyle = '#CCDDEE';
    vCtx.fillText('RF Source', 8, vH - 10);
    vCtx.fillText(isEn ? 'Load' : '부하', vW - 52, vH - 10);

    // Vmax / Vmin 주석
    if (gamma > 0.02) {
      const Vmax = amp * (1 + gamma), Vmin = amp * (1 - gamma);
      vCtx.font = FONT_S; vCtx.fillStyle = '#FFD700';
      vCtx.fillText(`Vmax = ${Vmax.toFixed(0)}`, vW - 115, vH/2 - Vmax + 14);
      vCtx.fillText(`Vmin = ${Vmin.toFixed(0)}`, vW - 115, vH/2 - Vmin - 4);
    }

    // I 패널
    drawPanel(iCtx, iW, iH, gamma, t, omega, k, amp, false);
    iCtx.font = FONT_B; iCtx.fillStyle = '#66EEA0';
    iCtx.fillText('I(x)', 8, 18);
    iCtx.font = FONT_S; iCtx.fillStyle = '#CCDDEE';
    iCtx.fillText('RF Source', 8, iH - 10);
    iCtx.fillText(isEn ? 'Load' : '부하', iW - 52, iH - 10);

    // Imax / Imin 주석
    if (gamma > 0.02) {
      const Imax = amp * (1 + gamma), Imin = amp * (1 - gamma);
      iCtx.font = FONT_S; iCtx.fillStyle = '#00E5CC';
      iCtx.fillText(`Imax = ${Imax.toFixed(0)}`, iW - 115, iH/2 - Imax + 14);
      iCtx.fillText(`Imin = ${Imin.toFixed(0)}`, iW - 115, iH/2 - Imin - 4);
    }

    if (!swPaused) t += 0.014;
    swAnim = requestAnimationFrame(draw);
  }
  draw();
}

// ── C27: VSWR Calculator + Standing Wave ──
let vswrAnim = null;
function initVSWRSim() {
  const swCanvas  = document.getElementById('vswrSwCanvas');
  const barCanvas = document.getElementById('vswrCanvas');
  if (!swCanvas || !barCanvas) return;

  const { ctx: swCtx,  W: SW, H: SH } = setupHiDPI(swCanvas);
  const { ctx: barCtx, W: BW, H: BH } = setupHiDPI(barCanvas);

  const gammaSlider = document.getElementById('vswr-gamma');
  const vswrSlider  = document.getElementById('vswr-direct');
  const isEn = currentLang === 'en';
  let t = 0;

  window.syncVSWRfromVSWR = function(vswrVal) {
    const vswr = parseFloat(vswrVal);
    const g = (vswr - 1) / (vswr + 1);
    gammaSlider.value = Math.min(0.99, g).toFixed(3);
    document.getElementById('vswr-direct-val').textContent = vswr.toFixed(2);
  };
  gammaSlider.addEventListener('input', () => {
    const g = parseFloat(gammaSlider.value);
    const vswr = g < 0.99 ? (1+g)/(1-g) : 999;
    vswrSlider.value = Math.min(20, vswr).toFixed(2);
    document.getElementById('vswr-direct-val').textContent = Math.min(20, vswr).toFixed(2);
  });

  const BFONT = 'bold 13px "JetBrains Mono",monospace';
  const NFONT = '11px "JetBrains Mono",monospace';

  function drawAll() {
    const gamma   = parseFloat(gammaSlider.value);
    document.getElementById('vswr-gamma-val').textContent = gamma.toFixed(2);
    const vswr    = gamma < 0.99 ? (1+gamma)/(1-gamma) : 999;
    const reflPct = (gamma*gamma*100).toFixed(1);
    const delPct  = (100 - gamma*gamma*100).toFixed(1);
    document.getElementById('ri-vswr').textContent  = vswr < 999 ? vswr.toFixed(2) : '\u221e';
    document.getElementById('ri-gamma').textContent = gamma.toFixed(3);
    document.getElementById('ri-refl').textContent  = reflPct + '%';
    document.getElementById('ri-del').textContent   = delPct  + '%';

    /* Standing Wave Canvas */
    swCtx.clearRect(0, 0, SW, SH);
    swCtx.fillStyle = '#0D1117'; swCtx.fillRect(0, 0, SW, SH);
    swCtx.save(); swCtx.beginPath(); swCtx.rect(0, 0, SW, SH); swCtx.clip();

    const midY = SH / 2;
    const amp  = (SH / 2 - 10) / 2;
    const k    = 2 * Math.PI / (SW * 0.6);
    const omega = 2 * Math.PI * 1.5;

    swCtx.strokeStyle = '#FFD700'; swCtx.lineWidth = 1; swCtx.setLineDash([7, 4]);
    if (gamma < 0.005) {
      swCtx.beginPath(); swCtx.moveTo(0, midY-amp); swCtx.lineTo(SW, midY-amp); swCtx.stroke();
      swCtx.beginPath(); swCtx.moveTo(0, midY+amp); swCtx.lineTo(SW, midY+amp); swCtx.stroke();
    } else {
      swCtx.beginPath();
      for (let px = 0; px < SW; px++) {
        const e = amp * Math.sqrt(1 + gamma*gamma - 2*gamma*Math.cos(2*k*px));
        if (px===0) swCtx.moveTo(px, midY-e); else swCtx.lineTo(px, midY-e);
      }
      swCtx.stroke();
      swCtx.beginPath();
      for (let px = 0; px < SW; px++) {
        const e = amp * Math.sqrt(1 + gamma*gamma - 2*gamma*Math.cos(2*k*px));
        if (px===0) swCtx.moveTo(px, midY+e); else swCtx.lineTo(px, midY+e);
      }
      swCtx.stroke();
    }
    swCtx.setLineDash([]);

    swCtx.strokeStyle = '#A06CD0'; swCtx.lineWidth = 2;
    swCtx.beginPath();
    for (let px = 0; px < SW; px++) {
      const V = amp * Math.sin(omega*t - k*px)
              + gamma * amp * Math.sin(omega*t + k*px + Math.PI);
      if (px===0) swCtx.moveTo(px, midY-V); else swCtx.lineTo(px, midY-V);
    }
    swCtx.stroke();

    swCtx.strokeStyle = '#2A3A5A'; swCtx.lineWidth = 1;
    swCtx.beginPath(); swCtx.moveTo(0, midY); swCtx.lineTo(SW, midY); swCtx.stroke();
    swCtx.restore();

    swCtx.font = BFONT; swCtx.fillStyle = '#FFE066';
    swCtx.fillText(isEn ? 'V envelope  (Vmax / Vmin)' : 'V \ud3ec\ub77d\uc120  (Vmax / Vmin)', 10, 20);
    swCtx.fillStyle = '#D4AAFF';
    swCtx.fillText('V(x)', 10, SH - 10);

    if (gamma > 0.01) {
      const Vmax = amp*(1+gamma), Vmin = amp*(1-gamma);
      swCtx.font = NFONT; swCtx.fillStyle = '#FFE066';
      swCtx.fillText('Vmax = ' + Vmax.toFixed(1), SW - 130, Math.max(16, midY - Vmax + 14));
      if (Vmin > 2) swCtx.fillText('Vmin = ' + Vmin.toFixed(1), SW - 130, midY - Vmin - 5);
      else          swCtx.fillText('Vmin \u2248 0', SW - 110, midY - 5);
    }

    /* Power Bar Canvas */
    barCtx.clearRect(0, 0, BW, BH);
    barCtx.fillStyle = '#0D1117'; barCtx.fillRect(0, 0, BW, BH);

    const barY = 14, barH = 40, barX = 72, barW = BW - 92;
    barCtx.fillStyle = '#1E2940'; barCtx.fillRect(barX, barY, barW, barH);
    const delW  = barW * (1 - gamma*gamma);
    const reflW = barW * gamma*gamma;
    const grd = barCtx.createLinearGradient(barX, 0, barX+delW, 0);
    grd.addColorStop(0, '#0F8C50'); grd.addColorStop(1, '#1AB564');
    barCtx.fillStyle = grd; barCtx.fillRect(barX, barY, delW, barH);
    if (reflW > 2) { barCtx.fillStyle = '#C0392B'; barCtx.fillRect(barX+delW, barY, reflW, barH); }
    barCtx.strokeStyle = '#333'; barCtx.lineWidth = 1; barCtx.strokeRect(barX, barY, barW, barH);
    barCtx.font = BFONT; barCtx.fillStyle = '#fff';
    if (delW > 80)  barCtx.fillText((isEn?'Delivered ':'\uc804\ub2ec ') + delPct+'%', barX+10, barY+26);
    if (reflW > 70) barCtx.fillText((isEn?'Refl ':'\ubc18\uc0ac ') + reflPct+'%', barX+delW+8, barY+26);

    const scaleY = 66, scaleX = 72, scaleW = BW - 92;
    barCtx.fillStyle = '#555'; barCtx.fillRect(scaleX, scaleY+6, scaleW, 2);
    const marks = [{v:1,l:'1'},{v:1.5,l:'1.5'},{v:2,l:'2'},{v:3,l:'3'},{v:5,l:'5'},{v:10,l:'10'},{v:20,l:'20+'}];
    marks.forEach(m => {
      const g = (m.v-1)/(m.v+1);
      const px = scaleX + (g/0.99)*scaleW;
      barCtx.fillStyle = '#444'; barCtx.fillRect(px, scaleY, 1, 14);
      barCtx.fillStyle = '#AABBCC'; barCtx.font = NFONT;
      barCtx.textAlign = 'center'; barCtx.fillText(m.l, px, scaleY+26); barCtx.textAlign = 'left';
    });
    barCtx.fillStyle = '#AABBCC'; barCtx.font = NFONT;
    barCtx.fillText('VSWR', scaleX - 64, scaleY + 12);

    const markerX = scaleX + (gamma/0.99)*scaleW;
    const mColor  = vswr<1.5 ? '#0F8C50' : vswr<2 ? '#E87B1E' : '#C0392B';
    barCtx.fillStyle = mColor;
    barCtx.beginPath(); barCtx.arc(markerX, scaleY+7, 9, 0, Math.PI*2); barCtx.fill();
    barCtx.fillStyle = '#fff'; barCtx.font = 'bold 10px "JetBrains Mono",monospace';
    barCtx.textAlign = 'center';
    barCtx.fillText(vswr<999 ? vswr.toFixed(1) : '\u221e', markerX, scaleY+11);
    barCtx.textAlign = 'left';
    barCtx.fillStyle = '#888'; barCtx.font = NFONT;
    barCtx.fillText(isEn ? '\u2190 better  worse \u2192' : '\u2190 \uc591\ud638  \ubd88\ub7c9 \u2192', scaleX, BH - 5);

    t += 0.016;
    vswrAnim = requestAnimationFrame(drawAll);
  }

  if (vswrAnim) cancelAnimationFrame(vswrAnim);
  drawAll();
}



/* ═══════════════════════════════════════════
   NAVIGATION & EVENTS
═══════════════════════════════════════════ */
function navigateTo(id) {
  // Cancel running animations
  if (waveAnim) { cancelAnimationFrame(waveAnim); waveAnim=null; }
  if (bcAnim) { cancelAnimationFrame(bcAnim); bcAnim=null; }
  if (swAnim) { cancelAnimationFrame(swAnim); swAnim=null; }

  currentId = id;
  currentTab = 'diagram';
  renderDetail(id);
  renderSidebar();
  window.scrollTo(0,0);
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  const pane = document.getElementById('tab-'+tab);
  if (pane) pane.classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b=>{
    if (b.getAttribute('onclick')===`switchTab('${tab}')`) b.classList.add('active');
  });
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise();
}

function setLang(lang) {
  if (waveAnim) { cancelAnimationFrame(waveAnim); waveAnim=null; }
  if (bcAnim) { cancelAnimationFrame(bcAnim); bcAnim=null; }
  if (swAnim) { cancelAnimationFrame(swAnim); swAnim=null; }
  currentLang = lang;
  document.getElementById('btn-ko').classList.toggle('active', lang==='ko');
  document.getElementById('btn-en').classList.toggle('active', lang==='en');
  renderDetail(currentId);
  renderSidebar();
}

function checkQuiz(el, correct, id) {
  const opts = el.parentElement.querySelectorAll('.quiz-opt');
  opts.forEach(o => o.style.pointerEvents='none');
  el.classList.add(correct?'correct':'wrong');
  const fb = document.getElementById('qfb-'+id);
  const s = getSlide(id);
  if (fb && s) {
    fb.textContent = correct ? s.classroom.feedback_ok : s.classroom.feedback_ng;
    fb.className = 'quiz-feedback show ' + (correct?'ok':'ng');
  }
}

function openImgPopup(src, cap) {
  document.getElementById('img-popup-img').src=src;
  document.getElementById('img-popup-cap').textContent=cap;
  document.getElementById('img-popup').classList.add('open');
}
function closeImgPopup() { document.getElementById('img-popup').classList.remove('open'); }

/* ═══════════════════════════════════════════
   TOGGLE ANSWER — Q1/Q2 정답 표시/숨김
═══════════════════════════════════════════ */
window.toggleAnswer = function(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const isHidden = el.style.display === 'none';
  el.style.display = isHidden ? 'block' : 'none';
  // 버튼 텍스트 토글
  const btn = el.previousElementSibling
    ? el.closest('.d-wrap, [style*="overflow:hidden"]')
      ?.querySelector('button[onclick*="' + id + '"]')
    : null;
};

// ─────────────────────────────────────────────
//  SIDEBAR TOGGLE
// ─────────────────────────────────────────────
function toggleSidebar() {
  const hidden = document.body.classList.toggle('sidebar-hidden');
  const btn = document.getElementById('sidebar-toggle');
  if (btn) btn.textContent = hidden ? '▶' : '◀';
}

/* ═══════════════════════════════════════════
   TOGGLE DEEP DIVE — 펼침/접힘 (기본: 펼침)
═══════════════════════════════════════════ */
window.toggleDeepDive = function(id) {
  const body = document.getElementById(id);
  const arrow = document.getElementById(id + '-arrow');
  if (!body) return;
  const isOpen = body.style.display !== 'none';
  body.style.display = isOpen ? 'none' : 'block';
  if (arrow) arrow.textContent = isOpen ? '▼' : '▲';
};

/* ═══════════════════════════════════════════
   RF PARAMETER CALCULATOR
═══════════════════════════════════════════ */
function calcUpdateResult(gamma) {
  if (isNaN(gamma) || gamma < 0) return;
  gamma = Math.min(gamma, 0.9999);
  const vswr   = (1 + gamma) / (1 - gamma);
  const reflPct = (gamma * gamma * 100);
  const delPct  = 100 - reflPct;
  const rl      = gamma > 0 ? -20 * Math.log10(gamma) : Infinity;

  document.getElementById('cr-gamma').textContent = gamma.toFixed(4);
  document.getElementById('cr-vswr').textContent  = vswr.toFixed(3);
  document.getElementById('cr-refl').textContent  = reflPct.toFixed(2) + '%';
  document.getElementById('cr-del').textContent   = delPct.toFixed(2) + '%';
  document.getElementById('cr-rl').textContent    = isFinite(rl) ? rl.toFixed(2) + ' dB' : '∞ dB';

  // 슬라이더 연동
  const gs = document.getElementById('vswr-gamma');
  const vs = document.getElementById('vswr-direct');
  if (gs) gs.value = Math.min(0.99, gamma).toFixed(4);
  if (vs) vs.value = Math.min(20, vswr).toFixed(3);
  const gv = document.getElementById('vswr-gamma-val');
  const vv = document.getElementById('vswr-direct-val');
  if (gv) gv.textContent = Math.min(0.99, gamma).toFixed(2);
  if (vv) vv.textContent = Math.min(20, vswr).toFixed(2);
}

window.calcFromGamma = function(val) {
  const gamma = parseFloat(val);
  if (isNaN(gamma) || val === '') return;
  // 다른 필드 초기화
  const v = document.getElementById('calc-vswr');
  const pf = document.getElementById('calc-pf');
  const pr = document.getElementById('calc-pr');
  if (v) v.value = '';
  if (pf) pf.value = '';
  if (pr) pr.value = '';
  calcUpdateResult(gamma);
};

window.calcFromVSWR = function(val) {
  const vswr = parseFloat(val);
  if (isNaN(vswr) || vswr < 1 || val === '') return;
  const gamma = (vswr - 1) / (vswr + 1);
  const g = document.getElementById('calc-gamma');
  const pf = document.getElementById('calc-pf');
  const pr = document.getElementById('calc-pr');
  if (g) g.value = '';
  if (pf) pf.value = '';
  if (pr) pr.value = '';
  calcUpdateResult(gamma);
};

window.calcFromPower = function() {
  const pf = parseFloat(document.getElementById('calc-pf').value);
  const pr = parseFloat(document.getElementById('calc-pr').value);
  if (isNaN(pf) || isNaN(pr) || pf <= 0 || pr < 0) return;
  if (pr > pf) return;  // 물리적으로 불가
  const gamma = Math.sqrt(pr / pf);
  const g = document.getElementById('calc-gamma');
  const v = document.getElementById('calc-vswr');
  if (g) g.value = '';
  if (v) v.value = '';
  calcUpdateResult(gamma);
};

window.clearCalc = function() {
  ['calc-gamma','calc-vswr','calc-pf','calc-pr'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  ['cr-gamma','cr-vswr','cr-refl','cr-del','cr-rl'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.textContent = '—';
  });
};

// Init
window.addEventListener('DOMContentLoaded', ()=>{
  renderSidebar();
  renderDetail(currentId);
});
</script>
