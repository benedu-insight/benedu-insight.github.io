    }};
  };

  /* ---------------- Faraday lab: drag the magnet, Φ & ε graph, Lenz ---------------- */
  AF.B.faraday = function(box){
    box.innerHTML = '<div class="af-stage"></div><div class="af-panel">'+
      '<div><div class="af-row"><span class="k">'+L('Coil turns N','코일 감은 수 N')+'</span><span class="v faNv">10</span></div><input type="range" class="faN" min="1" max="20" step="1" value="10"></div>'+
      '<div class="af-row" style="justify-content:flex-start;gap:10px"><button class="af-chip faAuto" type="button"></button><span class="k">'+L('Speed','속도')+'</span><input type="range" class="faSp" min="0.3" max="2.5" step="0.1" value="1" style="flex:1"></div>'+
      '<div><span class="k">'+L('Flux through the coil Φ','코일을 지나는 자기선속 Φ')+'</span><div class="af-bar"><i class="faPhi"></i></div></div>'+
      '<div class="af-row"><span class="k">'+L('Induced voltage ε','유도 전압 ε')+'</span><span class="af-big faV" style="font-size:28px">0.0 mV</span></div>'+
      '<div class="af-sd faT" style="min-height:66px"></div>'+
      '<div class="af-row" style="flex-wrap:wrap"><span class="af-eqn">ε = −N <span class="af-frac"><span class="fn">dΦ</span><span class="fd">dt</span></span></span>'+
      '<a class="af-link" href="https://phet.colorado.edu/sims/html/faradays-electromagnetic-lab/latest/faradays-electromagnetic-lab_all.html" target="_blank" rel="noopener">'+L('▶ PhET simulator ↗','▶ PhET 시뮬레이터 ↗')+'</a></div></div>';
    var cv = AF.cv(560, 380); cv.style.touchAction = 'pan-y'; box.querySelector('.af-stage').appendChild(cv);
    var cx = cv.getContext('2d'); cx.scale(2,2);
    var W = 560, H = 380, YM = 118, XC = 392, MW = 92, MH = 30;
    var xm = 150, N = 10, auto = false, sp = 1, t = 0, ta = 0, drag = false, dx0 = 0;
    var MPX = 0.0003, PHI0 = 2e-5, A = 0.021;
    var eps = 0, hist = [], dots = 0, prevPhi = null;
    function $(c){ return box.querySelector('.'+c); }
    var sN = $('faN'), sS = $('faSp'), bA = $('faAuto');
    sN.addEventListener('input', function(){ N = +sN.value; $('faNv').textContent = N; });
    sS.addEventListener('input', function(){ sp = +sS.value; });
    bA.addEventListener('click', function(){ auto = !auto; ta = Math.asin(Math.max(-1, Math.min(1, (xm - 225)/150))); btn(); });
    function btn(){ bA.classList.toggle('on', auto); bA.textContent = auto ? L('■ Stop','■ 멈춤') : L('▶ Auto motion','▶ 자동 왕복'); }
    function pt(e){ var r = cv.getBoundingClientRect(); return [(e.clientX - r.left)*W/r.width, (e.clientY - r.top)*H/r.height]; }
    cv.addEventListener('pointerdown', function(e){ var p = pt(e); if(Math.abs(p[0]-xm) < MW/2+10 && Math.abs(p[1]-YM) < MH){ drag = true; auto = false; btn(); dx0 = p[0]-xm; cv.setPointerCapture(e.pointerId); } });
    cv.addEventListener('pointermove', function(e){ if(drag){ var p = pt(e); xm = Math.max(60, Math.min(XC+10, p[0]-dx0)); } });
    cv.addEventListener('pointerup', function(){ drag = false; });
    cv.addEventListener('pointercancel', function(){ drag = false; });
    function phi(x){ var u = (XC - x) * MPX / A; return PHI0 / Math.pow(1 + u*u, 1.5); }
    function coilHalf(front){
      for(var i=0;i<9;i++){ var x = XC - 40 + i*10;
        cx.beginPath(); cx.ellipse(x, YM, 14, 52, 0, front ? -Math.PI/2 : Math.PI/2, front ? Math.PI/2 : Math.PI*1.5);
        var g = cx.createLinearGradient(x-14, 0, x+14, 0); g.addColorStop(0, front ? '#e8a46a' : '#6b4424'); g.addColorStop(1, front ? '#b8692e' : '#4a2e17');
        cx.strokeStyle = g; cx.lineWidth = front ? 4.5 : 3.5; cx.stroke(); }
    }
    btn();
    return {draw:function(dt){
      t += dt;
      if(auto){ ta += dt*sp*1.6; xm = 225 + 150*Math.sin(ta); }
      var Phi = phi(xm), dPhi = prevPhi === null ? 0 : (Phi - prevPhi)/Math.max(dt, 1e-3); prevPhi = Phi;
      var eRaw = -N*dPhi; eps += (eRaw - eps)*Math.min(1, dt*12);
      var emV = eps*1000, eMax = N*PHI0*0.86/A*(240*MPX)*1000;
      hist.push([Phi/PHI0, Math.max(-1.2, Math.min(1.2, emV/eMax))]); if(hist.length > 330) hist.shift();
      $('faPhi').style.width = (Phi/PHI0*100).toFixed(1) + '%';
      $('faV').textContent = (Math.abs(emV) < 0.05 ? '0.0' : emV.toFixed(1)) + ' mV';
      var mov = Math.abs(dPhi) > PHI0*0.02;
      $('faT').textContent = !mov ? L('Magnet still → flux not changing → no voltage.','자석이 멈춤 → 선속 변화 없음 → 전압 없음.')
        : dPhi > 0 ? L('Approaching → flux rising → voltage appears. The coil makes an N pole facing the magnet to push it back (Lenz).','다가감 → 선속 증가 → 전압 발생. 코일은 자석 쪽에 N극을 만들어 밀어냅니다 (렌츠 법칙).')
        : L('Leaving → flux falling → the voltage reverses. The coil makes an S pole to pull it back (Lenz).','멀어짐 → 선속 감소 → 전압 부호 반대. 코일은 S극을 만들어 끌어당깁니다 (렌츠 법칙).');
      var bg = cx.createRadialGradient(W*.5,H*.4,20,W*.5,H*.5,W*.75);
      bg.addColorStop(0,'#15283b'); bg.addColorStop(.6,'#0c1520'); bg.addColorStop(1,'#070b11');
      cx.clearRect(0,0,W,H); cx.fillStyle = bg; cx.fillRect(0,0,W,H);
      var mc = xm;
      cx.setLineDash([5,6]); cx.lineDashOffset = -t*18; cx.lineWidth = 1.1;
      for(var k=1;k<=4;k++){ cx.strokeStyle = 'rgba(190,170,255,'+(0.34 - k*0.05).toFixed(2)+')';
        cx.beginPath(); cx.ellipse(mc, YM, MW/2 + k*30, 10 + k*19, 0, 0, 6.283); cx.stroke(); }
      cx.setLineDash([]);
      coilHalf(false);
      var gN = cx.createLinearGradient(0, YM-MH/2, 0, YM+MH/2); gN.addColorStop(0,'#ff8fb6'); gN.addColorStop(1,'#d92e68');
      var gS = cx.createLinearGradient(0, YM-MH/2, 0, YM+MH/2); gS.addColorStop(0,'#8fc4ee'); gS.addColorStop(1,'#2a5f8f');
      cx.fillStyle = gS; rr(cx, xm - MW/2, YM - MH/2, MW/2, MH, 5); cx.fill();
      cx.fillStyle = gN; rr(cx, xm, YM - MH/2, MW/2, MH, 5); cx.fill();
      cx.fillStyle = '#fff'; cx.font = '700 16px '+GS; cx.textAlign = 'center'; cx.textBaseline = 'middle';
      cx.fillText('S', xm - MW/4, YM+1); cx.fillText('N', xm + MW/4, YM+1);
      if(!drag && !auto){ cx.fillStyle = 'rgba(255,255,255,.55)'; cx.font = '500 11px '+GS; cx.fillText(L('↔ drag me','↔ 끌어서 움직이기'), xm, YM - MH/2 - 12); }
      coilHalf(true);
      if(mov){ var pol = dPhi > 0 ? 'N' : 'S', pc = dPhi > 0 ? '#ff8fb6' : '#8fc4ee';
        cx.fillStyle = pc; cx.font = '700 15px '+GS; cx.fillText(pol, XC - 62, YM - 62);
        cx.font = '600 10px '+GS; cx.fillStyle = 'rgba(255,255,255,.6)'; cx.fillText(L('induced','유도 극'), XC - 62, YM - 46); }
      var mX = 500, mY = 232, L1 = XC - 40, L2 = XC + 40;
      cx.strokeStyle = '#b8692e'; cx.lineWidth = 2.5;
      cx.beginPath(); cx.moveTo(L1, YM + 50); cx.lineTo(L1, mY + 34); cx.lineTo(mX - 20, mY + 34); cx.lineTo(mX - 20, mY + 6); cx.stroke();
      cx.beginPath(); cx.moveTo(L2, YM + 50); cx.lineTo(L2, mY - 4); cx.lineTo(mX - 44, mY - 4); cx.stroke();
      dots += emV/eMax*dt*90;
      cx.fillStyle = '#ffd166';
      if(Math.abs(emV/eMax) > 0.02) for(var d=0; d<6; d++){ var s = ((d*22 + dots) % 132 + 132) % 132;
        var px, py; if(s < 60){ px = L1; py = YM + 50 + s; } else { px = L1 + (s-60)*1.0; py = mY + 34; }
        if(py <= mY + 34 && px <= mX - 20){ cx.beginPath(); cx.arc(px, py, 2.4, 0, 6.283); cx.fill(); } }
      cx.fillStyle = '#e9edf2'; cx.beginPath(); cx.arc(mX, mY, 44, Math.PI, 0); cx.closePath(); cx.fill();
      cx.strokeStyle = '#7a8796'; cx.lineWidth = 1;
      for(var k2=-4;k2<=4;k2++){ var aa = -Math.PI/2 + k2*0.28; cx.beginPath(); cx.moveTo(mX + Math.cos(aa)*36, mY + Math.sin(aa)*36); cx.lineTo(mX + Math.cos(aa)*42, mY + Math.sin(aa)*42); cx.stroke(); }
      var nd = Math.max(-1.15, Math.min(1.15, emV/eMax*1.1)), an = -Math.PI/2 + nd;
      cx.strokeStyle = '#e8336f'; cx.lineWidth = 3; cx.beginPath(); cx.moveTo(mX, mY); cx.lineTo(mX + Math.cos(an)*38, mY + Math.sin(an)*38); cx.stroke();
      cx.fillStyle = '#0a0a0a'; cx.beginPath(); cx.arc(mX, mY, 4, 0, 6.283); cx.fill();
      cx.fillStyle = '#334'; cx.font = '700 11px "JetBrains Mono",monospace'; cx.fillText('mV', mX, mY - 14);
      var gx0 = 22, gx1 = W - 22, gy0 = 286, gh = 70, gm = gy0 + gh/2;
      cx.fillStyle = 'rgba(255,255,255,.04)'; rr(cx, gx0 - 6, gy0 - 8, gx1 - gx0 + 12, gh + 16, 10); cx.fill();
      cx.strokeStyle = 'rgba(255,255,255,.15)'; cx.lineWidth = 1; cx.beginPath(); cx.moveTo(gx0, gm); cx.lineTo(gx1, gm); cx.stroke();
      function trace(idx, col, base, sc){ cx.strokeStyle = col; cx.lineWidth = 2; cx.beginPath();
        hist.forEach(function(h, i){ var x = gx1 - (hist.length - 1 - i)*(gx1 - gx0)/330, y = base - h[idx]*sc; i ? cx.lineTo(x, y) : cx.moveTo(x, y); }); cx.stroke(); }
      trace(0, '#b9a6ff', gy0 + gh, gh*0.9);
      trace(1, '#ffd166', gm, gh*0.42);
      cx.font = '700 11.5px '+GS; cx.textAlign = 'left'; cx.textBaseline = 'top';
      cx.fillStyle = '#b9a6ff'; cx.fillText(L('Φ flux','Φ 자기선속'), gx0, gy0 - 4);
      cx.fillStyle = '#ffd166'; cx.fillText(L('ε voltage (= slope of Φ)','ε 유도 전압 (= Φ 기울기)'), gx0 + 82, gy0 - 4);
    }};
  };

  /* ---------------- Ampère lab: wire, field circles, compasses, probe, DC/AC ---------------- */
  AF.B.ampere = function(box){
    box.innerHTML = '<div class="af-stage"></div><div class="af-panel">'+
      '<div class="af-row" style="justify-content:flex-start;gap:10px"><span class="k">'+L('Current type','전류 종류')+'</span><div class="af-chips"><button type="button" class="af-chip on" data-am="dc">'+L('DC','직류 DC')+'</button><button type="button" class="af-chip" data-am="ac">'+L('AC (RF)','교류 AC (RF)')+'</button></div></div>'+
      '<div><div class="af-row"><span class="k">'+L('Current I','전류 I')+'</span><span class="v amIv">10 A</span></div><input type="range" class="amI" min="-20" max="20" step="1" value="10"></div>'+
      '<div class="af-rows"><div><span>'+L('Distance r (drag the probe)','거리 r (탐침을 끌어 보세요)')+'</span><b class="amR">—</b></div><div><span>'+L('Magnetic field B = μ₀I / 2πr','자기장 B = μ₀I / 2πr')+'</span><b class="amB">—</b></div></div>'+
      '<div class="af-mono amC" style="min-height:14px"></div><div class="af-sd amT" style="min-height:66px"></div>'+
      '<div class="af-row" style="flex-wrap:wrap"><span class="af-eqn">∮ B·dl = μ₀ I</span>'+
      '<a class="af-link" href="https://phet.colorado.edu/sims/html/magnets-and-electromagnets/latest/magnets-and-electromagnets_all.html" target="_blank" rel="noopener">'+L('▶ PhET simulator ↗','▶ PhET 시뮬레이터 ↗')+'</a></div></div>';
    var cv = AF.cv(560, 380); cv.style.touchAction = 'none'; box.querySelector('.af-stage').appendChild(cv);
    var cx = cv.getContext('2d'); cx.scale(2,2);
    var W = 560, H = 380, X = W/2, Yc = H/2 + 4, PXCM = 40;
    var I0 = 10, ac = false, t = 0, ph = 0, px = X + 80, py = Yc - 20, drag = false, flow = 0;
    function $(c){ return box.querySelector('.'+c); }
    var sI = $('amI');
    sI.addEventListener('input', function(){ I0 = +sI.value; $('amIv').textContent = (ac ? '±' + Math.abs(I0) : I0) + ' A'; });
    AF.chips(AF.qa(box,'[data-am]'), function(b){ ac = b.dataset.am === 'ac'; ph = 0; $('amIv').textContent = (ac ? '±' + Math.abs(I0) : I0) + ' A'; });
    function pt(e){ var r = cv.getBoundingClientRect(); return [(e.clientX - r.left)*W/r.width, (e.clientY - r.top)*H/r.height]; }
    cv.addEventListener('pointerdown', function(e){ var p = pt(e); if(Math.hypot(p[0]-px, p[1]-py) < 26){ drag = true; cv.setPointerCapture(e.pointerId); } });
    cv.addEventListener('pointermove', function(e){ if(!drag) return; var p = pt(e), dx = p[0]-X, dy = p[1]-Yc, d = Math.hypot(dx, dy);
      if(d < 34){ dx = dx/(d||1)*34; dy = dy/(d||1)*34; } px = Math.max(16, Math.min(W-16, X+dx)); py = Math.max(16, Math.min(H-16, Yc+dy)); });
    cv.addEventListener('pointerup', function(){ drag = false; });
    cv.addEventListener('pointercancel', function(){ drag = false; });
    function fmtB(b){ var a = Math.abs(b); return a >= 1000 ? (a/1000).toFixed(2) + ' mT' : a.toFixed(a < 10 ? 1 : 0) + ' µT'; }
    return {draw:function(dt){
      t += dt; if(ac) ph += dt*2.2;
      var I = ac ? I0*Math.sin(ph) : I0, sg = I > 0 ? 1 : I < 0 ? -1 : 0, mag = Math.abs(I)/20;
      var rcm = Math.hypot(px-X, py-Yc)/PXCM, B = 2e-7*I/(rcm/100)*1e6;
      $('amR').textContent = rcm.toFixed(1) + ' cm';
      $('amB').textContent = I ? fmtB(B) : '0 µT';
      $('amC').textContent = I ? L('≈ ' + (Math.abs(B)/50).toFixed(1) + '× the Earth’s field (≈ 50 µT)', '≈ 지구 자기장(약 50 µT)의 ' + (Math.abs(B)/50).toFixed(1) + '배') : '';
      $('amT').textContent = ac ? L('AC: the current keeps reversing, so B reverses too. In an ICP antenna: 13.56 million times a second.','교류: 전류가 계속 뒤집히므로 B도 뒤집힙니다. ICP 안테나에서는 1초에 1,356만 번.')
        : !I ? L('No current, no magnetic field.','전류가 없으면 자기장도 없습니다.')
        : I > 0 ? L('Current out of the page (⊙): B circles counter-clockwise (right-hand rule).','전류가 화면 밖으로(⊙): B는 반시계 방향으로 돕니다 (오른손 법칙).')
        : L('Current into the page (⊗): B circles clockwise.','전류가 화면 안으로(⊗): B는 시계 방향으로 돕니다.');
      var bg = cx.createRadialGradient(X, Yc, 10, X, Yc, W*.7);
      bg.addColorStop(0,'#15283b'); bg.addColorStop(.6,'#0c1520'); bg.addColorStop(1,'#070b11');
      cx.clearRect(0,0,W,H); cx.fillStyle = bg; cx.fillRect(0,0,W,H);
      flow += sg*dt*28*(0.3 + mag);
      var radii = [36, 58, 88, 128, 180, 250];
      cx.setLineDash([7,8]); cx.lineDashOffset = flow;
      radii.forEach(function(r, i){ cx.strokeStyle = 'rgba(190,170,255,' + ((0.12 + 0.5*mag) * (1 - i*0.11)).toFixed(3) + ')'; cx.lineWidth = 1.4;
        cx.beginPath(); cx.arc(X, Yc, r, 0, sg > 0 ? -6.2832 : 6.2832, sg > 0); cx.stroke(); });
      cx.setLineDash([]);
      for(var gx = 40; gx < W-20; gx += 56) for(var gy = 36; gy < H-20; gy += 56){
        var dx = gx - X, dy = gy - Yc, d = Math.hypot(dx, dy); if(d < 50) continue;
        var tx = -dy/d, ty = dx/d;
        var ux = sg >= 0 ? -tx : tx, uy = sg >= 0 ? -ty : ty;
        if(!sg){ ux = 0; uy = -1; }
        var s2 = 9, a2 = 0.35 + 0.65*Math.min(1, mag*60/d*2);
        cx.globalAlpha = sg ? a2 : 0.35;
        cx.fillStyle = 'rgba(255,255,255,.07)'; cx.beginPath(); cx.arc(gx, gy, 13, 0, 6.283); cx.fill();
        cx.fillStyle = '#ff5a7a'; cx.beginPath(); cx.moveTo(gx + ux*s2, gy + uy*s2); cx.lineTo(gx - uy*3, gy + ux*3); cx.lineTo(gx + uy*3, gy - ux*3); cx.closePath(); cx.fill();
        cx.fillStyle = '#e6ecf2'; cx.beginPath(); cx.moveTo(gx - ux*s2, gy - uy*s2); cx.lineTo(gx - uy*3, gy + ux*3); cx.lineTo(gx + uy*3, gy - ux*3); cx.closePath(); cx.fill();
        cx.globalAlpha = 1;
      }
      var rp = Math.hypot(px - X, py - Yc);
      cx.strokeStyle = 'rgba(255,209,102,.55)'; cx.lineWidth = 1.5; cx.setLineDash([3,5]); cx.beginPath(); cx.arc(X, Yc, rp, 0, 6.283); cx.stroke(); cx.setLineDash([]);
      var gl = cx.createRadialGradient(X, Yc, 0, X, Yc, 40); gl.addColorStop(0, 'rgba(255,170,90,' + (0.2 + 0.5*mag).toFixed(2) + ')'); gl.addColorStop(1, 'rgba(255,170,90,0)');
      cx.fillStyle = gl; cx.beginPath(); cx.arc(X, Yc, 40, 0, 6.283); cx.fill();
      var gw = cx.createRadialGradient(X-5, Yc-6, 2, X, Yc, 18); gw.addColorStop(0, '#f2c08f'); gw.addColorStop(1, '#b8692e');
      cx.fillStyle = gw; cx.beginPath(); cx.arc(X, Yc, 18, 0, 6.283); cx.fill();
      cx.strokeStyle = '#2a1608'; cx.fillStyle = '#2a1608'; cx.lineWidth = 3;
      if(sg > 0){ cx.beginPath(); cx.arc(X, Yc, 4.5, 0, 6.283); cx.fill(); }
      else if(sg < 0){ cx.beginPath(); cx.moveTo(X-7, Yc-7); cx.lineTo(X+7, Yc+7); cx.moveTo(X+7, Yc-7); cx.lineTo(X-7, Yc+7); cx.stroke(); }
      cx.fillStyle = 'rgba(255,255,255,.75)'; cx.font = '600 11.5px "JetBrains Mono",monospace'; cx.textAlign = 'center'; cx.textBaseline = 'top';
      cx.fillText('I = ' + I.toFixed(ac ? 1 : 0) + ' A', X, Yc + 24);
      var dx2 = px - X, dy2 = py - Yc, d2 = Math.hypot(dx2, dy2), bx = (sg >= 0 ? 1 : -1)*dy2/d2, by = (sg >= 0 ? -1 : 1)*dx2/d2;
      if(sg){ var LB = Math.min(90, 10 + 2600*Math.abs(I)/20/d2); arrow(cx, px, py, bx, by, LB, '#ffd166', 3.5, 11);
        cx.fillStyle = '#ffd166'; cx.font = '700 14px '+GS; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText('B', px + bx*(LB + 12), py + by*(LB + 12)); }
      cx.strokeStyle = 'rgba(255,255,255,.4)'; cx.lineWidth = 1; cx.setLineDash([3,4]); cx.beginPath(); cx.moveTo(X, Yc); cx.lineTo(px, py); cx.stroke(); cx.setLineDash([]);
      cx.beginPath(); cx.arc(px, py, 9, 0, 6.283); cx.fillStyle = '#fff'; cx.fill(); cx.lineWidth = 2; cx.strokeStyle = drag ? '#ffd166' : '#7a5fd1'; cx.stroke();
      if(!drag){ cx.beginPath(); cx.arc(px, py, 14 + 3*Math.sin(t*4), 0, 6.283); cx.strokeStyle = 'rgba(255,255,255,.25)'; cx.lineWidth = 1.5; cx.stroke(); }
      cx.fillStyle = 'rgba(255,255,255,.55)'; cx.font = '500 12px '+GS; cx.textAlign = 'left'; cx.textBaseline = 'top';
      cx.fillText(L('⊙ current out of page · ⊗ into page · red compass tip = N','⊙ 전류가 화면 밖으로 · ⊗ 화면 안으로 · 나침반 빨강 = N극'), 16, 14);
      cx.textAlign = 'right'; cx.textBaseline = 'bottom';
      cx.fillText(L('Yellow dashed = Ampère loop (∮B·dl = μ₀I)','노란 점선 = 암페어 경로 (∮B·dl = μ₀I)'), W-16, H-12);
    }};
  };
})();
