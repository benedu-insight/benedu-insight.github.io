<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maxwell's Equations — Benedu Insight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;800&family=Gowun+Batang:wght@400;700&family=JetBrains+Mono:wght@400;500&family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style id="font-override">
  /* EN 모드: 모든 요소에 Google Sans 적용 */
  body[data-lang="en"],
  body[data-lang="en"] * {
    font-family: 'Google Sans', 'Segoe UI', system-ui, sans-serif !important;
  }
  /* 모노스페이스 요소는 그대로 유지 */
  body[data-lang="en"] header p,
  body[data-lang="en"] .lang-btn,
  body[data-lang="en"] .era-btn,
  body[data-lang="en"] .toolbar-btn,
  body[data-lang="en"] #scale-indicator,
  body[data-lang="en"] .era-range,
  body[data-lang="en"] .sci-year,
  body[data-lang="en"] .sci-tag,
  body[data-lang="en"] .detail-era-tag,
  body[data-lang="en"] .detail-meta,
  body[data-lang="en"] .model-img-source,
  body[data-lang="en"] .quote-attr,
  body[data-lang="en"] .section-title,
  body[data-lang="en"] .eq-block,
  body[data-lang="en"] .theory-year,
  body[data-lang="en"] .sim-slider-label,
  body[data-lang="en"] code,
  body[data-lang="en"] pre {
    font-family: 'JetBrains Mono', 'Fira Mono', monospace !important;
  }
  /* Montserrat 제목류는 Google Sans로 통일 */
  body[data-lang="en"] header h1,
  body[data-lang="en"] .detail-name,
  body[data-lang="en"] .theory-name,
  body[data-lang="en"] .era-label,
  body[data-lang="en"] h1,
  body[data-lang="en"] h2,
  body[data-lang="en"] h3 {
    font-family: 'Google Sans', 'Segoe UI', system-ui, sans-serif !important;
  }
</style>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/benedu-insight/benedu-insight.github.io/refs/heads/main/logo_png/benedu_insight_Symbol.png">

<!-- MathJax Formula Engine with Safe Loading Config -->
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']]
    },
    startup: {
      ready: function () {
        MathJax.startup.defaultReady();
        const panel = document.getElementById('detail');
        if (panel && window.MathJax.typesetPromise) {
          MathJax.typesetPromise([panel]).catch(function (err) {
            console.log('MathJax initial typeset failed: ' + err.message);
          });
        }
      }
    }
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<style>
  :root {
    --bg:          #F7F8FA;
    --bg2:         #FFFFFF;
    --bg3:         #F0E6F6;
    --bg4:         #E5F4EC;
    --green:       #0F8C50;
    --green-soft:  #E5F4EC;
    --green-mid:   #cbeadd;
    --green-dark:  #0a6b3d;
    --purple:      #2D3748; /* Sophisticated Slate Blue for Electromagnetics theme */
    --purple-brand:#7030A0; /* Signature Brand Purple */
    --purple-soft: #F0E6F6;
    --purple-mid:  #d9b8ed;
    --purple-dark: #521a78;
    --blue-em:     #2B6CB0; /* Electric blue accent */
    --blue-soft:   #EBF8FF;
    --blue-mid:    #90CDF4;
    --blue-dark:   #2B6CB0;
    --charcoal:    #2D2D2D;
    --text:        #2D2D2D;
    --text2:       #6B7280;
    --text3:       #9CA3AF;
    --border:      #E5E7EB;
    --border2:     #F3F4F6;
    --shadow:      0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md:   0 4px 12px rgba(0,0,0,0.08);
    --max-w:       1400px;
    --scale:       1.0; /* Dynamic text size scaling factor */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Gowun Batang', serif;
    min-height: 100vh;
    width: 100%;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── Header ── */
  header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 0.75rem 1.75rem;
    display: flex;
    align-items: center;
    gap: 1.25rem;
    box-shadow: var(--shadow);
    width: 100%;
    max-width: var(--max-w);
  }
  .header-logo {
    height: 52px;
    width: auto;
    flex-shrink: 0;
  }
  .header-divider {
    width: 1px;
    height: 36px;
    background: var(--border);
    flex-shrink: 0;
  }
  .header-title-block { flex: 1; min-width: 0; }
  header h1 {
    font-family: 'Google Sans', 'Gowun Batang', sans-serif;
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--purple-brand);
    letter-spacing: 0.02em;
    line-height: 1.2;
  }
  header p {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    color: var(--text3);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 2px;
  }
  .era-filter {
    margin-left: auto;
    display: flex;
    gap: 0.4rem;
    flex-wrap: wrap;
    align-items: center;
  }
  /* Language Toggle */
  .lang-toggle {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    background: var(--bg);
  }
  .lang-btn {
    padding: 3px 12px;
    border: none;
    background: transparent;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem;
    font-weight: 500;
    color: var(--text3);
    transition: all 0.2s;
  }
  .lang-btn.active-lang {
    background: var(--purple-brand);
    color: #fff;
  }
  .era-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text2);
    font-family: 'Gowun Batang', serif;
    font-size: 0.78rem;
    padding: 4px 14px;
    cursor: pointer;
    transition: all 0.18s;
  }
  .era-btn:hover {
    border-color: var(--purple-mid);
    color: var(--purple-brand);
    background: var(--purple-soft);
  }
  .era-btn.active {
    background: var(--purple-brand);
    border-color: var(--purple-brand);
    color: #fff;
  }

  /* ── Layout ── */
  .layout {
    display: grid;
    grid-template-columns: 320px 1fr;
    height: calc(100vh - 72px);
    width: 100%;
    max-width: var(--max-w);
  }

  /* ── Timeline Sidebar ── */
  .timeline-sidebar {
    border-right: 1px solid var(--border);
    overflow-y: auto;
    background: var(--bg2);
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .timeline-sidebar::-webkit-scrollbar { width: 4px; }
  .timeline-sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .era-header {
    position: sticky;
    top: 0;
    background: var(--bg2);
    padding: 0.75rem 1rem 0.5rem;
    border-bottom: 1px solid var(--border2);
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    cursor: pointer;
    user-select: none;
  }
  .era-header:hover { background: var(--bg); }
  .era-label {
    font-family: 'Gowun Batang', serif;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.06em;
  }
  .era-line { flex: 1; height: 1px; background: var(--border); }
  .era-range {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.58rem;
    color: var(--text3);
    letter-spacing: 0.06em;
  }
  .era-toggle {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--border2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.6rem;
    color: var(--text3);
    transition: background 0.15s, transform 0.22s;
  }
  .era-header.collapsed .era-toggle {
    transform: rotate(-90deg);
  }
  .era-header:hover .era-toggle {
    background: var(--border);
    color: var(--text2);
  }
  .era-cards {
    overflow: hidden;
    max-height: 2000px;
    transition: max-height 0.3s ease, opacity 0.25s ease;
    opacity: 1;
  }
  .era-cards.collapsed {
    max-height: 0;
    opacity: 0;
  }

  /* Lecture Card in Sidebar */
  .sci-card {
    padding: 0.75rem 1rem 0.75rem 1.1rem;
    border-bottom: 1px solid var(--border2);
    cursor: pointer;
    position: relative;
    transition: background 0.15s;
    display: flex;
    gap: 0.7rem;
    align-items: flex-start;
    border-left: 3px solid transparent;
  }
  .sci-card:hover { background: var(--bg); }
  .sci-card.active { background: var(--purple-soft); border-left-color: var(--purple-brand); }

  .sci-year {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    color: var(--text3);
    min-width: 48px;
    padding-top: 2px;
    line-height: 1.4;
  }
  .sci-info { flex: 1; min-width: 0; }
  .sci-name {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--charcoal);
    line-height: 1.3;
  }
  .sci-card.active .sci-name { color: var(--purple-dark); }
  .sci-nation {
    font-size: 0.68rem;
    color: var(--text3);
    margin-top: 1px;
    font-family: 'Gowun Batang', serif;
  }
  .sci-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
    margin-top: 4px;
  }
  .sci-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.54rem;
    padding: 1px 6px;
    border-radius: 8px;
    letter-spacing: 0.03em;
  }

  /* ── Detail Panel & Scroll Wrapper ── */
  .detail-panel {
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
  }
  
  /* Sticky Reading Toolbar */
  .content-toolbar {
    position: sticky;
    top: 0;
    background: rgba(247, 248, 250, 0.95);
    backdrop-filter: blur(8px);
    padding: 0.6rem 2.25rem;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 0.55rem;
    border-bottom: 1px solid var(--border);
    z-index: 10;
  }
  .toolbar-btn {
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg2);
    color: var(--text);
    padding: 4px 10px;
    font-size: 0.72rem;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    transition: all 0.15s;
  }
  .toolbar-btn:hover {
    border-color: var(--purple-mid);
    background: var(--purple-soft);
    color: var(--purple-dark);
  }
  .toolbar-btn:active {
    transform: scale(0.95);
  }

  #detail {
    flex: 1;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  #detail::-webkit-scrollbar { width: 4px; }
  #detail::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .detail-content { padding: 2.25rem; max-width: 860px; margin: 0 auto; }

  /* Hero slide card */
  .detail-hero {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.75rem 2rem;
    margin-bottom: 1.5rem;
    box-shadow: var(--shadow);
  }
  .detail-era-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 0.6rem;
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    padding: 3px 10px;
    border-radius: 12px;
    font-weight: 500;
  }
  .detail-name {
    font-family: 'Google Sans', 'Montserrat', sans-serif;
    font-size: calc(1.8rem * var(--scale));
    font-weight: 800;
    line-height: 1.1;
    color: var(--purple-brand);
    margin-bottom: 0.15rem;
    transition: font-size 0.15s ease-out;
  }
  .detail-name-kr {
    font-family: 'Gowun Batang', serif;
    font-size: calc(1rem * var(--scale));
    color: var(--text2);
    margin-bottom: 0.75rem;
    font-weight: 400;
    transition: font-size 0.15s ease-out;
  }
  .detail-meta {
    display: flex;
    gap: 1.25rem;
    flex-wrap: wrap;
    font-family: 'JetBrains Mono', monospace;
    font-size: calc(0.68rem * var(--scale));
    color: var(--text2);
    padding-top: 0.75rem;
    border-top: 1px solid var(--border2);
    transition: font-size 0.15s ease-out;
  }

  /* Model Graphic Showcase */
  .model-showcase {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
    box-shadow: var(--shadow);
  }
  .model-svg-wrapper {
    width: 100%;
    max-width: 600px;
    min-height: 300px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  
  /* Sim style enhancements */
  .sim-container {
    width: 100%;
    background: #FAFAFA;
    border: 1px solid #E5E7EB;
    border-radius: 8px;
    padding: 1rem;
    margin-top: 1rem;
  }
  .sim-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    margin-bottom: 0.75rem;
    padding: 0.5rem;
    background: #FFF;
    border-radius: 6px;
    border: 1px solid #E5E7EB;
    align-items: center;
    font-size: 0.8rem;
  }
  .sim-slider-label {
    font-family: 'JetBrains Mono', monospace;
    font-weight: bold;
    color: var(--purple-brand);
  }
  .sim-tab-btns {
    display: flex;
    gap: 0.5rem;
    width: 100%;
    margin-bottom: 1rem;
  }
  .sim-tab-btn {
    flex: 1;
    padding: 8px;
    background: #E5E7EB;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Gowun Batang', serif;
    font-size: 0.78rem;
    font-weight: bold;
    transition: all 0.2s;
  }
  .sim-tab-btn.active {
    background: var(--purple-brand);
    color: #FFF;
  }

  /* Quote Box */
  .quote-block {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.1rem;
    margin-bottom: 1.25rem;
    box-shadow: var(--shadow);
  }
  .quote-badge {
    flex: none;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--green-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    margin-top: 2px;
  }
  .quote-body { flex: 1; min-width: 0; }
  .quote-text {
    font-family: 'Gowun Batang', serif;
    font-style: italic;
    font-size: calc(0.9rem * var(--scale));
    color: var(--green-dark);
    line-height: 1.78;
    transition: font-size 0.15s ease-out;
  }
  .quote-attr {
    font-family: 'JetBrains Mono', monospace;
    font-size: calc(0.6rem * var(--scale));
    color: var(--text3);
    margin-top: 0.45rem;
    letter-spacing: 0.06em;
    transition: font-size 0.15s ease-out;
  }

  /* Detailed Lecture notes */
  .detail-bio {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem 1.5rem;
    font-size: calc(0.9rem * var(--scale));
    line-height: 1.9;
    color: var(--text);
    margin-bottom: 1.5rem;
    box-shadow: var(--shadow);
    transition: font-size 0.15s ease-out;
  }
  .detail-bio p + p { margin-top: 0.85em; }

  /* Section Titles */
  .section-title {
    font-family: 'Gowun Batang', serif;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text3);
    margin-top: 2rem;
    margin-bottom: 0.85rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* Equations container */
  .eq-block {
    background: var(--charcoal);
    border-radius: 8px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 0.5rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: calc(0.95rem * var(--scale));
    color: #a8f5c8;
    letter-spacing: 0.04em;
    overflow-x: auto;
    transition: font-size 0.15s ease-out;
  }

  /* Grid details card */
  .theories-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 0.75rem;
    margin-bottom: 1.5rem;
  }
  .theory-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.1rem;
    transition: box-shadow 0.18s, border-color 0.18s;
    box-shadow: var(--shadow);
  }
  .theory-card:hover {
    box-shadow: var(--shadow-md);
    border-color: var(--purple-mid);
  }
  .theory-year {
    font-family: 'JetBrains Mono', monospace;
    font-size: calc(0.6rem * var(--scale));
    letter-spacing: 0.06em;
    margin-bottom: 0.3rem;
    color: var(--blue-dark);
    font-weight: 500;
    transition: font-size 0.15s ease-out;
  }
  .theory-name {
    font-size: calc(0.88rem * var(--scale));
    font-weight: 700;
    color: var(--charcoal);
    margin-bottom: 0.35rem;
    line-height: 1.3;
    transition: font-size 0.15s ease-out;
  }
  .theory-desc {
    font-size: calc(0.76rem * var(--scale));
    color: var(--text2);
    line-height: 1.65;
    font-family: 'Gowun Batang', serif;
    transition: font-size 0.15s ease-out;
  }

  /* ── Collapsible Classroom Box ── */
  details.classroom-box {
    background: #FFFDF0;
    border: 1px dashed #EEDF8B;
    border-radius: 12px;
    padding: 1.25rem;
    margin-bottom: 1.5rem;
    cursor: pointer;
    transition: border 0.15s;
  }
  details.classroom-box[open] {
    border-style: solid;
    border-color: #D6C359;
  }
  details.classroom-box summary {
    font-family: 'Gowun Batang', serif;
    font-size: 0.85rem;
    font-weight: 700;
    color: #8C730F;
    outline: none;
    user-select: none;
  }
  .classroom-body {
    font-size: calc(0.78rem * var(--scale));
    line-height: 1.7;
    color: #6B5B1E;
    margin-top: 0.75rem;
    cursor: default;
    transition: font-size 0.15s ease-out;
  }

  /* ── Interactive ELECTROMAGNETIC MODELS Dashboard ── */
  .overview-container {
    background: #EAEBED;
    border-radius: 16px;
    padding: 2.25rem 1.5rem;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    margin-bottom: 1.5rem;
    text-align: center;
  }
  .overview-grid {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  .overview-card {
    flex: 1;
    min-width: 155px;
    max-width: 185px;
    background: #FFF;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.2rem 0.5rem;
    cursor: pointer;
    transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s, border-color 0.2s;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    height: 250px;
    box-shadow: var(--shadow);
  }
  .overview-card:hover {
    transform: translateY(-5px);
    box-shadow: var(--shadow-md);
    border-color: var(--purple-mid);
  }
  .overview-card-tag {
    background: #90CDF4;
    color: #2D3748;
    font-size: 0.54rem;
    font-weight: bold;
    padding: 3px 6px;
    border-radius: 4px;
    width: 100%;
    text-align: center;
    margin-top: 0.5rem;
    font-family: 'JetBrains Mono', monospace;
  }

  /* Summary Matrix Styles (Special Module) */
  .summary-matrix {
    width: 100%;
    border-collapse: collapse;
    background: var(--bg2);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: var(--shadow);
    margin-bottom: 1.5rem;
  }
  .summary-matrix th, .summary-matrix td {
    padding: 0.75rem 1rem;
    font-size: calc(0.78rem * var(--scale));
    text-align: left;
    border-bottom: 1px solid var(--border);
    transition: font-size 0.15s ease-out;
  }
  .summary-matrix th {
    background: var(--purple-soft);
    color: var(--purple-dark);
    font-weight: 700;
    font-family: 'Gowun Batang', serif;
  }

  document.getElementById('eraDyn').textContent  = T.eraDyn;
  document.getElementById('eraSyn').textContent  = T.eraSyn;

// Build timeline navigation in sidebar
function buildSidebar(filter) {
  currentEraFilter = filter;
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = '';
  const T = UI[lang];
  const SLIDES = getSLIDES();

  const eras = [
    { id: 'electrostatics', label: T.eraLabels.electrostatics, range: T.eraRanges.electrostatics },
    { id: 'dynamics',       label: T.eraLabels.dynamics,       range: T.eraRanges.dynamics },
    { id: 'synthesis',      label: T.eraLabels.synthesis,      range: T.eraRanges.synthesis }
  ];

  const eraColors = {
    electrostatics: { tag: '#3182CE', tagBg: '#EBF8FF', tagBorder: '#bee3f8' },
    dynamics:       { tag: '#7030A0', tagBg: '#F0E6F6', tagBorder: '#d9b8ed' },
    synthesis:      { tag: '#E53E3E', tagBg: '#FFF5F5', tagBorder: '#fed7d7' }
  };

  eras.forEach(era => {
    const slides = SLIDES
      .filter(s => s.era === era.id && (filter === 'all' || filter === s.era))
      .sort((a, b) => {
        // ch6_ref가 ch6 바로 뒤에 오도록 고정 배치 정렬 보정
        const order = { 'ch0':1, 'ch1':2, 'ch2':3, 'ch3':4, 'ch4':5, 'ch5':6, 'ch6':7, 'ch6_ref':8, 'ch7':9 };
        return (order[a.id] || 99) - (order[b.id] || 99);
      });

    if (slides.length === 0) return;

    const grp = document.createElement('div');
    grp.className = 'era-group';

    const hdr = document.createElement('div');
    hdr.className = 'era-header';
    hdr.innerHTML = `
      <span class="era-label" style="color:${eraColors[era.id].tag}">${era.label}</span>
      <span class="era-line"></span>
      <span class="era-range" style="font-size:0.55rem;">${era.range}</span>
      <span class="era-toggle">▾</span>
    `;
    grp.appendChild(hdr);

    const cardsWrap = document.createElement('div');
    cardsWrap.className = 'era-cards';

    const ec = eraColors[era.id];

    slides.forEach(slide => {
      const card = document.createElement('div');
      card.className = 'sci-card';
      card.id = `card-${slide.id}`;

      const tagHtml = slide.tags.map(t =>
        `<span class="sci-tag" style="background:${ec.tagBg};color:${ec.tag};border:1px solid ${ec.tagBorder}">${t}</span>`
      ).join('');

      card.innerHTML = `
        <div class="sci-year">${slide.chapter}</div>
        <div class="sci-info">
          <div class="sci-name" style="font-size:0.83rem">${slide.nameKr}</div>
          <div class="sci-nation" style="font-size:0.62rem">${slide.period}</div>
          <div class="sci-tags">${tagHtml}</div>
        </div>
      `;
      card.addEventListener('click', () => selectSlide(slide.id));
      cardsWrap.appendChild(card);
    });

    hdr.addEventListener('click', () => {
      const isCollapsed = cardsWrap.classList.toggle('collapsed');
      hdr.classList.toggle('collapsed', isCollapsed);
    });

    grp.appendChild(cardsWrap);
    sidebar.appendChild(grp);
  });
}

let currentId = null;

function selectSlide(id) {
  document.querySelectorAll('.sci-card').forEach(c => c.classList.remove('active'));
  const slide = getSLIDES().find(s => s.id === id);
  if (!slide) return;
  currentId = id;

  const card = document.getElementById(`card-${id}`);
  if (card) {
    const wrap = card.closest('.era-cards');
    if (wrap && wrap.classList.contains('collapsed')) {
      wrap.classList.remove('collapsed');
      wrap.previousElementSibling?.classList.remove('collapsed');
    }
    card.classList.add('active');
    card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  renderDetail(slide);
}

// ── Interactive Gauss Simulator (Chapter 1) ──
let gaussTab = 'classic';
let gaussCanvas = null, gaussCtx = null;
function setGaussTab(tab) {
  gaussTab = tab;
  document.getElementById('gauss-tab-classic').classList.toggle('active', tab === 'classic');
  document.getElementById('gauss-tab-ccp').classList.toggle('active', tab === 'ccp');
  document.getElementById('gauss-controls-classic').style.display = tab === 'classic' ? 'flex' : 'none';
  document.getElementById('gauss-controls-ccp').style.display = tab === 'ccp' ? 'flex' : 'none';
  updateGaussSimulation();
}

function initGaussSimulation() {
  gaussCanvas = document.getElementById('gauss-sim-canvas');
  if (!gaussCanvas) return;
  gaussCtx = gaussCanvas.getContext('2d');
  updateGaussSimulation();
}

function updateGaussSimulation() {
  if (!gaussCanvas || !gaussCtx) return;
  const ctx = gaussCtx;
  const w = gaussCanvas.width;
  const h = gaussCanvas.height;
  ctx.clearRect(0, 0, w, h);

  const chargeSlider = document.getElementById('gauss-charge-slider');
  const chargeValText = document.getElementById('gauss-charge-val');
  const showFieldsCheckbox = document.getElementById('gauss-field-toggle');
  
  const qVal = chargeSlider ? parseInt(chargeSlider.value) : 6;
  const showFields = showFieldsCheckbox ? showFieldsCheckbox.checked : true;

  if (chargeValText) {
    chargeValText.innerText = (qVal >= 0 ? '+' : '') + qVal + ' nC';
    chargeValText.style.color = qVal >= 0 ? '#E53E3E' : '#2B6CB0';
  }

  // Dynamic formula update
  const formulaDiv = document.getElementById('gauss-formula-dynamic');
  if (formulaDiv) {
    const fluxVal = (qVal * 1.13).toFixed(2);
    const signChar = qVal >= 0 ? '+' : '';
    formulaDiv.innerHTML = `${UI[lang].gauss.formulaPrefix}$$\\Phi = \\oint_S \\mathbf{E} \\cdot d\\mathbf{A} = \\frac{Q_{\\text{enc}}}{\\varepsilon_0} = ${signChar}${fluxVal} \\times 10^2 \\text{ N}\\cdot\\text{m}^2/\\text{C}$$`;
    if (window.MathJax && window.MathJax.typesetPromise) {
      MathJax.typesetPromise([formulaDiv]);
    }
  }

  if (gaussTab === 'classic') {
    // ── Classic Gauss Law diagram matching image_fe93cb.png ──
    const cx = 220;
    const cy = 170;
    const r = 90;

    // Draw Title border
    ctx.strokeStyle = '#2D2D2D';
    ctx.lineWidth = 2;
    ctx.strokeRect(cx - 70, 15, 140, 30);
    ctx.font = 'bold 15px Montserrat, sans-serif';
    ctx.fillStyle = '#2D2D2D';
    ctx.textAlign = 'center';
    ctx.fillText("Gauss's Law", cx, 35);

    // Light blue Gaussian Surface fill
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, 2 * Math.PI);
    ctx.fillStyle = 'rgba(144, 205, 244, 0.4)';
    ctx.fill();
    ctx.strokeStyle = '#3182CE';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Central positive/negative charge badge
    ctx.beginPath();
    ctx.arc(cx, cy, 10, 0, 2 * Math.PI);
    ctx.fillStyle = qVal >= 0 ? '#E53E3E' : '#2B6CB0';
    ctx.fill();
    ctx.font = 'bold 12px Montserrat';
    ctx.fillStyle = '#FFF';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(qVal >= 0 ? '+' : '-', cx, cy);
    ctx.textBaseline = 'alphabetic';

    // Label: "Charge" & "Gaussian surface"
    ctx.font = '12px Gowun Batang, serif';
    ctx.fillStyle = '#2D2D2D';
    ctx.fillText("Charge", cx - 40, cy - 15);
    ctx.fillText("Gaussian", cx - 45, cy + 45);
    ctx.fillText("surface", cx - 45, cy + 60);

    // Draw radial field lines (E) if checked
    const lineCount = Math.min(24, Math.abs(qVal) * 2);
    if (showFields && lineCount > 0) {
      ctx.strokeStyle = qVal >= 0 ? '#E53E3E' : '#2B6CB0';
      ctx.lineWidth = 1.2;
      for (let i = 0; i < lineCount; i++) {
        const angle = (i * 2 * Math.PI) / lineCount;
        const startR = 15;
        const endR = 140;
        const sx = cx + Math.cos(angle) * startR;
        const sy = cy + Math.sin(angle) * startR;
        const ex = cx + Math.cos(angle) * endR;
        const ey = cy + Math.sin(angle) * endR;

        // Draw line
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(ex, ey);
        ctx.stroke();

        // Draw arrowheads based on polarity
        ctx.fillStyle = qVal >= 0 ? '#E53E3E' : '#2B6CB0';
        const arrowAngle = qVal >= 0 ? angle : angle + Math.PI;
        const arrowR = qVal >= 0 ? endR : startR + 10;
        const ax = cx + Math.cos(angle) * arrowR;
        const ay = cy + Math.sin(angle) * arrowR;

        ctx.beginPath();
        ctx.moveTo(ax, ay);
        ctx.lineTo(ax - 6 * Math.cos(arrowAngle - 0.3), ay - 6 * Math.sin(arrowAngle - 0.3));
        ctx.lineTo(ax - 6 * Math.cos(arrowAngle + 0.3), ay - 6 * Math.sin(arrowAngle + 0.3));
        ctx.closePath();
        ctx.fill();
      }
      ctx.font = '11px JetBrains Mono';
      ctx.fillStyle = qVal >= 0 ? '#E53E3E' : '#2B6CB0';
      ctx.fillText("Electric field lines", cx + 60, cy - 100);
    }

    // Draw Curved Surface patch (dS) with vectors E & dS at angle 45 degrees
    const patchAngle = -Math.PI / 4; // 45 deg upper right
    const px = cx + Math.cos(patchAngle) * r;
    const py = cy + Math.sin(patchAngle) * r;

    // Draw curved blue surface segment
    ctx.beginPath();
    ctx.arc(cx, cy, r, patchAngle - 0.15, patchAngle + 0.15);
    ctx.strokeStyle = '#2B6CB0';
    ctx.lineWidth = 4;
    ctx.stroke();
    // Fill surface representation
    ctx.font = '11px JetBrains Mono, monospace';
    ctx.fillStyle = '#2D3748';
    ctx.fillText("ds", px - 15, py + 12);

    // Vector dS (always outward, normal)
    const dsLen = 35;
    const dsx = px + Math.cos(patchAngle) * dsLen;
    const dsy = py + Math.sin(patchAngle) * dsLen;
    ctx.strokeStyle = '#2D2D2D';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(dsx, dsy);
    ctx.stroke();
    // dS arrow head
    ctx.fillStyle = '#2D2D2D';
    ctx.beginPath();
    ctx.moveTo(dsx, dsy);
    ctx.lineTo(dsx - 5 * Math.cos(patchAngle - 0.3), dsy - 5 * Math.sin(patchAngle - 0.3));
    ctx.lineTo(dsx - 5 * Math.cos(patchAngle + 0.3), dsy - 5 * Math.sin(patchAngle + 0.3));
    ctx.closePath();
    ctx.fill();
    ctx.fillText("ds", dsx + 5, dsy + 2);

    // Vector E (outward if positive, inward if negative)
    const eLen = Math.abs(qVal) * 5;
    if (eLen > 0) {
      const eAngle = qVal >= 0 ? patchAngle : patchAngle + Math.PI;
      const ex = px + Math.cos(patchAngle) * (qVal >= 0 ? eLen : -eLen);
      const ey = py + Math.sin(patchAngle) * (qVal >= 0 ? eLen : -eLen);

      ctx.strokeStyle = '#E53E3E';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(ex, ey);
      ctx.stroke();
      // E arrow head
      ctx.fillStyle = '#E53E3E';
      ctx.beginPath();
      ctx.moveTo(ex, ey);
      const arrDir = qVal >= 0 ? patchAngle : patchAngle + Math.PI;
      ctx.lineTo(ex - 6 * Math.cos(arrDir - 0.35), ey - 6 * Math.sin(arrDir - 0.35));
      ctx.lineTo(ex - 6 * Math.cos(arrDir + 0.35), ey - 6 * Math.sin(arrDir + 0.35));
      ctx.closePath();
      ctx.fill();
      ctx.fillText("E", ex + 5, ey - 5);
    }

    // Right-side formulas matching image_fe93cb.png
    const rx = cx + 200;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#2D2D2D';
    ctx.font = 'bold 16px Montserrat, sans-serif';
    ctx.fillText("Φ ∝ Q_enc", rx, 90);
    ctx.font = 'bold 18px Montserrat, sans-serif';
    ctx.fillText("Φ = ∮ E · ds = Q_enc / ε_0", rx, 130);

    ctx.font = '12px Gowun Batang, sans-serif';
    ctx.fillText("Φ  : Electric flux", rx, 175);
    ctx.fillText("E  : Electric field", rx, 200);
    ctx.fillText("ds : Infinitesimal surface area", rx, 225);
    ctx.fillText("Q_enc : Charge enclosed", rx, 250);
    ctx.fillText("ε_0 : Permittivity of air/vacuum", rx, 275);

  } else {
    // ── CCP Semiconductor Chamber Application View ──
    const vSlider = document.getElementById('ccp-voltage-slider');
    const vValue = vSlider ? parseInt(vSlider.value) : 250;

    // Draw parallel plates chamber
    ctx.fillStyle = '#1A202C';
    ctx.fillRect(40, 40, 520, 260); // dark chamber

    // Top electrode (RF plate)
    ctx.fillStyle = '#718096';
    ctx.fillRect(80, 55, 440, 15);
    ctx.fillStyle = '#E53E3E';
    ctx.font = 'bold 10px JetBrains Mono';
    ctx.textAlign = 'center';
    ctx.fillText("RF ELECTRODE (TOP PLATE)", 300, 50);

    // Bottom electrode (Wafer chuck)
    ctx.fillStyle = '#4A5568';
    ctx.fillRect(80, 250, 440, 25);
    // Wafer on top of bottom electrode
    ctx.fillStyle = '#1A365D';
    ctx.fillRect(120, 244, 360, 6);
    ctx.fillStyle = '#319795';
    ctx.font = 'bold 10px Montserrat';
    ctx.fillText("WAFER SUBSTRATE", 300, 240);

    // Draw plasma bulk (glow) in center
    const sheathH = Math.max(10, Math.min(60, 15 + vValue / 15));
    const plasmaTop = 70 + sheathH;
    const plasmaBottom = 244 - sheathH;

    // Glowing plasma gradient
    const plasmaGrad = ctx.createLinearGradient(0, plasmaTop, 0, plasmaBottom);
    plasmaGrad.addColorStop(0, 'rgba(129, 230, 217, 0.15)');
    plasmaGrad.addColorStop(0.2, 'rgba(159, 122, 234, 0.65)');
    plasmaGrad.addColorStop(0.5, 'rgba(111, 76, 186, 0.8)');
    plasmaGrad.addColorStop(0.8, 'rgba(159, 122, 234, 0.65)');
    plasmaGrad.addColorStop(1, 'rgba(129, 230, 217, 0.15)');

    ctx.fillStyle = plasmaGrad;
    ctx.fillRect(80, plasmaTop, 440, plasmaBottom - plasmaTop);
    ctx.font = 'bold 13px Montserrat';
    ctx.fillStyle = '#E2E8F0';
    ctx.fillText("PLASMA BULK (HIGH DENSITY)", 300, (plasmaTop + plasmaBottom) / 2);

    // Draw Dark Sheaths
    ctx.fillStyle = 'rgba(45, 55, 72, 0.45)';
    ctx.fillRect(80, 70, 440, sheathH); // top sheath
    ctx.fillRect(80, plasmaBottom, 440, sheathH); // bottom sheath

    ctx.fillStyle = '#A0AEC0';
    ctx.font = 'italic 10px Gowun Batang';
    ctx.fillText(`Top Sheath (${Math.round(sheathH)}nm)`, 300, 70 + sheathH/2 + 3);
    ctx.fillText(`Bottom Space-Charge Sheath (${Math.round(sheathH)}nm)`, 300, plasmaBottom + sheathH/2 + 3);

    // Draw electric field vectors in the bottom sheath (Gauss's law accelerator)
    ctx.strokeStyle = '#FEEBC8';
    ctx.lineWidth = 1.5;
    ctx.fillStyle = '#FEEBC8';
    for (let x = 130; x < 480; x += 40) {
      ctx.beginPath();
      ctx.moveTo(x, plasmaBottom);
      ctx.lineTo(x, 240);
      ctx.stroke();
      // Arrow
      ctx.beginPath();
      ctx.moveTo(x, 240);
      ctx.lineTo(x - 3, 234);
      ctx.lineTo(x + 3, 234);
      ctx.closePath();
      ctx.fill();
    }

    // Accelerating argon ions (Ar+) striking the wafer
    ctx.fillStyle = '#90CDF4';
    for (let i = 0; i < 5; i++) {
      const ionX = 150 + i * 70;
      const ionY = plasmaBottom + (Math.sin(Date.now() / 200 + i) * 0.5 + 0.5) * sheathH;
      ctx.beginPath();
      ctx.arc(ionX, ionY, 5, 0, 2 * Math.PI);
      ctx.fill();
      ctx.fillStyle = '#1A202C';
      ctx.font = 'bold 8px Montserrat';
      ctx.fillText("+", ionX, ionY + 3);
      ctx.fillStyle = '#90CDF4';
      ctx.font = 'bold 9px JetBrains Mono';
      ctx.fillText("Ar+", ionX + 12, ionY + 3);
    }
    ctx.fillStyle = '#E53E3E';
    ctx.font = lang === 'en' ? '11px Google Sans, sans-serif' : '11px Gowun Batang';
    ctx.fillText(UI[lang].gauss.ccpCanvasText, 300, 290);
  }
}

let magTab = 'classic';
let magCanvas = null, magCtx = null;
function setMagTab(tab) {
  magTab = tab;
  document.getElementById('mag-tab-classic').classList.toggle('active', tab === 'classic');
  document.getElementById('mag-tab-confinement').classList.toggle('active', tab === 'confinement');
  document.getElementById('mag-controls-classic').style.display = tab === 'classic' ? 'flex' : 'none';
  document.getElementById('mag-controls-confinement').style.display = tab === 'confinement' ? 'flex' : 'none';
  updateMagSimulation();
}

function initMagSimulation() {
  magCanvas = document.getElementById('mag-sim-canvas');
  if (!magCanvas) return;
  magCtx = magCanvas.getContext('2d');
  updateMagSimulation();
}

function updateMagSimulation() {
  if (!magCanvas || !magCtx) return;
  const ctx = magCtx;
  const w = magCanvas.width;
  const h = magCanvas.height;
  ctx.clearRect(0, 0, w, h);

  const angleSlider = document.getElementById('mag-angle-slider');
  const strengthSlider = document.getElementById('mag-strength-slider');
  const confSlider = document.getElementById('mag-conf-slider');

  const angleValText = document.getElementById('mag-angle-val');
  const strengthValText = document.getElementById('mag-strength-val');
  const confValText = document.getElementById('mag-conf-val');

  const angleDeg = angleSlider ? parseInt(angleSlider.value) : 45;
  const bStrength = strengthSlider ? parseInt(strengthSlider.value) : 5;
  const confLevel = confSlider ? parseInt(confSlider.value) : 3;

  if (angleValText) angleValText.innerText = angleDeg + '°';
  if (strengthValText) strengthValText.innerText = bStrength + ' T';
  if (confValText) confValText.innerText = 'Level ' + confLevel;

  const rad = (angleDeg * Math.PI) / 180;

  if (magTab === 'classic') {
    // ── Classic Gauss Law for Magnetism dynamic demo ──
    const cx = 220;
    const cy = 170;
    const r = 90;

    // Draw magnetic field lines passing completely through S
    ctx.strokeStyle = 'rgba(43, 108, 176, 0.55)';
    ctx.lineWidth = 1 + bStrength * 0.15;
    
    const numLines = 14;
    const lineSpacing = 32;
    const dx = Math.cos(rad);
    const dy = Math.sin(rad);

    for (let i = -numLines/2; i <= numLines/2; i++) {
      const perpX = -dy * i * lineSpacing;
      const perpY = dx * i * lineSpacing;
      
      const length = 520;
      const sx = cx + perpX - dx * length / 2;
      const sy = cy + perpY - dy * length / 2;
      const ex = cx + perpX + dx * length / 2;
      const ey = cy + perpY + dy * length / 2;

      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(ex, ey);
      ctx.stroke();

      // Draw arrowheads dynamically along lines
      const mx = cx + perpX;
      const my = cy + perpY;
      ctx.fillStyle = '#2B6CB0';
      ctx.beginPath();
      ctx.moveTo(mx, my);
      ctx.lineTo(mx - 8 * Math.cos(rad - 0.35), my - 8 * Math.sin(rad - 0.35));
      ctx.lineTo(mx - 8 * Math.cos(rad + 0.35), my - 8 * Math.sin(rad + 0.35));
      ctx.closePath();
      ctx.fill();
    }

    // Draw the closed irregular Gaussian surface S
    ctx.beginPath();
    ctx.moveTo(cx - 70, cy + 10);
    ctx.bezierCurveTo(cx - 70, cy - 50, cx - 10, cy - 40, cx + 20, cy - 50);
    ctx.bezierCurveTo(cx + 80, cy - 60, cx + 110, cy - 40, cx + 110, cy + 10);
    ctx.bezierCurveTo(cx + 110, cy + 50, cx + 50, cy + 30, cx + 10, cy + 50);
    ctx.bezierCurveTo(cx - 30, cy + 60, cx - 70, cy + 50, cx - 70, cy + 10);
    ctx.closePath();

    ctx.fillStyle = 'rgba(129, 230, 217, 0.4)';
    ctx.fill();
    ctx.strokeStyle = '#0F8C50';
    ctx.lineWidth = 2.2;
    ctx.stroke();

    // S surface tag
    ctx.font = 'bold 15px Montserrat';
    ctx.fillStyle = '#0F8C50';
    ctx.fillText("S", cx + 80, cy + 40);

    // Draw custom patch ΔS
    const px = cx + 10;
    const py = cy - 43;

    ctx.fillStyle = '#48BB78';
    ctx.strokeStyle = '#2D3748';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(px - 10, py - 3);
    ctx.lineTo(px + 10, py - 4);
    ctx.lineTo(px + 8, py + 4);
    ctx.lineTo(px - 12, py + 5);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.font = 'bold 11px JetBrains Mono';
    ctx.fillStyle = '#2D2D2D';
    ctx.fillText("ΔS", px - 8, py + 16);

    // Normal vector n-hat at patch
    const ny = -35;
    ctx.strokeStyle = '#2D2D2D';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(px, py + ny);
    ctx.stroke();

    ctx.fillStyle = '#2D2D2D';
    ctx.beginPath();
    ctx.moveTo(px, py + ny);
    ctx.lineTo(px - 4, py + ny + 6);
    ctx.lineTo(px + 4, py + ny + 6);
    ctx.closePath();
    ctx.fill();
    ctx.fillText("n̂", px + 8, py + ny + 8);

    // Angle theta indicators
    ctx.strokeStyle = '#E53E3E';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(px, py, 18, -Math.PI / 2, rad);
    ctx.stroke();
    ctx.fillStyle = '#E53E3E';
    ctx.fillText("θ", px + 12, py - 18);

    // Formula indicator update
    const formulaDiv = document.getElementById('mag-formula-dynamic');
    if (formulaDiv) {
      formulaDiv.innerHTML = `${UI[lang].mag.formulaPrefix}$$\\oint_S \\mathbf{B} \\cdot d\\mathbf{A} = \\iint_{\\text{in}} \\mathbf{B} \\cdot d\\mathbf{A} + \\iint_{\\text{out}} \\mathbf{B} \\cdot d\\mathbf{A} = -\\Phi_{\\text{in}} + \\Phi_{\\text{out}} = 0 \\text{ Wb}$$`;
      if (window.MathJax && window.MathJax.typesetPromise) {
        MathJax.typesetPromise([formulaDiv]);
      }
    }

    // Right-side dynamic details panel
    const rx = cx + 200;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#2D2D2D';
    ctx.font = 'bold 15px Montserrat, sans-serif';
    ctx.fillText("Φ_B = ∮ B · dS = 0", rx, 90);
    ctx.font = 'bold 11px JetBrains Mono';
    ctx.fillStyle = '#4A5568';
    ctx.fillText("No Magnetic Monopoles Found", rx, 115);

    ctx.font = lang === 'en' ? '12px Google Sans, sans-serif' : '12px Gowun Batang, sans-serif';
    ctx.fillStyle = '#2D2D2D';
    ctx.fillText("Φ_B : Magnetic flux (Wb)", rx, 160);
    ctx.fillText("B   : Magnetic field (Tesla)", rx, 185);
    ctx.fillText("dS  : Area vector patch (normal n̂)", rx, 210);
    ctx.fillText("θ   : Angle between B and n̂", rx, 235);
    ctx.font = lang === 'en' ? 'bold 11px Google Sans, sans-serif' : 'bold 11px Gowun Batang';
    ctx.fillStyle = '#0F8C50';
    ctx.fillText(UI[lang].mag.fluxNote, rx, 270);
  } else {
    // ── Confinement (Magnetron sputtering) simulation ──
    ctx.fillStyle = '#1A202C';
    ctx.fillRect(40, 40, 520, 260);

    // Back-plate
    ctx.fillStyle = '#718096';
    ctx.fillRect(80, 240, 440, 20);

    // Targets: Center N, Sides S
    ctx.fillStyle = '#E53E3E'; // N-magnet
    ctx.fillRect(270, 250, 60, 10);
    ctx.fillStyle = '#FFF';
    ctx.font = 'bold 9px Montserrat';
    ctx.textAlign = 'center';
    ctx.fillText("N", 300, 258);

    ctx.fillStyle = '#2B6CB0'; // S-magnets
    ctx.fillRect(150, 250, 50, 10);
    ctx.fillRect(400, 250, 50, 10);
    ctx.fillStyle = '#FFF';
    ctx.fillText("S", 175, 258);
    ctx.fillText("S", 425, 258);

    // Sputtering target on top of backing plate
    ctx.fillStyle = '#A0AEC0';
    ctx.fillRect(100, 235, 400, 5);

    // Curved Magnetic Field Loops (B-field lines)
    ctx.strokeStyle = 'rgba(72, 187, 120, 0.75)';
    ctx.lineWidth = 1.8;
    ctx.setLineDash([4, 3]);

    // Left arch
    ctx.beginPath();
    ctx.arc(237.5, 250, 62.5, Math.PI, 2 * Math.PI, true);
    ctx.stroke();

    // Right arch
    ctx.beginPath();
    ctx.arc(362.5, 250, 62.5, Math.PI, 2 * Math.PI, true);
    ctx.stroke();

    ctx.setLineDash([]);

    // Glow representation
    const glowAlpha = 0.15 + confLevel * 0.12;
    const plasmaGlowL = ctx.createRadialGradient(237.5, 210, 5, 237.5, 210, 60);
    plasmaGlowL.addColorStop(0, `rgba(159, 122, 234, ${glowAlpha})`);
    plasmaGlowL.addColorStop(1, 'rgba(159, 122, 234, 0)');
    ctx.fillStyle = plasmaGlowL;
    ctx.beginPath();
    ctx.arc(237.5, 210, 65, 0, 2 * Math.PI);
    ctx.fill();

    const plasmaGlowR = ctx.createRadialGradient(362.5, 210, 5, 362.5, 210, 60);
    plasmaGlowR.addColorStop(0, `rgba(159, 122, 234, ${glowAlpha})`);
    plasmaGlowR.addColorStop(1, 'rgba(159, 122, 234, 0)');
    ctx.fillStyle = plasmaGlowR;
    ctx.beginPath();
    ctx.arc(362.5, 210, 65, 0, 2 * Math.PI);
    ctx.fill();

    // Circulating trapped electrons
    ctx.fillStyle = '#FBBF24';
    const numElectrons = confLevel * 6;
    const time = Date.now() * 0.003;
    for (let i = 0; i < numElectrons; i++) {
      const angleL = Math.PI + (i / numElectrons) * Math.PI + (time % Math.PI);
      const exL = 237.5 + 62.5 * Math.cos(angleL);
      const eyL = 250 + 62.5 * Math.sin(angleL);
      ctx.beginPath();
      ctx.arc(exL, eyL, 3, 0, 2 * Math.PI);
      ctx.fill();

      const angleR = Math.PI + (i / numElectrons) * Math.PI - (time % Math.PI);
      const exR = 362.5 + 62.5 * Math.cos(angleR);
      const eyR = 250 + 62.5 * Math.sin(angleR);
      ctx.beginPath();
      ctx.arc(exR, eyR, 3, 0, 2 * Math.PI);
      ctx.fill();
    }

    ctx.fillStyle = '#FFF';
    ctx.font = lang === 'en' ? 'bold 11px Google Sans, sans-serif' : 'bold 11px Gowun Batang';
    ctx.textAlign = 'center';
    ctx.fillText(UI[lang].mag.confCanvasText, 300, 285);
  }
}

function initFaradaySimulation() {

  if (!faradayCanvas) return;

  // Set initial tab state safely using globally defined faradayTab
  setFaradayTab(faradayTab);

  function tick() {
    if (faradayCanvas && faradayCtx) {
      updateFaradaySimulation();
      requestAnimationFrame(tick);
    }
  }
  tick();
}

function updateFaradaySimulation() {
  if (!faradayCanvas || !faradayCtx) return;
  if (faradayTab === 'lab') return; // Canvas is hidden under PhET simulation tab, no need to update

  const ctx = faradayCtx;
  const w = faradayCanvas.width;
  const h = faradayCanvas.height;
  ctx.clearRect(0, 0, w, h);

  // ── Mode B: Semiconductor ICP Reactor Chamber simulation ──
  const fSlider = document.getElementById('icp-freq-slider');
  const fValue = fSlider ? parseInt(fSlider.value) : 13;

  if (fSlider && document.getElementById('icp-freq-val')) {
    document.getElementById('icp-freq-val').innerText = fValue + '.56 MHz';
  }

  const acTime = Date.now() * 0.002 * fValue;
  const currentPhase = Math.sin(acTime);

  const vText = document.getElementById('faraday-voltage-indicator');
  if (vText && faradayTab === 'icp') {
    vText.innerText = `${UI[lang].ampere.phasePrefix}${currentPhase.toFixed(2)}`;
  }

  // Draw ICP Chamber outline
  ctx.fillStyle = '#1A202C';
  ctx.fillRect(40, 40, 520, 260);

  ctx.fillStyle = '#E2E8F0';
  ctx.fillRect(100, 60, 400, 10);
  ctx.fillStyle = '#A0AEC0';
  ctx.font = 'bold 9px Montserrat';
  ctx.textAlign = 'center';
  ctx.fillText("DILECTRIC QUARTZ WINDOW", 300, 55);

  ctx.fillStyle = '#DD6B20';
  ctx.beginPath();
  ctx.arc(160, 50, 8, 0, 2*Math.PI);
  ctx.arc(230, 50, 8, 0, 2*Math.PI);
  ctx.arc(370, 50, 8, 0, 2*Math.PI);
  ctx.arc(440, 50, 8, 0, 2*Math.PI);
  ctx.fill();

  ctx.fillStyle = '#FFF';
  ctx.font = 'bold 9px Montserrat';
  const signA = currentPhase >= 0 ? '+' : '-';
  const signB = currentPhase >= 0 ? '-' : '+';
  ctx.fillText(signA, 160, 53);
  ctx.fillText(signB, 230, 53);
  ctx.fillText(signA, 370, 53);
  ctx.fillText(signB, 440, 53);

  ctx.strokeStyle = 'rgba(72, 187, 120, 0.7)';
  ctx.lineWidth = 2 * Math.abs(currentPhase);
  ctx.setLineDash([4, 2]);

  ctx.beginPath();
  ctx.ellipse(195, 110, 25, 45, 0, 0, 2*Math.PI);
  ctx.stroke();

  ctx.beginPath();
  ctx.ellipse(405, 110, 25, 45, 0, 0, 2*Math.PI);
  ctx.stroke();

  ctx.setLineDash([]);

  const ionDensityFactor = Math.abs(currentPhase);
  const plasmaGlow = ctx.createRadialGradient(300, 160, 10, 300, 160, 120);
  plasmaGlow.addColorStop(0, `rgba(159, 122, 234, ${0.45 + ionDensityFactor * 0.35})`);
  plasmaGlow.addColorStop(0.6, `rgba(107, 70, 193, ${0.3 + ionDensityFactor * 0.2})`);
  plasmaGlow.addColorStop(1, 'rgba(159, 122, 234, 0)');

  ctx.fillStyle = plasmaGlow;
  ctx.beginPath();
  ctx.arc(300, 160, 120, 0, 2*Math.PI);
  ctx.fill();

  ctx.strokeStyle = '#E53E3E';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.ellipse(300, 140, 110, 25, 0, 0, 2*Math.PI);
  ctx.stroke();

  ctx.fillStyle = '#E53E3E';
  const arrowPhaseX = 300 + 110 * Math.cos(acTime);
  const arrowPhaseY = 140 + 25 * Math.sin(acTime);
  ctx.beginPath();
  ctx.arc(arrowPhaseX, arrowPhaseY, 6, 0, 2*Math.PI);
  ctx.fill();

  ctx.font = lang === 'en' ? 'bold 11px Google Sans, sans-serif' : 'bold 11px Gowun Batang';
  ctx.fillStyle = '#FFF';
  ctx.fillText(UI[lang].faraday.eIndCanvasText, 300, 135);

  ctx.fillStyle = '#4A5568';
  ctx.fillRect(140, 250, 320, 20);
  ctx.fillStyle = '#1A365D';
  ctx.fillRect(170, 244, 260, 6);
  ctx.font = 'bold 9px Montserrat';
  ctx.fillStyle = '#E2E8F0';
  ctx.fillText("HIGH DENSITY ICP PLASMA WAFER", 300, 262);
}

function initAmpereMaxwellSimulation() {

  if (!ampereCanvas) return;

  setAmpereTab(ampereTab);
}

function updateAmpereSimulation() {
  if (!ampereCanvas || !ampereCtx || ampereTab !== 'transition') return;
  const ctx = ampereCtx;
  const w = ampereCanvas.width;
  const h = ampereCanvas.height;
  ctx.clearRect(0, 0, w, h);

  const powerSlider = document.getElementById('icp-power-slider');
  const powerValText = document.getElementById('icp-power-val');
  const modeBadge = document.getElementById('icp-mode-badge');

  const pVal = powerSlider ? parseInt(powerSlider.value) : 60;
  if (powerValText) {
    powerValText.innerText = pVal + ' W';
  }

  const isHmode = pVal >= 150;
  if (modeBadge) {
    modeBadge.innerText = isHmode ? UI[lang].ampere.modeHmodeBadge : UI[lang].ampere.modeEmodeBadge;
    modeBadge.style.background = isHmode ? "#FFF5F5" : "#EBF8FF";
    modeBadge.style.color = isHmode ? "#9B2C2C" : "#2B6CB0";
  }

  // Draw ICP chamber layout
  ctx.fillStyle = '#1A202C';
  ctx.fillRect(20, 20, 320, 240);

  // Top quartz window & RF coil
  ctx.fillStyle = '#E2E8F0';
  ctx.fillRect(50, 40, 260, 8);
  ctx.fillStyle = '#DD6B20';
  ctx.beginPath();
  ctx.arc(80, 32, 6, 0, 2*Math.PI);
  ctx.arc(130, 32, 6, 0, 2*Math.PI);
  ctx.arc(230, 32, 6, 0, 2*Math.PI);
  ctx.arc(280, 32, 6, 0, 2*Math.PI);
  ctx.fill();

  // Glow render
  if (pVal > 0) {
    const plasmaY = 130;
    const ionDensity = isHmode ? (pVal / 500) : (pVal / 300);
    const plasmaGlow = ctx.createRadialGradient(180, plasmaY, 10, 180, plasmaY, isHmode ? 110 : 60);
    plasmaGlow.addColorStop(0, isHmode ? `rgba(159, 122, 234, ${0.4 + ionDensity * 0.5})` : `rgba(226, 190, 255, ${0.15 + ionDensity * 0.25})`);
    plasmaGlow.addColorStop(0.6, isHmode ? `rgba(107, 70, 193, ${0.25 + ionDensity * 0.3})` : `rgba(226, 190, 255, 0.05)`);
    plasmaGlow.addColorStop(1, 'rgba(159, 122, 234, 0)');
    ctx.fillStyle = plasmaGlow;
    ctx.beginPath();
    ctx.arc(180, plasmaY, isHmode ? 110 : 60, 0, 2*Math.PI);
    ctx.fill();

    // Capacitive E-fields (vertical, dim) in E-mode
    if (!isHmode) {
      ctx.strokeStyle = 'rgba(144, 205, 244, 0.45)';
      ctx.lineWidth = 1;
      for (let x = 70; x < 300; x += 30) {
        ctx.beginPath();
        ctx.moveTo(x, 48);
        ctx.lineTo(x, 100);
        ctx.stroke();
      }
      ctx.fillStyle = '#90CDF4';
      ctx.font = 'bold 8px Montserrat';
      ctx.fillText("Capacitive E-Field (Dim Glow)", 180, 80);
    } else {
      // Inductive H-mode magnetic loop and toroidal currents
      ctx.strokeStyle = 'rgba(72, 187, 120, 0.65)';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(100, 50, 160, 110);
      ctx.fillStyle = '#48BB78';
      ctx.font = 'bold 8px Montserrat';
      ctx.fillText("Induced Magnetic Loops (H-field)", 180, 65);

      // Sizzling bright center
      ctx.fillStyle = '#E53E3E';
      ctx.beginPath();
      ctx.ellipse(180, 120, 70, 15, 0, 0, 2*Math.PI);
      ctx.stroke();
      ctx.fillText("HIGH DENSITY INDUCTIVE RING", 180, 115);
    }
  }

  ctx.fillStyle = '#FFF';
  ctx.font = lang === 'en' ? 'bold 10px Google Sans, sans-serif' : 'bold 10px Gowun Batang';
  ctx.textAlign = 'center';
  ctx.fillText(UI[lang].ampere.icpStatusCanvasText, 180, 250);

  // Draw Hysteresis curve plot on the right
  const px = 370, py = 50;
  const pw = 200, ph = 210;
  
  // Grid background
  ctx.fillStyle = '#F7F8FA';
  ctx.fillRect(px, py, pw, ph);
  ctx.strokeStyle = '#E5E7EB';
  ctx.lineWidth = 1;
  for (let gy = py; gy <= py + ph; gy += 30) {
    ctx.beginPath();
    ctx.moveTo(px, gy);
    ctx.lineTo(px + pw, gy);
    ctx.stroke();
  }
  for (let gx = px; gx <= px + pw; gx += 40) {
    ctx.beginPath();
    ctx.moveTo(gx, py);
    ctx.lineTo(gx, py + ph);
    ctx.stroke();
  }

  // Draw Hysteresis trace
  ctx.strokeStyle = '#A0AEC0';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(px, py + ph - 20);
  ctx.lineTo(px + 60, py + ph - 30);
  ctx.lineTo(px + 60, py + 50);
  ctx.lineTo(px + pw, py + 20);
  ctx.stroke();

  // Draw current operating point dot
  const dotX = px + (pVal / 500) * pw;
  let dotY = py + ph - 20;
  if (isHmode) {
    dotY = py + 50 - ((pVal - 150) / 350) * 30;
  } else {
    dotY = py + ph - 20 - (pVal / 150) * 10;
  }

  ctx.fillStyle = isHmode ? '#E53E3E' : '#2B6CB0';
  ctx.beginPath();
  ctx.arc(dotX, dotY, 6, 0, 2*Math.PI);
  ctx.fill();

  // Axis arrows and labels
  ctx.strokeStyle = '#2D2D2D';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(px, py + ph);
  ctx.lineTo(px + pw + 5, py + ph);
  ctx.moveTo(px, py + ph);
  ctx.lineTo(px, py - 5);
  ctx.stroke();

  ctx.fillStyle = '#2D2D2D';
  ctx.font = 'bold 8px Montserrat';
  ctx.fillText("RF Power (W)", px + pw - 20, py + ph + 12);
  
  ctx.save();
  ctx.translate(px - 10, py + 80);
  ctx.rotate(-Math.PI/2);
  ctx.fillText("Plasma Density (n_e)", 0, 0);
  ctx.restore();

  ctx.font = lang === 'en' ? 'bold 9px Google Sans, sans-serif' : 'bold 9px Gowun Batang';
  ctx.fillText(UI[lang].ampere.hysteresisCurveText, px + pw/2, py - 10);
}

// Global text scale control function
let currentScale = 1.0;
function adjustScale(amount) {
  if (amount === 0) {
    currentScale = 1.0;
  } else {
    currentScale = Math.max(0.8, Math.min(1.5, currentScale + amount));
  }
  document.documentElement.style.setProperty('--scale', currentScale);
  const scaleIndicator = document.getElementById('scale-indicator');
  if (scaleIndicator) {
    scaleIndicator.innerText = Math.round(currentScale * 100) + '%';
  }
}

// Filter button logic
document.querySelectorAll('.era-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.era-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    buildSidebar(btn.dataset.era);
    if (currentId) {
      setTimeout(() => {
        const card = document.getElementById(`card-${currentId}`);
        if (card) card.classList.add('active');
      }, 30);
    }
  });
});

// App Initiation
document.body.setAttribute('data-lang', 'ko'); // 초기 언어 설정 (KO)
buildSidebar('all');
setTimeout(() => selectSlide('ch0'), 150);
</script>
