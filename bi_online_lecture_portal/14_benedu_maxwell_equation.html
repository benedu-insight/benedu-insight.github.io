<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maxwell's Equations — Benedu Insight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Gowun+Batang:wght@400;700&family=JetBrains+Mono:wght@400;500;600;700&display=block" rel="stylesheet">
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/benedu-insight/benedu-insight.github.io/refs/heads/main/logo_png/benedu_insight_Symbol.png">

<!-- MathJax Formula Engine with Safe Loading Config -->
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']]
    },
    startup: {
      ready: function () {
        MathJax.startup.defaultReady();
        const panel = document.getElementById('detail');
        if (panel && window.MathJax.typesetPromise) {
          MathJax.typesetPromise([panel]).catch(function (err) {
            console.log('MathJax initial typeset failed: ' + err.message);
          });
        }
      }
    }
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<style>
/* ═══════════════════════════════════════════════
   BENEDU INSIGHT — MAXWELL'S EQUATIONS
   23_impedance 스타일 계승, EM 아이덴티티 추가
═══════════════════════════════════════════════ */
:root {
  --bg:          #F7F8FA;
  --card:        #F1EFEA;
  --card-hd:     #E7E4DD;
  --purple:      #7030A0;
  --green:       #0F8C50;
  --green-soft:  #E5F4EC;
  --green-dark:  #0a6b3d;
  --blue:        #1A6FB5;
  --blue-soft:   #EBF8FF;
  --blue-dark:   #2B6CB0;
  --teal:        #0891B2;
  --red:         #C0392B;
  --charcoal:    #2D2D2D;
  --text:        #1A1A2E;
  --text-sub:    #5A5A7A;
  --text3:       #9CA3AF;
  --border:      #D8D5CE;
  --border2:     #F3F4F6;
  --shadow:      0 2px 12px rgba(0,0,0,0.08);
  --shadow-md:   0 4px 16px rgba(0,0,0,0.12);
  --radius:      12px;
  --font:        'Google Sans', 'Gowun Batang', serif;
  --mono:        'JetBrains Mono', 'Gowun Batang', monospace;
  --batang:      'Google Sans', 'Gowun Batang', serif;
  --scale:       1.0;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; scroll-behavior: smooth; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  align-items: stretch;
  min-height: 100vh;
  width: 100%;
  overflow-x: hidden;
}

/* ── Header ── */
header {
  background: #FFFFFF;
  border-bottom: 1px solid var(--border);
  padding: 0.75rem 1.75rem;
  display: flex;
  align-items: center;
  gap: 1.25rem;
  box-shadow: var(--shadow);
  width: 100%;
  position: sticky;
  top: 0;
  z-index: 200;
}
.header-logo { height: 46px; width: auto; flex-shrink: 0; }
.header-divider { width: 1px; height: 32px; background: var(--border); flex-shrink: 0; }
.header-title-block { flex: 1; min-width: 0; }
header h1 {
  font-family: var(--font);
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--purple);
  letter-spacing: 0.01em;
  line-height: 1.25;
}
header p {
  font-family: var(--mono);
  font-size: 0.63rem;
  color: var(--text3);
  letter-spacing: 0.09em;
  text-transform: uppercase;
  margin-top: 2px;
}

/* Language Toggle */
.lang-toggle {
  display: flex;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  background: var(--bg);
}
.lang-btn {
  flex: 1;
  padding: 5px 14px;
  border: none;
  background: transparent;
  cursor: pointer;
  font-family: var(--font);
  font-size: 0.78rem;
  font-weight: 500;
  color: var(--text-sub);
  transition: all 0.15s;
}
.lang-btn.active-lang {
  background: var(--teal);
  color: #fff;
  font-weight: 600;
}

/* Era filter buttons */
.era-filter {
  margin-left: auto;
  display: flex;
  gap: 0.4rem;
  flex-wrap: wrap;
  align-items: center;
}
.era-btn {
  background: transparent;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  color: var(--text-sub);
  font-family: var(--font);
  font-size: 0.78rem;
  font-weight: 500;
  padding: 5px 14px;
  cursor: pointer;
  transition: all 0.15s;
}
.era-btn:hover { border-color: var(--teal); color: var(--teal); background: #F0FAFF; }
.era-btn.active { background: var(--teal); border-color: var(--teal); color: #fff; font-weight: 600; }

/* ── Layout ── */
.layout {
  display: grid;
  grid-template-columns: 300px 1fr;
  height: calc(100vh - 70px);
  width: 100%;
}

/* ── Sidebar ── */
.timeline-sidebar {
  border-right: 1px solid var(--border);
  overflow-y: auto;
  background: #FFFFFF;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.timeline-sidebar::-webkit-scrollbar { width: 4px; }
.timeline-sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.era-header {
  position: sticky;
  top: 0;
  background: #FFFFFF;
  padding: 0.7rem 1rem 0.5rem;
  border-bottom: 1px solid #F0F0EE;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 0.6rem;
  cursor: pointer;
  user-select: none;
}
.era-header:hover { background: var(--bg); }
.era-label {
  font-family: var(--font);
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--text-sub);
}
.era-line { flex: 1; height: 1px; background: var(--border); }
.era-range {
  font-family: var(--mono);
  font-size: 0.58rem;
  color: var(--text3);
  letter-spacing: 0.06em;
}
.era-toggle {
  flex-shrink: 0;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #F0F0EE;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.6rem;
  color: var(--text-sub);
  transition: background 0.15s, transform 0.22s;
}
.era-header.collapsed .era-toggle { transform: rotate(-90deg); }
.era-header:hover .era-toggle { background: var(--border); }
.era-cards {
  overflow: hidden;
  max-height: 2000px;
  transition: max-height 0.3s ease, opacity 0.25s ease;
  opacity: 1;
}
.era-cards.collapsed { max-height: 0; opacity: 0; }

/* Sidebar Cards */
.sci-card {
  padding: 0.7rem 1rem 0.7rem 1.1rem;
  border-bottom: 1px solid #F0F0EE;
  cursor: pointer;
  transition: background 0.15s;
  display: flex;
  gap: 0.7rem;
  align-items: flex-start;
  border-left: 3px solid transparent;
}
.sci-card:hover { background: var(--bg); }
.sci-card.active { background: #F0FAFF; border-left-color: var(--teal); }

.sci-year {
  font-family: var(--mono);
  font-size: 0.6rem;
  color: var(--text3);
  min-width: 48px;
  padding-top: 2px;
  line-height: 1.4;
}
.sci-info { flex: 1; min-width: 0; }
.sci-name {
  font-family: var(--font);
  font-size: 0.84rem;
  font-weight: 700;
  color: var(--charcoal);
  line-height: 1.3;
}
.sci-card.active .sci-name { color: var(--teal); }
.sci-nation {
  font-size: 0.68rem;
  color: var(--text3);
  margin-top: 1px;
  font-family: var(--batang);
}
.sci-tags { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
.sci-tag {
  font-family: var(--mono);
  font-size: 0.54rem;
  padding: 1px 6px;
  border-radius: 8px;
  letter-spacing: 0.03em;
}

/* ── Detail Panel ── */
.detail-panel {
  display: flex;
  flex-direction: column;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
}

/* Toolbar */
.content-toolbar {
  position: sticky;
  top: 0;
  background: rgba(247, 248, 250, 0.96);
  backdrop-filter: blur(8px);
  padding: 0.55rem 2rem;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 0.5rem;
  border-bottom: 1px solid var(--border);
  z-index: 10;
}
.toolbar-btn {
  border: 1.5px solid var(--border);
  border-radius: 8px;
  background: #fff;
  color: var(--text-sub);
  padding: 5px 12px;
  font-size: 0.75rem;
  cursor: pointer;
  font-family: var(--mono);
  font-weight: 500;
  transition: all 0.15s;
}
.toolbar-btn:hover { border-color: var(--teal); background: #F0FAFF; color: var(--teal); }
.toolbar-btn:active { transform: scale(0.95); }

#detail {
  flex: 1;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
#detail::-webkit-scrollbar { width: 4px; }
#detail::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.detail-content { padding: 2rem 3rem 3rem; max-width: 100%; margin: 0; }

/* ── Hero Card ── */
.detail-hero {
  background: var(--card);
  border-radius: var(--radius);
  padding: 1.5rem 1.75rem;
  margin-bottom: 1.5rem;
  box-shadow: var(--shadow);
}
.detail-era-tag {
  font-family: var(--mono);
  font-size: 0.62rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 0.55rem;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 3px 10px;
  border-radius: 20px;
  font-weight: 600;
}
.detail-name {
  font-family: var(--font);
  font-size: calc(1.75rem * var(--scale));
  font-weight: 700;
  line-height: 1.15;
  color: var(--purple);
  margin-bottom: 0.15rem;
  transition: font-size 0.15s ease-out;
}
.detail-name-kr {
  font-family: var(--batang);
  font-size: calc(0.95rem * var(--scale));
  color: var(--text-sub);
  margin-bottom: 0.7rem;
  font-weight: 400;
  transition: font-size 0.15s ease-out;
}
.detail-meta {
  display: flex;
  gap: 1.25rem;
  flex-wrap: wrap;
  font-family: var(--mono);
  font-size: calc(0.67rem * var(--scale));
  color: var(--text-sub);
  padding-top: 0.7rem;
  border-top: 1px solid var(--border);
  transition: font-size 0.15s ease-out;
}

/* ── Model Showcase ── */
.model-showcase {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem;
  margin-bottom: 1.5rem;
  box-shadow: var(--shadow);
}
.model-svg-wrapper {
  width: 100%;
  max-width: 100%;
  min-height: 300px;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* ── Diagram Card (d-wrap) ── */
.d-wrap {
  background: var(--card);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}
.d-header {
  background: var(--card-hd);
  padding: 11px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-radius: var(--radius) var(--radius) 0 0;
}
.d-badge {
  background: var(--teal);
  color: #fff;
  font-size: 0.64rem;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 20px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  font-family: var(--mono);
}
.d-badge.purple { background: var(--purple); }
.d-badge.green  { background: var(--green); }
.d-badge.blue   { background: var(--blue); }
.d-title { font-size: 0.88rem; font-weight: 700; color: var(--text); font-family: var(--font); }
.d-body { padding: 1.1rem; }

/* ── Equation Block ── */
.eq-block {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 18px;
  margin: 10px 0;
  font-family: var(--mono);
  font-size: calc(0.92rem * var(--scale));
  text-align: center;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  transition: font-size 0.15s ease-out;
}
.eq-label {
  font-size: 0.7rem;
  color: var(--text-sub);
  text-align: right;
  margin-top: 4px;
  font-family: var(--font);
}

/* ── Quote Box ── */
.quote-block {
  display: flex;
  gap: 14px;
  align-items: flex-start;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem 1.1rem;
  margin-bottom: 1.25rem;
  box-shadow: var(--shadow);
}
.quote-badge {
  flex: none;
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--green-soft);
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem; margin-top: 2px;
}
.quote-body { flex: 1; min-width: 0; }
.quote-text {
  font-family: var(--batang);
  font-style: italic;
  font-size: calc(0.9rem * var(--scale));
  color: var(--green-dark);
  line-height: 1.78;
  transition: font-size 0.15s ease-out;
}
.quote-attr {
  font-family: var(--mono);
  font-size: calc(0.6rem * var(--scale));
  color: var(--text3);
  margin-top: 0.45rem;
  letter-spacing: 0.06em;
  transition: font-size 0.15s ease-out;
}

/* ── Callout ── */
.callout {
  background: #F0FAFF;
  border: 1px solid #A8D8E8;
  border-radius: 10px;
  padding: 14px 16px;
  margin: 14px 0;
  font-size: calc(0.84rem * var(--scale));
  line-height: 1.65;
  color: var(--text);
  transition: font-size 0.15s ease-out;
}
.callout.green  { background: #F0FAF4; border-color: #A8D5B8; }
.callout.purple { background: #F8F6FF; border-color: #C9B8E8; }
.callout.blue   { background: #EBF8FF; border-color: #90CDF4; }
.callout-title {
  font-weight: 700;
  font-size: 0.76rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 6px;
  color: var(--teal);
  font-family: var(--font);
}
.callout.green .callout-title  { color: var(--green); }
.callout.purple .callout-title { color: var(--purple); }
.callout.blue .callout-title   { color: var(--blue-dark); }

/* ── Detail Bio ── */
.detail-bio {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.5rem;
  font-size: calc(0.88rem * var(--scale));
  line-height: 1.9;
  color: var(--text);
  margin-bottom: 1.5rem;
  box-shadow: var(--shadow);
  font-family: var(--batang);
  transition: font-size 0.15s ease-out;
}
.detail-bio p + p { margin-top: 0.85em; }

/* ── Section Title ── */
.section-title {
  font-family: var(--font);
  font-size: 0.64rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text3);
  margin-top: 1.75rem;
  margin-bottom: 0.75rem;
  display: flex;
  align-items: center;
  gap: 0.6rem;
}
.section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* ── Theory/Detail Cards Grid ── */
.theories-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 0.75rem;
  margin-bottom: 1.5rem;
}
.theory-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1rem;
  box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  transition: box-shadow 0.18s, border-color 0.18s;
}
.theory-card:hover { box-shadow: var(--shadow-md); border-color: var(--teal); }
.theory-year {
  font-family: var(--mono);
  font-size: calc(0.6rem * var(--scale));
  letter-spacing: 0.06em;
  margin-bottom: 0.3rem;
  color: var(--blue-dark);
  font-weight: 500;
  transition: font-size 0.15s ease-out;
}
.theory-name {
  font-size: calc(0.87rem * var(--scale));
  font-weight: 700;
  color: var(--charcoal);
  margin-bottom: 0.35rem;
  line-height: 1.3;
  font-family: var(--font);
  transition: font-size 0.15s ease-out;
}
.theory-desc {
  font-size: calc(0.76rem * var(--scale));
  color: var(--text-sub);
  line-height: 1.65;
  font-family: var(--batang);
  transition: font-size 0.15s ease-out;
}

/* ── Collapsible Classroom Box ── */
details.classroom-box {
  background: #FFFDF0;
  border: 1px dashed #EEDF8B;
  border-radius: var(--radius);
  padding: 1.1rem;
  margin-bottom: 1.5rem;
  cursor: pointer;
  transition: border 0.15s;
}
details.classroom-box[open] { border-style: solid; border-color: #D6C359; }
details.classroom-box summary {
  font-family: var(--font);
  font-size: 0.84rem;
  font-weight: 700;
  color: #8C730F;
  outline: none;
  user-select: none;
}
.classroom-body {
  font-size: calc(0.78rem * var(--scale));
  line-height: 1.7;
  color: #6B5B1E;
  margin-top: 0.75rem;
  cursor: default;
  font-family: var(--batang);
  transition: font-size 0.15s ease-out;
}

/* ── Overview Dashboard ── */
.overview-container {
  background: #EAEBED;
  border-radius: 16px;
  padding: 2rem 1.5rem;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  margin-bottom: 1.5rem;
  text-align: center;
}
.overview-grid {
  display: flex;
  gap: 0.75rem;
  flex-wrap: wrap;
  justify-content: center;
}
.overview-card {
  flex: 1;
  min-width: 180px;
  max-width: 260px;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.2rem 0.5rem;
  cursor: pointer;
  transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s, border-color 0.2s;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  height: 250px;
  box-shadow: var(--shadow);
}
.overview-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-md); border-color: var(--teal); }
.overview-card-tag {
  background: #90CDF4;
  color: #1A1A2E;
  font-size: 0.54rem;
  font-weight: bold;
  padding: 3px 6px;
  border-radius: 4px;
  width: 100%;
  text-align: center;
  margin-top: 0.5rem;
  font-family: var(--mono);
}

/* ── Sim Container ── */
.sim-container {
  width: 100%;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1rem;
  margin-top: 1rem;
}
.sim-controls {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  margin-bottom: 0.75rem;
  padding: 0.5rem;
  background: var(--bg);
  border-radius: 6px;
  border: 1px solid var(--border);
  align-items: center;
  font-size: 0.8rem;
}
.sim-slider-label {
  font-family: var(--mono);
  font-weight: 700;
  color: var(--purple);
}
.sim-tab-btns {
  display: flex;
  gap: 4px;
  width: 100%;
  margin-bottom: 1rem;
  border-bottom: 2px solid var(--border);
  padding-bottom: 0;
}
.sim-tab-btn {
  flex: 1;
  padding: 8px 18px 10px;
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  cursor: pointer;
  font-family: var(--font);
  font-size: 0.82rem;
  font-weight: 500;
  color: var(--text-sub);
  transition: all 0.15s;
}
.sim-tab-btn.active {
  color: var(--teal);
  border-bottom-color: var(--teal);
  font-weight: 700;
}
.sim-tab-btn:hover:not(.active) { color: var(--text); }

/* ── Summary Matrix Table ── */
.summary-matrix {
  width: 100%;
  border-collapse: collapse;
  background: #fff;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: var(--shadow);
  margin-bottom: 1.5rem;
}
.summary-matrix th, .summary-matrix td {
  padding: 0.75rem 1rem;
  font-size: calc(0.78rem * var(--scale));
  text-align: left;
  border-bottom: 1px solid var(--border);
  transition: font-size 0.15s ease-out;
}
.summary-matrix th {
  background: var(--card-hd);
  color: var(--text-sub);
  font-weight: 700;
  font-family: var(--font);
  text-transform: uppercase;
  letter-spacing: 0.05em;

// Build timeline navigation in sidebar
function buildSidebar(filter) {
  currentEraFilter = filter;
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = '';
  const T = UI[lang];
  const SLIDES = getSLIDES();

  const eras = [
    { id: 'electrostatics', label: T.eraLabels.electrostatics, range: T.eraRanges.electrostatics },
    { id: 'dynamics',       label: T.eraLabels.dynamics,       range: T.eraRanges.dynamics },
    { id: 'synthesis',      label: T.eraLabels.synthesis,      range: T.eraRanges.synthesis }
  ];

  const eraColors = {
    electrostatics: { tag: '#0891B2', tagBg: '#F0FAFF', tagBorder: '#A8D8E8' },
    dynamics:       { tag: '#7030A0', tagBg: '#F8F6FF', tagBorder: '#C9B8E8' },
    synthesis:      { tag: '#0F8C50', tagBg: '#F0FAF4', tagBorder: '#A8D5B8' }
  };

  eras.forEach(era => {
    const slides = SLIDES
      .filter(s => s.era === era.id && (filter === 'all' || filter === s.era))
      .sort((a, b) => {
        // ch6_ref가 ch6 바로 뒤에 오도록 고정 배치 정렬 보정
        const order = { 'ch0':1, 'ch1':2, 'ch2':3, 'ch3':4, 'ch4':5, 'ch5':6, 'ch6':7, 'ch6_ref':8, 'ch7':9 };
        return (order[a.id] || 99) - (order[b.id] || 99);
      });

    if (slides.length === 0) return;

    const grp = document.createElement('div');
    grp.className = 'era-group';

    const hdr = document.createElement('div');
    hdr.className = 'era-header';
    hdr.innerHTML = `
      <span class="era-label" style="color:${eraColors[era.id].tag}">${era.label}</span>
      <span class="era-line"></span>
      <span class="era-range" style="font-size:0.55rem;">${era.range}</span>
      <span class="era-toggle">▾</span>
    `;
    grp.appendChild(hdr);

    const cardsWrap = document.createElement('div');
    cardsWrap.className = 'era-cards';

    const ec = eraColors[era.id];

    slides.forEach(slide => {
      const card = document.createElement('div');
      card.className = 'sci-card';
      card.id = `card-${slide.id}`;

      const tagHtml = slide.tags.map(t =>
        `<span class="sci-tag" style="background:${ec.tagBg};color:${ec.tag};border:1px solid ${ec.tagBorder}">${t}</span>`
      ).join('');

      card.innerHTML = `
        <div class="sci-year">${slide.chapter}</div>
        <div class="sci-info">
          <div class="sci-name" style="font-size:0.83rem">${slide.nameKr}</div>
          <div class="sci-nation" style="font-size:0.62rem">${slide.period}</div>
          <div class="sci-tags">${tagHtml}</div>
        </div>
      `;
      card.addEventListener('click', () => selectSlide(slide.id));
      cardsWrap.appendChild(card);
    });

    hdr.addEventListener('click', () => {
      const isCollapsed = cardsWrap.classList.toggle('collapsed');
      hdr.classList.toggle('collapsed', isCollapsed);
    });

    grp.appendChild(cardsWrap);
    sidebar.appendChild(grp);
  });
}

let currentId = null;

function selectSlide(id) {
  document.querySelectorAll('.sci-card').forEach(c => c.classList.remove('active'));
  const slide = getSLIDES().find(s => s.id === id);
  if (!slide) return;
  currentId = id;

  const card = document.getElementById(`card-${id}`);
  if (card) {
    const wrap = card.closest('.era-cards');
    if (wrap && wrap.classList.contains('collapsed')) {
      wrap.classList.remove('collapsed');
      wrap.previousElementSibling?.classList.remove('collapsed');
    }
    card.classList.add('active');
    card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  renderDetail(slide);
}

// ── Interactive Gauss Simulator (Chapter 1) ──
let gaussTab = 'classic';
let gaussCanvas = null, gaussCtx = null;
function setGaussTab(tab) {
  gaussTab = tab;
  document.getElementById('gauss-tab-classic').classList.toggle('active', tab === 'classic');
  document.getElementById('gauss-tab-ccp').classList.toggle('active', tab === 'ccp');
  document.getElementById('gauss-controls-classic').style.display = tab === 'classic' ? 'flex' : 'none';
  document.getElementById('gauss-controls-ccp').style.display = tab === 'ccp' ? 'flex' : 'none';
  // classic tab now shows the Basic Course animation; the old canvas/controls serve the plasma tab only
  document.getElementById('gauss-controls-classic').style.display = 'none';
  { const a = document.getElementById('gauss-af'), c = document.getElementById('gauss-sim-canvas'), f = document.getElementById('gauss-formula-dynamic');
    if (a) a.style.display = tab === 'classic' ? '' : 'none'; if (c) c.style.display = tab === 'classic' ? 'none' : ''; if (f) f.style.display = tab === 'classic' ? 'none' : ''; }
  updateGaussSimulation();
}

function initGaussSimulation() {
  gaussCanvas = document.getElementById('gauss-sim-canvas');
  if (!gaussCanvas) return;
  gaussCtx = gaussCanvas.getContext('2d');
  setGaussTab(gaussTab);
}

function updateGaussSimulation() {
  if (!gaussCanvas || !gaussCtx) return;
  const ctx = gaussCtx;
  const w = gaussCanvas.width;
  const h = gaussCanvas.height;
  ctx.clearRect(0, 0, w, h);

  const chargeSlider = document.getElementById('gauss-charge-slider');
  const chargeValText = document.getElementById('gauss-charge-val');
  const showFieldsCheckbox = document.getElementById('gauss-field-toggle');
  
  const qVal = chargeSlider ? parseInt(chargeSlider.value) : 6;
  const showFields = showFieldsCheckbox ? showFieldsCheckbox.checked : true;

  if (chargeValText) {
    chargeValText.innerText = (qVal >= 0 ? '+' : '') + qVal + ' nC';
    chargeValText.style.color = qVal >= 0 ? '#E53E3E' : '#2B6CB0';
  }

  // Dynamic formula update
  const formulaDiv = document.getElementById('gauss-formula-dynamic');
  if (formulaDiv) {
    const fluxVal = (qVal * 1.13).toFixed(2);
    const signChar = qVal >= 0 ? '+' : '';
    formulaDiv.innerHTML = `${UI[lang].gauss.formulaPrefix}$$\\Phi = \\oint_S \\mathbf{E} \\cdot d\\mathbf{A} = \\frac{Q_{\\text{enc}}}{\\varepsilon_0} = ${signChar}${fluxVal} \\times 10^2 \\text{ N}\\cdot\\text{m}^2/\\text{C}$$`;
    if (window.MathJax && window.MathJax.typesetPromise) {
      MathJax.typesetPromise([formulaDiv]);
    }
  }

  if (gaussTab === 'classic') {
    // ── Classic Gauss Law diagram matching image_fe93cb.png ──
    const cx = 220;
    const cy = 170;
    const r = 90;

    // Draw Title border
    ctx.strokeStyle = '#2D2D2D';
    ctx.lineWidth = 2;
    ctx.strokeRect(cx - 70, 15, 140, 30);
    ctx.font = 'bold 15px ""Google Sans","Gowun Batang",serif",""Google Sans","Gowun Batang",serif",serif';
    ctx.fillStyle = '#2D2D2D';
    ctx.textAlign = 'center';
    ctx.fillText("Gauss's Law", cx, 35);

    // Light blue Gaussian Surface fill
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, 2 * Math.PI);
    ctx.fillStyle = 'rgba(144, 205, 244, 0.4)';
    ctx.fill();
    ctx.strokeStyle = '#3182CE';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Central positive/negative charge badge
    ctx.beginPath();
    ctx.arc(cx, cy, 10, 0, 2 * Math.PI);
    ctx.fillStyle = qVal >= 0 ? '#E53E3E' : '#2B6CB0';
    ctx.fill();
    ctx.font = 'bold 12px ""Google Sans","Gowun Batang",serif",""Google Sans","Gowun Batang",serif",serif';
    ctx.fillStyle = '#FFF';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(qVal >= 0 ? '+' : '-', cx, cy);
    ctx.textBaseline = 'alphabetic';

    // Label: "Charge" & "Gaussian surface"
    ctx.font = '12px ""Google Sans","Gowun Batang",serif",""Google Sans","Gowun Batang",serif",serif';
    ctx.fillStyle = '#2D2D2D';
    ctx.fillText("Charge", cx - 40, cy - 15);
    ctx.fillText("Gaussian", cx - 45, cy + 45);
    ctx.fillText("surface", cx - 45, cy + 60);

    // Draw radial field lines (E) if checked
    const lineCount = Math.min(24, Math.abs(qVal) * 2);
    if (showFields && lineCount > 0) {
      ctx.strokeStyle = qVal >= 0 ? '#E53E3E' : '#2B6CB0';
      ctx.lineWidth = 1.2;
      for (let i = 0; i < lineCount; i++) {
        const angle = (i * 2 * Math.PI) / lineCount;
        const startR = 15;
        const endR = 140;
        const sx = cx + Math.cos(angle) * startR;
        const sy = cy + Math.sin(angle) * startR;
        const ex = cx + Math.cos(angle) * endR;
        const ey = cy + Math.sin(angle) * endR;

        // Draw line
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(ex, ey);
        ctx.stroke();

        // Draw arrowheads based on polarity
        ctx.fillStyle = qVal >= 0 ? '#E53E3E' : '#2B6CB0';
        const arrowAngle = qVal >= 0 ? angle : angle + Math.PI;
        const arrowR = qVal >= 0 ? endR : startR + 10;
        const ax = cx + Math.cos(angle) * arrowR;
        const ay = cy + Math.sin(angle) * arrowR;

        ctx.beginPath();
        ctx.moveTo(ax, ay);
        ctx.lineTo(ax - 6 * Math.cos(arrowAngle - 0.3), ay - 6 * Math.sin(arrowAngle - 0.3));
        ctx.lineTo(ax - 6 * Math.cos(arrowAngle + 0.3), ay - 6 * Math.sin(arrowAngle + 0.3));
        ctx.closePath();
        ctx.fill();
      }
      ctx.font = '11px ""JetBrains Mono","Gowun Batang",monospace",""Google Sans","Gowun Batang",serif",monospace';
      ctx.fillStyle = qVal >= 0 ? '#E53E3E' : '#2B6CB0';
      ctx.fillText("Electric field lines", cx + 60, cy - 100);
    }

    // Draw Curved Surface patch (dS) with vectors E & dS at angle 45 degrees
    const patchAngle = -Math.PI / 4; // 45 deg upper right
    const px = cx + Math.cos(patchAngle) * r;
    const py = cy + Math.sin(patchAngle) * r;

    // Draw curved blue surface segment
    ctx.beginPath();
    ctx.arc(cx, cy, r, patchAngle - 0.15, patchAngle + 0.15);
    ctx.strokeStyle = '#2B6CB0';
    ctx.lineWidth = 4;
    ctx.stroke();
    // Fill surface representation
    ctx.font = '11px ""JetBrains Mono","Gowun Batang",monospace",""Google Sans","Gowun Batang",serif",monospace';
    ctx.fillStyle = '#2D3748';
    ctx.fillText("ds", px - 15, py + 12);

    // Vector dS (always outward, normal)
    const dsLen = 35;
    const dsx = px + Math.cos(patchAngle) * dsLen;
    const dsy = py + Math.sin(patchAngle) * dsLen;
    ctx.strokeStyle = '#2D2D2D';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(dsx, dsy);
    ctx.stroke();
    // dS arrow head
    ctx.fillStyle = '#2D2D2D';
    ctx.beginPath();
    ctx.moveTo(dsx, dsy);
    ctx.lineTo(dsx - 5 * Math.cos(patchAngle - 0.3), dsy - 5 * Math.sin(patchAngle - 0.3));
    ctx.lineTo(dsx - 5 * Math.cos(patchAngle + 0.3), dsy - 5 * Math.sin(patchAngle + 0.3));
    ctx.closePath();
    ctx.fill();
    ctx.fillText("ds", dsx + 5, dsy + 2);

    // Vector E (outward if positive, inward if negative)
    const eLen = Math.abs(qVal) * 5;
    if (eLen > 0) {
      const eAngle = qVal >= 0 ? patchAngle : patchAngle + Math.PI;
      const ex = px + Math.cos(patchAngle) * (qVal >= 0 ? eLen : -eLen);
      const ey = py + Math.sin(patchAngle) * (qVal >= 0 ? eLen : -eLen);

      ctx.strokeStyle = '#E53E3E';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(ex, ey);
      ctx.stroke();
      // E arrow head
      ctx.fillStyle = '#E53E3E';
      ctx.beginPath();
      ctx.moveTo(ex, ey);
      const arrDir = qVal >= 0 ? patchAngle : patchAngle + Math.PI;
      ctx.lineTo(ex - 6 * Math.cos(arrDir - 0.35), ey - 6 * Math.sin(arrDir - 0.35));
      ctx.lineTo(ex - 6 * Math.cos(arrDir + 0.35), ey - 6 * Math.sin(arrDir + 0.35));
      ctx.closePath();
      ctx.fill();
      ctx.fillText("E", ex + 5, ey - 5);
    }

    // Right-side formulas matching image_fe93cb.png
    const rx = cx + 200;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#2D2D2D';
    ctx.font = 'bold 16px ""Google Sans","Gowun Batang",serif",""Google Sans","Gowun Batang",serif",serif';
    ctx.fillText("Φ ∝ Q_enc", rx, 90);
    ctx.font = 'bold 18px ""Google Sans","Gowun Batang",serif",""Google Sans","Gowun Batang",serif",serif';
    ctx.fillText("Φ = ∮ E · ds = Q_enc / ε_0", rx, 130);

    ctx.font = '12px ""Google Sans","Gowun Batang",serif",""Google Sans","Gowun Batang",serif",serif';
    ctx.fillText("Φ  : Electric flux", rx, 175);
    ctx.fillText("E  : Electric field", rx, 200);
    ctx.fillText("ds : Infinitesimal surface area", rx, 225);
    ctx.fillText("Q_enc : Charge enclosed", rx, 250);
    ctx.fillText("ε_0 : Permittivity of air/vacuum", rx, 275);

  } else {
    // ── CCP Semiconductor Chamber Application View ──
    const vSlider = document.getElementById('ccp-voltage-slider');
    const vValue = vSlider ? parseInt(vSlider.value) : 250;

    // Draw parallel plates chamber
    ctx.fillStyle = '#1A202C';
    ctx.fillRect(40, 40, 520, 260); // dark chamber

    // Top electrode (RF plate)
    ctx.fillStyle = '#718096';
    ctx.fillRect(80, 55, 440, 15);
    ctx.fillStyle = '#E53E3E';
    ctx.font = 'bold 10px ""JetBrains Mono","Gowun Batang",monospace",""Google Sans","Gowun Batang",serif",monospace';
    ctx.textAlign = 'center';
    ctx.fillText("RF ELECTRODE (TOP PLATE)", 300, 50);

    // Bottom electrode (Wafer chuck)
    ctx.fillStyle = '#4A5568';
    ctx.fillRect(80, 250, 440, 25);
    // Wafer on top of bottom electrode
    ctx.fillStyle = '#1A365D';
    ctx.fillRect(120, 244, 360, 6);
    ctx.fillStyle = '#319795';
    ctx.font = 'bold 10px ""Google Sans","Gowun Batang",serif",""Google Sans","Gowun Batang",serif",serif';
    ctx.fillText("WAFER SUBSTRATE", 300, 240);

    // Draw plasma bulk (glow) in center
    const sheathH = Math.max(10, Math.min(60, 15 + vValue / 15));
    const plasmaTop = 70 + sheathH;
    const plasmaBottom = 244 - sheathH;

    // Glowing plasma gradient
    const plasmaGrad = ctx.createLinearGradient(0, plasmaTop, 0, plasmaBottom);
    plasmaGrad.addColorStop(0, 'rgba(129, 230, 217, 0.15)');
    plasmaGrad.addColorStop(0.2, 'rgba(159, 122, 234, 0.65)');
    plasmaGrad.addColorStop(0.5, 'rgba(111, 76, 186, 0.8)');
    plasmaGrad.addColorStop(0.8, 'rgba(159, 122, 234, 0.65)');
    plasmaGrad.addColorStop(1, 'rgba(129, 230, 217, 0.15)');

    ctx.fillStyle = plasmaGrad;
    ctx.fillRect(80, plasmaTop, 440, plasmaBottom - plasmaTop);
    ctx.font = 'bold 13px ""Google Sans","Gowun Batang",serif",""Google Sans","Gowun Batang",serif",serif';
    ctx.fillStyle = '#E2E8F0';
    ctx.fillText("PLASMA BULK (HIGH DENSITY)", 300, (plasmaTop + plasmaBottom) / 2);

    // Draw Dark Sheaths
    ctx.fillStyle = 'rgba(45, 55, 72, 0.45)';
    ctx.fillRect(80, 70, 440, sheathH); // top sheath
    ctx.fillRect(80, plasmaBottom, 440, sheathH); // bottom sheath

    ctx.fillStyle = '#A0AEC0';
    ctx.font = 'italic 10px ""Google Sans","Gowun Batang",serif",""Google Sans","Gowun Batang",serif",serif';
    ctx.fillText(`Top Sheath (${Math.round(sheathH)}nm)`, 300, 70 + sheathH/2 + 3);
    ctx.fillText(`Bottom Space-Charge Sheath (${Math.round(sheathH)}nm)`, 300, plasmaBottom + sheathH/2 + 3);

    // Draw electric field vectors in the bottom sheath (Gauss's law accelerator)
    ctx.strokeStyle = '#FEEBC8';
    ctx.lineWidth = 1.5;
    ctx.fillStyle = '#FEEBC8';
    for (let x = 130; x < 480; x += 40) {
      ctx.beginPath();
      ctx.moveTo(x, plasmaBottom);
      ctx.lineTo(x, 240);
      ctx.stroke();
      // Arrow
      ctx.beginPath();
      ctx.moveTo(x, 240);
      ctx.lineTo(x - 3, 234);
      ctx.lineTo(x + 3, 234);
      ctx.closePath();
      ctx.fill();
    }

function initMagSimulation() {

function updateMagSimulation() {
  if (!magCanvas || !magCtx) return;
  const ctx = magCtx;
  const w = magCanvas.width;
  const h = magCanvas.height;
  ctx.clearRect(0, 0, w, h);

  const angleSlider = document.getElementById('mag-angle-slider');
  const strengthSlider = document.getElementById('mag-strength-slider');
  const confSlider = document.getElementById('mag-conf-slider');

  const angleValText = document.getElementById('mag-angle-val');
  const strengthValText = document.getElementById('mag-strength-val');
  const confValText = document.getElementById('mag-conf-val');

  const angleDeg = angleSlider ? parseInt(angleSlider.value) : 45;
  const bStrength = strengthSlider ? parseInt(strengthSlider.value) : 5;
  const confLevel = confSlider ? parseInt(confSlider.value) : 3;

  if (angleValText) angleValText.innerText = angleDeg + '°';
  if (strengthValText) strengthValText.innerText = bStrength + ' T';
  if (confValText) confValText.innerText = 'Level ' + confLevel;

  const rad = (angleDeg * Math.PI) / 180;

  if (magTab === 'classic') {
    // ── Classic Gauss Law for Magnetism dynamic demo ──
    const cx = 220;
    const cy = 170;
    const r = 90;

    // Draw magnetic field lines passing completely through S
    ctx.strokeStyle = 'rgba(43, 108, 176, 0.55)';
    ctx.lineWidth = 1 + bStrength * 0.15;
    
    const numLines = 14;
    const lineSpacing = 32;
    const dx = Math.cos(rad);
    const dy = Math.sin(rad);

    for (let i = -numLines/2; i <= numLines/2; i++) {
      const perpX = -dy * i * lineSpacing;
      const perpY = dx * i * lineSpacing;
      
      const length = 520;
      const sx = cx + perpX - dx * length / 2;
      const sy = cy + perpY - dy * length / 2;
      const ex = cx + perpX + dx * length / 2;
      const ey = cy + perpY + dy * length / 2;

      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(ex, ey);
      ctx.stroke();

      // Draw arrowheads dynamically along lines
      const mx = cx + perpX;
      const my = cy + perpY;
      ctx.fillStyle = '#2B6CB0';
      ctx.beginPath();
      ctx.moveTo(mx, my);
      ctx.lineTo(mx - 8 * Math.cos(rad - 0.35), my - 8 * Math.sin(rad - 0.35));
      ctx.lineTo(mx - 8 * Math.cos(rad + 0.35), my - 8 * Math.sin(rad + 0.35));
      ctx.closePath();
      ctx.fill();
    }

    // Draw the closed irregular Gaussian surface S
    ctx.beginPath();
    ctx.moveTo(cx - 70, cy + 10);
    ctx.bezierCurveTo(cx - 70, cy - 50, cx - 10, cy - 40, cx + 20, cy - 50);
    ctx.bezierCurveTo(cx + 80, cy - 60, cx + 110, cy - 40, cx + 110, cy + 10);
    ctx.bezierCurveTo(cx + 110, cy + 50, cx + 50, cy + 30, cx + 10, cy + 50);
    ctx.bezierCurveTo(cx - 30, cy + 60, cx - 70, cy + 50, cx - 70, cy + 10);
    ctx.closePath();

    ctx.fillStyle = 'rgba(129, 230, 217, 0.4)';
    ctx.fill();
    ctx.strokeStyle = '#0F8C50';
    ctx.lineWidth = 2.2;
    ctx.stroke();

    // S surface tag
    ctx.font = 'bold 15px ""Google Sans","Gowun Batang",serif",""Google Sans","Gowun Batang",serif",serif';
    ctx.fillStyle = '#0F8C50';
    ctx.fillText("S", cx + 80, cy + 40);

    // Draw custom patch ΔS
    const px = cx + 10;
    const py = cy - 43;

    ctx.fillStyle = '#48BB78';
    ctx.strokeStyle = '#2D3748';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(px - 10, py - 3);
    ctx.lineTo(px + 10, py - 4);
    ctx.lineTo(px + 8, py + 4);
    ctx.lineTo(px - 12, py + 5);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.font = 'bold 11px ""JetBrains Mono","Gowun Batang",monospace",""Google Sans","Gowun Batang",serif",monospace';
    ctx.fillStyle = '#2D2D2D';
    ctx.fillText("ΔS", px - 8, py + 16);

    // Normal vector n-hat at patch
    const ny = -35;
    ctx.strokeStyle = '#2D2D2D';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(px, py + ny);
    ctx.stroke();

    ctx.fillStyle = '#2D2D2D';
    ctx.beginPath();
    ctx.moveTo(px, py + ny);
    ctx.lineTo(px - 4, py + ny + 6);
    ctx.lineTo(px + 4, py + ny + 6);
    ctx.closePath();
    ctx.fill();
    ctx.fillText("n̂", px + 8, py + ny + 8);

    // Angle theta indicators
    ctx.strokeStyle = '#E53E3E';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(px, py, 18, -Math.PI / 2, rad);
    ctx.stroke();
    ctx.fillStyle = '#E53E3E';
    ctx.fillText("θ", px + 12, py - 18);

    // Formula indicator update
    const formulaDiv = document.getElementById('mag-formula-dynamic');
    if (formulaDiv) {
      formulaDiv.innerHTML = `${UI[lang].mag.formulaPrefix}$$\\oint_S \\mathbf{B} \\cdot d\\mathbf{A} = \\iint_{\\text{in}} \\mathbf{B} \\cdot d\\mathbf{A} + \\iint_{\\text{out}} \\mathbf{B} \\cdot d\\mathbf{A} = -\\Phi_{\\text{in}} + \\Phi_{\\text{out}} = 0 \\text{ Wb}$$`;
      if (window.MathJax && window.MathJax.typesetPromise) {
        MathJax.typesetPromise([formulaDiv]);
      }
    }

    // Right-side dynamic details panel
    const rx = cx + 200;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#2D2D2D';
    ctx.font = 'bold 15px ""Google Sans","Gowun Batang",serif",""Google Sans","Gowun Batang",serif",serif';
    ctx.fillText("Φ_B = ∮ B · dS = 0", rx, 90);
    ctx.font = 'bold 11px ""JetBrains Mono","Gowun Batang",monospace",""Google Sans","Gowun Batang",serif",monospace';
    ctx.fillStyle = '#4A5568';
    ctx.fillText("No Magnetic Monopoles Found", rx, 115);

    ctx.font = lang === 'en' ? '12px ""Google Sans","Gowun Batang",serif",""Google Sans","Gowun Batang",serif",serif' : '12px ""Google Sans","Gowun Batang",serif",""Google Sans","Gowun Batang",serif",serif';
    ctx.fillStyle = '#2D2D2D';
    ctx.fillText("Φ_B : Magnetic flux (Wb)", rx, 160);
    ctx.fillText("B   : Magnetic field (Tesla)", rx, 185);
    ctx.fillText("dS  : Area vector patch (normal n̂)", rx, 210);
    ctx.fillText("θ   : Angle between B and n̂", rx, 235);
    ctx.font = lang === 'en' ? 'bold 11px ""Google Sans","Gowun Batang",serif",""Google Sans","Gowun Batang",serif",serif' : 'bold 11px ""Google Sans","Gowun Batang",serif",""Google Sans","Gowun Batang",serif",serif';
    ctx.fillStyle = '#0F8C50';
    ctx.fillText(UI[lang].mag.fluxNote, rx, 270);
  } else {
    // ── Confinement (Magnetron sputtering) simulation ──
    ctx.fillStyle = '#1A202C';
    ctx.fillRect(40, 40, 520, 260);

    // Back-plate
    ctx.fillStyle = '#718096';
    ctx.fillRect(80, 240, 440, 20);

    // Targets: Center N, Sides S
    ctx.fillStyle = '#E53E3E'; // N-magnet
    ctx.fillRect(270, 250, 60, 10);
    ctx.fillStyle = '#FFF';
    ctx.font = 'bold 9px ""Google Sans","Gowun Batang",serif",""Google Sans","Gowun Batang",serif",serif';
    ctx.textAlign = 'center';
    ctx.fillText("N", 300, 258);

    ctx.fillStyle = '#2B6CB0'; // S-magnets
    ctx.fillRect(150, 250, 50, 10);
    ctx.fillRect(400, 250, 50, 10);
    ctx.fillStyle = '#FFF';
    ctx.fillText("S", 175, 258);
    ctx.fillText("S", 425, 258);

    // Sputtering target on top of backing plate
    ctx.fillStyle = '#A0AEC0';
    ctx.fillRect(100, 235, 400, 5);

    // Curved Magnetic Field Loops (B-field lines)
    ctx.strokeStyle = 'rgba(72, 187, 120, 0.75)';
    ctx.lineWidth = 1.8;
    ctx.setLineDash([4, 3]);

    // Left arch
    ctx.beginPath();
    ctx.arc(237.5, 250, 62.5, Math.PI, 2 * Math.PI, true);
    ctx.stroke();

    // Right arch
    ctx.beginPath();
    ctx.arc(362.5, 250, 62.5, Math.PI, 2 * Math.PI, true);
    ctx.stroke();

    ctx.setLineDash([]);

    // Glow representation
    const glowAlpha = 0.15 + confLevel * 0.12;
    const plasmaGlowL = ctx.createRadialGradient(237.5, 210, 5, 237.5, 210, 60);
    plasmaGlowL.addColorStop(0, `rgba(159, 122, 234, ${glowAlpha})`);
    plasmaGlowL.addColorStop(1, 'rgba(159, 122, 234, 0)');
    ctx.fillStyle = plasmaGlowL;
    ctx.beginPath();
    ctx.arc(237.5, 210, 65, 0, 2 * Math.PI);
    ctx.fill();

    const plasmaGlowR = ctx.createRadialGradient(362.5, 210, 5, 362.5, 210, 60);
    plasmaGlowR.addColorStop(0, `rgba(159, 122, 234, ${glowAlpha})`);
    plasmaGlowR.addColorStop(1, 'rgba(159, 122, 234, 0)');
    ctx.fillStyle = plasmaGlowR;
    ctx.beginPath();
    ctx.arc(362.5, 210, 65, 0, 2 * Math.PI);
    ctx.fill();

    // Circulating trapped electrons
    ctx.fillStyle = '#FBBF24';
    const numElectrons = confLevel * 6;
    const time = Date.now() * 0.003;
    for (let i = 0; i < numElectrons; i++) {
      const angleL = Math.PI + (i / numElectrons) * Math.PI + (time % Math.PI);
      const exL = 237.5 + 62.5 * Math.cos(angleL);
      const eyL = 250 + 62.5 * Math.sin(angleL);
      ctx.beginPath();
      ctx.arc(exL, eyL, 3, 0, 2 * Math.PI);
      ctx.fill();

      const angleR = Math.PI + (i / numElectrons) * Math.PI - (time % Math.PI);
      const exR = 362.5 + 62.5 * Math.cos(angleR);
      const eyR = 250 + 62.5 * Math.sin(angleR);
      ctx.beginPath();
      ctx.arc(exR, eyR, 3, 0, 2 * Math.PI);
      ctx.fill();
    }

    ctx.fillStyle = '#FFF';
    ctx.font = lang === 'en' ? 'bold 11px ""Google Sans","Gowun Batang",serif",""Google Sans","Gowun Batang",serif",serif' : 'bold 11px ""Google Sans","Gowun Batang",serif",""Google Sans","Gowun Batang",serif",serif';
    ctx.textAlign = 'center';
    ctx.fillText(UI[lang].mag.confCanvasText, 300, 285);
  }
}

function updateFaradaySimulation() {
  if (!faradayCanvas || !faradayCtx) return;

  const ctx = faradayCtx;
  const w = faradayCanvas.width;

  ctx.clearRect(0, 0, w, h);

  // ── Mode B: Semiconductor ICP Reactor Chamber simulation ──

  if (fSlider && document.getElementById('icp-freq-val')) {
    document.getElementById('icp-freq-val').innerText = fValue + '.56 MHz';
  }

  const acTime = Date.now() * 0.002 * fValue;
  const currentPhase = Math.sin(acTime);

  const vText = document.getElementById('faraday-voltage-indicator');
  if (vText && faradayTab === 'icp') {
    vText.innerText = `${UI[lang].ampere.phasePrefix}${currentPhase.toFixed(2)}`;
  }

  // Draw ICP Chamber outline
  ctx.fillStyle = '#1A202C';

  ctx.fillRect(100, 60, 400, 10);
  ctx.fillStyle = '#A0AEC0';

  ctx.textAlign = 'center';
  ctx.fillText("DILECTRIC QUARTZ WINDOW", 300, 55);

  ctx.fillStyle = '#DD6B20';
  ctx.beginPath();
  ctx.arc(160, 50, 8, 0, 2*Math.PI);
  ctx.arc(230, 50, 8, 0, 2*Math.PI);
  ctx.arc(370, 50, 8, 0, 2*Math.PI);
  ctx.arc(440, 50, 8, 0, 2*Math.PI);
  ctx.fill();

  ctx.fillStyle = '#FFF';
  ctx.font = 'bold 9px ""Google Sans","Gowun Batang",serif",""Google Sans","Gowun Batang",serif",serif';
  const signA = currentPhase >= 0 ? '+' : '-';
  const signB = currentPhase >= 0 ? '-' : '+';
  ctx.fillText(signA, 160, 53);
  ctx.fillText(signB, 230, 53);
  ctx.fillText(signA, 370, 53);
  ctx.fillText(signB, 440, 53);

  ctx.strokeStyle = 'rgba(72, 187, 120, 0.7)';
  ctx.lineWidth = 2 * Math.abs(currentPhase);
  ctx.setLineDash([4, 2]);

  ctx.beginPath();
  ctx.ellipse(195, 110, 25, 45, 0, 0, 2*Math.PI);
  ctx.stroke();

  ctx.beginPath();
  ctx.ellipse(405, 110, 25, 45, 0, 0, 2*Math.PI);
  ctx.stroke();

  ctx.setLineDash([]);

  const ionDensityFactor = Math.abs(currentPhase);
  const plasmaGlow = ctx.createRadialGradient(300, 160, 10, 300, 160, 120);

  plasmaGlow.addColorStop(0.6, `rgba(107, 70, 193, ${0.3 + ionDensityFactor * 0.2})`);
  plasmaGlow.addColorStop(1, 'rgba(159, 122, 234, 0)');

  ctx.fillStyle = plasmaGlow;
  ctx.beginPath();
  ctx.arc(300, 160, 120, 0, 2*Math.PI);
  ctx.fill();

  ctx.strokeStyle = '#E53E3E';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.ellipse(300, 140, 110, 25, 0, 0, 2*Math.PI);
  ctx.stroke();

  ctx.fillStyle = '#E53E3E';
  const arrowPhaseX = 300 + 110 * Math.cos(acTime);
  const arrowPhaseY = 140 + 25 * Math.sin(acTime);
  ctx.beginPath();
  ctx.arc(arrowPhaseX, arrowPhaseY, 6, 0, 2*Math.PI);
  ctx.fill();

  ctx.font = lang === 'en' ? 'bold 11px ""Google Sans","Gowun Batang",serif",""Google Sans","Gowun Batang",serif",serif' : 'bold 11px ""Google Sans","Gowun Batang",serif",""Google Sans","Gowun Batang",serif",serif';
  ctx.fillStyle = '#FFF';
  ctx.fillText(UI[lang].faraday.eIndCanvasText, 300, 135);

  ctx.fillStyle = '#4A5568';
  ctx.fillRect(140, 250, 320, 20);
  ctx.fillStyle = '#1A365D';
  ctx.fillRect(170, 244, 260, 6);
  ctx.font = 'bold 9px ""Google Sans","Gowun Batang",serif",""Google Sans","Gowun Batang",serif",serif';
  ctx.fillStyle = '#E2E8F0';

function updateAmpereSimulation() {
  if (!ampereCanvas || !ampereCtx || ampereTab !== 'transition') return;
  const ctx = ampereCtx;
  const w = ampereCanvas.width;
  const h = ampereCanvas.height;
  ctx.clearRect(0, 0, w, h);

  const powerSlider = document.getElementById('icp-power-slider');
  const powerValText = document.getElementById('icp-power-val');
  const modeBadge = document.getElementById('icp-mode-badge');

  const pVal = powerSlider ? parseInt(powerSlider.value) : 60;
  if (powerValText) {
    powerValText.innerText = pVal + ' W';
  }

  const isHmode = pVal >= 150;
  if (modeBadge) {
    modeBadge.innerText = isHmode ? UI[lang].ampere.modeHmodeBadge : UI[lang].ampere.modeEmodeBadge;
    modeBadge.style.background = isHmode ? "#FFF5F5" : "#EBF8FF";
    modeBadge.style.color = isHmode ? "#9B2C2C" : "#2B6CB0";
  }

  // Draw ICP chamber layout
  ctx.fillStyle = '#1A202C';
  ctx.fillRect(20, 20, 320, 240);

  // Top quartz window & RF coil
  ctx.fillStyle = '#E2E8F0';
  ctx.fillRect(50, 40, 260, 8);
  ctx.fillStyle = '#DD6B20';
  ctx.beginPath();
  ctx.arc(80, 32, 6, 0, 2*Math.PI);
  ctx.arc(130, 32, 6, 0, 2*Math.PI);
  ctx.arc(230, 32, 6, 0, 2*Math.PI);
  ctx.arc(280, 32, 6, 0, 2*Math.PI);
  ctx.fill();

  // Glow render
  if (pVal > 0) {
    const plasmaY = 130;
    const ionDensity = isHmode ? (pVal / 500) : (pVal / 300);
    const plasmaGlow = ctx.createRadialGradient(180, plasmaY, 10, 180, plasmaY, isHmode ? 110 : 60);
    plasmaGlow.addColorStop(0, isHmode ? `rgba(159, 122, 234, ${0.4 + ionDensity * 0.5})` : `rgba(226, 190, 255, ${0.15 + ionDensity * 0.25})`);
    plasmaGlow.addColorStop(0.6, isHmode ? `rgba(107, 70, 193, ${0.25 + ionDensity * 0.3})` : `rgba(226, 190, 255, 0.05)`);
    plasmaGlow.addColorStop(1, 'rgba(159, 122, 234, 0)');
    ctx.fillStyle = plasmaGlow;
    ctx.beginPath();
    ctx.arc(180, plasmaY, isHmode ? 110 : 60, 0, 2*Math.PI);
    ctx.fill();

    // Capacitive E-fields (vertical, dim) in E-mode
    if (!isHmode) {
      ctx.strokeStyle = 'rgba(144, 205, 244, 0.45)';
      ctx.lineWidth = 1;
      for (let x = 70; x < 300; x += 30) {
        ctx.beginPath();
        ctx.moveTo(x, 48);
        ctx.lineTo(x, 100);
        ctx.stroke();
      }
      ctx.fillStyle = '#90CDF4';
      ctx.font = 'bold 8px ""Google Sans","Gowun Batang",serif",""Google Sans","Gowun Batang",serif",serif';
      ctx.fillText("Capacitive E-Field (Dim Glow)", 180, 80);
    } else {
      // Inductive H-mode magnetic loop and toroidal currents
      ctx.strokeStyle = 'rgba(72, 187, 120, 0.65)';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(100, 50, 160, 110);
      ctx.fillStyle = '#48BB78';
      ctx.font = 'bold 8px ""Google Sans","Gowun Batang",serif",""Google Sans","Gowun Batang",serif",serif';
      ctx.fillText("Induced Magnetic Loops (H-field)", 180, 65);

      // Sizzling bright center
      ctx.fillStyle = '#E53E3E';
      ctx.beginPath();
      ctx.ellipse(180, 120, 70, 15, 0, 0, 2*Math.PI);
      ctx.stroke();
      ctx.fillText("HIGH DENSITY INDUCTIVE RING", 180, 115);
    }
  }

  ctx.fillStyle = '#FFF';
  ctx.font = lang === 'en' ? 'bold 10px ""Google Sans","Gowun Batang",serif",""Google Sans","Gowun Batang",serif",serif' : 'bold 10px ""Google Sans","Gowun Batang",serif",""Google Sans","Gowun Batang",serif",serif';
  ctx.textAlign = 'center';
  ctx.fillText(UI[lang].ampere.icpStatusCanvasText, 180, 250);

  // Draw Hysteresis curve plot on the right
  const px = 370, py = 50;
  const pw = 200, ph = 210;
  
  // Grid background
  ctx.fillStyle = '#F7F8FA';
  ctx.fillRect(px, py, pw, ph);
  ctx.strokeStyle = '#E5E7EB';
  ctx.lineWidth = 1;
  for (let gy = py; gy <= py + ph; gy += 30) {
    ctx.beginPath();
    ctx.moveTo(px, gy);
    ctx.lineTo(px + pw, gy);
    ctx.stroke();
  }
  for (let gx = px; gx <= px + pw; gx += 40) {
    ctx.beginPath();
    ctx.moveTo(gx, py);
    ctx.lineTo(gx, py + ph);
    ctx.stroke();
  }

  // Draw Hysteresis trace
  ctx.strokeStyle = '#A0AEC0';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(px, py + ph - 20);
  ctx.lineTo(px + 60, py + ph - 30);
  ctx.lineTo(px + 60, py + 50);
  ctx.lineTo(px + pw, py + 20);
  ctx.stroke();

  // Draw current operating point dot
  const dotX = px + (pVal / 500) * pw;
  let dotY = py + ph - 20;
  if (isHmode) {
    dotY = py + 50 - ((pVal - 150) / 350) * 30;
  } else {
    dotY = py + ph - 20 - (pVal / 150) * 10;
  }

  ctx.fillStyle = isHmode ? '#E53E3E' : '#2B6CB0';
  ctx.beginPath();
  ctx.arc(dotX, dotY, 6, 0, 2*Math.PI);
  ctx.fill();

  // Axis arrows and labels
  ctx.strokeStyle = '#2D2D2D';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(px, py + ph);
  ctx.lineTo(px + pw + 5, py + ph);
  ctx.moveTo(px, py + ph);
  ctx.lineTo(px, py - 5);
  ctx.stroke();

  ctx.fillStyle = '#2D2D2D';
  ctx.font = 'bold 8px ""Google Sans","Gowun Batang",serif",""Google Sans","Gowun Batang",serif",serif';
  ctx.fillText("RF Power (W)", px + pw - 20, py + ph + 12);
  
  ctx.save();
  ctx.translate(px - 10, py + 80);
  ctx.rotate(-Math.PI/2);
  ctx.fillText("Plasma Density (n_e)", 0, 0);
  ctx.restore();

  ctx.font = lang === 'en' ? 'bold 9px ""Google Sans","Gowun Batang",serif",""Google Sans","Gowun Batang",serif",serif' : 'bold 9px ""Google Sans","Gowun Batang",serif",""Google Sans","Gowun Batang",serif",serif';
  ctx.fillText(UI[lang].ampere.hysteresisCurveText, px + pw/2, py - 10);
}

<script id="af-kit-js">
/* ============ Benedu animated-figure kit (ported from Basic Course ch02–05) ============
   A figure is <div class="af" data-af="NAME"></div>. AF.B[NAME](box) fills the box and
   returns {draw(dt)}; one shared rAF loop draws figures that are on screen and drops
   figures whose box has left the DOM (the lecture re-renders the panel on every
   chapter / language change, so figures are rebuilt in the new language).            */
(function(){
  'use strict';
  var AF = window.AF = {B:{}, figs:[]};
  AF.ko = function(){ try { return lang === 'ko'; } catch(e){ return document.documentElement.lang === 'ko'; } };
  AF.L = function(en, ko){ return AF.ko() ? ko : en; };
  AF.cv = function(w, h, cls){
    var c = document.createElement('canvas'); c.width = w*2; c.height = h*2;
    if(cls) c.className = cls; c.style.aspectRatio = w + ' / ' + h; return c;
  };
  AF.chips = function(btns, fn){
    btns.forEach(function(b){ b.addEventListener('click', function(ev){ ev.stopPropagation();
      btns.forEach(function(x){ x.classList.toggle('on', x === b); }); fn(b); }); });
  };
  AF.q = function(box, sel){ return box.querySelector(sel); };
  AF.qa = function(box, sel){ return [].slice.call(box.querySelectorAll(sel)); };
  function vis(el){ var r = el.getBoundingClientRect(); return r.width > 0 && r.bottom > -40 && r.top < innerHeight + 40; }
  var last = performance.now();
  function loop(now){
    var dt = Math.min((now - last)/1000, 0.05); last = now;
    for(var i = AF.figs.length - 1; i >= 0; i--){
      var f = AF.figs[i];
      if(!f.el.isConnected){ AF.figs.splice(i, 1); continue; }
      if(vis(f.el)){ try { f.draw(dt); } catch(err){ console.error('[AF]', err); AF.figs.splice(i, 1); } }
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  AF.mount = function(root){
    [].forEach.call((root || document).querySelectorAll('[data-af]'), function(box){
      if(box._af) return; box._af = 1;
      var b = AF.B[box.dataset.af]; if(!b) return;
      var r = b(box); if(r && r.draw) AF.figs.push({el: box, draw: r.draw});
    });
  };
  var pending = false;
  var mo = new MutationObserver(function(){
    if(pending) return; pending = true;
    Promise.resolve().then(function(){ pending = false; AF.mount(document); });
  });
  function start(){ mo.observe(document.body, {childList: true, subtree: true}); AF.mount(document); }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

AF.MXSRC = {"mxGE":"<div class=\"sto-k\"><span class=\"t-en\">EQUATION 1 · GAUSS’S LAW</span><span class=\"t-ko\">방정식 1 · 가우스 법칙</span></div><div class=\"sto-hd\"><div><h3><span class=\"t-en\">Charges make electric fields</span><span class=\"t-ko\">전하가 전기장을 만든다</span></h3><div class=\"ld\"><span class=\"t-en\">Electric field lines start on + charges and end on − charges. Count the lines leaving any closed surface and you know the charge inside.</span><span class=\"t-ko\">전기력선은 + 전하에서 시작해 − 전하에서 끝납니다. 어떤 닫힌 곡면을 빠져나가는 전기력선을 세면 그 안의 전하를 알 수 있습니다.</span></div></div></div><div class=\"mxs-top\"><div class=\"mxs-forms\"><div class=\"mxs-f\"><div class=\"t\"><span class=\"t-en\">Differential form · at a point</span><span class=\"t-ko\">미분형 · 한 점에서</span></div><div class=\"e\">∇·E = ρ / ε₀</div><p><span class=\"t-en\">∇· (divergence): how much the field spreads out of a point. ρ: charge density. ε₀ = 8.85×10⁻¹² F/m.</span><span class=\"t-ko\">∇·(발산): 한 점에서 장이 퍼져 나가는 정도. ρ: 전하밀도. ε₀ = 8.85×10⁻¹² F/m (진공의 유전율).</span></p></div><div class=\"mxs-f\"><div class=\"t\"><span class=\"t-en\">Integral form · over a closed surface</span><span class=\"t-ko\">적분형 · 닫힌 곡면 전체</span></div><div class=\"e\">∮ E·dA = Q<sub>in</sub> / ε₀</div><p><span class=\"t-en\">∮…dA: add up the field crossing the whole closed surface (the electric flux). Q<sub>in</sub>: total charge inside.</span><span class=\"t-ko\">∮…dA: 닫힌 곡면 전체를 지나는 전기장을 모두 더한 값(전기 선속). Q<sub>in</sub>: 곡면 안의 전체 전하.</span></p></div></div><div class=\"mxs-vis\"><canvas class=\"mxs-cv\" data-mx=\"gE\" data-q=\"1\" width=\"760\" height=\"560\"></canvas><div class=\"mxs-gq\"><button class=\"chip-btn on\" data-gq=\"1\"><span class=\"t-en\">+ charge · ∇·E &gt; 0</span><span class=\"t-ko\">양전하 · ∇·E &gt; 0</span></button><button class=\"chip-btn\" data-gq=\"-1\"><span class=\"t-en\">− charge · ∇·E &lt; 0</span><span class=\"t-ko\">음전하 · ∇·E &lt; 0</span></button><button class=\"chip-btn\" data-gq=\"0\"><span class=\"t-en\">Neutral · ∇·E = 0</span><span class=\"t-ko\">중성 · ∇·E = 0</span></button></div></div></div><div class=\"sto-cols\"><div class=\"sto-it\"><div class=\"t\">READ IT</div><h4><span class=\"t-en\">Sources and sinks</span><span class=\"t-ko\">샘과 구멍</span></h4><p><span class=\"t-en\">A + charge is a source: lines pour out. A − charge is a sink: lines pour in. Empty space with no charge lets as many lines in as out.</span><span class=\"t-ko\">+ 전하는 샘처럼 전기력선이 솟아나고, − 전하는 구멍처럼 빨려 들어갑니다. 전하가 없는 빈 공간에서는 들어온 만큼 나갑니다.</span></p></div><div class=\"sto-it\"><div class=\"t\">HISTORY</div><h4><span class=\"t-en\">Gauss, around 1835</span><span class=\"t-ko\">가우스, 1835년경</span></h4><p><span class=\"t-en\">Carl Friedrich Gauss worked it out around 1835 (published in 1867, after his death). It says the same thing as Coulomb’s law, but works for any shape.</span><span class=\"t-ko\">카를 프리드리히 가우스가 1835년경 정리했고, 그의 사후인 1867년에 출판되었습니다. 쿨롱의 법칙과 같은 내용이지만 어떤 모양에도 쓸 수 있습니다.</span></p></div><div class=\"sto-it\"><div class=\"t\">SAME AS</div><h4><span class=\"t-en\">Coulomb, from another angle</span><span class=\"t-ko\">쿨롱 법칙의 다른 얼굴</span></h4><p><span class=\"t-en\">Put a sphere around a point charge: E × 4πr² = Q/ε₀, so E = Q/4πε₀r² = kQ/r². That is Coulomb’s law again.</span><span class=\"t-ko\">점전하를 구로 감싸면 E × 4πr² = Q/ε₀, 즉 E = Q/4πε₀r² = kQ/r²입니다. 쿨롱의 법칙과 같은 결과입니다.</span></p></div></div><div class=\"sto-link\"><span class=\"t-en\"><b>In the tool.</b> The uniform field between CCP electrodes and the strong field in the plasma sheath both come from this equation. It also explains why a plasma stays neutral: any extra charge immediately makes a field that pulls opposite charges in.</span><span class=\"t-ko\"><b>장비에서는.</b> CCP 전극 사이의 균일한 전기장과 플라즈마 쉬스(sheath)의 강한 전기장이 모두 이 식에서 나옵니다. 플라즈마가 중성을 유지하는 이유도 설명합니다. 남는 전하가 생기면 곧바로 전기장이 생겨 반대 전하를 끌어오기 때문입니다.</span></div><details class=\"mxs-q\"><summary><span class=\"t-en\">Check yourself · </span><span class=\"t-ko\">확인 문제 · </span><span class=\"t-en\">A closed box holds +2 nC and −2 nC. How much electric flux leaves the box?</span><span class=\"t-ko\">닫힌 상자 안에 +2 nC와 −2 nC가 있습니다. 상자를 빠져나가는 전기 선속은?</span></summary><p><span class=\"t-en\">Zero. The total charge inside is 0, so as many lines enter as leave.</span><span class=\"t-ko\">0입니다. 안의 전하 합이 0이므로 나가는 전기력선과 들어오는 전기력선이 같습니다.</span></p></details>","mxGB":"<div class=\"sto-k\"><span class=\"t-en\">EQUATION 2 · GAUSS’S LAW FOR MAGNETISM</span><span class=\"t-ko\">방정식 2 · 자기에 대한 가우스 법칙</span></div><div class=\"sto-hd\"><div><h3><span class=\"t-en\">There are no magnetic charges</span><span class=\"t-ko\">자기 홀극은 없다</span></h3><div class=\"ld\"><span class=\"t-en\">Magnetic field lines have no beginning and no end. They always close on themselves, so whatever goes out of a closed surface comes back in.</span><span class=\"t-ko\">자기력선은 시작도 끝도 없이 항상 닫힌 고리를 이룹니다. 그래서 닫힌 곡면에서 나간 만큼 반드시 다시 들어옵니다.</span></div></div></div><div class=\"mxs-top\"><div class=\"mxs-forms\"><div class=\"mxs-f\"><div class=\"t\"><span class=\"t-en\">Differential form · at a point</span><span class=\"t-ko\">미분형 · 한 점에서</span></div><div class=\"e\">∇·B = 0</div><p><span class=\"t-en\">The magnetic field never spreads out of, or into, any point.</span><span class=\"t-ko\">자기장은 어느 점에서도 퍼져 나가거나 모여들지 않습니다.</span></p></div><div class=\"mxs-f\"><div class=\"t\"><span class=\"t-en\">Integral form · over a closed surface</span><span class=\"t-ko\">적분형 · 닫힌 곡면 전체</span></div><div class=\"e\">∮ B·dA = 0</div><p><span class=\"t-en\">The net magnetic flux through any closed surface is zero.</span><span class=\"t-ko\">어떤 닫힌 곡면을 지나는 자기 선속의 합은 언제나 0입니다.</span></p></div></div><div class=\"mxs-vis\"><canvas class=\"mxs-cv\" data-mx=\"gB\" data-q=\"1\" width=\"760\" height=\"560\"></canvas></div></div><div class=\"sto-cols\"><div class=\"sto-it\"><div class=\"t\">READ IT</div><h4><span class=\"t-en\">No lonely N pole</span><span class=\"t-ko\">N극 혼자는 없다</span></h4><p><span class=\"t-en\">Compare with equation 1: there is no “magnetic charge” on the right side. A north pole always comes with a south pole.</span><span class=\"t-ko\">1번 식과 비교해 보세요. 오른쪽에 \"자기 전하\"가 없습니다. N극은 항상 S극과 함께 나타납니다.</span></p></div><div class=\"sto-it\"><div class=\"t\">HISTORY</div><h4><span class=\"t-en\">Still searching</span><span class=\"t-ko\">아직도 찾는 중</span></h4><p><span class=\"t-en\">In 1931 Paul Dirac showed that a magnetic monopole would be allowed by quantum theory. Physicists have searched ever since, in cosmic rays and colliders. None has been found.</span><span class=\"t-ko\">1931년 폴 디랙은 양자역학이 자기 홀극의 존재를 허용한다는 것을 보였습니다. 이후 우주선과 가속기에서 찾고 있지만 아직 발견되지 않았습니다.</span></p></div><div class=\"sto-it\"><div class=\"t\">TRY IT</div><h4><span class=\"t-en\">Cut a magnet in half</span><span class=\"t-ko\">자석을 반으로 자르면</span></h4><p><span class=\"t-en\">You do not get a separate N and S. You get two smaller magnets, each with its own N and S. Cut again and again: always pairs.</span><span class=\"t-ko\">N극과 S극이 따로 나뉘지 않습니다. N과 S를 가진 작은 자석 두 개가 됩니다. 계속 잘라도 항상 짝으로 나옵니다.</span></p></div></div><div class=\"sto-link\"><span class=\"t-en\"><b>In the tool.</b> When engineers design the magnets of a magnetron sputtering (PVD) source, they rely on this rule: every field line that leaves an N pole must return to an S pole. So they arrange the magnets to make closed arches over the target, which marks out the region where electrons will be held. The force that actually traps the electrons is the Lorentz force; this equation only fixes the shape of the field.</span><span class=\"t-ko\"><b>장비에서는.</b> 마그네트론 스퍼터링(PVD) 소스의 자석을 설계할 때 이 원리를 전제로 합니다. 자기력선은 반드시 닫힌 고리가 되므로, N극에서 나간 선이 S극으로 돌아오는 아치 모양을 타깃 위에 만들어 전자를 가둘 영역을 정합니다. 실제로 전자를 가두는 힘은 로런츠 힘이고, 이 식은 자기장의 모양을 정해 줄 뿐입니다.</span></div><details class=\"mxs-q\"><summary><span class=\"t-en\">Check yourself · </span><span class=\"t-ko\">확인 문제 · </span><span class=\"t-en\">You cut a bar magnet exactly in half. What do you get?</span><span class=\"t-ko\">막대자석을 정확히 반으로 자르면 무엇이 될까요?</span></summary><p><span class=\"t-en\">Two smaller magnets, each with an N pole and an S pole. A lone pole would break ∇·B = 0.</span><span class=\"t-ko\">N극과 S극을 모두 가진 작은 자석 두 개가 됩니다. 극이 하나만 있다면 ∇·B = 0이 깨집니다.</span></p></details>","mxFA":"<div class=\"sto-k\"><span class=\"t-en\">EQUATION 3 · FARADAY’S LAW</span><span class=\"t-ko\">방정식 3 · 패러데이 법칙</span></div><div class=\"sto-hd\"><div><h3><span class=\"t-en\">A changing B makes a circulating E</span><span class=\"t-ko\">변하는 자기장이 소용돌이치는 전기장을 만든다</span></h3><div class=\"ld\"><span class=\"t-en\">Wherever the magnetic field changes in time, an electric field appears that curls around the change. The minus sign means it always opposes the change (Lenz’s law).</span><span class=\"t-ko\">자기장이 시간에 따라 변하는 곳에는 그 변화를 휘감아 도는 전기장이 생깁니다. 마이너스 부호는 언제나 변화를 방해하는 방향이라는 뜻입니다(렌츠 법칙).</span></div></div></div><div class=\"mxs-top\"><div class=\"mxs-forms\"><div class=\"mxs-f\"><div class=\"t\"><span class=\"t-en\">Differential form · at a point</span><span class=\"t-ko\">미분형 · 한 점에서</span></div><div class=\"e\">∇×E = − ∂B/∂t</div><p><span class=\"t-en\">∇× (curl): how much the field circulates around a point. ∂B/∂t: how fast B changes in time.</span><span class=\"t-ko\">∇×(회전): 한 점 주위로 장이 소용돌이치는 정도. ∂B/∂t: B가 시간에 따라 변하는 빠르기.</span></p></div><div class=\"mxs-f\"><div class=\"t\"><span class=\"t-en\">Integral form · around a closed loop</span><span class=\"t-ko\">적분형 · 닫힌 경로 전체</span></div><div class=\"e\">∮ E·dl = − dΦ<sub>B</sub>/dt</div><p><span class=\"t-en\">∮…dl: add up E all the way around a loop. This is the induced voltage ε. Φ<sub>B</sub>: magnetic flux through the loop.</span><span class=\"t-ko\">∮…dl: 닫힌 경로를 한 바퀴 돌며 E를 더한 값. 이것이 유도 전압 ε입니다. Φ<sub>B</sub>: 경로를 지나는 자기 선속.</span></p></div></div><div class=\"mxs-vis\"><canvas class=\"mxs-cv\" data-mx=\"fa\" data-q=\"1\" width=\"760\" height=\"560\"></canvas></div></div><div class=\"sto-cols\"><div class=\"sto-it\"><div class=\"t\">READ IT</div><h4><span class=\"t-en\">Change, not size</span><span class=\"t-ko\">크기가 아니라 변화</span></h4><p><span class=\"t-en\">A huge but steady B makes no E at all. Only change counts, and faster change gives a stronger E.</span><span class=\"t-ko\">아무리 센 자기장이라도 변하지 않으면 전기장을 만들지 않습니다. 변화만이 중요하며, 빨리 변할수록 전기장이 셉니다.</span></p></div><div class=\"sto-it\"><div class=\"t\">HISTORY</div><h4><span class=\"t-en\">Faraday 1831, Lenz 1834</span><span class=\"t-ko\">패러데이 1831, 렌츠 1834</span></h4><p><span class=\"t-en\">Michael Faraday discovered induction in 1831. Heinrich Lenz added the rule for the direction in 1834, the minus sign in the equation.</span><span class=\"t-ko\">마이클 패러데이가 1831년 전자기 유도를 발견했고, 하인리히 렌츠가 1834년 방향 규칙을 더했습니다. 식의 마이너스 부호가 그것입니다.</span></p></div><div class=\"sto-it\"><div class=\"t\">EVERYWHERE</div><h4><span class=\"t-en\">Generators and transformers</span><span class=\"t-ko\">발전기와 변압기</span></h4><p><span class=\"t-en\">Every power station generator, every transformer, wireless chargers and induction cookers run on this equation.</span><span class=\"t-ko\">발전소의 발전기, 변압기, 무선 충전기, 인덕션 레인지가 모두 이 식으로 움직입니다.</span></p></div></div><div class=\"sto-link\"><span class=\"t-en\"><b>In the tool.</b> This is the heart of ICP. RF current in the antenna coil makes a B that changes 13.56 million times a second, and this equation turns it into a circulating E inside the gas that heats the electrons, with no electrode touching the plasma.</span><span class=\"t-ko\"><b>장비에서는.</b> ICP의 심장입니다. 안테나 코일의 RF 전류가 1초에 1,356만 번 변하는 자기장을 만들고, 이 식이 그것을 가스 속에서 소용돌이치는 전기장으로 바꿔 전자를 가열합니다. 전극이 플라즈마에 닿지 않아도 됩니다.</span></div><details class=\"mxs-q\"><summary><span class=\"t-en\">Check yourself · </span><span class=\"t-ko\">확인 문제 · </span><span class=\"t-en\">A magnet sits inside a coil and does not move. What voltage does the coil show?</span><span class=\"t-ko\">자석을 코일 안에 넣고 가만히 두면 코일의 전압은?</span></summary><p><span class=\"t-en\">Zero. The flux is large but not changing, so dΦ/dt = 0.</span><span class=\"t-ko\">0입니다. 선속은 크지만 변하지 않으므로 dΦ/dt = 0입니다.</span></p></details>","mxAM":"<div class=\"sto-k\"><span class=\"t-en\">EQUATION 4 · AMPÈRE–MAXWELL LAW</span><span class=\"t-ko\">방정식 4 · 암페어–맥스웰 법칙</span></div><div class=\"sto-hd\"><div><h3><span class=\"t-en\">Currents and changing E make a circulating B</span><span class=\"t-ko\">전류와 변하는 전기장이 소용돌이치는 자기장을 만든다</span></h3><div class=\"ld\"><span class=\"t-en\">A current makes a magnetic field that curls around it. Maxwell added a second source: an electric field that changes in time does the same thing, even in empty space.</span><span class=\"t-ko\">전류는 그 둘레를 휘감는 자기장을 만듭니다. 맥스웰은 여기에 두 번째 원인을 더했습니다. 시간에 따라 변하는 전기장도 빈 공간에서 똑같이 자기장을 만듭니다.</span></div></div></div><div class=\"mxs-top\"><div class=\"mxs-forms\"><div class=\"mxs-f\"><div class=\"t\"><span class=\"t-en\">Differential form · at a point</span><span class=\"t-ko\">미분형 · 한 점에서</span></div><div class=\"e\">∇×B = μ₀J + μ₀ε₀ ∂E/∂t</div><p><span class=\"t-en\">J: current density. μ₀ = 4π×10⁻⁷ T·m/A. ε₀∂E/∂t: Maxwell’s “displacement current”.</span><span class=\"t-ko\">J: 전류밀도. μ₀ = 4π×10⁻⁷ T·m/A. ε₀∂E/∂t: 맥스웰의 \"변위 전류\".</span></p></div><div class=\"mxs-f\"><div class=\"t\"><span class=\"t-en\">Integral form · around a closed loop</span><span class=\"t-ko\">적분형 · 닫힌 경로 전체</span></div><div class=\"e\">∮ B·dl = μ₀I<sub>enc</sub> + μ₀ε₀ dΦ<sub>E</sub>/dt</div><p><span class=\"t-en\">I<sub>enc</sub>: current through the loop. Φ<sub>E</sub>: electric flux through the loop.</span><span class=\"t-ko\">I<sub>enc</sub>: 경로를 통과하는 전류. Φ<sub>E</sub>: 경로를 지나는 전기 선속.</span></p></div></div><div class=\"mxs-vis\"><canvas class=\"mxs-cv\" data-mx=\"am\" data-q=\"1\" width=\"760\" height=\"560\"></canvas></div></div><div class=\"sto-cols\"><div class=\"sto-it\"><div class=\"t\">READ IT</div><h4><span class=\"t-en\">The capacitor puzzle</span><span class=\"t-ko\">축전기 수수께끼</span></h4><p><span class=\"t-en\">Charge flows into a capacitor, but no charge crosses the gap. Yet B circles the gap just as it circles the wire. The changing E between the plates is what makes it.</span><span class=\"t-ko\">전하가 축전기로 흘러 들어가지만 극판 사이 틈을 건너는 전하는 없습니다. 그런데도 틈 주위에는 도선 주위와 똑같이 자기장이 돕니다. 극판 사이에서 변하는 전기장이 그것을 만듭니다.</span></p></div><div class=\"sto-it\"><div class=\"t\">HISTORY</div><h4><span class=\"t-en\">Ampère 1826, Maxwell 1865</span><span class=\"t-ko\">암페어 1826, 맥스웰 1865</span></h4><p><span class=\"t-en\">Ampère wrote the current term in 1826. James Clerk Maxwell added the ∂E/∂t term in 1861–1865, then found that the equations predict waves moving at 1/√(μ₀ε₀) ≈ 3×10⁸ m/s, the speed of light. Heinrich Hertz made such waves in 1887.</span><span class=\"t-ko\">암페어가 1826년 전류 항을 썼고, 제임스 클러크 맥스웰이 1861~1865년 ∂E/∂t 항을 더했습니다. 그러자 식이 1/√(μ₀ε₀) ≈ 3×10⁸ m/s, 곧 빛의 속도로 움직이는 파동을 예언했습니다. 하인리히 헤르츠가 1887년 실제로 그 파동을 만들었습니다.</span></p></div><div class=\"sto-it\"><div class=\"t\">WAVES</div><h4><span class=\"t-en\">3 + 4 = light</span><span class=\"t-ko\">3번 + 4번 = 빛</span></h4><p><span class=\"t-en\">Changing E makes B (eq. 4), changing B makes E (eq. 3). They keep creating each other and travel away as an electromagnetic wave: radio, microwaves, light.</span><span class=\"t-ko\">변하는 E가 B를 만들고(4번), 변하는 B가 E를 만듭니다(3번). 서로를 계속 만들어 내며 퍼져 나가는 것이 전자기파입니다. 라디오파, 마이크로파, 빛이 모두 그렇습니다.</span></p></div></div><div class=\"sto-link\"><span class=\"t-en\"><b>In the tool.</b> In a CCP, RF current crosses the blocking capacitor and the plasma sheath mostly as displacement current: no electrons jump the gap, but the rapidly changing E carries the current. The same equation explains how 2.45 GHz microwaves travel into an ECR or microwave plasma source.</span><span class=\"t-ko\"><b>장비에서는.</b> CCP에서 RF 전류는 블로킹 커패시터와 플라즈마 쉬스를 대부분 변위 전류로 건넙니다. 틈을 건너는 전자는 없지만 빠르게 변하는 전기장이 전류를 실어 나릅니다. 2.45 GHz 마이크로파가 ECR이나 마이크로파 플라즈마 소스 안으로 전달되는 것도 이 식으로 설명됩니다.</span></div><details class=\"mxs-q\"><summary><span class=\"t-en\">Check yourself · </span><span class=\"t-ko\">확인 문제 · </span><span class=\"t-en\">No charge crosses the gap of a capacitor. Why is there still a magnetic field around the gap?</span><span class=\"t-ko\">축전기의 틈을 건너는 전하는 없는데, 왜 틈 주위에도 자기장이 생길까요?</span></summary><p><span class=\"t-en\">Because E between the plates is changing. Maxwell’s term μ₀ε₀ ∂E/∂t acts just like a current (displacement current).</span><span class=\"t-ko\">극판 사이의 전기장이 변하기 때문입니다. 맥스웰의 항 μ₀ε₀ ∂E/∂t가 전류처럼 작용합니다(변위 전류).</span></p></details>","stMxVid":"<div class=\"sto-k\"><span class=\"t-en\">STUDY VIDEOS · MAXWELL’S EQUATIONS</span><span class=\"t-ko\">보조 학습 영상 · 맥스웰 방정식</span></div><div class=\"sto-hd\"><div><h3><span class=\"t-en\">See the equations move</span><span class=\"t-ko\">방정식이 움직이는 모습을 보세요</span></h3><div class=\"ld\"><span class=\"t-en\">Two animated videos to review after class. They open in a new YouTube tab.</span><span class=\"t-ko\">강의 후 복습용 애니메이션 영상 두 편입니다. 누르면 YouTube 새 탭에서 열립니다.</span></div></div></div><div class=\"yv-grid\"><a class=\"yv\" href=\"https://www.youtube.com/watch?v=ZRJb9V_bzl0\" target=\"_blank\" rel=\"noopener\"><div class=\"yv-th\"><img src=\"https://i.ytimg.com/vi/ZRJb9V_bzl0/hqdefault.jpg\" alt=\"\" onerror=\"this.remove()\"><span class=\"yv-play\">▶</span></div><div class=\"yv-b\"><div class=\"yv-ch\"><span class=\"t-en\">Visual Physics</span><span class=\"t-ko\">Visual Physics</span></div><div class=\"yv-ti\">Maxwell’s Equations Explained Visually</div><p><span class=\"t-en\">A clear visual tour of all four equations, one by one. Good first review.</span><span class=\"t-ko\">네 방정식을 하나씩 그림으로 풀어 주는 영상입니다. 처음 복습할 때 좋습니다.</span></p><span class=\"yv-go\"><span class=\"t-en\">Watch on YouTube ↗</span><span class=\"t-ko\">YouTube에서 보기 ↗</span></span></div></a><a class=\"yv\" href=\"https://www.youtube.com/watch?v=9Tm2c6NJH4Y&t=1881s\" target=\"_blank\" rel=\"noopener\"><div class=\"yv-th\"><img src=\"https://i.ytimg.com/vi/9Tm2c6NJH4Y/hqdefault.jpg\" alt=\"\" onerror=\"this.remove()\"><span class=\"yv-play\">▶</span><span class=\"yv-t\"><span class=\"t-en\">starts at </span><span class=\"t-ko\">시작 </span>31:21</span></div><div class=\"yv-b\"><div class=\"yv-ch\"><span class=\"t-en\">Physics Videos by Eugene Khutoryansky</span><span class=\"t-ko\">Physics Videos by Eugene Khutoryansky</span></div><div class=\"yv-ti\">전자기 – 맥스웰의 법칙</div><p><span class=\"t-en\">A long 3D-animated lecture on electromagnetism. The link jumps straight to the Maxwell’s equations part.</span><span class=\"t-ko\">전자기학을 3D 애니메이션으로 설명하는 긴 강의입니다. 링크는 맥스웰 방정식 부분으로 바로 이동합니다.</span></p><span class=\"yv-go\"><span class=\"t-en\">Watch on YouTube ↗</span><span class=\"t-ko\">YouTube에서 보기 ↗</span></span></div></a></div>"};

      c.fillText(L('orange arcs = wave fronts (strongest sideways) · yellow = E · slowed ~10⁹×','주황 호 = 파면 (옆으로 가장 셈) · 노랑 = E · 약 10⁹배 느리게'), 14, 12);
      q('.hz-r1').textContent = !gapOK ? L('none: voltage too low','없음: 전압 부족') : S.run ? L('sparking ✓','불꽃 발생 ✓') : L('stopped','정지');
      var rxt = S.lastK === undefined ? '—' : (S.lastK > 0.55 ? L('spark ✓ (' + S.hits + ')','불꽃 ✓ (' + S.hits + '회)') : L('too weak','너무 약함'));
      if(!gapOK) rxt = L('no wave','파동 없음');
