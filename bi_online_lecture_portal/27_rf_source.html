<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Module 07 — RF Source & Its Application | Benedu Insight RF Lecture Series</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/benedu-insight/benedu-insight.github.io/refs/heads/main/logo_png/benedu_insight_Symbol.png"/>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet"/>
<script>
window.MathJax = {
  tex: { inlineMath: [['$','$'],['\\(','\\)']], displayMath: [['$$','$$'],['\\[','\\]']] },
  startup: { typeset: false }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
<style>
/* ═══════════════════════════════════════════════
   BENEDU INSIGHT — MODULE 05 BASE STYLES
   Module 05 구조 계승, Module 07(RF Source & Its Application) 아이덴티티 추가
═══════════════════════════════════════════════ */
:root {
  --bg: #F7F8FA;
  --card: #F1EFEA;
  --card-hd: #E7E4DD;
  --purple: #7030A0;
  --green: #0F8C50;
  --plasma: #E87B1E;
  --blue: #1A6FB5;
  --red: #C0392B;
  --teal: #7030A0;
  --amber: #7030A0;
  --text: #1A1A2E;
  --text-sub: #5A5A7A;
  --border: #D8D5CE;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --radius: 12px;
  --font: 'Google Sans', 'Noto Sans KR', sans-serif;
  --mono: 'JetBrains Mono', monospace;
  --batang: 'Gowun Batang', serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; scroll-behavior: smooth; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  display: flex;
  min-height: 100vh;
}

/* ── SIDEBAR ── */
#sidebar {
  width: 260px;
  height: 100vh;
  background: #FFFFFF;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0;
  overflow-y: auto;
  z-index: 100;
}
/* ── Sidebar hide/show toggle ── */
#sidebar {
  transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
#main, #top-logo-bar {
  transition: margin-left 0.25s cubic-bezier(0.4, 0, 0.2, 1),
              left 0.25s cubic-bezier(0.4, 0, 0.2, 1),
              max-width 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
body.sidebar-hidden #sidebar { transform: translateX(-260px); }
body.sidebar-hidden #main   { margin-left: 0; max-width: 100vw; }
body.sidebar-hidden #top-logo-bar { left: 0; }
#sidebar-toggle {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  left: 260px;
  z-index: 200;
  width: 18px;
  height: 52px;
  background: #fff;
  border: 1px solid var(--border);
  border-left: none;
  border-radius: 0 8px 8px 0;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.65rem;
  color: var(--text-sub);
  box-shadow: 2px 0 6px rgba(0,0,0,0.06);
  transition: left 0.25s cubic-bezier(0.4, 0, 0.2, 1),
              background 0.15s ease;
  padding: 0;
  line-height: 1;
  user-select: none;
}
#sidebar-toggle:hover { background: rgba(112,48,160,0.10); color: var(--purple); }
body.sidebar-hidden #sidebar-toggle {
  left: 0;
  border-left: 1px solid var(--border);
  border-radius: 0 8px 8px 0;
}
.sb-brand {
  padding: 20px 18px 16px;
  border-bottom: 1px solid var(--border);
}
.sb-brand .module-tag {
  margin-top: 4px;
  font-size: 0.72rem;
  color: var(--text-sub);
}
.sb-era {
  padding: 10px 14px 6px;
  font-size: 0.65rem;
  font-weight: 700;
  color: var(--text-sub);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.sb-era-bar {
  height: 3px;
  border-radius: 2px;
  margin: 4px 14px 8px;
  background: var(--teal);
  opacity: 0.4;
}
.sb-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 9px 14px;
  cursor: pointer;
  border-radius: 8px;
  margin: 1px 8px;
  transition: background 0.15s;
  text-decoration: none;
}
.sb-item:hover { background: #E8F7F2; }
.sb-item.active { background: #D1F0E6; }
.sb-dot {
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.65rem;
  font-family: var(--mono);
  font-weight: 600;
  flex-shrink: 0;
  margin-top: 1px;
}
.sb-label { font-size: 0.78rem; line-height: 1.35; color: var(--text); }
.sb-sub { font-size: 0.68rem; color: var(--text-sub); margin-top: 2px; }

/* ── TOP-BAR LANGUAGE TOGGLE ── */
.top-lang-toggle {
  display: flex; align-items: center;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 2px;
  gap: 1px;
}
.top-lang-btn {
  font-family: var(--font);
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  padding: 4px 11px;
  border-radius: 12px;
  border: none;
  background: transparent;
  color: var(--text-sub);
  cursor: pointer;
  transition: all 0.15s;
}
.top-lang-btn:hover:not(.active) { color: var(--text); }
.top-lang-btn.active {
  background: var(--teal);
  color: #fff;
}

/* ── TOP LOGO BAR ── */
#top-logo-bar {
  position: fixed;
  top: 0; left: 260px; right: 0;
  height: 44px;
  background: #fff;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 14px;
  padding: 0 28px;
  z-index: 150;
}
#top-logo-bar img {
  height: 22px;
  width: auto;
  object-fit: contain;
  opacity: 0.88;
}

/* ── MAIN CONTENT ── */
#main {
  margin-left: 260px;
  flex: 1;
  padding: 64px 36px 32px;
  max-width: calc(100vw - 260px);
}

/* ── SLIDE HEADER ── */
.slide-header { margin-bottom: 28px; }
.slide-eyebrow {
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--teal);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.slide-title {
  font-size: 1.9rem;
  font-weight: 700;
  color: var(--text);
  line-height: 1.2;
}
.slide-title span { color: var(--teal); }
.slide-subtitle {
  margin-top: 8px;
  font-size: 0.92rem;
  color: var(--text-sub);
  line-height: 1.5;
}

/* ── TAB SYSTEM ── */
.tab-row {
  display: flex;
  gap: 4px;
  margin-bottom: 24px;
  border-bottom: 2px solid var(--border);
  padding-bottom: 0;
}
.tab-btn {
  padding: 8px 18px 10px;
  font-family: var(--font);
  font-size: 0.82rem;
  font-weight: 500;
  border: none;
  background: transparent;
  color: var(--text-sub);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  transition: all 0.15s;
}
.tab-btn.active {
  color: var(--teal);
  border-bottom-color: var(--teal);
  font-weight: 700;
}
.tab-btn:hover:not(.active) { color: var(--text); }
.tab-pane { display: none; }
.tab-pane.active { display: block; }

/* ── DIAGRAM CARD ── */
.sim-link-card {
  display: flex;
  align-items: center;
  gap: 14px;
  background: linear-gradient(135deg, var(--purple) 0%, #9B59D0 100%);
  color: #fff;
  text-decoration: none;
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-bottom: 20px;
  box-shadow: 0 3px 14px rgba(112,48,160,0.28);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.sim-link-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(112,48,160,0.36);
}
.sim-link-icon { font-size: 1.6rem; flex-shrink: 0; }
.sim-link-text { display: flex; flex-direction: column; gap: 2px; flex: 1; }
.sim-link-label {
  font-size: 0.65rem; font-weight: 700; letter-spacing: 0.08em;
  opacity: 0.85; font-family: var(--mono); text-transform: uppercase;
}
.sim-link-title { font-size: 0.95rem; font-weight: 700; }
.sim-link-arrow { font-size: 1.3rem; opacity: 0.85; flex-shrink: 0; }

.zone-sim-links { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
.zone-sim-link {
  display: flex; align-items: center; gap: 8px;
  background: #fff;
  border: 1.3px solid var(--zone-color, var(--purple));
  border-radius: 8px;
  padding: 8px 12px;
  text-decoration: none;
  color: var(--zone-color, var(--purple));
  font-size: 0.76rem; font-weight: 600;
  transition: background 0.15s ease, transform 0.15s ease;
}
.zone-sim-link:hover {
  background: var(--zone-color-fade, rgba(112,48,160,0.1));
  transform: translateX(2px);
}
.zone-sim-link .zsl-icon { font-size: 0.95rem; flex-shrink: 0; }
.zone-sim-link .zsl-title { flex: 1; }
.zone-sim-link .zsl-arrow { font-size: 0.85rem; opacity: 0.75; flex-shrink: 0; }

.d-wrap {
  background: var(--card);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}
.d-header {
  background: var(--card-hd);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-radius: var(--radius) var(--radius) 0 0;
}
.d-badge {
  background: var(--teal);
  color: #fff;
  font-size: 0.65rem;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 20px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  font-family: var(--mono);
}
.d-badge.purple { background: var(--purple); }
.d-badge.green  { background: var(--green); }
.d-badge.plasma { background: var(--plasma); }
.d-badge.red    { background: var(--red); }
.d-title { font-size: 0.9rem; font-weight: 700; color: var(--text); }
.d-body { padding: 1.2rem; }

/* ── THEORY CARDS ── */
.theory-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
  margin-bottom: 20px;
}
.theory-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.05);
}
.theory-card h4 {
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--teal);
  margin-bottom: 7px;
  display: flex; align-items: center; gap: 6px;
}
.theory-card p { font-size: 0.82rem; color: var(--text-sub); line-height: 1.55; }

/* ── ZONE CARDS (diagram-linked) ── */
.zone-cards-label {
  font-size: 0.7rem;
  color: var(--text-sub);
  font-family: var(--mono);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin: 18px 0 10px;
  padding-top: 16px;
  border-top: 1px dashed var(--border);
}
.zone-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  transition: box-shadow 0.25s ease, border-color 0.25s ease, transform 0.25s ease;
  scroll-margin-top: 20px;
}
.zone-card h4 {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 7px;
  display: flex; align-items: center; gap: 7px;
}
.zone-card p { font-size: 0.82rem; color: var(--text-sub); line-height: 1.6; }
.zone-card.zone-active {
  border-color: var(--zone-color, var(--purple));
  box-shadow: 0 0 0 3px var(--zone-color-fade, rgba(112,48,160,0.18)), 0 4px 14px rgba(0,0,0,0.10);
  transform: translateY(-2px);
}
.zone-block { cursor: pointer; }
.zone-block:hover rect { filter: brightness(0.97); }

/* ── EQUATION BLOCK ── */
.eq-block {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 18px;
  margin: 10px 0;
  font-family: var(--mono);
  font-size: 0.9rem;
  text-align: center;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}
.eq-label {
  font-size: 0.7rem;
  color: var(--text-sub);
  text-align: right;
  margin-top: 4px;
  font-family: var(--font);
}

/* ── CALLOUT ── */
.callout {
  background: #F0FAFF;
  border: 1px solid #A8D8E8;
  border-radius: 10px;
  padding: 14px 16px;
  margin: 14px 0;
  font-size: 0.84rem;
  line-height: 1.6;
  color: var(--text);
}
.callout.green  { background: #F0FAF4; border-color: #A8D5B8; }
.callout.plasma { background: #FFF8F0; border-color: #F5C89A; }
.callout.purple { background: #F8F6FF; border-color: #C9B8E8; }
.callout.red    { background: #FDF0EE; border-color: #EAB0A8; }
.callout-title {
  font-weight: 700;
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 6px;
  color: var(--teal);
}
.callout.green  .callout-title { color: var(--green); }
.callout.plasma .callout-title { color: var(--plasma); }
.callout.purple .callout-title { color: var(--purple); }
.callout.red    .callout-title { color: var(--red); }

/* ── QUIZ ── */
.quiz-card {
  background: #fff;
  border: 1.5px solid #A8D8E8;
  border-radius: 10px;
  padding: 18px;
  margin-top: 10px;
}
.quiz-q {
  font-size: 0.88rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 14px;
  line-height: 1.5;
}
.quiz-opts { display: flex; flex-direction: column; gap: 8px; }
.quiz-opt {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 14px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.82rem;
  line-height: 1.4;
  transition: all 0.15s;
  background: var(--bg);
}
.quiz-opt:hover { border-color: var(--teal); background: #F0FAFF; }
.quiz-opt.correct { border-color: var(--green); background: #F0FAF4; color: var(--green); }
.quiz-opt.wrong   { border-color: var(--red); background: #FDF0EE; color: var(--red); }
.quiz-opt span.opt-key {
  font-family: var(--mono);
  font-weight: 700;
  font-size: 0.75rem;
  width: 20px; flex-shrink: 0;
}
.quiz-feedback {
  margin-top: 12px;
  font-size: 0.8rem;
  padding: 10px 12px;
  border-radius: 8px;
  display: none;
  line-height: 1.5;
}
.quiz-feedback.show { display: block; }
.quiz-feedback.ok { background: #F0FAF4; color: var(--green); }
.quiz-feedback.ng { background: #FDF0EE; color: var(--red); }

/* ── CONNECTIONS ── */
.connections { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.conn-chip {
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 0.75rem;
  font-family: var(--mono);
  font-weight: 600;
  border: 1.5px solid var(--border);
  cursor: pointer;
  transition: all 0.15s;
  background: #fff;
  color: var(--text-sub);
}
.conn-chip:hover { border-color: var(--teal); color: var(--teal); background: #F0FAFF; }

/* ── DEEP STUDY ── */
.deep-section h3 {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--teal);
  margin: 20px 0 10px;
  padding-bottom: 6px;
  border-bottom: 1.5px solid #A8D8E8;
}
.deep-section p  { font-size: 0.84rem; line-height: 1.7; color: var(--text); margin-bottom: 10px; }
.deep-section ul { padding-left: 18px; margin-bottom: 10px; }
.deep-section ul li { font-size: 0.83rem; line-height: 1.65; color: var(--text); margin-bottom: 4px; }

/* ── TABLE ── */
.data-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin: 10px 0; }
.data-table th {
  background: var(--card-hd);
  padding: 9px 12px;
  text-align: left;
  font-weight: 700;
  font-size: 0.75rem;
  color: var(--text-sub);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.data-table td { padding: 9px 12px; border-bottom: 1px solid var(--border); color: var(--text); line-height: 1.4; }
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { background: #F0FAFF; }

/* ── CANVAS SIMULATOR ── */
.sim-wrap { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin: 10px 0; }
.sim-canvas {
  width: 100%;
  max-width: 100%;
  height: auto;
  border-radius: 8px;
  background: #0D1117;
  display: block;
  image-rendering: -webkit-optimize-contrast;
  image-rendering: crisp-edges;
  box-sizing: border-box;
}
.sim-controls { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 14px; align-items: center; }
.sim-ctrl-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 140px; }
.sim-ctrl-label { font-size: 0.72rem; font-weight: 700; color: var(--text-sub); display: flex; justify-content: space-between; }
.sim-ctrl-val { font-family: var(--mono); font-size: 0.72rem; color: var(--teal); font-weight: 600; }
.sim-slider {
  -webkit-appearance: none; width: 100%; height: 4px; border-radius: 2px;
  background: var(--border); outline: none;
}
.sim-slider::-webkit-slider-thumb {
  -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
  background: var(--teal); cursor: pointer;
}
.sim-btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.sim-btn {
  padding: 7px 16px; border-radius: 8px;
  border: 1.5px solid var(--teal);
  background: transparent; color: var(--teal);
  font-family: var(--font); font-size: 0.78rem; font-weight: 600;
  cursor: pointer; transition: all 0.15s;
}
.sim-btn:hover, .sim-btn.active { background: var(--teal); color: #fff; }
.sim-btn.purple-btn { border-color: var(--purple); color: var(--purple); }
.sim-btn.purple-btn:hover, .sim-btn.purple-btn.active { background: var(--purple); color: #fff; }
.sim-info {
  margin-top: 10px; padding: 10px 14px;
  background: var(--bg); border-radius: 8px;
  font-size: 0.78rem; color: var(--text-sub); line-height: 1.5; min-height: 36px;
}

/* ── L-NETWORK SHARED SIMULATOR (Topic 2~5) — checkbox chips ── */
.lnet-chip-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 8px;
}
.lnet-main-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
  gap: 14px;
  align-items: stretch;
}
@media (max-width: 760px) {
  .lnet-main-grid { grid-template-columns: 1fr; }
}
.lnet-chip {
  display: flex; align-items: center; gap: 8px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 7px 10px;
  cursor: pointer;
  background: #fff;
  transition: all 0.15s;
  user-select: none;
}
.lnet-chip:hover { background: var(--bg); }
.lnet-chip.active { background: #FFF8EC; border-color: var(--teal); box-shadow: 0 0 0 1px var(--teal) inset; }
.lnet-chip-box {
  flex-shrink: 0;
  width: 18px; height: 18px;
  border: 1.6px solid var(--border-strong, #B8AC92);
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.7rem; font-weight: 900; color: #fff;
  background: #fff;
}
.lnet-chip.active .lnet-chip-box { background: var(--teal); border-color: var(--teal); }

/* ── REVEAL BLOCK (함께 생각해 보기) ── */
.reveal-wrap {
  background: #fff;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 16px;
  box-shadow: 0 1px 6px rgba(0,0,0,0.06);
}
.reveal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  cursor: pointer;
  user-select: none;
  transition: background 0.15s;
}
.reveal-header:hover { background: #F4F6FB; }
.reveal-q {
  font-size: 0.92rem;
  font-weight: 700;
  color: var(--text);
  line-height: 1.4;
  flex: 1;
}
.reveal-badge {
  flex-shrink: 0;
  background: var(--teal);
  color: #fff;

/* ═══════════════════════════════════════════
   HiDPI Canvas Utility
═══════════════════════════════════════════ */
function setupHiDPI(canvas) {
  const dpr  = window.devicePixelRatio || 1;
  const cssW = canvas.offsetWidth  || canvas.parentElement && canvas.parentElement.offsetWidth || 680;
  const attrH = parseInt(canvas.getAttribute('data-h') || canvas.height || 260);
  const attrW = parseInt(canvas.getAttribute('data-w') || canvas.width  || 680);
  const cssH  = Math.round(attrH * (cssW / attrW));
  canvas.width  = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  canvas.style.width  = '100%';
  canvas.style.height = cssH + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  return { ctx, W: cssW, H: cssH, dpr };
}

      <div class="zone-card" id="card-zone1" style="--zone-color:#1A6FB5;--zone-color-fade:#1A6FB52E">
        <h4>① Signal Generation — Producing a Precise Frequency</h4>
        <p>A 40.68 MHz reference clock feeds a DDS (Direct Digital Synthesis) stage, which digitally synthesizes a 13.56 MHz reference signal. This signal is still close to a sine wave, and this zone's focus isn't amplitude but frequency and phase accuracy — the switching family doesn't control power by varying this signal's size; instead, this signal is converted into a switching command as-is in the next zone (Gate Drive).</p>

        <h4>② Signal Conditioning — Preparing and Splitting the Signal, Without Analog Matching</h4>
        <p>This zone's job differs from the linear "Driver Amp." A Comparator cleans up the DDS's sine reference into a crisp square wave (a logic-level on/off signal), RF Enable manages on/off timing, and the Splitter then duplicates that square wave into two paths (0°/180°). This Splitter isn't a narrowband RF power-splitting device — it's a pure digital fan-out. A square wave carries harmonic content alongside its fundamental, and if a narrowband RF splitter (built on λ/4 transmission lines) were used here, those harmonics would be attenuated and reflected, blurring the sharp edges just created. So the split has to happen while the signal is still at logic level.</p>

          <a href="./sims/e_gate_driver_sims.html" target="_blank" rel="noopener" class="zone-sim-link">

            <span class="zsl-icon">🖥️</span><span class="zsl-title">RF Electromagnetic Energy Flow Simulator (shared Splitter/Combiner physics)</span><span class="zsl-arrow">↗</span>
          </a>
        </div>
      </div>
      <div class="zone-card" id="card-zone3" style="--zone-color:#0F8C50;--zone-color-fade:#0F8C502E">
        <h4>③ Power Generation — Where the Actual Power Is Made</h4>
        <p>Each of the two paths (0°/180°) the Splitter created now has its own Gate Driver — putting the driver right next to its switch minimizes drive-loop inductance and guarantees edge quality is tuned to that specific device. Each Switching Power Amp (Class D/E) has a built-in resonant network (Lr·Cr) that achieves ZVS (Zero Voltage Switching). Isolation only becomes necessary where the Combiner merges the two paths' actual RF outputs — that's the point where reflection or imbalance in real RF power can occur. This is where heat and failures occur most in an RF Generator.</p>

        </div>
      </div>
      <div class="zone-card" id="card-zone4" style="--zone-color:#7030A0;--zone-color-fade:#7030A02E">
        <h4>④ Output Conditioning — Matching to 50Ω, Then Filtering What's Left</h4>
        <p>Shaping the waveform into something close to a sine wave already happens largely inside the Main Amp's resonant network back in ③ Power Generation, but a single resonant stage only suppresses harmonics so far. So the Matching Network first transforms the Combiner's output to the standard 50Ω impedance, and the LPF then filters the remaining harmonics down to regulatory levels. The RF Sensor downstream measures forward/reflected power in real time — and for that measurement to be accurate, the signal reaching it needs to be a clean fundamental with nothing else mixed in. That's why the LPF matters not just for compliance, but for the accuracy of the control loop's own numbers.</p>

        <h4>⑤ Power/Control — The Power Control "Method" Itself Is Different</h4>
        <p>Three-phase AC passes through the Noise Filter to become a variable, high-voltage DC-DC supply. This is where the switching family's most fundamental trait lives — power is controlled not by signal size, but by varying this Vdd voltage itself in real time. The Digital Controller (FPGA) receives feedback from the RF Sensor and runs a digital closed loop that commands this variable supply directly.</p>

<div class="zone-card" id="card-zone1" style="--zone-color:#1A6FB5;--zone-color-fade:#1A6FB52E">
  <h4>① 신호발생부 — 정확한 주파수를 만든다</h4>
  <p>40.68MHz 기준 클럭을 DDS가 받아 13.56MHz 기준 신호를 디지털 합성으로 만들어내는 과정은 Class AB에서도 그대로입니다. 다만 이 신호의 위상·주파수 정확도가 여전히 핵심인 건 같지만, 스위칭 계열과 달리 이 신호의 진폭도 이번엔 무의미하지 않습니다 — 다음 단(신호처리부)의 VVA가 이 신호 경로 위에서 진폭을 직접 조절해 파워를 제어하기 때문입니다.</p>
</div>
<div class="zone-card" id="card-zone2" style="--zone-color:#E87B1E;--zone-color-fade:#E87B1E2E">
  <h4>② 신호처리부 — 진폭을 조절하고, 증폭한 뒤 나눈다</h4>
  <p>스위칭 계열의 Comparator(사인파→사각파)는 없습니다. 대신 Exciter 보드가 버퍼링·VVA(PWR_CTL 입력으로 진폭 실시간 조절 — 이게 Class AB의 파워 제어 지점입니다)·RF ON/OFF(EXT_ON)를 한 보드에서 처리합니다. 그다음 Driver Amp가 분기 전에 딱 한 번 신호를 충분한 레벨로 끌어올리고, 그제서야 Splitter가 3개 경로로 나눕니다 — 즉 증폭은 분기 이전에 한 번만 일어나고, 분기 이후 3개 경로는 증폭 없이 그대로 각 Main Amp로 들어갑니다. 흥미로운 대조점 — 스위칭 계열에서는 "협대역 RF Splitter를 쓰면 사각파 엣지가 뭉개진다"는 제약이 있었는데, Class AB는 애초에 깨끗한 사인파라 그 제약이 사라집니다. 그래서 여기서는 평범한 컨벤셔널 LC Splitter를 그대로 씁니다.</p>
</div>
<div class="zone-card" id="card-zone3" style="--zone-color:#0F8C50;--zone-color-fade:#0F8C502E">
  <h4>③ 파워생성부 — 3-way 병렬 증폭, 그리고 새로운 변수: 바이어스</h4>
  <p>Splitter가 나눈 3개 경로는 각자 증폭 없이 곧바로 Main Amp(Class AB LDMOS)로 들어갑니다 — 신호를 끌어올리는 능동 게인은 이미 ②신호처리부의 Driver Amp가 분기 전에 끝냈고, Main Amp 자체의 입력단은 트랜스포머 기반 수동 정합망뿐입니다. 스위칭 계열의 ZVS 공진망은 없는 대신, 게이트 바이어스(IDQ, 정지전류)라는 완전히 새로운 변수가 생깁니다 — 이 바이어스 포인트가 Class A/AB/B/C를 가르는 정의 그 자체이고, 온도에 따라 흔들리면 왜곡·열폭주로 이어지기 때문에 안정화가 중요합니다. 3개 경로의 RF 출력은 Isolator를 거쳐 Combiner(3→1)에서 합쳐지는데, 여기서 반사·불균형이 생기면 바로 발열·고장으로 이어지는 건 스위칭 계열과 동일합니다.</p>
</div>
<div class="zone-card" id="card-zone4" style="--zone-color:#7030A0;--zone-color-fade:#7030A02E">
  <h4>④ 정형출력부 — 구조는 같지만, 짊어질 짐은 더 가볍다</h4>
  <p>Matching Network → LPF → RF Sensor로 이어지는 구조 자체는 스위칭 계열과 동일합니다. 다만 Class AB는 선형 증폭이라 애초에 고조파 함량이 스위칭 계열보다 낮은 경향이 있어 — 물론 바이어스가 A에 가까울수록 더 그렇고, AB~B 쪽으로 갈수록 다시 늘어나긴 합니다 — LPF가 짊어져야 할 감쇠량 자체는 상대적으로 가벼워질 수 있습니다. RF Sensor가 정확한 값을 읽어야 한다는 요구사항은 그대로입니다.</p>
</div>
<div class="zone-card" id="card-zone5" style="--zone-color:#C0392B;--zone-color-fade:#C0392B2E">

</div>

<div class="zone-card" id="card-zone1" style="--zone-color:#1A6FB5;--zone-color-fade:#1A6FB52E">
  <h4>① Signal Generation — Making an Accurate Frequency</h4>
  <p>The DDS still takes the 40.68MHz reference clock and digitally synthesizes a 13.56MHz reference, exactly as before. Phase and frequency accuracy still matter just as much -- but unlike the switching family, this signal's amplitude isn't irrelevant anymore either. Downstream, the VVA in Signal Conditioning directly adjusts amplitude along this same signal path to control power.</p>
</div>
<div class="zone-card" id="card-zone2" style="--zone-color:#E87B1E;--zone-color-fade:#E87B1E2E">
  <h4>② Signal Conditioning — Adjust the Amplitude, Amplify, Then Split</h4>
  <p>There's no Comparator here (no sine-to-square conversion). Instead, the Exciter board handles buffering, VVA (adjusts amplitude in real time via the PWR_CTL input -- this is Class AB's power control point), and RF ON/OFF (EXT_ON), all on one board. Then a Driver Amp boosts the signal to a sufficient level exactly once, before the split -- only after that does the Splitter divide it into 3 paths. In other words, amplification happens once upstream of the split; the 3 paths downstream carry that same level straight into their respective Main Amps with no further gain. An interesting contrast: the switching family had a hard constraint -- a narrowband RF splitter would mangle the square wave's sharp edges. Class AB starts as a clean sine wave, so that constraint disappears. A perfectly ordinary conventional LC splitter works fine here.</p>
</div>
<div class="zone-card" id="card-zone3" style="--zone-color:#0F8C50;--zone-color-fade:#0F8C502E">
  <h4>③ Power Generation — 3-Way Parallel Amplification, Plus a New Variable: Bias</h4>
  <p>Each of the 3 paths the Splitter creates goes straight into its own Main Amp (Class AB LDMOS) with no further amplification -- the active gain that gets the signal up to level was already handled upstream by ② Signal Conditioning's Driver Amp, before the split. The Main Amp's own input side is just a transformer-based passive matching network. There's no ZVS resonant network like the switching family -- instead there's an entirely new variable: gate bias (IDQ, quiescent current). This bias point is literally what defines Class A/AB/B/C, and because it drifts with temperature, stabilizing it matters -- drift here leads straight to distortion or thermal runaway. The 3 paths' RF outputs pass through isolators before combining (3→1) -- and just like the switching family, reflection or imbalance here shows up immediately as heat and failures.</p>
</div>
<div class="zone-card" id="card-zone4" style="--zone-color:#7030A0;--zone-color-fade:#7030A02E">
  <h4>④ Output Conditioning — Same Structure, Lighter Load to Carry</h4>
  <p>The Matching Network &#8594; LPF &#8594; RF Sensor chain is architecturally identical to the switching family. But Class AB is linear amplification, so it tends to generate fewer harmonics to begin with -- more so the closer the bias sits to Class A, and less so moving toward AB/B -- which means the LPF's job can be relatively lighter. The requirement for the RF Sensor to read accurate values doesn't change at all.</p>
</div>
<div class="zone-card" id="card-zone5" style="--zone-color:#C0392B;--zone-color-fade:#C0392B2E">
  <h4>⑤ Power / Control — Vdd Is Now Fixed; Control Moves Upstream</h4>
  <p>This is where the two families diverge the most. AC still passes through a Noise Filter, but this time it becomes a fixed HV DC-DC supply (+48V) -- one that doesn't change in real time. The Digital Controller (FPGA) still takes feedback from the RF Sensor, but its command now goes somewhere different -- not back to this power block, but back to the VVA (PWR_CTL) in Signal Conditioning. This is exactly where "how power gets controlled" flips from Vdd modulation to drive-level modulation.</p>
</div>
</div>

</div>`;

<div class="vi-step"><div class="vi-step-num">4</div><div class="vi-step-text">One part, one detector circuit, two readings -- just by physically flipping which way current is being sampled.</div></div></div>

function renderSidebar() {
  const sl = slides();
  const nl = document.getElementById('nav-list');
  nl.innerHTML = '';
  sl.forEach(s => {
    const div = document.createElement('div');
    div.className = 'sb-item' + (s.id === currentId ? ' active' : '');
    div.onclick = () => navigateTo(s.id);
    const color = ERA_COLORS[s.era] || '#7030A0';
    const sub = currentLang === 'ko' ? SB_SUBS_KO[s.id] : SB_SUBS_EN[s.id];
    div.innerHTML = `
      <div class="sb-dot" style="background:${color}20;color:${color}">${SB_ICONS[s.id]||'●'}</div>
      <div>
        <div class="sb-label">${s.title}</div>
        <div class="sb-sub">${sub||''}</div>
      </div>`;
    nl.appendChild(div);
  });
  updateProgress();
}

function updateProgress() {
  const sl = slides();
  const idx = sl.findIndex(s => s.id === currentId);
  const pct = sl.length > 1 ? (idx / (sl.length - 1)) * 100 : 0;
  document.getElementById('progressFill').style.width = pct + '%';
}

      ${s.diagram ? `
      <button class="tab-btn ${currentTab==='diagram'?'active':''}" onclick="switchTab('diagram')">
        📊 ${isEn ? 'Diagram' : '다이어그램'}
      </button>` : ''}
      <button class="tab-btn ${currentTab==='concepts'?'active':''}" onclick="switchTab('concepts')">
        📖 ${isEn ? 'Key Concepts' : '핵심 개념'}
      </button>
      ${equationsHtml ? `
      <button class="tab-btn ${currentTab==='equations'?'active':''}" onclick="switchTab('equations')">
        🔢 ${isEn ? 'Equations' : '수식'}
      </button>` : ''}
      ${classroomHtml ? `
      <button class="tab-btn ${currentTab==='classroom'?'active':''}" onclick="switchTab('classroom')">
        🎓 ${isEn ? 'Classroom' : '교실'}
      </button>` : ''}
    </div>

    ${s.diagram ? `<div id="tab-diagram" class="tab-pane ${currentTab==='diagram'?'active':''}">${diagramHtml}</div>` : ''}
    <div id="tab-concepts" class="tab-pane ${currentTab==='concepts'?'active':''}">
      <div class="theory-grid">${theoriesHtml}</div>
      ${connHtml}
    </div>
    ${equationsHtml ? `<div id="tab-equations" class="tab-pane ${currentTab==='equations'?'active':''}">${equationsHtml}</div>` : ''}
    ${classroomHtml ? `<div id="tab-classroom" class="tab-pane ${currentTab==='classroom'?'active':''}">${classroomHtml}</div>` : ''}
  `;

  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise();
}

/* ═══════════════════════════════════════════
   SPLITTER WIDGET (inline, Topic 4)
═══════════════════════════════════════════ */
let splitterScenario = 'balanced';

const SPLITTER_TXT = {
  ko: {
    isoNoteBalanced: '두 포트가 동일하게 매칭되어 있으면, 두 출력 경로 사이의 격리저항에는 전류가 거의 흐르지 않습니다.',
    isoNoteMismatch: 'Port 2의 부하가 어긋나 반사파가 발생하면, 격리저항이 그 반사 에너지를 흡수해 Port 1(다른 출력)로 새어 들어가지 않도록 막아줍니다.',
    timeLabel: '위상 →',
  },
  en: {
    isoNoteBalanced: 'With both ports equally matched, almost no current flows through the isolation resistor between the two output branches.',
    isoNoteMismatch: 'When Port 2\u2019s load is mismatched and reflects power, the isolation resistor absorbs that reflected energy, keeping it from leaking into Port 1 (the other output).',
    timeLabel: 'Phase \u2192',
  },
};

function drawSplitterCanvas() {
  const canvas = document.getElementById('splitterCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const W = rect.width, H = 220;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  const padL = 46, padR = 16, padT = 16, padB = 30;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;
  const midY = padT + plotH / 2;

  ctx.strokeStyle = '#E9EEF3';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = padT + (plotH / 4) * i;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + plotW, y); ctx.stroke();
  }
  ctx.strokeStyle = '#CBD5E1';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(padL, padT); ctx.lineTo(padL, padT + plotH); ctx.lineTo(padL + plotW, padT + plotH);
  ctx.stroke();
  ctx.setLineDash([3, 3]);
  ctx.beginPath(); ctx.moveTo(padL, midY); ctx.lineTo(padL + plotW, midY); ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = '#94A3B8';
  ctx.font = '10px "JetBrains Mono", monospace';
  ctx.textAlign = 'right';
  ctx.fillText('+1', padL - 8, padT + 4);
  ctx.fillText('0', padL - 8, midY + 4);
  ctx.fillText('-1', padL - 8, padT + plotH + 4);

  const steps = 240;
  const xAt = (i) => padL + (i / steps) * plotW;
  const amp = 0.92 * (plotH / 2);

  ctx.strokeStyle = '#1A6FB5';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const theta = (i / steps) * 2 * Math.PI;
    const y = midY - Math.sin(theta) * amp;
    const x = xAt(i);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();

  const outAmp = amp / Math.SQRT2;
  ctx.strokeStyle = '#0F8C50';
  ctx.lineWidth = 2.4;
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const theta = (i / steps) * 2 * Math.PI;
    const y = midY - Math.sin(theta) * outAmp;
    const x = xAt(i);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();

  if (splitterScenario === 'mismatch') {
    ctx.strokeStyle = 'rgba(192,57,43,0.55)';
    ctx.lineWidth = 1.4;
    ctx.setLineDash([2, 3]);
    ctx.beginPath();
    for (let i = 0; i <= steps; i++) {
      const theta = (i / steps) * 2 * Math.PI;
      const ripple = 0.12 * amp * Math.sin(theta * 3);
      const y = midY - Math.sin(theta) * outAmp * 0.4 + ripple;
      const x = xAt(i);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.fillStyle = '#64748B';
  ctx.font = '10.5px "Google Sans", sans-serif';
  ctx.textAlign = 'left';
  const t = SPLITTER_TXT[currentLang] || SPLITTER_TXT.en;
  ctx.fillText(t.timeLabel, padL, H - 8);
}

function setSplitterScenario(scenario) {
  splitterScenario = scenario;
  const t = SPLITTER_TXT[currentLang] || SPLITTER_TXT.en;
  const btnB = document.getElementById('splitterBtnBalanced');
  const btnM = document.getElementById('splitterBtnMismatch');
  if (btnB) btnB.className = 'class-btn' + (scenario === 'balanced' ? ' active-b' : '');
  if (btnM) btnM.className = 'class-btn' + (scenario === 'mismatch' ? ' active-a' : '');
  const note = document.getElementById('splitterIsoNote');
  if (note) note.textContent = scenario === 'balanced' ? t.isoNoteBalanced : t.isoNoteMismatch;
  drawSplitterCanvas();
}

function initSplitterWidget() {
  const canvas = document.getElementById('splitterCanvas');
  if (!canvas) return;
  splitterScenario = 'balanced';
  setSplitterScenario('balanced');
}

function navigateTo(id) {
  currentId = id;
  currentTab = (getSlide(id) && getSlide(id).diagram) ? 'diagram' : 'concepts';
  renderDetail(id);
  renderSidebar();
  window.scrollTo(0, 0);
  initSplitterWidget();
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  const pane = document.getElementById('tab-' + tab);
  if (pane) pane.classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b => {
    if (b.getAttribute('onclick') === `switchTab('${tab}')`) b.classList.add('active');
  });
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise();
  if (tab === 'diagram') drawSplitterCanvas();
}

function setLang(lang) {
  currentLang = lang;
  document.getElementById('btn-ko').classList.toggle('active', lang === 'ko');
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  renderDetail(currentId);
  renderSidebar();
  initSplitterWidget();
}

function checkQuiz(el, correct, id, qi) {
  const opts = el.parentElement.querySelectorAll('.quiz-opt');
  opts.forEach(o => o.style.pointerEvents = 'none');
  el.classList.add(correct ? 'correct' : 'wrong');
  const fb = document.getElementById('qfb-' + id + '-' + qi);
  const s  = getSlide(id);
  if (fb && s) {
    const cqList = Array.isArray(s.classroom) ? s.classroom : [s.classroom];
    const cq = cqList[qi];
    fb.textContent = correct ? cq.feedback_ok : cq.feedback_ng;
    fb.className   = 'quiz-feedback show ' + (correct ? 'ok' : 'ng');
  }
}

function highlightZoneCard(zoneId) {
  document.querySelectorAll('.zone-card').forEach(c => c.classList.remove('zone-active'));
  const card = document.getElementById('card-' + zoneId);
  if (card) card.classList.add('zone-active');
}

function openImgPopup(src, cap) {
  var img = document.getElementById('img-popup-img');
  var viewport = document.getElementById('img-popup-viewport');
  img.src = src;
  document.getElementById('img-popup-cap').textContent = cap;
  viewport.classList.remove('zoomed');
  viewport.scrollTop = 0;
  viewport.scrollLeft = 0;
  document.getElementById('img-popup').classList.add('open');
  document.addEventListener('keydown', handleImgPopupKey);
}
function closeImgPopup() {
  document.getElementById('img-popup').classList.remove('open');
  document.getElementById('img-popup-viewport').classList.remove('zoomed');
  document.removeEventListener('keydown', handleImgPopupKey);
}
function handleImgPopupKey(e) {
  if (e.key === 'Escape') closeImgPopup();
}
function toggleImgZoom(e) {
  var viewport = document.getElementById('img-popup-viewport');
  var isZoomed = viewport.classList.contains('zoomed');
  if (!isZoomed) {
    var img = document.getElementById('img-popup-img');
    var rect = img.getBoundingClientRect();
    var relX = (e.clientX - rect.left) / rect.width;
    var relY = (e.clientY - rect.top) / rect.height;
    viewport.classList.add('zoomed');
    requestAnimationFrame(function() {
      var img2 = document.getElementById('img-popup-img');
      var targetX = relX * img2.offsetWidth - viewport.clientWidth / 2;
      var targetY = relY * img2.offsetHeight - viewport.clientHeight / 2;
      viewport.scrollLeft = Math.max(0, targetX);
      viewport.scrollTop = Math.max(0, targetY);
    });
  } else {
    viewport.classList.remove('zoomed');
    viewport.scrollTop = 0;
    viewport.scrollLeft = 0;
  }
}

function openViLightbox(src) {
  document.getElementById('viLightboxImg').src = src;
  document.getElementById('viLightboxOverlay').classList.add('open');
}
function closeViLightbox(e) {
  if (e && e.target.id !== 'viLightboxOverlay' && e.target.tagName !== 'BUTTON') return;
  document.getElementById('viLightboxOverlay').classList.remove('open');
}
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') {
    const ov = document.getElementById('viLightboxOverlay');
    if (ov) ov.classList.remove('open');
  }
});

function toggleSidebar() {
  const hidden = document.body.classList.toggle('sidebar-hidden');
  const btn = document.getElementById('sidebar-toggle');
  if (btn) btn.textContent = hidden ? '▶' : '◀';
}

window.addEventListener('DOMContentLoaded', () => {
  renderSidebar();
  renderDetail(currentId);
});
