<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plasma Basics — Benedu Insight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Gowun+Batang:wght@400;700&family=JetBrains+Mono:wght@400;500;600;700&display=block" rel="stylesheet">
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/benedu-insight/benedu-insight.github.io/refs/heads/main/logo_png/benedu_insight_Symbol.png">

<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']]
    },
    startup: {
      ready: function () {
        MathJax.startup.defaultReady();
        const panel = document.getElementById('detail');
        if (panel && window.MathJax.typesetPromise) {
          MathJax.typesetPromise([panel]).catch(function (err) {
            console.log('MathJax initial typeset failed: ' + err.message);
          });
        }
      }
    }
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<style>
  :root {
    --bg:          #F7F8FA;
    --bg2:         #FFFFFF;
    --bg3:         #F0E6F6;
    --bg4:         #E5F4EC;
    --green:       #0F8C50;
    --green-soft:  #E5F4EC;
    --green-mid:   #cbeadd;
    --green-dark:  #0a6b3d;
    --purple:      #7030A0;
    --purple-soft: #F0E6F6;
    --purple-mid:  #d9b8ed;
    --purple-dark: #521a78;
    /* 플라즈마 테마 전용 */
    --plasma:       #E87B1E;
    --plasma-soft:  #FEF0E3;
    --plasma-mid:   #F5C990;
    --plasma-dark:  #A84F05;
    --charcoal:    #2D2D2D;
    --text:        #2D2D2D;
    --text2:       #6B7280;
    --text3:       #9CA3AF;
    --border:      #E5E7EB;
    --border2:     #F3F4F6;
    --shadow:      0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md:   0 4px 12px rgba(0,0,0,0.08);
    --max-w:       1400px;
    --scale:       1.0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Google Sans', 'Gowun Batang', serif;
    min-height: 100vh;
    width: 100%;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header ── */
  header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 0.55rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    box-shadow: var(--shadow);
    width: 100%;
    max-width: var(--max-w);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-logo {
    height: 38px;
    width: auto;
    flex-shrink: 0;
  }
  .header-divider {
    width: 1px;
    height: 28px;
    background: var(--border);
    flex-shrink: 0;
  }
  header h1 {
    font-family: 'Google Sans', 'Gowun Batang', serif;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--plasma);
    letter-spacing: 0.02em;
    line-height: 1.2;
  }
  header p {
    font-family: 'JetBrains Mono', 'Gowun Batang', monospace;
    font-size: 0.55rem;
    color: var(--text3);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 2px;
  }
  .header-actions {
    margin-left: auto;
    display: flex;
    gap: 0.5rem;
    align-items: center;
    flex-wrap: wrap;
  }

  /* Language Toggle */
  .lang-toggle {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    background: var(--bg);
  }
  .lang-btn {
    padding: 3px 12px;
    border: none;
    background: transparent;
    cursor: pointer;
    font-family: 'JetBrains Mono', 'Gowun Batang', monospace;
    font-size: 0.62rem;
    font-weight: 500;
    color: var(--text3);
    transition: all 0.2s;
  }
  .lang-btn.active-lang {
    background: var(--plasma);
    color: #fff;
  }

  /* Module Filter */
  .era-filter {
    display: flex;
    gap: 0.4rem;
    flex-wrap: wrap;
    align-items: center;
  }
  .era-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text2);
    font-family: 'JetBrains Mono', 'Gowun Batang', monospace;
    font-size: 0.62rem;
    padding: 3px 12px;
    cursor: pointer;
    transition: all 0.18s;
  }
  .era-btn:hover {
    border-color: var(--plasma-mid);
    color: var(--plasma);
    background: var(--plasma-soft);
  }
  .era-btn.active {
    background: var(--plasma);
    border-color: var(--plasma);
    color: #fff;
  }

  .toolbar-btn {
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg2);
    color: var(--text);
    padding: 3px 9px;
    font-size: 0.62rem;
    cursor: pointer;
    font-family: 'JetBrains Mono', 'Gowun Batang', monospace;
    font-weight: 500;
    transition: all 0.15s;
  }
  .toolbar-btn:hover {
    border-color: var(--plasma-mid);
    background: var(--plasma-soft);
    color: var(--plasma-dark);
  }
  #scale-indicator {
    font-family: 'JetBrains Mono', 'Gowun Batang', monospace;
    font-size: 0.58rem;
    color: var(--text3);
    min-width: 32px;
    text-align: center;
  }

  /* ── Layout ── */
  .layout {
    display: grid;
    grid-template-columns: 270px 1fr;
    height: calc(100vh - 58px);
    width: 100%;
    max-width: var(--max-w);
  }

  /* ── Sidebar ── */
  .timeline-sidebar {
    border-right: 1px solid var(--border);
    overflow-y: auto;
    background: var(--bg2);
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
    display: flex;
    flex-direction: column;
  }
  .timeline-sidebar::-webkit-scrollbar { width: 4px; }
  .timeline-sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .sidebar-section-label {
    padding: 0.6rem 1.1rem 0.35rem;
    font-family: 'JetBrains Mono', 'Gowun Batang', monospace;
    font-size: 0.55rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text3);
    border-bottom: 1px solid var(--border2);
    position: sticky;
    top: 0;
    background: var(--bg2);
    z-index: 5;
  }

  .era-header {
    position: sticky;
    top: 0;
    background: var(--bg2);
    padding: 0.65rem 1rem 0.45rem;
    border-bottom: 1px solid var(--border2);
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    cursor: pointer;
    user-select: none;
  }
  .era-header:hover { background: var(--bg); }
  .era-label {
    font-family: 'Google Sans', 'Gowun Batang', serif;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .era-line { flex: 1; height: 1px; background: var(--border); }
  .era-range {
    font-family: 'JetBrains Mono', 'Gowun Batang', monospace;
    font-size: 0.55rem;
    color: var(--text3);
    letter-spacing: 0.04em;
  }
  .era-toggle {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--border2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.6rem;
    color: var(--text3);
    transition: background 0.15s, transform 0.22s;
  }
  .era-header.collapsed .era-toggle { transform: rotate(-90deg); }
  .era-header:hover .era-toggle { background: var(--border); color: var(--text2); }
  .era-cards {
    overflow: hidden;
    max-height: 2000px;
    transition: max-height 0.3s ease, opacity 0.25s ease;
    opacity: 1;
  }
  .era-cards.collapsed { max-height: 0; opacity: 0; }

  .sci-card {
    padding: 0.75rem 1rem 0.75rem 1.1rem;
    border-bottom: 1px solid var(--border2);
    cursor: pointer;
    position: relative;
    transition: background 0.15s;
    display: flex;
    gap: 0.65rem;
    align-items: flex-start;
    border-left: 4px solid transparent;
  }
  .sci-card:hover { background: var(--bg); }
  .sci-card.active { background: var(--plasma-soft); border-left-color: var(--plasma); }
  .sci-year {
    font-family: 'JetBrains Mono', 'Gowun Batang', monospace;
    font-size: 0.58rem;
    color: var(--text3);
    min-width: 48px;
    padding-top: 2px;
    line-height: 1.4;
  }
  .sci-info { flex: 1; min-width: 0; }
  .sci-name {
    font-size: 0.83rem;
    font-weight: 700;
    color: var(--charcoal);
    line-height: 1.3;
  }
  .sci-card.active .sci-name { color: var(--plasma-dark); }
  .sci-nation {
    font-size: 0.6rem;
    color: var(--text3);
    margin-top: 1px;
    font-family: 'Google Sans', 'Gowun Batang', serif;
  }
  .sci-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
    margin-top: 4px;
  }
  .sci-tag {
    font-family: 'JetBrains Mono', 'Gowun Batang', monospace;
    font-size: 0.52rem;
    padding: 1px 6px;
    border-radius: 8px;
    letter-spacing: 0.03em;
  }

  /* ── Detail Panel ── */
  .detail-panel {
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
  }

  #detail {
    flex: 1;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  #detail::-webkit-scrollbar { width: 4px; }
  #detail::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .detail-content { padding: 1.5rem; max-width: 880px; margin: 0 auto; }

  /* Hero */
  .detail-hero {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.4rem 1.6rem;
    margin-bottom: 1.1rem;
    box-shadow: var(--shadow);
  }
  .detail-era-tag {
    font-family: 'JetBrains Mono', 'Gowun Batang', monospace;
    font-size: 0.55rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 2px 9px;
    border-radius: 10px;
    font-weight: 500;
  }
  .detail-name {
    font-family: 'Google Sans', 'Gowun Batang', serif;
    font-size: calc(1.7rem * var(--scale));
    font-weight: 800;
    line-height: 1.1;
    color: var(--plasma);
    margin-bottom: 0.1rem;
    transition: font-size 0.15s ease-out;
  }
  .detail-name-kr {
    font-family: 'Google Sans', 'Gowun Batang', serif;
    font-size: calc(0.9rem * var(--scale));
    color: var(--text2);
    margin-bottom: 0.6rem;
    font-weight: 400;
    transition: font-size 0.15s ease-out;
  }
  .detail-meta {
    display: flex;
    gap: 1.25rem;
    flex-wrap: wrap;
    font-family: 'JetBrains Mono', 'Gowun Batang', monospace;
    font-size: calc(0.62rem * var(--scale));
    color: var(--text2);
    padding-top: 0.6rem;
    border-top: 1px solid var(--border2);
    transition: font-size 0.15s ease-out;
  }

  /* Model / Image Showcase */
  .model-showcase {
    display: flex;
    justify-content: center;
    align-items: center;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.75rem;
    margin-bottom: 1.1rem;
    box-shadow: var(--shadow);
  }
  .model-img-wrapper {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
  }
  .model-img-wrapper img {
    max-width: 100%;
    max-height: 420px;
    object-fit: contain;
    border-radius: 8px;
    box-shadow: var(--shadow-md);
  }
  .model-img-source {
    font-family: 'JetBrains Mono', 'Gowun Batang', monospace;
    font-size: 0.62rem;
    color: var(--text3);
    text-align: center;
  }
  .model-svg-wrapper { width: 280px; height: 280px; }

  /* Quote */
  .quote-block {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.1rem;
    margin-bottom: 1.1rem;
    box-shadow: var(--shadow);
  }
  .quote-badge {
    flex: none;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--plasma-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    margin-top: 2px;
  }
  .quote-body { flex: 1; min-width: 0; }
  .quote-text {
    font-family: 'Google Sans', 'Gowun Batang', serif;
    font-style: italic;
    font-size: calc(0.88rem * var(--scale));
    color: var(--plasma-dark);
    line-height: 1.78;
    transition: font-size 0.15s ease-out;
  }
  .quote-attr {
    font-family: 'JetBrains Mono', 'Gowun Batang', monospace;
    font-size: calc(0.58rem * var(--scale));
    color: var(--text3);
    margin-top: 0.4rem;
    letter-spacing: 0.06em;
    transition: font-size 0.15s ease-out;
  }

  /* Bio */
  .detail-bio {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.1rem 1.4rem;
    font-size: calc(0.88rem * var(--scale));
    line-height: 1.85;
    color: var(--text);
    margin-bottom: 1.1rem;
    box-shadow: var(--shadow);
    transition: font-size 0.15s ease-out;
  }
  .detail-bio p + p { margin-top: 0.8em; }

  /* Section Titles */
  .section-title {
    font-family: 'JetBrains Mono', 'Gowun Batang', monospace;
    font-size: 0.58rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text3);
    margin-top: 1.5rem;
    margin-bottom: 0.75rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* Equations */
  .eq-block {
    background: var(--charcoal);
    border-radius: 8px;
    padding: 1.1rem 1.4rem;
    margin-bottom: 0.5rem;
    font-family: 'JetBrains Mono', 'Gowun Batang', monospace;
    font-size: calc(0.9rem * var(--scale));
    color: #FFD580;
    letter-spacing: 0.04em;
    overflow-x: auto;
    transition: font-size 0.15s ease-out;
  }

  /* Theory cards */
  .theories-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 0.7rem;
    margin-bottom: 1.1rem;
  }
  .theory-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem;
    transition: box-shadow 0.18s, border-color 0.18s;
    box-shadow: var(--shadow);
  }
  .theory-card:hover { box-shadow: var(--shadow-md); border-color: var(--plasma-mid); }
  .theory-year {
    font-family: 'JetBrains Mono', 'Gowun Batang', monospace;
    font-size: calc(0.58rem * var(--scale));
    letter-spacing: 0.06em;
    margin-bottom: 0.3rem;
    color: var(--plasma);
    font-weight: 500;
    transition: font-size 0.15s ease-out;
  }
  .theory-name {
    font-size: calc(0.85rem * var(--scale));
    font-weight: 700;
    color: var(--charcoal);
    margin-bottom: 0.3rem;
    line-height: 1.3;
    transition: font-size 0.15s ease-out;
  }
  .theory-desc {
    font-size: calc(0.75rem * var(--scale));
    color: var(--text2);
    line-height: 1.65;
    font-family: 'Google Sans', 'Gowun Batang', serif;
    transition: font-size 0.15s ease-out;
  }

  /* Classroom box */
  details.classroom-box {
    background: #FFFDF0;
    border: 1px dashed #EEDF8B;
    border-radius: 12px;
    padding: 1.1rem;
    margin-bottom: 1.1rem;
    cursor: pointer;
    transition: border 0.15s;
  }
  details.classroom-box[open] { border-style: solid; border-color: #D6C359; }
  details.classroom-box summary {
    font-family: 'Google Sans', 'Gowun Batang', serif;
    font-size: 0.82rem;
    font-weight: 700;
    color: #8C730F;
    outline: none;
    user-select: none;
  }
  .classroom-body {
    font-size: calc(0.76rem * var(--scale));
    line-height: 1.72;
    color: #6B5B1E;
    margin-top: 0.65rem;
    cursor: default;
    transition: font-size 0.15s ease-out;
  }

  /* Summary Matrix */
  .summary-matrix {
    width: 100%;
    border-collapse: collapse;
    background: var(--bg2);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: var(--shadow);
    margin-bottom: 1.1rem;
  }
  .summary-matrix th, .summary-matrix td {
    padding: 0.65rem 0.9rem;
    font-size: calc(0.76rem * var(--scale));
    text-align: left;
    border-bottom: 1px solid var(--border);
    transition: font-size 0.15s ease-out;
  }
  .summary-matrix th {
    background: var(--plasma-soft);
    color: var(--plasma-dark);
    font-weight: 700;
    font-family: 'Google Sans', 'Gowun Batang', serif;
  }

  /* Connections */
  .conn-list { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1.5rem; }
  .conn-chip {
    background: var(--plasma-soft);
    border: 1px solid var(--plasma-mid);
    border-radius: 20px;
    padding: 3px 12px;
    font-size: calc(0.74rem * var(--scale));
    color: var(--plasma-dark);
    cursor: pointer;
    transition: all 0.15s;
    font-family: 'Google Sans', 'Gowun Batang', serif;
  }
  .conn-chip:hover { background: var(--plasma); border-color: var(--plasma); color: #fff; }

  /* Canvas simulation card */
  .sim-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.2rem;
    margin-bottom: 1.1rem;
    box-shadow: var(--shadow);
  }
  .sim-card-header {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 0.75rem;
  }
  .sim-badge {
    background: var(--plasma);
    color: #fff;
    font-family: 'JetBrains Mono', 'Gowun Batang', monospace;
    font-size: 0.52rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 2px 8px;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .sim-title {
    font-family: 'Google Sans', 'Gowun Batang', serif;
    font-size: 0.95rem;
    font-weight: 800;
    color: var(--charcoal);
  }
  .sim-canvas-wrap {
    width: 100%;
    border-radius: 10px;
    overflow: hidden;
    background: #0a0a14;
    position: relative;
  }
  .sim-controls {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-top: 0.65rem;
    align-items: center;
  }
  .sim-btn {
    background: var(--plasma);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 4px 14px;
    font-family: 'JetBrains Mono', 'Gowun Batang', monospace;
    font-size: 0.65rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .sim-btn:hover { background: var(--plasma-dark); transform: translateY(-1px); }
  .sim-btn.secondary {
    background: transparent;
    border: 1px solid var(--plasma);
    color: var(--plasma);
  }
  .sim-btn.secondary:hover { background: var(--plasma-soft); }
  .sim-label {
    font-family: 'JetBrains Mono', 'Gowun Batang', monospace;
    font-size: 0.62rem;
    color: var(--text3);
  }
  .sim-caption {
    font-family: 'JetBrains Mono', 'Gowun Batang', monospace;
    font-size: 0.6rem;
    color: var(--text3);
    letter-spacing: 0.06em;
    text-align: center;
    margin-top: 0.4rem;
    line-height: 1.5;
  }

  /* PHET link card */
  .phet-card {
    background: linear-gradient(135deg, #1a237e 0%, #283593 100%);
    border-radius: 12px;
    padding: 1.1rem 1.4rem;
    margin-bottom: 1.1rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    cursor: pointer;
    text-decoration: none;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: var(--shadow-md);
  }
  .phet-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.18); }
  .phet-icon {
    width: 48px;
    height: 48px;
    border-radius: 10px;
    background: rgba(255,255,255,0.15);
    display: flex;
    align-items: center;
    justify-content: center;

  border-radius:18px;padding:16px;margin:0 0 1.25rem;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);
  gap:18px;align-items:start;max-width:100%;min-width:0;box-sizing:border-box;text-align:left}
.af *{box-sizing:border-box}
.af.af-1col{grid-template-columns:minmax(0,1fr)}
@media (max-width:1100px){ .af{grid-template-columns:minmax(0,1fr);padding:12px;gap:14px} }
.af-stage{position:relative;min-width:0;border-radius:18px;overflow:hidden;
  background:radial-gradient(120% 95% at 32% 48%,#15283b 0%,#0c1520 55%,#070b11 100%);
  box-shadow:0 18px 36px -22px rgba(7,11,17,.6),inset 0 0 0 1px rgba(255,255,255,.06)}
.af-stage.light{background:#fffdf7;box-shadow:inset 0 0 0 1px var(--af-hair)}
.af-stage canvas{display:block;width:100%;height:auto}
.af-tag{position:absolute;left:14px;top:12px;font:600 10px/1.3 'JetBrains Mono',monospace;letter-spacing:.14em;color:rgba(220,236,255,.6);pointer-events:none}
.af-tag.r{left:auto;right:14px}
.af-stage.light .af-tag{color:var(--af-soft)}
.af-ov{position:absolute;left:12px;bottom:12px;display:flex;gap:8px;flex-wrap:wrap}
.af-ov .af-chip{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22);color:rgba(230,242,255,.9)}
.af-ov .af-chip:hover{background:rgba(255,255,255,.18)}
.af-panel{min-width:0;display:flex;flex-direction:column;gap:10px}
.af .k{font-size:13px;color:var(--af-steel);line-height:1.4}
.af .v{font-family:'JetBrains Mono','Gowun Batang',monospace;font-weight:700;font-size:14px;color:var(--af-ink);white-space:nowrap}
.af-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.af-chips{display:flex;flex-wrap:wrap;gap:6px}
.af-chip{font:500 12.5px/1.2 'Google Sans','Gowun Batang',serif;color:var(--af-ink);padding:6px 13px;border:1px solid var(--af-hair);
  background:#fff;border-radius:999px;cursor:pointer;transition:background .15s,border-color .15s}
.af-chip:hover{border-color:var(--af-soft)}
.af-chip.on{background:var(--af-ink);border-color:var(--af-ink);color:#fff}
.af-chip:disabled{opacity:.4;cursor:default}
.af input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;background:var(--af-hair);outline:none;margin:6px 0}
.af input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--af-ink);border:4px solid var(--af-cream);box-shadow:0 0 0 1px var(--af-ink);cursor:pointer}
.af input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--af-ink);border:4px solid var(--af-cream);box-shadow:0 0 0 1px var(--af-ink);cursor:pointer}
.af-fire{flex:1;min-height:44px;border:0;border-radius:999px;background:var(--af-ink);color:#fff;font:600 14px 'Google Sans','Gowun Batang',serif;
  display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;padding:0 16px;transition:transform .12s,opacity .2s}
.af-fire i{width:12px;height:12px;border-radius:50%;flex:0 0 12px;background:var(--pc,#8fe9ff);box-shadow:0 0 10px 3px var(--pc,#8fe9ff)}
.af-fire:active{transform:scale(.97)} .af-fire:disabled{opacity:.38;cursor:default}
.af-act{display:flex;gap:8px;flex-wrap:wrap}
.af-act .af-chip{min-height:44px;padding:0 18px}
.af-ro{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 12px}
.af-ro>div{border-top:1px solid var(--af-hair);padding-top:6px;min-width:0}
.af-ro .k{font:500 10px/1.3 'JetBrains Mono','Gowun Batang',monospace;letter-spacing:.08em;color:var(--af-soft)}
.af-ro .v{font-size:15px;margin-top:3px;overflow:hidden;text-overflow:ellipsis}
.af-ro .w{grid-column:1/-1}
.af-ro .w .v{font-family:'Google Sans','Gowun Batang',serif;font-size:15px;white-space:normal}
.af-mono{font-family:'JetBrains Mono','Gowun Batang',monospace;font-size:10.5px;letter-spacing:.08em;color:var(--af-soft)}
.af-ticks{display:flex;justify-content:space-between;font:500 10px 'JetBrains Mono',monospace;letter-spacing:.08em;color:var(--af-soft)}
.af-big{font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1.05}
.af-sd{font-size:14px;color:var(--af-steel);line-height:1.55}
.af-sd b{color:var(--af-ink)}
.af-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--af-steel)}
.af-legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.af-steps{display:flex;flex-direction:column}
.af-step{display:flex;gap:12px;padding:10px 6px;border-top:1px solid var(--af-hair);cursor:pointer;border-radius:10px;transition:background .15s,opacity .2s;opacity:.55;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;font:inherit;color:inherit;width:100%}
.af-step:hover{background:rgba(10,10,10,.035)}
.af-step.on{opacity:1}
.af-step.cur{background:none}
.af-step .no{flex:0 0 28px;height:28px;border-radius:50%;background:var(--af-ink);color:#fff;font:700 12px/28px 'JetBrains Mono',monospace;text-align:center}
.af-step .no{background:#efece5;color:var(--af-steel)} .af-step.on .no{background:#e3dfd5;color:var(--af-ink)} .af-step.cur .no{background:var(--af-ink);color:#fff}
.af-step .tt{font-size:15px;font-weight:600;letter-spacing:-.01em}
.af-step .dd{font-size:13px;color:var(--af-steel);margin-top:2px;line-height:1.45}
.af-why{font-size:14px;line-height:1.55;color:var(--af-steel);border-top:1px solid #e8e5de;padding:12px 2px 0}
.af-why b{color:var(--af-ink);font-weight:700}
.af-cap{grid-column:1/-1;font:500 11px/1.5 'JetBrains Mono','Gowun Batang',monospace;color:var(--af-soft);letter-spacing:.02em}
.af-eqn{font-family:'Google Sans','Gowun Batang',serif;font-weight:700;font-size:22px;display:inline-flex;align-items:center;gap:.2em;white-space:nowrap}
.af-frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1.1;margin:0 .06em;font-size:.8em}
.af-frac .fn{padding:0 .12em .04em;border-bottom:.06em solid currentColor}
.af-frac .fd{padding:.04em .12em 0}
.af-rows>div{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--af-hair);padding:7px 0;font-size:13px;color:var(--af-steel)}
.af-rows b{font-family:'JetBrains Mono',monospace;color:var(--af-ink);white-space:nowrap}
.af-bar{height:10px;border-radius:6px;background:var(--af-hair);overflow:hidden;margin-top:6px}
.af-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b8a4ed,#7a5fd1);border-radius:6px;transition:width .08s}
.af-link{display:inline-flex;align-items:center;gap:6px;font:600 12.5px 'Google Sans','Gowun Batang',serif;color:var(--af-ink);text-decoration:none;border:1px solid var(--af-hair);background:#fff;border-radius:999px;padding:7px 14px;align-self:flex-start}
.af-link:hover{border-color:var(--af-soft)}
@media (max-width:520px){ .af-ro{grid-template-columns:repeat(2,minmax(0,1fr))} .af-big{font-size:28px} }
.af-stage.sq{max-width:440px;width:100%;justify-self:center}
@media (max-width:1100px){ .af > .af-stage{justify-self:center;width:100%;max-width:660px} .af > .af-stage.sq{max-width:420px} }
/* layout guard for existing content: wide display equations / tables scroll inside their own box
   instead of pushing the reading panel sideways (phone widths) */
#detail mjx-container[display="true"]{display:block;max-width:100%;overflow-x:auto;overflow-y:hidden}
#detail .eq-block{max-width:100%;overflow-x:auto}
@media (max-width:860px){ #detail table{display:block;max-width:100%;overflow-x:auto} }
@media (max-width:640px){

  header > div{min-width:0}

}

function setLang(l) {
  lang = l;
  document.body.setAttribute('data-lang', l);
  document.getElementById('btnKo').classList.toggle('active-lang', l === 'ko');
  document.getElementById('btnEn').classList.toggle('active-lang', l === 'en');
  const T = UI[lang];
  document.getElementById('hTitle').textContent = T.hTitle;
  document.getElementById('eraAll').textContent    = T.eraAll;
  document.getElementById('eraUni').textContent    = T.eraUni;
  document.getElementById('eraElec').textContent   = T.eraElec;
  document.getElementById('eraPlasma').textContent = T.eraPlasma;
  document.getElementById('eraHigh').textContent   = T.eraHigh;
  buildSidebar(currentEraFilter);
  if (currentId) {
    const slide = getSLIDES().find(s => s.id === currentId);
    if (slide) renderDetail(slide);
  } else {

// ─────────────────────────────────────────────
//  SIDEBAR BUILD
// ─────────────────────────────────────────────
const eraColors = {
  universe: { tag: '#1565C0', tagBg: '#E3F2FD', tagBorder: '#90CAF9' },
  electron: { tag: '#0F8C50', tagBg: '#E5F4EC', tagBorder: '#cbeadd' },
  plasma:   { tag: '#E87B1E', tagBg: '#FEF0E3', tagBorder: '#F5C990' },
  high:     { tag: '#B71C1C', tagBg: '#FFEBEE', tagBorder: '#EF9A9A' }
};

function buildSidebar(filter) {
  currentEraFilter = filter;
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = '';
  const T = UI[lang];
  const SLIDES = getSLIDES();
  const eras = ['universe', 'electron', 'plasma', 'high'];

  eras.forEach(eraId => {
    const slides = SLIDES.filter(s => s.era === eraId && (filter === 'all' || filter === eraId));
    if (slides.length === 0) return;

    const grp = document.createElement('div');
    grp.className = 'era-group';

    const hdr = document.createElement('div');
    hdr.className = 'era-header';
    hdr.innerHTML = `
      <span class="era-label" style="color:${eraColors[eraId].tag}">${T.eraLabels[eraId]}</span>
      <span class="era-line"></span>
      <span class="era-range">${T.eraRanges[eraId]}</span>
      <span class="era-toggle">▾</span>
    `;
    grp.appendChild(hdr);

    const cardsWrap = document.createElement('div');
    cardsWrap.className = 'era-cards';
    const ec = eraColors[eraId];

    slides.forEach(slide => {
      const card = document.createElement('div');
      card.className = 'sci-card' + (currentId === slide.id ? ' active' : '');
      card.id = `card-${slide.id}`;
      const tagHtml = slide.tags.slice(0,3).map(t =>
        `<span class="sci-tag" style="background:${ec.tagBg};color:${ec.tag};border:1px solid ${ec.tagBorder}">${t}</span>`
      ).join('');
      card.innerHTML = `
        <div class="sci-year">${slide.chapter}</div>
        <div class="sci-info">
          <div class="sci-name">${slide.nameKr}</div>
          <div class="sci-nation">${slide.period}</div>
          <div class="sci-tags">${tagHtml}</div>
        </div>
      `;
      card.addEventListener('click', () => selectSlide(slide.id));
      cardsWrap.appendChild(card);
    });

    hdr.addEventListener('click', () => {
      const isCollapsed = cardsWrap.classList.toggle('collapsed');
      hdr.classList.toggle('collapsed', isCollapsed);
    });

    grp.appendChild(cardsWrap);
    sidebar.appendChild(grp);
  });
}

// ─────────────────────────────────────────────
//  SLIDE SELECTION
// ─────────────────────────────────────────────
function selectSlide(id) {
  document.querySelectorAll('.sci-card').forEach(c => c.classList.remove('active'));
  const SLIDES = getSLIDES();
  const slide = SLIDES.find(s => s.id === id);
  if (!slide) return;
  currentId = id;
  const card = document.getElementById(`card-${id}`);
  if (card) {
    const wrap = card.closest('.era-cards');
    if (wrap && wrap.classList.contains('collapsed')) {
      wrap.classList.remove('collapsed');
      wrap.previousElementSibling?.classList.remove('collapsed');
    }
    card.classList.add('active');
    card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  renderDetail(slide);
}

function openImgPopup(src, caption) {
  const overlay = document.getElementById('imgPopupOverlay');
  const img     = document.getElementById('imgPopupImg');
  const cap     = document.getElementById('imgPopupCaption');
  img.src = src;
  img.alt = caption || '';
  cap.textContent = caption || '';
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeImgPopup(e) {
  if (e && e.target === document.getElementById('imgPopupInner')) return;
  document.getElementById('imgPopupOverlay').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeImgPopup();
});

<!-- AF-KIT:JS -->
<script id="af-kit-js">
/* ============ Benedu animated-figure kit (ported from Basic Course ch02–05) ============
   A figure is <div class="af" data-af="NAME"></div>. AF.B[NAME](box) fills the box and
   returns {draw(dt)}; one shared rAF loop draws figures that are on screen and drops
   figures whose box has left the DOM (the lecture re-renders the panel on every
   chapter / language change, so figures are rebuilt in the new language).            */
(function(){
  'use strict';
  var AF = window.AF = {B:{}, figs:[]};
  AF.ko = function(){ try { return lang === 'ko'; } catch(e){ return document.documentElement.lang === 'ko'; } };
  AF.L = function(en, ko){ return AF.ko() ? ko : en; };
  AF.cv = function(w, h, cls){
    var c = document.createElement('canvas'); c.width = w*2; c.height = h*2;
    if(cls) c.className = cls; c.style.aspectRatio = w + ' / ' + h; return c;
  };
  AF.chips = function(btns, fn){
    btns.forEach(function(b){ b.addEventListener('click', function(ev){ ev.stopPropagation();
      btns.forEach(function(x){ x.classList.toggle('on', x === b); }); fn(b); }); });
  };
  AF.q = function(box, sel){ return box.querySelector(sel); };
  AF.qa = function(box, sel){ return [].slice.call(box.querySelectorAll(sel)); };
  function vis(el){ var r = el.getBoundingClientRect(); return r.width > 0 && r.bottom > -40 && r.top < innerHeight + 40; }
  var last = performance.now();
  function loop(now){
    var dt = Math.min((now - last)/1000, 0.05); last = now;
    for(var i = AF.figs.length - 1; i >= 0; i--){
      var f = AF.figs[i];
      if(!f.el.isConnected){ AF.figs.splice(i, 1); continue; }
      if(vis(f.el)){ try { f.draw(dt); } catch(err){ console.error('[AF]', err); AF.figs.splice(i, 1); } }
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  AF.mount = function(root){
    [].forEach.call((root || document).querySelectorAll('[data-af]'), function(box){
      if(box._af) return; box._af = 1;
      var b = AF.B[box.dataset.af]; if(!b) return;
      var r = b(box); if(r && r.draw) AF.figs.push({el: box, draw: r.draw});
    });
  };
  var pending = false;
  var mo = new MutationObserver(function(){
    if(pending) return; pending = true;
    Promise.resolve().then(function(){ pending = false; AF.mount(document); });
  });
  function start(){ mo.observe(document.body, {childList: true, subtree: true}); AF.mount(document); }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

/* ============ ATOM STAGE (Basic Course ch03): Bohr atom + energy ladder ============ */
(function(){
  var L = AF.L, GS = '"Google Sans","Gowun Batang",sans-serif';
  function wlCol(nm){
    if(nm < 380) return 'rgb(185,162,255)';
    if(nm > 750) return 'rgb(255,127,102)';
    var r=0,g=0,b=0;
    if(nm<440){ r=-(nm-440)/60; b=1; } else if(nm<490){ g=(nm-440)/50; b=1; } else if(nm<510){ g=1; b=-(nm-510)/20; }
    else if(nm<580){ r=(nm-510)/70; g=1; } else if(nm<645){ r=1; g=-(nm-645)/65; } else { r=1; }
    var f = nm>700 ? .35+.65*(750-nm)/50 : nm<420 ? .35+.65*(nm-380)/40 : 1;
    function h(v){ return Math.round(255*Math.pow(Math.max(0,v*f),.8)); }
    return 'rgb('+h(r)+','+Math.max(h(g),40)+','+Math.max(h(b),40)+')';
  }
  function H_E(n){ return n===0 ? 0 : -13.6/(n*n); }
  function H_dE(a,b){ return Math.abs(H_E(a)-H_E(b)); }
  function H_lam(a,b){ return 1239.84/H_dE(a,b); }
  var H_NM = {'3-2':'Hα','4-2':'Hβ','5-2':'Hγ','6-2':'Hδ'};
  AF.wlCol = wlCol;

  function AtomStage(cv, P){
    var c = cv.getContext('2d'); c.scale(2,2);
    var W = cv.width/2, Hh = cv.height/2, PI = Math.PI;
    var S = {cur:1, ang:-.7, rad:0, ladY:0, alpha:1, busy:false, anim:null, photons:[], flashes:[], proj:null, arrow:null, timers:[], t:0};
    function rN(n){ return n===0 ? P.R*2.2 : P.R*(.14+.86*(n*n-1)/(P.N*P.N-1)); }
    function Y(e){ return P.ly0 + Math.sqrt(-e/13.6)*(P.ly1-P.ly0); }
    function ease(x){ x = Math.max(0,Math.min(1,x)); return x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2; }
    function wrap(x){ while(x>PI) x-=2*PI; while(x<=-PI) x+=2*PI; return x; }
    function period(Lm){ var k = Math.log(Math.max(90,Math.min(1900,Lm))/90)/Math.log(1900/90); return 6+20*k; }
    function rgba(col,a){ return col.replace('rgb(','rgba(').replace(')',','+a+')'); }
    var dust = []; for(var i=0;i<70;i++) dust.push([Math.random()*W, Math.random()*Hh, Math.random()*1.1+.3, Math.random()]);

    function set(n){
      S.timers=[]; S.anim=null; S.fp=null; S.photons=[]; S.flashes=[]; S.proj=null; S.arrow=null; S.busy=false; S.fade=0;
      S.cur=n; S.rad=rN(n); S.ladY=Y(H_E(n)); S.alpha=1;
    }
    function after(sec, fn){ S.timers.push({t:sec, fn:fn}); }

    function go(to, mode, cb, keep){
      if(S.busy || to===S.cur) return false;
      var from = S.cur, up = to===0 || to>from, Lm = H_lam(from,to), col = wlCol(Lm), d = H_dE(from,to);
      var r0 = S.rad, r1 = rN(to), y0 = S.ladY, y1 = to===0 ? P.ly0-30 : Y(H_E(to));
      var a0 = S.ang, da = wrap(PI - S.ang);
      S.busy = true; S.arrow = {y0:y0, y1:y1, p:0, col:col, d:d, L:Lm, up:up, coll:mode==='collision'};
      var t = 0, hit = false;
      if(up){
        var TA = .95, TR = to===0 ? 1.3 : .85;
        var hx = P.ax - r0, hy = P.ay;
        if(mode==='collision') S.proj = {x0:-24, y0:P.ay-100, x1:hx-4, y1:hy-2, tr:[], x:-24, y:P.ay-100, free:false};
        else S.photons.push({x0:-90, y0:hy, x1:hx-6, y1:hy, dur:TA, t:0, L:Lm, col:col, inb:true});
        S.anim = function(dt){
          t += dt;
          if(t < TA){ S.ang = a0 + da*ease(t/TA);
            if(S.proj){ var k0 = t/TA; S.proj.x = S.proj.x0+(S.proj.x1-S.proj.x0)*k0; S.proj.y = S.proj.y0+(S.proj.y1-S.proj.y0)*k0; }
            return; }
          if(!hit){ hit = true; S.ang = a0+da;
            S.flashes.push({x:P.ax+r0*Math.cos(S.ang), y:P.ay+r0*Math.sin(S.ang), t:0, col:mode==='collision' ? 'rgb(191,243,255)' : col, big:1});
            if(S.proj){ var dx = S.proj.x1-S.proj.x0, dy = S.proj.y1-S.proj.y0, m = Math.hypot(dx,dy), sp = .5*m/TA, th = Math.atan2(dy,dx)+.62;
              S.proj.free = true; S.proj.vx = Math.cos(th)*sp; S.proj.vy = Math.sin(th)*sp; }
          }
          var k = ease((t-TA)/TR);
          S.rad = r0+(r1-r0)*k; S.ladY = y0+(y1-y0)*k; S.arrow.p = k;
          if(to===0 && !keep) S.alpha = 1-Math.max(0,(k-.35)/.65);
          if(t >= TA+TR){
            S.anim = null; S.cur = to;
            if(to===0 && keep){ S.busy = false; cb && cb(); }
            else if(to===0){ after(1.5, function(){ S.cur = from; S.rad = rN(from); S.ladY = Y(H_E(from)); S.arrow = null; S.alpha = 0; S.fade = 1; S.busy = false; cb && cb(); }); }
            else { S.busy = false; cb && cb(); }
          }
        };
      } else {
        var TD = .8;
        S.anim = function(dt){
          t += dt;
          var k = ease(t/TD);
          S.ang = a0 + da*k; S.rad = r0+(r1-r0)*k; S.ladY = y0+(y1-y0)*k; S.arrow.p = k;
          if(t >= TD && !hit){ hit = true; S.cur = to;
            var ex = P.ax + r1*Math.cos(S.ang), ey = P.ay + r1*Math.sin(S.ang);
            S.flashes.push({x:ex, y:ey, t:0, col:col, big:1.25});
            S.photons.push({x0:ex-8, y0:ey, x1:-130, y1:ey, dur:(ex+122)/360, t:0, L:Lm, col:col});
          }
          if(t >= TD+.55){ S.anim = null; S.busy = false; cb && cb(); }
        };
      }
      return true;
    }

    function packet(ph){
      var k = ph.t/ph.dur, x = ph.x0+(ph.x1-ph.x0)*k, y = ph.y0+(ph.y1-ph.y0)*k;
      var th = Math.atan2(ph.y1-ph.y0, ph.x1-ph.x0), cs = Math.cos(th), sn = Math.sin(th), per = period(ph.L);
      var fade = Math.min(1, ph.t/.15); if(ph.inb) fade *= Math.min(1, (1-k)/.1);
      c.save(); c.globalCompositeOperation = 'lighter';
      for(var pass=0; pass<2; pass++){
        c.beginPath();
        for(var s=-58; s<=58; s+=1.2){
          var env = Math.exp(-(s*s)/(24*24)), off = 9*env*Math.sin(2*PI*s/per - S.t*9);
          var px = x + s*cs - off*sn, py = y + s*sn + off*cs;
          if(s===-58) c.moveTo(px,py); else c.lineTo(px,py);
        }
        c.strokeStyle = ph.col; c.lineCap = 'round';
        if(pass===0){ c.lineWidth = 9; c.globalAlpha = .16*fade; } else { c.lineWidth = 2.4; c.shadowColor = ph.col; c.shadowBlur = 14; c.globalAlpha = fade; }
        c.stroke();
      }
      c.shadowBlur = 0; c.globalCompositeOperation = 'source-over'; c.globalAlpha = fade;
      c.fillStyle = ph.col; c.font = '700 11px JetBrains Mono, monospace'; c.textAlign = 'center';
      c.fillText(Math.round(ph.L)+' nm'+(ph.L<380 ? ' · UV' : ph.L>750 ? ' · IR' : ''), Math.max(40,x), y-20);
      c.restore();
    }
    function glow(x,y,r,col,a){
      var g = c.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0, rgba(col,a)); g.addColorStop(1, rgba(col,0));
      c.fillStyle = g; c.beginPath(); c.arc(x,y,r,0,2*PI); c.fill();
    }

    function draw(dt){
      S.t += dt;
      var tms = S.timers; S.timers = [];
      tms.forEach(function(tm){ tm.t -= dt; if(tm.t<=0) tm.fn(); else S.timers.push(tm); });
      if(S.anim) S.anim(dt);
      else if(S.cur!==0) S.ang += 1.5*Math.pow(rN(1)/S.rad, .85)*dt;
      if(S.fade){ S.alpha = Math.min(1, S.alpha + dt*2); if(S.alpha>=1) S.fade = 0; }

      c.clearRect(0,0,W,Hh);
      dust.forEach(function(p){ c.fillStyle = 'rgba(200,225,255,'+(.08+.06*Math.sin(S.t*.7+p[3]*6))+')'; c.fillRect(p[0],p[1],p[2],p[2]); });
      for(var n=1;n<=P.N;n++){
        var r = rN(n), on = (n===S.cur && !S.busy);
        c.beginPath(); c.arc(P.ax,P.ay,r,0,2*PI);
        c.setLineDash(on ? [] : [2,5]); c.lineWidth = on ? 1.5 : 1;
        c.strokeStyle = on ? 'rgba(143,233,255,.6)' : 'rgba(170,205,255,.2)'; c.stroke(); c.setLineDash([]);
        c.fillStyle = on ? 'rgba(143,233,255,.95)' : 'rgba(220,235,255,.4)'; c.font = (on?'700 ':'500 ')+'10px JetBrains Mono, monospace'; c.textAlign = 'center';
        c.fillText(String(n), P.ax + r*Math.cos(-PI/4)+7, P.ay + r*Math.sin(-PI/4)-5);
      }
      c.save(); c.globalCompositeOperation = 'lighter'; glow(P.ax,P.ay,30,'rgb(255,170,90)',.42); c.restore();
      c.beginPath(); c.arc(P.ax,P.ay,8.5,0,2*PI); c.fillStyle = '#ffb067'; c.fill();
      c.beginPath(); c.arc(P.ax-2.5,P.ay-2.5,2.6,0,2*PI); c.fillStyle = 'rgba(255,255,255,.75)'; c.fill();
      c.fillStyle = 'rgba(255,200,150,.8)'; c.font = '700 10px JetBrains Mono, monospace'; c.textAlign = 'left'; c.fillText(S.cur===0 && !S.anim ? 'H⁺ ion' : 'p⁺', P.ax+12, P.ay-12);

      S.flashes = S.flashes.filter(function(f){ f.t += dt; var k = f.t/.6; if(k>=1) return false;
        c.save(); c.globalCompositeOperation = 'lighter'; glow(f.x,f.y,(8+46*k)*f.big,f.col,.85*(1-k));
        c.beginPath(); c.arc(f.x,f.y,(6+60*k)*f.big,0,2*PI); c.strokeStyle = f.col; c.globalAlpha = .6*(1-k); c.lineWidth = 1.5; c.stroke(); c.restore(); return true; });

      var ex = P.ax + S.rad*Math.cos(S.ang), ey = P.ay + S.rad*Math.sin(S.ang);
      if(S.fp){ ex = S.fp.x; ey = S.fp.y; S.fp.tr.unshift([ex,ey]); if(S.fp.tr.length>20) S.fp.tr.pop();
        c.save(); c.globalCompositeOperation = 'lighter';
        for(var q=1;q<S.fp.tr.length;q++){ c.beginPath(); c.moveTo(S.fp.tr[q-1][0],S.fp.tr[q-1][1]); c.lineTo(S.fp.tr[q][0],S.fp.tr[q][1]); c.strokeStyle = 'rgba(143,233,255,'+(.5*(1-q/S.fp.tr.length))+')'; c.lineWidth = 4*(1-q/S.fp.tr.length)+.5; c.stroke(); }
        c.restore(); }
      var hide = (S.cur===0 && !S.anim && !S.fp);
      if(S.alpha > 0 && !hide){
        c.save(); c.globalAlpha = S.alpha;
        if(!S.anim && !S.fp){
          for(var i=1;i<=14;i++){ var aa = S.ang - i*.045; c.beginPath(); c.arc(P.ax + S.rad*Math.cos(aa), P.ay + S.rad*Math.sin(aa), 3.6*(1-i/16), 0, 2*PI); c.fillStyle = 'rgba(143,233,255,'+(.3*(1-i/14))+')'; c.fill(); }
        }
        if(P.halo && S.cur>1 && !S.busy){ var pul = .5+.5*Math.sin(S.t*7);
          c.beginPath(); c.arc(ex,ey,12+5*pul,0,2*PI); c.strokeStyle = 'rgba(255,190,110,'+(.35+.4*pul)+')'; c.lineWidth = 1.6; c.stroke(); }
        c.globalCompositeOperation = 'lighter'; glow(ex,ey,20,'rgb(143,233,255)',.55); c.globalCompositeOperation = 'source-over';
        c.beginPath(); c.arc(ex,ey,6,0,2*PI); c.fillStyle = '#e9fbff'; c.fill();
        c.fillStyle = 'rgba(200,240,255,.85)'; c.font = '700 10px JetBrains Mono, monospace'; c.textAlign = 'center'; c.fillText('e⁻', ex, ey+19);
        c.restore();
      }
      if(S.proj){ var pj = S.proj;
        if(pj.free){ pj.x += pj.vx*dt; pj.y += pj.vy*dt; if(pj.x>W+30 || pj.y>Hh+30) S.proj = null; }
        if(S.proj){ pj.tr.unshift([pj.x,pj.y]); if(pj.tr.length>22) pj.tr.pop();
          c.save(); c.globalCompositeOperation = 'lighter';
          for(var j=1;j<pj.tr.length;j++){ c.beginPath(); c.moveTo(pj.tr[j-1][0],pj.tr[j-1][1]); c.lineTo(pj.tr[j][0],pj.tr[j][1]); c.strokeStyle = 'rgba(127,233,255,'+(.55*(1-j/pj.tr.length))+')'; c.lineWidth = 4*(1-j/pj.tr.length)+.5; c.stroke(); }
          glow(pj.x,pj.y,16,'rgb(127,233,255)',.6); c.restore();
          c.beginPath(); c.arc(pj.x,pj.y,4.5,0,2*PI); c.fillStyle = '#e9fbff'; c.fill();
          c.fillStyle = 'rgba(200,240,255,.85)'; c.font = '700 10px '+GS; c.textAlign = 'left'; c.fillText(pj.free ? L('e⁻ slower','e⁻ 느려짐') : L('e⁻ fast','빠른 e⁻'), pj.x+10, pj.y-8);
        }
      }
      S.photons = S.photons.filter(function(ph){ ph.t += dt; if(ph.t>=ph.dur) return false; packet(ph); return true; });

      var lx0 = P.lx0, lx1 = P.lx1;
      c.setLineDash([3,5]); c.strokeStyle = 'rgba(220,235,255,.3)'; c.lineWidth = 1;
      c.beginPath(); c.moveTo(lx0,P.ly0); c.lineTo(lx1,P.ly0); c.stroke(); c.setLineDash([]);
      c.font = '700 13px '+GS; c.textAlign = 'right'; c.fillStyle = 'rgba(220,235,255,.55)'; c.fillText('∞', lx0-8, P.ly0+4);
      c.font = '10.5px JetBrains Mono, monospace'; c.textAlign = 'left'; c.fillText('0 eV', lx1+8, P.ly0+4);
      for(var m=1;m<=P.N;m++){
        var y = Y(H_E(m)), on2 = (m===S.cur && !S.busy), ty = y+4 + (P.N>=6 ? (m===6 ? -3 : m===5 ? 3 : 0) : 0);
        c.beginPath(); c.moveTo(lx0,y); c.lineTo(lx1,y); c.lineWidth = on2 ? 3 : 2;
        c.strokeStyle = on2 ? 'rgba(143,233,255,.95)' : 'rgba(220,235,255,.42)'; c.stroke();
        c.font = (on2?'700 ':'500 ')+'11.5px '+GS; c.textAlign = 'right'; c.fillStyle = on2 ? '#bff3ff' : 'rgba(220,235,255,.6)'; c.fillText('n='+m, lx0-8, ty);
        c.font = '10.5px JetBrains Mono, monospace'; c.textAlign = 'left'; c.fillStyle = 'rgba(220,235,255,.45)'; c.fillText(H_E(m).toFixed(2), lx1+8, ty);

      var lo = s===1 ? H*0.40 : M, jit = 1 + e*0.10;

        if(p.el){ var q = p.el; q.x += q.vx*dt; q.y += q.vy*dt;
          if(q.x<M+4){ q.x=M+4; q.vx=Math.abs(q.vx);} if(q.x>W-M-4){ q.x=W-M-4; q.vx=-Math.abs(q.vx);} if(q.y<M+4){ q.y=M+4; q.vy=Math.abs(q.vy);} if(q.y>H-M-4){ q.y=H-M-4; q.vy=-Math.abs(q.vy);} }
      });
      P.forEach(function(p){

        if(p.ion){ cx.strokeStyle = '#fff'; cx.lineWidth = 2; cx.beginPath(); cx.moveTo(p.x-4,p.y); cx.lineTo(p.x+4,p.y); cx.moveTo(p.x,p.y-4); cx.lineTo(p.x,p.y+4); cx.stroke(); }
      });
      P.forEach(function(p){ if(p.el){ cx.beginPath(); cx.arc(p.el.x,p.el.y,3.6,0,6.283); cx.fillStyle = '#1a3a3a'; cx.fill(); } });
    }
    upd();
    return {draw:draw};
  };
