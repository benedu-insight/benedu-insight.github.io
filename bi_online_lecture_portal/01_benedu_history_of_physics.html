<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>물리학의 역사 — Benedu Insight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;800&family=Gowun+Batang:wght@400;700&family=JetBrains+Mono:wght@400;500&family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/benedu-insight/benedu-insight.github.io/refs/heads/main/logo_png/benedu_insight_Symbol.png">
<style id="font-override">
  /* EN 모드: 모든 요소에 Google Sans 적용 */
  body[data-lang="en"],
  body[data-lang="en"] * {
    font-family: 'Google Sans', 'Segoe UI', system-ui, sans-serif !important;
  }
  /* 모노스페이스 요소는 그대로 유지 */
  body[data-lang="en"] header p,
  body[data-lang="en"] .lang-btn,
  body[data-lang="en"] .era-btn,
  body[data-lang="en"] .toolbar-btn,
  body[data-lang="en"] #scale-indicator,
  body[data-lang="en"] .era-range,
  body[data-lang="en"] .sci-year,
  body[data-lang="en"] .sci-tag,
  body[data-lang="en"] .detail-era-tag,
  body[data-lang="en"] .detail-meta,
  body[data-lang="en"] .quote-attr,
  body[data-lang="en"] .section-title,
  body[data-lang="en"] .eq-block,
  body[data-lang="en"] .theory-year,
  body[data-lang="en"] code,
  body[data-lang="en"] pre {
    font-family: 'JetBrains Mono', 'Fira Mono', monospace !important;
  }
  /* Montserrat 제목류는 Google Sans로 통일 */
  body[data-lang="en"] header h1,
  body[data-lang="en"] .detail-name,
  body[data-lang="en"] .theory-name,
  body[data-lang="en"] .era-label,
  body[data-lang="en"] h1,
  body[data-lang="en"] h2,
  body[data-lang="en"] h3 {
    font-family: 'Google Sans', 'Segoe UI', system-ui, sans-serif !important;
  }
</style>
<style>
  :root {
    --bg:          #F7F8FA;
    --bg2:         #FFFFFF;
    --bg3:         #F0E6F6;
    --bg4:         #E5F4EC;
    --green:       #0F8C50;
    --green-soft:  #E5F4EC;
    --green-mid:   #cbeadd;
    --green-dark:  #0a6b3d;
    --purple:      #7030A0;
    --purple-soft: #F0E6F6;
    --purple-mid:  #d9b8ed;
    --purple-dark: #521a78;
    --charcoal:    #2D2D2D;
    --text:        #2D2D2D;
    --text2:       #6B7280;
    --text3:       #9CA3AF;
    --border:      #E5E7EB;
    --border2:     #F3F4F6;
    --shadow:      0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md:   0 4px 12px rgba(0,0,0,0.08);
    --max-w:       1400px;
    --scale:       1.0; /* 텍스트 크기 동적 배율 제어 변수 */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Gowun Batang', serif;
    min-height: 100vh;
    width: 100%;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── Header ── */
  header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 0.75rem 1.75rem;
    display: flex;
    align-items: center;
    gap: 1.25rem;
    box-shadow: var(--shadow);
    width: 100%;
    max-width: var(--max-w);
  }
  .header-logo {
    height: 52px;
    width: auto;
    flex-shrink: 0;
  }
  .header-divider {
    width: 1px;
    height: 36px;
    background: var(--border);
    flex-shrink: 0;
  }
  .header-title-block { flex: 1; min-width: 0; }
  header h1 {
    font-family: 'Google Sans', 'Gowun Batang', sans-serif;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--purple);
    letter-spacing: 0.02em;
    line-height: 1.2;
  }
  header p {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    color: var(--text3);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 2px;
  }
  .lang-toggle {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    background: var(--bg);
  }
  .lang-btn {
    padding: 3px 12px;
    border: none;
    background: transparent;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem;
    font-weight: 500;
    color: var(--text3);
    transition: all 0.2s;
  }
  .lang-btn.active-lang {
    background: var(--purple);
    color: #fff;
  }
  .era-filter {
    margin-left: auto;
    display: flex;
    gap: 0.4rem;
    flex-wrap: wrap;
    align-items: center;
  }
  .era-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text2);
    font-family: 'Gowun Batang', serif;
    font-size: 0.78rem;
    padding: 4px 14px;
    cursor: pointer;
    transition: all 0.18s;
  }
  .era-btn:hover {
    border-color: var(--purple-mid);
    color: var(--purple);
    background: var(--purple-soft);
  }
  .era-btn.active {
    background: var(--purple);
    border-color: var(--purple);
    color: #fff;
  }

  /* ── Layout ── */
  .layout {
    display: grid;
    grid-template-columns: 300px 1fr;
    height: calc(100vh - 72px);
    width: 100%;
    max-width: var(--max-w);
  }

  /* ── Timeline Sidebar ── */
  .timeline-sidebar {
    border-right: 1px solid var(--border);
    overflow-y: auto;
    background: var(--bg2);
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .timeline-sidebar::-webkit-scrollbar { width: 4px; }
  .timeline-sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .era-header {
    position: sticky;
    top: 0;
    background: var(--bg2);
    padding: 0.75rem 1rem 0.5rem;
    border-bottom: 1px solid var(--border2);
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .era-label {
    font-family: 'Gowun Batang', serif;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.06em;
  }
  .era-line { flex: 1; height: 1px; background: var(--border); }
  .era-range {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.58rem;
    color: var(--text3);
    letter-spacing: 0.06em;
  }

  /* ── 접기/펼치기 토글 ── */
  .era-header {
    cursor: pointer;
    user-select: none;
  }
  .era-header:hover { background: var(--bg); }
  .era-toggle {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--border2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.6rem;
    color: var(--text3);
    transition: background 0.15s, transform 0.22s;
  }
  .era-header.collapsed .era-toggle {
    transform: rotate(-90deg);
  }
  .era-header:hover .era-toggle {
    background: var(--border);
    color: var(--text2);
  }
  .era-cards {
    overflow: hidden;
    max-height: 2000px;
    transition: max-height 0.3s ease, opacity 0.25s ease;
    opacity: 1;
  }
  .era-cards.collapsed {
    max-height: 0;
    opacity: 0;
  }

  /* Scientist card in sidebar */
  .sci-card {
    padding: 0.7rem 1rem 0.7rem 1.1rem;
    border-bottom: 1px solid var(--border2);
    cursor: pointer;
    position: relative;
    transition: background 0.15s;
    display: flex;
    gap: 0.7rem;
    align-items: flex-start;
    border-left: 3px solid transparent;
  }
  .sci-card:hover { background: var(--bg); }
  .sci-card.active { background: var(--purple-soft); border-left-color: var(--purple); }

  .sci-year {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    color: var(--text3);
    min-width: 30px;
    padding-top: 2px;
    line-height: 1.4;
  }
  .sci-info { flex: 1; min-width: 0; }
  .sci-name {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--charcoal);
    line-height: 1.3;
  }
  .sci-card.active .sci-name { color: var(--purple-dark); }
  .sci-nation {
    font-size: 0.68rem;
    color: var(--text3);
    margin-top: 1px;
    font-family: 'Gowun Batang', serif;
  }
  .sci-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
    margin-top: 4px;
  }
  .sci-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.56rem;
    padding: 1px 6px;
    border-radius: 8px;
    letter-spacing: 0.03em;
  }

  /* ── Detail Panel Layout & Sticky Toolbar ── */
  .detail-panel {
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
  }
  
  /* Sticky Reading Toolbar */
  .content-toolbar {
    position: sticky;
    top: 0;
    background: rgba(247, 248, 250, 0.95);
    backdrop-filter: blur(8px);
    padding: 0.6rem 2.25rem;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 0.55rem;
    border-bottom: 1px solid var(--border);
    z-index: 10;
  }
  .toolbar-btn {
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg2);
    color: var(--text);
    padding: 4px 10px;
    font-size: 0.72rem;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    transition: all 0.15s;
  }
  .toolbar-btn:hover {
    border-color: var(--purple-mid);
    background: var(--purple-soft);
    color: var(--purple-dark);
  }
  .toolbar-btn:active {
    transform: scale(0.95);
  }

  #detail {
    flex: 1;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  #detail::-webkit-scrollbar { width: 4px; }
  #detail::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .detail-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 1rem;
    color: var(--text3);
  }
  .detail-empty .icon-ring {
    width: 72px; height: 72px;
    border: 10px solid var(--green-mid);
    border-radius: 50%;
  }
  .detail-empty p {
    font-size: 0.8rem;
    letter-spacing: 0.06em;
    color: var(--text3);
    font-family: 'Gowun Batang', serif;
  }

  .detail-content { padding: 2rem 2.25rem 4rem; max-width: 780px; }

  /* Hero section with Dynamic Font-scaling support */
  .detail-hero {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.75rem 2rem;
    margin-bottom: 1.5rem;
    box-shadow: var(--shadow);
  }
  .detail-era-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 0.6rem;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 3px 10px;
    border-radius: 12px;
    font-weight: 500;
  }
  .detail-name {
    font-family: 'Google Sans', 'Montserrat', sans-serif;
    font-size: calc(2rem * var(--scale));
    font-weight: 800;
    line-height: 1.1;
    color: var(--purple);
    margin-bottom: 0.15rem;
    transition: font-size 0.15s ease-out;
  }
  .detail-name-kr {
    font-family: 'Gowun Batang', serif;
    font-size: calc(1rem * var(--scale));
    color: var(--text2);
    margin-bottom: 0.75rem;
    font-weight: 400;
    transition: font-size 0.15s ease-out;
  }
  .detail-meta {
    display: flex;
    gap: 1.25rem;
    flex-wrap: wrap;
    font-family: 'JetBrains Mono', monospace;
    font-size: calc(0.68rem * var(--scale));
    color: var(--text2);
    padding-top: 0.75rem;
    border-top: 1px solid var(--border2);
    transition: font-size 0.15s ease-out;
  }

  /* Timeline bar */
  .life-bar-wrap {
    margin-top: 1rem;
    padding: 0.75rem 1rem;
    background: var(--bg);
    border-radius: 8px;
    border: 1px solid var(--border2);
  }
  .life-bar-labels {
    display: flex;
    justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.58rem;
    color: var(--text3);
    margin-bottom: 5px;
  }
  .life-bar {
    position: relative;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
  }

  /* Quote */
  .quote-block {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.1rem;
    margin-bottom: 1.25rem;
    box-shadow: var(--shadow);
  }
  .quote-badge {
    flex: none;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--green-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    margin-top: 2px;
  }
  .quote-body { flex: 1; min-width: 0; }
  .quote-text {
    font-family: 'Gowun Batang', serif;
    font-style: italic;
    font-size: calc(0.9rem * var(--scale));
    color: var(--green-dark);
    line-height: 1.78;
    transition: font-size 0.15s ease-out;
  }
  .quote-attr {
    font-family: 'JetBrains Mono', monospace;
    font-size: calc(0.6rem * var(--scale));
    color: var(--text3);
    margin-top: 0.45rem;
    letter-spacing: 0.06em;
    transition: font-size 0.15s ease-out;
  }

  /* Bio */
  .detail-bio {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem 1.5rem;
    font-size: calc(0.9rem * var(--scale));
    line-height: 1.9;
    color: var(--text);
    margin-bottom: 1.5rem;
    box-shadow: var(--shadow);
    transition: font-size 0.15s ease-out;
  }
  .detail-bio p + p { margin-top: 0.85em; }

  /* Section titles */
  .section-title {
    font-family: 'Gowun Batang', serif;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 0.85rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* Equations */
  .eq-block {
    background: var(--charcoal);
    border-radius: 8px;
    padding: 0.75rem 1.25rem;
    margin-bottom: 0.5rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: calc(0.88rem * var(--scale));
    color: #a8f5c8;
    letter-spacing: 0.04em;
    transition: font-size 0.15s ease-out;
  }

  /* Theory cards */
  .theories-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 0.75rem;
    margin-bottom: 1.5rem;
  }
  .theory-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.1rem;
    transition: box-shadow 0.18s, border-color 0.18s;
    box-shadow: var(--shadow);
  }
  .theory-card:hover {
    box-shadow: var(--shadow-md);
    border-color: var(--purple-mid);
  }
  .theory-year {
    font-family: 'JetBrains Mono', monospace;
    font-size: calc(0.6rem * var(--scale));
    letter-spacing: 0.06em;
    margin-bottom: 0.3rem;
    color: var(--green);
    font-weight: 500;
    transition: font-size 0.15s ease-out;
  }
  .theory-name {
    font-size: calc(0.84rem * var(--scale));
    font-weight: 700;
    color: var(--charcoal);
    margin-bottom: 0.35rem;
    line-height: 1.3;
    transition: font-size 0.15s ease-out;
  }
  .theory-desc {
    font-size: calc(0.74rem * var(--scale));
    color: var(--text2);
    line-height: 1.65;
    font-family: 'Gowun Batang', serif;
    transition: font-size 0.15s ease-out;
  }

  /* Connections */
  .conn-list { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-bottom: 2rem; }
  .conn-chip {
    background: var(--purple-soft);
    border: 1px solid var(--purple-mid);
    border-radius: 20px;
    padding: 4px 14px;
    font-size: calc(0.76rem * var(--scale));
    color: var(--purple-dark);
    cursor: pointer;
    transition: all 0.15s;
    font-family: 'Gowun Batang', serif;
  }
  .conn-chip:hover {
    background: var(--purple);
    border-color: var(--purple);
    color: #fff;
  }
  .conn-chip:disabled {
    background: var(--border2);
    border-color: var(--border);
    color: var(--text3);
    cursor: default;
    opacity: 0.6;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .layout { grid-template-columns: 1fr; grid-template-rows: 42vh 1fr; height: auto; }
    header { padding: 0.6rem 1rem; flex-wrap: wrap; gap: 0.6rem; }
    .header-logo { height: 38px; }
    .header-divider { display: none; }
    header h1 { font-size: 1.15rem; }
    .era-filter { width: 100%; }
    .detail-content { padding: 1.25rem 1rem 3rem; }
    .detail-name { font-size: 1.5rem; }
  }
</style>
</head>
<body>

<header>
<!-- 로고 클릭 시 베네두 인사이트 홈페이지로 새 창 이동 지원 -->
  <a href="https://benedu-insight.github.io/" target="_blank" rel="noopener noreferrer" style="display: inline-flex; align-items: center; text-decoration: none;">
    <img class="header-logo"
      src="https://benedu-insight.github.io/logo_png/benedu_insight_logo_EN_vertical.png"
      alt="Benedu Insight"
      style="cursor: pointer;">
  </a>
  <div class="header-divider"></div>
  <div class="header-title-block">
    <h1 id="hTitle">물리학의 역사</h1>
    <p id="hSubtitle">The Map of Physics — 과학자 일대기 &amp; 이론 탐구</p>
  </div>
  <div class="lang-toggle">
    <button class="lang-btn active-lang" onclick="setLang('ko')" id="btnKo">KO</button>
    <button class="lang-btn" onclick="setLang('en')" id="btnEn">EN</button>
  </div>
  <div class="era-filter">
    <button class="era-btn active" data-era="all" id="eraAll">전체</button>
    <button class="era-btn" data-era="ancient" id="eraAncient">고대·중세</button>
    <button class="era-btn" data-era="classical" id="eraClassical">고전역학</button>
    <button class="era-btn" data-era="modern" id="eraModern">근대물리</button>
    <button class="era-btn" data-era="quantum" id="eraQuantum">양자혁명</button>
    <button class="era-btn" data-era="contemp" id="eraContemp">현대물리</button>
  </div>
</header>

<div class="layout">
  <div class="timeline-sidebar" id="sidebar"></div>
  <div class="detail-panel">
    <!-- Sticky Reading Toolbar for dynamic sizing -->
    <div class="content-toolbar">
      <span id="fontSizeLabel" style="font-family: 'Gowun Batang', serif; font-size: 0.75rem; color: var(--text2); font-weight: bold; margin-right: auto; display: flex; align-items: center; gap: 5px;">
        🔍 본문 글자 크기
      </span>
      <button class="toolbar-btn" onclick="adjustScale(-0.1)" id="btnScaleDown" title="작게">- 작게</button>
      <span id="scale-indicator" style="font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; color: var(--purple); font-weight: bold; min-width: 45px; text-align: center;">100%</span>
      <button class="toolbar-btn" onclick="adjustScale(0.1)" id="btnScaleUp" title="크게">+ 크게</button>
      <button class="toolbar-btn" onclick="adjustScale(0)" id="btnScaleReset" title="기본 크기로 초기화" style="border-color: var(--purple-mid); color: var(--purple);">초기화</button>
    </div>

    <div id="detail">
      <div class="detail-empty">
        <div class="icon-ring"></div>
        <p id="emptyMsg">과학자를 선택하세요</p>
      </div>
    </div>
  </div>
</div>

<script>
let lang = 'ko';
let currentEraFilter = 'all';

//  UI 텍스트 / UI Text
const UI = {
  ko: {

function getSCIENTISTS() {
  return lang === 'ko' ? SCIENTISTS_KO : SCIENTISTS_EN;
}

function setLang(l) {
  lang = l;
  document.body.setAttribute('data-lang', l);
  document.getElementById('btnKo').classList.toggle('active-lang', l === 'ko');
  document.getElementById('btnEn').classList.toggle('active-lang', l === 'en');

  const T = UI[l];
  document.getElementById('hTitle').textContent = T.hTitle;
  document.getElementById('hSubtitle').innerHTML = T.hSubtitle;
  document.getElementById('eraAll').textContent = T.eraAll;
  document.getElementById('eraAncient').textContent = T.eraAncient;
  document.getElementById('eraClassical').textContent = T.eraClassical;
  document.getElementById('eraModern').textContent = T.eraModern;
  document.getElementById('eraQuantum').textContent = T.eraQuantum;
  document.getElementById('eraContemp').textContent = T.eraContemp;
  document.getElementById('fontSizeLabel').innerHTML = T.fontSizeLabel;
  document.getElementById('btnScaleDown').textContent = T.btnScaleDown;
  document.getElementById('btnScaleUp').textContent = T.btnScaleUp;
  document.getElementById('btnScaleReset').textContent = T.btnScaleReset;
  const emptyMsgEl = document.getElementById('emptyMsg');
  if (emptyMsgEl) emptyMsgEl.textContent = T.emptyMsg;

  buildSidebar(currentEraFilter);
  if (currentId) {
    const sci = getSCIENTISTS().find(s => s.id === currentId);
    if (sci) {
      renderDetail(sci);
      const card = document.getElementById(`card-${currentId}`);
      if (card) card.classList.add('active');
    }
  } else {
    document.getElementById('detail').innerHTML = `
      <div class="detail-empty">
        <div class="icon-ring"></div>
        <p id="emptyMsg">${T.emptyMsg}</p>
      </div>
    `;
  }
}

// Build sidebar
function buildSidebar(filter) {
  currentEraFilter = filter;
  const T = UI[lang];
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = '';

  const eras = [
    { id: 'ancient',   label: T.eraLabels.ancient,   range: T.eraRanges.ancient },
    { id: 'classical', label: T.eraLabels.classical, range: T.eraRanges.classical },
    { id: 'modern',    label: T.eraLabels.modern,    range: T.eraRanges.modern },
    { id: 'quantum',   label: T.eraLabels.quantum,   range: T.eraRanges.quantum },
    { id: 'contemp',   label: T.eraLabels.contemp,   range: T.eraRanges.contemp },
  ];

  const eraColors = {
    ancient:   { tag: '#7030A0', tagBg: '#F0E6F6', tagBorder: '#d9b8ed' },
    classical: { tag: '#0F8C50', tagBg: '#E5F4EC', tagBorder: '#cbeadd' },
    modern:    { tag: '#7030A0', tagBg: '#F0E6F6', tagBorder: '#d9b8ed' },
    quantum:   { tag: '#0F8C50', tagBg: '#E5F4EC', tagBorder: '#cbeadd' },
    contemp:   { tag: '#7030A0', tagBg: '#F0E6F6', tagBorder: '#d9b8ed' },
  };

  const eraLabelColors = {
    ancient:   '#7030A0',
    classical: '#0F8C50',
    modern:    '#7030A0',
    quantum:   '#0F8C50',
    contemp:   '#7030A0',
  };

  const SCIENTISTS = getSCIENTISTS();

  eras.forEach(era => {
    const scientists = SCIENTISTS
      .filter(s => s.era === era.id && (filter === 'all' || filter === era.id))
      .sort((a, b) => a.born - b.born);
    if (scientists.length === 0) return;

    const grp = document.createElement('div');
    grp.className = 'era-group';

    const hdr = document.createElement('div');
    hdr.className = 'era-header';
    hdr.innerHTML = `
      <span class="era-label" style="color:${eraLabelColors[era.id]}">${era.label}</span>
      <span class="era-line"></span>
      <span class="era-range">${era.range}</span>
      <span class="era-toggle">▾</span>
    `;
    grp.appendChild(hdr);

    // Cards container (collapsible)
    const cardsWrap = document.createElement('div');
    cardsWrap.className = 'era-cards';

    const ec = eraColors[era.id];

    scientists.forEach(sci => {
      const card = document.createElement('div');
      card.className = 'sci-card';
      card.id = `card-${sci.id}`;

      const tagHtml = sci.tags.slice(0,3).map(t =>
        `<span class="sci-tag" style="background:${ec.tagBg};color:${ec.tag};border:1px solid ${ec.tagBorder}">${t}</span>`
      ).join('');

      card.innerHTML = `
        <div class="sci-year">${sci.birthYear}</div>
        <div class="sci-info">
          <div class="sci-name">${sci.name}</div>
          <div class="sci-nation">${sci.nameKr} · ${sci.nation}</div>
          <div class="sci-tags">${tagHtml}</div>
        </div>
      `;
      card.addEventListener('click', () => selectScientist(sci.id));
      cardsWrap.appendChild(card);
    });

    // Toggle collapse
    hdr.addEventListener('click', () => {
      const isCollapsed = cardsWrap.classList.toggle('collapsed');
      hdr.classList.toggle('collapsed', isCollapsed);
    });

    grp.appendChild(cardsWrap);
    sidebar.appendChild(grp);
  });
}

let currentId = null;

function selectScientist(id) {
  document.querySelectorAll('.sci-card').forEach(c => c.classList.remove('active'));
  const sci = getSCIENTISTS().find(s => s.id === id);
  if (!sci) return;
  currentId = id;

  const card = document.getElementById(`card-${id}`);
  if (card) {
    // 접혀 있으면 자동 펼치기
    const wrap = card.closest('.era-cards');
    if (wrap && wrap.classList.contains('collapsed')) {
      wrap.classList.remove('collapsed');
      wrap.previousElementSibling?.classList.remove('collapsed');
    }
    card.classList.add('active');
    card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  renderDetail(sci);
}

function renderDetail(sci) {
  const panel = document.getElementById('detail');
  const T = UI[lang];

  const eraNames = T.eraNames;

  const eraTagStyle = {
    ancient:   'background:#F0E6F6;color:#521a78',
    classical: 'background:#E5F4EC;color:#0a6b3d',
    modern:    'background:#F0E6F6;color:#521a78',
    quantum:   'background:#E5F4EC;color:#0a6b3d',
    contemp:   'background:#F0E6F6;color:#521a78',
  };

  const theoriesHtml = sci.theories.map(t => `
    <div class="theory-card">
      <div class="theory-year">${t.year}</div>
      <div class="theory-name">${t.name}</div>
      <div class="theory-desc">${t.desc}</div>
    </div>
  `).join('');

  const equationsHtml = sci.equations.length
    ? `<div class="section-title">${T.sectionEq}</div>` +
      sci.equations.map(eq => `<div class="eq-block">${eq}</div>`).join('') +
      '<div style="margin-bottom:1.5rem"></div>'
    : '';

  const connectionsHtml = sci.connections.map(name => {
    const linked = getSCIENTISTS().find(s => s.name === name || s.nameKr === name);
    if (linked) {
      return `<button class="conn-chip" onclick="selectScientist('${linked.id}')">${name}</button>`;
    }
    return `<button class="conn-chip" disabled>${name}</button>`;
  }).join('');

  // Life timeline markers
  const lifeSpan = sci.died - sci.born;
  const markers = sci.theories.slice(0,5).map(t => {
    const yr = parseInt(t.year.replace('BC ', '-').replace(/[^0-9\-]/g, '')) || sci.born;
    const pct = lifeSpan > 0 ? Math.max(2, Math.min(98, (yr - sci.born) / lifeSpan * 100)) : 50;
    return `<div style="position:absolute;left:${pct.toFixed(1)}%;top:-3px;width:2px;height:10px;background:#7030A0;border-radius:1px" title="${t.name}"></div>`;
  }).join('');

  const bornLabel = sci.born < 0 ? 'BC ' + Math.abs(sci.born) : sci.born;
  const diedLabel = sci.died < 0 ? 'BC ' + Math.abs(sci.died) : sci.died;

  panel.innerHTML = `
    <div class="detail-content">
      <div class="detail-hero">
        <span class="detail-era-tag" style="${eraTagStyle[sci.era]}">${eraNames[sci.era]}</span>
        <div class="detail-name">${sci.name}</div>
        <div class="detail-name-kr">${sci.nameKr}</div>
        <div class="detail-meta">
          <span>📅 ${bornLabel} — ${diedLabel}</span>
          <span>📍 ${sci.nation}</span>
          <span>🔬 ${sci.field}</span>
        </div>
        <div class="life-bar-wrap">
          <div class="life-bar-labels">
            <span>${bornLabel}</span>
            <span style="color:#7030A0;font-size:0.55rem;letter-spacing:0.08em">${T.lifeBarLabel}</span>
            <span>${diedLabel}</span>
          </div>
          <div class="life-bar">
            <div style="position:absolute;inset:0;background:#E5F4EC;border-radius:2px"></div>
            ${markers}
          </div>
        </div>
      </div>

      ${sci.quote ? `
      <div class="quote-block">
        <div class="quote-badge">❝</div>
        <div class="quote-body">
          <div class="quote-text">${sci.quote}</div>
          <div class="quote-attr">${sci.quoteAttr}</div>
        </div>
      </div>` : ''}

      <div class="detail-bio">${sci.bio.split('\n\n').map(p => `<p>${p.trim()}</p>`).join('')}</div>

      ${equationsHtml}

      <div class="section-title">${T.sectionTheory}</div>
      <div class="theories-grid">${theoriesHtml}</div>

      ${sci.connections.length ? `
      <div class="section-title">${T.sectionConnections}</div>
      <div class="conn-list">${connectionsHtml}</div>
      ` : ''}
    </div>
  `;
  panel.scrollTop = 0;
}

// Global text scale control function
let currentScale = 1.0;
function adjustScale(amount) {
  if (amount === 0) {
    currentScale = 1.0;
  } else {
    // 글자 크기를 최소 0.8배에서 최대 1.5배까지 제한해 레이아웃 변형 방지
    currentScale = Math.max(0.8, Math.min(1.5, currentScale + amount));
  }
  document.documentElement.style.setProperty('--scale', currentScale);
  const scaleIndicator = document.getElementById('scale-indicator');
  if (scaleIndicator) {
    scaleIndicator.innerText = Math.round(currentScale * 100) + '%';
  }
}

// Era filter buttons
document.querySelectorAll('.era-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.era-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    buildSidebar(btn.dataset.era);
    if (currentId) {
      setTimeout(() => {
        const card = document.getElementById(`card-${currentId}`);
        if (card) card.classList.add('active');
      }, 30);
    }
  });
});

// Init
document.body.setAttribute('data-lang', 'ko'); // 초기 언어 설정 (KO)
buildSidebar('all');
setTimeout(() => selectScientist('aristotle'), 150);
</script>
