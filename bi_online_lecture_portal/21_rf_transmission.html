  body[data-lang="en"] .era-btn,
  body[data-lang="en"] .toolbar-btn,

  body[data-lang="en"] .detail-name,

<style>
  :root {
    --bg:          #F7F8FA;
    --bg2:         #FFFFFF;
    --bg3:         #F0E6F6;
    --bg4:         #E5F4EC;
    --card:        #F1EFEA;
    --card-hd:     #E7E4DD;
    --green:       #0F8C50;
    --green-soft:  #E5F4EC;
    --green-mid:   #cbeadd;
    --green-dark:  #0a6b3d;
    --purple:      #7030A0;
    --purple-soft: #F0E6F6;
    --purple-mid:  #d9b8ed;
    --purple-dark: #521a78;
    --plasma:      #E87B1E;
    --plasma-soft: #FEF0E3;
    --plasma-mid:  #F5C990;
    --plasma-dark: #A84F05;
    --charcoal:    #2D2D2D;
    --text:        #1A1A2E;
    --text2:       #5A5A7A;
    --text3:       #9CA3AF;
    --border:      #D8D5CE;
    --border2:     #F3F4F6;
    --shadow:      0 2px 12px rgba(0,0,0,0.08);
    --shadow-md:   0 4px 12px rgba(0,0,0,0.08);
    --radius:      12px;
    --font:        'Google Sans', 'Noto Sans KR', sans-serif;
    --mono:        'JetBrains Mono', monospace;
    --scale:       1.0;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; scroll-behavior: smooth; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    display: flex;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── SIDEBAR (fixed, full height — Module 02 style) ── */
  #sidebar {
    width: 260px;
    height: 100vh;
    background: #FFFFFF;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0; left: 0;
    overflow-y: auto;
    z-index: 100;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  #sidebar::-webkit-scrollbar { width: 4px; }
  #sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* ── Sidebar hide/show toggle ── */
  #sidebar {
    transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }
  #main, #top-logo-bar {
    transition: margin-left 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                left 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                max-width 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }
  body.sidebar-hidden #sidebar { transform: translateX(-260px); }
  body.sidebar-hidden #main   { margin-left: 0; max-width: 100vw; }
  body.sidebar-hidden #top-logo-bar { left: 0; }

  #sidebar-toggle {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    left: 260px;
    z-index: 200;
    width: 18px;
    height: 52px;
    background: #fff;
    border: 1px solid var(--border);
    border-left: none;
    border-radius: 0 8px 8px 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.65rem;
    color: var(--text3);
    box-shadow: 2px 0 6px rgba(0,0,0,0.06);
    transition: left 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                background 0.15s ease;
    padding: 0;
    line-height: 1;
    user-select: none;
  }
  #sidebar-toggle:hover { background: var(--purple-soft); color: var(--purple-dark); }
  body.sidebar-hidden #sidebar-toggle { left: 0; border-left: 1px solid var(--border); border-radius: 0 8px 8px 0; }

  /* Sidebar brand area */
  .sb-brand {
    padding: 20px 18px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .sb-brand img { height: 28px; width: auto; display: block; margin-bottom: 6px; object-fit: contain; }
  .sb-brand .logo-text {
    font-size: 0.78rem; font-weight: 700; color: var(--purple);
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  .sb-brand .module-tag { margin-top: 4px; font-size: 0.72rem; color: var(--text2); }

  /* Sidebar era header */
  .sb-era {
    padding: 10px 14px 6px;
    font-size: 0.65rem; font-weight: 700; color: var(--text2);
    text-transform: uppercase; letter-spacing: 0.08em;
  }
  .sb-era-bar {
    height: 3px; border-radius: 2px; margin: 4px 14px 8px;
    background: var(--purple); opacity: 0.3;
  }

  /* Sidebar nav items */
  .sb-item {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 9px 14px; cursor: pointer; border-radius: 8px;
    margin: 1px 8px; transition: background 0.15s; text-decoration: none;
  }
  .sb-item:hover { background: #F0EDF8; }
  .sb-item.active { background: #EDE7F6; }
  .sb-dot {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.65rem; font-family: var(--mono); font-weight: 600;
    flex-shrink: 0; margin-top: 1px;
  }
  .sb-label { font-size: 0.78rem; line-height: 1.35; color: var(--text); }
  .sb-sub { font-size: 0.68rem; color: var(--text2); margin-top: 2px; }

  /* Sidebar progress bar */
  .sb-progress {
    margin: 8px 14px 4px;
    height: 3px; background: var(--border); border-radius: 2px; overflow: hidden;
  }
  .sb-progress-fill { height: 100%; background: var(--purple); border-radius: 2px; transition: width 0.3s ease; }

  /* Sidebar lang + tools footer */
  .sb-footer {
    margin-top: auto; border-top: 1px solid var(--border); flex-shrink: 0;
  }
  .sb-lang { padding: 14px 16px; display: flex; gap: 8px; }
  .lang-btn {
    flex: 1; padding: 7px; border: 1.5px solid var(--border); border-radius: 8px;
    background: transparent; font-family: var(--font); font-size: 0.78rem;
    cursor: pointer; transition: all 0.15s; color: var(--text2);
  }
  .lang-btn.active-lang {
    background: var(--purple); border-color: var(--purple); color: #fff; font-weight: 600;
  }
  .sb-tools { padding: 0 16px 14px; display: flex; align-items: center; gap: 8px; }
  .toolbar-btn {
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg2); color: var(--text); padding: 4px 10px;
    font-size: 0.7rem; cursor: pointer; font-family: var(--mono);
    font-weight: 500; transition: all 0.15s;
  }
  .toolbar-btn:hover { border-color: var(--purple-mid); background: var(--purple-soft); color: var(--purple-dark); }
  #scale-indicator { font-family: var(--mono); font-size: 0.62rem; color: var(--text2); min-width: 36px; text-align: center; }

  /* ── TOP LOGO BAR (Module 02 style) ── */
  #top-logo-bar {
    position: fixed;
    top: 0; left: 260px; right: 0;
    height: 44px;
    background: #fff;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 0 28px;
    z-index: 150;
  }
  #top-logo-bar img { height: 22px; width: auto; object-fit: contain; opacity: 0.88; }

  /* ── MAIN CONTENT (Module 02 style) ── */
  #main {
    margin-left: 260px;
    flex: 1;
    padding: 64px 36px 48px;
    max-width: calc(100vw - 260px);
    min-height: 100vh;
  }

  /* ── Detail content wrapper ── */
  .detail-content { max-width: 900px; margin: 0 auto; }

  /* Detail Empty */
  .detail-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 60vh; gap: 1.2rem; color: var(--text3); }
  .icon-ring { width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--purple-mid); opacity: 0.4; }
  .detail-empty p { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.08em; }

  /* ── Legacy sidebar classes (kept for buildSidebar() compatibility) ── */
  .timeline-sidebar { display: none; } /* replaced by #sidebar */
  .sidebar-section-label { display: none; }
  .era-header { display: none; }
  .era-cards { display: contents; }
  .era-cards.collapsed { display: none; }
  .sci-card {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 9px 14px; cursor: pointer; border-radius: 8px;
    margin: 1px 8px; transition: background 0.15s;
  }
  .sci-card:hover { background: #F0EDF8; }
  .sci-card.active { background: #EDE7F6; }
  .sci-card.placeholder { opacity: 0.45; cursor: default; }
  .sci-card.placeholder:hover { background: transparent; }
  .sci-year {
    font-family: var(--mono); font-size: 0.6rem; color: var(--text3);
    min-width: 32px; padding-top: 2px; line-height: 1.4;
  }
  .sci-info { flex: 1; min-width: 0; }
  .sci-name { font-size: 0.8rem; font-weight: 700; color: var(--text); line-height: 1.3; }
  .sci-card.active .sci-name { color: var(--purple-dark); }
  .sci-nation { font-size: 0.62rem; color: var(--text2); margin-top: 1px; }
  .sci-tags { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
  .sci-tag { font-family: var(--mono); font-size: 0.52rem; padding: 1px 6px; border-radius: 8px; }

  /* ── Legacy detail-panel (now handled by #main) ── */
  .detail-panel { display: contents; }
  #detail { display: contents; }

  /* Detail Empty */
  .detail-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 60vh; gap: 1.2rem; color: var(--text3); }
  .icon-ring { width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--purple-mid); opacity: 0.4; }
  .detail-empty p { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.08em; }

  /* ── SLIDE HEADER (Module 02 style) ── */
  .slide-header { margin-bottom: 28px; }
  .slide-eyebrow {
    font-size: 0.72rem; font-weight: 700; color: var(--purple);
    letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px;
    font-family: var(--mono);
  }
  .slide-title { font-size: 1.9rem; font-weight: 700; color: var(--text); line-height: 1.2; font-family: var(--font); }
  .slide-title span { color: var(--purple); }
  .slide-subtitle { margin-top: 8px; font-size: 0.92rem; color: var(--text2); line-height: 1.5; font-family: var(--font); }

  /* Hero — remapped to slide-header style */
  .detail-hero { margin-bottom: 28px; }
  .detail-era-tag {
    font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.1em;
    text-transform: uppercase; margin-bottom: 6px; display: inline-block;
    font-weight: 700; color: var(--purple);
  }
  .detail-name {
    font-family: var(--font); font-size: calc(1.9rem * var(--scale));
    font-weight: 700; line-height: 1.2; color: var(--text);
    transition: font-size 0.15s ease-out;
  }
  .detail-name-kr {
    font-family: var(--font); font-size: calc(0.92rem * var(--scale));
    color: var(--text2); margin-top: 8px; font-weight: 400;
    line-height: 1.5; transition: font-size 0.15s ease-out;
  }
  .detail-meta { display: none; }

  /* Model Showcase */
  .model-showcase {
    display: flex; justify-content: center; align-items: center;
    background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
    padding: 1.75rem; margin-bottom: 1.1rem; box-shadow: var(--shadow);
  }
  .model-img-wrapper { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 0.75rem; }
  .model-img-wrapper img { max-width: 100%; max-height: 420px; object-fit: contain; border-radius: 8px; box-shadow: var(--shadow-md); }
  .model-img-source { font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; color: var(--text3); text-align: center; }
  .img-zoom-hint { font-family: 'JetBrains Mono', monospace; font-size: 0.58rem; color: var(--text3); letter-spacing: 0.06em; }
  .popup-link {
    color: var(--green-dark); font-weight: 700; text-decoration: underline;
    text-decoration-style: dotted; cursor: pointer; white-space: nowrap;
  }
  .popup-link:hover { color: var(--green); }

  /* Quote */
  .quote-block {
    display: flex; gap: 14px; align-items: flex-start; background: var(--bg2);
    border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.1rem;
    margin-bottom: 1.1rem; box-shadow: var(--shadow);
  }
  .quote-badge {
    flex: none; width: 32px; height: 32px; border-radius: 50%;
    background: var(--purple-soft); display: flex; align-items: center;
    justify-content: center; font-size: 1rem; margin-top: 2px;
  }
  .quote-body { flex: 1; min-width: 0; }
  .quote-text { font-family: 'Gowun Batang', serif; font-style: italic; font-size: calc(0.88rem * var(--scale)); color: var(--purple-dark); line-height: 1.78; transition: font-size 0.15s ease-out; }
  .quote-attr { font-family: 'JetBrains Mono', monospace; font-size: calc(0.58rem * var(--scale)); color: var(--text3); margin-top: 0.4rem; letter-spacing: 0.06em; transition: font-size 0.15s ease-out; }

  /* Bio */
  .detail-bio {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
    padding: 1.1rem 1.4rem; font-size: calc(0.88rem * var(--scale)); line-height: 1.85;
    color: var(--text); margin-bottom: 1.1rem; box-shadow: var(--shadow); transition: font-size 0.15s ease-out;
  }
  .detail-bio p + p { margin-top: 0.8em; }

  /* Section Titles */
  .section-title {
    font-family: 'JetBrains Mono', monospace; font-size: 0.58rem; font-weight: 700;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--text3);
    margin-top: 1.5rem; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.6rem;
  }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* Equations */
  .eq-block {
    background: var(--charcoal); border-radius: 8px; padding: 1.1rem 1.4rem; margin-bottom: 0.5rem;
    font-family: 'Google Sans', sans-serif; font-size: calc(0.9rem * var(--scale));
    color: #FFD580; letter-spacing: 0.04em; overflow-x: auto; transition: font-size 0.15s ease-out;
  }
  .eq-block, .eq-block mjx-container, .eq-block mjx-container * {
    font-family: 'Google Sans', sans-serif !important;
  }

  /* Theory cards */
  .theories-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 0.7rem; margin-bottom: 1.1rem; }
  .theory-card {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 1rem;
    transition: box-shadow 0.18s, border-color 0.18s; box-shadow: var(--shadow);
  }
  .theory-card:hover { box-shadow: var(--shadow-md); border-color: var(--purple-mid); }
  .theory-year { font-family: 'JetBrains Mono', monospace; font-size: calc(0.58rem * var(--scale)); letter-spacing: 0.06em; margin-bottom: 0.3rem; color: var(--purple); font-weight: 500; transition: font-size 0.15s ease-out; }
  .theory-name { font-size: calc(0.85rem * var(--scale)); font-weight: 700; color: var(--charcoal); margin-bottom: 0.3rem; line-height: 1.3; transition: font-size 0.15s ease-out; }
  .theory-desc { font-size: calc(0.75rem * var(--scale)); color: var(--text2); line-height: 1.65; font-family: 'Gowun Batang', serif; transition: font-size 0.15s ease-out; }

  /* Classroom box */
  details.classroom-box {
    background: #FFFDF0; border: 1px dashed #EEDF8B; border-radius: 12px;
    padding: 1.1rem; margin-bottom: 1.1rem; cursor: pointer; transition: border 0.15s;
  }
  details.classroom-box[open] { border-style: solid; border-color: #D6C359; }
  details.classroom-box summary { font-family: 'Gowun Batang', serif; font-size: 0.82rem; font-weight: 700; color: #8C730F; outline: none; user-select: none; }
  .classroom-body { font-size: calc(0.76rem * var(--scale)); line-height: 1.72; color: #6B5B1E; margin-top: 0.65rem; cursor: default; transition: font-size 0.15s ease-out; }

  /* Connections */
  .conn-list { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1.5rem; }
  .conn-chip {
    background: var(--purple-soft); border: 1px solid var(--purple-mid); border-radius: 20px;
    padding: 3px 12px; font-size: calc(0.74rem * var(--scale)); color: var(--purple-dark);
    cursor: pointer; transition: all 0.15s; font-family: 'Gowun Batang', serif;
  }
  .conn-chip:hover { background: var(--purple); border-color: var(--purple); color: #fff; }

  /* Summary table */
  .summary-matrix { width: 100%; border-collapse: collapse; background: var(--bg2); border-radius: 8px; overflow: hidden; box-shadow: var(--shadow); margin-bottom: 1.1rem; }
  .summary-matrix th, .summary-matrix td { padding: 0.65rem 0.9rem; font-size: calc(0.76rem * var(--scale)); text-align: left; border-bottom: 1px solid var(--border); transition: font-size 0.15s ease-out; }
  .summary-matrix th { background: var(--purple-soft); color: var(--purple-dark); font-weight: 700; font-family: 'Gowun Batang', serif; }

  /* Sim card */
  .sim-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.2rem; margin-bottom: 1.1rem; box-shadow: var(--shadow); }
  .sim-card-header { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.75rem; }
  .sim-badge {
    background: var(--purple); color: #fff; font-family: 'JetBrains Mono', monospace;
    font-size: 0.52rem; font-weight: 700; letter-spacing: 0.06em; padding: 2px 8px; border-radius: 4px; flex-shrink: 0;
  }
  .sim-title { font-family: 'Google Sans', 'Montserrat', sans-serif; font-size: 0.95rem; font-weight: 800; color: var(--charcoal); }
  .sim-btn {
    background: var(--purple); color: #fff; border: none; border-radius: 6px;
    padding: 4px 14px; font-family: 'JetBrains Mono', monospace; font-size: 0.65rem;
    font-weight: 700; cursor: pointer; transition: background 0.15s, transform 0.1s;
  }
  .sim-btn:hover { background: var(--purple-dark); transform: translateY(-1px); }

  /* ── Process Context Image (where this film is used) ── */
  .context-wrap {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
    padding: 1.1rem 1.2rem; margin-bottom: 1.1rem; box-shadow: var(--shadow);
  }
  .context-header {
    display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.85rem;
  }
  .context-badge {
    background: var(--green); color: #fff; font-family: 'JetBrains Mono', monospace;
    font-size: 0.52rem; font-weight: 700; letter-spacing: 0.06em; padding: 2px 8px; border-radius: 4px; flex-shrink: 0;
  }
  .context-title { font-family: 'Google Sans', 'Montserrat', sans-serif; font-size: 0.95rem; font-weight: 800; color: var(--charcoal); }
  .context-img-frame {
    width: 100%; border-radius: 8px; overflow: hidden; border: 1px solid var(--border2);
    cursor: zoom-in; background: #fff;
  }
  .context-img-frame img { width: 100%; display: block; }
  .context-caption {
    margin-top: 0.6rem; font-size: calc(0.8rem * var(--scale)); line-height: 1.78;
    color: var(--text); font-family: 'Gowun Batang', serif; transition: font-size 0.15s ease-out;
  }
  .context-caption b { color: var(--green-dark); }

function buildSidebar(filter) {
  currentEraFilter = filter;
  const container = document.getElementById('sidebar-inner');
  if (!container) return;
  container.innerHTML = '';
  const T = UI[lang];
  const SLIDES = getSLIDES();

  SLIDES.forEach((slide, idx) => {
    if (slide.placeholder) return;
    const item = document.createElement('div');
    item.className = 'sb-item' + (currentId === slide.id ? ' active' : '');
    item.id = `card-${slide.id}`;
    const dotColor = '#7030A0';

    const chapterNum = slide.chapter || (idx + 1);
    item.innerHTML = `
      <div class="sb-dot" style="background:#7030A020;color:${dotColor}">${chapterNum}</div>

function updateProgress() {
  const SLIDES = getSLIDES().filter(s => !s.placeholder);
  const idx = SLIDES.findIndex(s => s.id === currentId);
  const pct = SLIDES.length > 1 ? (Math.max(0, idx) / (SLIDES.length - 1)) * 100 : 0;
  const fill = document.getElementById('progressFill');
  if (fill) fill.style.width = pct + '%';
}

function selectSlide(id) {
  document.querySelectorAll('.sb-item').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.sci-card').forEach(c => c.classList.remove('active'));
  const SLIDES = getSLIDES();
  const slide = SLIDES.find(s => s.id === id);
  if (!slide || slide.placeholder) return;
  currentId = id;
  const card = document.getElementById(`card-${id}`);
  if (card) {
    card.classList.add('active');
    card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  updateProgress();
  renderDetail(slide);
  // Scroll main back to top on slide change
  const main = document.getElementById('main');
  if (main) main.scrollTop = 0;
}

// Helper: wrap text within a max width on canvas (used by ism/matrix/preview diagrams)
function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight) {
  const words = text.split(' ');
  let line = '';
  let curY = y;
  for (let i = 0; i < words.length; i++) {
    const testLine = line + words[i] + ' ';
    if (ctx.measureText(testLine).width > maxWidth && i > 0) {
      ctx.fillText(line, x, curY);
      line = words[i] + ' ';
      curY += lineHeight;
    } else {
      line = testLine;
    }
  }
  ctx.fillText(line, x, curY);
}

// Called when a band is clicked
function selectSpectrumBand(bandId) {
  const currentLang = lang;
  const band = SPECTRUM_BANDS.find(b => b.id === bandId);
  if (!band) return;

  document.querySelectorAll('.spec-band').forEach(el => {
    el.classList.toggle('active', el.dataset.band === bandId);
  });

  const T = {
    imgHint: currentLang === 'en' ? '🖱️ Click image to enlarge: UV bands vs. atmosphere & skin layers' : '🖱️ 클릭하여 확대: UV 대역 vs. 대기권·피부 단계별 도달 깊이',
  };

  const panel = document.getElementById('specInfoPanel');
  if (panel) {
    panel.innerHTML = buildSpectrumInfoContent(band, currentLang, T);
  }
}

// ── State & helpers ──
window._sineState = { freqHz: 13560000 };

const SINE_C = 299792458; // speed of light, m/s

// Format a number with adaptive unit (Hz/kHz/MHz/GHz) for frequency
function sineFormatFreq(hz) {
  if (hz >= 1e9) return { value: (hz / 1e9).toFixed(3).replace(/\.?0+$/, ''), unit: 'GHz' };
  if (hz >= 1e6) return { value: (hz / 1e6).toFixed(3).replace(/\.?0+$/, ''), unit: 'MHz' };
  if (hz >= 1e3) return { value: (hz / 1e3).toFixed(3).replace(/\.?0+$/, ''), unit: 'kHz' };
  return { value: hz.toFixed(2).replace(/\.?0+$/, ''), unit: 'Hz' };
}

// Format period (seconds) with adaptive unit
function sineFormatPeriod(sec) {
  if (sec >= 1) return { value: sec.toFixed(3), unit: 's' };
  if (sec >= 1e-3) return { value: (sec * 1e3).toFixed(3), unit: 'ms' };
  if (sec >= 1e-6) return { value: (sec * 1e6).toFixed(3), unit: 'µs' };
  return { value: (sec * 1e9).toFixed(2), unit: 'ns' };
}

// Format wavelength (m) with adaptive unit
function sineFormatWavelen(m) {
  if (m >= 1000) return { value: (m / 1000).toFixed(2), unit: 'km' };
  if (m >= 1) return { value: m.toFixed(2), unit: 'm' };
  if (m >= 1e-3) return { value: (m * 1e3).toFixed(2), unit: 'mm' };
  return { value: (m * 1e6).toFixed(2), unit: 'µm' };
}

// Map a frequency in Hz to a slider position (0-100) on a log scale (1 Hz to 300 GHz)
function sineFreqToSlider(hz) {
  const minLog = Math.log10(1);
  const maxLog = Math.log10(3e11);
  const v = (Math.log10(hz) - minLog) / (maxLog - minLog) * 100;
  return Math.min(100, Math.max(0, v));
}

// Map a slider position (0-100) back to a frequency in Hz (log scale)
function sineSliderToFreq(sliderVal) {
  const minLog = Math.log10(1);
  const maxLog = Math.log10(3e11);
  const logF = minLog + (sliderVal / 100) * (maxLog - minLog);
  return Math.pow(10, logF);
}

function setSineFrequency(hz) {
  window._sineState.freqHz = hz;
  syncSineUI();
}

function updateSineFromSlider(sliderVal) {
  const hz = sineSliderToFreq(parseFloat(sliderVal));
  window._sineState.freqHz = hz;
  syncSineUI(true); // skip slider sync (it's the source)
}

function updateSineFromInput(rawValue) {
  const unitMultiplier = parseFloat(document.getElementById('sineFreqUnit')?.value || '1');
  const num = parseFloat(rawValue);
  if (isNaN(num) || num <= 0) return;
  let hz = num * unitMultiplier;
  hz = Math.min(Math.max(hz, 1), 3e11);
  window._sineState.freqHz = hz;
  syncSineUI(false, true); // skip input sync (it's the source)
}

// Sync all UI elements (slider, input, results, canvas) from window._sineState.freqHz
function syncSineUI(skipSlider, skipInput) {
  const hz = window._sineState.freqHz;

  const slider = document.getElementById('sineFreqSlider');
  if (slider && !skipSlider) slider.value = sineFreqToSlider(hz);

  if (!skipInput) {
    const input = document.getElementById('sineFreqInput');
    const unitSel = document.getElementById('sineFreqUnit');
    if (input && unitSel) {
      const f = sineFormatFreq(hz);
      const unitMap = { 'Hz': 1, 'kHz': 1000, 'MHz': 1000000, 'GHz': 1000000000 };
      unitSel.value = unitMap[f.unit];
      input.value = f.value;
    }
  }

  const period = 1 / hz;
  const wavelength = SINE_C / hz;

  const fF = sineFormatFreq(hz);
  const pF = sineFormatPeriod(period);
  const wF = sineFormatWavelen(wavelength);

  const elF = document.getElementById('sineResultFreq');
  const elP = document.getElementById('sineResultPeriod');
  const elW = document.getElementById('sineResultWavelen');
  if (elF) elF.innerHTML = `${fF.value} <span class="sine-result-unit">${fF.unit}</span>`;
  if (elP) elP.innerHTML = `${pF.value} <span class="sine-result-unit">${pF.unit}</span>`;
  if (elW) elW.innerHTML = `${wF.value} <span class="sine-result-unit">${wF.unit}</span>`;

  drawSineCanvas();
}

function drawSineCanvas() {
  const canvas = document.getElementById('sineCanvas');
  if (!canvas) return;
  const CW = 760, CH = 220;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = CW * dpr; canvas.height = CH * dpr;
  canvas.style.height = Math.round(CH * (canvas.offsetWidth / CW)) + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const W = CW, H = CH;

  // background
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#E5E7EB'; ctx.lineWidth = 1;
  ctx.strokeRect(0.5, 0.5, W - 1, H - 1);

  // center axis
  const midY = H / 2;
  ctx.strokeStyle = '#E5E7EB';
  ctx.beginPath(); ctx.moveTo(0, midY); ctx.lineTo(W, midY); ctx.stroke();

  // draw 3 full cycles across the width
  const cycles = 3;
  const amplitude = H * 0.36;
  const marginX = 30;
  const plotW = W - marginX * 2;

  ctx.strokeStyle = '#7030A0';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (let px = 0; px <= plotW; px++) {
    const t = (px / plotW) * cycles; // in cycles
    const y = midY - Math.sin(t * 2 * Math.PI) * amplitude;
    const x = marginX + px;
    if (px === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // Period marker: highlight first cycle (0 to 1)
  const periodX0 = marginX;
  const periodX1 = marginX + (plotW / cycles);
  ctx.strokeStyle = '#0F8C50';
  ctx.setLineDash([4, 3]);
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(periodX0, 18); ctx.lineTo(periodX0, H - 18); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(periodX1, 18); ctx.lineTo(periodX1, H - 18); ctx.stroke();
  ctx.setLineDash([]);

  // Period bracket + label
  ctx.strokeStyle = '#0F8C50'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(periodX0, 24); ctx.lineTo(periodX1, 24);
  ctx.stroke();
  ctx.fillStyle = '#0a6b3d';
  ctx.font = 'bold 13px "Google Sans", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('T', (periodX0 + periodX1) / 2, 16);

  // amplitude labels
  ctx.fillStyle = '#9CA3AF';
  ctx.font = '10px "JetBrains Mono", monospace';
  ctx.textAlign = 'left';
  ctx.fillText('+1', 4, midY - amplitude + 4);
  ctx.fillText('0', 4, midY + 4);
  ctx.fillText('-1', 4, midY + amplitude + 4);

  // time axis label
  ctx.fillStyle = '#6B7280';
  ctx.font = '11px "JetBrains Mono", monospace';
  ctx.textAlign = 'right';
  ctx.fillText('t →', W - 8, H - 6);
}

function buildISMDiagram(isEn) {
  const lng = isEn ? 'en' : 'ko';
  const T = {
    title: isEn ? 'FCC Frequency Ranges & ISM Bands — click to explore' : 'FCC 주파수 분류 & ISM 대역 — 클릭해 보세요',
    badge: 'INTERACTIVE',
    rangeArrow: isEn ? '← Lower Frequency / Longer Wavelength    Higher Frequency / Shorter Wavelength →' : '← 낮은 주파수 / 긴 파장    높은 주파수 / 짧은 파장 →',
    ismSectionTitle: isEn ? 'ISM (Industrial, Scientific, Medical) Bands — License-Free' : 'ISM (산업·과학·의료) 대역 — 무허가 사용 가능',
  };

  const rangesHtml = FCC_RANGES.map((r) => {
    const classes = ['fcc-range-row'];
    if (r.isHF) classes.push('fcc-range-hf');
    return `
      <div class="${classes.join(' ')}" data-range="${r.id}" onclick="selectISMItem('range','${r.id}')">
        <span class="fcc-range-name">${r.name}${r.isHF ? ' ⭐' : ''}</span>
        <span class="fcc-range-freq">${r.range}</span>
        <span class="fcc-range-wave">${r.wavelength}</span>
      </div>`;
  }).join('');

  const chipsHtml = ISM_BANDS.map((b) => {
    const classes = ['ism-chip'];
    if (b.primary) classes.push('ism-chip-primary');
    if (b.nonIsm) classes.push('ism-chip-nonism');
    return `<div class="${classes.join(' ')}" data-ism="${b.id}" onclick="selectISMItem('ism','${b.id}')">${b.label}${b.primary ? ' ⭐' : ''}</div>`;
  }).join('');

  // Default = HF (13.56MHz context)
  const defaultRange = FCC_RANGES.find(r => r.isHF);

  return `
    <div class="ism-wrap" id="ismWrap">
      <div class="ism-header">
        <span class="ism-badge">${T.badge}</span>
        <span class="ism-title">${T.title}</span>
      </div>
      <div class="ism-body">
        <div class="fcc-arrow-row">${T.rangeArrow}</div>
        <div class="fcc-range-table" id="fccRangeTable">${rangesHtml}</div>

        <div class="ism-section-title">${T.ismSectionTitle}</div>
        <div class="ism-chip-row" id="ismChipRow">${chipsHtml}</div>

        <div class="ism-info-panel" id="ismInfoPanel">
          ${buildISMInfoContent(defaultRange, 'range', lng)}
        </div>
      </div>
    </div>`;
}

// Build the info panel content for either a range or an ISM band
function buildISMInfoContent(item, kind, lng) {
  if (kind === 'range') {
    return `
      <div class="ism-info-content">
        <div class="ism-info-band-name">
          ${item.name} <span class="ism-info-range">${item.range} · λ ${item.wavelength}</span>
        </div>
        <div class="ism-info-body">${item.info[lng]}</div>
      </div>`;
  } else {
    const tagLabel = item.nonIsm
      ? (lng === 'ko' ? 'ISM 대역 아님' : 'Not an ISM Band')
      : (lng === 'ko' ? 'ISM 대역' : 'ISM Band');
    return `
      <div class="ism-info-content">
        <div class="ism-info-band-name">
          ${item.label} <span class="ism-info-range">${tagLabel}</span>
        </div>
        <div class="ism-info-body">${item.info[lng]}</div>
      </div>`;
  }
}

// Called when a range row or ISM chip is clicked
function selectISMItem(kind, id) {
  const currentLang = lang;
  let item;
  if (kind === 'range') {
    item = FCC_RANGES.find(r => r.id === id);
    document.querySelectorAll('.fcc-range-row').forEach(el => {
      el.classList.toggle('active', el.dataset.range === id);
    });
    document.querySelectorAll('.ism-chip').forEach(el => el.classList.remove('active'));
  } else {
    item = ISM_BANDS.find(b => b.id === id);
    document.querySelectorAll('.ism-chip').forEach(el => {
      el.classList.toggle('active', el.dataset.ism === id);
    });
    document.querySelectorAll('.fcc-range-row').forEach(el => el.classList.remove('active'));
  }
  if (!item) return;

  const panel = document.getElementById('ismInfoPanel');
  if (panel) {
    panel.innerHTML = buildISMInfoContent(item, kind, currentLang);
  }
}

// Called when a matrix row is clicked
function selectMatrixRow(rowId) {
  const currentLang = lang;
  const DATA = window._matrixData;
  if (!DATA) return;
  const row = DATA.rows.find(r => r.id === rowId);
  if (!row) return;

  document.querySelectorAll('.matrix-row').forEach(el => {
    el.classList.toggle('active', el.dataset.row === rowId);
  });

  const panel = document.getElementById('matrixInfoPanel');
  if (panel) {
    panel.innerHTML = `
      <div class="matrix-info-content">
        <div class="matrix-info-label-name">${row.label}</div>
        <div class="matrix-info-body">${row.info}</div>
      </div>`;
  }
}

function buildSineWaveDeepLearn(isEn, slideId) {
  const uid = 'dl_' + slideId;
  const DATA = {
    ko: {
      headerTitle: 'Deep Study — 주파수·주기·파장, 그리고 "RF 신호는 정말 사인파인가?"',

<div class="dl-highlight">반면 구형파(square wave)나 펄스(pulse)는 푸리에 급수(Fourier series)상 13.56MHz의 기본파(fundamental) 외에도 27.12MHz, 40.68MHz 등 무수한 고조파(harmonics)를 포함합니다. 챔버나 플라즈마는 비선형(non-linear) 부하이기 때문에, 입력이 순수 사인파라도 출력(전류/전압 파형)에는 고조파가 섞여 나오는데, RF Generator의 출력 자체가 처음부터 사인파여야 이 고조파 발생량을 "플라즈마/챔버 기인"으로 명확히 구분하고 분석할 수 있습니다.</div>`

          body: `<p>이 계산기는 항상 "3주기(cycle)"를 같은 가로 폭에 그립니다. 따라서 주파수가 60Hz든 13.56MHz든, 그려지는 사인파의 <b>모양(shape)</b> 자체는 동일합니다 — 달라지는 것은 그 3주기가 실제로 차지하는 <b>시간(T)</b>과 <b>공간(λ)</b>입니다.</p>
<div class="dl-eq">60Hz: 3주기 = 약 50ms (T≈16.7ms)
13.56MHz: 3주기 = 약 221ns (T≈73.7ns)</div>
<p>이것이 "주파수"라는 숫자의 본질입니다 — 파형의 모양이 아니라, <b>같은 모양의 사건이 시간/공간상에서 얼마나 빨리·짧게 반복되는가</b>를 나타내는 척도입니다. 오실로스코프로 60Hz와 13.56MHz 신호를 보면 둘 다 "사인파"로 똑같이 보이지만, 가로축(시간) 스케일이 약 226,000배 차이 납니다.</p>`
        },

13.56 MHz × 3 = 40.68 MHz</div>
<p>이것은 우연이 아닙니다. ISM 대역을 지정할 때, 기본 주파수(fundamental, 13.56MHz)의 정수배(harmonic) 대역도 함께 ISM으로 지정하면, 13.56MHz 장비에서 자연적으로 발생하는 2차/3차 고조파가 "불법 방출"이 아니라 "또 다른 ISM 대역 안의 신호"가 되어 규제상 충돌을 줄일 수 있기 때문입니다.</p>

<div class="dl-highlight">In exchange, equipment using ISM bands must comply with EMC (electromagnetic compatibility) regulations limiting <b>spurious emissions</b> outside the band to acceptable levels. "Freedom to use the frequency" and "an obligation to control emissions" come as a pair — one reason RF generator/matcher designs always include filtering (low-pass / harmonic filters).</div>`

<p>즉, 같은 "😐 조건부" 등급이라도 <b>"Pulsed-DC 칸은 형상이 단순하면 OK", "LF/MF 칸은 주파수가 충분히 높아야 OK"</b>로, 두 칸이 가리키는 엔지니어링 체크포인트는 서로 다릅니다. RF(13.56MHz)는 두 조건(단순한 형상 가정 없이도 충분히 빠른 극성 반전)을 모두 만족시키기 때문에 두 행 모두에서 "권장"으로 한 단계 높게 평가됩니다.</p>`

<div class="dl-highlight">This accumulated surface charge very quickly (typically sub-microsecond) builds an electric field that opposes the applied voltage. The effective potential difference between the supply and the plasma collapses toward zero, and ions are no longer accelerated — this is "charge-up" or "self-shielding." It's the fundamental reason DC sputtering can't use insulating targets.</div>`

        },

          icon: '🌉',
          title: 'Why does RF rely on the fact that "electrons travel much farther than ions within one 13.56 MHz cycle"?',
          body: `<div class="dl-eq">Electron mobility ≫ Ion mobility (mass ratio roughly 1:10,000–1:100,000)</div>
<p>Each RF half-cycle (about 36.9 ns at 13.56 MHz) effectively determines which species reaches the surface. Electrons, being far lighter, can travel to the surface within this short time; ions, being much heavier, barely move.</p>
<div class="dl-highlight">As a result, during the half-cycle when electrons dominate arrival, the insulating surface charges negative; during the next half-cycle (ion-dominated arrival), that negative charge is neutralized by incoming ions. This repeating "charge by electrons → discharge by ions" cycle is, on a time-averaged basis, what prevents the surface from permanently charging to one polarity. This is the fundamental reason CCP/ICP can operate on both insulating targets and substrates — and it connects directly to the "self-bias (V_DC)" formation mechanism covered in the next module.</div>`

<p>So even though both cells share the same "😐 conditional" rating, the engineering checkpoint each one points to is different: <b>the Pulsed-DC cell is "OK if the geometry is simple," while the LF/MF cell is "OK if the frequency is high enough."</b> RF (13.56MHz) satisfies both conditions — fast enough polarity reversal without relying on simple geometry — which is why it's rated one level higher, "Recommended," in both rows.</p>`
