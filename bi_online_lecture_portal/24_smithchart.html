<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Module 04 — Smith Chart | Benedu Insight RF Lecture Series</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/benedu-insight/benedu-insight.github.io/refs/heads/main/logo_png/benedu_insight_Symbol.png"/>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet"/>
<script>
window.MathJax = {
  tex: { inlineMath: [['$','$'],['\\(','\\)']], displayMath: [['$$','$$'],['\\[','\\]']] },
  startup: { typeset: false }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
<style>
/* ═══════════════════════════════════════════════
   BENEDU INSIGHT — MODULE 04 BASE STYLES
   Module 03 구조 계승, Module 04(Smith Chart) 아이덴티티 추가
═══════════════════════════════════════════════ */
:root {
  --bg: #F7F8FA;
  --card: #F1EFEA;
  --card-hd: #E7E4DD;
  --purple: #7030A0;
  --green: #0F8C50;
  --plasma: #E87B1E;
  --blue: #1A6FB5;
  --red: #C0392B;
  --teal: #C8860D;
  --amber: #C8860D;
  --text: #1A1A2E;
  --text-sub: #5A5A7A;
  --border: #D8D5CE;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --radius: 12px;
  --font: 'Google Sans', 'Noto Sans KR', sans-serif;
  --mono: 'JetBrains Mono', monospace;
  --batang: 'Gowun Batang', serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; scroll-behavior: smooth; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  display: flex;
  min-height: 100vh;
}

/* ── SIDEBAR ── */
#sidebar {
  width: 260px;
  min-height: 100vh;
  background: #FFFFFF;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0;
  overflow-y: auto;
  z-index: 100;
}
.sb-brand {
  padding: 20px 18px 16px;
  border-bottom: 1px solid var(--border);
}
.sb-brand .module-tag {
  margin-top: 4px;
  font-size: 0.72rem;
  color: var(--text-sub);
}
.sb-era {
  padding: 10px 14px 6px;
  font-size: 0.65rem;
  font-weight: 700;
  color: var(--text-sub);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.sb-era-bar {
  height: 3px;
  border-radius: 2px;
  margin: 4px 14px 8px;
  background: var(--teal);
  opacity: 0.4;
}
.sb-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 9px 14px;
  cursor: pointer;
  border-radius: 8px;
  margin: 1px 8px;
  transition: background 0.15s;
  text-decoration: none;
}
.sb-item:hover { background: #E8F7F2; }
.sb-item.active { background: #D1F0E6; }
.sb-dot {
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.65rem;
  font-family: var(--mono);
  font-weight: 600;
  flex-shrink: 0;
  margin-top: 1px;
}
.sb-label { font-size: 0.78rem; line-height: 1.35; color: var(--text); }
.sb-sub { font-size: 0.68rem; color: var(--text-sub); margin-top: 2px; }
.sb-lang {
  margin-top: auto;
  padding: 14px 16px;
  border-top: 1px solid var(--border);
  display: flex; gap: 8px;
}
.lang-btn {
  flex: 1; padding: 7px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  background: transparent;
  font-family: var(--font);
  font-size: 0.78rem;
  cursor: pointer;
  transition: all 0.15s;
  color: var(--text-sub);
}
.lang-btn.active {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
  font-weight: 600;
}

/* ── TOP LOGO BAR ── */
#top-logo-bar {
  position: fixed;
  top: 0; left: 260px; right: 0;
  height: 44px;
  background: #fff;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: 0 28px;
  z-index: 150;
}
#top-logo-bar img {
  height: 22px;
  width: auto;
  object-fit: contain;
  opacity: 0.88;
}

/* ── MAIN CONTENT ── */
#main {
  margin-left: 260px;
  flex: 1;
  padding: 64px 36px 32px;
  max-width: calc(100vw - 260px);
}

/* ── SLIDE HEADER ── */
.slide-header { margin-bottom: 28px; }
.slide-eyebrow {
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--teal);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.slide-title {
  font-size: 1.9rem;
  font-weight: 700;
  color: var(--text);
  line-height: 1.2;
}
.slide-title span { color: var(--teal); }
.slide-subtitle {
  margin-top: 8px;
  font-size: 0.92rem;
  color: var(--text-sub);
  line-height: 1.5;
}

/* ── TAB SYSTEM ── */
.tab-row {
  display: flex;
  gap: 4px;
  margin-bottom: 24px;
  border-bottom: 2px solid var(--border);
  padding-bottom: 0;
}
.tab-btn {
  padding: 8px 18px 10px;
  font-family: var(--font);
  font-size: 0.82rem;
  font-weight: 500;
  border: none;
  background: transparent;
  color: var(--text-sub);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  transition: all 0.15s;
}
.tab-btn.active {
  color: var(--teal);
  border-bottom-color: var(--teal);
  font-weight: 700;
}
.tab-btn:hover:not(.active) { color: var(--text); }
.tab-pane { display: none; }
.tab-pane.active { display: block; }

/* ── DIAGRAM CARD ── */
.d-wrap {
  background: var(--card);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}
.d-header {
  background: var(--card-hd);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-radius: var(--radius) var(--radius) 0 0;
}
.d-badge {
  background: var(--teal);
  color: #fff;
  font-size: 0.65rem;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 20px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  font-family: var(--mono);
}
.d-badge.purple { background: var(--purple); }
.d-badge.green  { background: var(--green); }
.d-badge.plasma { background: var(--plasma); }
.d-badge.red    { background: var(--red); }
.d-title { font-size: 0.9rem; font-weight: 700; color: var(--text); }
.d-body { padding: 1.2rem; }

/* ── THEORY CARDS ── */
.theory-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
  margin-bottom: 20px;
}
.theory-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.05);
}
.theory-card h4 {
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--teal);
  margin-bottom: 7px;
  display: flex; align-items: center; gap: 6px;
}
.theory-card p { font-size: 0.82rem; color: var(--text-sub); line-height: 1.55; }

/* ── EQUATION BLOCK ── */
.eq-block {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 18px;
  margin: 10px 0;
  font-family: var(--mono);
  font-size: 0.9rem;
  text-align: center;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}
.eq-label {
  font-size: 0.7rem;
  color: var(--text-sub);
  text-align: right;
  margin-top: 4px;
  font-family: var(--font);
}

/* ── CALLOUT ── */
.callout {
  background: #F0FAFF;
  border: 1px solid #A8D8E8;
  border-radius: 10px;
  padding: 14px 16px;
  margin: 14px 0;
  font-size: 0.84rem;
  line-height: 1.6;
  color: var(--text);
}
.callout.green  { background: #F0FAF4; border-color: #A8D5B8; }
.callout.plasma { background: #FFF8F0; border-color: #F5C89A; }
.callout.purple { background: #F8F6FF; border-color: #C9B8E8; }
.callout.red    { background: #FDF0EE; border-color: #EAB0A8; }
.callout-title {
  font-weight: 700;
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 6px;
  color: var(--teal);
}
.callout.green  .callout-title { color: var(--green); }
.callout.plasma .callout-title { color: var(--plasma); }
.callout.purple .callout-title { color: var(--purple); }
.callout.red    .callout-title { color: var(--red); }

/* ── QUIZ ── */
.quiz-card {
  background: #fff;
  border: 1.5px solid #A8D8E8;
  border-radius: 10px;
  padding: 18px;
  margin-top: 10px;
}
.quiz-q {
  font-size: 0.88rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 14px;
  line-height: 1.5;
}
.quiz-opts { display: flex; flex-direction: column; gap: 8px; }
.quiz-opt {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 14px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.82rem;
  line-height: 1.4;
  transition: all 0.15s;
  background: var(--bg);
}
.quiz-opt:hover { border-color: var(--teal); background: #F0FAFF; }
.quiz-opt.correct { border-color: var(--green); background: #F0FAF4; color: var(--green); }
.quiz-opt.wrong   { border-color: var(--red); background: #FDF0EE; color: var(--red); }
.quiz-opt span.opt-key {
  font-family: var(--mono);
  font-weight: 700;
  font-size: 0.75rem;
  width: 20px; flex-shrink: 0;
}
.quiz-feedback {
  margin-top: 12px;
  font-size: 0.8rem;
  padding: 10px 12px;
  border-radius: 8px;
  display: none;
  line-height: 1.5;
}
.quiz-feedback.show { display: block; }
.quiz-feedback.ok { background: #F0FAF4; color: var(--green); }
.quiz-feedback.ng { background: #FDF0EE; color: var(--red); }

/* ── CONNECTIONS ── */
.connections { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.conn-chip {
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 0.75rem;
  font-family: var(--mono);
  font-weight: 600;
  border: 1.5px solid var(--border);
  cursor: pointer;
  transition: all 0.15s;
  background: #fff;
  color: var(--text-sub);
}
.conn-chip:hover { border-color: var(--teal); color: var(--teal); background: #F0FAFF; }

/* ── DEEP STUDY ── */
.deep-section h3 {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--teal);
  margin: 20px 0 10px;
  padding-bottom: 6px;
  border-bottom: 1.5px solid #A8D8E8;
}
.deep-section p  { font-size: 0.84rem; line-height: 1.7; color: var(--text); margin-bottom: 10px; }
.deep-section ul { padding-left: 18px; margin-bottom: 10px; }
.deep-section ul li { font-size: 0.83rem; line-height: 1.65; color: var(--text); margin-bottom: 4px; }

/* ── TABLE ── */
.data-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin: 10px 0; }
.data-table th {
  background: var(--card-hd);
  padding: 9px 12px;
  text-align: left;
  font-weight: 700;
  font-size: 0.75rem;
  color: var(--text-sub);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.data-table td { padding: 9px 12px; border-bottom: 1px solid var(--border); color: var(--text); line-height: 1.4; }
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { background: #F0FAFF; }

/* ── CANVAS SIMULATOR ── */
.sim-wrap { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin: 10px 0; }
.sim-canvas {
  width: 100%;
  max-width: 100%;
  height: auto;
  border-radius: 8px;
  background: #0D1117;
  display: block;
  image-rendering: -webkit-optimize-contrast;
  image-rendering: crisp-edges;
  box-sizing: border-box;
}
.sim-controls { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 14px; align-items: center; }
.sim-ctrl-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 140px; }
.sim-ctrl-label { font-size: 0.72rem; font-weight: 700; color: var(--text-sub); display: flex; justify-content: space-between; }
.sim-ctrl-val { font-family: var(--mono); font-size: 0.72rem; color: var(--teal); font-weight: 600; }
.sim-slider {
  -webkit-appearance: none; width: 100%; height: 4px; border-radius: 2px;
  background: var(--border); outline: none;
}
.sim-slider::-webkit-slider-thumb {
  -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
  background: var(--teal); cursor: pointer;
}
.sim-btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.sim-btn {
  padding: 7px 16px; border-radius: 8px;
  border: 1.5px solid var(--teal);
  background: transparent; color: var(--teal);
  font-family: var(--font); font-size: 0.78rem; font-weight: 600;
  cursor: pointer; transition: all 0.15s;
}
.sim-btn:hover, .sim-btn.active { background: var(--teal); color: #fff; }
.sim-btn.purple-btn { border-color: var(--purple); color: var(--purple); }
.sim-btn.purple-btn:hover, .sim-btn.purple-btn.active { background: var(--purple); color: #fff; }
.sim-info {
  margin-top: 10px; padding: 10px 14px;
  background: var(--bg); border-radius: 8px;
  font-size: 0.78rem; color: var(--text-sub); line-height: 1.5; min-height: 36px;
}

/* ── REVEAL BLOCK (함께 생각해 보기) ── */
.reveal-wrap {
  background: #fff;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 16px;
  box-shadow: 0 1px 6px rgba(0,0,0,0.06);
}
.reveal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  cursor: pointer;
  user-select: none;
  transition: background 0.15s;
}
.reveal-header:hover { background: #F4F6FB; }
.reveal-q {
  font-size: 0.92rem;
  font-weight: 700;
  color: var(--text);
  line-height: 1.4;
  flex: 1;
}
.reveal-badge {
  flex-shrink: 0;
  background: var(--teal);
  color: #fff;
  font-size: 0.68rem;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 10px;
  font-family: var(--mono);
  letter-spacing: 0.04em;
  margin-right: 12px;
}
.reveal-chevron { flex-shrink: 0; font-size: 0.8rem; color: var(--text-sub); transition: transform 0.22s; }
.reveal-header.open .reveal-chevron { transform: rotate(180deg); }
.reveal-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.35s ease, opacity 0.25s ease;
  opacity: 0;
  border-top: 1px solid transparent;
}
.reveal-body.open {
  max-height: 2000px;
  opacity: 1;
  border-top-color: var(--border);
}
.reveal-inner { padding: 18px; }

/* ── Journey Key Block styles (Step 2) ── */
.jkey-block {
  display: block;
  margin-bottom: 0;
}
.jkey-spacer {
  display: block;
  height: 14px;
}
.jkey-h {
  display: block;
  font-size: 0.92rem;
  font-weight: 700;
  color: #E8EEF8;
  font-family: 'Google Sans', sans-serif;
  line-height: 1.7;
}
.jkey-tag {
  font-size: 0.78rem;
  font-weight: 600;
  color: #A0BBCC;
  font-family: 'Google Sans', sans-serif;
}
.jkey-f {
  display: block;
  font-size: 1.15rem;
  font-weight: 700;
  color: #E8EEF8;
  font-family: 'Google Sans', sans-serif;
  line-height: 1.8;
  padding-left: 18px;
}
.jkey-f sup {
  font-size: 0.72em;
  vertical-align: super;
}

#img-popup {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.85); z-index: 9999;
  align-items: center; justify-content: center;
  overflow: hidden;
}
#img-popup.open { display: flex; }
#img-popup-viewport {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  overflow: auto;
  cursor: zoom-in;
}
#img-popup-viewport.zoomed {
  cursor: grab;
  align-items: flex-start; justify-content: flex-start;
}
#img-popup-viewport.zoomed:active { cursor: grabbing; }
#img-popup img {
  max-width: 90vw; max-height: 85vh;
  border-radius: 10px; box-shadow: 0 8px 40px rgba(0,0,0,0.4);
  transition: max-width 0.2s ease, max-height 0.2s ease, width 0.2s ease;
  user-select: none;
}
#img-popup-viewport.zoomed img {
  max-width: none; max-height: none;
  width: 220%;
  border-radius: 6px;
  transition: none;
}
#img-popup-cap {
  position: fixed; bottom: 30px; left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.7); color: #fff;
  padding: 8px 18px; border-radius: 20px; font-size: 0.8rem;
  pointer-events: none;
  z-index: 2;
}
#img-popup-close {
  position: fixed; top: 20px; right: 28px;
  width: 40px; height: 40px; border-radius: 50%;
  background: rgba(255,255,255,0.12); color: #fff;
  border: 1.5px solid rgba(255,255,255,0.4);
  font-size: 1.3rem; line-height: 1; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  z-index: 2;
}
#img-popup-close:hover { background: rgba(255,255,255,0.25); }
#img-popup-hint {
  position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.6); color: #fff;
  padding: 6px 14px; border-radius: 16px; font-size: 0.74rem;
  pointer-events: none; z-index: 2;
}

/* ── PROGRESS BAR ── */
.progress-bar { position: fixed; top: 44px; left: 260px; right: 0; height: 3px; background: var(--border); z-index: 200; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--teal), var(--green)); transition: width 0.3s ease; }

/* ── RESPONSIVE ── */
@media (max-width: 768px) {
  #sidebar { display: none; }
  #main { margin-left: 0; padding: 64px 16px 20px; max-width: 100vw; }
  .progress-bar { left: 0; }
  #top-logo-bar { left: 0; }
}

/* ── 임피던스 페이저 다이어그램 ── */
.phasor-legend {
  display: flex; flex-wrap: wrap; gap: 10px;
  margin-top: 10px; align-items: center;
}
.phasor-dot {
  display: inline-block; width: 12px; height: 12px;
  border-radius: 50%; margin-right: 5px; vertical-align: middle;
}

/* ── Z 표기 큰 수식 ── */
.z-formula-block {
  display: flex; align-items: center; gap: 0;
  background: #fff; border: 2px solid #C9B8E8;
  border-radius: 14px; padding: 20px 28px;
  margin: 16px 0; flex-wrap: wrap; justify-content: center;
}
.z-formula-block .z-sym {
  font-size: 3rem; font-weight: 900;
  color: var(--purple); font-family: var(--mono);
  margin-right: 12px;
}
.z-formula-block .z-eq { font-size: 2.2rem; color: var(--text-sub); margin: 0 10px; }
.z-formula-block .z-r  { font-size: 2.2rem; font-weight: 700; color: var(--blue); }
.z-formula-block .z-pm { font-size: 2rem; color: var(--text-sub); margin: 0 8px; }
.z-formula-block .z-x  { font-size: 2.2rem; font-weight: 700; color: var(--purple); }
.z-formula-block .z-j  { font-size: 2.2rem; font-weight: 700; color: var(--purple); }
.z-sub-label {
  font-size: 0.72rem; color: var(--text-sub); text-align: center;
  margin-top: 4px; font-family: var(--mono);
}
</style>
</head>
<body>

<!-- IMAGE POPUP -->
<div id="img-popup">
  <button id="img-popup-close" onclick="closeImgPopup()" aria-label="Close">✕</button>
  <div id="img-popup-hint">🔍 클릭해서 확대 / 다시 클릭하면 축소 · ✕ 또는 Esc로 닫기</div>
  <div id="img-popup-viewport" onclick="toggleImgZoom(event)">
    <img id="img-popup-img" src="" alt=""/>
  </div>
  <div id="img-popup-cap"></div>

   HiDPI Canvas Utility

function setupHiDPI(canvas) {
  const dpr  = window.devicePixelRatio || 1;
  // Use offsetWidth so we always get the current rendered CSS width
  const cssW = canvas.offsetWidth  || canvas.parentElement && canvas.parentElement.offsetWidth || 680;
  // Preserve aspect ratio based on original height/width ratio from the data-h attribute,
  // or fall back to the canvas.height attribute value (which we keep as the logical height)
  const attrH = parseInt(canvas.getAttribute('data-h') || canvas.height || 260);
  const attrW = parseInt(canvas.getAttribute('data-w') || canvas.width  || 680);
  const cssH  = Math.round(attrH * (cssW / attrW));
  canvas.width  = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  canvas.style.width  = '100%';
  canvas.style.height = cssH + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  return { ctx, W: cssW, H: cssH, dpr };
}

      { icon: '\ud83c\udfaf', title: 'Crossing the Real Axis \u2014 Voltage Maxima and Minima', body: 'The instant the rotating point crosses the positive real axis (Re \u0393>0) is a voltage maximum (V_max, R=R_max=Z\u2080\u00b7VSWR); crossing the negative real axis (Re \u0393<0) is a voltage minimum (V_min, R=R_min=Z\u2080/VSWR). These two crossings always alternate at exactly \u03bb/4 intervals.' },
      { icon: '\ud83d\udee0\ufe0f', title: 'Why This Matters \u2014 The Starting Point for Stub Matching', body: 'As you travel along the line, \u0393 is guaranteed to cross the R=1 (normalized 50\u03a9) circle at exactly two points. These are precisely where a stub would be attached in single-stub matching, and the distance to that point is computed directly from the rotation angle (= distance traveled).' },
      { icon: '\ud83c\udf93', title: 'Advanced \u2014 Why the Factor of 2 (A Common Field Misconception)', body: 'A surprisingly common misconception among working RF engineers is that one full lap of the Smith Chart equals 1\u03bb. The correct answer is 0.5\u03bb. The reason lives in \u0393(z\u2032)=\u0393_L\u00b7e^(\u2212j2\u03b2z\u2032): the incident and reflected waves both traverse the same physical distance z\u2032, but in opposite directions, so their phases accumulate in the same sense \u2014 \u03b2z\u2032 + \u03b2z\u2032 = 2\u03b2z\u2032. It\u2019s the same round-trip effect radar uses when it computes range as (speed of light \u00d7 time) \u00f7 2. So moving 1\u03bb along the line actually sweeps the chart twice (720\u00b0). And this same \u201c2\u03b2\u201d factor is exactly why the standing-wave pattern you already know from the bench repeats every \u03bb/2 \u2014 one fact, two appearances.' },
    ],

function renderSidebar() {
  const sl = slides();
  const nl = document.getElementById('nav-list');
  nl.innerHTML = '';
  sl.forEach(s => {
    const div = document.createElement('div');
    div.className = 'sb-item' + (s.id === currentId ? ' active' : '');
    div.onclick = () => navigateTo(s.id);
    const color = ERA_COLORS[s.era] || '#C8860D';
    const alpha = s.placeholder ? '0.45' : '1';
    const sub = currentLang === 'ko' ? SB_SUBS_KO[s.id] : SB_SUBS_EN[s.id];
    div.style.opacity = alpha;
    div.innerHTML = `
      <div class="sb-dot" style="background:${color}20;color:${color}">${SB_ICONS[s.id]||'●'}</div>
      <div>
        <div class="sb-label">${s.title}</div>
        <div class="sb-sub">${sub||''}</div>
      </div>`;
    nl.appendChild(div);
  });
  updateProgress();
}

function updateProgress() {
  const sl = slides();
  const idx = sl.findIndex(s => s.id === currentId);
  const pct = sl.length > 1 ? (idx / (sl.length - 1)) * 100 : 0;
  document.getElementById('progressFill').style.width = pct + '%';
}

/* ── HISTORY: 인포그래픽 + 타임라인 ── */
function buildD40hDiagram(isEn) {
  return `
<div class="d-wrap">
  <div class="d-header">
    <span class="d-badge amber">📜 History</span>
    <span class="d-title">${isEn ? 'Why Was the Smith Chart Born?' : 'Smith Chart는 왜 태어났는가'}</span>
  </div>
  <div class="d-body">

    <div style="display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start;margin-bottom:18px">
      <div style="flex:0 0 auto;cursor:pointer" onclick="openImgPopup(SMITH_HISTORY_IMG, '${isEn ? 'The Smith Chart — Inventor, History, and the Idea That Changed RF Engineering (Benedu Insight)' : 'The Smith Chart — 개발자, 역사, RF 엔지니어링을 바꾼 아이디어 (Benedu Insight)'}')">
        <img src="${'SMITH_HISTORY_IMG_PLACEHOLDER'}" alt="Smith Chart history infographic"
          style="width:220px;border-radius:10px;border:1.5px solid var(--border);box-shadow:var(--shadow);display:block"/>
        <div style="text-align:center;font-size:0.7rem;color:var(--text-sub);margin-top:6px;font-family:Google Sans,sans-serif">
          🔍 ${isEn ? 'Click to enlarge' : '클릭하면 확대됩니다'}
        </div>
      </div>
      <div style="flex:1 1 320px;min-width:280px">
        <div class="callout amber">
          <div class="callout-title">⭐ ${isEn ? 'In One Line' : '한 줄 요약'}</div>
          ${isEn
            ? 'For 1930s RF engineers, the Smith Chart was a <strong>"graphical super calculator"</strong> — turning hours of hand calculation into seconds of visual reading.'
            : '1930년대 RF 엔지니어에게 Smith Chart는 <strong>"그래픽 슈퍼 계산기"</strong>였습니다 — 몇 시간 걸리던 손 계산을, 몇 초의 시각적 확인으로 바꿔놓았습니다.'}
        </div>
      </div>
    </div>

    <div style="background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:18px 20px">
      <div style="font-size:0.74rem;font-weight:700;color:var(--text-sub);text-transform:uppercase;
                  letter-spacing:0.06em;margin-bottom:16px;font-family:var(--mono)">
        ⏱ ${isEn ? 'Timeline' : '타임라인'}
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px">
        <div style="border-left:3px solid #C8860D;padding-left:12px">
          <div style="font-family:JetBrains Mono,monospace;font-weight:700;color:#C8860D;font-size:0.82rem">Early 1900s</div>
          <div style="font-size:0.78rem;color:var(--text-sub);margin-top:4px;line-height:1.5">
            ${isEn?'Radio technology emerges and grows':'무선 기술이 등장하고 성장하기 시작'}
          </div>
        </div>
        <div style="border-left:3px solid #C8860D;padding-left:12px">
          <div style="font-family:JetBrains Mono,monospace;font-weight:700;color:#C8860D;font-size:0.82rem">1920s–1930s</div>
          <div style="font-size:0.78rem;color:var(--text-sub);margin-top:4px;line-height:1.5">
            ${isEn?'Higher frequencies make transmission lines critical':'주파수가 높아지며 전송선로가 핵심 변수가 됨'}
          </div>
        </div>
        <div style="border-left:3px solid #C0392B;padding-left:12px">
          <div style="font-family:JetBrains Mono,monospace;font-weight:700;color:#C0392B;font-size:0.82rem">1939</div>
          <div style="font-size:0.78rem;color:var(--text-sub);margin-top:4px;line-height:1.5">
            ${isEn?'Phillip H. Smith publishes "Transmission Line Calculator" — the Smith Chart is born':'Phillip H. Smith가 "Transmission Line Calculator" 발표 — Smith Chart 탄생'}
          </div>
        </div>
        <div style="border-left:3px solid #0F8C50;padding-left:12px">
          <div style="font-family:JetBrains Mono,monospace;font-weight:700;color:#0F8C50;font-size:0.82rem">1940s–Present</div>
          <div style="font-size:0.78rem;color:var(--text-sub);margin-top:4px;line-height:1.5">
            ${isEn?'Becomes the universal language of RF engineering':'RF 엔지니어링의 보편적인 언어가 됨'}
          </div>
        </div>
      </div>
    </div>

    <div class="callout" style="margin-top:16px">
      <div class="callout-title">🎯 ${isEn ? 'Key Takeaway' : '핵심 메시지'}</div>
      ${isEn
        ? 'The Smith Chart was born from a simple question: <em>"Can we solve complex RF problems without complex calculations?"</em> Phillip H. Smith\u2019s answer changed how engineers think — and design — RF systems forever.'
        : 'Smith Chart는 단순한 질문에서 출발했습니다: <em>"복잡한 RF 문제를 복잡한 계산 없이 풀 수 있을까?"</em> Phillip H. Smith의 답은 엔지니어들이 RF 시스템을 사고하고 설계하는 방식을 영원히 바꿔놓았습니다.'}
    </div>

  </div>

/* ═══════════════════════════════════════════
   SIMULATOR — Topic 1 (d40): Z-plane ↔ Γ-plane
═══════════════════════════════════════════ */
window._d40IsOpen = false;

window.presetD40 = function(kind, name) {
  var R = document.getElementById('d40-R'), X = document.getElementById('d40-X');
  if (!R || !X) return;
  window._d40IsOpen = false;
  if (name === 'short')   { R.value = 0;   X.value = 0; }
  if (name === 'open')    { R.value = R.max; X.value = 0; window._d40IsOpen = true; }
  if (name === 'matched') { R.value = (parseFloat(document.getElementById('d40-Z0').value)||50); X.value = 0; }
  updateD40();
};

window.updateD40 = function(fromSlider) {
  if (fromSlider) window._d40IsOpen = false;
  var R  = parseFloat(document.getElementById('d40-R')?.value) || 0;
  var X  = parseFloat(document.getElementById('d40-X')?.value) || 0;
  var Z0 = parseFloat(document.getElementById('d40-Z0')?.value) || 50;
  var isEn = currentLang === 'en';
  var isOpen = window._d40IsOpen;

  var rvEl = document.getElementById('d40-Rval'), xvEl = document.getElementById('d40-Xval');
  if (rvEl) rvEl.textContent = isOpen ? '\u221e' : (R.toFixed(0) + ' Ω');
  if (xvEl) xvEl.textContent = (X>=0?'+':'') + X.toFixed(0) + ' Ω';

  var GRe, GIm, Gmag, Gang, vswr;
  if (isOpen) {
    GRe = 1; GIm = 0; Gmag = 1; Gang = 0; vswr = Infinity;
  } else {
    // Γ = (Z-Z0)/(Z+Z0)
    var numRe = R-Z0, numIm = X, denRe = R+Z0, denIm = X;
    var denMag2 = denRe*denRe + denIm*denIm || 1e-9;
    GRe = (numRe*denRe + numIm*denIm)/denMag2;
    GIm = (numIm*denRe - numRe*denIm)/denMag2;
    Gmag = Math.sqrt(GRe*GRe+GIm*GIm);
    Gang = Math.atan2(GIm,GRe)*180/Math.PI;
    vswr = Gmag < 0.9999 ? (1+Gmag)/(1-Gmag) : 999;
  }

  var ro = document.getElementById('d40-readout');
  if (ro) {
    var zStr = isOpen ? (isEn?'Z = \u221e (Open)':'Z = \u221e (\uac1c\ubc29)') : ('Z = '+R.toFixed(1)+(X>=0?' + j':' \u2212 j')+Math.abs(X).toFixed(1)+' \u03a9');
    ro.innerHTML =
      '<div><span style="color:#A78BFA;font-weight:700">'+zStr+'</span></div>'+
      '<div><span style="color:#7FD8C0;font-weight:700">\u0393</span> = '+Gmag.toFixed(3)+' \u2220 '+Gang.toFixed(1)+'\u00b0</div>'+
      '<div><span style="color:#FFD580;font-weight:700">VSWR</span> = '+(vswr===Infinity||vswr>100?'\u221e':vswr.toFixed(2))+' : 1</div>';
  }

  drawD40ZPlane(R, X, Z0, isOpen);
  drawD40GPlane(GRe, GIm, R, X, isOpen);
};

function drawD40ZPlane(R, X, Z0, isOpen) {
  var canvas = document.getElementById('d40-zplane');
  if (!canvas) return;
  var dpr = window.devicePixelRatio||1;
  var W = canvas.offsetWidth, H = canvas.offsetHeight;
  if (!W||!H) return;
  canvas.width = Math.round(W*dpr); canvas.height = Math.round(H*dpr);
  var ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr);
  var isEn = currentLang === 'en';
  var GS = "'Google Sans',sans-serif", MONO = "'JetBrains Mono',monospace";

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#FAFBFF'; ctx.fillRect(0,0,W,H);

  var cx = W*0.30, cy = H*0.5;
  var scale = Math.min(W*0.55, H*0.42) / 220; // maps ~220 ohm to edge

  function toPx(r,x){ return { x: cx + r*scale, y: cy - x*scale }; }

  // Axes (unbounded look — arrows at edges)
  ctx.strokeStyle = '#8898B0'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(8,cy); ctx.lineTo(W-8,cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx,8); ctx.lineTo(cx,H-8); ctx.stroke();
  // arrowheads
  function arrow(x,y,dx,dy){ ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-dx*7-dy*4,y-dy*7+dx*4); ctx.lineTo(x-dx*7+dy*4,y-dy*7-dx*4); ctx.closePath(); ctx.fillStyle='#8898B0'; ctx.fill(); }
  arrow(W-8,cy,1,0); arrow(cx,8,0,-1);

  ctx.fillStyle = '#5A6A7A'; ctx.font = '10px '+MONO; ctx.textAlign='left';
  ctx.fillText('R \u2192 +\u221e', W-58, cy-8);
  ctx.fillText('X', cx+6, 18);
  ctx.fillText('-\u221e', cx+6, H-10);

  // Z0 reference tick
  var pZ0 = toPx(Z0,0);
  ctx.strokeStyle = '#0F8C50'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pZ0.x,cy-5); ctx.lineTo(pZ0.x,cy+5); ctx.stroke();
  ctx.fillStyle = '#0F8C50'; ctx.font='9px '+MONO; ctx.textAlign='center';
  ctx.fillText('Z\u2080', pZ0.x, cy+18);

  // Current point
  var p = isOpen ? { x: W-14, y: cy } : toPx(R,X);
  var clampedX = Math.max(10, Math.min(W-10, p.x));
  var clampedY = Math.max(10, Math.min(H-10, p.y));
  ctx.strokeStyle = '#C8860D'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(clampedX,clampedY); ctx.stroke();
  var glow = ctx.createRadialGradient(clampedX,clampedY,0,clampedX,clampedY,14);
  glow.addColorStop(0,'#C8860D66'); glow.addColorStop(1,'transparent');
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(clampedX,clampedY,14,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#C8860D'; ctx.beginPath(); ctx.arc(clampedX,clampedY,6,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(clampedX,clampedY,6,0,Math.PI*2); ctx.stroke();

  ctx.fillStyle = '#7A5200'; ctx.font = 'bold 10px '+MONO; ctx.textAlign='left';
  var lx = clampedX+10 < W-70 ? clampedX+10 : clampedX-90;
  var zLabel = isOpen ? 'Z = \u221e' : ('Z = '+R.toFixed(0)+(X>=0?'+j':'\u2212j')+Math.abs(X).toFixed(0));
  ctx.fillText(zLabel, lx, clampedY-6);

  ctx.fillStyle = '#6B7A90'; ctx.font='8px '+GS; ctx.textAlign='center';
  ctx.fillText(isEn?'no boundary — point can go anywhere':'경계 없음 — 점이 어디든 갈 수 있음', W/2, H-6);
}

function drawD40GPlane(GRe, GIm, R, X, isOpen) {
  var canvas = document.getElementById('d40-gplane');
  if (!canvas) return;
  var dpr = window.devicePixelRatio||1;
  var W = canvas.offsetWidth, H = canvas.offsetHeight;
  if (!W||!H) return;
  canvas.width = Math.round(W*dpr); canvas.height = Math.round(H*dpr);
  var ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr);
  var isEn = currentLang === 'en';
  var GS = "'Google Sans',sans-serif", MONO = "'JetBrains Mono',monospace";

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#FAFBFF'; ctx.fillRect(0,0,W,H);

  var cx = W*0.5, cy = H*0.5;
  var rad = Math.min(W*0.40, H*0.40);

  // Unit circle boundary
  ctx.strokeStyle = '#C8860D'; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.arc(cx,cy,rad,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle = 'rgba(200,134,13,0.04)';
  ctx.beginPath(); ctx.arc(cx,cy,rad,0,Math.PI*2); ctx.fill();

  // Axes
  ctx.strokeStyle = '#8898B0'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx-rad-14,cy); ctx.lineTo(cx+rad+14,cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx,cy-rad-14); ctx.lineTo(cx,cy+rad+14); ctx.stroke();
  ctx.fillStyle = '#5A6A7A'; ctx.font='10px '+MONO; ctx.textAlign='left';
  ctx.fillText('Re \u0393', cx+rad+18, cy-8);
  ctx.fillText('Im \u0393', cx+5, cy-rad-18);

  // Key reference points (skip label if current point sits right on top of it)
  function dot(u,v,col,label,lx,ly){
    var px = cx+u*rad, py = cy-v*rad;
    var distToCurrent = Math.hypot(cx+GRe*rad-px, cy-GIm*rad-py);
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(px,py,3,0,Math.PI*2); ctx.fill();
    if (distToCurrent > 26) {
      ctx.fillStyle = col; ctx.font='9px '+MONO; ctx.textAlign='center';
      ctx.fillText(label, px+lx, py+ly);
    }
  }
  dot(0,0,'#0F8C50', isEn?'Matched':'\uc815\ud569', 0,18);
  dot(1,0,'#C0392B', 'Open', 4,22);
  dot(-1,0,'#1A6FB5', 'Short', -4,22);

  // Current point
  var px = cx+GRe*rad, py = cy-GIm*rad;
  ctx.strokeStyle = '#C8860D'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(px,py); ctx.stroke();
  var glow = ctx.createRadialGradient(px,py,0,px,py,14);
  glow.addColorStop(0,'#C8860D66'); glow.addColorStop(1,'transparent');
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(px,py,14,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#C8860D'; ctx.beginPath(); ctx.arc(px,py,6,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(px,py,6,0,Math.PI*2); ctx.stroke();

  var Gmag = Math.sqrt(GRe*GRe+GIm*GIm), Gang = Math.atan2(GIm,GRe)*180/Math.PI;
  ctx.fillStyle = '#7A5200'; ctx.font = 'bold 10px '+MONO;
  var labelStr = '\u0393='+Gmag.toFixed(2)+'\u2220'+Gang.toFixed(0)+'\u00b0';
  var aboveY = py-rad < 16;
  if (aboveY) {
    ctx.textAlign = 'center';
    ctx.fillText(labelStr, px, py+22);
  } else {
    ctx.textAlign = (px > cx) ? 'right' : 'left';
    var tx = (px > cx) ? px-10 : px+10;
    ctx.fillText(labelStr, tx, py-10);
  }
  ctx.textAlign = 'left';

  ctx.fillStyle = '#6B7A90'; ctx.font='8px '+GS; ctx.textAlign='center';
  ctx.fillText(isEn?'always confined inside |\u0393|=1':'항상 |\u0393|=1 안에 갇힘', W/2, H-6);
}

/* ═══════════════════════════════════════════
   SIMULATOR — Topic 2 (d41): R-circle / X-arc birth
═══════════════════════════════════════════ */
window._d41Rcircles = [];   // array of R values (Ω)
window._d41Xarcs    = [];   // array of X values (Ω, can be + or -)
window._d41Step     = 0;    // 0 = none, 1..4 = step preset

var D41_COLORS = ['#C0392B','#1A6FB5','#0F8C50','#7030A0','#C8860D','#E87B1E','#0891B2','#A0428B'];

function d41GammaOf(R, X, Z0) {
  var numRe = R-Z0, numIm = X, denRe = R+Z0, denIm = X;
  var denMag2 = denRe*denRe + denIm*denIm || 1e-9;
  return {
    re: (numRe*denRe + numIm*denIm)/denMag2,
    im: (numIm*denRe - numRe*denIm)/denMag2
  };
}

window.setD41Step = function(n) {
  window._d41Step = n;
  window._d41Rcircles = [];
  window._d41Xarcs = [];
  if (n >= 1) window._d41Rcircles.push(0);
  if (n >= 2) window._d41Rcircles.push(50);
  if (n >= 3) { window._d41Xarcs.push(10); window._d41Xarcs.push(0); window._d41Xarcs.push(-5); }
  if (n >= 4) { window._d41Rcircles.push(25); window._d41Rcircles.push(100); }
  renderD41();
};

window.addD41Rcircle = function() {
  var v = parseFloat(document.getElementById('d41-Rinput')?.value);
  if (isNaN(v) || v < 0) return;
  window._d41Step = 0;
  if (window._d41Rcircles.indexOf(v) === -1) window._d41Rcircles.push(v);
  renderD41();
};

window.addD41Xarc = function() {
  var v = parseFloat(document.getElementById('d41-Xinput')?.value);
  if (isNaN(v)) return;
  window._d41Step = 0;
  if (window._d41Xarcs.indexOf(v) === -1) window._d41Xarcs.push(v);
  renderD41();
};

window.clearD41 = function() {
  window._d41Step = 0;
  window._d41Rcircles = [];
  window._d41Xarcs = [];
  renderD41();
};

function renderD41() {
  var isEn = currentLang === 'en';
  var desc = document.getElementById('d41-step-desc');
  if (desc) {
    var step = window._d41Step;
    var msgsKo = ['', 'R=0 (리액티브 부하)들을 Z-plane에 점으로 표시', 'R=0, R=50 두 그룹을 비교', 'X=+10, X=0, X=-5 라인까지 추가', '여러 R-circle을 더 추가해 격자 완성'];
    var msgsEn = ['', 'Plotting R=0 (reactive loads) as points', 'Comparing R=0 and R=50 groups', 'Adding X=+10, X=0, X=-5 lines', 'Adding more R-circles to complete the grid'];
    desc.textContent = (isEn ? msgsEn : msgsKo)[step] || '';
  }
  for (var i=1;i<=4;i++){
    var btn = document.getElementById('d41-step'+i);
    if (btn) btn.classList.toggle('active', window._d41Step === i);
  }
  drawD41ZPlane();
  drawD41GPlane();
}

function drawD41ZPlane() {
  var canvas = document.getElementById('d41-zplane');
  if (!canvas) return;
  var dpr = window.devicePixelRatio||1;
  var W = canvas.offsetWidth, H = canvas.offsetHeight;
  if (!W||!H) return;
  canvas.width = Math.round(W*dpr); canvas.height = Math.round(H*dpr);
  var ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr);
  var isEn = currentLang === 'en';
  var GS = "'Google Sans',sans-serif", MONO = "'JetBrains Mono',monospace";

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#FAFBFF'; ctx.fillRect(0,0,W,H);

  var cx = W*0.28, cy = H*0.5;
  var scale = Math.min(W*0.58, H*0.40) / 130;
  function toPx(r,x){ return { x: cx + r*scale, y: cy - x*scale }; }

  ctx.strokeStyle = '#8898B0'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(8,cy); ctx.lineTo(W-8,cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx,8); ctx.lineTo(cx,H-8); ctx.stroke();
  function arrow(x,y,dx,dy){ ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-dx*7-dy*4,y-dy*7+dx*4); ctx.lineTo(x-dx*7+dy*4,y-dy*7-dx*4); ctx.closePath(); ctx.fillStyle='#8898B0'; ctx.fill(); }
  arrow(W-8,cy,1,0); arrow(cx,8,0,-1);
  ctx.fillStyle = '#5A6A7A'; ctx.font = '9px '+MONO; ctx.textAlign='left';
  ctx.fillText('R', W-16, cy-8);
  ctx.fillText('X', cx+6, 16);

  var Rcircles = window._d41Rcircles || [];
  var Xarcs = window._d41Xarcs || [];

  // sort R-circles by position to detect crowding, then stagger labels
  var Rsorted = Rcircles.map(function(R,idx){ return {R:R, idx:idx, x: toPx(R,0).x}; })
                        .sort(function(a,b){ return a.x-b.x; });
  var rLabelRow = {};
  for (var ri=0; ri<Rsorted.length; ri++) {
    var crowded = ri>0 && (Rsorted[ri].x - Rsorted[ri-1].x) < 34;
    rLabelRow[Rsorted[ri].idx] = crowded ? (rLabelRow[Rsorted[ri-1].idx]===0?1:0) : 0;
  }

  Rcircles.forEach(function(R, idx){
    var col = D41_COLORS[idx % D41_COLORS.length];
    var p1 = toPx(R, -130), p2 = toPx(R, 130);
    var cxp = Math.max(10, Math.min(W-10, p1.x));
    ctx.strokeStyle = col; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(cxp, Math.max(8,p1.y)); ctx.lineTo(cxp, Math.min(H-8,p2.y)); ctx.stroke();
    ctx.fillStyle = col; ctx.font = 'bold 9px '+MONO; ctx.textAlign='center';
    var rowY = (rLabelRow[idx]===1) ? H-20 : H-8;
    ctx.fillText('R='+R, cxp, rowY);
  });

  Xarcs.forEach(function(X, idx){
    var col = D41_COLORS[(idx+4) % D41_COLORS.length];
    var p1 = toPx(0, X), p2 = toPx(130, X);
    var cyp = Math.max(8, Math.min(H-8, p1.y));
    ctx.strokeStyle = col; ctx.lineWidth = 2;
    ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(Math.max(cx,p1.x), cyp); ctx.lineTo(Math.min(W-8,p2.x), cyp); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = col; ctx.font = 'bold 9px '+MONO; ctx.textAlign='left';
    ctx.fillText('X='+(X>=0?'+':'')+X, Math.min(W-50,p2.x-44), cyp - (X>=0?6:-13));
  });

  if (!Rcircles.length && !Xarcs.length) {
    ctx.fillStyle = '#9AA5B5'; ctx.font = '11px '+GS; ctx.textAlign='center';
    ctx.fillText(isEn?'Use Step buttons or add a circle/arc above':'위 Step 버튼이나 추가 버튼을 눌러보세요', W/2, H/2+40);
  }
}

function drawD41GPlane() {
  var canvas = document.getElementById('d41-gplane');
  if (!canvas) return;
  var dpr = window.devicePixelRatio||1;
  var W = canvas.offsetWidth, H = canvas.offsetHeight;
  if (!W||!H) return;
  canvas.width = Math.round(W*dpr); canvas.height = Math.round(H*dpr);
  var ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr);
  var isEn = currentLang === 'en';
  var MONO = "'JetBrains Mono',monospace";

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#FAFBFF'; ctx.fillRect(0,0,W,H);

  var cx = W*0.5, cy = H*0.5;
  var rad = Math.min(W*0.42, H*0.42);
  var Z0 = 50;

  ctx.strokeStyle = '#444'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(cx,cy,rad,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle = '#D8D5CE'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx-rad,cy); ctx.lineTo(cx+rad,cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx,cy-rad); ctx.lineTo(cx,cy+rad); ctx.stroke();

  var Rcircles = window._d41Rcircles || [];
  var Xarcs = window._d41Xarcs || [];

  Rcircles.forEach(function(R, idx){
    var col = D41_COLORS[idx % D41_COLORS.length];
    var ctr = R/(R+Z0), r = Z0/(R+Z0);
    var px = cx + ctr*rad, py = cy, pr = r*rad;
    ctx.strokeStyle = col; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.arc(px,py,pr,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle = col; ctx.font = 'bold 9px '+MONO; ctx.textAlign='center';
    var lx = px+pr, ly = py-4;
    if (R===0) { lx = cx; ly = cy-rad-10; }
    ctx.fillText('R='+R, Math.max(14,Math.min(W-14,lx)), Math.max(12,Math.min(H-6,ly)));
  });

  Xarcs.forEach(function(X, idx){
    var col = D41_COLORS[(idx+4) % D41_COLORS.length];
    if (X === 0) {
      ctx.strokeStyle = col; ctx.lineWidth = 1.8;
      ctx.setLineDash([6,4]);
      ctx.beginPath(); ctx.moveTo(cx-rad,cy); ctx.lineTo(cx+rad,cy); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = col; ctx.font='bold 9px '+MONO; ctx.textAlign='left';
      ctx.fillText('X=0', cx-rad+4, cy-6);
      return;
    }
    var ctrXnorm = 1/X;
    var rNorm = 1/Math.abs(X);
    var pcx = cx + 1*rad;
    var pcy = cy - ctrXnorm*rad;
    var pr  = rNorm*rad;
    ctx.save();
    ctx.beginPath(); ctx.arc(cx,cy,rad,0,Math.PI*2); ctx.clip();
    ctx.strokeStyle = col; ctx.lineWidth = 2.2;
    // scale dash pattern down for small arcs so the dashes don't get lost
    var dashUnit = Math.max(1.5, Math.min(5, pr*0.35));
    ctx.setLineDash([dashUnit, dashUnit*0.8]);
    ctx.beginPath(); ctx.arc(pcx,pcy,pr,0,Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
    // small solid marker dot where the arc crosses the boundary, to anchor visibility for thin arcs
    var gEdge = d41GammaOf(0, X, Z0);
    var ex = cx + gEdge.re*rad, ey = cy - gEdge.im*rad;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(ex, ey, 2.6, 0, Math.PI*2); ctx.fill();
    var g0 = d41GammaOf(20, X, Z0);
    var lx = cx + g0.re*rad, ly = cy - g0.im*rad;
    ctx.fillStyle = col; ctx.font='bold 9px '+MONO; ctx.textAlign = 'center';
    ctx.fillText('X='+(X>=0?'+':'')+X, lx, ly + (X>=0?-8:16));
  });

  if (!Rcircles.length && !Xarcs.length) {
    ctx.fillStyle = '#9AA5B5'; ctx.font = '11px Google Sans,sans-serif'; ctx.textAlign='center';
    ctx.fillText(isEn?'Smith Chart grid will appear here':'Smith Chart 격자가 여기 나타납니다', W/2, cy);
  }
}

function initD41Sim() {
  if (window._d41Step === 0 && (!window._d41Rcircles || !window._d41Rcircles.length) && (!window._d41Xarcs || !window._d41Xarcs.length)) {
    window.setD41Step(2);
  } else {
    renderD41();
  }
}

window._d42Mode = 'matched'; // 'short' | 'open' | 'matched' | 'custom'

window.setD42Preset = function(mode) {
  window._d42Mode = mode;
  var R = document.getElementById('d42-Rinput'), X = document.getElementById('d42-Xinput');
  R.readOnly = false; R.placeholder = '';
  if (mode === 'short')      { R.value = 0;  X.value = 0; }
  if (mode === 'open')       { R.value = ''; R.placeholder = '\u221e'; R.readOnly = true; X.value = 0; }
  if (mode === 'matched')    { R.value = 50; X.value = 0; }
  if (mode === 'inductive')  { R.value = 50; X.value = 50; }
  if (mode === 'capacitive') { R.value = 50; X.value = -50; }
  updateD42(false);
};

window.updateD42 = function(fromInput) {
  if (fromInput) {
    window._d42Mode = 'custom';
    var Rf = document.getElementById('d42-Rinput');
    if (Rf) { Rf.readOnly = false; Rf.placeholder = ''; }
  }
  var isEn = currentLang === 'en';
  var Z0 = 50;
  var R = parseFloat(document.getElementById('d42-Rinput')?.value);
  var X = parseFloat(document.getElementById('d42-Xinput')?.value);
  if (isNaN(R)) R = 0;
  if (isNaN(X)) X = 0;
  var isOpen = (window._d42Mode === 'open') || R > 100000;

  var GRe, GIm, Gmag, Gang, vswr;
  if (isOpen) {
    GRe = 1; GIm = 0;
  } else {
    var numRe = R-Z0, numIm = X, denRe = R+Z0, denIm = X;
    var denMag2 = denRe*denRe + denIm*denIm || 1e-9;
    GRe = (numRe*denRe + numIm*denIm)/denMag2;
    GIm = (numIm*denRe - numRe*denIm)/denMag2;
  }
  Gmag = Math.sqrt(GRe*GRe+GIm*GIm);
  Gang = Math.atan2(GIm,GRe)*180/Math.PI;
  vswr = Gmag < 0.9995 ? (1+Gmag)/(1-Gmag) : Infinity;

  // highlight active preset button
  ['short','open','matched','inductive','capacitive'].forEach(function(m){
    var btn = document.getElementById('d42-'+m);
    if (btn) btn.classList.toggle('active', window._d42Mode === m);
  });

  drawD42Chart(R, X, isOpen, GRe, GIm);

  var ro = document.getElementById('d42-readout');
  if (!ro) return;

  var stateLabel, stateColor, vLabel, iLabel, desc;
  if (window._d42Mode === 'short') {
    stateLabel = isEn ? 'SHORT CIRCUIT' : '단락 (Short)';
    stateColor = '#7FB8FF';
    vLabel = isEn ? 'Voltage = 0 (cancels)' : '전압 = 0 (상쇄)';
    iLabel = isEn ? 'Current = Maximum (reinforced)' : '전류 = 최대 (보강)';
    desc = isEn
      ? 'The incident wave reflects 100% with phase flipped 180°. Voltage cancels to zero at the load; current doubles.'
      : '입사파가 위상 180° 뒤집힌 채 100% 반사됩니다. 부하 지점에서 전압은 0으로 상쇄되고, 전류는 두 배로 보강됩니다.';
  } else if (window._d42Mode === 'open' || isOpen) {
    stateLabel = isEn ? 'OPEN CIRCUIT' : '개방 (Open)';
    stateColor = '#FF8A8A';
    vLabel = isEn ? 'Voltage = Maximum (reinforced)' : '전압 = 최대 (보강)';
    iLabel = isEn ? 'Current = 0 (no path)' : '전류 = 0 (경로 없음)';
    desc = isEn
      ? 'The incident wave reflects 100% with no phase change. Voltage doubles at the load; current cancels to zero.'
      : '입사파가 위상 변화 없이 100% 반사됩니다. 부하 지점에서 전압은 두 배로 보강되고, 전류는 0으로 상쇄됩니다.';
  } else if (window._d42Mode === 'matched') {
    stateLabel = isEn ? 'MATCHED (Z = Z\u2080)' : '정합 (Z = Z\u2080)';
    stateColor = '#7FD8A0';
    vLabel = isEn ? 'Voltage = constant along line' : '전압 = 선로를 따라 일정';
    iLabel = isEn ? 'Current = constant along line' : '전류 = 선로를 따라 일정';
    desc = isEn
      ? 'All incident energy is absorbed by the load. No reflected wave exists, so no standing wave pattern forms.'
      : '입사파 에너지가 전부 부하에 흡수됩니다. 반사파가 없으므로 정재파 패턴 자체가 생기지 않습니다.';
  } else if (window._d42Mode === 'inductive') {
    stateLabel = isEn ? 'INDUCTIVE LOAD (+jX)' : '유도성 부하 (+jX)';
    stateColor = '#E8B84B';
    vLabel = isEn ? 'Reflected voltage leads the incident wave' : '반사 전압의 위상이 입사파보다 앞섬';
    iLabel = isEn ? 'Standing wave peak shifted toward the load' : '정재파의 전압 최대점이 부하 쪽으로 이동';
    desc = isEn
      ? 'The load looks like a coil: it stores energy in a magnetic field. On the Smith Chart this always sits in the upper half (Im \u0393>0). The reflection coefficient has a positive phase angle, so the first voltage maximum appears closer to the load than with a purely resistive load.'
      : '부하가 코일처럼 행동합니다 — 자기장 형태로 에너지를 저장합니다. Smith Chart에서는 항상 위쪽 절반(Im \u0393>0)에 위치합니다. 반사계수의 위상각이 양(+)이므로, 순저항 부하일 때보다 전압 최대점이 부하에 더 가까운 쪽에서 나타납니다.';
  } else if (window._d42Mode === 'capacitive') {
    stateLabel = isEn ? 'CAPACITIVE LOAD (\u2212jX)' : '용량성 부하 (\u2212jX)';
    stateColor = '#5BA8E0';
    vLabel = isEn ? 'Reflected voltage lags the incident wave' : '반사 전압의 위상이 입사파보다 늦음';
    iLabel = isEn ? 'Standing wave peak shifted away from the load' : '정재파의 전압 최대점이 부하에서 더 멀어짐';
    desc = isEn
      ? 'The load looks like a capacitor: it stores energy in an electric field. On the Smith Chart this always sits in the lower half (Im \u0393<0). The reflection coefficient has a negative phase angle, so the first voltage maximum appears farther from the load than with a purely resistive load.'
      : '부하가 커패시터처럼 행동합니다 — 전기장 형태로 에너지를 저장합니다. Smith Chart에서는 항상 아래쪽 절반(Im \u0393<0)에 위치합니다. 반사계수의 위상각이 음(\u2212)이므로, 순저항 부하일 때보다 전압 최대점이 부하에서 더 먼 쪽에서 나타납니다.';
  } else {
    stateLabel = isEn ? 'CUSTOM LOAD' : '사용자 지정 부하';
    stateColor = '#FFD580';
    var vHigh = Gmag > 0.5;
    vLabel = isEn ? (vHigh ? 'Voltage swing: large' : 'Voltage swing: moderate') : (vHigh ? '전압 출렁임: 큼' : '전압 출렁임: 보통');
    iLabel = isEn ? (vHigh ? 'Current swing: large' : 'Current swing: moderate') : (vHigh ? '전류 출렁임: 큼' : '전류 출렁임: 보통');
    desc = isEn
      ? 'Part of the incident wave reflects back. The larger |\u0393| is, the more standing wave ripple appears along the line.'
      : '입사파의 일부가 반사되어 돌아옵니다. |\u0393|가 클수록 선로를 따라 정재파의 출렁임이 커집니다.';
  }

  var reactRegion = X > 0.001 ? (isEn?'Inductive (+jX)':'유도성 (+jX)') : (X < -0.001 ? (isEn?'Capacitive (\u2212jX)':'용량성 (\u2212jX)') : (isEn?'Purely resistive (X=0)':'순저항 (X=0)'));
  var impRegion = isOpen ? (isEn?'R \u2192 \u221e (highest Z)':'R \u2192 \u221e (최고 임피던스)') : (R > Z0+0.001 ? (isEn?'R > 50\u03a9 (high Z)':'R > 50\u03a9 (고임피던스)') : (R < Z0-0.001 ? (isEn?'R < 50\u03a9 (low Z)':'R < 50\u03a9 (저임피던스)') : (isEn?'R = 50\u03a9':'R = 50\u03a9')));

  ro.innerHTML =
    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">'+
      '<span style="width:10px;height:10px;border-radius:50%;background:'+stateColor+';display:inline-block"></span>'+
      '<span style="font-weight:800;font-size:0.95rem;color:'+stateColor+'">'+stateLabel+'</span>'+
    '</div>'+
    '<div style="font-family:JetBrains Mono,monospace;font-size:0.8rem;color:#E8DCC0;line-height:1.9;margin-bottom:12px">'+
      '<div>Z = '+(isOpen?'\u221e':(R.toFixed(1)+(X>=0?' + j':' \u2212 j')+Math.abs(X).toFixed(1)+' \u03a9'))+'</div>'+
      '<div>\u0393 = '+Gmag.toFixed(3)+' \u2220 '+Gang.toFixed(1)+'\u00b0</div>'+
      '<div>VSWR = '+(vswr===Infinity?'\u221e':vswr.toFixed(2))+' : 1</div>'+
    '</div>'+
    '<div style="border-top:1px solid rgba(255,255,255,0.15);padding-top:10px;margin-bottom:10px;font-size:0.82rem;color:#FFD580;line-height:1.7">'+
      '<div>\u26a1 '+vLabel+'</div>'+
      '<div>\ud83d\udd0c '+iLabel+'</div>'+
    '</div>'+
    '<div style="border-top:1px solid rgba(255,255,255,0.15);padding-top:10px;margin-bottom:10px;font-size:0.78rem;color:#B8C4D8;line-height:1.6">'+desc+'</div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;font-size:0.72rem">'+
      '<span style="background:rgba(255,255,255,0.1);padding:4px 9px;border-radius:12px;color:#FFD580">'+reactRegion+'</span>'+
      '<span style="background:rgba(255,255,255,0.1);padding:4px 9px;border-radius:12px;color:#7FD8C0">'+impRegion+'</span>'+
    '</div>';
};

function drawD42Chart(R, X, isOpen, GRe, GIm) {
  var canvas = document.getElementById('d42-chart');
  if (!canvas) return;
  var dpr = window.devicePixelRatio||1;
  var W = canvas.offsetWidth, H = canvas.offsetHeight;
  if (!W||!H) return;
  canvas.width = Math.round(W*dpr); canvas.height = Math.round(H*dpr);
  var ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr);
  var isEn = currentLang === 'en';
  var MONO = "'JetBrains Mono',monospace";

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#FAFBFF'; ctx.fillRect(0,0,W,H);

  var cx = W*0.5, cy = H*0.5;
  var rad = Math.min(W*0.42, H*0.42);

  // quadrant tints: upper = inductive (warm), lower = capacitive (cool)
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,rad,0,Math.PI*2); ctx.clip();
  ctx.fillStyle = '#FFF3D6'; ctx.fillRect(cx-rad, cy-rad, rad*2, rad);
  ctx.fillStyle = '#E3F0FF'; ctx.fillRect(cx-rad, cy, rad*2, rad);
  // right half (R>50) gets a subtle hatch to mark high impedance
  ctx.fillStyle = 'rgba(0,0,0,0.035)';
  ctx.fillRect(cx, cy-rad, rad, rad*2);
  ctx.restore();

  ctx.strokeStyle = '#444'; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.arc(cx,cy,rad,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle = '#C9C5BC'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx-rad,cy); ctx.lineTo(cx+rad,cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx,cy-rad); ctx.lineTo(cx,cy+rad); ctx.stroke();

  // R=50 circle (center reference)
  ctx.strokeStyle = '#B8B0A0'; ctx.lineWidth = 1;
  ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.arc(cx+rad*0.5, cy, rad*0.5, 0, Math.PI*2); ctx.stroke();
  ctx.setLineDash([]);

  // axis labels
  ctx.fillStyle = '#7A7670'; ctx.font = '9px '+MONO; ctx.textAlign='left';
  ctx.fillText(isEn?'Inductive':'유도성', cx-rad+6, cy-rad+14);
  ctx.fillText(isEn?'Capacitive':'용량성', cx-rad+6, cy+rad-8);
  ctx.textAlign='center';
  ctx.fillStyle = '#9A9488'; ctx.font='9px '+MONO;
  ctx.fillText('Short', cx-rad, cy+16);
  ctx.fillText('Open', cx+rad, cy+16);
  ctx.fillText('Matched', cx, cy+16);

  // current point
  var px = cx + GRe*rad, py = cy - GIm*rad;
  ctx.strokeStyle = '#C8860D'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(px,py); ctx.stroke();
  var glow = ctx.createRadialGradient(px,py,0,px,py,16);
  glow.addColorStop(0,'#C8860D77'); glow.addColorStop(1,'transparent');
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(px,py,16,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#C8860D'; ctx.beginPath(); ctx.arc(px,py,7,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(px,py,7,0,Math.PI*2); ctx.stroke();

  var Gmag = Math.sqrt(GRe*GRe+GIm*GIm), Gang = Math.atan2(GIm,GRe)*180/Math.PI;
  ctx.fillStyle = '#7A5200'; ctx.font = 'bold 10px '+MONO;
  var label = '\u0393='+Gmag.toFixed(2)+'\u2220'+Gang.toFixed(0)+'\u00b0';
  if (py - rad < 16) { ctx.textAlign='center'; ctx.fillText(label, px, py+22); }
  else { ctx.textAlign = (px>cx)?'right':'left'; ctx.fillText(label, px+(px>cx?-10:10), py-10); }
}

function initD42Sim() {
  window.setD42Preset('matched');
}

/* ═══════════════════════════════════════════
   SIMULATOR — Topic 4 (d43): Matching network trajectories
═══════════════════════════════════════════ */
var D43_Z0 = 50;
var D43_LOADS = {
  a: { R: 10,  X: -25 },
  b: { R: 25,  X: 50  },
  c: { R: 80,  X: -40 },
  d: { R: 20,  X: 10  },
  e: { R: 100, X: 0   },
};
window._d43LoadKey = 'a';
window._d43Path = []; // array of {R, X, type} — type: 'load'|'seriesL'|'seriesC'|'shuntL'|'shuntC'

function d43Gamma(R, X) {
  var Z0 = D43_Z0;
  var numRe = R-Z0, numIm = X, denRe = R+Z0, denIm = X;
  var denMag2 = denRe*denRe + denIm*denIm || 1e-9;
  return { re: (numRe*denRe + numIm*denIm)/denMag2, im: (numIm*denRe - numRe*denIm)/denMag2 };
}

window.setD43Load = function(key) {
  window._d43LoadKey = key;
  var L = D43_LOADS[key];
  window._d43Path = [{ R: L.R, X: L.X, type: 'load' }];
  document.querySelectorAll('[id^="d43-load-"]').forEach(function(b){ b.classList.remove('active'); });
  var btn = document.getElementById('d43-load-'+key);
  if (btn) btn.classList.add('active');
  renderD43();
};

window.resetD43Path = function() {
  var L = D43_LOADS[window._d43LoadKey];
  window._d43Path = [{ R: L.R, X: L.X, type: 'load' }];
  renderD43();
};

window.undoD43Element = function() {
  if (window._d43Path.length > 1) window._d43Path.pop();
  renderD43();
};

window.addD43Element = function(type) {
  var cur = window._d43Path[window._d43Path.length-1];
  var R = cur.R, X = cur.X;
  var Z0 = D43_Z0;
  var nextR = R, nextX = X;

  if (type === 'seriesL' || type === 'seriesC') {
    // Series element: R is fixed, only X changes (moves along the constant-R circle).
    // Exact landing on the G=1/Z0 circle (so a single shunt move afterward can finish the match)
    // exists where R/(R^2+X'^2) = 1/Z0  =>  X'^2 = R*Z0 - R^2.
    var EPS = 1e-6;
    var disc = R*Z0 - R*R;
    var addingL = (type === 'seriesL'); // L: X increases : C: X decreases
    if (disc >= -EPS*Z0*Z0 && R <= Z0 + EPS) {
      var root = Math.sqrt(Math.max(0, disc));
      var candidates = [root, -root];
      var reachable = candidates.filter(function(c){ return addingL ? c > X + EPS : c < X - EPS; });
      if (reachable.length) {
        nextX = addingL ? Math.min.apply(null, reachable) : Math.max.apply(null, reachable);
      } else {
        // already past the landing point on this circle; nudge further as a visual step
        var step = Math.max(15, Math.abs(X)*0.4 || 20);
        nextX = addingL ? X + step : X - step;
      }
    } else {
      // R>Z0: this circle never reaches the G=1/Z0 circle — series alone can't finish the match.
      // Step X toward 0 so the user can see movement and try a shunt element instead.
      var step2 = Math.max(15, Math.abs(X)*0.4 || 20);
      nextX = addingL ? X + step2 : X - step2;
    }
    nextR = R;
  } else {
    // Shunt element: G (conductance) is fixed, only B (susceptance) changes (moves along the constant-G circle).
    var EPS2 = 1e-6;
    var denom = R*R + X*X || 1e-9;
    var G = R/denom, B = -X/denom;
    var g = G*Z0; // normalized conductance
    var addingC = (type === 'shuntC'); // C: B increases : L: B decreases
    var b2 = g*(1-g);
    if (g > -EPS2 && g <= 1 + EPS2) {
      var broot = Math.sqrt(Math.max(0,b2));
      var bStart = B*Z0;
      var cands = [broot, -broot];
      var reach = cands.filter(function(c){ return addingC ? c > bStart + EPS2 : c < bStart - EPS2; });
      var bn;
      if (reach.length) {
        bn = addingC ? Math.min.apply(null, reach) : Math.max.apply(null, reach);
      } else {
        var stepB2 = Math.max(0.004, Math.abs(bStart)*0.4 || 0.01);
        bn = addingC ? bStart + stepB2 : bStart - stepB2;
      }
      var Bn = bn/Z0;
      var Ynew_re = G, Ynew_im = Bn;
      var dn = Ynew_re*Ynew_re + Ynew_im*Ynew_im || 1e-9;
      nextR = Ynew_re/dn; nextX = -Ynew_im/dn;
    } else {
      // G outside reachable range for a single shunt landing on R=Z0 — nudge B instead.
      var stepB = Math.max(0.004, Math.abs(B)*0.4 || 0.01);
      var Bn2 = addingC ? B + stepB : B - stepB;
      var dn2 = G*G + Bn2*Bn2 || 1e-9;
      nextR = G/dn2; nextX = -Bn2/dn2;
    }
  }

  window._d43Path.push({ R: nextR, X: nextX, type: type });
  renderD43();
};

function renderD43() {
  drawD43Chart();
  updateD43Readout();
}

function updateD43Readout() {
  var ro = document.getElementById('d43-readout');
  if (!ro) return;
  var isEn = currentLang === 'en';
  var path = window._d43Path;
  var cur = path[path.length-1];
  var G = d43Gamma(cur.R, cur.X);
  var Gmag = Math.sqrt(G.re*G.re+G.im*G.im), Gang = Math.atan2(G.im,G.re)*180/Math.PI;
  var vswr = (1+Gmag)/(Math.max(1e-6,1-Gmag));
  var matched = Gmag < 0.03;

  var typeLabels = {
    load: isEn?'Load':'부하', seriesL: 'Series L', seriesC: 'Series C',
    shuntL: 'Shunt L', shuntC: 'Shunt C'
  };

  var stepsHtml = path.map(function(p, i){
    var label = typeLabels[p.type] || p.type;
    return '<div style="display:flex;justify-content:space-between;gap:8px">'+
      '<span style="color:#B8C4D8">'+(i===0?(isEn?'Start':'시작'):('#'+i+' '+label))+'</span>'+
      '<span style="font-family:JetBrains Mono,monospace;color:#FFD580">'+p.R.toFixed(1)+(p.X>=0?' + j':' \u2212 j')+Math.abs(p.X).toFixed(1)+'</span>'+
    '</div>';
  }).join('');

  ro.innerHTML =
    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">'+
      '<span style="width:10px;height:10px;border-radius:50%;background:'+(matched?'#7FD8A0':'#FFD580')+';display:inline-block"></span>'+
      '<span style="font-weight:800;font-size:0.95rem;color:'+(matched?'#7FD8A0':'#FFD580')+'">'+
        (matched ? (isEn?'MATCHED \u2014 \u0393 \u2248 0':'정합 완료 \u2014 \u0393 \u2248 0') : (isEn?'IN PROGRESS':'진행 중'))+
      '</span>'+
    '</div>'+
    '<div style="font-size:0.74rem;color:#B8C4D8;line-height:1.8;margin-bottom:10px">'+stepsHtml+'</div>'+
    '<div style="border-top:1px solid rgba(255,255,255,0.15);padding-top:10px;margin-bottom:10px;'+
         'font-family:JetBrains Mono,monospace;font-size:0.8rem;color:#E8DCC0;line-height:1.9">'+
      '<div>Z = '+cur.R.toFixed(1)+(cur.X>=0?' + j':' \u2212 j')+Math.abs(cur.X).toFixed(1)+' \u03a9</div>'+
      '<div>\u0393 = '+Gmag.toFixed(3)+' \u2220 '+Gang.toFixed(1)+'\u00b0</div>'+
      '<div>VSWR = '+(vswr>100?'\u221e':vswr.toFixed(2))+' : 1</div>'+
    '</div>'+
    '<div style="font-size:0.78rem;color:#B8C4D8;line-height:1.6">'+
      (matched
        ? (isEn ? 'The path has reached the center of the chart \u2014 the load is now matched to Z\u2080. Try a different load and find your own two-element path.'
                : '경로가 챠트 중심에 도달했습니다 \u2014 이제 부하가 Z₀에 정합되었습니다. 다른 부하를 골라 직접 2소자 경로를 찾아보세요.')
        : (isEn ? 'Add a series or shunt element and watch \u0393 slide along its circle. Aim for the center.'
                : 'Series 또는 Shunt 소자를 추가해 \u0393가 원을 따라 미끄러지는 모습을 확인하세요. 목표는 챠트 중심입니다.'))+
    '</div>';
}

function drawD43Chart() {
  var canvas = document.getElementById('d43-chart');
  if (!canvas) return;
  var dpr = window.devicePixelRatio||1;
  var W = canvas.offsetWidth, H = canvas.offsetHeight;
  if (!W||!H) return;
  canvas.width = Math.round(W*dpr); canvas.height = Math.round(H*dpr);
  var ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr);
  var isEn = currentLang === 'en';
  var MONO = "'JetBrains Mono',monospace";
  var Z0 = D43_Z0;

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#FAFBFF'; ctx.fillRect(0,0,W,H);

  var cx = W*0.5, cy = H*0.5;
  var rad = Math.min(W*0.42, H*0.42);

  ctx.strokeStyle = '#444'; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.arc(cx,cy,rad,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle = '#D8D5CE'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx-rad,cy); ctx.lineTo(cx+rad,cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx,cy-rad); ctx.lineTo(cx,cy+rad); ctx.stroke();

  // R=1 (Z0) reference circle, faint
  ctx.strokeStyle = '#B8B0A0'; ctx.lineWidth = 1;
  ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.arc(cx+rad*0.5, cy, rad*0.5, 0, Math.PI*2); ctx.stroke();
  ctx.setLineDash([]);

  // center target marker
  ctx.fillStyle = '#0F8C50';
  ctx.beginPath(); ctx.arc(cx,cy,4,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#0F8C50'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(cx,cy,9,0,Math.PI*2); ctx.stroke();

  var path = window._d43Path || [];
  if (!path.length) {
    ctx.fillStyle = '#9AA5B5'; ctx.font = '11px Google Sans,sans-serif'; ctx.textAlign='center';
    ctx.fillText(isEn?'Pick a load to begin':'부하를 선택해 시작하세요', W/2, cy);
    return;
  }

  function toXY(R, X) { var g = d43Gamma(R,X); return { x: cx+g.re*rad, y: cy-g.im*rad }; }

  // draw the arcs between consecutive path points along their proper circle
  for (var i=1; i<path.length; i++) {
    var prev = path[i-1], cur = path[i];
    var isSeries = (cur.type === 'seriesL' || cur.type === 'seriesC');
    var isAddingPositive = (cur.type === 'seriesL' || cur.type === 'shuntC'); // X or B increasing
    var col = isSeries ? '#C0392B' : '#1A6FB5';
    ctx.save();
    ctx.beginPath(); ctx.arc(cx,cy,rad,0,Math.PI*2); ctx.clip();
    ctx.strokeStyle = col; ctx.lineWidth = 2.4;
    if (!isSeries) ctx.setLineDash([6,4]);

    var p1 = toXY(prev.R,prev.X), p2 = toXY(cur.R,cur.X);
    var ccx, ccy = cy, crad;
    if (isSeries) {
      // constant-R circle: center (R/(R+Z0))*rad from cx, radius (Z0/(R+Z0))*rad
      var R = prev.R;
      ccx = cx + (R/(R+Z0))*rad; crad = (Z0/(R+Z0))*rad;
    } else {
      // constant-G circle: mirror of the R-circle formula, offset to the LEFT of center
      var G = prev.R/(prev.R*prev.R+prev.X*prev.X || 1e-9);
      var g = G*Z0;
      ccx = cx - (g/(g+1))*rad; crad = (1/(g+1))*rad;
    }
    var ang1 = Math.atan2(p1.y-ccy, p1.x-ccx), ang2 = Math.atan2(p2.y-ccy, p2.x-ccx);
    // Screen space is y-down, so increasing X (math, y-up) corresponds to decreasing screen angle
    // (counter-clockwise in math = clockwise in screen coords drawn with this y-flip).
    // isAddingPositive (L or shunt-C) moves X/B upward in math terms; verified numerically that this
    // corresponds to an INCREASING screen angle, i.e. anticlockwise=false in canvas terms.
    ctx.beginPath(); ctx.arc(ccx, ccy, crad, ang1, ang2, !isAddingPositive);
    ctx.stroke();

    ctx.setLineDash([]);
    ctx.restore();
  }

  // draw points
  path.forEach(function(p, i){
    var pt = toXY(p.R, p.X);
    var isLast = (i === path.length-1);
    var col = (p.type === 'load') ? '#7A5200' : ((p.type==='seriesL'||p.type==='seriesC') ? '#C0392B' : '#1A6FB5');
    if (isLast) {
      var glow = ctx.createRadialGradient(pt.x,pt.y,0,pt.x,pt.y,16);
      glow.addColorStop(0,'#C8860D77'); glow.addColorStop(1,'transparent');
      ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(pt.x,pt.y,16,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#C8860D';
    } else {
      ctx.fillStyle = col;
    }
    ctx.beginPath(); ctx.arc(pt.x,pt.y, isLast?7:5, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(pt.x,pt.y,isLast?7:5,0,Math.PI*2); ctx.stroke();
    if (i === 0) {
      ctx.fillStyle = '#7A5200'; ctx.font = 'bold 9px '+MONO; ctx.textAlign='center';
      ctx.fillText(isEn?'Load':'부하', pt.x, pt.y-12);
    }
  });
}

function initD43Sim() {
  if (!window._d43Path || !window._d43Path.length) {
    window.setD43Load('a');
  } else {
    renderD43();
  }
}
