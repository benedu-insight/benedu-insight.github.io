/* ═══════════════════════════════════════════
   SIMULATOR — Topic 5 (d45): Transmission-line rotation
═══════════════════════════════════════════ */
var D45_Z0 = 50;
var D45_LOADS = {
  a: { R: 10,  X: -25 },
  b: { R: 25,  X: 50  },
  c: { R: 80,  X: -40 },
  d: { R: 20,  X: 10  },
};
window._d45LoadKey = 'a';
window._d45D = 0; // distance toward generator, in wavelengths (0 to 0.5, or 0 to 1.0 in full-range mode)
window._d45Playing = false;
window._d45PlayTimer = null;
window._d45FullRange = false; // advanced toggle: show up to 1λ (two laps) to expose the common "1λ = one lap" misconception

function d45LoadGamma(key) {
  var L = D45_LOADS[key], Z0 = D45_Z0;
  var numRe = L.R-Z0, numIm = L.X, denRe = L.R+Z0, denIm = L.X;
  var denMag2 = denRe*denRe + denIm*denIm || 1e-9;
  return { re: (numRe*denRe + numIm*denIm)/denMag2, im: (numIm*denRe - numRe*denIm)/denMag2 };
}

window.setD45Load = function(key) {
  window._d45LoadKey = key;
  window._d45D = 0;
  document.querySelectorAll('[id^="d45-load-"]').forEach(function(b){ b.classList.remove('active'); });
  var btn = document.getElementById('d45-load-'+key);
  if (btn) btn.classList.add('active');
  var slider = document.getElementById('d45-dslider');
  if (slider) slider.value = 0;
  renderD45();
};

window.toggleD45FullRange = function() {
  window._d45FullRange = !window._d45FullRange;
  var btn = document.getElementById('d45-fullrange');
  var slider = document.getElementById('d45-dslider');
  var isEn = currentLang === 'en';
  if (window._d45FullRange) {
    if (slider) slider.max = '1';
    if (btn) { btn.classList.add('active'); btn.textContent = '🎓 ' + (isEn ? 'Back to 0\u20130.5\u03bb' : '0\u20130.5\u03bb로 되돌리기'); }
  } else {
    if (window._d45D > 0.5) window._d45D = 0.5;
    if (slider) { slider.max = '0.5'; slider.value = window._d45D; }
    if (btn) { btn.classList.remove('active'); btn.textContent = '🎓 ' + (isEn ? 'See up to 1\u03bb (advanced)' : '1\u03bb까지 보기 (심화)'); }
  }
  renderD45();
};

window.updateD45 = function(val) {
  window._d45D = parseFloat(val) || 0;
  renderD45();
};

window.stepD45 = function(delta) {
  var cap = window._d45FullRange ? 1.0 : 0.5;
  var d = window._d45D + delta;
  if (d < 0) d += cap;
  if (d > cap) d -= cap;
  window._d45D = Math.round(d*1000)/1000;
  var slider = document.getElementById('d45-dslider');
  if (slider) slider.value = window._d45D;
  renderD45();
};

window.toggleD45Play = function() {
  var btn = document.getElementById('d45-play');
  if (window._d45Playing) {
    window._d45Playing = false;
    if (window._d45PlayTimer) { clearInterval(window._d45PlayTimer); window._d45PlayTimer = null; }
    if (btn) btn.textContent = (currentLang==='en' ? '\u25b6 Animate' : '\u25b6 자동 회전');
  } else {
    window._d45Playing = true;
    if (btn) btn.textContent = (currentLang==='en' ? '\u23f8 Stop' : '\u23f8 정지');
    window._d45PlayTimer = setInterval(function(){
      var cap = window._d45FullRange ? 1.0 : 0.5;
      var d = window._d45D + 0.004;
      if (d > cap) d -= cap;
      window._d45D = d;
      var slider = document.getElementById('d45-dslider');
      if (slider) slider.value = d;
      renderD45();
    }, 40);
  }
};

function renderD45() {
  drawD45Chart();
  updateD45Readout();
}

function updateD45Readout() {
  var ro = document.getElementById('d45-readout');
  var lbl = document.getElementById('d45-dlabel');
  if (!ro) return;
  var isEn = currentLang === 'en';
  var G0 = d45LoadGamma(window._d45LoadKey);
  var mag = Math.sqrt(G0.re*G0.re+G0.im*G0.im);
  var ang0 = Math.atan2(G0.im, G0.re);
  var d = window._d45D;
  var ang = ang0 - 4*Math.PI*d;
  var Gre = mag*Math.cos(ang), Gim = mag*Math.sin(ang);
  var Z0 = D45_Z0;
  // Z(d) = Z0 (1+G)/(1-G)
  var denRe = 1-Gre, denIm = -Gim;
  var numRe = 1+Gre, numIm = Gim;
  var denMag2 = denRe*denRe+denIm*denIm || 1e-9;
  var Zre = Z0*(numRe*denRe+numIm*denIm)/denMag2;
  var Zim = Z0*(numIm*denRe-numRe*denIm)/denMag2;
  var vswr = (1+mag)/Math.max(1e-6,1-mag);

  if (lbl) lbl.textContent = 'd = ' + d.toFixed(3) + ' \u03bb';

  // distance to nearest Vmax (Re axis positive crossing) in wavelengths, for info
  var angDeg = ((ang*180/Math.PI)%360+360)%360;
  var nearVmax = angDeg < 6 || angDeg > 354;
  var nearVmin = Math.abs(angDeg-180) < 6;

  // lap counter: total angle swept since d=0, in full revolutions (only meaningful/shown in full-range mode)
  var totalDeg = 4*Math.PI*d * 180/Math.PI; // magnitude of phase swept (unwrapped)
  var laps = totalDeg / 360;
  var lapHtml = '';
  if (window._d45FullRange) {
    lapHtml = '<div style="margin-bottom:10px;padding:8px 10px;background:rgba(200,134,13,0.18);border:1px solid #C8860D;border-radius:6px;'+
      'font-size:0.76rem;color:#FFD580;font-family:JetBrains Mono,monospace">'+
      (isEn ? 'Laps completed: ' : '완료한 바퀴 수: ') + laps.toFixed(2) +
      (isEn ? '  (at d=1\u03bb \u2192 2.00 laps, not 1!)' : '  (d=1λ 지점에서 → 2.00바퀴, 1바퀴가 아닙니다!)') +
      '</div>';
  }

  ro.innerHTML =
    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">'+
      '<span style="width:10px;height:10px;border-radius:50%;background:#FFD580;display:inline-block"></span>'+
      '<span style="font-weight:800;font-size:0.95rem;color:#FFD580">'+
        (nearVmax ? (isEn?'NEAR VOLTAGE MAXIMUM':'전압 최대점 근방') : nearVmin ? (isEn?'NEAR VOLTAGE MINIMUM':'전압 최소점 근방') : (isEn?'ON THE LINE':'선로 위'))+
      '</span>'+
    '</div>'+
    lapHtml+
    '<div style="font-family:JetBrains Mono,monospace;font-size:0.8rem;color:#E8DCC0;line-height:1.9;margin-bottom:12px">'+
      '<div>Z(d) = '+Zre.toFixed(1)+(Zim>=0?' + j':' \u2212 j')+Math.abs(Zim).toFixed(1)+' \u03a9</div>'+
      '<div>\u0393 = '+mag.toFixed(3)+' \u2220 '+angDeg.toFixed(1)+'\u00b0</div>'+
      '<div>VSWR = '+(vswr>100?'\u221e':vswr.toFixed(2))+' : 1  <span style="color:#7FD8C0;font-size:0.7rem">'+(isEn?'(constant!)':'(고정!)')+'</span></div>'+
    '</div>'+
    '<div style="border-top:1px solid rgba(255,255,255,0.15);padding-top:10px;font-size:0.78rem;color:#B8C4D8;line-height:1.6">'+
      (isEn
        ? '|\u0393| stays at '+mag.toFixed(3)+' no matter how far d moves \u2014 only the angle (phase) sweeps around the circle. A full lap takes exactly 0.5\u03bb.'
        : 'd가 얼마나 이동하든 |Γ|는 '+mag.toFixed(3)+'로 고정됩니다 \u2014 오직 각도(위상)만 원을 따라 회전합니다. 한 바퀴를 도는 데 정확히 0.5λ가 걸립니다.')+
    '</div>';
}

function drawD45Chart() {
  var canvas = document.getElementById('d45-chart');
  if (!canvas) return;
  var dpr = window.devicePixelRatio||1;
  var W = canvas.offsetWidth, H = canvas.offsetHeight;
  if (!W||!H) return;
  canvas.width = Math.round(W*dpr); canvas.height = Math.round(H*dpr);
  var ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr);
  var isEn = currentLang === 'en';
  var MONO = "'JetBrains Mono',monospace";

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#FAFBFF'; ctx.fillRect(0,0,W,H);

  var cx = W*0.5, cy = H*0.5;
  var rad = Math.min(W*0.42, H*0.42);

  ctx.strokeStyle = '#444'; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.arc(cx,cy,rad,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle = '#D8D5CE'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx-rad,cy); ctx.lineTo(cx+rad,cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx,cy-rad); ctx.lineTo(cx,cy+rad); ctx.stroke();

  var G0 = d45LoadGamma(window._d45LoadKey);
  var mag = Math.sqrt(G0.re*G0.re+G0.im*G0.im);
  var ang0 = Math.atan2(G0.im, G0.re);

  // constant-|Gamma| circle (the rotation path)
  ctx.strokeStyle = '#C8860D'; ctx.lineWidth = 1.6;
  ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.arc(cx, cy, mag*rad, 0, Math.PI*2); ctx.stroke();
  ctx.setLineDash([]);

  // mark Vmax (Re axis +) and Vmin (Re axis -) on this circle
  var vmaxX = cx + mag*rad, vmaxY = cy;
  var vminX = cx - mag*rad, vminY = cy;
  ctx.fillStyle = '#0F8C50';
  ctx.beginPath(); ctx.arc(vmaxX, vmaxY, 4.5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#1A6FB5';
  ctx.beginPath(); ctx.arc(vminX, vminY, 4.5, 0, Math.PI*2); ctx.fill();
  ctx.font = '9px '+MONO; ctx.textAlign='center';
  ctx.fillStyle = '#0F8C50'; ctx.fillText(isEn?'Vmax':'전압최대', vmaxX, vmaxY-10);
  ctx.fillStyle = '#1A6FB5'; ctx.fillText(isEn?'Vmin':'전압최소', vminX, vminY-10);

  // load position (faint, fixed reference)
  var loadX = cx + G0.re*rad, loadY = cy - G0.im*rad;
  ctx.fillStyle = '#C8B89A';
  ctx.beginPath(); ctx.arc(loadX, loadY, 5, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(loadX, loadY, 5, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = '#9A8A68'; ctx.font='9px '+MONO; ctx.textAlign='center';
  ctx.fillText(isEn?'Load (d=0)':'부하 (d=0)', loadX, loadY+16);

  // current rotated point
  var d = window._d45D;
  var ang = ang0 - 4*Math.PI*d;
  var px = cx + mag*Math.cos(ang)*rad, py = cy - mag*Math.sin(ang)*rad;

  // arc traveled so far (from load to current point, clockwise = toward generator).
  // In full-range (advanced) mode, d can exceed 0.5λ, meaning more than one full lap (2π) of
  // phase has been swept. A single ctx.arc() call cannot visually distinguish multiple overlapping
  // laps, so each completed lap is drawn as its own pass with a slightly different inset radius —
  // this is what makes "you actually went around twice" visible rather than just numerically true.
  var totalSweptRad = 4*Math.PI*d; // total |angle swept| since d=0, unwrapped
  var fullLaps = Math.floor(totalSweptRad / (2*Math.PI));
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,rad,0,Math.PI*2); ctx.clip();
  for (var lap=0; lap<=fullLaps; lap++) {
    var lapStartRad = lap*2*Math.PI;
    var lapEndRad = Math.min((lap+1)*2*Math.PI, totalSweptRad);
    if (lapEndRad <= lapStartRad) continue;
    var rInset = mag*rad - lap*5; // each completed lap drawn 5px further inward so laps don't perfectly overlap
    if (rInset < 4) rInset = 4;
    var sAng = -ang0 - lapStartRad, eAng = -ang0 - lapEndRad;
    ctx.strokeStyle = lap === 0 ? '#C8860Daa' : '#7030A0aa';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy, rInset, sAng, eAng, false);
    ctx.stroke();
  }
  ctx.restore();

  var glow = ctx.createRadialGradient(px,py,0,px,py,16);
  glow.addColorStop(0,'#C8860D77'); glow.addColorStop(1,'transparent');
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(px,py,16,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#C8860D'; ctx.beginPath(); ctx.arc(px,py,7,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(px,py,7,0,Math.PI*2); ctx.stroke();
}

function initD45Sim() {
  renderD45();
}


/* ═══════════════════════════════════════════
   RENDER DETAIL
═══════════════════════════════════════════ */
function renderDetail(id) {
  const s = getSlide(id);
  if (!s) return;
  const isEn = currentLang === 'en';
  const area = document.getElementById('slide-area');

  const theoriesHtml = s.theories.map(t => `
    <div class="theory-card">
      <h4>${t.icon} ${t.title}</h4>
      <p>${t.body}</p>
    </div>`).join('');

  const equationsHtml = s.equations && s.equations.length ? s.equations.map(e => `
    <div class="eq-block">
      $$${e.tex}$$
      ${e.label ? `<div class="eq-label">${e.label}</div>` : ''}
    </div>`).join('') : '';

  const classroomHtml = s.classroom && s.classroom.opts && s.classroom.opts.length ? `
    <div class="quiz-card">
      <div class="quiz-q">🎓 ${isEn ? 'Comprehension Check' : '이해 점검'}: ${s.classroom.q}</div>
      <div class="quiz-opts">
        ${s.classroom.opts.map(o => `
          <div class="quiz-opt" onclick="checkQuiz(this, ${o.correct}, '${id}')">
            <span class="opt-key">${o.key}</span>
            <span>${o.text}</span>
          </div>`).join('')}
      </div>
      <div class="quiz-feedback" id="qfb-${id}"></div>
    </div>` : '';

  const connHtml = s.connections && s.connections.length ? `
    <div style="margin-top:20px">
      <div style="font-size:0.72rem;color:var(--text-sub);margin-bottom:8px;font-family:var(--mono);text-transform:uppercase;letter-spacing:0.06em">
        ${isEn ? 'Connected Topics' : '연결 토픽'}
      </div>
      <div class="connections">
        ${s.connections.map(c => {
          const cs = getSlide(c);
          return cs ? `<div class="conn-chip" onclick="navigateTo('${c}')">${cs.eyebrow || c}</div>` : '';
        }).join('')}
      </div>
    </div>` : '';

  let diagramHtml = '';
  if (id === 'd40h') diagramHtml = buildD40hDiagram(isEn);
  else if (id === 'd40p') diagramHtml = buildD40pDiagram(isEn);
  else if (id === 'd40') diagramHtml = buildD40Diagram(isEn);
  else if (id === 'd41') diagramHtml = buildD41Diagram(isEn);
  else if (id === 'd42') diagramHtml = buildD42Diagram(isEn);
  else if (id === 'd43') diagramHtml = buildD43Diagram(isEn);
  else if (id === 'd45') diagramHtml = buildD45Diagram(isEn);
  else if (s.placeholder) diagramHtml = buildPlaceholderDiagram(isEn, s.eyebrow, s.title);

  let deepHtml = '';

  area.innerHTML = `
    <div class="slide-header">
      <div class="slide-eyebrow">${s.eyebrow}</div>
      <div class="slide-title">${s.title}</div>
      ${s.subtitle ? `<div class="slide-subtitle">${s.subtitle}</div>` : ''}
    </div>

    <div class="tab-row">
      <button class="tab-btn ${currentTab==='diagram'?'active':''}" onclick="switchTab('diagram')">
        📊 ${isEn ? 'Diagram / Lab' : '다이어그램 / 실습'}
      </button>
      <button class="tab-btn ${currentTab==='concepts'?'active':''}" onclick="switchTab('concepts')">
        📖 ${isEn ? 'Key Concepts' : '핵심 개념'}
      </button>
      ${equationsHtml ? `
      <button class="tab-btn ${currentTab==='equations'?'active':''}" onclick="switchTab('equations')">
        🔢 ${isEn ? 'Equations' : '수식'}
      </button>` : ''}
      ${deepHtml ? `
      <button class="tab-btn ${currentTab==='deep'?'active':''}" onclick="switchTab('deep')">
        📚 ${isEn ? 'Deep Study' : '심화 학습'}
      </button>` : ''}
      ${classroomHtml ? `
      <button class="tab-btn ${currentTab==='classroom'?'active':''}" onclick="switchTab('classroom')">
        🎓 ${isEn ? 'Classroom' : '교실'}
      </button>` : ''}
    </div>

    <div id="tab-diagram" class="tab-pane ${currentTab==='diagram'?'active':''}">${diagramHtml}</div>
    <div id="tab-concepts" class="tab-pane ${currentTab==='concepts'?'active':''}">
      <div class="theory-grid">${theoriesHtml}</div>
      ${connHtml}
    </div>
    ${equationsHtml ? `<div id="tab-equations" class="tab-pane ${currentTab==='equations'?'active':''}">${equationsHtml}</div>` : ''}
    ${deepHtml ? `<div id="tab-deep" class="tab-pane ${currentTab==='deep'?'active':''}">${deepHtml}</div>` : ''}
    ${classroomHtml ? `<div id="tab-classroom" class="tab-pane ${currentTab==='classroom'?'active':''}">${classroomHtml}</div>` : ''}
  `;

  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise();

  // 각 슬라이드별 시뮬 초기화
  if (id === 'd40') setTimeout(() => initD40Sim(), 80);
  if (id === 'd41') setTimeout(() => initD41Sim(), 80);
  if (id === 'd42') setTimeout(() => initD42Sim(), 80);
  if (id === 'd43') setTimeout(() => initD43Sim(), 80);
  if (id === 'd45') setTimeout(() => initD45Sim(), 80);
}



/* ═══════════════════════════════════════════
   REVEAL TOGGLE
═══════════════════════════════════════════ */
window.toggleReveal = function(id) {
  const body = document.getElementById(id);
  const hdr  = body?.previousElementSibling;
  if (!body) return;
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  hdr?.classList.toggle('open', !isOpen);
};

/* ═══════════════════════════════════════════
   NAVIGATION & EVENTS
═══════════════════════════════════════════ */
function navigateTo(id) {
  if (window._d40Anim) { cancelAnimationFrame(window._d40Anim); window._d40Anim = null; }
  if (window._d45PlayTimer) { clearInterval(window._d45PlayTimer); window._d45PlayTimer = null; window._d45Playing = false; }
  currentId = id;
  currentTab = 'diagram';
  renderDetail(id);
  renderSidebar();
  window.scrollTo(0, 0);
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  const pane = document.getElementById('tab-' + tab);
  if (pane) pane.classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b => {
    if (b.getAttribute('onclick') === `switchTab('${tab}')`) b.classList.add('active');
  });
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise();
  // 탭 전환 후 시뮬 재초기화
  if (tab === 'diagram') {
    if (currentId === 'd40') setTimeout(() => initD40Sim(), 80);
    if (currentId === 'd41') setTimeout(() => initD41Sim(), 80);
    if (currentId === 'd42') setTimeout(() => initD42Sim(), 80);
    if (currentId === 'd43') setTimeout(() => initD43Sim(), 80);
    if (currentId === 'd45') setTimeout(() => initD45Sim(), 80);
  }
}

function setLang(lang) {
  if (window._d40Anim) { cancelAnimationFrame(window._d40Anim); window._d40Anim = null; }
  if (window._d45PlayTimer) { clearInterval(window._d45PlayTimer); window._d45PlayTimer = null; window._d45Playing = false; }
  currentLang = lang;
  document.getElementById('btn-ko').classList.toggle('active', lang === 'ko');
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  renderDetail(currentId);
  renderSidebar();
}

function checkQuiz(el, correct, id) {
  const opts = el.parentElement.querySelectorAll('.quiz-opt');
  opts.forEach(o => o.style.pointerEvents = 'none');
  el.classList.add(correct ? 'correct' : 'wrong');
  const fb = document.getElementById('qfb-' + id);
  const s  = getSlide(id);
  if (fb && s) {
    fb.textContent = correct ? s.classroom.feedback_ok : s.classroom.feedback_ng;
    fb.className   = 'quiz-feedback show ' + (correct ? 'ok' : 'ng');
  }
}

function openImgPopup(src, cap) {
  var img = document.getElementById('img-popup-img');
  var viewport = document.getElementById('img-popup-viewport');
  img.src = src;
  document.getElementById('img-popup-cap').textContent = cap;
  viewport.classList.remove('zoomed');
  viewport.scrollTop = 0;
  viewport.scrollLeft = 0;
  document.getElementById('img-popup').classList.add('open');
  document.addEventListener('keydown', handleImgPopupKey);
}
function closeImgPopup() {
  document.getElementById('img-popup').classList.remove('open');
  document.getElementById('img-popup-viewport').classList.remove('zoomed');
  document.removeEventListener('keydown', handleImgPopupKey);
}
function handleImgPopupKey(e) {
  if (e.key === 'Escape') closeImgPopup();
}
function toggleImgZoom(e) {
  var viewport = document.getElementById('img-popup-viewport');
  var isZoomed = viewport.classList.contains('zoomed');
  if (!isZoomed) {
    // figure out click position relative to the (unzoomed) image to zoom toward that point
    var img = document.getElementById('img-popup-img');
    var rect = img.getBoundingClientRect();
    var relX = (e.clientX - rect.left) / rect.width;
    var relY = (e.clientY - rect.top) / rect.height;
    viewport.classList.add('zoomed');
    // after layout updates with the new larger image size, scroll so the clicked point stays centered
    requestAnimationFrame(function() {
      var img2 = document.getElementById('img-popup-img');
      var targetX = relX * img2.offsetWidth - viewport.clientWidth / 2;
      var targetY = relY * img2.offsetHeight - viewport.clientHeight / 2;
      viewport.scrollLeft = Math.max(0, targetX);
      viewport.scrollTop = Math.max(0, targetY);
    });
  } else {
    viewport.classList.remove('zoomed');
    viewport.scrollTop = 0;
    viewport.scrollLeft = 0;
  }
}

/* ── Responsive Canvas: resize handler ── */
function reinitCurrentSimulator() {
  if (currentId === 'd40') { if (window._d40Anim) { cancelAnimationFrame(window._d40Anim); window._d40Anim = null; } initD40Sim(); }
  if (currentId === 'd41') { initD41Sim(); }
  if (currentId === 'd42') { initD42Sim(); }
  if (currentId === 'd43') { initD43Sim(); }
  if (currentId === 'd45') { initD45Sim(); }
}

var _resizeTimer = null;
window.addEventListener('resize', function() {
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(function() {
    reinitCurrentSimulator();
  }, 120);
});

window.addEventListener('DOMContentLoaded', () => {
  renderSidebar();
  renderDetail(currentId);
});
</script>
