<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRISM — Benedu Insight</title>
<link rel="icon" type="image/png"
      href="https://raw.githubusercontent.com/benedu-insight/benedu-insight.github.io/refs/heads/main/logo_png/benedu_insight_Symbol.png">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════
   PRISM Launcher — index.html  (Light topbar)
   Benedu Insight © 2025
═══════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

html, body {
  height:100%; width:100%; overflow:hidden;
  font-family:'Google Sans',sans-serif;
  background:#F0F2F5;
}

/* ── Top bar — Light ── */
.topbar {
  position:fixed; top:0; left:0; right:0;
  height:52px;
  background:#FFFFFF;
  border-bottom:1px solid #D8DDE6;
  box-shadow:0 1px 4px rgba(0,0,0,.07);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 22px; z-index:100;
}
.topbar-left  { display:flex; align-items:center; gap:14px; }
.topbar-right { display:flex; align-items:center; gap:18px; }

/* Brand */
.brand-block  { display:flex; flex-direction:column; gap:2px; line-height:1; }
.brand-name   { font-size:18px; font-weight:700; color:#1A2332; letter-spacing:.3px; }
.brand-sub    { font-family:'JetBrains Mono',monospace; font-size:10px; color:#8A96A8; letter-spacing:.07em; }
.brand-ver    {
  font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600;
  color:#0F8C50; background:#E6F4ED;
  border:1px solid rgba(15,140,80,.25);
  padding:3px 10px; border-radius:4px;
}

/* Divider */
.topbar-div { width:1px; height:22px; background:#D8DDE6; }

/* All rights reserved badge */
.topbar-badge {
  font-size:11px; font-weight:600; color:#7030A0;
  background:#F2EAF9; border:1px solid rgba(112,48,160,.2);
  padding:3px 10px; border-radius:4px;
  font-family:'JetBrains Mono',monospace;
  letter-spacing:.03em;
}

/* Copyright */
.topbar-cr {
  font-size:11.5px; color:#8A96A8;
  font-family:'JetBrains Mono',monospace;
}

/* Logo */
.logo-link img { height:28px; display:block; opacity:.85; transition:opacity .2s; }
.logo-link:hover img { opacity:1; }

/* ── iframe wrapper ── */
.frame-wrap { position:fixed; top:52px; left:0; right:0; bottom:0; }
#prismFrame { width:100%; height:100%; border:none; display:block; }

/* ── Loading overlay ── */
.loading-overlay {
  position:absolute; inset:0;
  background:#F0F2F5;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:18px; z-index:10;
  transition:opacity .5s ease;
}
.loading-overlay.hidden { opacity:0; pointer-events:none; }
.loading-title {
  font-size:26px; font-weight:700; letter-spacing:.5px;
  background:linear-gradient(135deg,#0F8C50 0%,#7030A0 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
.loading-sub {
  font-family:'JetBrains Mono',monospace;
  font-size:9.5px; color:#8A96A8; letter-spacing:.1em;
}
.loading-bar-wrap { width:160px; height:2px; background:#D8DDE6; border-radius:2px; overflow:hidden; }
.loading-bar {
  height:100%; width:0%;
  background:linear-gradient(90deg,#0F8C50,#7030A0);
  border-radius:2px;
  animation:loadprog 1.2s ease forwards;
}
@keyframes loadprog { 0%{width:0%} 60%{width:80%} 100%{width:100%} }
</style>
</head>
<body>

<!-- ── Light Top bar ── -->
<div class="topbar">
  <div class="topbar-left">
    <div class="brand-block">
      <span class="brand-name">PRISM</span>
      <span class="brand-sub">Plasma RF Impedance Simulation Matrix</span>
    </div>
    <span class="brand-ver">v1.0</span>
    <div class="topbar-div"></div>
    <span class="topbar-badge">All Rights Reserved</span>
  </div>
  <div class="topbar-right">
    <span class="topbar-cr">© 2026 Benedu Insight</span>
    <a href="https://benedu-insight.github.io/" target="_blank" class="logo-link"
       title="Benedu Insight — Plasma School for Semiconductor &amp; RF Transmission Theory">
      <img src="https://github.com/benedu-insight/benedu-insight.github.io/blob/main/logo_png/benedu_insight_logo_EN_horizontal.png?raw=true"
           alt="Benedu Insight — Plasma School for Semiconductor &amp; RF Transmission Theory"
           onerror="this.style.display='none'">
    </a>
  </div>
</div>

<!-- ── iframe ── -->
<div class="frame-wrap">
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-title">PRISM</div>
    <div class="loading-sub">Plasma RF Impedance Simulation Matrix</div>
    <div class="loading-bar-wrap"><div class="loading-bar"></div></div>
    <div class="loading-sub" style="font-size:9px;">Loading simulator…</div>
  </div>
  <iframe id="prismFrame"
          src="prism.html"
          title="PRISM RF Matcher Engine"
          sandbox="allow-scripts allow-same-origin allow-forms allow-downloads">
  </iframe>
</div>

<script>
document.getElementById('prismFrame').addEventListener('load', () => {
  setTimeout(() => {
    document.getElementById('loadingOverlay').classList.add('hidden');
  }, 300);
});
</script>
</body>
</html>
